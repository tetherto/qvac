[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tetherto-qvac-sdk"
# Version tracks @qvac/sdk (not an independent number) so a given python-sdk
# release makes plain which SDK it speaks: scripts/version.py reads it from
# packages/sdk/package.json.
dynamic = ["version"]
description = "Generated Python client for the QVAC SDK worker RPC"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.7,<3",
  "bare-rpc~=0.3.0",
  "bare-sidecar~=0.1.3",
  "bare-stow-host~=0.2.1",
]

[tool.hatch.version]
source = "code"
path = "scripts/version.py"
expression = "VERSION"

[project.optional-dependencies]
gen = ["datamodel-code-generator==0.68.0", "black==26.5.1", "ruff==0.15.21"]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.21",
  "mypy==2.3.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "pandas-stubs>=2.2",
]
# VLA tensor marshaling (tetherto.qvac_sdk.vla): numpy-backed base64 codecs +
# image preprocessing.
vla = ["numpy>=1.26"]
# tetherto.qvac_sdk.notebook: the synchronous SyncClient facade with numpy/pandas
# inputs and outputs (IPython, when present, upgrades live streaming
# display from stdout to in-cell updates).
notebook = ["numpy>=1.26", "pandas>=2.2"]
# Third-party stores a few examples talk to, mirroring the devDependencies the
# TypeScript examples use for the same pages. Not needed by the client itself:
# every example that reaches for one guards the lookup and names this install.
examples = ["pymongo>=4.13", "sqliteai-vector>=1.1"]
# scripts/build_wheel.py: the self-contained per-platform wheel build.
release = ["build>=1.2"]

[tool.hatch.build.targets.wheel]
# PEP 420 namespace package: ship the whole `tetherto/` tree (no
# tetherto/__init__.py) so `tetherto.qvac_sdk` installs under the shared root.
packages = ["src/tetherto"]
# The generated client and the staged worker bundle are gitignored;
# artifacts overrides hatchling's VCS-ignore exclusion so the wheel carries
# them. The worker bundle is absent from the thin wheel.
artifacts = [
  "src/tetherto/qvac_sdk/_generated/**",
  "src/tetherto/qvac_sdk/_worker/**",
]

[tool.hatch.build.targets.sdist]
artifacts = ["src/tetherto/qvac_sdk/_generated/**"]

# hatch_build.py refuses to build without a current generated client, and stamps a
# `py3-none-<plat>` tag on the fat (bundled) wheel when QVAC_WHEEL_PLAT is set
# by scripts/build_wheel.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
markers = [
  "heavy: real-worker tests using large or specialized models (parakeet, BCI, VLA). Excluded from the fast CI leg (pytest -m 'not heavy'); run in the broader cross-platform e2e that restores the shared model cache.",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# black owns line-wrapping; E501 only fires on lines black leaves long
# because splitting them would be wrong (e.g. a single string literal),
# so it's pure noise on top of an already-formatted codebase.
ignore = ["E501"]

[tool.ruff.lint.isort]
# Pin tetherto as first-party: the generator sorts imports in a temp dir, where
# ruff's first-party heuristic would otherwise classify the
# `tetherto.qvac_sdk._generated_base` import as third-party.
known-first-party = ["tetherto"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tetherto.qvac_sdk._generated.models._internal"
# JSON Schema can only express a default as a bare value (e.g.
# `"default": "diffusion"`); datamodel-code-generator carries that
# straight through as a plain str literal even when the field's type is
# an enum, so mypy sees `field: SomeEnum | None = "diffusion"` as a
# genuine mismatch. It's not one at runtime: the generated base module sets
# validate_default=True, so pydantic coerces the literal into the right
# enum member on construction (verified: `Model().field == SomeEnum.x`
# is True). Scoped to this one generated module, not project-wide.
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = ["pymongo", "pymongo.*"]
ignore_missing_imports = true
