[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qvac"
version = "0.1.0"
description = "Generated Python client for the QVAC SDK worker RPC"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
gen = ["datamodel-code-generator==0.68.0", "black==26.5.1"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/qvac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
