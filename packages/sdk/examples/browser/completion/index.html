<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Completion · QVAC browser</title>
    <link rel="stylesheet" href="../shared/style.css" />
  </head>
  <body>
    <main>
      <nav><a href="../">← All examples</a></nav>
      <header>
        <div>
          <p class="eyebrow">QVAC SDK in the browser</p>
          <h1>Completion</h1>
        </div>
        <span id="readiness" class="status pending">Checking WebGPU…</span>
      </header>

      <section>
        <h2>1. Load a model</h2>
        <label for="model-url">GGUF URL</label>
        <input id="model-url" type="url" />
        <label for="model-files">Or a local GGUF file</label>
        <input id="model-files" type="file" accept=".gguf" />
        <div class="row">
          <button id="load">Load model</button>
          <button id="unload" class="secondary" disabled>Unload</button>
        </div>
        <p id="load-status" class="detail"></p>
      </section>

      <section>
        <h2>2. Run a completion</h2>
        <label for="prompt">Prompt</label>
        <textarea id="prompt" rows="3">Name three uses of WebGPU in one sentence each.</textarea>
        <div class="columns">
          <div>
            <label for="temp">Temperature</label>
            <input id="temp" type="number" min="0" max="2" step="0.1" value="0.7" />
          </div>
          <div>
            <label for="predict">Max new tokens</label>
            <input id="predict" type="number" min="1" max="2048" value="256" />
          </div>
          <div>
            <label for="seed">Seed</label>
            <input id="seed" type="number" value="42" />
          </div>
        </div>
        <button id="run" disabled>Run completion</button>
        <pre id="output"></pre>
        <pre id="stats"></pre>
      </section>

      <section>
        <h2>Log</h2>
        <pre id="log"></pre>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
