<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multimodal · QVAC browser</title>
    <link rel="stylesheet" href="../shared/style.css" />
  </head>
  <body>
    <main>
      <nav><a href="../">← All examples</a></nav>
      <header>
        <div>
          <p class="eyebrow">QVAC SDK in the browser</p>
          <h1>Multimodal</h1>
        </div>
        <span id="readiness" class="status pending">Checking WebGPU…</span>
      </header>

      <section>
        <h2>1. Load a model</h2>
        <label for="model-url">GGUF URL</label>
        <input id="model-url" type="url" />
        <label for="model-files">Or a local GGUF file</label>
        <input id="model-files" type="file" accept=".gguf" />
        <label for="projection-url">Projection model (mmproj) URL</label>
        <input id="projection-url" type="url" />
        <label for="projection-files">Or a local projection GGUF</label>
        <input id="projection-files" type="file" accept=".gguf" />
        <div class="row">
          <button id="load">Load model</button>
          <button id="unload" class="secondary" disabled>Unload</button>
        </div>
        <p class="detail"></p>
        <p id="load-status" class="detail"></p>
      </section>

      <section>
        <h2>2. Ask about an image</h2>
        <label for="image">Image</label>
        <input id="image" type="file" accept="image/*" />
        <label for="prompt">Prompt</label>
        <textarea id="prompt" rows="2">Describe this image in two sentences.</textarea>
        <button id="run" disabled>Run</button>
        <pre id="output"></pre>
        <pre id="stats"></pre>
      </section>

      <section>
        <h2>Log</h2>
        <pre id="log"></pre>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
