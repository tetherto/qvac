name: CPP Tests (Embed)

on:
  workflow_call:
    inputs:
      ref:
        description: "ref"
        type: string
        required: false
      repository:
        type: string
        required: false
      workdir:
        description: "Working directory"
        type: string
        required: false
        default: "packages/embed-llamacpp"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to test"
        type: string
        required: false
        default: "main"
      workdir:
        description: "Working directory"
        type: string
        required: false
        default: "packages/embed-llamacpp"

# The group is spelled out rather than using github.workflow, which in a called
# workflow resolves to the CALLER's name -- that would collide with the caller's
# own group and with the on-merge cache workflow's. Not keyed on github.ref alone
# either: under pull_request_target that is the base branch, so every in-flight PR
# would share one group. PR number keeps them independent; github.ref serialises
# the events that write the cache.
concurrency:
  group: cpp-tests-embed-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  run-cpp-tests:
    needs: runner_names
    runs-on: ${{ matrix.runner || matrix.os }}
    # Bounds a cold-cache run; warm legs are far under this.
    timeout-minutes: 120
    environment: release
    name: ${{ matrix.platform }}-${{ matrix.arch || 'x64' }}-cpp-tests
    permissions:
      contents: read
      packages: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            runner: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64 }}
          - os: macos-14
            platform: darwin
            arch: arm64
            runner: ${{ needs.runner_names.outputs.macos_arm64_gpu }}
          - os: macos-15-intel
            runner: ${{ needs.runner_names.outputs.macos_15_intel }}
            platform: darwin
            arch: x64
          - os: windows-2025
            platform: windows
            arch: x64
            runner: ${{ needs.runner_names.outputs.win_2025_x64 }}

    env:
      WORKDIR: ${{ inputs.workdir }}
      GIT_TERMINAL_PROMPT: "0"

    steps:
      - name: Echo workflow inputs
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref || github.ref }}
          INPUT_REPO: ${{ inputs.repository || github.repository }}
          INPUT_WORKDIR: ${{ env.WORKDIR }}
        run: |
          echo "ref=$INPUT_REF"
          echo "repository=$INPUT_REPO"
          echo "workdir=$INPUT_WORKDIR"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install NPM dependencies
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          npm install
      
      - name: Install bare tooling
        run: npm install -g --force bare bare-make


      - if: ${{ matrix.os == 'windows-2025' }}
        name: Set Vulkan SDK Path on Windows Server 2025
        working-directory: ${{ env.WORKDIR }}
        run: echo "VULKAN_SDK=C:\VulkanSDK" >> $Env:GITHUB_ENV

      - name: Setup vcpkg
        uses: tetherto/qvac/.github/actions/setup-vcpkg@10ae9f571c61ad94348ebbe8daaef67641ae8855
        env:
          MODEL_S3_BUCKET: ${{ secrets.MODEL_S3_BUCKET }}
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}

      # Must come after setup-vcpkg, which writes this same variable to
      # $GITHUB_ENV and would otherwise win. `clear;` drops its S3 source, which
      # this job has no credentials for; MODEL_S3_BUCKET above is still required
      # by setup-vcpkg's own validation.
      - name: Point vcpkg at the cached binary directory
        if: ${{ matrix.os != 'windows-2025' }}
        shell: bash
        run: |
          set -euo pipefail
          # $WORKDIR reaches $GITHUB_ENV unescaped, so a newline in it would
          # inject further variables. setup-vcpkg guards its own inputs the same way.
          if [[ ! "$WORKDIR" =~ ^packages/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::unexpected workdir: $WORKDIR"
            exit 1
          fi
          echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/$WORKDIR/vcpkg/cache,readwrite" >> "$GITHUB_ENV"

      # Native path required: a mixed-separator path resolves elsewhere and
      # vcpkg silently finds nothing.
      - name: Point vcpkg at the cached binary directory (Windows)
        if: ${{ matrix.os == 'windows-2025' }}
        shell: powershell
        run: |
          if ($env:WORKDIR -notmatch '^packages/[A-Za-z0-9._-]+$') {
            Write-Output "::error::unexpected workdir: $env:WORKDIR"
            exit 1
          }
          $cacheDir = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE (Join-Path $env:WORKDIR 'vcpkg/cache')))
          echo "VCPKG_BINARY_SOURCES=clear;files,$cacheDir,readwrite" >> $env:GITHUB_ENV

      - name: Cleanup vcpkg
        shell: bash
        run: |
          rm -rf $VCPKG_ROOT/buildtrees/*
          rm -rf $VCPKG_ROOT/packages/*

      - if: ${{ matrix.os == 'windows-2025' }}
        name: Configure CMake generator on Windows
        shell: powershell
        run: |
          echo "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV
          echo "CMAKE_GENERATOR_PLATFORM=x64" >> $env:GITHUB_ENV

      - name: Create vcpkg cache location (package-local)
        shell: bash
        run: mkdir -p "${{ env.WORKDIR }}/vcpkg/cache"

      # This job runs PR-head code, so only trusted events may write the shared
      # cache (.cursor/rules/devops/github-actions.mdc:82). No restore-keys: a
      # prefix match would re-save the previous entry's archives and grow without
      # bound. The key covers the manifests, the package's own ports overlay and
      # the shared vcpkg overlays, but not the runner image's compiler: a
      # toolchain bump there gives an exact hit whose contents all miss, and
      # actions/cache skips the save on an exact hit -- bump `v6` to recover.
      - name: Get vcpkg cache (restore + save, trusted contexts)
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'merge_group' ||
          github.event_name == 'schedule'
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          key: >-
            cpp-tests-v6-embed-${{ matrix.platform }}-${{ matrix.arch || 'x64' }}-${{
              hashFiles(
                format('{0}/vcpkg.json', inputs.workdir),
                format('{0}/vcpkg-configuration.json', inputs.workdir),
                format('{0}/vcpkg/ports/**', inputs.workdir),
                'vcpkg-overlays/triplets/**',
                'vcpkg-overlays/toolchains/**'
              )
            }}
          path: ${{ env.WORKDIR }}/vcpkg/cache

      - name: Get vcpkg cache (restore-only, untrusted contexts)
        if: >-
          github.event_name != 'push' &&
          github.event_name != 'workflow_dispatch' &&
          github.event_name != 'merge_group' &&
          github.event_name != 'schedule'
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          key: >-
            cpp-tests-v6-embed-${{ matrix.platform }}-${{ matrix.arch || 'x64' }}-${{
              hashFiles(
                format('{0}/vcpkg.json', inputs.workdir),
                format('{0}/vcpkg-configuration.json', inputs.workdir),
                format('{0}/vcpkg/ports/**', inputs.workdir),
                'vcpkg-overlays/triplets/**',
                'vcpkg-overlays/toolchains/**'
              )
            }}
          path: ${{ env.WORKDIR }}/vcpkg/cache

      - name: Cache C++ test models
        id: model-cache
        if: startsWith(matrix.runner, 'qvac-')
        uses: ./.github/actions/cache-models
        with:
          package: embed-llamacpp
          paths: packages/embed-llamacpp/models/unit-test
          hash-files-glob: .github/workflows/cpp-tests-embed.yml
          # The C++ unit tests load none of the integration models.
          warm: 'false'

      - name: Download test models (into package dir)
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ env.WORKDIR }}/models/unit-test"
          echo "Downloading model from Hugging Face..."
          curl -L --fail --retry 3 --retry-all-errors --retry-delay 2 \
            -o "${{ env.WORKDIR }}/models/unit-test/test-model.gguf" \
            "https://huggingface.co/unsloth/embeddinggemma-300m-GGUF/resolve/main/embeddinggemma-300M-Q8_0.gguf"
          ls -lh "${{ env.WORKDIR }}/models/unit-test/"
          du -sh "${{ env.WORKDIR }}/models/unit-test/test-model.gguf"

      - if: ${{ matrix.platform == 'darwin' }}
        name: Use Apple clang for Apple platform builds
        run: |
          sudo mv /opt/homebrew/opt/llvm@18 /opt/homebrew/opt/llvm@18.bak 2>/dev/null || true
          sudo mv /opt/homebrew/opt/llvm /opt/homebrew/opt/llvm.bak 2>/dev/null || true
          sudo rm -f /opt/homebrew/bin/clang /opt/homebrew/bin/clang++ 2>/dev/null || true

      - name: Build C++ tests with coverage
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: npm run coverage:cpp:build

      - name: Build C++ tests
        if: ${{ matrix.os != 'ubuntu-24.04' }}
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: npm run test:cpp:build

      - name: Run C++ tests
        id: cpp-tests
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/${{ env.WORKDIR }}/.lsan-suppressions.txt
        run: |
          set -euo pipefail

          if [ ! -f "build/test/unit/addon-test" ]; then
            echo "ERROR: Test executable not found at ${PWD}/build/test/unit/addon-test"
            exit 1
          fi

          cd build/test/unit/
          ./addon-test --gtest_output=xml:cpp-test-results.xml

          if [ -f cpp-test-results.xml ]; then
            test_count=$(grep -c '<testcase' cpp-test-results.xml || echo "0")
            if [ "$test_count" -eq 0 ]; then
              echo "ERROR: No tests were executed! Test count: $test_count"
              exit 1
            fi
            echo "✓ Successfully executed $test_count test(s)"
          else
            echo "ERROR: Test results file not generated"
            exit 1
          fi

      - name: Generate Coverage Report
        if: ${{ matrix.os == 'ubuntu-24.04' && always() && !cancelled() }}
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          npm run coverage:cpp:report
          COVERAGE=$(grep 'TOTAL' build/test/unit/coverage-summary.txt | awk '{print $10}' || echo "0.0")
          echo "LINE_COVERAGE_PERCENTAGE=${COVERAGE}" >> $GITHUB_ENV

      - name: Archive Coverage Results
        if: ${{ matrix.os == 'ubuntu-24.04' && always() && !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: cpp-coverage-report-${{ matrix.platform }}-${{ matrix.arch || 'x64' }}
          path: |
            ${{ env.WORKDIR }}/build/test/unit/coverage-html/
            ${{ env.WORKDIR }}/build/test/unit/lcov.info
            ${{ env.WORKDIR }}/build/test/unit/coverage-summary.txt
            ${{ env.WORKDIR }}/build/test/unit/cpp-test-results.xml
          retention-days: 30


      - name: Coverage Summary
        if: ${{ matrix.os == 'ubuntu-24.04' && always() && !cancelled() }}
        shell: bash
        run: |
          echo "## 🎯 C++ Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Coverage:** ${{ env.LINE_COVERAGE_PERCENTAGE }}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "${{ env.WORKDIR }}/build/test/unit/coverage-summary.txt" ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat "${{ env.WORKDIR }}/build/test/unit/coverage-summary.txt" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

