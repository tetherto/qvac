name: On Merge Model Cache (LLM)

# Seeds `models-llm-llamacpp-v1-*`. The integration workflow's only caller is
# pull_request_target, where cache-models takes its restore-only branch, so
# nothing else writes this entry.
#
# Does not call integration-test-llm-llamacpp.yml: that needs prebuilds and fans
# out to seven legs. cache-models' warm step fills the directory from Hugging
# Face, and stage-s3-models.mjs adds the S3-only entries the warmer skips, so the
# saved archive matches what the integration legs load.

on:
  push:
    branches:
      - main
    paths:
      - "packages/llm-llamacpp/test/integration/models.manifest.json"
      # cache-models resolves the cached path list through warm-models.mjs, and
      # that list is folded into the cache version -- an edit there can make the
      # entry unrestorable without the manifest changing at all. A run that
      # finds nothing moved costs seconds: the probe answers from a lookup.
      - ".github/actions/cache-models/**"
      # And this file. A commit that fixes the seed itself -- a corrected
      # cache-key-suffix, say -- would otherwise sit dormant until the cron.
      - ".github/workflows/on-merge-model-cache-llm.yml"
  # Every two days. The cache server prunes at CACHE_CLEANUP_OLDER_THAN_DAYS=5,
  # and Mon/Thu left a 4-day gap -- inside the window, but with no slack: ONE
  # failed run stretched it to 7 days and the entry was gone. `*/2` caps the gap
  # at 2 days, and at 4 after a missed run, so a single failure is survivable.
  # The hour is offset per addon so the seeds do not contend for a runner.
  schedule:
    - cron: "17 4 */2 * *"
  # No workflow_call. Nothing calls this, and a `pull_request` caller would put
  # the job on cache-models' trusted-save branch, letting PR-head code write an
  # entry every addon lane afterwards restores, next to live AWS credentials.
  # Dispatch covers on-demand runs.
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Restore the archive even on a hit, exactly as the cron does. That download is what resets the cache server's prune clock; the probe alone does not."
        type: boolean
        default: false

# A cancelled job cannot save the ~19 GB archive it did not finish uploading.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  seed:
    needs: runner_names
    # Self-hosted: the entry is ~19 GB, over GitHub's per-repo cache limit, and
    # only these runners reach the cache server holding it. Non-GPU on purpose.
    runs-on: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64 }}
    # AWS_OIDC_ROLE_ARN's trust policy is scoped to this environment.
    environment: release
    timeout-minutes: 300
    name: seed-model-cache
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      # Inputs must stay identical to integration-test-llm-llamacpp.yml's call.
      # The key comes from the package name and manifest hash, the cache version
      # from the resolved path list -- anything extra here writes an entry the
      # integration legs cannot restore.
      - name: Seed integration test models
        id: model-cache
        uses: ./.github/actions/cache-models
        with:
          package: llm-llamacpp
          seed-probe: 'true'
          force-refresh: ${{ inputs.force_refresh || false }}

      # Gated: actions/cache skips the save on an exact hit, so a copy then is wasted.
      - name: Configure AWS credentials via OIDC
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # 6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Stage S3-hosted test models
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: packages/llm-llamacpp
        env:
          MODEL_S3_BUCKET: ${{ secrets.MODEL_S3_BUCKET }}
        run: node scripts/stage-s3-models.mjs

  # actions/cache only WARNS when the cache server rejects a reservation, so the
  # seed job above reports success whether or not an entry was written. This
  # turns that into a red run. It has to be a separate job: the save runs in the
  # seed job's post-steps, after every step there has finished.
  verify:
    needs: [runner_names, seed]
    # Not the default `success()`. The seed matrices are fail-fast: false, so one
    # leg failing for an unrelated reason would skip this job outright -- and the
    # silent write failure it exists to catch would go unreported on every other
    # leg. Each leg asserts its own entry, so a genuinely failed seed leg just
    # fails here too. runner_names is still required: without its outputs there
    # is no runs-on.
    if: ${{ !cancelled() && needs.runner_names.result == 'success' }}
    # No id-token: nothing here talks to AWS; the lookup needs the
    # repository and nothing else.
    permissions:
      contents: read
    runs-on: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64 }}
    timeout-minutes: 15
    name: verify-model-cache

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      # Inputs must stay identical to the seed step's: `path` feeds the cache
      # version, so a different one silently probes a different entry.
      - name: Assert the seeded entry exists
        uses: ./.github/actions/cache-models
        with:
          package: llm-llamacpp
          assert-exists: 'true'
