name: On PR Trigger (Stable Diffusion)

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/lib-infer-diffusion/**"
      - ".github/workflows/*diffusion*.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  PKG_DIR: packages/lib-infer-diffusion

jobs:
  # ---------------------------------------------------------------------------
  # 1. Security Gate
  # ---------------------------------------------------------------------------
  authorize:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      has_write: ${{ steps.perm.outputs.has-permission }}
    steps:
      - name: Check actor write permission
        id: perm
        uses: scherermichael-oss/action-has-permission@136e061bfe093832d87f090dd768e14e27a740d3 # 1.0.6
        with:
          required-permission: write
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check authorization
        id: check
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'verify') }}
          HAS_WRITE: ${{ steps.perm.outputs.has-permission }}
        run: |
          # Allow manual dispatches and calls
          if [[ "$EVENT" == "workflow_dispatch" || "$EVENT" == "workflow_call" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Same-repo PRs are always trusted
          if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            echo "::notice::Same-repo PR — authorized"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::Actor '$GITHUB_ACTOR' has write-or-higher permission: $HAS_WRITE"

          # Actor with write (or higher) is trusted even when author_association is not MEMBER/COLLABORATOR.
          if [ "$HAS_WRITE" = "1" ]; then
            echo "::notice::Actor has write-or-higher permission — authorized"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Org members / collaborators (by author_association) are trusted even from forks
          if [[ "$AUTHOR_ASSOC" =~ ^(MEMBER|OWNER|COLLABORATOR)$ ]]; then
            echo "::notice::Trusted author ($AUTHOR_ASSOC) — authorized"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # External fork PRs require the verify label
          if [ "$HAS_LABEL" = "true" ]; then
            echo "::notice::Fork PR with verify label — authorized"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::External fork PR without verify label — skipping checks"
            echo "::warning::A team member must review the code and apply the 'verify' label"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Strip verify label on new pushes from external contributors.
  # Forces re-review before CI runs on updated code.
  # Event actors with repo write permission are not stripped (from authorize output).
  # ---------------------------------------------------------------------------
  strip-label:
    needs: authorize
    if: |
      needs.authorize.outputs.has_write != '1' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Log actor write permission check
        shell: bash
        run: |
          echo "::notice::Actor '${{ github.actor }}' has write-or-higher permission: ${{ needs.authorize.outputs.has_write }}"
      - name: Remove verify label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels/verify" \
            2>/dev/null || true
          echo "::warning::Removed verify label — new commits pushed. Re-review required."

  # ---------------------------------------------------------------------------
  # 3. Execution Jobs (Now gated by authorization)
  # ---------------------------------------------------------------------------
  sanity-checks:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Run Sanity checks
        uses: tetherto/qvac-devops/.github/actions/sanity-checks@monorepo_update
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          pat-token: ${{ secrets.PAT_TOKEN }}
          run-integration: true
          workdir: packages/lib-infer-diffusion

  cpp-tests:
    needs: [authorize, sanity-checks]
    if: needs.authorize.outputs.allowed == 'true'
    uses: ./.github/workflows/cpp-tests-diffusion.yml
    secrets: inherit
    with:
      workdir: packages/lib-infer-diffusion
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}

  cpp-lint:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    uses: tetherto/qvac-devops/.github/workflows/cpp-lint.yaml@monorepo_update
    secrets: inherit
    with:
      sha: ${{ github.event.pull_request.base.sha }}
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      workdir: packages/lib-infer-diffusion

  ts-checks:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 20

      - name: Configure npm auth
        working-directory: packages/lib-infer-diffusion
        run: |
          cat > .npmrc <<NPMRC
          registry=https://registry.npmjs.org/
          @qvac:registry=https://registry.npmjs.org/
          //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}
          NPMRC

      - name: Install dependencies
        working-directory: packages/lib-infer-diffusion
        run: npm install

      - name: Type declaration check
        working-directory: packages/lib-infer-diffusion
        run: npm run test:dts

  prebuild:
    needs: [authorize, sanity-checks]
    if: needs.authorize.outputs.allowed == 'true'
    permissions:
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/prebuilds-lib-infer-diffusion.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}
      publish_target: "gpr"
      tag: pr-${{ github.event.pull_request.number }}

  run-integration-tests:
    needs: [authorize, prebuild]
    if: needs.authorize.outputs.allowed == 'true'
    uses: ./.github/workflows/integration-test-lib-infer-diffusion.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}

  run-mobile-integration-tests:
    needs: [authorize, prebuild]
    if: needs.authorize.outputs.allowed == 'true'
    uses: ./.github/workflows/integration-mobile-test-lib-infer-diffusion.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}

  merge-guard:
    needs:
      - run-integration-tests
      - run-mobile-integration-tests
      - sanity-checks
      - prebuild
      - cpp-tests
      - cpp-lint
      - ts-checks
    if: always()
    uses: tetherto/qvac-devops/.github/workflows/public-pr.yml@monorepo_update
    with:
      sanity-checks-status: ${{ needs.sanity-checks.result == 'success' || needs.sanity-checks.result == 'skipped' }}
      build-status: ${{ needs.prebuild.result == 'success' || needs.prebuild.result == 'skipped' }}
    secrets: inherit