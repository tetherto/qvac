name: On Merge Trigger (NMTCPP)

on:
  push:
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/translation-nmtcpp/**"
      - ".github/workflows/*nmtcpp*.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "GPR tag override (optional)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - dev
          - feature
          - temp
          - latest
      npm_tag:
        description: "NPM dist-tag (default: latest). e.g. release-1.x"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: read
  packages: read
  id-token: write

jobs:
  publish-logic:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      publish_main: ${{ steps.logic.outputs.publish_main }}
      publish_release: ${{ steps.logic.outputs.publish_release }}
      publish_feature: ${{ steps.logic.outputs.publish_feature }}
      publish_tmp: ${{ steps.logic.outputs.publish_tmp }}
      gpr_tag: ${{ steps.logic.outputs.gpr_tag }}
    steps:
      - id: logic
        uses: tetherto/qvac-actions/npm-publish-logic@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0

  release-merge-guard:
    name: Release Merge Guard
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref_name, 'release-'))
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-merge-guard
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: ${{ github.ref_name }}
          base-sha: ${{ github.event.before }}
          head-sha: ${{ github.sha }}
          package-slug: translation-nmtcpp
          package-json-path: packages/translation-nmtcpp/package.json
          changelog-path: packages/translation-nmtcpp/CHANGELOG.md

  build:
    needs:
      - publish-logic
      - release-merge-guard
    if: >-
      (!cancelled() && ( needs.publish-logic.outputs.publish_main == 'true' || needs.publish-logic.outputs.publish_feature == 'true' || needs.publish-logic.outputs.publish_tmp == 'true' || ( needs.publish-logic.outputs.publish_release == 'true' && needs.release-merge-guard.result == 'success' ) ))
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/prebuilds-translation-nmtcpp.yml
    secrets: inherit

  verify-generated:
    permissions:
      contents: read
    uses: ./.github/workflows/verify-generated-wrappers.yml
    with:
      workdir: packages/translation-nmtcpp

  publish-gpr:
    needs: [build, publish-logic, verify-generated]
    # `!cancelled()` is required, not cosmetic. `build` depends on
    # release-merge-guard, which is SKIPPED on every non-release-* branch;
    # `build` survives that because its own `if` opens with `!cancelled()`, but
    # without the same opt-out here GitHub's skip propagation reaches this job
    # through `build` and it never runs. That is why
    # @tetherto/translation-nmtcpp-mono has been frozen at 2026-06-30
    # (QVAC-24365).
    #
    # `!cancelled()` alone would also disable the implicit "all needs succeeded"
    # check and let a FAILED build publish stale or missing prebuilds, so the
    # explicit needs.build.result test replaces that guarantee. Same shape as
    # publish-npm below, which already had it and therefore was never affected.
    if: >-
      needs.verify-generated.result == 'success' &&
      ((!cancelled() && needs.build.result == 'success' && (needs.publish-logic.outputs.publish_main == 'true' || needs.publish-logic.outputs.publish_feature == 'true' || needs.publish-logic.outputs.publish_tmp == 'true')))
    continue-on-error: true
    outputs:
      published_version: ${{ steps.publish.outputs.gpr_published_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PKG_DIR: packages/translation-nmtcpp
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Download prebuild artifacts into package dir
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: prebuilds
          path: ${{ env.PKG_DIR }}/prebuilds

      # Rebuild the TypeScript wrapper before publishing so the generated
      # JavaScript and declaration files are present in the published tarball.
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 20

      - name: Publish to GitHub Package Registry
        id: publish
        uses: ./.github/actions/publish-library-to-gpr
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag || needs.publish-logic.outputs.gpr_tag }}
          workdir: ${{ env.PKG_DIR }}
          name-suffix: "-mono"

  publish-npm:
    needs:
      - build
      - publish-logic
      - release-merge-guard
      - verify-generated
    if: >-
      needs.verify-generated.result == 'success' &&
      ((!cancelled() && needs.build.result == 'success' && needs.publish-logic.outputs.publish_release == 'true' && (needs.release-merge-guard.result == 'success' || needs.release-merge-guard.result == 'skipped')))
    continue-on-error: false
    outputs:
      published_version: ${{ steps.publish.outputs.npm_published_version }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      PKG_DIR: packages/translation-nmtcpp
    steps:
      - name: Validate npm_tag input
        if: inputs.npm_tag != ''
        shell: bash
        run: |
          tag="${{ inputs.npm_tag }}"
          if ! echo "$tag" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'; then
            echo "::error::Invalid npm dist-tag '$tag'. Must match ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ (e.g. release-1.x)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Download prebuild artifacts into package dir
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: prebuilds
          path: ${{ env.PKG_DIR }}/prebuilds

      # Rebuild the TypeScript wrapper before publishing so the generated
      # JavaScript and declaration files are present in the published tarball.
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 20

      - name: Determine dist-tag
        id: dist-tag
        uses: tetherto/qvac-actions/npm-dist-tag-determination@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
        with:
          workdir: ${{ env.PKG_DIR }}
          tag: ${{ inputs.npm_tag }}

      - name: Publish to NPM Package Registry
        id: publish
        uses: tetherto/qvac-actions/publish-library-to-npm@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
        with:
          tag: ${{ steps.dist-tag.outputs.tag }}
          workdir: ${{ env.PKG_DIR }}

  # Tag the published version (no GitHub Release; SDK-only releases policy).
  # Preserves the historical bare "v<version>" tag scheme for this package.
  create-tag:
    needs: [publish-npm]
    if: |
      !cancelled() &&
      needs.publish-npm.result == 'success' &&
      needs.publish-npm.outputs.published_version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/create-release-tag.yml
    with:
      published_version: ${{ needs.publish-npm.outputs.published_version }}
      tag_name: v${{ needs.publish-npm.outputs.published_version }}

  post-build-gate:
    name: Post-Build Gate
    runs-on: ubuntu-latest
    needs: [publish-gpr, publish-npm]
    if: "!cancelled()"
    outputs:
      should_run_tests: ${{ steps.gate.outputs.should_run_tests }}
    steps:
      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          should="false"

          # Deliberately keyed on publish-npm ONLY, not publish-gpr.
          #
          # Publishing a GPR dev build is not a reason to re-run integration
          # tests: they already ran on the PR, and the PR's merge-guard consumes
          # their result as `integration-tests-status` before the merge is
          # allowed (see on-pr-<addon>.yml). Re-running the same 6-leg
          # GPU/Windows/macOS matrix on merge duplicates that for no new signal.
          #
          # NOTE, so nobody mistakes this for a live cost saving: the
          # integration-tests job below cannot currently run on merge at all,
          # whatever this gate decides. It is `needs: [post-build-gate]` with no
          # !cancelled()/always(), and post-build-gate needs both publish-gpr and
          # publish-npm — exactly one of which is skipped on any given branch. So
          # the skip propagates through this (successful) gate and into the
          # consumer, the same transitive mechanism QVAC-24365 fixed one level up.
          # Observed both ways round: tts-ggml run 33366149312 on main
          # (publish-gpr success, gate true) and ocr-ggml run 32745082430 on
          # release-* (publish-npm success, gate true) both left
          # integration-tests skipped.
          #
          # This keying is therefore forward-looking protection: it is what keeps
          # the matrix off merge once that consumer is given its own status
          # function. Fixing the consumer is deliberately NOT part of QVAC-24365 —
          # it affects five workflows and wants its own ticket.
          if [ "${{ needs.publish-npm.result }}" = "success" ]; then
            should="true"
          fi

          echo "publish-gpr=${{ needs.publish-gpr.result }} publish-npm=${{ needs.publish-npm.result }} should_run_tests=$should"
          echo "should_run_tests=$should" >> "$GITHUB_OUTPUT"

  integration-tests:
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/integration-test-translation-nmtcpp.yml
    needs:
      - post-build-gate
    if: (needs.post-build-gate.outputs.should_run_tests == 'true')
    secrets: inherit
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.sha }}
