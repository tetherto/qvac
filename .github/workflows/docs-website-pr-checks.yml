name: Docs Website PR Checks

on:
  pull_request:
    paths:
      - 'docs/website/**'
    branches:
      - main
  workflow_dispatch:




# Canonical runner labels — .github/actions/runner-names/runners.yaml
env:
  RN_ORCH: ubuntu-latest
  RN_U22: ubuntu-22.04
  RN_U24: ubuntu-24.04
  RN_U22_ARM: ubuntu-22.04-arm
  RN_U24_ARM: ubuntu-24.04-arm
  RN_MAC14: macos-14
  RN_MAC14_XL: macos-14-xlarge
  RN_MAC15: macos-15
  RN_MAC15_INTEL: macos-15-intel
  RN_MAC15_LG: macos-15-large
  RN_MAC15_XL: macos-15-xlarge
  RN_WIN22: windows-2022
  RN_WIN25: windows-2025
  RN_QVAC_U22: qvac-ubuntu2204-x64
  RN_QVAC_U22_GPU: qvac-ubuntu2204-x64-gpu
  RN_QVAC_U24: qvac-ubuntu2404-x64
  RN_QVAC_U24_GPU: qvac-ubuntu2404-x64-gpu
  RN_QVAC_WIN25: qvac-win25-x64
  RN_QVAC_WIN25_GPU: qvac-win25-x64-gpu
  RN_AI_LINUX: ai-run-linux
  RN_AI_LINUX_GPU: ai-run-linux-gpu
  RN_AI_U22: ai-run-ubuntu-22.04
  RN_AI_WIN11_GPU: ai-run-windows11-gpu
  RN_GEN_WIN11: generator-windows11
  RN_MINI_M4: mac-mini-m4
  RN_MINI_M4_GPU: mac-mini-m4-gpu
  RN_LBL_U22_X64: ubuntu-22.04-x64
  RN_LBL_U22_X64_GPU: ubuntu-22.04-x64-gpu
  RN_LBL_U24_X64: ubuntu-24.04-x64
  RN_LBL_U24_X64_GPU: ubuntu-24.04-x64-gpu
  RN_LBL_U24_ARM64: ubuntu-24.04-arm64
  RN_LBL_WIN22_X64: windows-2022-x64
  RN_LBL_WIN25_X64: windows-2025-x64
  RN_LBL_WIN25_X64_GPU: windows-2025-x64-gpu

permissions:
  contents: read

concurrency:
  group: docs-website-pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: docs/website

jobs:
  build:
    name: Build
    runs-on: ${{ env.RN_ORCH }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # 2.2.0
        with:
          # Pinned (vs `latest`) so a compromised Bun release can't be picked
          # up automatically on the next CI run, including for fork PRs.
          # Keep in sync with the `bun: ^1.3.11` devDep in docs/website/package.json.
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Build and validate
        # The API summary `index.mdx` (and its older-version siblings) lives
        # at `content/docs/reference/api/`. It is committed to the repo and
        # refreshed by the `Docs Release` workflow on SDK release pushes,
        # so every PR checkout already has it on disk — no placeholder
        # step is needed here. (The historical placeholder targeted the
        # legacy `content/docs/sdk/api/` path, which the build never read.)
        run: bun run build

      - name: Run docs tests
        run: bun run vitest run --exclude '**/tsdoc-completeness*'

      - name: Install SDK dependencies
        id: sdk-install
        continue-on-error: true
        run: bun install
        working-directory: packages/sdk

      - name: TSDoc completeness audit (warning mode)
        if: steps.sdk-install.outcome == 'success'
        continue-on-error: true
        env:
          SDK_PATH: ${{ github.workspace }}/packages/sdk
        run: bun run vitest run tests/tsdoc-completeness.test.ts
