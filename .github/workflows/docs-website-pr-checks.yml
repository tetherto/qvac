name: Docs Website PR Checks

# Checks every pull request that changes what the documentation site renders:
# the site itself, a package's documentation root, the examples pages import,
# and the contracts the reference renders from.
#
# A pull request into main builds main's site with every unreleased line
# materialized as `preview` (`--include-dev`), so the package documentation it
# changes renders. A pull request into a release branch corrects a released
# line: main's site builds with that line overridden by the pull request's
# checkout (`--override`, scripts/release-preview-flags.ts), so the
# correction renders where it will be published once its pin moves.

on:
  pull_request:
    paths:
      - 'docs/website/**'
      - 'packages/*/docs/users/**'
      - 'packages/*/examples/**'
      - 'packages/*/contract/**'
      - '.github/workflows/docs-website-pr-checks.yml'
    branches:
      - main
      - release-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-website-pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: docs/website

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve what to preview
        id: target
        working-directory: .
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF:-}" ] || [ "$BASE_REF" = "main" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [[ "$BASE_REF" =~ ^release-train-([a-z0-9][a-z0-9-]*)-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            { echo "release=true"; echo "train=${BASH_REMATCH[1]}"; } >> "$GITHUB_OUTPUT"
          elif [[ "$BASE_REF" =~ ^release-([a-z0-9][a-z0-9-]*)-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            { echo "release=true"; echo "package=${BASH_REMATCH[1]}"; } >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # Into main: the pull request's own tree. Into a release branch: main's
      # site, with the pull request checked out beside it under `pr/`.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ steps.target.outputs.release == 'true' && 'main' || '' }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        if: steps.target.outputs.release == 'true'
        with:
          path: pr

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # 2.2.0
        with:
          # Pinned (vs `latest`) so a compromised Bun release can't be picked
          # up automatically on the next CI run, including for fork PRs.
          # Keep in sync with the `bun: ^1.3.11` devDep in docs/website/package.json.
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Choose the materializer flags
        id: flags
        shell: bash
        env:
          RELEASE: ${{ steps.target.outputs.release }}
          TRAIN: ${{ steps.target.outputs.train }}
          PACKAGE: ${{ steps.target.outputs.package }}
        run: |
          set -euo pipefail
          if [ "$RELEASE" != "true" ]; then
            echo "flags=--include-dev" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$TRAIN" ]; then
            slugs=$(node ../../.github/scripts/release-train.mjs slugs "$TRAIN")
          else
            slugs=$(jq -cn --arg p "$PACKAGE" '[$p]')
          fi
          mapfile -t args < <(echo "$slugs" | jq -r '.[] | "--package\n" + .')
          flags=$(bun run scripts/release-preview-flags.ts --checkout pr "${args[@]}")
          if [ -z "$flags" ]; then
            echo "::notice::No released line of this branch is pinned on main, so the build renders main's lines only."
          fi
          echo "flags=$flags" >> "$GITHUB_OUTPUT"

      - name: Build and validate
        env:
          DOCS_MATERIALIZE_FLAGS: ${{ steps.flags.outputs.flags }}
        run: bun run build

      - name: Run docs tests
        run: bun run vitest run

  bindings:
    # Reads the pull request's own tree: its pages, its generated data, and its
    # locks. Nothing here runs in the site build. Generated data is checked fresh against package source by each
    # package's own checks (the SDK pod's `docs_data`), which have the package's
    # dependencies installed; the Python surface needs none, so it is checked
    # here.
    name: Contract, bindings and generated data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # 2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      # A release branch cut before these checks existed has nothing to check.
      - name: Check the docs contract
        # A platform package missing a page its kind requires
        # (docs/website/contract/kinds.json), or an overview that links no product.
        if: hashFiles('docs/website/scripts/contract/check-contract.ts') != ''
        run: bun run docs:contract

      - name: Check bindings
        if: hashFiles('docs/website/scripts/bindings/check-bindings.ts') != ''
        # A page whose bound surface changed without a review, a removed
        # symbol, or a public symbol of a product that no page binds. Fix:
        # review the named pages, then `npm run docs:lock`.
        run: bun run docs:bindings

      - name: Check language parity of the SDK
        if: hashFiles('docs/website/scripts/bindings/check-bindings.ts') != ''
        run: bun run docs:sdk-parity

      - name: Check the Python surface is fresh
        if: hashFiles('docs/website/scripts/bindings/check-bindings.ts') != ''
        run: bun run docs:sdk-api --check --python-only

  in-place-lines:
    # Lines published before their software moved its documentation into its
    # package are still held in place under content/docs/<collection>/. Each
    # is a released version: correcting it is legitimate, documenting a new
    # feature there is not. Only a human can tell the two apart, so this
    # warns and never fails. The job goes once no versions file holds a line
    # in place.
    name: Lines held in place
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          # The diff needs both ends; the default depth of 1 has neither.
          fetch-depth: 0

      - name: Report edits to lines held in place
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        working-directory: .
        run: |
          set -euo pipefail

          if [ -z "${HEAD_SHA:-}" ]; then
            echo "Not a pull request; nothing to report."
            exit 0
          fi

          # The folders of every line still held in place, from the versions files.
          mapfile -t paths < <(jq -r '
            . as $file | .lines[] | select(.inPlace == true)
            | "docs/website/content/docs\($file.path)/"' docs/website/versions/*.json | sort -u)
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "No line is held in place."
            exit 0
          fi

          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          changed=$(git diff --name-only "$base" "$HEAD_SHA" -- "${paths[@]}" || true)

          if [ -z "$changed" ]; then
            echo "This PR edits no line held in place."
            exit 0
          fi

          echo "::warning::This PR edits documentation lines held in place, which are released versions. Correcting a release's pages is legitimate; documenting a new feature is not — that belongs in packages/<package>/docs/users/. If the correction also applies to the coming version, apply it there too."
          printf '%s\n' "$changed"
