name: CPP Tests (GGML Classification)

on:
  workflow_dispatch:
    inputs:
      workdir:
        description: "Working directory"
        type: string
        required: false
        default: "packages/classification-ggml"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        type: string
        required: false
      repository:
        description: "Repository to checkout"
        type: string
        required: false
      workdir:
        description: "Working directory"
        type: string
        required: false
        default: "packages/classification-ggml"

permissions:
  contents: read

jobs:
  test-cpp:
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            runner: qvac-ubuntu2404-x64
          - os: macos-15
            platform: darwin
            arch: arm64
            runner: qvac-macos26-arm64-gpu
          - os: windows-2025
            platform: win32
            arch: x64
            runner: qvac-win25-x64

    runs-on: ${{ matrix.runner || matrix.os }}
    environment: release
    name: cpp-tests-${{ matrix.platform }}-${{ matrix.arch }}

    env:
      WORKDIR: ${{ inputs.workdir }}

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Setup build host (github-hosted runners only)
        if: runner.environment == 'github-hosted'
        uses: tetherto/qvac/.github/actions/setup-build-host@6e8d3c306a462a58589396cda428d65e015f0d8b
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup AWS + Windows CLI
        uses: tetherto/qvac/.github/actions/setup-aws-prebuild@2e2c94d66a50c8b8851824314e343ede5297eb1f
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

      - if: matrix.platform == 'linux'
        name: Set Vulkan SDK Path on Linux
        shell: bash
        # classification-ggml builds the GGML_BACKEND_DL fabric (gpu-backends);
        # building the ggml-vulkan module from source needs the Vulkan SDK,
        # pre-installed on the self-hosted qvac runner at /opt/vulkansdk. (The
        # consumer-side find_dependency(Vulkan) is removed under DL by
        # qvac-fabric 8828.0.2#5, but the fabric's Vulkan build still needs it.)
        run: echo "VULKAN_SDK=/opt/vulkansdk/x86_64" >> $GITHUB_ENV

      - name: Setup vcpkg
        uses: tetherto/qvac/.github/actions/setup-vcpkg@98990f3d11736a1ae88feddc514d14d78d7abdc7
        env:
          MODEL_S3_BUCKET: ${{ secrets.MODEL_S3_BUCKET }}
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}

      - name: Cleanup vcpkg
        shell: bash
        run: |
          rm -rf $VCPKG_ROOT/buildtrees/*
          rm -rf $VCPKG_ROOT/packages/*

      - name: Setup Bare tooling
        uses: tetherto/qvac/.github/actions/setup-bare-tooling@8668ac46334eb595aa095c94b53322c557b1bc39
        with:
          shell_type: ${{ matrix.platform == 'win32' && 'powershell' || 'bash' }}

      - name: Setup Apple Clang
        if: ${{ matrix.platform == 'darwin' }}
        uses: tetherto/qvac/.github/actions/setup-apple-clang@6e8d3c306a462a58589396cda428d65e015f0d8b

      - name: Install npm dependencies
        working-directory: ${{ env.WORKDIR }}
        run: npm install --ignore-scripts

      # Non-Linux: unit tests only (fuzzing is Linux-only — libFuzzer + ASan,
      # matching the if(NOT WIN32) ASan gate). These use the vcpkg GoogleTest in
      # the default build/ tree.
      - name: Build C++ tests
        if: matrix.platform != 'linux'
        working-directory: ${{ env.WORKDIR }}
        run: npm run test:cpp:build

      - name: Run C++ tests
        if: matrix.platform != 'linux'
        working-directory: ${{ env.WORKDIR }}
        env:
          # addon-test links AddressSanitizer but dynamically loads the
          # non-ASan, -static-libstdc++ @qvac/fabric prebuild. Cross-module
          # new/delete and fabric's intentional long-lived runtime allocations
          # would otherwise abort the run, so relax exactly those two checks.
          # See packages/classification-ggml/test/unit/CMakeLists.txt for the
          # full rationale. Harmless on win32 (nothing is ASan-linked there).
          # test:cpp:run runs test:scripts first (runner exit-code / ASAN_OPTIONS
          # regressions) before spawning the ASan-instrumented addon-test binary.
          ASAN_OPTIONS: alloc_dealloc_mismatch=0:detect_leaks=0:abort_on_error=1
        run: npm run test:cpp:run

      # Linux: ONE configure of the build/ tree produces both addon-test and the
      # bounded fuzz target, sharing the vcpkg GoogleTest, so we pay the CMake
      # configure cost once instead of configuring two trees separately. The
      # whole fuzz stack — FuzzTest included — comes from the vcpkg binary cache
      # configured by setup-vcpkg above, so this needs no egress of its own.
      # See docs/architecture/ADDON-FUZZING.md.
      #
      # The build and run are split per target, in that order, so a fuzz
      # compile break or a fuzz finding fails after addon-test has already been
      # built AND run, instead of aborting the job before the unit tests ever
      # start.
      #
      # That ordering does NOT isolate the unit tests from the fuzz
      # *dependencies*: BUILD_FUZZING=ON activates the `fuzz` vcpkg manifest
      # feature, so this configure resolves fuzztest[asan], abseil[asan],
      # re2[asan] and antlr4 before addon-test is configured at all — a
      # registry or binary-cache failure there takes the Linux unit tests down
      # with it. That is the accepted price of one configure over two;
      # splitting the trees would pay a second CMake configure on every run to
      # guard against it.
      - name: Configure C++ tests + fuzz targets
        if: matrix.platform == 'linux'
        working-directory: ${{ env.WORKDIR }}
        run: npm run test:cpp:fuzz:configure

      - name: Build C++ tests (Linux)
        if: matrix.platform == 'linux'
        working-directory: ${{ env.WORKDIR }}
        run: npm run test:cpp:fuzz:build:tests

      # Intentionally NO step-level ASAN_OPTIONS on either run step: each runner
      # applies its own posture — relaxed fabric-boundary options for the
      # fabric-linked addon-test, full strength (+ LeakSanitizer) for the
      # non-fabric fuzz target. Setting ASAN_OPTIONS here (or at job level) would
      # override both; the fuzz runner warns when that happens rather than
      # silently dropping leak detection.
      - name: Run C++ tests (Linux)
        if: matrix.platform == 'linux'
        working-directory: ${{ env.WORKDIR }}
        run: npm run test:cpp:run

      - name: Build fuzz targets
        if: matrix.platform == 'linux'
        working-directory: ${{ env.WORKDIR }}
        run: npm run test:cpp:fuzz:build:fuzz

      # Bounded unit-test mode (each FUZZ_TEST ~1s) for free per-PR coverage;
      # coverage-guided time-boxed fuzzing (`--fuzz_for`) is a separate scheduled job.
      - name: Run fuzz targets (bounded)
        if: matrix.platform == 'linux'
        working-directory: ${{ env.WORKDIR }}
        run: npm run fuzz:run
