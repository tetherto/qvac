name: CPP Tests (GGML Classification)

on:
  workflow_dispatch:
    inputs:
      workdir:
        description: "Working directory"
        type: string
        required: false
        default: "packages/classification-ggml"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        type: string
        required: false
      repository:
        description: "Repository to checkout"
        type: string
        required: false
      workdir:
        description: "Working directory"
        type: string
        required: false
        default: "packages/classification-ggml"




# Canonical runner labels — .github/actions/runner-names/runners.yaml
env:
  RN_ORCH: ubuntu-latest
  RN_U22: ubuntu-22.04
  RN_U24: ubuntu-24.04
  RN_U22_ARM: ubuntu-22.04-arm
  RN_U24_ARM: ubuntu-24.04-arm
  RN_MAC14: macos-14
  RN_MAC14_XL: macos-14-xlarge
  RN_MAC15: macos-15
  RN_MAC15_INTEL: macos-15-intel
  RN_MAC15_LG: macos-15-large
  RN_MAC15_XL: macos-15-xlarge
  RN_WIN22: windows-2022
  RN_WIN25: windows-2025
  RN_QVAC_U22: qvac-ubuntu2204-x64
  RN_QVAC_U22_GPU: qvac-ubuntu2204-x64-gpu
  RN_QVAC_U24: qvac-ubuntu2404-x64
  RN_QVAC_U24_GPU: qvac-ubuntu2404-x64-gpu
  RN_QVAC_WIN25: qvac-win25-x64
  RN_QVAC_WIN25_GPU: qvac-win25-x64-gpu
  RN_AI_LINUX: ai-run-linux
  RN_AI_LINUX_GPU: ai-run-linux-gpu
  RN_AI_U22: ai-run-ubuntu-22.04
  RN_AI_WIN11_GPU: ai-run-windows11-gpu
  RN_GEN_WIN11: generator-windows11
  RN_MINI_M4: mac-mini-m4
  RN_MINI_M4_GPU: mac-mini-m4-gpu
  RN_LBL_U22_X64: ubuntu-22.04-x64
  RN_LBL_U22_X64_GPU: ubuntu-22.04-x64-gpu
  RN_LBL_U24_X64: ubuntu-24.04-x64
  RN_LBL_U24_X64_GPU: ubuntu-24.04-x64-gpu
  RN_LBL_U24_ARM64: ubuntu-24.04-arm64
  RN_LBL_WIN22_X64: windows-2022-x64
  RN_LBL_WIN25_X64: windows-2025-x64
  RN_LBL_WIN25_X64_GPU: windows-2025-x64-gpu

permissions:
  contents: read

jobs:
  test-cpp:
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ${{ env.RN_U24 }}
            platform: linux
            arch: x64
            runner: ${{ env.RN_QVAC_U24 }}
          - os: ${{ env.RN_MAC15 }}
            platform: darwin
            arch: arm64
          - os: ${{ env.RN_WIN25 }}
            platform: win32
            arch: x64
            runner: ${{ env.RN_QVAC_WIN25 }}
    runs-on: ${{ matrix.runner || matrix.os }}
    environment: release
    name: cpp-tests-${{ matrix.platform }}-${{ matrix.arch }}

    env:
      WORKDIR: ${{ inputs.workdir }}

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Setup build host (github-hosted runners only)
        if: runner.environment == 'github-hosted'
        uses: tetherto/qvac/.github/actions/setup-build-host@6e8d3c306a462a58589396cda428d65e015f0d8b
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup AWS + Windows CLI
        uses: tetherto/qvac/.github/actions/setup-aws-prebuild@2e2c94d66a50c8b8851824314e343ede5297eb1f
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

      - name: Setup vcpkg
        uses: tetherto/qvac/.github/actions/setup-vcpkg@98990f3d11736a1ae88feddc514d14d78d7abdc7
        env:
          MODEL_S3_BUCKET: ${{ secrets.MODEL_S3_BUCKET }}
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}

      - name: Cleanup vcpkg
        shell: bash
        run: |
          rm -rf $VCPKG_ROOT/buildtrees/*
          rm -rf $VCPKG_ROOT/packages/*

      - name: Setup Bare tooling
        uses: tetherto/qvac/.github/actions/setup-bare-tooling@8668ac46334eb595aa095c94b53322c557b1bc39
        with:
          shell_type: ${{ matrix.platform == 'win32' && 'powershell' || 'bash' }}

      - name: Setup Apple Clang
        if: ${{ matrix.platform == 'darwin' }}
        uses: tetherto/qvac/.github/actions/setup-apple-clang@6e8d3c306a462a58589396cda428d65e015f0d8b

      - name: Install npm dependencies
        working-directory: ${{ env.WORKDIR }}
        run: npm install --ignore-scripts

      - name: Build C++ tests
        working-directory: ${{ env.WORKDIR }}
        run: npm run test:cpp:build

      - name: Run C++ tests
        working-directory: ${{ env.WORKDIR }}
        run: npm run test:cpp:run
