# Deploy docs to production on merge to docs-production.
# Production deploys are gated by PR review (main -> docs-production).
# See docs/DOCS-DEPLOY-FLOW.md for the full strategy.
name: Docs Deploy Production

on:
  push:
    branches:
      - docs-production

permissions:
  contents: read

concurrency:
  group: docs-deploy-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: docs/website

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: docs-production

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Create placeholder for generated API docs
        run: |
          mkdir -p content/docs/sdk/api/latest
          printf '%s\n' '---' 'title: API Reference' 'description: API Reference for the latest version of the QVAC SDK.' '---' > content/docs/sdk/api/latest/index.mdx

      - name: Build static site
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-production-${{ github.sha }}
          path: docs/website/dist
          retention-days: 30

      # TODO: Replace with platform-specific deploy step once hosting is configured.
