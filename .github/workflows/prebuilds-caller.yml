name: Prebuilds Caller

# Direct dispatch, no dedup layer: each job below calls that package's
# existing prebuilds-<pkg>.yml unmodified. A PR touching packages/<pkg>/
# will build that package twice (once here, once via the existing
# on-pr-<pkg>.yml) - accepted, known duplicate-compute tradeoff, same as
# validated in qvac-internal (QVAC-18048). qvac's existing
# detect-native-changes/prebuild-artifact-reuse/prebuild-artifact-save
# dedup mechanism inside on-pr-<pkg>.yml is untouched and unaffected.

on:
  workflow_call:
    inputs:
      changed-packages:
        description: "JSON array of changed package names, from dorny/paths-filter"
        required: true
        type: string
      repository:
        required: false
        type: string
        default: "tetherto/qvac"
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  bci-whispercpp-build:
    if: contains(fromJSON(inputs.changed-packages), 'bci-whispercpp')
    concurrency:
      group: prebuilds-bci-whispercpp-${{ github.event.pull_request.head.sha || inputs.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/prebuilds-bci-whispercpp.yml
    secrets: inherit
    with:
      repository: ${{ inputs.repository }}
      ref: ${{ inputs.ref }}

  classification-ggml-build:
