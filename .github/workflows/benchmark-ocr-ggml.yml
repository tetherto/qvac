name: Benchmark (OCR GGML)

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: 'GGML pipeline(s) to evaluate (easyocr, doctr, or both)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - easyocr
          - doctr
      tasks:
        description: 'Tasks to run (fullpage, spotting, or both)'
        required: false
        default: 'fullpage,spotting'
        type: string
      limit:
        description: 'Limit samples per task (0 = all)'
        required: false
        default: '0'
        type: string
      skip_existing:
        description: 'Skip already processed samples'
        required: false
        default: true
        type: boolean
      platforms:
        description: 'Comma-separated platforms: linux-x64, linux-x64-gpu, macos-arm64, windows-x64. Non-linux platforms trigger the full prebuild matrix; prefer a limit when selecting them.'
        required: false
        default: 'linux-x64'
        type: string

env:
  PKG_DIR: packages/ocr-ggml
  EASYOCR_S3_PREFIX: qvac_models_compiled/ocr/gguf/easyocr/2026-05-14
  DOCTR_S3_PREFIX: qvac_models_compiled/ocr/gguf/doctrf16/2026-05-15

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Plan platform matrix
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      need_build: ${{ steps.plan.outputs.need_build }}
      need_prebuild: ${{ steps.plan.outputs.need_prebuild }}
    steps:
      - id: plan
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          MATRIX=""
          NEED_BUILD=false
          NEED_PREBUILD=false
          SEEN=""
          for p in $(echo "$PLATFORMS" | tr ',' ' '); do
            case " $SEEN " in
              *" $p "*) continue ;;
            esac
            SEEN="$SEEN $p"
            case "$p" in
              linux-x64)
                ROW='{"id":"linux-x64","runner":"ubuntu-24.04","source":"build","devices":"cpu","reference":true}'
                NEED_BUILD=true
                ;;
              linux-x64-gpu)
                ROW='{"id":"linux-x64-gpu","runner":"qvac-ubuntu2404-x64-gpu","source":"build","devices":"vulkan","reference":false}'
                NEED_BUILD=true
                ;;
              macos-arm64)
                ROW='{"id":"macos-arm64","runner":"qvac-macos26-arm64-gpu","source":"prebuild","artifact":"ggml-ocr-darwin-arm64","devices":"cpu metal","reference":false}'
                NEED_PREBUILD=true
                ;;
              windows-x64)
                ROW='{"id":"windows-x64","runner":"qvac-win25-x64-gpu","source":"prebuild","artifact":"ggml-ocr-win32-x64","devices":"cpu vulkan","reference":false}'
                NEED_PREBUILD=true
                ;;
              *)
                echo "ERROR: unknown platform: $p" >&2
                exit 1
                ;;
            esac
            if [ -z "$MATRIX" ]; then MATRIX="$ROW"; else MATRIX="$MATRIX,$ROW"; fi
          done
          if [ -z "$MATRIX" ]; then
            echo "ERROR: no platforms selected" >&2
            exit 1
          fi
          {
            echo "matrix={\"include\":[$MATRIX]}"
            echo "need_build=$NEED_BUILD"
            echo "need_prebuild=$NEED_PREBUILD"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.need_build == 'true'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 120
    name: Build QVAC OCR GGML addon

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Install global dependencies
        run: npm install -g --force bare-make bare-runtime

      - name: Configure vcpkg
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

      - name: Cache vcpkg packages
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          key: vcpkg-linux-x64-ocr-ggml-${{ hashFiles('packages/ocr-ggml/**/vcpkg.json', 'packages/ocr-ggml/**/CMakeLists.txt') }}
          path: |
            ${{ env.VCPKG_ROOT }}/installed
            ${{ env.VCPKG_ROOT }}/packages
            ~/.cache/vcpkg
          restore-keys: vcpkg-linux-x64-ocr-ggml-

      - name: Cache ccache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          key: ccache-linux-x64-ocr-ggml-${{ github.sha }}
          path: ~/.ccache
          restore-keys: ccache-linux-x64-ocr-ggml-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake wget build-essential ccache

      - name: Setup LLVM
        uses: tetherto/qvac/.github/actions/setup-llvm@0c819dd1110e4902223b1f7646cc0f1be2c9bc5c

      - name: Setup Vulkan SDK
        uses: tetherto/qvac/.github/actions/setup-vulkan-sdk@0bbdca93da303a0b1634ba14a89cec085621078d
        with:
          platform: linux
          arch: x64

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=500M
          ccache --set-config=compression=true
          ccache -z

      - name: Cache npm dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          key: npm-ocr-ggml-${{ hashFiles('packages/ocr-ggml/package-lock.json') }}
          path: ~/.npm
          restore-keys: npm-ocr-ggml-

      - name: Install npm dependencies
        working-directory: ${{ env.PKG_DIR }}
        run: npm install

      - name: Build addon
        working-directory: ${{ env.PKG_DIR }}
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          bare-make generate --platform linux --arch x64
          bare-make build
          bare-make install

      - name: Show ccache stats
        run: ccache -s

      - name: Upload build artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: qvac-ocr-ggml-build
          path: |
            ${{ env.PKG_DIR }}/prebuilds/
            ${{ env.PKG_DIR }}/node_modules/
          retention-days: 1

  # macOS / Windows evaluation lanes reuse the canonical prebuild pipeline
  # instead of duplicating its per-platform toolchain setup here.
  prebuild:
    needs: plan
    if: needs.plan.outputs.need_prebuild == 'true'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    uses: ./.github/workflows/prebuilds-nx.yml
    secrets: inherit
    with:
      packages: '["ocr-ggml"]'

  evaluate:
    needs:
      - plan
      - build
      - prebuild
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.prebuild.result == 'success' || needs.prebuild.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 300
    name: Run Evaluation (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Windows - enable git long paths
        if: runner.os == 'Windows'
        shell: powershell
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 20

      - name: Install bare-runtime
        run: npm install -g --force bare-runtime

      - name: Set up Python
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: '3.14'
          cache: pip

      # actions/setup-python hard-fails on the self-hosted GPU runners (its
      # tarball hardcodes an unwritable toolcache path); use the runner's own
      # Python via a venv instead. Same pattern as on-pr-sdk-python-e2e-full.
      - name: Set up Python venv (self-hosted)
        if: runner.environment != 'github-hosted'
        run: |
          set -e
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" -c 'import sys; assert sys.version_info[:2] >= (3, 10), "need Python >=3.10, got " + sys.version'
          "$PY" -m venv "$GITHUB_WORKSPACE/.qe-venv"
          if [ -x "$GITHUB_WORKSPACE/.qe-venv/bin/python" ]; then
            PYBIN="$GITHUB_WORKSPACE/.qe-venv/bin/python"
          else
            PYBIN="$GITHUB_WORKSPACE/.qe-venv/Scripts/python"
          fi
          echo "PYBIN=$PYBIN" >> "$GITHUB_ENV"
          "$PYBIN" -m pip install --upgrade pip

      - name: Download build artifact
        if: matrix.source == 'build'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: qvac-ocr-ggml-build
          path: ${{ env.PKG_DIR }}

      - name: Download prebuild artifact
        if: matrix.source == 'prebuild'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.PKG_DIR }}/prebuilds

      - name: Install npm dependencies
        working-directory: ${{ env.PKG_DIR }}
        run: npm install

      - name: Install system dependencies
        if: matrix.id == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: Install AWS CLI on macOS (runners without a preinstalled aws)
        if: runner.os == 'macOS'
        run: |
          if command -v aws >/dev/null 2>&1; then
            aws --version
            exit 0
          fi
          for p in /opt/homebrew/bin/aws /usr/local/bin/aws "$HOME/.local/aws-cli/aws"; do
            if [ -x "$p" ]; then
              dirname "$p" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          curl -sSL "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o /tmp/AWSCLIV2.pkg
          rm -rf /tmp/awscli-expanded
          pkgutil --expand-full /tmp/AWSCLIV2.pkg /tmp/awscli-expanded
          mkdir -p "$HOME/.local"
          rm -rf "$HOME/.local/aws-cli"
          mv /tmp/awscli-expanded/aws-cli.pkg/Payload/aws-cli "$HOME/.local/aws-cli"
          rm -rf /tmp/awscli-expanded /tmp/AWSCLIV2.pkg
          echo "$HOME/.local/aws-cli" >> "$GITHUB_PATH"
          "$HOME/.local/aws-cli/aws" --version

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # 6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Download EasyOCR GGML models
        if: inputs.pipeline == 'easyocr' || inputs.pipeline == 'both'
        working-directory: ${{ env.PKG_DIR }}
        env:
          MODEL_S3_BUCKET: ${{ secrets.MODEL_S3_BUCKET }}
        run: |
          mkdir -p models/ocr/gguf/easyocr
          aws s3 cp s3://$MODEL_S3_BUCKET/${{ env.EASYOCR_S3_PREFIX }}/craft_mlt_25k.gguf models/ocr/gguf/easyocr/
          aws s3 cp s3://$MODEL_S3_BUCKET/${{ env.EASYOCR_S3_PREFIX }}/latin_g2.gguf models/ocr/gguf/easyocr/
          echo "Downloaded EasyOCR GGML models:"
          ls -la models/ocr/gguf/easyocr/

      - name: Download DocTR GGML models
        if: inputs.pipeline == 'doctr' || inputs.pipeline == 'both'
        working-directory: ${{ env.PKG_DIR }}
        env:
          MODEL_S3_BUCKET: ${{ secrets.MODEL_S3_BUCKET }}
        run: |
          mkdir -p models/ocr/gguf/doctr
          aws s3 cp s3://$MODEL_S3_BUCKET/${{ env.DOCTR_S3_PREFIX }}/db_mobilenet_v3_large.gguf models/ocr/gguf/doctr/
          aws s3 cp s3://$MODEL_S3_BUCKET/${{ env.DOCTR_S3_PREFIX }}/crnn_mobilenet_v3_small.gguf models/ocr/gguf/doctr/
          echo "Downloaded DocTR GGML models:"
          ls -la models/ocr/gguf/doctr/

      - name: Download OCRBench_v2 dataset
        working-directory: ${{ env.PKG_DIR }}
        env:
          MODEL_S3_BUCKET: ${{ secrets.MODEL_S3_BUCKET }}
        run: |
          mkdir -p benchmarks/quality_eval/data
          echo "Downloading OCRBench_v2 dataset from S3..."
          aws s3 sync s3://$MODEL_S3_BUCKET/qvac_datasets/ocr/OCRBench_v2/ benchmarks/quality_eval/data/OCRBench_v2/ --exclude "*.zip"
          echo "Dataset downloaded:"
          ls -la benchmarks/quality_eval/data/OCRBench_v2/ | head -20

      - name: Free up disk space
        if: matrix.id == 'linux-x64'
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      - name: Install Python dependencies (hosted)
        if: runner.environment == 'github-hosted'
        working-directory: ${{ env.PKG_DIR }}/benchmarks/quality_eval
        run: |
          echo "PYBIN=python" >> "$GITHUB_ENV"
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Python dependencies (self-hosted)
        if: runner.environment != 'github-hosted'
        working-directory: ${{ env.PKG_DIR }}/benchmarks/quality_eval
        run: '"$PYBIN" -m pip install -r requirements-qvac.txt'

      # Python's subprocess resolves executables via CreateProcess on Windows,
      # which cannot find the extension-less npm shim; point it at bare.cmd.
      - name: Resolve bare runtime path
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BARE_BIN="$(npm prefix -g)/bare.cmd"
          else
            BARE_BIN="bare"
          fi
          echo "BARE_BIN=$BARE_BIN" >> "$GITHUB_ENV"
          "$BARE_BIN" -v

      - name: Build common evaluate args
        id: eval-args
        shell: bash
        run: |
          SKIP_FLAG=""
          # Validate workflow inputs before building the eval argv. Restricts the
          # surface for shell injection through the (quoted) step outputs below.
          case "${{ inputs.pipeline }}" in
            easyocr|doctr|both) ;;
            *) echo "ERROR: invalid pipeline: ${{ inputs.pipeline }}" >&2; exit 1 ;;
          esac
          if ! [[ "${{ inputs.limit }}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: limit must be a non-negative integer" >&2; exit 1
          fi

          if [ "${{ inputs.skip_existing }}" = "true" ]; then
            SKIP_FLAG="--skip-existing"
          else
            SKIP_FLAG="--no-skip-existing"
          fi

          LIMIT_ARG=""
          if [ "${{ inputs.limit }}" != "0" ]; then
            LIMIT_ARG="--limit ${{ inputs.limit }}"
          fi

          PIPELINE_ARG="--pipeline ${{ inputs.pipeline }}"

          EASYOCR_ARGS=""
          if [ "${{ inputs.pipeline }}" = "easyocr" ] || [ "${{ inputs.pipeline }}" = "both" ]; then
            EASYOCR_ARGS="--detector $GITHUB_WORKSPACE/${{ env.PKG_DIR }}/models/ocr/gguf/easyocr/craft_mlt_25k.gguf --recognizer $GITHUB_WORKSPACE/${{ env.PKG_DIR }}/models/ocr/gguf/easyocr/latin_g2.gguf"
          fi

          DOCTR_ARGS=""
          if [ "${{ inputs.pipeline }}" = "doctr" ] || [ "${{ inputs.pipeline }}" = "both" ]; then
            DOCTR_ARGS="--doctr-detector $GITHUB_WORKSPACE/${{ env.PKG_DIR }}/models/ocr/gguf/doctr/db_mobilenet_v3_large.gguf --doctr-recognizer $GITHUB_WORKSPACE/${{ env.PKG_DIR }}/models/ocr/gguf/doctr/crnn_mobilenet_v3_small.gguf"
          fi

          echo "skip_flag=$SKIP_FLAG" >> $GITHUB_OUTPUT
          echo "limit_arg=$LIMIT_ARG" >> $GITHUB_OUTPUT
          echo "pipeline_arg=$PIPELINE_ARG" >> $GITHUB_OUTPUT
          echo "easyocr_args=$EASYOCR_ARGS" >> $GITHUB_OUTPUT
          echo "doctr_args=$DOCTR_ARGS" >> $GITHUB_OUTPUT

      - name: Run Full-page OCR benchmark (HierText)
        if: contains(inputs.tasks, 'fullpage')
        timeout-minutes: 120
        working-directory: ${{ env.PKG_DIR }}/benchmarks/quality_eval
        run: |
          for DEVICE in ${{ matrix.devices }}; do
            "$PYBIN" evaluate.py \
              --dataset-path "data/OCRBench_v2" \
              ${{ steps.eval-args.outputs.pipeline_arg }} \
              ${{ steps.eval-args.outputs.easyocr_args }} \
              ${{ steps.eval-args.outputs.doctr_args }} \
              --task-types "full-page OCR en" \
              --dataset-filter "HierText" \
              --results-dir "results/full-page-ocr" \
              --qvac-addon-path "$GITHUB_WORKSPACE/${{ env.PKG_DIR }}" \
              --bare-path "$BARE_BIN" \
              --qvac-device "$DEVICE" \
              ${{ matrix.reference && '--reference' || '--no-reference' }} \
              ${{ steps.eval-args.outputs.skip_flag }} \
              ${{ steps.eval-args.outputs.limit_arg }}
          done
        env:
          PYTHONUNBUFFERED: 1

      - name: Run Text Spotting benchmark (IC15)
        if: contains(inputs.tasks, 'spotting')
        timeout-minutes: 120
        working-directory: ${{ env.PKG_DIR }}/benchmarks/quality_eval
        run: |
          for DEVICE in ${{ matrix.devices }}; do
            "$PYBIN" evaluate.py \
              --dataset-path "data/OCRBench_v2" \
              ${{ steps.eval-args.outputs.pipeline_arg }} \
              ${{ steps.eval-args.outputs.easyocr_args }} \
              ${{ steps.eval-args.outputs.doctr_args }} \
              --task-types "text spotting en" \
              --dataset-filter "IC15" \
              --results-dir "results/text-spotting" \
              --qvac-addon-path "$GITHUB_WORKSPACE/${{ env.PKG_DIR }}" \
              --bare-path "$BARE_BIN" \
              --qvac-device "$DEVICE" \
              ${{ matrix.reference && '--reference' || '--no-reference' }} \
              ${{ steps.eval-args.outputs.skip_flag }} \
              ${{ steps.eval-args.outputs.limit_arg }}
          done
        env:
          PYTHONUNBUFFERED: 1

      - name: Upload evaluation results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        if: always()
        with:
          name: ocr-ggml-benchmark-results-${{ matrix.id }}
          path: ${{ env.PKG_DIR }}/benchmarks/quality_eval/results/*
          retention-days: 30

      - name: Upload evaluation logs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        if: failure()
        with:
          name: ocr-ggml-benchmark-logs-${{ matrix.id }}
          path: |
            ${{ env.PKG_DIR }}/benchmarks/quality_eval/*.log
          retention-days: 7

  summarize:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()

    steps:
      - name: Checkout summary renderer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            packages/ocr-ggml/benchmarks/quality_eval/render_summary.py
          sparse-checkout-cone-mode: false

      - name: Download results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        continue-on-error: true
        with:
          pattern: ocr-ggml-benchmark-results-*
          path: results

      - name: Skip summary if results are missing
        if: ${{ !hashFiles('results/**') }}
        run: |
          echo "No ocr-ggml-benchmark-results artifacts found; skipping summary."
          exit 0

      - name: Generate results summary
        env:
          PIPELINE: ${{ inputs.pipeline }}
          TASKS: ${{ inputs.tasks }}
          LIMIT: ${{ inputs.limit }}
        run: |
          python3 packages/ocr-ggml/benchmarks/quality_eval/render_summary.py \
            --results results \
            --pipeline "$PIPELINE" \
            --tasks "$TASKS" \
            --limit "$LIMIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload consolidated results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: ocr-ggml-benchmark-consolidated
          path: results
          retention-days: 90
