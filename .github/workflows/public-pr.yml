name: Validate PR for Quality Standards before merging
# Shared by multiple projects
# Used in branch protection rulesets

on:
  workflow_call:
    inputs:
      build-with-model-status:
        required: false
        type: boolean
        description: "Status of build process with model integration"
        default: true
      build-status:
        required: false
        type: boolean
        description: "Status of build process"
        default: true
      sanity-checks-status:
        required: false
        type: boolean
        description: "Status of sanity checks"
        default: true
      integration-tests-status:
        required: false
        type: boolean
        description: "Status of integration tests"
        default: true
      general-checks-status:
        required: false
        type: boolean
        description: "Status of general checks"
        default: true
      tests-status: # Deprecated, use sanity-checks-status, integration-tests-status, and general-checks-status instead
        required: false
        type: boolean
        description: "Status of tests and PR checks"
        default: true
      workdir:
        required: false
        type: string
        default: "."




# Canonical runner labels — .github/actions/runner-names/runners.yaml
env:
  RN_ORCH: ubuntu-latest
  RN_U22: ubuntu-22.04
  RN_U24: ubuntu-24.04
  RN_U22_ARM: ubuntu-22.04-arm
  RN_U24_ARM: ubuntu-24.04-arm
  RN_MAC14: macos-14
  RN_MAC14_XL: macos-14-xlarge
  RN_MAC15: macos-15
  RN_MAC15_INTEL: macos-15-intel
  RN_MAC15_LG: macos-15-large
  RN_MAC15_XL: macos-15-xlarge
  RN_WIN22: windows-2022
  RN_WIN25: windows-2025
  RN_QVAC_U22: qvac-ubuntu2204-x64
  RN_QVAC_U22_GPU: qvac-ubuntu2204-x64-gpu
  RN_QVAC_U24: qvac-ubuntu2404-x64
  RN_QVAC_U24_GPU: qvac-ubuntu2404-x64-gpu
  RN_QVAC_WIN25: qvac-win25-x64
  RN_QVAC_WIN25_GPU: qvac-win25-x64-gpu
  RN_AI_LINUX: ai-run-linux
  RN_AI_LINUX_GPU: ai-run-linux-gpu
  RN_AI_U22: ai-run-ubuntu-22.04
  RN_AI_WIN11_GPU: ai-run-windows11-gpu
  RN_GEN_WIN11: generator-windows11
  RN_MINI_M4: mac-mini-m4
  RN_MINI_M4_GPU: mac-mini-m4-gpu
  RN_LBL_U22_X64: ubuntu-22.04-x64
  RN_LBL_U22_X64_GPU: ubuntu-22.04-x64-gpu
  RN_LBL_U24_X64: ubuntu-24.04-x64
  RN_LBL_U24_X64_GPU: ubuntu-24.04-x64-gpu
  RN_LBL_U24_ARM64: ubuntu-24.04-arm64
  RN_LBL_WIN22_X64: windows-2022-x64
  RN_LBL_WIN25_X64: windows-2025-x64
  RN_LBL_WIN25_X64_GPU: windows-2025-x64-gpu

jobs:
  validate-pr: # to do checks after other workflows have run
    runs-on: ${{ env.RN_ORCH }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check tests status
        run: |
          failed=0
          echo "Labels: ${{ join(github.event.pull_request.labels.*.name, ' ') }}"
          if [[ ! " ${{ join(github.event.pull_request.labels.*.name, ' ') }} " =~ " verified " ]]; then
            echo "::error title=PR is not verified::This PR needs the 'verified' label to be merged"
            echo "Warning:Label 'verified' must be present on the PR to run the full suite of checks"
            failed=1
          fi
          if [[ "${{ inputs.sanity-checks-status }}" != "" && "${{ inputs.sanity-checks-status }}" != "true" ]]; then
            echo "::error title=Sanity checks have not returned success::Some sanity checks have not returned success"
            failed=1
          fi
          if [[ "${{ inputs.build-with-model-status }}" != "" && "${{ inputs.build-with-model-status }}" != "true" ]]; then
            echo "::error title=Build with model has not returned success::The build process with model integration has not returned success"
            failed=1
          fi
          if [[ "${{ inputs.build-status }}" != "" && "${{ inputs.build-status }}" != "true" ]]; then
            echo "::error title=Build has not returned success::The build process has not returned success"
            failed=1
          fi
          if [[ "${{ inputs.integration-tests-status }}" != "" && "${{ inputs.integration-tests-status }}" != "true" ]]; then
            echo "::error title=Integration tests have not returned success::Some integration tests have not returned success"
            failed=1
          fi
          if [[ "${{ inputs.general-checks-status }}" != "" && "${{ inputs.general-checks-status }}" != "true" ]]; then
            echo "::error title=General checks have not returned success::Some general checks have not returned success"
            failed=1
          fi
          if [[ "${{ inputs.tests-status }}" != "" && "${{ inputs.tests-status }}" != "true" ]]; then
            echo "::error title=Tests have not returned success::Some tests have not returned success"
            failed=1
          fi
          if [[ "${{ github.repository }}" == "tetherto/inference-addon-mlc-marian" ]]; then
            echo "per repo additionals checks"
          fi
          if [[ $failed -eq 1 ]]; then
            exit 1
          fi
