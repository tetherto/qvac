name: TMP nx fabric dependents probe (QVAC-25682)

# THROWAWAY. Deleted before merge.
#
# The e2e run showed a fabric dependency bump selecting only fabric through the
# real action (target on-pr), where an earlier probe without a target found
# fabric plus the seven addons that link it. Question: is that this PR, or does
# `-t on-pr` already drop fabric's dependents on main today?
#
# For a fabric SOURCE change (no lockfile, so the lockfile rule cannot matter)
# and a fabric DEPENDENCY change, measure affected with and without -t on-pr,
# under today's nx.json and this PR's. Then dump the graph edges into llm.

on:
  push:
    branches:
      - infra/QVAC-25682-nx-lockfile-affected

permissions:
  contents: read

jobs:
  probe:
    name: fabric ${{ matrix.kind }}
    strategy:
      fail-fast: false
      matrix:
        kind: [source, dep]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Measure
        shell: bash
        env:
          KIND: ${{ matrix.kind }}
        run: |
          set -uo pipefail
          git config user.email probe@local; git config user.name probe
          jq 'del(.pluginsConfig)' nx.json > /tmp/nx.today.json
          cp nx.json /tmp/nx.pr.json
          B=$(git rev-parse HEAD)
          if [ "$KIND" = source ]; then
            f=$(git ls-files packages/fabric | grep -vE 'package.json|\.md$' | head -1)
            echo "// probe" >> "$f"; echo "edited: $f"
          else
            pnpm add -D --filter @qvac/fabric tiny-invariant@1.3.3 --ignore-scripts >/dev/null
          fi
          git add -A && git commit -q -m probe; H=$(git rev-parse HEAD)
          echo "changed: $(git diff --name-only $B $H | tr '\n' ' ')"

          m() {  # $1 nx.json variant, $2 extra args
            cp "/tmp/nx.$1.json" nx.json; rm -rf .nx
            o=$(pnpm exec nx show projects --affected --base="$B" --head="$H" $2 --json 2>/dev/null | grep -E '^\[' | tail -n1)
            echo "${o:-[]}" | jq -c 'sort'
          }
          for cfg in today pr; do
            echo "FABRIC $KIND $cfg no-target : $(m $cfg '')"
            echo "FABRIC $KIND $cfg -t on-pr  : $(m $cfg '-t on-pr')"
          done
          cp /tmp/nx.pr.json nx.json

          echo "--- graph: what does llm-llamacpp depend on?"
          rm -rf .nx
          pnpm exec nx graph --file=/tmp/graph.json >/dev/null 2>&1 || true
          jq -c '[.graph.dependencies["@qvac/llm-llamacpp"][]? | {target, type}]' /tmp/graph.json 2>/dev/null | sed 's/^/  GRAPH llm deps: /'
          echo "--- does llm-llamacpp define an on-pr target, and what are its inputs?"
          pnpm exec nx show project @qvac/llm-llamacpp --json 2>/dev/null | grep -E '^\{' | tail -n1 \
            | jq -c '{onpr: .targets["on-pr"] | {inputs, dependsOn, executor}}' | sed 's/^/  TARGET /'
