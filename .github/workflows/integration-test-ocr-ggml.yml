name: Integration Tests (OCR-GGML)

on:
  workflow_dispatch:
    inputs:
      prebuild_package:
        description: "NPM package containing prebuilds (e.g. @qvac/ocr-ggml@0.1.0)"
        required: false
        type: string
  workflow_call:
    inputs:
      prebuild_package:
        description: "NPM package containing prebuilds (e.g. @qvac/ocr-ggml@1.0.0)"
        type: string
        required: false
      ref:
        description: "ref"
        type: string
        required: false
      repository:
        type: string
        required: false
        default: "tetherto/qvac"
      model:
        type: string
        required: false
      workdir:
        description: "Working directory inside the repo (monorepo package path)"
        type: string
        required: false
        default: "packages/ocr-ggml"
      fabric-overlay-artifact:
        description: >-
          Workflow-run artifact name for PR-built @qvac/fabric prebuilds. Empty
          skips the overlay (published npm baseline).
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  PKG_DIR: packages/ocr-ggml

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  run-integration-tests:
    needs: runner_names
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    environment: release
    name: test-${{ matrix.platform }}-${{ matrix.arch }}

    permissions:
      contents: read
      packages: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            runner: ${{ needs.runner_names.outputs.linux_ubuntu2204_x64 }}
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            runner: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64_gpu }}
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            runner: ${{ needs.runner_names.outputs.ubuntu_2404_arm }}
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            runner: ${{ needs.runner_names.outputs.ubuntu_2204_arm }}
          # Self-hosted Apple-silicon runner with a real Metal GPU. The
          # GitHub-hosted macos-15-xlarge runner's virtualized Metal is
          # unreliable for sustained GPU compute (the DocTR pipeline runs
          # correctly on real Apple-silicon hardware but non-deterministically
          # aborts / returns garbage on the hosted VM), so the darwin Metal leg
          # runs on the shared self-hosted qvac-macos26-arm64-gpu runner that
          # diffusion-cpp also uses for its GPU tests.
          - os: mac-mini-m4
            platform: darwin
            arch: arm64
            runner: ${{ needs.runner_names.outputs.macos_arm64_gpu }}
          - os: windows-2025
            platform: win32
            arch: x64
            runner: ${{ needs.runner_names.outputs.win_2025_x64_gpu }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Windows - enable git long paths
        if: ${{ matrix.platform == 'win32' }}
        shell: powershell
        run: |
          git config --global core.longpaths true
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}:@github.com/".insteadOf "https://github.com/"
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}:@github.com/".insteadOf "git@github.com:"

      # Self-hosted runners (e.g. qvac-macos26-arm64-gpu) keep their workspace
      # between jobs; wipe it before checkout so each run starts clean. No-op on
      # GitHub-hosted runners. See docs/ci/SELF-HOSTED-RUNNERS.md.
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # EasyOCR + Doctr GGUFs live in S3 under date-stamped snapshot
      # directories. Bump the date segments below when new snapshots are
      # published.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # 6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Install NPM dependencies
        working-directory: ${{ inputs.workdir || env.PKG_DIR }}
        shell: bash
        run: |
          npm install
          # --force so the global install succeeds on the persistent
          # self-hosted runner where these may already be present.
          npm install -g --force bare bare-make

      - name: Download fabric-prebuilds for overlay
        if: ${{ inputs.fabric-overlay-artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ inputs.fabric-overlay-artifact }}
          path: ${{ runner.temp }}/fabric-prebuilds

      - name: Overlay PR @qvac/fabric prebuilds
        if: ${{ inputs.fabric-overlay-artifact != '' }}
        uses: tetherto/qvac/.github/actions/overlay-local-fabric@6620d695d3a07cafe3931182e7844dde376a23f8
        with:
          workdir: ${{ inputs.workdir || env.PKG_DIR }}
          prebuilds-root: ${{ runner.temp }}/fabric-prebuilds
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}

      # Prebuilds live in the merged `prebuilds` bundle. Extract to runner.temp,
      # not the package tree: unscoped merge-multiple into $GITHUB_WORKSPACE is
      # CodeQL actions/artifact-poisoning/critical when this reusable workflow
      # is reachable from workflow_dispatch callers (on-pr / on-merge /
      # benchmark). Same staging pattern as integration-test-classification-ggml.yml.
      - name: Download prebuilds bundle
        if: ${{ !inputs.prebuild_package }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: prebuilds
          path: ${{ runner.temp }}/prebuilds-staging

      - name: Move prebuilds from staging to workspace (Unix)
        if: ${{ !inputs.prebuild_package && matrix.platform != 'win32' }}
        shell: bash
        run: |
          SRC="${{ runner.temp }}/prebuilds-staging/${{ matrix.platform }}-${{ matrix.arch }}"
          if [ ! -d "$SRC" ]; then
            echo "::error::No '${{ matrix.platform }}-${{ matrix.arch }}/' directory in the 'prebuilds' bundle."
            ls -la "${{ runner.temp }}/prebuilds-staging" 2>/dev/null || true
            exit 1
          fi
          mkdir -p ${{ inputs.workdir || env.PKG_DIR }}/prebuilds
          cp -r "$SRC" ${{ inputs.workdir || env.PKG_DIR }}/prebuilds/
          echo "Prebuilds moved from staging area"
          ls -la ${{ inputs.workdir || env.PKG_DIR }}/prebuilds/

      # Windows path: bash cp -r mangles `${{ runner.temp }}` (= "C:\a\_temp")
      # because Git Bash interprets `\a`/`\_` as escape sequences, so the
      # source path becomes invalid and the copy silently no-ops. Use
      # PowerShell Copy-Item with native Windows paths.
      - name: Move prebuilds from staging to workspace (Windows)
        if: ${{ !inputs.prebuild_package && matrix.platform == 'win32' }}
        shell: powershell
        run: |
          $src = "${{ runner.temp }}\prebuilds-staging\${{ matrix.platform }}-${{ matrix.arch }}"
          if (-not (Test-Path $src)) {
            Write-Output "::error::No '${{ matrix.platform }}-${{ matrix.arch }}/' directory in the 'prebuilds' bundle."
            if (Test-Path "${{ runner.temp }}\prebuilds-staging") { Get-ChildItem -Force "${{ runner.temp }}\prebuilds-staging" | Format-Table -AutoSize }
            exit 1
          }
          $dst = "${{ inputs.workdir || env.PKG_DIR }}/prebuilds"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force $src $dst
          Write-Host "Prebuilds moved from staging area"
          Get-ChildItem -Recurse $dst | Select-Object FullName | Format-Table -AutoSize

      - name: Download prebuilds from package
        if: ${{ inputs.prebuild_package }}
        working-directory: ${{ inputs.workdir || env.PKG_DIR }}
        shell: bash
        env:
          PREBUILD_PACKAGE: ${{ inputs.prebuild_package }}
        run: |
          if ! [[ "$PREBUILD_PACKAGE" =~ ^@?[A-Za-z0-9._/~^>=<-]+$ ]]; then
            echo "ERROR: invalid prebuild_package spec" >&2
            exit 1
          fi
          mkdir -p prebuilds
          PACK_DIR="$(mktemp -d -t ocr-ggml-prebuild.XXXXXX)"
          PACK_OUTPUT="$(npm pack "$PREBUILD_PACKAGE" --pack-destination "$PACK_DIR" --json | jq -r '.[0].filename')"
          tar -xzf "$PACK_DIR/$PACK_OUTPUT" -C "$PACK_DIR"
          cp -r "$PACK_DIR/package/prebuilds/." prebuilds/

      - name: Linux - install dependencies
        if: matrix.os == 'ubuntu-22.04-arm' || matrix.os == 'ubuntu-24.04-arm'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - if: ${{ matrix.os == 'ubuntu-24.04-arm' }}
        name: Update c++ tools to install GLIBC++
        run: |
          sudo apt update
          sudo apt install -y g++-13

      # The self-hosted qvac-macos26-arm64-gpu runner may not ship the AWS CLI
      # (hosted macOS runners do). Install it user-local (no sudo) so the S3
      # model download below works. Mirrors integration-test-vla.yml.
      - if: ${{ matrix.platform == 'darwin' && matrix.arch == 'arm64' }}
        name: Install AWS CLI on macOS (user-local fallback for runners without pre-installed aws)
        shell: bash
        run: |
          # 1. Already on PATH?
          if command -v aws >/dev/null 2>&1; then
            echo "AWS CLI already on PATH: $(command -v aws)"
            aws --version
            exit 0
          fi
          # 2. Any known install location?
          for p in /opt/homebrew/bin/aws /usr/local/bin/aws "$HOME/.local/aws-cli/aws"; do
            if [ -x "$p" ]; then
              echo "AWS CLI at $p; adding $(dirname "$p") to PATH"
              echo "$(dirname "$p")" >> "$GITHUB_PATH"
              "$p" --version
              exit 0
            fi
          done
          # 3. User-local install (extract AWSCLIV2.pkg into $HOME instead
          # of using `installer -target /` which requires sudo).
          echo "Installing AWS CLI v2 user-local..."
          curl -sSL "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o /tmp/AWSCLIV2.pkg
          rm -rf /tmp/awscli-expanded
          pkgutil --expand-full /tmp/AWSCLIV2.pkg /tmp/awscli-expanded
          mkdir -p "$HOME/.local"
          rm -rf "$HOME/.local/aws-cli"
          mv /tmp/awscli-expanded/aws-cli.pkg/Payload/aws-cli "$HOME/.local/aws-cli"
          rm -rf /tmp/awscli-expanded /tmp/AWSCLIV2.pkg
          echo "$HOME/.local/aws-cli" >> "$GITHUB_PATH"
          "$HOME/.local/aws-cli/aws" --version

      - name: Download EasyOCR + Doctr GGUF model files
        working-directory: ${{ inputs.workdir || env.PKG_DIR }}
        shell: bash
        run: |
          mkdir -p models
          aws s3 cp \
            "s3://${{ secrets.MODEL_S3_BUCKET }}/qvac_models_compiled/ocr/gguf/easyocr/2026-05-14/" \
            models/ \
            --recursive
          aws s3 cp \
            "s3://${{ secrets.MODEL_S3_BUCKET }}/qvac_models_compiled/ocr/gguf/doctrf16/2026-05-15/" \
            models/ \
            --recursive
          ls -lh models/

      - name: Run integration tests
        working-directory: ${{ inputs.workdir || env.PKG_DIR }}
        shell: bash
        run: npm run test:integration
        env:
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
          OCR_GGML_DETECTOR: models/craft_mlt_25k.gguf
          OCR_GGML_RECOGNIZER: models/latin_g2.gguf
          OCR_GGML_DOCTR_DETECTOR: models/db_mobilenet_v3_large.gguf
          OCR_GGML_DOCTR_RECOGNIZER: models/crnn_mobilenet_v3_small.gguf

      - name: Upload performance report
        if: always() && !cancelled()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # 4.6.1
        with:
          name: perf-report-ocr-${{ matrix.os }}-${{ matrix.arch }}-${{ github.run_number }}
          path: ${{ inputs.workdir || env.PKG_DIR }}/test/results/performance-report.json
          retention-days: 90
          if-no-files-found: ignore

