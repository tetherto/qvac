name: On PR Trigger (VLA)

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/vla-ggml/**"
      - ".github/workflows/*-vla.yml"
      - "packages/fabric/vcpkg.json"
      - "packages/fabric/vcpkg-configuration.json"
  workflow_dispatch:

  workflow_call:

permissions:
  contents: read
  pull-requests: read
  packages: read
  id-token: write

env:
  PKG_DIR: packages/vla-ggml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fork-approval:
    permissions:
      statuses: write
    uses: ./.github/workflows/reusable-fork-approval.yml
  ci-router:
    name: CI Router (label detection)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_verified_checks: ${{ steps.route.outputs.run_verified_checks }}
      run_prebuilds: ${{ steps.route.outputs.run_prebuilds }}
      run_cpp_tests: ${{ steps.route.outputs.run_cpp_tests }}
      run_desktop: ${{ steps.route.outputs.run_desktop }}
      run_mobile: ${{ steps.route.outputs.run_mobile }}
    steps:
      - name: Checkout ci-router composite (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/ci-router
          sparse-checkout-cone-mode: false
      - name: Route CI stages
        id: route
        uses: ./.github/actions/ci-router

  authorize:
    needs: [fork-approval]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: read
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      - name: Checkout authorize-pr (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/authorize-pr
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Authorize
        id: auth
        uses: ./.github/actions/authorize-pr
        with:
          github-token: ${{ github.token }}

  detect-fabric-stack:
    if: needs.authorize.outputs.allowed == 'true'
    needs:
      - fork-approval
      - authorize
      - ci-router
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      fabric_stack: ${{ steps.detect.outputs.fabric_stack }}
      needs_fabric_artifact: ${{ steps.detect.outputs.fabric_stack == 'true' && needs.ci-router.outputs.run_prebuilds == 'true' && github.event_name == 'pull_request_target' }}
    steps:
      - name: Checkout repository (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Detect fabric-stack PR
        id: detect
        uses: tetherto/qvac/.github/actions/detect-fabric-stack@6620d695d3a07cafe3931182e7844dde376a23f8
      - name: Warn when a stack PR builds against released fabric
        if: steps.detect.outputs.fabric_stack == 'true' && needs.ci-router.outputs.run_prebuilds != 'true'
        shell: bash
        run: |
          echo "::warning::This PR changes packages/fabric, but no prebuilds label is set, so on-pr-fabric publishes nothing. Native jobs here build against the released @qvac/fabric, not this PR's. Add the 'prebuilds' label to exercise the stack."

  resolve-fabric-prebuilds:
    if: needs.detect-fabric-stack.outputs.needs_fabric_artifact == 'true' && needs.authorize.outputs.allowed == 'true'
    needs:
      - fork-approval
      - authorize
      - detect-fabric-stack
    runs-on: ubuntu-latest
    # wait-and-download-fabric-prebuilds polls on-pr-fabric for up to ~2h.
    timeout-minutes: 130
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for fabric-prebuilds from on-pr-fabric
        uses: tetherto/qvac/.github/actions/wait-and-download-fabric-prebuilds@6620d695d3a07cafe3931182e7844dde376a23f8
        with:
          github-token: ${{ github.token }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Re-publish fabric-prebuilds for downstream jobs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: fabric-prebuilds
          path: fabric-prebuilds-staging

  sanity-checks:
    if: needs.ci-router.outputs.run_verified_checks == 'true' && needs.authorize.outputs.allowed == 'true'
    needs:
      - fork-approval
      - authorize
      - ci-router
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
      - name: Run Sanity checks
        uses: ./.github/actions/sanity-checks
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          pat-token: ${{ secrets.GITHUB_TOKEN }}
          run-integration: ${{ needs.authorize.outputs.allowed == 'true' }}
          workdir: packages/vla-ggml

  cpp-lint:
    if: needs.ci-router.outputs.run_verified_checks == 'true' && needs.authorize.outputs.allowed == 'true' && (github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch')
    needs:
      - fork-approval
      - authorize
      - ci-router
    uses: ./.github/workflows/cpp-lint.yaml
    secrets: inherit
    with:
      sha: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
      pr_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      workdir: packages/vla-ggml
      # vla pulls qvac-fabric[hip-backend]; ggml-config find_dependency(hip)
      # needs ROCm on the lint runner at configure time. Harmless after #3998
      # drops the feature; that PR can clear this input.
      include-rocm-sdk: true

  cpp-tests:
    permissions:
      contents: read
      packages: read
      pull-requests: write
      id-token: write # OIDC to pull the GR00T parity model from S3 (cpp-tests-vla)
    # resolve-fabric-prebuilds is skipped on every non-fabric-stack PR, and an
    # if: without a status-check function carries an implicit success() over all
    # of needs — which would skip this job there. always() suppresses it; the
    # sanity-checks gate it also suppresses is restored explicitly below.
    # !cancelled() keeps cancel-in-progress from launching native jobs on a
    # superseded run (always() is true even after the workflow is cancelled).
    if: |
      always() &&
      !cancelled() &&
      needs.sanity-checks.result == 'success' &&
      needs.detect-fabric-stack.result == 'success' &&
      needs.ci-router.outputs.run_cpp_tests == 'true' &&
      needs.authorize.outputs.allowed == 'true' &&
      (needs.detect-fabric-stack.outputs.needs_fabric_artifact != 'true' || needs.resolve-fabric-prebuilds.result == 'success')
    needs:
      - fork-approval
      - authorize
      - sanity-checks
      - ci-router
      - detect-fabric-stack
      - resolve-fabric-prebuilds
    uses: ./.github/workflows/cpp-tests-vla.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      fabric-overlay-artifact: ${{ needs.detect-fabric-stack.outputs.needs_fabric_artifact == 'true' && 'fabric-prebuilds' || '' }}

  ts-checks:
    if: needs.ci-router.outputs.run_verified_checks == 'true' && needs.authorize.outputs.allowed == 'true'
    needs:
      - fork-approval
      - authorize
      - ci-router
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: packages/vla-ggml
        run: npm install --ignore-scripts

      - name: Type declaration check
        working-directory: packages/vla-ggml
        run: npm run test:dts

      - name: Run lint and unit tests
        id: run_lint_and_unit_tests
        uses: ./.github/actions/run-lint-and-unit-tests
        with:
          gpr-token: ${{ secrets.GITHUB_TOKEN }}
          pat-token: ${{ secrets.GITHUB_TOKEN }}
          registry-type: gpr
          workdir: packages/vla-ggml

  detect-native-changes:
    if: needs.ci-router.outputs.run_prebuilds == 'true' && needs.authorize.outputs.allowed == 'true'
    needs: [authorize, ci-router, fork-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native_changed: ${{ steps.detect.outputs.native_changed }}
      native_hash: ${{ steps.detect.outputs.native_hash }}
    steps:
      - name: Checkout composite source (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Detect native file changes
        id: detect
        uses: ./.github/actions/detect-native-changes
        with:
          workdir: packages/vla-ggml

  prebuild-artifact-reuse:
    if: |
      needs.detect-native-changes.outputs.native_changed == 'false' &&
      needs.detect-fabric-stack.outputs.fabric_stack != 'true'
    needs:
      - fork-approval
      - detect-native-changes
      - detect-fabric-stack
      - sanity-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      reuse_hit: ${{ steps.reuse.outputs.reuse_hit }}
    steps:
      - name: Checkout prebuild-artifact-reuse composite (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/prebuild-artifact-reuse
          sparse-checkout-cone-mode: false
      - name: Reuse prebuilds from a prior run
        id: reuse
        uses: ./.github/actions/prebuild-artifact-reuse
        with:
          github-token: ${{ github.token }}
          workflow-file: on-pr-vla.yml
          native-hash: ${{ needs.detect-native-changes.outputs.native_hash }}
          pr-number: ${{ github.event.pull_request.number }}

  prebuild:
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    needs:
      - fork-approval
      - authorize
      - ci-router
      - sanity-checks
      - detect-native-changes
      - detect-fabric-stack
      - resolve-fabric-prebuilds
      - prebuild-artifact-reuse
    if: |
      always() &&
      !cancelled() &&
      needs.sanity-checks.result == 'success' &&
      needs.detect-fabric-stack.result == 'success' &&
      needs.ci-router.outputs.run_prebuilds == 'true' &&
      needs.authorize.outputs.allowed == 'true' &&
      (needs.detect-fabric-stack.outputs.needs_fabric_artifact != 'true' || needs.resolve-fabric-prebuilds.result == 'success') &&
      (needs.detect-native-changes.outputs.native_changed == 'true' || needs.prebuild-artifact-reuse.outputs.reuse_hit != 'true')
    uses: ./.github/workflows/prebuilds-vla.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      fabric-overlay-artifact: ${{ needs.detect-fabric-stack.outputs.needs_fabric_artifact == 'true' && 'fabric-prebuilds' || '' }}

  prebuild-artifact-save:
    if: always() && !cancelled() && needs.prebuild.result == 'success'
    needs: [prebuild, detect-native-changes, fork-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout prebuild-artifact-save composite (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/prebuild-artifact-save
          sparse-checkout-cone-mode: false
      - name: Save reuse marker
        uses: ./.github/actions/prebuild-artifact-save
        with:
          native-hash: ${{ needs.detect-native-changes.outputs.native_hash }}
          pr-number: ${{ github.event.pull_request.number }}

  integration-tests:
    needs:
      - fork-approval
      - authorize
      - prebuild
      - prebuild-artifact-reuse
      - ci-router
      - detect-fabric-stack
      - resolve-fabric-prebuilds
    if: |
      always() &&
      !cancelled() &&
      needs.detect-fabric-stack.result == 'success' &&
      needs.ci-router.outputs.run_desktop == 'true' &&
      needs.authorize.outputs.allowed == 'true' &&
      (needs.detect-fabric-stack.outputs.needs_fabric_artifact != 'true' || needs.resolve-fabric-prebuilds.result == 'success') &&
      (needs.prebuild.result == 'success' || needs.prebuild-artifact-reuse.outputs.reuse_hit == 'true')
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/integration-test-vla.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      fabric-overlay-artifact: ${{ needs.detect-fabric-stack.outputs.needs_fabric_artifact == 'true' && 'fabric-prebuilds' || '' }}

  # Mobile integration tests are no longer run on PRs. They run on demand via
  # `integration-mobile-test-vla.yml` (workflow_dispatch), where the dispatcher
  # must pick a specific device. The `run-mobile-addon-tests` label / ci-router
  # `run_mobile` output are kept for a possible future revival but no longer
  # trigger anything here. (Benchmark / weekend / on-merge mobile runs are
  # unaffected — they call the mobile workflow directly.)

  publish-prebuild-status:
    # Posts qvac/prebuild-vla for Merge Guard's verify-prebuilds; mirrors this flow's build-status.
    needs: [prebuild, prebuild-artifact-reuse, ci-router]
    if: always() && !cancelled() && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      # Trusted base-branch checkout of only the prebuild-status scripts (never
      # PR head code), so publish logic is a single, unit-tested source.
      - name: Checkout prebuild-status scripts (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts/prebuild-status
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Publish prebuild status for Merge Guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREBUILD_RESULT: ${{ needs.prebuild.result }}
          REUSE_HIT: ${{ needs.prebuild-artifact-reuse.outputs.reuse_hit }}
          # A skipped prebuild is only a pass when ci-router succeeded and chose
          # not to build (no label); a skip from an upstream failure fails closed.
          CI_ROUTER_RESULT: ${{ needs.ci-router.result }}
          RUN_PREBUILDS: ${{ needs.ci-router.outputs.run_prebuilds }}
          # Stamps this on-pr run's URL into target_url so Merge Guard can reject a
          # status from a superseded (e.g. pre-label) run whose timestamp looks fresh.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTEXT: qvac/prebuild-vla
        run: node .github/scripts/prebuild-status/publish.mjs

  merge-guard:
    # run-mobile-integration-tests removed — mobile is on-demand only now.
    needs:
      [
        authorize,
        ci-router,
        sanity-checks,
        ts-checks,
        cpp-lint,
        cpp-tests,
        detect-fabric-stack,
        resolve-fabric-prebuilds,
        detect-native-changes,
        prebuild-artifact-reuse,
        prebuild,
        prebuild-artifact-save,
        integration-tests,
        publish-prebuild-status,
      ]
    if: always() && !cancelled()
    uses: ./.github/workflows/public-pr.yml
    permissions:
      contents: read
      pull-requests: write
      packages: read
    with:
      sanity-checks-status: ${{ needs.detect-fabric-stack.result != 'failure' && (needs.detect-fabric-stack.outputs.needs_fabric_artifact != 'true' || needs.resolve-fabric-prebuilds.result == 'success') && needs.sanity-checks.result == 'success' && needs.ts-checks.result == 'success' && (needs.cpp-lint.result == 'success' || needs.cpp-lint.result == 'skipped') && (needs.cpp-tests.result == 'success' || needs.cpp-tests.result == 'skipped') }}
      build-status: ${{ needs.detect-fabric-stack.result != 'failure' && (needs.detect-fabric-stack.outputs.needs_fabric_artifact != 'true' || needs.resolve-fabric-prebuilds.result == 'success') && (needs.prebuild.result == 'success' || needs.prebuild.result == 'skipped' || needs.prebuild-artifact-reuse.outputs.reuse_hit == 'true') }}
      integration-tests-status: ${{ needs.detect-fabric-stack.result != 'failure' && (needs.detect-fabric-stack.outputs.needs_fabric_artifact != 'true' || needs.resolve-fabric-prebuilds.result == 'success') && (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') }}
