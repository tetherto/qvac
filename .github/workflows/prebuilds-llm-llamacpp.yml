# Build-only workflow. Publishing is handled by on-merge-llm-llamacpp.yml
name: Prebuilds (LLM)

on:
  workflow_dispatch:
    inputs:
      vk-profiling:
        type: boolean
        default: false
      workdir:
        description: "Working directory (optional)"
        required: false
        type: string
        default: "packages/llm-llamacpp"

  workflow_call:
    inputs:
      ref:
        description: "ref"
        type: string
        required: false
      repository:
        type: string
        required: false
        default: "tetherto/qvac"
      vk-profiling:
        description: "Enable Vulkan profiling"
        type: boolean
        required: false
        default: false
      workdir:
        description: "Working directory (optional)"
        required: false
        type: string
        default: "packages/llm-llamacpp"

permissions:
  contents: read

jobs:
  prebuild:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/reusable-prebuilds.yml
    with:
      workdir: ${{ inputs.workdir }}
      ref: ${{ inputs.ref }}
      repository: ${{ inputs.repository }}
      artifact-name-prefix: llama-cpp-
      include-vulkan-sdk: true
      # QVAC-23763: cuda-backend hard-errors without nvcc, so linux needs the
      # toolkit. Compile-only, no NVIDIA GPU required.
      include-cuda: true
      # QVAC-24442: the vcpkg manifest gates cuda-backend on `linux`, not
      # `linux & x64`, so the arm64 job needs the sbsa toolkit for the same
      # reason. Without it arm64 hard-errors on the missing nvcc.
      include-cuda-arm64: true
      extra-cmake-defines: ${{ inputs.vk-profiling && '-D VK_PROFILING=ON' || '' }}
    secrets: inherit
