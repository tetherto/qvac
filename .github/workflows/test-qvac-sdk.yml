# QVAC SDK Desktop Tests
# Uses reusable workflow from qvac-test-suite
# Originally from qvac-sdk/.github/workflows/qvac-tests.yml

name: QVAC Tests (Qvac-sdk)

on:
  push:
    branches: [main, dev]
    paths:
      - "packages/qvac-sdk/**"
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
    paths:
      - "packages/qvac-sdk/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  desktop-tests:
    uses: ./.github/workflows/reusable-test-desktop.yml
    with:
      working-directory: "packages/qvac-sdk/tests-qvac"
      platforms: '["ai-run-linux-gpu", "macos-latest-xlarge", "ai-run-windows-gpu"]'
      consumer-timeout: 60
    secrets:
      MQTT_PROTOCOL: ${{ secrets.MQTT_PROTOCOL }}
      MQTT_HOST: ${{ secrets.MQTT_HOST }}
      MQTT_PORT: ${{ secrets.MQTT_PORT }}
      MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
      MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
      MQTT_CA_CERT: ${{ secrets.MQTT_CA_CERT }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
