name: CPP Tests (LLM)

on:
  workflow_dispatch:
    inputs:
      workdir:
        description: "Working directory"
        type: string
        required: false
        default: "packages/llm-llamacpp"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        type: string
        required: false
      repository:
        description: "Repository to checkout"
        type: string
        required: false
      workdir:
        description: "Working directory"
        type: string
        required: false
        default: "packages/llm-llamacpp"
      fabric-overlay-artifact:
        description: >-
          Workflow-run artifact name for PR-built @qvac/fabric prebuilds. Empty
          skips the overlay (published npm baseline).
        type: string
        required: false
        default: ""

permissions:
  contents: read

# The group is spelled out rather than using github.workflow, which in a called
# workflow resolves to the CALLER's name -- that would collide with the caller's
# own group and with the on-merge cache workflow's. Not keyed on github.ref alone
# either: the pull_request_target caller sets it to the base branch, so every
# in-flight LLM PR would share one group. PR number keeps them independent;
# github.ref serialises dispatch, push and schedule runs, which is wanted because
# those are the ones that write the cache.
concurrency:
  group: cpp-tests-llm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  test-cpp:
    needs: runner_names
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            runner: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64 }}
            arch: x64
          - os: macos-15-xlarge
            platform: darwin
            runner: ${{ needs.runner_names.outputs.macos_arm64_gpu }}
            arch: arm64
          - os: windows-2025
            platform: windows
            runner: ${{ needs.runner_names.outputs.win_2025_x64 }}
            arch: x64

    runs-on: ${{ matrix.runner || matrix.os }}
    # Bounds a cold-cache run; warm legs are far under this.
    timeout-minutes: 120
    environment: release
    name: cpp-tests-${{ matrix.platform }}-${{ matrix.arch || 'x64' }}

    env:
      WORKDIR: ${{ inputs.workdir }}
      GIT_TERMINAL_PROMPT: "0"

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - if: ${{ matrix.os == 'windows-2025' }}
        name: Set Vulkan SDK Path on Windows
        working-directory: ${{ env.WORKDIR }}
        run: echo "VULKAN_SDK=C:\VulkanSDK" >> $Env:GITHUB_ENV


      - name: Setup vcpkg
        uses: tetherto/qvac/.github/actions/setup-vcpkg@10ae9f571c61ad94348ebbe8daaef67641ae8855
        env:
          MODEL_S3_BUCKET: ${{ secrets.MODEL_S3_BUCKET }}
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}

      # Resolves to a host-wide directory on self-hosted runners (shared by every
      # runner instance on the box, survives the workspace wipe) and to the
      # workspace on GitHub-hosted ones, where actions/cache below carries it.
      # Must come after setup-vcpkg, which writes VCPKG_BINARY_SOURCES itself.
      - name: Point vcpkg at its binary cache
        uses: ./.github/actions/vcpkg-binary-cache-dir
        with:
          workdir: ${{ env.WORKDIR }}
          trusted: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || github.event_name == 'schedule') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.ref == '' || inputs.ref == github.ref_name) && (inputs.repository == '' || inputs.repository == github.repository) }}

      - name: Cleanup vcpkg
        shell: bash
        run: |
          rm -rf $VCPKG_ROOT/buildtrees/*
          rm -rf $VCPKG_ROOT/packages/*

      - if: ${{ matrix.os == 'windows-2025' }}
        name: Configure CMake generator on Windows
        shell: powershell
        working-directory: ${{ env.WORKDIR }}
        run: |
          echo "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV
          echo "CMAKE_GENERATOR_PLATFORM=x64" >> $env:GITHUB_ENV

      # Exports TOOLCHAIN_FINGERPRINT for the cache key below. Must run before
      # both cache steps. See the action for why the key cannot omit it.
      - name: Fingerprint the toolchain
        uses: ./.github/actions/vcpkg-toolchain-fingerprint

      # Restore only. The save sits below the build because a run that
      # restores from the host layer compiles nothing, and would otherwise
      # save an EMPTY entry over the shared key, making every other host
      # rebuild. Seen as `Sent 208 of 208` on a warm windows box.
      - name: Get vcpkg cache (restore)
        id: vcpkg-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          key: cpp-tests-v6-llm-${{ matrix.platform }}-${{ matrix.arch || 'x64' }}-${{ hashFiles(format('{0}/vcpkg.json', inputs.workdir), format('{0}/vcpkg-configuration.json', inputs.workdir), 'vcpkg-overlays/triplets/**', 'vcpkg-overlays/toolchains/**') }}-${{ env.TOOLCHAIN_FINGERPRINT }}
          path: ${{ env.WORKDIR }}/vcpkg/cache

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Install NPM dependencies
        working-directory: ${{ env.WORKDIR }}
        run: |
          npm install

      - name: Download fabric-prebuilds for overlay
        if: ${{ inputs.fabric-overlay-artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ inputs.fabric-overlay-artifact }}
          path: ${{ runner.temp }}/fabric-prebuilds

      - name: Overlay PR @qvac/fabric prebuilds
        if: ${{ inputs.fabric-overlay-artifact != '' }}
        uses: tetherto/qvac/.github/actions/overlay-local-fabric@6620d695d3a07cafe3931182e7844dde376a23f8
        with:
          workdir: ${{ env.WORKDIR }}
          prebuilds-root: ${{ runner.temp }}/fabric-prebuilds
          # The matrix names the Windows row `windows`, but the fabric prebuilds
          # bundle names that directory `win32-x64` (reusable-prebuilds.yml), and
          # overlay-local-fabric concatenates `${PLATFORM}-${ARCH}` verbatim.
          platform: ${{ matrix.platform == 'windows' && 'win32' || matrix.platform }}
          arch: ${{ matrix.arch || 'x64' }}

      - name: Install bare tooling
        run: npm install -g --force bare bare-make

      - name: Cache C++ test models
        id: model-cache
        if: startsWith(matrix.runner, 'qvac-')
        uses: ./.github/actions/cache-models
        with:
          package: llm-llamacpp
          paths: packages/llm-llamacpp/models/unit-test
          hash-files-glob: packages/llm-llamacpp/scripts/download-unit-test-models.js
          # The C++ unit tests load none of the integration models.
          warm: 'false'

      - name: Download test models
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: |
          npm run test:cpp:models:ci

          echo "Verify downloaded models..."
          ls -lh models/unit-test/
          du -sh models/unit-test/*

      - if: ${{ matrix.platform == 'darwin' }}
        name: Use Apple clang for Apple platform builds
        run: |
          sudo mv /opt/homebrew/opt/llvm@18 /opt/homebrew/opt/llvm@18.bak 2>/dev/null || true
          sudo mv /opt/homebrew/opt/llvm /opt/homebrew/opt/llvm.bak 2>/dev/null || true
          sudo rm -f /opt/homebrew/bin/clang /opt/homebrew/bin/clang++ 2>/dev/null || true

      - name: Build C++ tests with coverage
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        working-directory: ${{ env.WORKDIR }}
        run: npm run coverage:cpp:build

      - name: Build C++ tests
        if: ${{ matrix.os != 'ubuntu-24.04' }}
        working-directory: ${{ env.WORKDIR }}
        run: npm run test:cpp:build

      # Workspace -> host ONLY. vcpkg already wrote this run's compiled archives
      # to the host layer (it is `write` there for trusted events); this adds the
      # ones that came from the keyed entry rather than from a compile, so a
      # trusted run warms a cold host even when it builds nothing.
      #
      # The host -> workspace direction is deliberately absent. The host path has
      # no package component, so copying it in would put every addon's archives
      # into this package's entry and every PR leg would download the union.
      # Nothing is lost by dropping it: a trusted run cannot read the host layer,
      # so if its keyed entry is gone it compiles and the save recreates the
      # entry from that build.
      #
      # Temp-then-mv because other instances read this dir concurrently; umask
      # 000 because 1777 on the root is not inherited by vcpkg's bucket dirs.
      - name: Sync the host and workspace vcpkg caches
        if: >-
          env.VCPKG_CACHE_PERSISTENT == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || github.event_name == 'schedule') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.ref == '' || inputs.ref == github.ref_name) && (inputs.repository == '' || inputs.repository == github.repository)
        shell: bash
        run: |
          set +e
          host_dir=$(echo "${VCPKG_BINARY_SOURCES}" | tr ';' '\n' | grep '^files,' | head -n 1 | cut -d, -f2)
          ws_dir="${VCPKG_CACHE_DIR}"
          # Windows hands these over with backslashes, which this shell cannot
          # traverse; cygpath is present in the runner's Git bash.
          if command -v cygpath > /dev/null 2>&1; then
            host_dir=$(cygpath -u "${host_dir}" 2>/dev/null || echo "${host_dir}")
            ws_dir=$(cygpath -u "${ws_dir}" 2>/dev/null || echo "${ws_dir}")
          fi
          echo "sync: host=${host_dir} workspace=${ws_dir}"
          [ -n "${host_dir}" ] && [ -d "${host_dir}" ] || { echo "sync: no host dir"; exit 0; }
          [ "${host_dir}" = "${ws_dir}" ] && exit 0
          mkdir -p "${ws_dir}"
          umask 000

          sync_dir() {
            find "$1" -type f 2>/dev/null | while read -r f; do
              out="$2/${f#$1/}"
              [ -f "$out" ] && continue
              mkdir -p "$(dirname "$out")" 2>/dev/null
              tmp="$out.tmp.$$"
              cp "$f" "$tmp" 2>/dev/null && mv -f "$tmp" "$out" 2>/dev/null
              rm -f "$tmp" 2>/dev/null
            done
          }
          sync_dir "${ws_dir}" "${host_dir}"

          echo "sync: host=$(find "${host_dir}" -type f 2>/dev/null | wc -l) archives, workspace=$(find "${ws_dir}" -type f 2>/dev/null | wc -l)"
          exit 0

      # Only trusted events may write the shared cache (see .github/AGENTS.md),
      # and only when there are archives to write: hashFiles is empty for an
      # empty directory.
      - name: Save vcpkg cache (trusted contexts)
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || github.event_name == 'schedule') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.ref == '' || inputs.ref == github.ref_name) && (inputs.repository == '' || inputs.repository == github.repository) &&
          hashFiles(format('{0}/vcpkg/cache/**', env.WORKDIR)) != ''
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
          path: ${{ env.WORKDIR }}/vcpkg/cache

      - name: Run C++ tests
        id: cpp-tests
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: |
          # scripts/run-cpp-tests.js applies the fabric-boundary ASAN_OPTIONS
          # (alloc_dealloc_mismatch=0:detect_leaks=0) and points LSAN_OPTIONS at
          # the checked-in suppressions file. addon-test links ASan but dlopens
          # the non-ASan, -static-libstdc++ @qvac/fabric prebuild; cross-module
          # new/delete and fabric's long-lived runtime allocations would
          # otherwise abort after gtest already passed. See
          # test/unit/CMakeLists.txt.
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ]; then
            npm run coverage:cpp:run:ci
          else
            npm run test:cpp:run:ci
          fi

          if [ -f build/test/unit/cpp-test-results.xml ]; then
            test_count=$(grep -c '<testcase' build/test/unit/cpp-test-results.xml || echo "0")
            if [ "$test_count" -eq 0 ]; then
              echo "ERROR: No tests were executed! Test count: $test_count"
              exit 1
            fi
            echo "✓ Successfully executed $test_count test(s)"
          else
            echo "ERROR: Test results file not generated"
            exit 1
          fi

      - name: Generate Coverage Report
        if: ${{ always() && !cancelled() && matrix.os == 'ubuntu-24.04' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          npm run coverage:cpp:report
          COVERAGE=$(grep 'TOTAL' build/test/unit/coverage-summary.txt | awk '{print $10}' || echo "0.0")
          echo "LINE_COVERAGE_PERCENTAGE=${COVERAGE}" >> $GITHUB_ENV

      - name: Archive Coverage Results
        if: ${{ always() && !cancelled() && matrix.os == 'ubuntu-24.04' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: cpp-coverage-report-${{ matrix.platform }}-${{ matrix.arch || 'x64' }}
          path: |
            ${{ env.WORKDIR }}/build/test/unit/coverage-html/
            ${{ env.WORKDIR }}/build/test/unit/lcov.info
            ${{ env.WORKDIR }}/build/test/unit/coverage-summary.txt
            ${{ env.WORKDIR }}/build/test/unit/cpp-test-results.xml
          retention-days: 30


      - name: Coverage Summary
        if: ${{ always() && !cancelled() && matrix.os == 'ubuntu-24.04' }}
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: |
          echo "## 🎯 C++ Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Coverage:** ${{ env.LINE_COVERAGE_PERCENTAGE }}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f build/test/unit/coverage-summary.txt ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat build/test/unit/coverage-summary.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
