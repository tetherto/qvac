name: CPP Tests (Model Fit)

on:
  workflow_call:
    inputs:
      ref:
        description: "ref"
        type: string
        required: false
      repository:
        type: string
        required: false
      workdir:
        description: "Working directory"
        type: string
        required: false
        default: "packages/model-fit"
      fabric-overlay-artifact:
        description: >-
          Workflow-run artifact name for PR-built @qvac/fabric prebuilds. Empty
          skips the overlay (published npm baseline).
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to test"
        type: string
        required: false
        default: "main"
      workdir:
        description: "Working directory"
        type: string
        required: false
        default: "packages/model-fit"

# The group is spelled out rather than using github.workflow, which in a called
# workflow resolves to the CALLER's name -- that would collide with the caller's
# own group and with the on-merge cache workflow's. Not keyed on github.ref alone
# either: under pull_request_target that is the base branch, so every in-flight PR
# would share one group. PR number keeps them independent; github.ref serialises
# the events that write the cache.
concurrency:
  group: cpp-tests-model-fit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  run-cpp-tests:
    # Bounds a cold-cache run; warm legs are far under this.
    timeout-minutes: 120
    needs: runner_names
    runs-on: ${{ matrix.runner || matrix.os }}
    environment: release
    name: ${{ matrix.platform }}-${{ matrix.arch || 'x64' }}-cpp-tests
    permissions:
      contents: read
      packages: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            runner: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64 }}
          - os: macos-14
            platform: darwin
            arch: arm64
            runner: ${{ needs.runner_names.outputs.macos_arm64_gpu }}
          - os: macos-15-intel
            runner: ${{ needs.runner_names.outputs.macos_15_intel }}
            platform: darwin
            arch: x64
          - os: windows-2025
            platform: windows
            arch: x64
            runner: ${{ needs.runner_names.outputs.win_2025_x64 }}

    env:
      WORKDIR: ${{ inputs.workdir }}
      GIT_TERMINAL_PROMPT: "0"

    steps:
      - name: Echo workflow inputs
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref || github.ref }}
          INPUT_REPO: ${{ inputs.repository || github.repository }}
          INPUT_WORKDIR: ${{ env.WORKDIR }}
        run: |
          echo "ref=$INPUT_REF"
          echo "repository=$INPUT_REPO"
          echo "workdir=$INPUT_WORKDIR"

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install NPM dependencies
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: npm install

      - name: Download fabric-prebuilds for overlay
        if: ${{ inputs.fabric-overlay-artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ inputs.fabric-overlay-artifact }}
          path: ${{ runner.temp }}/fabric-prebuilds

      - name: Overlay PR @qvac/fabric prebuilds
        if: ${{ inputs.fabric-overlay-artifact != '' }}
        uses: tetherto/qvac/.github/actions/overlay-local-fabric@6620d695d3a07cafe3931182e7844dde376a23f8
        with:
          workdir: ${{ env.WORKDIR }}
          prebuilds-root: ${{ runner.temp }}/fabric-prebuilds
          platform: ${{ matrix.platform == 'windows' && 'win32' || matrix.platform }}
          arch: ${{ matrix.arch }}

      - name: Install bare tooling
        run: npm install -g --force bare bare-make

      - if: ${{ matrix.os == 'windows-2025' }}
        name: Set Vulkan SDK Path on Windows Server 2025
        working-directory: ${{ env.WORKDIR }}
        run: echo "VULKAN_SDK=C:\VulkanSDK" >> $Env:GITHUB_ENV

      - name: Setup vcpkg
        uses: tetherto/qvac/.github/actions/setup-vcpkg@10ae9f571c61ad94348ebbe8daaef67641ae8855
        env:
          MODEL_S3_BUCKET: ${{ secrets.MODEL_S3_BUCKET }}
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}

      # Must come after setup-vcpkg, which writes this same variable to
      # $GITHUB_ENV and would otherwise win. `clear;` drops its S3 source, which
      # this job has no credentials for.
      - name: Point vcpkg at the cached binary directory
        if: ${{ matrix.os != 'windows-2025' }}
        shell: bash
        run: |
          set -euo pipefail
          # $WORKDIR reaches $GITHUB_ENV unescaped, so a newline in it would
          # inject further variables. setup-vcpkg guards its own inputs the same way.
          if [[ ! "$WORKDIR" =~ ^packages/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::unexpected workdir: $WORKDIR"
            exit 1
          fi
          echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/$WORKDIR/vcpkg/cache,readwrite" >> "$GITHUB_ENV"

      # Native path required: a mixed-separator path resolves elsewhere and
      # vcpkg silently finds nothing.
      - name: Point vcpkg at the cached binary directory (Windows)
        if: ${{ matrix.os == 'windows-2025' }}
        shell: powershell
        run: |
          if ($env:WORKDIR -notmatch '^packages/[A-Za-z0-9._-]+$') {
            Write-Output "::error::unexpected workdir: $env:WORKDIR"
            exit 1
          }
          $cacheDir = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE (Join-Path $env:WORKDIR 'vcpkg/cache')))
          echo "VCPKG_BINARY_SOURCES=clear;files,$cacheDir,readwrite" >> $env:GITHUB_ENV

      - name: Cleanup vcpkg
        shell: bash
        run: |
          rm -rf $VCPKG_ROOT/buildtrees/*
          rm -rf $VCPKG_ROOT/packages/*

      - if: ${{ matrix.os == 'windows-2025' }}
        name: Configure CMake generator on Windows
        shell: powershell
        run: |
          echo "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV
          echo "CMAKE_GENERATOR_PLATFORM=x64" >> $env:GITHUB_ENV

      - name: Create vcpkg cache location (package-local)
        shell: bash
        run: mkdir -p "${{ env.WORKDIR }}/vcpkg/cache"

      # This job runs PR-head code, so only trusted events may write the shared
      # cache (.cursor/rules/devops/github-actions.mdc:82). No restore-keys: a
      # prefix match would re-save the previous entry's archives and grow without
      # bound. The key cannot cover the runner image's compiler: a toolchain bump
      # there gives an exact hit whose contents all miss, and actions/cache skips
      # the save on an exact hit -- bump `v6` to recover.
      - name: Get vcpkg cache (restore + save, trusted contexts)
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'merge_group' ||
          github.event_name == 'schedule'
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          key: >-
            cpp-tests-v6-model-fit-${{ matrix.platform }}-${{ matrix.arch || 'x64' }}-${{
              hashFiles(
                format('{0}/vcpkg.json', inputs.workdir),
                format('{0}/vcpkg-configuration.json', inputs.workdir),
                'vcpkg-overlays/triplets/**',
                'vcpkg-overlays/toolchains/**'
              )
            }}
          path: ${{ env.WORKDIR }}/vcpkg/cache

      - name: Get vcpkg cache (restore-only, untrusted contexts)
        if: >-
          github.event_name != 'push' &&
          github.event_name != 'workflow_dispatch' &&
          github.event_name != 'merge_group' &&
          github.event_name != 'schedule'
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          key: >-
            cpp-tests-v6-model-fit-${{ matrix.platform }}-${{ matrix.arch || 'x64' }}-${{
              hashFiles(
                format('{0}/vcpkg.json', inputs.workdir),
                format('{0}/vcpkg-configuration.json', inputs.workdir),
                'vcpkg-overlays/triplets/**',
                'vcpkg-overlays/toolchains/**'
              )
            }}
          path: ${{ env.WORKDIR }}/vcpkg/cache

      - if: ${{ matrix.platform == 'darwin' }}
        name: Use Apple clang for Apple platform builds
        run: |
          sudo mv /opt/homebrew/opt/llvm@18 /opt/homebrew/opt/llvm@18.bak 2>/dev/null || true
          sudo mv /opt/homebrew/opt/llvm /opt/homebrew/opt/llvm.bak 2>/dev/null || true
          sudo rm -f /opt/homebrew/bin/clang /opt/homebrew/bin/clang++ 2>/dev/null || true

      # The three unit targets sit behind BUILD_TESTING, which defaults to OFF.
      # `test:cpp:build` is the only thing that turns it on, so it is also what
      # puts these translation units into compile_commands.json for cpp-lint.
      - name: Build C++ tests
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: npm run test:cpp:build

      - name: Run C++ tests
        id: cpp-tests
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          set -euo pipefail
          npm run test:cpp:run
