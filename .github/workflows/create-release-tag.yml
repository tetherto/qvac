name: Create Release Tag

# Creates a git tag for a published package WITHOUT creating a GitHub Release.
# Only the SDK publishes GitHub Releases (see publish-sdk.yml /
# create-github-release.yml); every other package just gets a version tag for
# traceability, keeping the Releases page focused on the SDK.
#
# Signing: the tag is created as an annotated tag object via the REST API using
# the default GITHUB_TOKEN (which authenticates as the github-actions[bot]
# GitHub App). When the request carries no custom tagger/signature, GitHub signs
# the object server-side with its web-flow key and marks it "Verified" -- no PAT
# and no signing key on the runner. The step reads the verification result back
# and warns (without failing) if GitHub did not sign it.

on:
  workflow_call:
    inputs:
      repo_name:
        description: "Tag prefix; tag is '<repo_name>-v<published_version>' unless tag_name is set"
        required: false
        type: string
      published_version:
        description: "Version published in the publish workflow (tagging is skipped when empty)"
        required: false
        type: string
      tag_name:
        description: "Optional explicit tag name; overrides the '<repo_name>-v<published_version>' default"
        required: false
        type: string

permissions:
  contents: read

jobs:
  create-tag:
    if: inputs.published_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create signed git tag (no GitHub Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ inputs.repo_name }}
          PUBLISHED_VERSION: ${{ inputs.published_version }}
          TAG_OVERRIDE: ${{ inputs.tag_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "${TAG_OVERRIDE}" ]; then
            tag="${TAG_OVERRIDE}"
          else
            if [ -z "${REPO_NAME}" ]; then
              echo "::error::Either repo_name or tag_name must be provided"
              exit 1
            fi
            tag="${REPO_NAME}-v${PUBLISHED_VERSION}"
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; nothing to do."
            exit 0
          fi

          # Create an ANNOTATED tag object with no tagger/signature so GitHub
          # web-flow signs it as github-actions[bot]. A lightweight ref-only tag
          # has no object to sign and could never be "Verified".
          tag_sha=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="${tag}" \
            -f message="Release ${tag}" \
            -f object="${TARGET_SHA}" \
            -f type="commit" \
            --jq '.sha')

          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" \
            -f sha="${tag_sha}"

          verified=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.verified')
          reason=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.reason')

          echo "Created tag ${tag} -> ${TARGET_SHA} (object ${tag_sha}); verified=${verified} (${reason})"
          {
            echo "## Release tag created"
            echo ""
            echo "- Tag: \`${tag}\`"
            echo "- Commit: \`${TARGET_SHA}\`"
            echo "- Verified: \`${verified}\` (${reason})"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${verified}" != "true" ]; then
            echo "::warning title=Tag not signed::GitHub did not sign tag ${tag} (reason: ${reason}). The tag was created but is not Verified."
          fi
