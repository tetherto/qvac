name: Test pipeline for PRs (Inference-addon-cpp)

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "packages/inference-addon-cpp/**"
      - ".github/workflows/pr-test-inference-addon-cpp-js.yml"
      - ".github/workflows/pr-test-inference-addon-cpp.yml"
  workflow_dispatch:


# Canonical runner labels — .github/actions/runner-names/runners.yaml
env:
  RN_ORCH: ubuntu-latest
  RN_U22: ubuntu-22.04
  RN_U24: ubuntu-24.04
  RN_U22_ARM: ubuntu-22.04-arm
  RN_U24_ARM: ubuntu-24.04-arm
  RN_MAC14: macos-14
  RN_MAC14_XL: macos-14-xlarge
  RN_MAC15: macos-15
  RN_MAC15_INTEL: macos-15-intel
  RN_MAC15_LG: macos-15-large
  RN_MAC15_XL: macos-15-xlarge
  RN_WIN22: windows-2022
  RN_WIN25: windows-2025
  RN_QVAC_U22: qvac-ubuntu2204-x64
  RN_QVAC_U22_GPU: qvac-ubuntu2204-x64-gpu
  RN_QVAC_U24: qvac-ubuntu2404-x64
  RN_QVAC_U24_GPU: qvac-ubuntu2404-x64-gpu
  RN_QVAC_WIN25: qvac-win25-x64
  RN_QVAC_WIN25_GPU: qvac-win25-x64-gpu
  RN_AI_LINUX: ai-run-linux
  RN_AI_LINUX_GPU: ai-run-linux-gpu
  RN_AI_U22: ai-run-ubuntu-22.04
  RN_AI_WIN11_GPU: ai-run-windows11-gpu
  RN_GEN_WIN11: generator-windows11
  RN_MINI_M4: mac-mini-m4
  RN_MINI_M4_GPU: mac-mini-m4-gpu
  RN_LBL_U22_X64: ubuntu-22.04-x64
  RN_LBL_U22_X64_GPU: ubuntu-22.04-x64-gpu
  RN_LBL_U24_X64: ubuntu-24.04-x64
  RN_LBL_U24_X64_GPU: ubuntu-24.04-x64-gpu
  RN_LBL_U24_ARM64: ubuntu-24.04-arm64
  RN_LBL_WIN22_X64: windows-2022-x64
  RN_LBL_WIN25_X64: windows-2025-x64
  RN_LBL_WIN25_X64_GPU: windows-2025-x64-gpu
  PKG_DIR: packages/inference-addon-cpp
  VCPKG_CACHE_DIR: ${{ github.workspace }}/packages/inference-addon-cpp/vcpkg/cache
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/packages/inference-addon-cpp/vcpkg/cache,read"

jobs:
  authorize:
    runs-on: ${{ env.RN_ORCH }}
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      - name: Authorize native tests
        id: auth
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          HAS_VERIFIED_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'verified') }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fork sync: deny pending re-review. label-gate (in sibling pull_request_target
          # workflows) will strip 'verified' shortly anyway; this just makes the native
          # matrix skip immediately rather than racing the strip.
          if [ "$IS_FORK" = "true" ] && [ "$ACTION" = "synchronize" ]; then
            echo "::notice::Fork PR synchronize: native tests skipped pending re-application of 'verified'."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HAS_VERIFIED_LABEL" = "true" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::Native tests require the 'verified' label. A trusted reviewer must apply it after reviewing the diff."
          echo "allowed=false" >> "$GITHUB_OUTPUT"

  run-unit-tests:
    if: needs.authorize.outputs.allowed == 'true'
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ${{ env.RN_U22 }}
            platform: linux
            arch: x64
            runner: ${{ env.RN_QVAC_U22 }}
          - os: ${{ env.RN_U22 }}
            platform: android
            arch: arm64
            flags: -D ANDROID_STL=c++_shared
            runner: ${{ env.RN_QVAC_U22 }}
          - os: ${{ env.RN_MAC14 }}
            platform: ios
            arch: arm64
          - os: ${{ env.RN_MAC14 }}
            platform: ios
            arch: arm64
            tags: -simulator
            flags: --simulator
          - os: ${{ env.RN_MAC14 }}
            platform: darwin
            arch: arm64
          - os: ${{ env.RN_WIN25 }}
            platform: win32
            arch: x64
            runner: ${{ env.RN_QVAC_WIN25 }}
    runs-on: ${{ matrix.runner || matrix.os }}
    name: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: yamlfmt
        uses: ./.github/actions/yamlfmt
        with:
          workdir: ${{ env.PKG_DIR }}

      - if: ${{ matrix.os == env.RN_U22 }}
        name: Maximize build space
        run: |
          sudo docker image prune --all --force
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/dotnet

      - if: ${{ matrix.os == env.RN_U22 && matrix.arch == 'arm64' }}
        name: Install tooling for cross compilation - ubuntu arm64
        run: |
          sudo apt update
          sudo apt install gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross lld

      - if: ${{ matrix.os == env.RN_WIN25 }}
        name: setup cmake windows
        run: |
          cd ..
          Invoke-WebRequest https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip -OutFile cmake-3.31.6-windows-x86_64.zip
          Expand-Archive cmake-3.31.6-windows-x86_64.zip -DestinationPath $pwd
          $env:CMAKE_BIN = ("$(pwd)" -replace '\\', '/') + '/cmake-3.31.6-windows-x86_64/bin'
          echo $env:CMAKE_BIN > temp
          cat $env:GITHUB_PATH >> temp
          mv temp $env:GITHUB_PATH -Force

      - if: ${{ matrix.os == env.RN_MAC14 }}
        name: setup cmake macos
        run: |
          cd ..
          wget https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz
          tar -xvzf cmake-3.31.6-macos-universal.tar.gz
          echo $(pwd)/cmake-3.31.6-macos-universal/bin > temp
          cat $GITHUB_PATH >> temp
          mv temp $GITHUB_PATH

      - if: ${{ matrix.os == env.RN_MAC14 }}
        name: Install vcpkg in macos
        run: |
          cd ..
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg && ./bootstrap-vcpkg.sh -disableMetrics
          VCPKG_ROOT=$(pwd)
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV
          echo "$VCPKG_ROOT" >> $GITHUB_PATH

      - if: ${{ matrix.os == env.RN_U22 }}
        name: Configure vcpkg in linux
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

      - if: ${{ matrix.os == env.RN_WIN25 }}
        name: Configure vcpkg in windows
        run: echo ("VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" -replace '\\', '/') >> $env:GITHUB_ENV

      - if: ${{ matrix.os == env.RN_U22 || matrix.os == env.RN_WIN25 }}
        name: Cleanup vcpkg
        shell: bash
        run: |
          rm -rf $VCPKG_ROOT/buildtrees/*
          rm -rf $VCPKG_ROOT/packages/*

      - if: ${{ matrix.os == env.RN_WIN25 }}
        name: Configure cmake generator in windows
        run: echo "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV

      - if: ${{ matrix.os == env.RN_WIN25 && matrix.arch == 'x64' }}
        run: echo "CMAKE_GENERATOR_PLATFORM=x64" >> $env:GITHUB_ENV

      - if: ${{ matrix.os == env.RN_WIN25 && matrix.arch == 'arm64' }}
        run: echo "CMAKE_GENERATOR_PLATFORM=ARM64" >> $env:GITHUB_ENV

      - if: ${{ matrix.platform == 'android' }}
        name: Configure runner for cross compilation - android
        run: |
          echo "ANDROID_TOOLCHAIN_ROOT=$(echo $ANDROID_NDK_HOME)/toolchains/llvm/prebuilt/linux-x86_64" >> $GITHUB_ENV
          echo "ANDROID_NATIVE_API_LEVEL=34" >> $GITHUB_ENV

      - name: Create vcpkg cache location
        run: mkdir -p "${{ env.PKG_DIR }}/vcpkg/cache"

      - name: Get vcpkg cache
        id: cache-vcpkg
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('packages/inference-addon-cpp/vcpkg.json', 'packages/inference-addon-cpp/vcpkg-configuration.json', 'packages/inference-addon-cpp/vcpkg/ports/**') }}
          path: ${{ env.PKG_DIR }}/vcpkg/cache

      - name: Generate buildsystem
        working-directory: ${{ env.PKG_DIR }}
        run: cmake --preset default -D BUILD_TESTING=ON -S . -B build

      - name: Build
        working-directory: ${{ env.PKG_DIR }}
        run: cmake --build build

      - name: Run unit tests
        working-directory: ${{ env.PKG_DIR }}/build
        run: ctest --rerun-failed --output-on-failure --timeout 35

      - name: Debug build
        working-directory: ${{ env.PKG_DIR }}
        run: cmake --preset default -D BUILD_TESTING=ON -D CMAKE_BUILD_TYPE=Debug -S . -B build && cmake --build build

