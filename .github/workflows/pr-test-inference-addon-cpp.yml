name: Test pipeline for PRs (Inference-addon-cpp)

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
    paths:
      - "packages/inference-addon-cpp/**"
      - ".github/workflows/pr-test-inference-addon-cpp-js.yml"
      - ".github/workflows/pr-test-inference-addon-cpp.yml"
  workflow_dispatch:

env:
  PKG_DIR: packages/inference-addon-cpp
  VCPKG_CACHE_DIR: ${{ github.workspace }}/packages/inference-addon-cpp/vcpkg/cache
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/packages/inference-addon-cpp/vcpkg/cache,read"

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      # SHA-bound fork approval. Reads the `qvac/fork-verified` commit status that
      # the sibling pull_request_target label-gate records on the EXACT SHA a
      # merge/release member approved. Gating self-hosted fork runs on this status
      # (not a stale label) is what stops a draft->ready / close->reopen flip — or
      # any later push — from running a new, unapproved SHA. Read-only: no secrets,
      # `statuses: read` only. See .cursor/rules/devops/github-actions.mdc
      # "CI trust policy for fork PRs".
      - name: Resolve SHA-bound fork approval
        id: approved
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STATUS_CONTEXT: qvac/fork-verified
        run: |
          approved=false
          if [ -n "$HEAD_SHA" ]; then
            state=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/statuses" \
              --jq "map(select(.context == \"${STATUS_CONTEXT}\"))[0].state // \"\"" \
              2>/dev/null || echo "")
            if [ "$state" = "success" ]; then approved=true; fi
          fi
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
      - name: Authorize native tests
        id: auth
        env:
          EVENT: ${{ github.event_name }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HAS_RUN_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-cpp-addon-tests') }}
          HAS_APPROVED_SHA: ${{ steps.approved.outputs.approved }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$IS_DRAFT" = "true" ]; then
            echo "::notice::Draft PR: native tests skipped until ready-for-review."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Internal same-repo PRs are trusted without 'verified', but native
          # tests remain opt-in behind their dedicated capacity-control label.
          if [ "$IS_FORK" = "false" ]; then
            echo "allowed=$HAS_RUN_LABEL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # External fork: require the tier run-label AND a SHA-bound approval on
          # the CURRENT head. A stale 'verified' label cannot authorise a new SHA
          # via a draft->ready / close->reopen flip, and a fork synchronize has no
          # approved status until re-review — both fail closed here.
          if [ "$HAS_RUN_LABEL" = "true" ] && [ "$HAS_APPROVED_SHA" = "true" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::Native tests require 'run-cpp-addon-tests'; external forks also require a SHA-bound 'verified' approval on the current commit."
          echo "allowed=false" >> "$GITHUB_OUTPUT"

  run-unit-tests:
    if: needs.authorize.outputs.allowed == 'true'
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            runner: qvac-ubuntu2204-x64
          - os: ubuntu-22.04
            platform: android
            arch: arm64
            flags: -D ANDROID_STL=c++_shared
            runner: qvac-ubuntu2204-x64
          - os: macos-14
            platform: ios
            arch: arm64
          - os: macos-14
            platform: ios
            arch: arm64
            tags: -simulator
            flags: --simulator
          - os: macos-14
            platform: darwin
            arch: arm64
            runner: qvac-macos26-arm64-gpu
          - os: windows-2025
            platform: win32
            arch: x64
            runner: qvac-win25-x64

    runs-on: ${{ matrix.runner || matrix.os }}
    name: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: yamlfmt
        uses: ./.github/actions/yamlfmt
        with:
          workdir: ${{ env.PKG_DIR }}

      - if: ${{ matrix.os == 'windows-2025' }}
        name: setup cmake windows
        run: |
          cd ..
          # Persistent runners keep this parent dir between jobs (only $GITHUB_WORKSPACE
          # is wiped), so a leftover extraction makes Expand-Archive fail. Force-refresh it.
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue cmake-3.31.6-windows-x86_64, cmake-3.31.6-windows-x86_64.zip
          Invoke-WebRequest https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip -OutFile cmake-3.31.6-windows-x86_64.zip
          Expand-Archive cmake-3.31.6-windows-x86_64.zip -DestinationPath $pwd -Force
          $env:CMAKE_BIN = ("$(pwd)" -replace '\\', '/') + '/cmake-3.31.6-windows-x86_64/bin'
          echo $env:CMAKE_BIN > temp
          cat $env:GITHUB_PATH >> temp
          mv temp $env:GITHUB_PATH -Force

      - if: ${{ matrix.os == 'macos-14' }}
        name: setup cmake macos
        run: |
          cd ..
          # Persistent runners keep this parent dir between jobs (only $GITHUB_WORKSPACE
          # is wiped), so a leftover download/extraction lingers. Force-refresh it.
          rm -rf cmake-3.31.6-macos-universal cmake-3.31.6-macos-universal.tar.gz
          wget https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz
          tar -xvzf cmake-3.31.6-macos-universal.tar.gz
          echo $(pwd)/cmake-3.31.6-macos-universal/bin > temp
          cat $GITHUB_PATH >> temp
          mv temp $GITHUB_PATH

      - if: ${{ matrix.os == 'macos-14' }}
        name: Install vcpkg in macos
        run: |
          cd ..
          # Persistent runners keep this parent dir between jobs (only $GITHUB_WORKSPACE
          # is wiped), so a leftover clone makes `git clone` fail with "destination path
          # 'vcpkg' already exists". Force-refresh it (mirrors the Windows cmake step).
          rm -rf vcpkg
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg && ./bootstrap-vcpkg.sh -disableMetrics
          VCPKG_ROOT=$(pwd)
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV
          echo "$VCPKG_ROOT" >> $GITHUB_PATH

      - if: ${{ matrix.os == 'ubuntu-22.04' }}
        name: Configure vcpkg in linux
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

      - if: ${{ matrix.os == 'windows-2025' }}
        name: Configure vcpkg in windows
        run: echo ("VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" -replace '\\', '/') >> $env:GITHUB_ENV

      - if: ${{ matrix.os == 'ubuntu-22.04' || matrix.os == 'windows-2025' }}
        name: Cleanup vcpkg
        shell: bash
        run: |
          rm -rf $VCPKG_ROOT/buildtrees/*
          rm -rf $VCPKG_ROOT/packages/*

      - if: ${{ matrix.os == 'windows-2025' }}
        name: Configure cmake generator in windows
        run: echo "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV

      - if: ${{ matrix.os == 'windows-2025' && matrix.arch == 'x64' }}
        run: echo "CMAKE_GENERATOR_PLATFORM=x64" >> $env:GITHUB_ENV

      - if: ${{ matrix.os == 'windows-2025' && matrix.arch == 'arm64' }}
        run: echo "CMAKE_GENERATOR_PLATFORM=ARM64" >> $env:GITHUB_ENV

      - if: ${{ matrix.platform == 'android' }}
        name: Configure runner for cross compilation - android
        run: |
          echo "ANDROID_TOOLCHAIN_ROOT=$(echo $ANDROID_NDK_HOME)/toolchains/llvm/prebuilt/linux-x86_64" >> $GITHUB_ENV
          echo "ANDROID_NATIVE_API_LEVEL=34" >> $GITHUB_ENV

      - name: Create vcpkg cache location
        run: mkdir -p "${{ env.PKG_DIR }}/vcpkg/cache"

      - name: Get vcpkg cache
        id: cache-vcpkg
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('packages/inference-addon-cpp/vcpkg.json', 'packages/inference-addon-cpp/vcpkg-configuration.json', 'packages/inference-addon-cpp/vcpkg/ports/**') }}
          path: ${{ env.PKG_DIR }}/vcpkg/cache

      - name: Generate buildsystem
        working-directory: ${{ env.PKG_DIR }}
        run: cmake --preset default -D BUILD_TESTING=ON -S . -B build

      - name: Build
        working-directory: ${{ env.PKG_DIR }}
        run: cmake --build build

      - name: Run unit tests
        working-directory: ${{ env.PKG_DIR }}/build
        run: ctest --rerun-failed --output-on-failure --timeout 35

      - name: Debug build
        working-directory: ${{ env.PKG_DIR }}
        shell: bash
        run: cmake --preset default -D BUILD_TESTING=ON -D CMAKE_BUILD_TYPE=Debug -S . -B build && cmake --build build

