name: CPP Tests (GGML RPC Server)

on:
  workflow_call:
    inputs:
      ref:
        description: "ref"
        type: string
        required: false
      repository:
        type: string
        required: false
      workdir:
        description: "Working directory"
        type: string
        required: false
        default: "packages/ggml-rpc-server"
      fabric-overlay-artifact:
        description: >-
          Workflow-run artifact name for PR-built @qvac/fabric prebuilds. Empty
          skips the overlay (published npm baseline).
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to test; defaults to the ref used to launch the workflow"
        type: string
        required: false
      workdir:
        description: "Working directory"
        type: string
        required: false
        default: "packages/ggml-rpc-server"

# Spelled out rather than github.workflow, which in a called workflow is the
# caller's name. Keyed on the PR number so in-flight PRs stay independent.
concurrency:
  group: cpp-tests-ggml-rpc-server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  run-cpp-tests:
    needs: runner_names
    timeout-minutes: 60
    runs-on: ${{ matrix.runner || matrix.os }}
    environment: release
    name: ${{ matrix.platform }}-${{ matrix.arch }}-cpp-tests
    permissions:
      contents: read
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Same runners as prebuilds-ggml-rpc-server.yml. The linux-x64 image
        # ships libibverbs1, which Fabric's RPC backend needs to load.
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            runner: ${{ needs.runner_names.outputs.linux_ubuntu2204_x64 }}
          - os: macos-15
            platform: darwin
            arch: arm64
            runner: ${{ needs.runner_names.outputs.macos_15 }}
          - os: macos-15-intel
            platform: darwin
            arch: x64
            runner: ${{ needs.runner_names.outputs.macos_15_intel }}
          - os: windows-2025
            platform: windows
            arch: x64
            runner: ${{ needs.runner_names.outputs.win_2025_x64 }}

    env:
      WORKDIR: ${{ inputs.workdir || 'packages/ggml-rpc-server' }}
      GIT_TERMINAL_PROMPT: "0"

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Install NPM dependencies
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: npm install

      - name: Download fabric-prebuilds for overlay
        if: ${{ inputs.fabric-overlay-artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ inputs.fabric-overlay-artifact }}
          path: ${{ runner.temp }}/fabric-prebuilds

      - name: Overlay PR @qvac/fabric prebuilds
        if: ${{ inputs.fabric-overlay-artifact != '' }}
        uses: tetherto/qvac/.github/actions/overlay-local-fabric@6620d695d3a07cafe3931182e7844dde376a23f8
        with:
          workdir: ${{ env.WORKDIR }}
          prebuilds-root: ${{ runner.temp }}/fabric-prebuilds
          platform: ${{ matrix.platform == 'windows' && 'win32' || matrix.platform }}
          arch: ${{ matrix.arch }}

      - name: Install bare tooling
        run: npm install -g --force bare bare-make

      - if: ${{ matrix.platform == 'linux' }}
        name: Set Vulkan SDK Path on Linux
        shell: bash
        run: echo "VULKAN_SDK=/opt/vulkansdk/x86_64" >> "$GITHUB_ENV"

      - name: Setup vcpkg
        uses: tetherto/qvac/.github/actions/setup-vcpkg@10ae9f571c61ad94348ebbe8daaef67641ae8855
        env:
          MODEL_S3_BUCKET: ${{ secrets.MODEL_S3_BUCKET }}
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}

      # Host-wide directory on self-hosted runners, workspace on GitHub-hosted
      # ones. Must come after setup-vcpkg, which writes VCPKG_BINARY_SOURCES.
      - name: Point vcpkg at its binary cache
        uses: ./.github/actions/vcpkg-binary-cache-dir
        with:
          workdir: ${{ env.WORKDIR }}
          trusted: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || github.event_name == 'schedule') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.ref == '' || inputs.ref == github.ref_name) && (inputs.repository == '' || inputs.repository == github.repository) }}

      - name: Cleanup vcpkg
        shell: bash
        run: |
          rm -rf $VCPKG_ROOT/buildtrees/*
          rm -rf $VCPKG_ROOT/packages/*

      - if: ${{ matrix.platform == 'windows' }}
        name: Configure CMake generator on Windows
        shell: powershell
        run: |
          echo "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV
          echo "CMAKE_GENERATOR_PLATFORM=x64" >> $env:GITHUB_ENV

      # Exports TOOLCHAIN_FINGERPRINT for the cache key below.
      - name: Fingerprint the toolchain
        uses: ./.github/actions/vcpkg-toolchain-fingerprint

      # Restore only; the save sits below the build so a run that compiled
      # nothing cannot overwrite the shared key with an empty entry.
      - name: Get vcpkg cache (restore)
        id: vcpkg-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          key: >-
            cpp-tests-v1-ggml-rpc-server-${{ matrix.platform }}-${{ matrix.arch }}-${{
              hashFiles(
                format('{0}/vcpkg.json', env.WORKDIR),
                format('{0}/vcpkg-configuration.json', env.WORKDIR),
                'vcpkg-overlays/triplets/**',
                'vcpkg-overlays/toolchains/**'
              )
            }}-${{ env.TOOLCHAIN_FINGERPRINT }}
          path: ${{ env.WORKDIR }}/vcpkg/cache

      - if: ${{ matrix.platform == 'darwin' }}
        name: Use Apple clang for Apple platform builds
        run: |
          sudo mv /opt/homebrew/opt/llvm@18 /opt/homebrew/opt/llvm@18.bak 2>/dev/null || true
          sudo mv /opt/homebrew/opt/llvm /opt/homebrew/opt/llvm.bak 2>/dev/null || true
          sudo rm -f /opt/homebrew/bin/clang /opt/homebrew/bin/clang++ 2>/dev/null || true

      - name: Build C++ tests
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: npm run test:cpp:build

      # Only trusted events may write the shared cache, and only when there are
      # archives to write: hashFiles is empty for an empty directory.
      - name: Save vcpkg cache (trusted contexts)
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || github.event_name == 'schedule') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.ref == '' || inputs.ref == github.ref_name) && (inputs.repository == '' || inputs.repository == github.repository) &&
          hashFiles(format('{0}/vcpkg/cache/**', env.WORKDIR)) != ''
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
          path: ${{ env.WORKDIR }}/vcpkg/cache

      - name: Run C++ tests
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          set -euo pipefail
          npm run test:cpp:run 2>&1 | tee build/test/unit/test-output.log

          results=build/test/unit/cpp-test-results.xml
          if [ ! -f "$results" ]; then
            echo "ERROR: Test results file not generated"
            exit 1
          fi
          test_count=$(grep -c '<testcase' "$results" || true)
          if [ "${test_count:-0}" -eq 0 ]; then
            echo "ERROR: No tests were executed"
            exit 1
          fi
          echo "Executed $test_count test(s)"

      - name: Archive Test Results
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: cpp-test-results-ggml-rpc-server-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.WORKDIR }}/build/test/unit/cpp-test-results.xml
          if-no-files-found: ignore
          retention-days: 30
