name: CPP Tests (nx)
# nx-affected-driven dispatcher collapsing the 5 cpp-tests-<pkg>.yml files
# into one: classification-ggml, diffusion-cpp, embed-llamacpp, llm-llamacpp,
# vla-ggml. Confirmed gate-adjacent - each is called from its own
# on-pr-<pkg>.yml (on-pr-classification-ggml.yml, on-pr-diffusion-cpp.yml,
# on-pr-embed-llamacpp.yml, on-pr-llm-llamacpp.yml, on-pr-vla.yml).
#
# Additive only - none of the 5 legacy files touched or deleted. Each has
# bespoke self-hosted-runner/build logic reused UNCHANGED via `uses:`. GHA
# does not support a dynamic `uses:` path (can't parameterize a reusable
# workflow call with a matrix variable), so the fan-out is 5 static jobs,
# each gated by `if: contains(affected, '<pkg>')` off one shared `affected`
# job.
#
# Selector: `nx affected` (transitive) - all 5 packages here are real
# `inference-addon-cpp` vcpkg-overlay consumers, so a change to that shared
# native lib marks all 5 affected even though none of their own files
# changed - this is the case that actually exercises transitivity, distinct
# from on-pr-close-nx.yml's directly-changed selector.
#
# Standalone/additive for now (workflow_dispatch only) - NOT wired into the
# real on-pr-<pkg>.yml files yet. That wiring is a later, explicit step.

on:
  workflow_dispatch:
    inputs:
      base-ref:
        required: false
        type: string
        default: "main"
      head-ref:
        required: false
        type: string
        default: "HEAD"

permissions:
  contents: read

jobs:
  affected:
    name: Determine affected packages (nx affected, transitive)
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.affected.outputs.packages }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - run: pnpm install --frozen-lockfile
      - id: affected
        shell: bash
        run: |
          set -euo pipefail
          PKGS=$(nx show projects --affected --base="${{ inputs.base-ref }}" --head="${{ inputs.head-ref }}" --json \
            | jq -c 'map(sub("^@qvac/"; ""))')
          echo "Affected (transitive): $PKGS"
          echo "packages=$PKGS" >> "$GITHUB_OUTPUT"

  classification-ggml:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.packages || '[]'), 'classification-ggml')
    uses: ./.github/workflows/cpp-tests-classification.yml
    secrets: inherit

  diffusion-cpp:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.packages || '[]'), 'diffusion-cpp')
    uses: ./.github/workflows/cpp-tests-diffusion.yml
    secrets: inherit

  embed-llamacpp:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.packages || '[]'), 'embed-llamacpp')
    uses: ./.github/workflows/cpp-tests-embed.yml
    secrets: inherit

  llm-llamacpp:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.packages || '[]'), 'llm-llamacpp')
    uses: ./.github/workflows/cpp-tests-llm.yml
    secrets: inherit

  vla-ggml:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.packages || '[]'), 'vla-ggml')
    uses: ./.github/workflows/cpp-tests-vla.yml
    secrets: inherit
