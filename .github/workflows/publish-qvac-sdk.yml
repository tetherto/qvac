name: Build and Publish (Qvac-sdk)

on:
  push:
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/qvac-sdk/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for publishing"
        required: false
        default: "dev"

env:
  WORKDIR: packages/qvac-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      READ_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WRITE_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      READ_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ env.READ_REPO_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Configure scoped registry for @tetherto and @qvac packages
        env:
          GPR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_PAT: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: |
          echo "Configuring scoped registry for @tetherto and @qvac packages..."
          set -eu
          echo "Writing .npmrc for dual registry install…"
          ref_name="${GITHUB_REF#refs/heads/}"
          qvac_registry="https://npm.pkg.github.com/"
          qvac_token="${GPR_TOKEN}"
          if [[ "$ref_name" == release-* ]]; then
            qvac_registry="https://registry.npmjs.org/"
            qvac_token="${NPM_TOKEN}"
          fi
          cat > .npmrc <<NPMRC
          always-auth=true
          registry=https://registry.npmjs.org/
          @qvac:registry=${qvac_registry}
          @tetherto:registry=https://npm.pkg.github.com/
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          //npm.pkg.github.com/:_authToken=${GPR_TOKEN}
          NPMRC

          # Optional: make private git deps work without prompting
          git config --global url."https://${{ github.token }}:@github.com/".insteadOf "https://github.com/"

          # Configure bunfig.toml for reading packages
          cat > bunfig.toml << EOF
          [install]
          registry = "https://registry.npmjs.org/"

          [install.scopes]
          "@tetherto" = { token = "${{ env.READ_NPM_TOKEN }}", url = "https://npm.pkg.github.com" }
          "@qvac" = { token = "${qvac_token}", url = "${qvac_registry}" }
          EOF

      - name: Install dependencies
        working-directory: ${{ env.WORKDIR }}
        run: bun install

      - name: Build (includes lint, typecheck, compile)
        working-directory: ${{ env.WORKDIR }}
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ env.WORKDIR }}/dist/
          retention-days: 1

      - name: Determine version and tag
        working-directory: ${{ env.WORKDIR }}
        id: version
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BASE_VERSION=$(node -p "require('./package.json').version")

          if [ "$BRANCH_NAME" = "main" ]; then
            VERSION="$BASE_VERSION"
            TAG="dev"
            echo "Publishing main branch as @dev"
          elif [[ "$BRANCH_NAME" == release-* ]]; then
            VERSION="$BASE_VERSION"
            TAG="latest"
            echo "Publishing release branch as @latest"
          else
            # Clean branch name for npm (replace invalid chars with -)
            CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9.-]/-/g')
            VERSION="${BASE_VERSION}-${CLEAN_BRANCH}.$(date +%s).${GITHUB_SHA:0:7}"
            TAG="$CLEAN_BRANCH"
            echo "Publishing branch '$BRANCH_NAME' as @$TAG"
          fi

          publish_gpr="false"
          publish_npm="false"
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$BRANCH_NAME" = "main" ] || [[ "$BRANCH_NAME" == feature-* ]] || [[ "$BRANCH_NAME" == tmp-* ]]; then
              publish_gpr="true"
            elif [[ "$BRANCH_NAME" == release-* ]]; then
              publish_npm="true"
            fi
          fi

          if [ "$publish_npm" = "true" ] && { [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_EVENT_NAME" = "pull_request_target" ]; }; then
            publish_npm="false"
          fi

          if [ "$publish_gpr" = "true" ] && [ "$publish_npm" = "true" ]; then
            echo "ERROR: Both GPR and NPM publishing enabled — invalid GitFlow state"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "publish_gpr=$publish_gpr" >> $GITHUB_OUTPUT
          echo "publish_npm=$publish_npm" >> $GITHUB_OUTPUT

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      branch: ${{ steps.version.outputs.branch }}
      publish_gpr: ${{ steps.version.outputs.publish_gpr }}
      publish_npm: ${{ steps.version.outputs.publish_npm }}

  publish-npm:
    needs: build
    if: ${{ needs.build.outputs.publish_npm == 'true' }}
    outputs:
      published_version: ${{ steps.publish.outputs.npm_published_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ${{ env.WORKDIR }}/dist/

      - name: Publish to NPM Package Registry
        id: publish
        uses: tetherto/qvac-devops/.github/actions/publish-library-to-npm@monorepo_update
        with:
          secret-token: ${{ secrets.NPM_TOKEN }}
          tag: "latest"
          git-token: ${{ secrets.GITHUB_TOKEN }}
          create-tag: "true"
          workdir: ${{ env.WORKDIR }}

  publish-gpr:
    needs: build
    if: ${{ needs.build.outputs.publish_gpr == 'true' }}
    outputs:
      published_version: ${{ steps.publish.outputs.npm_published_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ${{ env.WORKDIR }}/dist/

      - name: Publish to GitHub Package Registry
        id: publish
        uses: tetherto/qvac-devops/.github/actions/publish-library-to-gpr@monorepo_update
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag || github.event.inputs.tag || needs.build.outputs.tag || 'dev' }}
          workdir: ${{ env.WORKDIR }}
