name: Build and Publish (Qvac-sdk)

on:
  push:
    branches: ["main", "dev", "fix-*", "feature-*", "npm-patch-*"]
    paths:
      - "packages/qvac-sdk/**"
      - ".github/workflows/publish-qvac-sdk.yml"
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
    paths:
      - "packages/qvac-sdk/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for publishing"
        required: false
        default: "dev"

env:
  WORKDIR: packages/qvac-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      READ_NPM_TOKEN: ${{ secrets.PAT_TOKEN }}
      WRITE_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      READ_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Configure scoped registry for @tetherto and @qvac packages
        env:
          GPR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_PAT: ${{ secrets.PAT_TOKEN }}
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -eu
          echo "Configuring scoped registry for @tetherto and @qvac packages..."

          # Write .npmrc for dual registry install (no heredoc to avoid indentation issues)
          : > .npmrc
          echo "always-auth=true" >> .npmrc
          echo "registry=https://registry.npmjs.org/" >> .npmrc
          echo "@qvac:registry=https://registry.npmjs.org/" >> .npmrc
          echo "@tetherto:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${GIT_PAT}" >> .npmrc

          # Optional: make private git deps work without prompting
          if [ -n "${GIT_PAT:-}" ]; then
            git config --global url."https://${GIT_PAT}:@github.com/".insteadOf "https://github.com/"
          else
            git config --global url."https://${{ github.token }}:@github.com/".insteadOf "https://github.com/"
          fi

          # Configure bunfig.toml for reading packages (no heredoc to avoid indentation issues)
          : > bunfig.toml
          echo "[install]" >> bunfig.toml
          echo "registry = \"https://registry.npmjs.org/\"" >> bunfig.toml
          echo "" >> bunfig.toml
          echo "[install.scopes]" >> bunfig.toml
          echo "\"@tetherto\" = { token = \"${{ env.READ_NPM_TOKEN }}\", url = \"https://npm.pkg.github.com\" }" >> bunfig.toml
          echo "\"@qvac\" = { token = \"${NPM_TOKEN}\", url = \"https://registry.npmjs.org\" }" >> bunfig.toml

      - name: Install dependencies
        working-directory: ${{ env.WORKDIR }}
        run: bun install

      - name: Build (includes lint, typecheck, compile)
        working-directory: ${{ env.WORKDIR }}
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ env.WORKDIR }}/dist/
          retention-days: 1

  publish-npm:
    needs: build
    # DISABLED: NPM publishing disabled for testing - only GPR for now
    if: false
    # Original condition: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && startsWith(needs.build.outputs.branch, 'npm-patch-')) }}
    continue-on-error: true
    outputs:
      published_version: ${{ steps.publish.outputs.npm_published_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ${{ env.WORKDIR }}/dist/

      - name: Publish to NPM Package Registry
        id: publish
        uses: tetherto/qvac-devops/.github/actions/publish-library-to-npm@monorepo_update
        with:
          secret-token: ${{ secrets.NPM_TOKEN }}
          tag: "latest"
          git-token: ${{ secrets.PAT_TOKEN }}
          create-tag: "true"
          workdir: ${{ env.WORKDIR }}

  publish-gpr:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    outputs:
      published_version: ${{ steps.publish.outputs.npm_published_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ${{ env.WORKDIR }}/dist/

      - name: Publish to GitHub Package Registry
        id: publish
        uses: tetherto/qvac-devops/.github/actions/publish-library-to-gpr@monorepo_update
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          pat-token: ${{ secrets.PAT_TOKEN }}
          workdir: ${{ env.WORKDIR }}
          name-suffix: "-mono"
