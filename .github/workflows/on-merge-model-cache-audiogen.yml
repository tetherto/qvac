name: On Merge Model Cache (AudioGen)

# Seeds the audiogen entries that integration-test-audiogen-ggml.yml restores.
# That workflow is only reachable from a pull_request_target caller, where
# cache-models takes its restore-only branch, so nothing writes them.
#
# Two entries, not one. The call site sets
#   cache-key-suffix: ${{ inputs.run_rtf_benchmarks && 'all-dit-variants' || 'turbo-q4' }}
# so the default leg and the RTF benchmark leg use different keys and different
# download scripts. Seeding only one leaves the other cold.

on:
  push:
    branches:
      - main
    paths:
      - "packages/audiogen-ggml/scripts/download-audiogen-ggml-models.js"
      # `paths` is pinned at the call site, but cache-models still builds the key
      # string and resolves the hash glob, so an edit there can still move this
      # entry. A run that finds nothing moved costs seconds: the probe answers
      # from a lookup.
      - ".github/actions/cache-models/**"
      # And this file. A commit that fixes the seed itself -- a corrected
      # cache-key-suffix, say -- would otherwise sit dormant until the cron.
      - ".github/workflows/on-merge-model-cache-audiogen.yml"
  # Every two days. The cache server prunes at CACHE_CLEANUP_OLDER_THAN_DAYS=5,
  # and Mon/Thu left a 4-day gap -- inside the window, but with no slack: ONE
  # failed run stretched it to 7 days and the entry was gone. `*/2` caps the gap
  # at 2 days, and at 4 after a missed run, so a single failure is survivable.
  # The hour is offset per addon so the seeds do not contend for a runner.
  schedule:
    - cron: "17 12 */2 * *"
  # No workflow_call. Nothing calls this, and a `pull_request` caller would put
  # the job on cache-models' trusted-save branch, letting PR-head code write an
  # entry every addon lane afterwards restores. Dispatch covers on-demand runs.
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Restore the archive even on a hit, exactly as the cron does. That download is what resets the cache server's prune clock; the probe alone does not."
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  seed:
    needs: runner_names
    # enable-cross-os is 'true' at the call site, so one entry per suffix serves
    # every platform.
    runs-on: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64 }}
    timeout-minutes: 120
    name: seed-model-cache-${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Mirrors the two branches of the call site's ternary.
          - label: default
            cache_key_suffix: turbo-q4
            download_script: download-models:registry
          - label: rtf-benchmarks
            cache_key_suffix: all-dit-variants
            download_script: download-models:registry:all

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      # The download script resolves models through @qvac/registry-client, so
      # dependencies must be installed before it runs.
      - name: Install NPM dependencies
        working-directory: ${{ github.workspace }}/packages/audiogen-ggml
        run: npm install

      # Must match integration-test-audiogen-ggml.yml's "Cache AudioGen GGML GGUF
      # models" step exactly. Named, not line-numbered: line numbers rot.
      - name: Cache AudioGen GGML GGUF models
        id: model-cache
        uses: ./.github/actions/cache-models
        with:
          package: audiogen-ggml
          paths: packages/audiogen-ggml/models
          hash-files-glob: packages/audiogen-ggml/scripts/download-audiogen-ggml-models.js
          cache-key-suffix: ${{ matrix.cache_key_suffix }}
          enable-cross-os: 'true'
          seed-probe: 'true'
          force-refresh: ${{ inputs.force_refresh || false }}

      - name: Download GGUF models from registry
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ${{ github.workspace }}/packages/audiogen-ggml
        env:
          DOWNLOAD_SCRIPT: ${{ matrix.download_script }}
        run: npm run "$DOWNLOAD_SCRIPT"

  # actions/cache only WARNS when the cache server rejects a reservation, so the
  # seed job above reports success whether or not an entry was written. This
  # turns that into a red run. It has to be a separate job: the save runs in the
  # seed job's post-steps, after every step there has finished.
  verify:
    needs: [runner_names, seed]
    # Not the default `success()`. The seed matrices are fail-fast: false, so one
    # leg failing for an unrelated reason would skip this job outright -- and the
    # silent write failure it exists to catch would go unreported on every other
    # leg. Each leg asserts its own entry, so a genuinely failed seed leg just
    # fails here too. runner_names is still required: without its outputs there
    # is no runs-on.
    if: ${{ !cancelled() && needs.runner_names.result == 'success' }}
    # No id-token: nothing here talks to AWS; the lookup needs the
    # repository and nothing else.
    permissions:
      contents: read
    runs-on: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64 }}
    timeout-minutes: 15
    name: verify-model-cache-${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default
            cache_key_suffix: turbo-q4
          - label: rtf-benchmarks
            cache_key_suffix: all-dit-variants

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      # Inputs must stay identical to the seed step's: `path` feeds the cache
      # version, so a different one silently probes a different entry.
      - name: Assert the seeded entry exists
        uses: ./.github/actions/cache-models
        with:
          package: audiogen-ggml
          paths: packages/audiogen-ggml/models
          hash-files-glob: packages/audiogen-ggml/scripts/download-audiogen-ggml-models.js
          cache-key-suffix: ${{ matrix.cache_key_suffix }}
          enable-cross-os: 'true'
          assert-exists: 'true'
