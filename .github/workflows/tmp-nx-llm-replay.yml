name: TMP nx real-PR replay (QVAC-25682)

# THROWAWAY. Deleted before merge.
#
# The previous replay reported main's action selecting llm alone for a real llm
# PR that changed the lockfile. nx 23.1.0's own lock-file-changes.js returns every
# project when the lockfile changes under the default config, so either the harness
# fed main's action the wrong nx.json or nx behaves differently on a historical
# commit. This checks directly: print the nx.json each run actually reads, and run
# nx itself under main's config, an explicit "all", and this branch's.

on:
  push:
    branches:
      - infra/QVAC-25682-nx-lockfile-affected

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Real PRs, today vs this PR, both lanes
        shell: bash
        run: |
          set -uo pipefail
          git fetch -q origin main
          git show origin/main:nx.json > /tmp/nx.main.json
          cp nx.json /tmp/nx.branch.json
          for N in 4733 4570; do git fetch -q origin "pull/$N/head:refs/remotes/pr/$N"; done
          for T in f1c4648b0 9d0914037 pr4733 pr4570; do
            case "$T" in
              pr*) H=$(git rev-parse "refs/remotes/pr/${T#pr}"); B=$(git merge-base origin/main "$H") ;;
              *)   H=$(git rev-parse "$T"); B=$(git rev-parse "$T^") ;;
            esac
            git diff --name-only "$B" "$H" > /tmp/changed.txt
            L=$(grep -cx pnpm-lock.yaml /tmp/changed.txt || true)
            for lane in range stdin; do
              for cfg in main branch; do
                cp "/tmp/nx.$cfg.json" nx.json; rm -rf .nx
                if [ "$lane" = range ]; then
                  o=$(pnpm exec nx show projects --affected -t on-pr --base="$B" --head="$H" --json 2>/dev/null | grep -E '^\[' | tail -n1)
                else
                  o=$(pnpm exec nx show projects --affected -t on-pr --stdin --json < /tmp/changed.txt 2>/dev/null | grep -E '^\[' | tail -n1)
                fi
                eval "R_$cfg=\$(echo \"\${o:-[]}\" | jq -c 'map(sub(\"^@qvac/\";\"\"))|sort')"
              done
              echo "REAL $T lockfile=$L $lane : today=$(echo "$R_main" | jq length)  thisPR=$(echo "$R_branch" | jq length) $R_branch"
            done
          done
          cp /tmp/nx.branch.json nx.json
