name: Classification TypeScript Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/classification-ggml/**"
      - ".github/workflows/*classification-ggml*.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classification-ggml-pr-head-ts-checks:
    uses: ./.github/workflows/reusable-ts-checks.yml
    with:
      workdir: packages/classification-ggml
