name: On PR Close (nx)
# Additive nx-affected replacement for the 15 on-pr-close-<pkg>.yml clones.
# Selector is provisional (directly-changed); dry-run stays true.

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      base-ref:
        description: "Base ref/sha to diff from (local/manual runs)"
        required: false
        type: string
        default: "main"
      head-ref:
        description: "Head ref/sha to diff to (local/manual runs)"
        required: false
        type: string
        default: "HEAD"

permissions:
  contents: read

jobs:
  label-gate:
    name: Authorise (label-gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      authorised: ${{ steps.gate.outputs.authorised }}
    steps:
      - name: Checkout (label-gate action only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/label-gate
          sparse-checkout-cone-mode: false
      - name: Run label-gate
        id: gate
        uses: ./.github/actions/label-gate
        with:
          github-token: ${{ secrets.PAT_TOKEN }}

  changed:
    name: Directly-changed packages (nx graph roots)
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.diff.outputs.packages }}
      any: ${{ steps.diff.outputs.any }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Map changed files to nx project roots
        id: diff
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base-ref }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head-ref }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files ($BASE -> $HEAD):"; echo "$CHANGED"

          PKGS=$(nx graph --print | jq -c --arg files "$CHANGED" '
            ($files | split("\n") | map(select(length > 0))) as $f
            | [ .graph.nodes[].data.root
                | select(. != null)
                | select(. as $r | $f | any(startswith($r + "/")))
                | sub("^packages/"; "") ]
            | unique')

          echo "Directly-changed packages: $PKGS"
          echo "packages=$PKGS" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$PKGS" != "[]" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  cleanup:
    name: Delete NPM versions (${{ matrix.package }})
    needs: [label-gate, changed]
    if: needs.label-gate.outputs.authorised == 'true' && needs.changed.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changed.outputs.packages || '[]') }}
    permissions:
      packages: write
    uses: ./.github/workflows/public-delete-npm-versions.yml
    with:
      pr-number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
      packages: ${{ matrix.package }}
      dry-run: true
