name: Run Integration Tests (Parakeet)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to test"
        type: string
        required: false
        default: main
      prebuild_package:
        description: "NPM package containing prebuilds (e.g. @qvac/transcription-parakeet@1.0.0)"
        required: true
        type: string
      run_integration_tests:
        description: "Run the regular integration suite"
        required: false
        type: boolean
        default: true

  workflow_call:
    inputs:
      ref:
        description: 'ref'
        type: string
      repository:
        type: string
      run_integration_tests:
        description: "Run the regular integration suite"
        type: boolean
        required: false
        default: true




# Canonical runner labels — .github/actions/runner-names/runners.yaml
env:
  RN_ORCH: ubuntu-latest
  RN_U22: ubuntu-22.04
  RN_U24: ubuntu-24.04
  RN_U22_ARM: ubuntu-22.04-arm
  RN_U24_ARM: ubuntu-24.04-arm
  RN_MAC14: macos-14
  RN_MAC14_XL: macos-14-xlarge
  RN_MAC15: macos-15
  RN_MAC15_INTEL: macos-15-intel
  RN_MAC15_LG: macos-15-large
  RN_MAC15_XL: macos-15-xlarge
  RN_WIN22: windows-2022
  RN_WIN25: windows-2025
  RN_QVAC_U22: qvac-ubuntu2204-x64
  RN_QVAC_U22_GPU: qvac-ubuntu2204-x64-gpu
  RN_QVAC_U24: qvac-ubuntu2404-x64
  RN_QVAC_U24_GPU: qvac-ubuntu2404-x64-gpu
  RN_QVAC_WIN25: qvac-win25-x64
  RN_QVAC_WIN25_GPU: qvac-win25-x64-gpu
  RN_AI_LINUX: ai-run-linux
  RN_AI_LINUX_GPU: ai-run-linux-gpu
  RN_AI_U22: ai-run-ubuntu-22.04
  RN_AI_WIN11_GPU: ai-run-windows11-gpu
  RN_GEN_WIN11: generator-windows11
  RN_MINI_M4: mac-mini-m4
  RN_MINI_M4_GPU: mac-mini-m4-gpu
  RN_LBL_U22_X64: ubuntu-22.04-x64
  RN_LBL_U22_X64_GPU: ubuntu-22.04-x64-gpu
  RN_LBL_U24_X64: ubuntu-24.04-x64
  RN_LBL_U24_X64_GPU: ubuntu-24.04-x64-gpu
  RN_LBL_U24_ARM64: ubuntu-24.04-arm64
  RN_LBL_WIN22_X64: windows-2022-x64
  RN_LBL_WIN25_X64: windows-2025-x64
  RN_LBL_WIN25_X64_GPU: windows-2025-x64-gpu

jobs:
  run-integration-tests:
    timeout-minutes: 60
    continue-on-error: true
    runs-on: ${{ matrix.runner || matrix.os }}
    environment: release
    name: ${{ matrix.os }}-${{ matrix.platform }}-${{ matrix.arch }}-integration-tests
    env:
      GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
      NO_GPU: ${{ matrix.no_gpu || 'false' }}
    permissions:
      contents: read
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ${{ env.RN_U22 }}
            platform: linux
            arch: x64
            runner: ${{ env.RN_QVAC_U22 }}
            no_gpu: 'true'
          - os: ${{ env.RN_U22 }}
            platform: linux
            arch: x64
            runner: ${{ env.RN_QVAC_U22_GPU }}
          - os: ${{ env.RN_U24 }}
            platform: linux
            arch: x64
            runner: ${{ env.RN_QVAC_U24_GPU }}
          - os: ${{ env.RN_U24_ARM }}
            platform: linux
            arch: arm64
            no_gpu: 'true'
          - os: ${{ env.RN_MAC14_XL }}
            platform: darwin
            arch: arm64
            no_gpu: 'true'
          - os: ${{ env.RN_MAC15_LG }}
            platform: darwin
            arch: x64
            no_gpu: 'true'
          - os: ${{ env.RN_WIN25 }}
            platform: win32
            arch: x64
            runner: ${{ env.RN_QVAC_WIN25 }}
            no_gpu: 'true'

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install NPM dependencies
        working-directory: ${{ github.workspace }}/packages/transcription-parakeet
        run: |
          npm install

      - name: Install bare tooling
        run: npm install -g --force bare bare-make

      - run: mkdir -p "${{ runner.temp }}/transcription-parakeet"
        shell: bash
      - run: mkdir -p "${{ github.workspace }}/packages/transcription-parakeet/prebuilds"
        shell: bash

      - name: Download prebuilds from artifact
        if: ${{ !inputs.prebuild_package }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          path: ${{ runner.temp }}/transcription-parakeet
          merge-multiple: true

      - if: ${{ !inputs.prebuild_package }}
        shell: bash
        run: cp -r "${{ runner.temp }}/transcription-parakeet"/* "${{ github.workspace }}/packages/transcription-parakeet/prebuilds"

      - name: Download prebuilds from package
        if: ${{ inputs.prebuild_package }}
        working-directory: ${{ runner.temp }}/transcription-parakeet
        shell: bash
        run: |
          npm pack ${{ inputs.prebuild_package }}
          tar -xzf *.tgz
          cp -r ./package/prebuilds/* "${{ github.workspace }}/packages/transcription-parakeet/prebuilds"

      - name: Rename prebuilds from tetherto_ to qvac_ prefix
        if: ${{ inputs.prebuild_package }}
        working-directory: ${{ github.workspace }}/packages/transcription-parakeet
        shell: bash
        run: |
          find prebuilds -depth -name 'tetherto_*' | while read -r file; do
            dir=$(dirname "$file")
            base=$(basename "$file")
            newbase=$(echo "$base" | sed 's/^tetherto_/qvac_/')
            mv "$file" "$dir/$newbase"
          done

      - if: ${{ matrix.os == env.RN_WIN25 }}
        name: Set Vulkan SDK Path on Windows Server 2025
        run: echo "VULKAN_SDK=C:\VulkanSDK" >> $Env:GITHUB_ENV

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # 6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Cache Parakeet GGUF models
        id: model-cache
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/cache-models
        with:
          package: transcription-parakeet
          paths: packages/transcription-parakeet/models
          hash-files-glob: .github/workflows/integration-test-transcription-parakeet.yml
          enable-cross-os: 'false'

      - name: Download Parakeet GGUFs from QVAC registry (q8_0)
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ${{ github.workspace }}/packages/transcription-parakeet
        run: |
          set -euo pipefail
          mkdir -p models
          aws s3 cp s3://${{ secrets.MODEL_S3_BUCKET }}/qvac_models_compiled/ggml/parakeet/2026-05-11/ models/ \
            --recursive --exclude "*" --include "*.q8_0.gguf"
          aws s3 cp s3://${{ secrets.MODEL_S3_BUCKET }}/qvac_models_compiled/ggml/parakeet/2026-05-20/diar_streaming_sortformer_4spk-v2.1.q8_0.gguf models/
          ls -lh models/

      - name: Run integration test
        if: ${{ inputs.run_integration_tests != false }}
        shell: bash
        working-directory: ${{ github.workspace }}/packages/transcription-parakeet
        run: npm run test:integration
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          INTEGRATION_TEST_TIMEOUT: ${{ matrix.platform == 'win32' && '1800' || '600' }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/packages/transcription-parakeet/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/packages/transcription-parakeet/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}
