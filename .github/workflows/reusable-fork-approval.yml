name: Fork approval gate (reusable)

# Gates a fork PR's build on the fork-ci environment. The caller says whether the PR is a fork, from the API, and which
# head SHA it pinned. After approval, records qvac/fork-verified on that SHA for pr-check-trust.

on:
  workflow_call:
    inputs:
      fork:
        description: true for a fork PR, as the GitHub API reports its head repository
        type: boolean
        default: false
      head-sha:
        description: The PR head commit the caller builds
        type: string
        default: ""

permissions: {}

jobs:
  gate:
    name: Fork approval gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    environment: ${{ inputs.fork && 'fork-ci' || '' }}
    steps:
      - name: Record fork-ci approval on head SHA
        if: inputs.fork
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head-sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no head SHA to record the approval on"; exit 1; }
          gh api "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context=qvac/fork-verified \
            -f description="fork-ci environment approved for this commit"

      - name: Approved
        run: echo "fork PR authorised to run privileged jobs"
