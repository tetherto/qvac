# Consolidates 3 of the 4 cpp-test-coverage-<pkg>.yml files. Shared skeleton
# (checkout -> ccache -> node setup -> npm install -> vcpkg cleanup -> build
# -> run tests -> coverage report -> archive -> publish -> summary) is real
# and identical; the genuine per-package divergence is model provisioning:
#   - asr-ggml:       HuggingFace whisper model downloads (curl) + an S3
#                      parakeet GGUF pulled via AWS OIDC credentials.
#   - bci-whispercpp:  no model downloads, no ccache setup at all.
#   - tts-ggml:        a Python-venv HF->GGUF conversion pipeline, plus a
#                      hard-gated deterministic test tier that must pass
#                      before the (continue-on-error) full suite runs.
# Each divergence above is modeled as config-driven optional steps, not
# separate jobs.
#
# Carve-out: audiogen-ggml.yml stays untouched and separate - it's a pure
# no-op stub (no addon-level C++ tests exist yet, CMakeLists BUILD_TESTING is
# OFF), structurally nothing like the other 3 (no build, no tests, no
# coverage at all). Forcing it into this matrix meant an `isStub` guard on
# nearly every step - not worth the noise for a file that's currently a
# single echo statement.
name: "CPP Test Coverage (nx)"

on:
  workflow_dispatch:
    inputs:
      base-ref:
        required: false
        type: string
        default: "main"
      head-ref:
        required: false
        type: string
        default: "HEAD"
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      repository:
        type: string
        required: false
        default: "tetherto/qvac"
      base-ref:
        required: false
        type: string
        default: "main"
      head-ref:
        required: false
        type: string
        default: "HEAD"

permissions:
  contents: read

jobs:
  matrix:
    name: Determine affected packages + build matrix (nx affected, transitive)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      any: ${{ steps.compute.outputs.any }}
    steps:
      - id: compute
        uses: ./.github/actions/nx-affected
        with:
          base-ref: ${{ inputs.base-ref }}
          head-ref: ${{ inputs.head-ref }}
          config: |
            - package: asr-ggml
              workdir: packages/asr-ggml
              needsWhisperHfModels: true
              needsParakeetS3Gguf: true
              testEnvVars:
                - name: QVAC_TEST_GGUF
                  path: models/sortformer-4spk-v1.q4_0.gguf
              buildOutputDir: build/addon/tests
              hasCcache: true
            - package: bci-whispercpp
              workdir: packages/bci-whispercpp
              buildOutputDir: build/addon/tests
              hasCcache: false
            - package: tts-ggml
              workdir: packages/tts-ggml
              needsTtsVenvModels: true
              hardGateCommand: cd build && ./tts_ggml_tests --gtest_filter='-*RealGguf*'
              testEnvVars:
                - name: QVAC_TEST_CHATTERBOX_T3_GGUF
                  path: models/chatterbox-t3-mtl.gguf
                - name: QVAC_TEST_CHATTERBOX_S3GEN_GGUF
                  path: models/chatterbox-s3gen-mtl.gguf
                - name: QVAC_TEST_SUPERTONIC_GGUF
                  path: models/supertonic.gguf
              buildOutputDir: build
              hasCcache: true

  cpp-tests:
    name: ${{ matrix.package.package }}-linux-x64-cpp-tests
    needs: matrix
    if: needs.matrix.outputs.any == 'true'
    runs-on: qvac-ubuntu2204-x64
    environment: release
    permissions:
      contents: read
      id-token: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.matrix.outputs.matrix || '[]') }}
    env:
      BUILD_TYPE: Debug
      ENABLE_COVERAGE: ON
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg/cache,readwrite"
    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.PAT_TOKEN }}
          lfs: true

      - name: Setup ccache
        if: matrix.package.hasCcache
        run: |
          ccache -z
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV

      - name: Get ccache cache
        if: matrix.package.hasCcache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          key: ccache-cpp-coverage-${{ matrix.package.package }}-linux-x64-${{ hashFiles(format('{0}/vcpkg.json', matrix.package.workdir)) }}
          path: ~/.cache/ccache
          restore-keys: ccache-cpp-coverage-${{ matrix.package.package }}-linux-x64-

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Install bare tooling
        run: npm install -g --force bare bare-make

      - name: Install NPM dependencies
        working-directory: ${{ matrix.package.workdir }}
        run: npm install

      - name: Configure vcpkg in linux
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

      - name: Cleanup vcpkg
        shell: bash
        run: |
          rm -rf $VCPKG_ROOT/buildtrees/*
          rm -rf $VCPKG_ROOT/packages/*
          # qvac-lint-cpp / qvac-lib-inference-addon-cpp use vcpkg_from_git, which
          # fetches into a shared downloads/git-tmp. An interrupted prior run can
          # leave a stale .git/shallow.lock there, breaking later `git fetch`.
          # Drop the scratch dir so each run fetches clean.
          rm -rf $VCPKG_ROOT/downloads/git-tmp

      - name: Generate and build unit tests
        working-directory: ${{ matrix.package.workdir }}
        run: npm run coverage:cpp:build

      # --- asr-ggml: HuggingFace whisper models (curl, no cache) ---
      - name: Download whisper test models
        if: matrix.package.needsWhisperHfModels
        working-directory: ${{ matrix.package.workdir }}
        run: |
          mkdir -p models
          curl -L -o models/ggml-tiny.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin" \
            --fail --silent --show-error --connect-timeout 30 --max-time 300
          curl -L -o models/ggml-silero-v5.1.2.bin \
            "https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin" \
            --fail --silent --show-error --connect-timeout 30 --max-time 300
          ls -lha models/

      # --- asr-ggml: parakeet GGUF from S3 via AWS OIDC (cached) ---
      - name: Configure AWS credentials via OIDC
        if: matrix.package.needsParakeetS3Gguf
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # 6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Cache Parakeet sortformer q4 GGUF
        if: matrix.package.needsParakeetS3Gguf
        id: cache-parakeet-models
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          path: ${{ matrix.package.workdir }}/models/sortformer-4spk-v1.q4_0.gguf
          key: ${{ matrix.package.package }}-cpp-q4-sortformer-v1-${{ hashFiles('.github/workflows/cpp-test-coverage-nx.yml') }}
          restore-keys: ${{ matrix.package.package }}-cpp-q4-sortformer-v1-

      - name: Download sortformer q4_0 GGUF from QVAC registry (cache miss)
        if: matrix.package.needsParakeetS3Gguf && steps.cache-parakeet-models.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.package.workdir }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          aws s3 cp s3://${{ secrets.MODEL_S3_BUCKET }}/qvac_models_compiled/ggml/parakeet/2026-05-27/sortformer-4spk-v1.q4_0.gguf models/
          ls -lh models/sortformer-4spk-v1.q4_0.gguf

      - name: Verify parakeet GGUF for C++ tests
        if: matrix.package.needsParakeetS3Gguf
        working-directory: ${{ matrix.package.workdir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s models/sortformer-4spk-v1.q4_0.gguf ]; then
            echo "ERROR: missing or empty models/sortformer-4spk-v1.q4_0.gguf -- cache may be corrupt" >&2
            ls -la models/ || true
            exit 1
          fi

      # --- tts-ggml: Python-venv HF->GGUF conversion pipeline (cached) ---
      - name: Cache TTS venv + q4 GGUFs
        if: matrix.package.needsTtsVenvModels
        id: cache-tts-models
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          path: |
            ${{ matrix.package.workdir }}/venv
            ${{ matrix.package.workdir }}/models/chatterbox-t3-mtl.gguf
            ${{ matrix.package.workdir }}/models/chatterbox-s3gen-mtl.gguf
            ${{ matrix.package.workdir }}/models/supertonic.gguf
          key: ${{ matrix.package.package }}-cpp-mtl-supertonic-en-q4-v1-${{ hashFiles(format('{0}/scripts/convert-models.sh', matrix.package.workdir), format('{0}/scripts/setup-venv.sh', matrix.package.workdir), format('{0}/scripts/requirements.txt', matrix.package.workdir)) }}
          restore-keys: ${{ matrix.package.package }}-cpp-mtl-supertonic-en-q4-v1-

      - name: Convert HF -> q4_0 GGUFs (cache miss)
        if: matrix.package.needsTtsVenvModels && steps.cache-tts-models.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.package.workdir }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/setup-venv.sh
          bash scripts/convert-models.sh -t multilingual -q q4_0
          bash scripts/convert-models.sh -t supertonic-en -q q4_0
          ls -lh models/

      - name: Verify TTS GGUFs for C++ tests
        if: matrix.package.needsTtsVenvModels
        working-directory: ${{ matrix.package.workdir }}
        shell: bash
        run: |
          for f in chatterbox-t3-mtl.gguf chatterbox-s3gen-mtl.gguf supertonic.gguf; do
            if [ ! -s "models/$f" ]; then
              echo "WARN: missing or empty models/$f -- gated tests will skip" >&2
            fi
          done

      # --- tts-ggml: hard-gated deterministic tier (must pass, no continue-on-error) ---
      - name: Deterministic tier (must pass)
        if: matrix.package.hardGateCommand
        working-directory: ${{ matrix.package.workdir }}
        run: ${{ matrix.package.hardGateCommand }}

      - name: Run C++ Unit Tests
        id: cpp-tests
        working-directory: ${{ matrix.package.workdir }}
        env:
          QVAC_TEST_ENV_0_NAME: ${{ matrix.package.testEnvVars[0].name }}
          QVAC_TEST_ENV_0_PATH: ${{ matrix.package.workdir }}/${{ matrix.package.testEnvVars[0].path }}
          QVAC_TEST_ENV_1_NAME: ${{ matrix.package.testEnvVars[1].name }}
          QVAC_TEST_ENV_1_PATH: ${{ matrix.package.workdir }}/${{ matrix.package.testEnvVars[1].path }}
          QVAC_TEST_ENV_2_NAME: ${{ matrix.package.testEnvVars[2].name }}
          QVAC_TEST_ENV_2_PATH: ${{ matrix.package.workdir }}/${{ matrix.package.testEnvVars[2].path }}
        run: |
          set -euo pipefail
          [ -n "${QVAC_TEST_ENV_0_NAME:-}" ] && export "${QVAC_TEST_ENV_0_NAME}=${QVAC_TEST_ENV_0_PATH}"
          [ -n "${QVAC_TEST_ENV_1_NAME:-}" ] && export "${QVAC_TEST_ENV_1_NAME}=${QVAC_TEST_ENV_1_PATH}"
          [ -n "${QVAC_TEST_ENV_2_NAME:-}" ] && export "${QVAC_TEST_ENV_2_NAME}=${QVAC_TEST_ENV_2_PATH}"
          echo "=== Running ${{ matrix.package.package }} C++ tests from: $(pwd) ==="
          npm run test:cpp:run
        continue-on-error: true

      - name: Debug - List test output files
        if: always()
        working-directory: ${{ matrix.package.workdir }}
        run: |
          echo "Contents of ${{ matrix.package.buildOutputDir }}/:"
          ls -la "${{ matrix.package.buildOutputDir }}/" || echo "Directory not found"

      - name: Generate Coverage Report
        working-directory: ${{ matrix.package.workdir }}
        run: |
          npm run coverage:cpp:report
          COVERAGE=$(grep 'TOTAL' "${{ matrix.package.buildOutputDir }}/coverage-summary.txt" | awk '{print $10}')
          echo "LINE_COVERAGE_PERCENTAGE=${COVERAGE}" >> $GITHUB_ENV

      - name: Show ccache statistics
        if: matrix.package.hasCcache
        run: ccache -s

      - name: Archive Coverage Results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: coverage-report-${{ matrix.package.package }}-linux-x64
          path: |
            ${{ matrix.package.workdir }}/${{ matrix.package.buildOutputDir }}/coverage-html/
            ${{ matrix.package.workdir }}/${{ matrix.package.buildOutputDir }}/lcov.info
            ${{ matrix.package.workdir }}/${{ matrix.package.buildOutputDir }}/coverage-summary.txt
            ${{ matrix.package.workdir }}/${{ matrix.package.buildOutputDir }}/cpp-test-results.xml
          retention-days: 30

      - name: Check if test results exist
        id: check-test-results
        working-directory: ${{ matrix.package.workdir }}
        run: |
          if [ -f "${{ matrix.package.buildOutputDir }}/cpp-test-results.xml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Publish Test Results
        if: always() && steps.check-test-results.outputs.exists == 'true'
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # 2.23.0
        with:
          files: ${{ matrix.package.workdir }}/${{ matrix.package.buildOutputDir }}/cpp-test-results.xml
          comment_mode: off
          check_name: "C++ Test Results (${{ matrix.package.package }} linux-x64)"

      - name: Coverage Summary
        working-directory: ${{ matrix.package.workdir }}
        run: |
          echo "## Coverage Summary (${{ matrix.package.package }})" >> $GITHUB_STEP_SUMMARY
          echo "**Coverage:** ${{ env.LINE_COVERAGE_PERCENTAGE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "${{ matrix.package.buildOutputDir }}/coverage-summary.txt" ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat "${{ matrix.package.buildOutputDir }}/coverage-summary.txt" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

  coverage-report:
    permissions:
      contents: read
      actions: read
    needs: cpp-tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          path: coverage-reports

      - name: Combine Coverage Reports
        run: |
          echo "## C++ Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for report in coverage-reports/*/coverage-summary.txt; do
            if [ -f "$report" ]; then
              pkg=$(basename $(dirname "$report"))
              echo "### $pkg" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              cat "$report" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done
