name: Build and Publish QVAC SDK (sdk)

# Releases @qvac/sdk (npm) and tetherto-qvac-sdk (PyPI).
#
# @qvac/inference releases from publish-inference.yml. When both packages move to
# a new major.minor, the engine is published there first: this workflow installs
# the committed @qvac/inference range from npm, and the SDK's lint requires that
# range to match the SDK's own major and minor.
#
# A push to main / feature-* / tmp-* publishes @tetherto/sdk-mono and
# @tetherto/inference-mono to GitHub Packages from this workflow in a single run,
# so the SDK build pins the engine built beside it by the shared run id.

on:
  push:
    branches:
      - main
      - release-sdk-*
      - feature-*
      - tmp-*
    paths:
      - "packages/inference/**"
      - "packages/sdk/**"
      - "packages/sdk-python/**"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for publishing (optional override for GPR)"
        required: false
        default: "dev"
      npm_tag:
        description: "NPM dist-tag (default: latest). e.g. release-1.x"
        required: false
        default: ""
        type: string
      publish_pypi_only:
        description: "Republish tetherto-qvac-sdk to PyPI only (same version as @qvac/sdk; skip npm)"
        required: false
        default: false
        type: boolean

env:
  WORKDIR: packages/sdk

permissions:
  contents: read

jobs:
  fork-approval:
    permissions:
      statuses: write
    uses: ./.github/workflows/reusable-fork-approval.yml
  authorize:
    needs: [fork-approval]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: read
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      - name: Checkout authorize-pr (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/authorize-pr
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Authorize
        id: auth
        uses: ./.github/actions/authorize-pr
        with:
          github-token: ${{ github.token }}

  release-merge-guard:
    name: Release Merge Guard
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref_name, 'release-sdk-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/release-merge-guard
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: ${{ github.ref_name }}
          base-sha: ${{ github.event.before }}
          head-sha: ${{ github.sha }}
          package-slug: sdk
          package-json-path: packages/sdk/package.json
          changelog-path: packages/sdk/CHANGELOG.md

  build:
    needs:
      - fork-approval
      - authorize
    if: (needs.authorize.outputs.allowed == 'true')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    env:
      READ_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WRITE_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      READ_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify @qvac/sdk and python versions match
        shell: bash
        run: |
          # tetherto-qvac-sdk is generated from @qvac/sdk and publishes at the
          # same version. Regenerate it (`scripts/generate.py`) to align.
          # @qvac/inference has its own version; the SDK's dependency range on it
          # is checked by the SDK's enforce-inference-versions lint step.
          set -euo pipefail
          REF="${GITHUB_SHA}"
          SDK_VER=$(git show "${REF}":packages/sdk/package.json | jq -r .version)
          PY_VER=$(git show "${REF}":packages/sdk-python/src/tetherto/qvac_sdk/_generated/sdk_version.py | sed -n 's/^SDK_VERSION = "\(.*\)"/\1/p')
          if [ -z "$PY_VER" ]; then
            echo "::error title=Version mismatch::Could not parse SDK_VERSION from sdk_version.py at ${REF}"
            exit 1
          fi
          if [ "$PY_VER" != "$SDK_VER" ]; then
            echo "::error title=Version mismatch::tetherto-qvac-sdk@$PY_VER vs @qvac/sdk@$SDK_VER at ${REF}. Run packages/sdk-python/scripts/generate.py before release."
            exit 1
          fi
          echo "OK: @qvac/sdk and tetherto-qvac-sdk both at $SDK_VER (verified at ${REF})"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # 2.2.0
        with:
          bun-version: latest

      - name: Configure scoped registry for @tetherto and @qvac packages
        env:
          GIT_PAT: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: |
          echo "Configuring scoped registry for @tetherto and @qvac packages..."
          set -eu
          echo "Writing .npmrc for dual registry install…"
          cat > .npmrc <<NPMRC
          registry=https://registry.npmjs.org/
          @qvac:registry=https://registry.npmjs.org/
          @tetherto:registry=https://npm.pkg.github.com/
          //npm.pkg.github.com/:_authToken=${GIT_PAT}
          NPMRC

          # Optional: make private git deps work without prompting
          if [ -n "${GIT_PAT:-}" ]; then
            git config --global url."https://${GIT_PAT}:@github.com/".insteadOf "https://github.com/"
          else
            # Using the workflow's GITHUB_TOKEN for git clones when possible
            git config --global url."https://${{ github.token }}:@github.com/".insteadOf "https://github.com/"
          fi

          # Configure bunfig.toml for reading packages (in same dir as package.json)
          cat > bunfig.toml << EOF
          [install]
          registry = "https://registry.npmjs.org/"

          [install.scopes]
          "@tetherto" = { token = "${{ env.READ_NPM_TOKEN }}", url = "https://npm.pkg.github.com" }
          EOF

      # Dev builds compile against the in-repo @qvac/inference at this commit,
      # because the engine they publish is the one built beside them in this run
      # (publish-gpr pins the SDK mono build to that @tetherto/inference-mono).
      #
      # A release build compiles against the committed range instead, installed
      # from npm below. The engine for a release is published by
      # publish-inference.yml beforehand, so the range resolves; the in-repo copy
      # can sit ahead of it, since a release branch is cut from main.
      - name: Build against workspace @qvac/inference
        if: ${{ !startsWith(github.ref_name, 'release-sdk-') }}
        run: bun run sdk-source:workspace
        working-directory: ${{ env.WORKDIR }}

      - name: Install dependencies
        run: bun install
        working-directory: ${{ env.WORKDIR }}

      - name: Modify package name for branch-based builds
        working-directory: ${{ env.WORKDIR }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          # Only modify package name for main, fix-*, feature-* branches
          case "$BRANCH_NAME" in
            release-*)
              echo "Release branch - keeping original package name"
              exit 0
              ;;
            main)
              SUFFIX="mono"
              ;;
            fix-*|feature-*)
              SUFFIX=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | tr '[:upper:]' '[:lower:]')
              ;;
            *)
              echo "Branch $BRANCH_NAME not configured for modified package name"
              exit 0
              ;;
          esac

          echo "Modifying package for branch: $BRANCH_NAME"

          # Change namespace from @qvac to @tetherto and add suffix
          ORIGINAL_NAME=$(node -p "require('./package.json').name")
          NEW_NAME="@tetherto/sdk-${SUFFIX}"

          echo "Package name: $ORIGINAL_NAME → $NEW_NAME"

          # Update package.json
          jq ".name = \"${NEW_NAME}\"" package.json > package.json.tmp
          mv package.json.tmp package.json

          MODIFIED_NAME=$(node -p "require('./package.json').name")
          echo "✓ Modified package.json: $MODIFIED_NAME"

          # Update @qvac/cli references in withMobileBundle.ts to @tetherto/cli-mono
          MOBILE_BUNDLE_FILE="expo/plugins/withMobileBundle.ts"
          if [ -f "$MOBILE_BUNDLE_FILE" ]; then
            echo "Updating @qvac/cli references in $MOBILE_BUNDLE_FILE to @tetherto/cli-mono"
            sed -i.bak "s|\"@qvac\"|\"@tetherto\"|g" "$MOBILE_BUNDLE_FILE"
            sed -i.bak "s|\"cli\"|\"cli-mono\"|g" "$MOBILE_BUNDLE_FILE"
            sed -i.bak "s|@qvac/cli|@tetherto/cli-mono|g" "$MOBILE_BUNDLE_FILE"
            sed -i.bak "s|npx qvac|npx tetherto|g" "$MOBILE_BUNDLE_FILE"
            rm "${MOBILE_BUNDLE_FILE}.bak"
            echo "✓ Updated $MOBILE_BUNDLE_FILE"
          fi

          # Update references in expo-rpc-client.ts
          EXPO_RPC_CLIENT_FILE="client/rpc/expo-rpc-client.ts"
          if [ -f "$EXPO_RPC_CLIENT_FILE" ]; then
            echo "Updating @qvac/sdk references in $EXPO_RPC_CLIENT_FILE to $NEW_NAME"
            sed -i.bak "s|@qvac/sdk|${NEW_NAME}|g" "$EXPO_RPC_CLIENT_FILE"
            rm "${EXPO_RPC_CLIENT_FILE}.bak"
            echo "✓ Updated $EXPO_RPC_CLIENT_FILE"
          fi

      - name: Build (includes lint, typecheck, compile)
        run: bun run build
        working-directory: ${{ env.WORKDIR }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: dist
          path: ${{ env.WORKDIR }}/dist/
          retention-days: 30

      - name: Determine version and tag
        id: version
        working-directory: ${{ env.WORKDIR }}
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BASE_VERSION=$(node -p "require('./package.json').version")

          if [ "$BRANCH_NAME" = "main" ]; then
            VERSION="$BASE_VERSION"
            TAG="latest"
            echo "Publishing main branch as @latest"
          else
            # Clean branch name for npm (replace invalid chars with -)
            CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9.-]/-/g')
            VERSION="${BASE_VERSION}-${CLEAN_BRANCH}.$(date +%s).${GITHUB_SHA:0:7}"
            TAG="$CLEAN_BRANCH"
            echo "Publishing branch '$BRANCH_NAME' as @$TAG"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      branch: ${{ steps.version.outputs.branch }}

  # Dev builds only: the engine artifact feeds publish-gpr-inference, which the
  # SDK mono build pins. Release builds of the engine come from
  # publish-inference.yml.
  build-inference:
    name: Build @qvac/inference
    needs: [build, publish-logic]
    if: ${{ needs.publish-logic.outputs.publish_main == 'true' || needs.publish-logic.outputs.publish_feature == 'true' || needs.publish-logic.outputs.publish_tmp == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The scoped-registry step below writes an @tetherto GPR authToken into
      # .npmrc/bunfig. GITHUB_TOKEN is bounded by this block (PAT_TOKEN was not),
      # so declare the scope the config implies.
      packages: read
    env:
      WORKDIR_INFERENCE: packages/inference
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # 2.2.0
        with:
          bun-version: latest

      - name: Configure scoped registry for @tetherto and @qvac packages
        shell: bash
        working-directory: ${{ env.WORKDIR_INFERENCE }}
        env:
          GIT_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cat > .npmrc <<NPMRC
          registry=https://registry.npmjs.org/
          @qvac:registry=https://registry.npmjs.org/
          @tetherto:registry=https://npm.pkg.github.com/
          //npm.pkg.github.com/:_authToken=${GIT_PAT}
          NPMRC

          cat > bunfig.toml <<BUNFIG
          [install]
          registry = "https://registry.npmjs.org/"

          [install.scopes]
          "@tetherto" = { token = "${GIT_PAT}", url = "https://npm.pkg.github.com" }
          BUNFIG

      - name: Install dependencies
        working-directory: ${{ env.WORKDIR_INFERENCE }}
        run: bun install

      - name: Build
        working-directory: ${{ env.WORKDIR_INFERENCE }}
        run: bun run build

      - name: Upload inference dist artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: dist-inference
          path: ${{ env.WORKDIR_INFERENCE }}/dist/
          if-no-files-found: error
          retention-days: 30

  build-sdk-python:
    name: Build tetherto-qvac-sdk (Python)
    needs:
      - fork-approval
      - authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.10"

      - name: Install build tooling
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -U pip
          .venv/bin/pip install --quiet build twine
          .venv/bin/pip install --quiet -e ".[gen]"

      - name: Contract check
        run: .venv/bin/python3 scripts/generate.py --check

      - name: Build
        run: .venv/bin/python3 -m build --sdist --wheel --outdir dist/

      - name: Verify python version matches @qvac/sdk
        working-directory: ${{ github.workspace }}
        run: |
          # tetherto-qvac-sdk is generated from @qvac/sdk and publishes at the
          # same version. This job can run standalone (publish_pypi_only), so it
          # checks python against the SDK itself rather than relying on the
          # build job's check.
          set -euo pipefail
          REF="${GITHUB_SHA}"
          SDK_VER=$(git show "${REF}":packages/sdk/package.json | jq -r .version)
          PY_VER=$(git show "${REF}":packages/sdk-python/src/tetherto/qvac_sdk/_generated/sdk_version.py | sed -n 's/^SDK_VERSION = "\(.*\)"/\1/p')
          if [ -z "$PY_VER" ]; then
            echo "::error title=Version mismatch::Could not parse SDK_VERSION from sdk_version.py at ${REF}"
            exit 1
          fi
          if [ "$PY_VER" != "$SDK_VER" ]; then
            echo "::error title=Version mismatch::tetherto-qvac-sdk@$PY_VER vs @qvac/sdk@$SDK_VER at ${REF}. Run packages/sdk-python/scripts/generate.py before release."
            exit 1
          fi
          echo "OK: tetherto-qvac-sdk and @qvac/sdk both at $SDK_VER (verified at ${REF})"

      - name: Check metadata
        run: .venv/bin/twine check dist/*

      - name: Upload python dist artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: dist-sdk-python
          path: packages/sdk-python/dist/*
          if-no-files-found: error
          retention-days: 30

  publish-logic:
    runs-on: ubuntu-latest
    outputs:
      publish_main: ${{ steps.logic.outputs.publish_main }}
      publish_release: ${{ steps.logic.outputs.publish_release }}
      publish_feature: ${{ steps.logic.outputs.publish_feature }}
      publish_tmp: ${{ steps.logic.outputs.publish_tmp }}
      gpr_tag: ${{ steps.logic.outputs.gpr_tag }}
    steps:
      - id: logic
        shell: bash
        run: |
          set -euo pipefail
          ref_name="${GITHUB_REF_NAME}"
          event_name="${GITHUB_EVENT_NAME}"

          publish_main="false"
          publish_release="false"
          publish_feature="false"
          publish_tmp="false"

          if [ "$event_name" = "push" ] || [ "$event_name" = "workflow_dispatch" ]; then
            if [ "$ref_name" = "main" ]; then
              publish_main="true"
            elif [[ "$ref_name" == release-sdk-* ]]; then
              publish_release="true"
            elif [[ "$ref_name" == feature-* ]]; then
              publish_feature="true"
            elif [[ "$ref_name" == tmp-* ]]; then
              publish_tmp="true"
            fi
          fi

          gpr_tag="dev"
          if [ "$ref_name" = "main" ]; then
            gpr_tag="dev"
          elif [[ "$ref_name" == feature-* ]]; then
            gpr_tag="feature"
          elif [[ "$ref_name" == tmp-* ]]; then
            gpr_tag="temp"
          fi

          echo "publish_main=$publish_main" >> "$GITHUB_OUTPUT"
          echo "publish_release=$publish_release" >> "$GITHUB_OUTPUT"
          echo "publish_feature=$publish_feature" >> "$GITHUB_OUTPUT"
          echo "publish_tmp=$publish_tmp" >> "$GITHUB_OUTPUT"
          echo "gpr_tag=$gpr_tag" >> "$GITHUB_OUTPUT"

  publish-gpr:
    name: Publish to GitHub Packages (GPR)
    needs: [build, publish-logic, publish-gpr-inference]
    if: ${{ needs.publish-logic.outputs.publish_main == 'true' || needs.publish-logic.outputs.publish_feature == 'true' || needs.publish-logic.outputs.publish_tmp == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: ./.github/actions/download-release-artifact
        with:
          name: dist
          path: ${{ runner.temp }}/dist-staging

      - name: Move dist from staging to workspace
        shell: bash
        run: |
          mkdir -p ${{ env.WORKDIR }}/dist
          cp -r ${{ runner.temp }}/dist-staging/. ${{ env.WORKDIR }}/dist/
          echo "Dist moved from staging area"
          ls -la ${{ env.WORKDIR }}/dist/

      - name: Modify package name for branch-based test publishing
        working-directory: ${{ env.WORKDIR }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          # Extract suffix from branch patterns
          case "$BRANCH_NAME" in
            dev)
              SUFFIX="dev"
              ;;
            fix-*|feature-*)
              SUFFIX=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | tr '[:upper:]' '[:lower:]')
              ;;
            *)
              echo "Branch $BRANCH_NAME not configured for modified package name"
              exit 0
              ;;
          esac

          echo "Modifying package name for branch: $BRANCH_NAME → suffix: $SUFFIX"

          # Modify package.json
          ORIGINAL_NAME=$(node -p "require('./package.json').name")
          NEW_NAME="${ORIGINAL_NAME}-${SUFFIX}"

          jq ".name = \"${NEW_NAME}\"" package.json > package.json.tmp
          mv package.json.tmp package.json

          MODIFIED_NAME=$(node -p "require('./package.json').name")
          echo "Package name: $ORIGINAL_NAME → $MODIFIED_NAME"

      # The dist was compiled against the in-repo engine, so the published mono
      # build must depend on the inference published in THIS run, not the stale
      # public @qvac/inference. GPR uses ${version}-tmp.runid-${run_id}, and
      # run_id is shared across jobs, so this pin matches the co-published
      # @tetherto/inference-mono exactly. An npm alias keeps the SDK's own
      # `import '@qvac/inference'` resolving to that package.
      # Fail closed: only pin when the inference GPR publish actually succeeded.
      # publish-gpr-inference is continue-on-error and its action writes
      # gpr_published_version even on a failed publish, so a non-empty check
      # alone could pin to a version that was never published (install -> 404).
      # If inference didn't publish, leave the committed range — installable,
      # just not this run's engine.
      - name: Pin @qvac/inference to the co-published inference-mono
        if: needs.publish-gpr-inference.result == 'success'
        working-directory: ${{ env.WORKDIR }}
        env:
          INFERENCE_MONO_VERSION: ${{ needs.publish-gpr-inference.outputs.published_version }}
        run: |
          set -euo pipefail
          if [ -z "${INFERENCE_MONO_VERSION}" ]; then
            echo "::warning::inference-mono version unavailable; leaving @qvac/inference unchanged"
            exit 0
          fi
          SPEC="npm:@tetherto/inference-mono@${INFERENCE_MONO_VERSION}"
          echo "Pinning @qvac/inference -> ${SPEC}"
          jq --arg spec "$SPEC" '.dependencies["@qvac/inference"] = $spec' package.json > package.json.tmp
          mv package.json.tmp package.json
          node -p "'@qvac/inference -> ' + require('./package.json').dependencies['@qvac/inference']"

      - name: Publish to GitHub Package Registry
        id: publish
        uses: ./.github/actions/publish-library-to-gpr
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag || github.event.inputs.tag || needs.publish-logic.outputs.gpr_tag || 'dev'}}
          workdir: ${{ env.WORKDIR }}
          name-suffix: "-mono"

  publish-gpr-inference:
    name: Publish @qvac/inference to GitHub Packages (GPR)
    needs: [build-inference, publish-logic]
    if: ${{ needs.publish-logic.outputs.publish_main == 'true' || needs.publish-logic.outputs.publish_feature == 'true' || needs.publish-logic.outputs.publish_tmp == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      published_version: ${{ steps.publish.outputs.gpr_published_version }}
    permissions:
      contents: read
      packages: write
    env:
      WORKDIR_INFERENCE: packages/inference
      # prepare runs tsc; publish the prebuilt dist only.
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Download inference dist artifact
        uses: ./.github/actions/download-release-artifact
        with:
          name: dist-inference
          path: ${{ env.WORKDIR_INFERENCE }}/dist/

      - name: Modify inference package name for branch-based test publishing
        working-directory: ${{ env.WORKDIR_INFERENCE }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          case "$BRANCH_NAME" in
            dev)
              SUFFIX="dev"
              ;;
            fix-*|feature-*)
              SUFFIX=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | tr '[:upper:]' '[:lower:]')
              ;;
            *)
              echo "Branch $BRANCH_NAME not configured for modified package name"
              exit 0
              ;;
          esac

          echo "Modifying inference package name for branch: $BRANCH_NAME → suffix: $SUFFIX"

          ORIGINAL_NAME=$(node -p "require('./package.json').name")
          NEW_NAME="${ORIGINAL_NAME}-${SUFFIX}"

          jq ".name = \"${NEW_NAME}\"" package.json > package.json.tmp
          mv package.json.tmp package.json

          MODIFIED_NAME=$(node -p "require('./package.json').name")
          echo "Package name: $ORIGINAL_NAME → $MODIFIED_NAME"

      - name: Publish to GitHub Package Registry
        id: publish
        uses: ./.github/actions/publish-library-to-gpr
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag || github.event.inputs.tag || needs.publish-logic.outputs.gpr_tag || 'dev'}}
          workdir: ${{ env.WORKDIR_INFERENCE }}
          name-suffix: "-mono"

  publish-npm:
    name: Publish to NPM
    needs:
      - fork-approval
      - build
      - publish-logic
      - release-merge-guard
    if: >-
      needs.publish-logic.outputs.publish_release == 'true' &&
      (needs.release-merge-guard.result == 'success' || needs.release-merge-guard.result == 'skipped') &&
      !(github.event_name == 'workflow_dispatch' && inputs.publish_pypi_only == true)
    runs-on: ubuntu-latest
    environment: npm
    outputs:
      published_version: ${{ steps.publish.outputs.npm_published_version }}
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Validate npm_tag input
        if: inputs.npm_tag != ''
        shell: bash
        run: |
          tag="${{ inputs.npm_tag }}"
          if ! echo "$tag" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'; then
            echo "::error::Invalid npm dist-tag '$tag'. Must match ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ (e.g. release-1.x)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: ./.github/actions/download-release-artifact
        with:
          name: dist
          path: ${{ runner.temp }}/dist-staging

      - name: Move dist from staging to workspace
        shell: bash
        run: |
          mkdir -p ${{ env.WORKDIR }}/dist
          cp -r ${{ runner.temp }}/dist-staging/. ${{ env.WORKDIR }}/dist/
          echo "Dist moved from staging area"
          ls -la ${{ env.WORKDIR }}/dist/

      - name: Determine dist-tag
        id: dist-tag
        uses: tetherto/qvac-actions/npm-dist-tag-determination@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
        with:
          workdir: ${{ env.WORKDIR }}
          tag: ${{ inputs.npm_tag }}

      - name: Publish to NPM Package Registry
        id: publish
        uses: tetherto/qvac-actions/publish-library-to-npm@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
        with:
          tag: ${{ steps.dist-tag.outputs.tag }}
          workdir: ${{ env.WORKDIR }}

  publish-pypi:
    name: Publish tetherto-qvac-sdk to PyPI
    needs:
      - fork-approval
      - authorize
      - build-sdk-python
      - publish-logic
      - release-merge-guard
      - publish-npm
    # Publishes after @qvac/sdk reaches npm, at the same version. Escape hatch:
    # workflow_dispatch with publish_pypi_only=true (npm already shipped).
    if: >-
      always() &&
      github.repository == 'tetherto/qvac' &&
      needs.authorize.outputs.allowed == 'true' &&
      needs.build-sdk-python.result == 'success' &&
      (
        (
          needs.publish-logic.outputs.publish_release == 'true' &&
          (needs.release-merge-guard.result == 'success' || needs.release-merge-guard.result == 'skipped') &&
          needs.publish-npm.result == 'success'
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_pypi_only == true
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/tetherto-qvac-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: dist-sdk-python
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Create GitHub release only for actual releases (after NPM publish).
  # PyPI is separate; recover with workflow_dispatch publish_pypi_only.
  publish-release:
    needs: [publish-npm]
    if: >-
      needs.publish-npm.result == 'success' && needs.publish-npm.outputs.published_version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/create-github-release.yml
    with:
      repo_name: "sdk"
      release_name: "QVAC SDK"
      published_version: ${{ needs.publish-npm.outputs.published_version }}
      prev_sha: ${{ github.event.before }}
      workdir: "packages/sdk"

  # Build the self-contained per-platform tetherto-qvac-sdk wheels and attach
  # them to the sdk-v<version> release the job above just created, for a turnkey
  # `pip install ... -f <release>` with no separate worker. Runs after the
  # release exists; the same workflow is dispatchable by hand for backfills.
  attach-fat-wheels:
    needs: [publish-release, publish-npm]
    if: ${{ needs.publish-npm.outputs.published_version != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-sdk-python-fat-wheels.yml
    with:
      version: ${{ needs.publish-npm.outputs.published_version }}
