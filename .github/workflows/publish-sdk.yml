name: Build and Publish QVAC SDK (sdk)

on:
  push:
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/inference/**"
      - "packages/sdk/**"
      - "packages/bare-sdk/**"
      - "packages/sdk-python/**"
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
    branches:
      - release-*
      - feature-*
      - tmp-*
      - main
    paths:
      - "packages/inference/**"
      - "packages/sdk/**"
      - "packages/bare-sdk/**"
      - "packages/sdk-python/**"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for publishing (optional override for GPR)"
        required: false
        default: "dev"
      npm_tag:
        description: "NPM dist-tag (default: latest). e.g. release-1.x"
        required: false
        default: ""
        type: string
      publish_pypi_only:
        description: "Republish tetherto-qvac-sdk to PyPI only (lockstep version; skip npm)"
        required: false
        default: false
        type: boolean

env:
  WORKDIR: packages/sdk

permissions:
  contents: read

jobs:
  fork-approval:
    permissions:
      statuses: write
    uses: ./.github/workflows/reusable-fork-approval.yml
  authorize:
    needs: [fork-approval]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: read
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      - name: Checkout authorize-pr (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/authorize-pr
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Authorize
        id: auth
        uses: ./.github/actions/authorize-pr
        with:
          github-token: ${{ github.token }}

  release-merge-guard:
    name: Release Merge Guard
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref_name, 'release-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-merge-guard
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: ${{ github.ref_name }}
          base-sha: ${{ github.event.before }}
          head-sha: ${{ github.sha }}
          package-slug: sdk
          package-json-path: packages/sdk/package.json
          changelog-path: packages/sdk/CHANGELOG.md

  build:
    needs:
      - fork-approval
      - authorize
    if: (needs.authorize.outputs.allowed == 'true')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    env:
      READ_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WRITE_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      READ_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch PR head commits
        if: github.event_name == 'pull_request_target'
        run: |
          git fetch origin ${{ github.event.pull_request.head.sha }}

      - name: Verify inference / sdk / bare-sdk / python version lockstep
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # pull_request_target pins the working tree to base.sha; read manifests
          # from the PR head SHA so a missed sdk / bare-sdk / python bump fails
          # pre-merge (pr-checks-sdk-python.yml may not run on an engine-only bump).
          #
          # @qvac/inference is the sole version anchor: sdk, bare-sdk and
          # sdk-python must all match it. Run /qv-sdk-lockstep-sync to align.
          set -euo pipefail
          REF="${PR_HEAD_SHA:-${GITHUB_SHA}}"
          INF_VER=$(git show "${REF}":packages/inference/package.json | jq -r .version)
          SDK_VER=$(git show "${REF}":packages/sdk/package.json | jq -r .version)
          BARE_VER=$(git show "${REF}":packages/bare-sdk/package.json | jq -r .version)
          PY_VER=$(git show "${REF}":packages/sdk-python/src/tetherto/qvac_sdk/_generated/sdk_version.py | sed -n 's/^SDK_VERSION = "\(.*\)"/\1/p')
          if [ -z "$PY_VER" ]; then
            echo "::error title=Version mismatch::Could not parse SDK_VERSION from sdk_version.py at ${REF}"
            exit 1
          fi
          if [ "$SDK_VER" != "$INF_VER" ]; then
            echo "::error title=Version mismatch::@qvac/sdk@$SDK_VER vs anchor @qvac/inference@$INF_VER at ${REF}. sdk must match the inference anchor. Run /qv-sdk-lockstep-sync before release."
            exit 1
          fi
          if [ "$BARE_VER" != "$INF_VER" ]; then
            echo "::error title=Version mismatch::@qvac/bare-sdk@$BARE_VER vs anchor @qvac/inference@$INF_VER at ${REF}. bare-sdk must match the inference anchor. Run /qv-sdk-lockstep-sync before release."
            exit 1
          fi
          if [ "$PY_VER" != "$INF_VER" ]; then
            echo "::error title=Version mismatch::tetherto-qvac-sdk@$PY_VER vs anchor @qvac/inference@$INF_VER at ${REF}. Run /qv-sdk-lockstep-sync before release."
            exit 1
          fi
          echo "OK: @qvac/inference, @qvac/sdk, @qvac/bare-sdk, and tetherto-qvac-sdk all at $INF_VER (verified at ${REF})"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # 2.2.0
        with:
          bun-version: latest

      - name: Configure scoped registry for @tetherto and @qvac packages
        env:
          GIT_PAT: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: |
          echo "Configuring scoped registry for @tetherto and @qvac packages..."
          set -eu
          echo "Writing .npmrc for dual registry install…"
          cat > .npmrc <<NPMRC
          registry=https://registry.npmjs.org/
          @qvac:registry=https://registry.npmjs.org/
          @tetherto:registry=https://npm.pkg.github.com/
          //npm.pkg.github.com/:_authToken=${GIT_PAT}
          NPMRC

          # Optional: make private git deps work without prompting
          if [ -n "${GIT_PAT:-}" ]; then
            git config --global url."https://${GIT_PAT}:@github.com/".insteadOf "https://github.com/"
          else
            # Using the workflow's GITHUB_TOKEN for git clones when possible
            git config --global url."https://${{ github.token }}:@github.com/".insteadOf "https://github.com/"
          fi

          # Configure bunfig.toml for reading packages (in same dir as package.json)
          cat > bunfig.toml << EOF
          [install]
          registry = "https://registry.npmjs.org/"

          [install.scopes]
          "@tetherto" = { token = "${{ env.READ_NPM_TOKEN }}", url = "https://npm.pkg.github.com" }
          EOF

      - name: Install dependencies
        run: bun install
        working-directory: ${{ env.WORKDIR }}

      - name: Modify package name for branch-based builds
        working-directory: ${{ env.WORKDIR }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          # Only modify package name for main, fix-*, feature-* branches
          case "$BRANCH_NAME" in
            release-*)
              echo "Release branch - keeping original package name"
              exit 0
              ;;
            main)
              SUFFIX="mono"
              ;;
            fix-*|feature-*)
              SUFFIX=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | tr '[:upper:]' '[:lower:]')
              ;;
            *)
              echo "Branch $BRANCH_NAME not configured for modified package name"
              exit 0
              ;;
          esac

          echo "Modifying package for branch: $BRANCH_NAME"

          # Change namespace from @qvac to @tetherto and add suffix
          ORIGINAL_NAME=$(node -p "require('./package.json').name")
          NEW_NAME="@tetherto/sdk-${SUFFIX}"

          echo "Package name: $ORIGINAL_NAME → $NEW_NAME"

          # Update package.json
          jq ".name = \"${NEW_NAME}\"" package.json > package.json.tmp
          mv package.json.tmp package.json

          MODIFIED_NAME=$(node -p "require('./package.json').name")
          echo "✓ Modified package.json: $MODIFIED_NAME"

          # Update @qvac/cli references in withMobileBundle.ts to @tetherto/cli-mono
          MOBILE_BUNDLE_FILE="expo/plugins/withMobileBundle.ts"
          if [ -f "$MOBILE_BUNDLE_FILE" ]; then
            echo "Updating @qvac/cli references in $MOBILE_BUNDLE_FILE to @tetherto/cli-mono"
            sed -i.bak "s|\"@qvac\"|\"@tetherto\"|g" "$MOBILE_BUNDLE_FILE"
            sed -i.bak "s|\"cli\"|\"cli-mono\"|g" "$MOBILE_BUNDLE_FILE"
            sed -i.bak "s|@qvac/cli|@tetherto/cli-mono|g" "$MOBILE_BUNDLE_FILE"
            sed -i.bak "s|npx qvac|npx tetherto|g" "$MOBILE_BUNDLE_FILE"
            rm "${MOBILE_BUNDLE_FILE}.bak"
            echo "✓ Updated $MOBILE_BUNDLE_FILE"
          fi

          # Update references in expo-rpc-client.ts
          EXPO_RPC_CLIENT_FILE="client/rpc/expo-rpc-client.ts"
          if [ -f "$EXPO_RPC_CLIENT_FILE" ]; then
            echo "Updating @qvac/sdk references in $EXPO_RPC_CLIENT_FILE to $NEW_NAME"
            sed -i.bak "s|@qvac/sdk|${NEW_NAME}|g" "$EXPO_RPC_CLIENT_FILE"
            rm "${EXPO_RPC_CLIENT_FILE}.bak"
            echo "✓ Updated $EXPO_RPC_CLIENT_FILE"
          fi

      - name: Build (includes lint, typecheck, compile)
        run: bun run build
        working-directory: ${{ env.WORKDIR }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: dist
          path: ${{ env.WORKDIR }}/dist/
          retention-days: 30

      - name: Determine version and tag
        id: version
        working-directory: ${{ env.WORKDIR }}
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          BASE_VERSION=$(node -p "require('./package.json').version")

          if [ "$BRANCH_NAME" = "main" ]; then
            VERSION="$BASE_VERSION"
            TAG="latest"
            echo "Publishing main branch as @latest"
          else
            # Clean branch name for npm (replace invalid chars with -)
            CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9.-]/-/g')
            VERSION="${BASE_VERSION}-${CLEAN_BRANCH}.$(date +%s).${GITHUB_SHA:0:7}"
            TAG="$CLEAN_BRANCH"
            echo "Publishing branch '$BRANCH_NAME' as @$TAG"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      branch: ${{ steps.version.outputs.branch }}

  build-bare-sdk:
    name: Build @qvac/bare-sdk (from sdk dist)
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WORKDIR_BARE: packages/bare-sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # 2.2.0
        with:
          bun-version: latest

      - name: Download @qvac/sdk dist artifact
        uses: ./.github/actions/download-release-artifact
        with:
          name: dist
          path: packages/sdk/dist/

      - name: Build bare-sdk (bundle from sdk + run guards)
        shell: bash
        working-directory: ${{ env.WORKDIR_BARE }}
        run: bun run build

      - name: Upload bare-sdk dist artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: dist-bare-sdk
          path: ${{ env.WORKDIR_BARE }}/dist/
          retention-days: 30

  build-inference:
    name: Build @qvac/inference
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The scoped-registry step below writes an @tetherto GPR authToken into
      # .npmrc/bunfig. GITHUB_TOKEN is bounded by this block (PAT_TOKEN was not),
      # so declare the scope the config implies.
      packages: read
    env:
      WORKDIR_INFERENCE: packages/inference
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # 2.2.0
        with:
          bun-version: latest

      - name: Configure scoped registry for @tetherto and @qvac packages
        shell: bash
        working-directory: ${{ env.WORKDIR_INFERENCE }}
        env:
          GIT_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cat > .npmrc <<NPMRC
          registry=https://registry.npmjs.org/
          @qvac:registry=https://registry.npmjs.org/
          @tetherto:registry=https://npm.pkg.github.com/
          //npm.pkg.github.com/:_authToken=${GIT_PAT}
          NPMRC

          cat > bunfig.toml <<BUNFIG
          [install]
          registry = "https://registry.npmjs.org/"

          [install.scopes]
          "@tetherto" = { token = "${GIT_PAT}", url = "https://npm.pkg.github.com" }
          BUNFIG

      - name: Install dependencies
        working-directory: ${{ env.WORKDIR_INFERENCE }}
        run: bun install

      - name: Build
        working-directory: ${{ env.WORKDIR_INFERENCE }}
        run: bun run build

      - name: Upload inference dist artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: dist-inference
          path: ${{ env.WORKDIR_INFERENCE }}/dist/
          if-no-files-found: error
          retention-days: 30

  build-sdk-python:
    name: Build tetherto-qvac-sdk (Python)
    needs:
      - fork-approval
      - authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      # pull_request_target: keep working tree on base.sha (do not execute PR head
      # under this job's secrets). Contract/build smoke the base tree; PR contract
      # coverage is pr-checks-sdk-python.yml. Lockstep reads head.sha like `build`.
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch PR head commits
        if: github.event_name == 'pull_request_target'
        working-directory: ${{ github.workspace }}
        run: |
          git fetch origin ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.10"

      - name: Install build tooling
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -U pip
          .venv/bin/pip install --quiet build twine
          .venv/bin/pip install --quiet -e ".[gen]"

      - name: Contract check
        run: .venv/bin/python3 scripts/generate.py --check

      - name: Build
        run: .venv/bin/python3 -m build --sdist --wheel --outdir dist/

      - name: Verify version lockstep with @qvac/inference
        working-directory: ${{ github.workspace }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # @qvac/inference is the sole version anchor. This job can run
          # standalone (publish_pypi_only), so check python against the anchor.
          set -euo pipefail
          REF="${PR_HEAD_SHA:-${GITHUB_SHA}}"
          INF_VER=$(git show "${REF}":packages/inference/package.json | jq -r .version)
          PY_VER=$(git show "${REF}":packages/sdk-python/src/tetherto/qvac_sdk/_generated/sdk_version.py | sed -n 's/^SDK_VERSION = "\(.*\)"/\1/p')
          if [ -z "$PY_VER" ]; then
            echo "::error title=Version mismatch::Could not parse SDK_VERSION from sdk_version.py at ${REF}"
            exit 1
          fi
          if [ "$PY_VER" != "$INF_VER" ]; then
            echo "::error title=Version mismatch::tetherto-qvac-sdk@$PY_VER vs anchor @qvac/inference@$INF_VER at ${REF}. Run /qv-sdk-lockstep-sync before release."
            exit 1
          fi
          echo "OK: tetherto-qvac-sdk and @qvac/inference both at $INF_VER (verified at ${REF})"

      - name: Check metadata
        run: .venv/bin/twine check dist/*

      - name: Upload python dist artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: dist-sdk-python
          path: packages/sdk-python/dist/*
          if-no-files-found: error
          retention-days: 30

  publish-logic:
    runs-on: ubuntu-latest
    outputs:
      publish_main: ${{ steps.logic.outputs.publish_main }}
      publish_release: ${{ steps.logic.outputs.publish_release }}
      publish_feature: ${{ steps.logic.outputs.publish_feature }}
      publish_tmp: ${{ steps.logic.outputs.publish_tmp }}
      gpr_tag: ${{ steps.logic.outputs.gpr_tag }}
    steps:
      - id: logic
        shell: bash
        run: |
          set -euo pipefail
          ref_name="${GITHUB_REF_NAME}"
          event_name="${GITHUB_EVENT_NAME}"

          publish_main="false"
          publish_release="false"
          publish_feature="false"
          publish_tmp="false"

          if [ "$event_name" = "push" ] || [ "$event_name" = "workflow_dispatch" ]; then
            if [ "$ref_name" = "main" ]; then
              publish_main="true"
            elif [[ "$ref_name" == release-* ]]; then
              publish_release="true"
            elif [[ "$ref_name" == feature-* ]]; then
              publish_feature="true"
            elif [[ "$ref_name" == tmp-* ]]; then
              publish_tmp="true"
            fi
          fi

          gpr_tag="dev"
          if [ "$ref_name" = "main" ]; then
            gpr_tag="dev"
          elif [[ "$ref_name" == feature-* ]]; then
            gpr_tag="feature"
          elif [[ "$ref_name" == tmp-* ]]; then
            gpr_tag="temp"
          fi

          echo "publish_main=$publish_main" >> "$GITHUB_OUTPUT"
          echo "publish_release=$publish_release" >> "$GITHUB_OUTPUT"
          echo "publish_feature=$publish_feature" >> "$GITHUB_OUTPUT"
          echo "publish_tmp=$publish_tmp" >> "$GITHUB_OUTPUT"
          echo "gpr_tag=$gpr_tag" >> "$GITHUB_OUTPUT"

  publish-gpr:
    name: Publish to GitHub Packages (GPR)
    needs: [build, publish-logic]
    if: ${{ needs.publish-logic.outputs.publish_main == 'true' || needs.publish-logic.outputs.publish_feature == 'true' || needs.publish-logic.outputs.publish_tmp == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Download build artifacts
        uses: ./.github/actions/download-release-artifact
        with:
          name: dist
          path: ${{ runner.temp }}/dist-staging

      - name: Move dist from staging to workspace
        shell: bash
        run: |
          mkdir -p ${{ env.WORKDIR }}/dist
          cp -r ${{ runner.temp }}/dist-staging/. ${{ env.WORKDIR }}/dist/
          echo "Dist moved from staging area"
          ls -la ${{ env.WORKDIR }}/dist/

      - name: Modify package name for branch-based test publishing
        working-directory: ${{ env.WORKDIR }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          # Extract suffix from branch patterns
          case "$BRANCH_NAME" in
            dev)
              SUFFIX="dev"
              ;;
            fix-*|feature-*)
              SUFFIX=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | tr '[:upper:]' '[:lower:]')
              ;;
            *)
              echo "Branch $BRANCH_NAME not configured for modified package name"
              exit 0
              ;;
          esac

          echo "Modifying package name for branch: $BRANCH_NAME → suffix: $SUFFIX"

          # Modify package.json
          ORIGINAL_NAME=$(node -p "require('./package.json').name")
          NEW_NAME="${ORIGINAL_NAME}-${SUFFIX}"

          jq ".name = \"${NEW_NAME}\"" package.json > package.json.tmp
          mv package.json.tmp package.json

          MODIFIED_NAME=$(node -p "require('./package.json').name")
          echo "Package name: $ORIGINAL_NAME → $MODIFIED_NAME"

      - name: Publish to GitHub Package Registry
        id: publish
        uses: ./.github/actions/publish-library-to-gpr
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag || github.event.inputs.tag || needs.publish-logic.outputs.gpr_tag || 'dev'}}
          workdir: ${{ env.WORKDIR }}
          name-suffix: "-mono"

  publish-gpr-bare-sdk:
    name: Publish @qvac/bare-sdk to GitHub Packages (GPR)
    needs: [build-bare-sdk, publish-logic]
    if: ${{ needs.publish-logic.outputs.publish_main == 'true' || needs.publish-logic.outputs.publish_feature == 'true' || needs.publish-logic.outputs.publish_tmp == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    env:
      WORKDIR_BARE: packages/bare-sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Download bare-sdk dist artifact
        uses: ./.github/actions/download-release-artifact
        with:
          name: dist-bare-sdk
          path: ${{ env.WORKDIR_BARE }}/dist/

      - name: Modify bare-sdk package name for branch-based test publishing
        working-directory: ${{ env.WORKDIR_BARE }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          case "$BRANCH_NAME" in
            dev)
              SUFFIX="dev"
              ;;
            fix-*|feature-*)
              SUFFIX=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | tr '[:upper:]' '[:lower:]')
              ;;
            *)
              echo "Branch $BRANCH_NAME not configured for modified package name"
              exit 0
              ;;
          esac

          echo "Modifying bare-sdk package name for branch: $BRANCH_NAME → suffix: $SUFFIX"

          ORIGINAL_NAME=$(node -p "require('./package.json').name")
          NEW_NAME="${ORIGINAL_NAME}-${SUFFIX}"

          jq ".name = \"${NEW_NAME}\"" package.json > package.json.tmp
          mv package.json.tmp package.json

          MODIFIED_NAME=$(node -p "require('./package.json').name")
          echo "Package name: $ORIGINAL_NAME → $MODIFIED_NAME"

      - name: Publish to GitHub Package Registry
        id: publish
        uses: ./.github/actions/publish-library-to-gpr
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag || github.event.inputs.tag || needs.publish-logic.outputs.gpr_tag || 'dev'}}
          workdir: ${{ env.WORKDIR_BARE }}
          name-suffix: "-mono"

  publish-gpr-inference:
    name: Publish @qvac/inference to GitHub Packages (GPR)
    needs: [build-inference, publish-logic]
    if: ${{ needs.publish-logic.outputs.publish_main == 'true' || needs.publish-logic.outputs.publish_feature == 'true' || needs.publish-logic.outputs.publish_tmp == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    env:
      WORKDIR_INFERENCE: packages/inference
      # prepare runs tsc; publish the prebuilt dist only.
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Download inference dist artifact
        uses: ./.github/actions/download-release-artifact
        with:
          name: dist-inference
          path: ${{ env.WORKDIR_INFERENCE }}/dist/

      - name: Modify inference package name for branch-based test publishing
        working-directory: ${{ env.WORKDIR_INFERENCE }}
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          case "$BRANCH_NAME" in
            dev)
              SUFFIX="dev"
              ;;
            fix-*|feature-*)
              SUFFIX=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | tr '[:upper:]' '[:lower:]')
              ;;
            *)
              echo "Branch $BRANCH_NAME not configured for modified package name"
              exit 0
              ;;
          esac

          echo "Modifying inference package name for branch: $BRANCH_NAME → suffix: $SUFFIX"

          ORIGINAL_NAME=$(node -p "require('./package.json').name")
          NEW_NAME="${ORIGINAL_NAME}-${SUFFIX}"

          jq ".name = \"${NEW_NAME}\"" package.json > package.json.tmp
          mv package.json.tmp package.json

          MODIFIED_NAME=$(node -p "require('./package.json').name")
          echo "Package name: $ORIGINAL_NAME → $MODIFIED_NAME"

      - name: Publish to GitHub Package Registry
        id: publish
        uses: ./.github/actions/publish-library-to-gpr
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag || github.event.inputs.tag || needs.publish-logic.outputs.gpr_tag || 'dev'}}
          workdir: ${{ env.WORKDIR_INFERENCE }}
          name-suffix: "-mono"

  publish-npm:
    name: Publish to NPM
    needs:
      - fork-approval
      - build
      - publish-logic
      - release-merge-guard
    if: >-
      needs.publish-logic.outputs.publish_release == 'true' &&
      (needs.release-merge-guard.result == 'success' || needs.release-merge-guard.result == 'skipped') &&
      !(github.event_name == 'workflow_dispatch' && inputs.publish_pypi_only == true)
    runs-on: ubuntu-latest
    environment: npm
    outputs:
      published_version: ${{ steps.publish.outputs.npm_published_version }}
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Validate npm_tag input
        if: inputs.npm_tag != ''
        shell: bash
        run: |
          tag="${{ inputs.npm_tag }}"
          if ! echo "$tag" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'; then
            echo "::error::Invalid npm dist-tag '$tag'. Must match ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ (e.g. release-1.x)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Download build artifacts
        uses: ./.github/actions/download-release-artifact
        with:
          name: dist
          path: ${{ runner.temp }}/dist-staging

      - name: Move dist from staging to workspace
        shell: bash
        run: |
          mkdir -p ${{ env.WORKDIR }}/dist
          cp -r ${{ runner.temp }}/dist-staging/. ${{ env.WORKDIR }}/dist/
          echo "Dist moved from staging area"
          ls -la ${{ env.WORKDIR }}/dist/

      - name: Determine dist-tag
        id: dist-tag
        uses: tetherto/qvac-actions/npm-dist-tag-determination@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
        with:
          workdir: ${{ env.WORKDIR }}
          tag: ${{ inputs.npm_tag }}

      - name: Publish to NPM Package Registry
        id: publish
        uses: tetherto/qvac-actions/publish-library-to-npm@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
        with:
          tag: ${{ steps.dist-tag.outputs.tag }}
          workdir: ${{ env.WORKDIR }}

  publish-npm-bare-sdk:
    name: Publish @qvac/bare-sdk to NPM
    needs:
      - fork-approval
      - build-bare-sdk
      - publish-logic
      - release-merge-guard
    if: >-
      needs.publish-logic.outputs.publish_release == 'true' &&
      (needs.release-merge-guard.result == 'success' || needs.release-merge-guard.result == 'skipped') &&
      !(github.event_name == 'workflow_dispatch' && inputs.publish_pypi_only == true)
    runs-on: ubuntu-latest
    environment: npm
    outputs:
      published_version: ${{ steps.publish.outputs.npm_published_version }}
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      WORKDIR_BARE: packages/bare-sdk
    steps:
      - name: Validate npm_tag input
        if: inputs.npm_tag != ''
        shell: bash
        run: |
          tag="${{ inputs.npm_tag }}"
          if ! echo "$tag" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'; then
            echo "::error::Invalid npm dist-tag '$tag'. Must match ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ (e.g. release-1.x)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Download bare-sdk dist artifact
        uses: ./.github/actions/download-release-artifact
        with:
          name: dist-bare-sdk
          path: ${{ env.WORKDIR_BARE }}/dist/

      - name: Determine dist-tag
        id: dist-tag-2
        uses: tetherto/qvac-actions/npm-dist-tag-determination@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
        with:
          workdir: ${{ env.WORKDIR_BARE }}
          tag: ${{ inputs.npm_tag }}

      - name: Publish to NPM Package Registry
        id: publish
        uses: tetherto/qvac-actions/publish-library-to-npm@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
        with:
          tag: ${{ steps.dist-tag-2.outputs.tag }}
          workdir: ${{ env.WORKDIR_BARE }}

  publish-npm-inference:
    name: Publish @qvac/inference to NPM
    needs:
      - fork-approval
      - build-inference
      - publish-logic
      - release-merge-guard
    if: >-
      needs.publish-logic.outputs.publish_release == 'true' &&
      (needs.release-merge-guard.result == 'success' || needs.release-merge-guard.result == 'skipped') &&
      !(github.event_name == 'workflow_dispatch' && inputs.publish_pypi_only == true)
    runs-on: ubuntu-latest
    environment: npm
    outputs:
      published_version: ${{ steps.publish.outputs.npm_published_version }}
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      WORKDIR_INFERENCE: packages/inference
      # prepare runs tsc; publish the prebuilt dist only.
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      - name: Validate npm_tag input
        if: inputs.npm_tag != ''
        shell: bash
        run: |
          tag="${{ inputs.npm_tag }}"
          if ! echo "$tag" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'; then
            echo "::error::Invalid npm dist-tag '$tag'. Must match ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ (e.g. release-1.x)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Download inference dist artifact
        uses: ./.github/actions/download-release-artifact
        with:
          name: dist-inference
          path: ${{ env.WORKDIR_INFERENCE }}/dist/

      - name: Determine dist-tag
        id: dist-tag-inference
        uses: tetherto/qvac-actions/npm-dist-tag-determination@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
        with:
          workdir: ${{ env.WORKDIR_INFERENCE }}
          tag: ${{ inputs.npm_tag }}

      - name: Publish to NPM Package Registry
        id: publish
        uses: tetherto/qvac-actions/publish-library-to-npm@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
        with:
          tag: ${{ steps.dist-tag-inference.outputs.tag }}
          workdir: ${{ env.WORKDIR_INFERENCE }}

  publish-pypi:
    name: Publish tetherto-qvac-sdk to PyPI
    needs:
      - fork-approval
      - authorize
      - build-sdk-python
      - publish-logic
      - release-merge-guard
      - publish-npm
      - publish-npm-bare-sdk
      - publish-npm-inference
    # Lockstep release after npm publishes. Escape hatch:
    # workflow_dispatch with publish_pypi_only=true (npm already shipped).
    if: >-
      always() &&
      github.repository == 'tetherto/qvac' &&
      needs.authorize.outputs.allowed == 'true' &&
      needs.build-sdk-python.result == 'success' &&
      (
        (
          needs.publish-logic.outputs.publish_release == 'true' &&
          (needs.release-merge-guard.result == 'success' || needs.release-merge-guard.result == 'skipped') &&
          needs.publish-npm.result == 'success' &&
          needs.publish-npm-bare-sdk.result == 'success' &&
          needs.publish-npm-inference.result == 'success'
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_pypi_only == true
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/tetherto-qvac-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: dist-sdk-python
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Create GitHub release only for actual releases (after NPM publish).
  # Require all lockstep npm publishes before tagging sdk-v*.
  # PyPI is separate; recover with workflow_dispatch publish_pypi_only.
  publish-release:
    needs: [publish-npm, publish-npm-bare-sdk, publish-npm-inference]
    if: >-
      needs.publish-npm.result == 'success' && needs.publish-npm.outputs.published_version != ''
      && needs.publish-npm-bare-sdk.result == 'success' && needs.publish-npm-bare-sdk.outputs.published_version != ''
      && needs.publish-npm-inference.result == 'success' && needs.publish-npm-inference.outputs.published_version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/create-github-release.yml
    with:
      repo_name: "sdk"
      release_name: "QVAC SDK"
      published_version: ${{ needs.publish-npm.outputs.published_version }}
      prev_sha: ${{ github.event.before }}
      workdir: "packages/sdk"

  create-tag-inference:
    needs: [publish-npm-inference]
    if: needs.publish-npm-inference.result == 'success' && needs.publish-npm-inference.outputs.published_version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/create-release-tag.yml
    with:
      repo_name: "inference"
      published_version: ${{ needs.publish-npm-inference.outputs.published_version }}

  # Build the self-contained per-platform tetherto-qvac-sdk wheels and attach
  # them to the sdk-v<version> release the job above just created, for a turnkey
  # `pip install ... -f <release>` with no separate worker. Runs after the
  # release exists; the same workflow is dispatchable by hand for backfills.
  attach-fat-wheels:
    needs: [publish-release, publish-npm]
    if: ${{ needs.publish-npm.outputs.published_version != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-sdk-python-fat-wheels.yml
    with:
      version: ${{ needs.publish-npm.outputs.published_version }}
