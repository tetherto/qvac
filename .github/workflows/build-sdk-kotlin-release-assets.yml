# Build the Kotlin SDK Maven repository and attach one zip per Android runtime
# profile, plus the desktop JVM client, to a GitHub release as assets. A Gradle
# project extracts a zip and points a Maven repository at the directory, so it
# needs no Maven registry and no package-read token.
#
# Each Android zip embeds the worker and its native addons, hundreds of MB, so
# the AARs ship on the release rather than through a registry. Two triggers
# share one build:
#   - workflow_dispatch: build + attach to a chosen existing release tag
#     (backfill / re-run). Builds from `github.sha`, so the package version at
#     that commit must match the target tag.
#   - workflow_call: invoked by publish-sdk.yml after a release is created,
#     passing the published version.
name: Build sdk-kotlin release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the zips to (e.g. sdk-v0.23.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Published version; the release tag is sdk-v<version>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: packages/sdk-kotlin

jobs:
  build:
    name: Maven zips
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # gh release upload
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        working-directory: .
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${IN_VERSION:-}" ]; then
            tag="sdk-v${IN_VERSION}"
          else
            tag="${IN_TAG:-}"
          fi
          if [ -z "$tag" ]; then
            echo "::error::no tag resolved (need workflow_call version or dispatch tag)"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}"

      - name: Check out workflow revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          # Build from this workflow's revision; attach assets to the release tag.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: '3.10'

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 22

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # 5.2.0
        with:
          java-version: '17'
          distribution: temurin

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # 3.2.2

      - name: Install Android NDK
        run: sdkmanager 'ndk;29.0.14206865'

      - name: Verify version lockstep with the tag
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [ "$TAG" != "sdk-v$version" ]; then
            echo "::error::sdk-kotlin ${version} at ${GITHUB_SHA} != tag ${TAG}"
            exit 1
          fi
          echo "OK: sdk-kotlin ${version} matches ${TAG}"

      # The first build installs the exact-pinned @qvac/sdk and BareKit, builds
      # the in-repo worker and bundles it with the native addons for every
      # profile. verifyMavenPublications checks sources, docs and checksums of
      # each publication in build/maven-repository.
      - name: Build and verify the Maven repository
        run: ./gradlew --no-daemon verifyMavenPublications

      - name: Package release assets
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: ./scripts/package-release-assets.sh "${TAG#sdk-v}"

      # A zip records no commit and a rebuild is not byte-identical, so a
      # re-run replaces the assets; the dispatch trigger exists for that.
      - name: Upload zips to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: >-
          gh release upload "$TAG"
          build/release-assets/*-maven.zip build/release-assets/SHA256SUMS
          --repo "${{ github.repository }}" --clobber

      - name: Upload zips as build artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: sdk-kotlin-release-assets
          path: packages/sdk-kotlin/build/release-assets/
          if-no-files-found: error
