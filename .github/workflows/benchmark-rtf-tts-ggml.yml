name: Benchmark RTF (TTS GGML)

# Stub workflow registered on `main` so that `workflow_dispatch` shows up in
# the GitHub Actions UI and `gh workflow run` can target this filename.
#
# The full RTF benchmark orchestrator (context -> prebuild -> desktop RTF
# sweep across Chatterbox + Supertonic -> aggregate) will land in a follow-up
# PR.  Until then this stub keeps the workflow filename valid so feature
# branches can iterate on the real implementation without the dispatcher
# refusing to find the workflow on `main`.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to benchmark"
        required: false
      repository:
        description: "Repository to benchmark"
        required: false
        type: string

# Least-privilege default scoped to the file: the noop body only writes
# to stdout, so contents:read is enough.  Re-tighten/expand per job when
# the real orchestrator lands.



# Canonical runner labels — .github/actions/runner-names/runners.yaml
env:
  RN_ORCH: ubuntu-latest
  RN_U22: ubuntu-22.04
  RN_U24: ubuntu-24.04
  RN_U22_ARM: ubuntu-22.04-arm
  RN_U24_ARM: ubuntu-24.04-arm
  RN_MAC14: macos-14
  RN_MAC14_XL: macos-14-xlarge
  RN_MAC15: macos-15
  RN_MAC15_INTEL: macos-15-intel
  RN_MAC15_LG: macos-15-large
  RN_MAC15_XL: macos-15-xlarge
  RN_WIN22: windows-2022
  RN_WIN25: windows-2025
  RN_QVAC_U22: qvac-ubuntu2204-x64
  RN_QVAC_U22_GPU: qvac-ubuntu2204-x64-gpu
  RN_QVAC_U24: qvac-ubuntu2404-x64
  RN_QVAC_U24_GPU: qvac-ubuntu2404-x64-gpu
  RN_QVAC_WIN25: qvac-win25-x64
  RN_QVAC_WIN25_GPU: qvac-win25-x64-gpu
  RN_AI_LINUX: ai-run-linux
  RN_AI_LINUX_GPU: ai-run-linux-gpu
  RN_AI_U22: ai-run-ubuntu-22.04
  RN_AI_WIN11_GPU: ai-run-windows11-gpu
  RN_GEN_WIN11: generator-windows11
  RN_MINI_M4: mac-mini-m4
  RN_MINI_M4_GPU: mac-mini-m4-gpu
  RN_LBL_U22_X64: ubuntu-22.04-x64
  RN_LBL_U22_X64_GPU: ubuntu-22.04-x64-gpu
  RN_LBL_U24_X64: ubuntu-24.04-x64
  RN_LBL_U24_X64_GPU: ubuntu-24.04-x64-gpu
  RN_LBL_U24_ARM64: ubuntu-24.04-arm64
  RN_LBL_WIN22_X64: windows-2022-x64
  RN_LBL_WIN25_X64: windows-2025-x64
  RN_LBL_WIN25_X64_GPU: windows-2025-x64-gpu

permissions:
  contents: read

jobs:
  noop:
    name: Stub - real RTF benchmark orchestrator pending
    runs-on: ${{ env.RN_ORCH }}
    permissions:
      contents: read
    steps:
      - name: Explain
        run: |
          echo "This is a stub on main. The real RTF benchmark orchestrator"
          echo "(prebuild + RTF sweep across Chatterbox + Supertonic engines"
          echo "-> aggregate report) is planned for a follow-up PR."
          echo ""
          echo "To exercise the future implementation on a feature branch,"
          echo "dispatch this workflow with --ref <branch>."
