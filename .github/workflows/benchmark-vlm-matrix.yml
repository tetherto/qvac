name: Benchmark VLM Matrix

# QVAC-19178: full VLM benchmark matrix — {2 models x 2 mmproj} x {cpu,gpu} over a
# frozen 5-task x 5-sample fixture. Headline metric = mmproj/vision-encode time
# (Q8 vs f16). Linux leg here; the Samsung S25 leg reuses the same harness via the
# mobile Device Farm path. The aggregate job renders the matrices to the run summary.

on:
  # push trigger so this brand-new workflow can run on the feature branch
  # (workflow_dispatch only works once a workflow lands on the default branch).
  # Scoped to the benchmark files so unrelated commits don't re-trigger the matrix.
  push:
    branches: [qvac-19178-vlm-benchmark-mobile]
    paths:
      - 'packages/llm-llamacpp/test/integration/vlm-matrix-*.test.js'
      - 'packages/llm-llamacpp/test/integration/_vlm-matrix-common.js'
      - 'packages/llm-llamacpp/benchmarks/vlm-matrix/**'
      - '.github/workflows/benchmark-vlm-matrix.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test"
        type: string
        required: false
        default: qvac-19178-vlm-benchmark-mobile
      prebuild_package:
        description: "NPM package providing the addon prebuilds"
        type: string
        required: true
        default: "@qvac/llm-llamacpp@latest"

jobs:
  linux:
    timeout-minutes: ${{ matrix.timeout_minutes || 360 }}
    continue-on-error: true
    runs-on: ${{ matrix.runner }}
    environment: release
    name: linux-${{ matrix.label }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WORKDIR: packages/llm-llamacpp
      NO_GPU: ${{ matrix.no_gpu || 'false' }}
    permissions:
      contents: read
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            runner: qvac-ubuntu2204-x64
            no_gpu: 'true'
            devices: cpu
            label: linux-x64-cpu
          - os: ubuntu-24.04
            runner: qvac-ubuntu2404-x64-gpu
            timeout_minutes: 480
            devices: gpu
            label: linux-x64-gpu
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Manual Workspace Cleanup
        if: startsWith(matrix.runner, 'qvac-')
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install NPM dependencies
        working-directory: ${{ env.WORKDIR }}
        run: npm install

      - name: Install bare tooling
        run: npm install -g --force bare bare-make bare-runtime bare-https brittle

      - name: Download prebuilds from package
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          PACKAGE="${{ inputs.prebuild_package }}"
          echo "Downloading $PACKAGE from npm..."
          npm pack "$PACKAGE"
          tar -xzf *.tgz
          if [ ! -d "package/prebuilds" ]; then
            echo "ERROR: no prebuilds in package"; exit 1
          fi
          mv package/prebuilds ./prebuilds
          rm -rf package *.tgz
          ls -la prebuilds/

      - name: Run VLM matrix (${{ matrix.devices }})
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        env:
          QVAC_VLM_MATRIX: '1'
          QVAC_VLM_DEVICES: ${{ matrix.devices }}
        run: |
          npx brittle -r test/integration/all.js \
            test/integration/vlm-matrix-qwen-q8.test.js \
            test/integration/vlm-matrix-qwen-f16.test.js \
            test/integration/vlm-matrix-gemma-q8.test.js \
            test/integration/vlm-matrix-gemma-f16.test.js
          # don't fail the step on quality misses / per-cell errors — the matrix
          # captures them; the aggregate step always renders what we got.
          bare test/integration/all.js --exit 2>&1 | tee vlm-output-${{ matrix.label }}.log || true

      - name: Render matrix to step summary
        if: always()
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          node benchmarks/vlm-matrix/aggregate.js \
            --title "Linux ${{ matrix.label }}" \
            --out vlm-matrix-${{ matrix.label }}.md \
            vlm-output-${{ matrix.label }}.log
          cat vlm-matrix-${{ matrix.label }}.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rows + matrix
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: vlm-matrix-${{ matrix.label }}-${{ github.run_number }}
          path: |
            ${{ env.WORKDIR }}/vlm-output-${{ matrix.label }}.log
            ${{ env.WORKDIR }}/vlm-matrix-${{ matrix.label }}.md
          retention-days: 90
          if-no-files-found: ignore

  aggregate:
    needs: [linux]
    if: always()
    runs-on: ubuntu-latest
    name: aggregate-linux-matrix
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download all leg logs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          path: legs
          pattern: vlm-matrix-*-${{ github.run_number }}
          merge-multiple: true

      - name: Render combined Linux matrix to summary
        shell: bash
        run: |
          LOGS=$(find legs -name 'vlm-output-*.log' | tr '\n' ' ')
          echo "logs: $LOGS"
          node packages/llm-llamacpp/benchmarks/vlm-matrix/aggregate.js \
            --title "VLM Matrix — Linux (CPU + GPU)" \
            --out combined-linux.md $LOGS
          cat combined-linux.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined matrix
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: vlm-matrix-combined-linux-${{ github.run_number }}
          path: combined-linux.md
          if-no-files-found: ignore
