# TEMPORARY DIAGNOSTIC — QVAC-24365. Delete before this branch is merged.
#
# Why this exists: mobile runs schedule fine but the monitor step never gets
# any state back, and every AWS error was being swallowed by `2>/dev/null`, so
# we could not tell an IAM denial from a flaky API. This workflow makes the
# same calls the mobile pipeline makes, against the SAME OIDC role, with stderr
# kept, and prints a pass/fail map by Device Farm resource type.
#
# It costs nothing: no build, no app upload, no device time. Read-only calls on
# an already-finished run.
#
# Runs on push to its own branch only, because workflow_dispatch requires the
# workflow to exist on the default branch.
name: TMP Device Farm permission probe (QVAC-24365)

on:
  push:
    branches:
      - QVAC-24365/devicefarm-error-visibility

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    name: Probe Device Farm IAM permissions
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # 6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Probe
        shell: bash
        env:
          PROJECT_ARN: ${{ secrets.LLM_AWS_DEVICE_FARM_PROJECT_ARN }}
          # The run from https://github.com/tetherto/qvac/actions/runs/33537615113
          # whose monitor step could not read any state back.
          KNOWN_RUN_ARN: "arn:aws:devicefarm:us-west-2:833707431398:run:dcde833e-77ce-4248-976d-3828f303039c/5ef19af5-c0ef-42d7-88bc-4754582af6a4"
        run: |
          set -uo pipefail

          RESULTS=""

          # Run one AWS call with stderr kept. Never aborts the job — every
          # probe must run so we get the full allow/deny map in one pass.
          probe() {
            local label="$1" resource_type="$2"
            shift 2
            echo "::group::$label  [resource type: $resource_type]"
            echo "\$ $*"
            local out rc
            out=$("$@" 2>&1)
            rc=$?
            echo "$out"
            if [ $rc -eq 0 ]; then
              echo "-> exit 0 (ALLOWED)"
              RESULTS="${RESULTS}ALLOWED|${resource_type}|${label}\n"
            else
              echo "-> exit $rc (FAILED)"
              local reason
              reason=$(echo "$out" | grep -o '([A-Za-z]*Exception)' | head -1)
              [ -z "$reason" ] && reason="(no AWS exception name in output)"
              RESULTS="${RESULTS}DENIED |${resource_type}|${label} ${reason}\n"
            fi
            echo "::endgroup::"
          }

          echo "=================================================="
          echo "Who am I"
          echo "=================================================="
          probe "sts:GetCallerIdentity" "n/a" \
            aws sts get-caller-identity --output json

          echo "=================================================="
          echo "Calls that SUCCEED in the real pipeline (project / * scoped)"
          echo "=================================================="
          probe "devicefarm:ListProjects" "* (no resource)" \
            aws devicefarm list-projects --output json
          probe "devicefarm:GetProject" "project:" \
            aws devicefarm get-project --arn "$PROJECT_ARN" --output json
          probe "devicefarm:ListRuns" "project:" \
            aws devicefarm list-runs --arn "$PROJECT_ARN" --output json
          probe "devicefarm:ListDevicePools" "project:" \
            aws devicefarm list-device-pools --arn "$PROJECT_ARN" --output json

          echo "=================================================="
          echo "Calls the MONITOR step depends on (run: / job: scoped)"
          echo "=================================================="

          # Prefer a run ARN discovered live, so a stale/expired ARN can't be
          # mistaken for a permission problem. Fall back to the known one.
          DISCOVERED_RUN_ARN=""
          DISCOVERED_RUN_ARN=$(aws devicefarm list-runs --arn "$PROJECT_ARN" \
            --query 'runs[0].arn' --output text 2>/dev/null)
          if [ "$DISCOVERED_RUN_ARN" = "None" ]; then DISCOVERED_RUN_ARN=""; fi

          if [ -n "$DISCOVERED_RUN_ARN" ]; then
            echo "Most recent run discovered via ListRuns: $DISCOVERED_RUN_ARN"
            probe "devicefarm:GetRun (run discovered just now)" "run:" \
              aws devicefarm get-run --arn "$DISCOVERED_RUN_ARN" --output json
            probe "devicefarm:ListJobs (run discovered just now)" "run:" \
              aws devicefarm list-jobs --arn "$DISCOVERED_RUN_ARN" --output json

            JOB_ARN=""
            JOB_ARN=$(aws devicefarm list-jobs --arn "$DISCOVERED_RUN_ARN" \
              --query 'jobs[0].arn' --output text 2>/dev/null)
            if [ "$JOB_ARN" = "None" ]; then JOB_ARN=""; fi
            if [ -n "$JOB_ARN" ]; then
              probe "devicefarm:GetJob" "job:" \
                aws devicefarm get-job --arn "$JOB_ARN" --output json
              probe "devicefarm:ListSuites" "job:" \
                aws devicefarm list-suites --arn "$JOB_ARN" --output json
              probe "devicefarm:ListArtifacts" "job:" \
                aws devicefarm list-artifacts --arn "$JOB_ARN" --type FILE --output json
            else
              echo "(could not discover a job ARN — ListJobs returned nothing usable)"
            fi
          else
            echo "(could not discover a run ARN — ListRuns returned nothing usable)"
          fi

          probe "devicefarm:GetRun (the run from GH run 33537615113)" "run:" \
            aws devicefarm get-run --arn "$KNOWN_RUN_ARN" --output json
          probe "devicefarm:ListJobs (the run from GH run 33537615113)" "run:" \
            aws devicefarm list-jobs --arn "$KNOWN_RUN_ARN" --output json

          echo ""
          echo "=================================================="
          echo "SUMMARY — hand this to DevOps"
          echo "=================================================="
          printf "%b" "$RESULTS" | while IFS='|' read -r verdict rtype label; do
            printf '%-8s %-16s %s\n' "$verdict" "$rtype" "$label"
          done

          echo ""
          echo "Reading this: ScheduleRun/CreateUpload authorize against the"
          echo "*project* ARN, GetRun/ListJobs/GetJob authorize against the *run*"
          echo "and *job* ARNs. If the project rows are ALLOWED and the run/job"
          echo "rows are DENIED, the policy's Resource list needs the run/job"
          echo "ARNs added (or the actions themselves are missing)."

          {
            echo "## Device Farm IAM probe (QVAC-24365)"
            echo ""
            echo '```'
            printf "%b" "$RESULTS" | while IFS='|' read -r verdict rtype label; do
              printf '%-8s %-16s %s\n' "$verdict" "$rtype" "$label"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
