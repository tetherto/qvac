name: On PR Trigger (Fabric)

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/fabric/**"
      - ".github/workflows/*fabric*.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: read
  packages: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fork-approval:
    permissions:
      statuses: write
    uses: ./.github/workflows/reusable-fork-approval.yml
  ci-router:
    name: CI Router (label detection)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_verified_checks: ${{ steps.route.outputs.run_verified_checks }}
      run_prebuilds: ${{ steps.route.outputs.run_prebuilds }}
    steps:
      - name: Checkout ci-router composite (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/ci-router
          sparse-checkout-cone-mode: false
      - name: Route CI stages
        id: route
        uses: ./.github/actions/ci-router

  authorize:
    needs: [fork-approval]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: read
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      - name: Checkout authorize-pr (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/authorize-pr
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Authorize
        id: auth
        uses: ./.github/actions/authorize-pr
        with:
          github-token: ${{ github.token }}

  sanity-checks:
    needs:
      - fork-approval
      - authorize
      - ci-router
    if: needs.ci-router.outputs.run_verified_checks == 'true' && needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/packages/fabric/vcpkg/cache,readwrite"
      PKG_DIR: packages/fabric
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fetch PR head and target branch
        id: fetch_pr
        if: github.event_name == 'pull_request_target' || github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          git fetch origin "$HEAD_SHA:refs/pr/head"

      - name: Check PR Status with Target Branch
        continue-on-error: true
        id: target_branch_checks
        if: github.event_name == 'pull_request_target' || github.event_name == 'pull_request'
        env:
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git merge-base --is-ancestor "$TARGET_SHA" "$PR_HEAD_SHA"; then
            echo "::error title=PR is not up to date::This PR is not up to date with target branch"
          fi

      - name: Verify that yaml files are formatted
        id: yamlfmt
        uses: ./.github/actions/yamlfmt
        with:
          workdir: ${{ env.PKG_DIR }}
        continue-on-error: true

      - name: Check for disallowed dependencies
        id: check_dependencies
        continue-on-error: true
        working-directory: ${{ env.PKG_DIR }}
        run: |
          deps=$(jq -r '([.dependencies, .devDependencies] | map(select(type=="object")) | add // {}) | to_entries[] | .value' package.json)
          if echo "$deps" | grep -Eq '^(git\+https:\/\/github.com|[0-9]+\.[0-9]+\.[0-9]+-(dev|tmp)[^"]*)$'; then
            echo "::error title=Disallowed dependency detected::Do not use git URLs or dev/tmp versions in dependencies"
          fi

      - name: Run JavaScript tests
        id: run_js_tests
        continue-on-error: true
        uses: tetherto/qvac/.github/actions/run-lint-and-unit-tests@2e2c94d66a50c8b8851824314e343ede5297eb1f
        with:
          gpr-token: ${{ secrets.GITHUB_TOKEN }}
          pat-token: ${{ secrets.GITHUB_TOKEN }}
          registry-type: gpr
          workdir: ${{ env.PKG_DIR }}

      - name: Check for errors
        run: |
          count=0
          if [ "${{ steps.run_js_tests.outcome }}" = "failure" ]; then
            echo "::error::Step - Lint or unit tests failed"
            count=$((count + 1))
          fi
          if [ "${{ steps.yamlfmt.outcome }}" = "failure" ]; then
            echo "::error::Step - Verify that yaml files are formatted failed"
            count=$((count + 1))
          fi
          if [ "${{ steps.check_dependencies.outcome }}" = "failure" ]; then
            echo "::error::Step - Check for disallowed dependencies failed"
            count=$((count + 1))
          fi
          if [ "${{ steps.target_branch_checks.outcome }}" = "failure" ]; then
            echo "::error::Step - Check PR Status with Target Branch failed"
            count=$((count + 1))
          fi
          if [ "${{ steps.fetch_pr.outcome }}" = "failure" ]; then
            echo "::error::Step - Fetch PR head and target branch failed"
            count=$((count + 1))
          fi
          if [ $count -gt 0 ]; then
            echo "::error::There were $count failed checks"
            exit 1
          fi

  cpp-lint:
    needs:
      - fork-approval
      - authorize
      - ci-router
    if: needs.ci-router.outputs.run_verified_checks == 'true' && needs.authorize.outputs.allowed == 'true'
    uses: ./.github/workflows/cpp-lint.yaml
    secrets: inherit
    with:
      sha: ${{ github.event.pull_request.base.sha || github.sha }}
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      workdir: packages/fabric
      # Land ROCm on the base-branch workflow before a follow-up PR requests
      # qvac-fabric[hip-backend]. pull_request_target loads this YAML from
      # main, so cpp-lint would otherwise fail at find_dependency(hip).
      include-rocm-sdk: true

  detect-fabric-stack:
    if: needs.authorize.outputs.allowed == 'true'
    needs:
      - fork-approval
      - authorize
      - ci-router
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      fabric_stack: ${{ steps.detect.outputs.fabric_stack }}
    steps:
      - name: Checkout repository (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Detect fabric-stack PR
        id: detect
        uses: tetherto/qvac/.github/actions/detect-fabric-stack@6620d695d3a07cafe3931182e7844dde376a23f8

  fabric-stack-matrix:
    needs: [detect-fabric-stack]
    if: needs.detect-fabric-stack.outputs.fabric_stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      consumers: ${{ steps.set.outputs.consumers }}
    steps:
      - name: Checkout fabric-consumers manifest (PR head)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: .github/fabric-consumers.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Read npm_runtime consumers
        id: set
        shell: bash
        run: |
          CONSUMERS=$(jq -c '.npm_runtime' .github/fabric-consumers.json)
          echo "consumers=$CONSUMERS" >> "$GITHUB_OUTPUT"

  detect-native-changes:
    if: needs.ci-router.outputs.run_prebuilds == 'true' && needs.authorize.outputs.allowed == 'true'
    needs:
      - fork-approval
      - authorize
      - ci-router
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native_changed: ${{ steps.detect.outputs.native_changed }}
      native_hash: ${{ steps.detect.outputs.native_hash }}
    steps:
      - name: Checkout composite source (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Detect native file changes
        id: detect
        uses: ./.github/actions/detect-native-changes
        with:
          workdir: packages/fabric

  prebuild-artifact-reuse:
    if: |
      needs.detect-native-changes.outputs.native_changed == 'false' &&
      needs.detect-fabric-stack.outputs.fabric_stack != 'true'
    needs:
      - fork-approval
      - detect-native-changes
      - detect-fabric-stack
      - sanity-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      reuse_hit: ${{ steps.reuse.outputs.reuse_hit }}
    steps:
      - name: Checkout prebuild-artifact-reuse composite (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/prebuild-artifact-reuse
          sparse-checkout-cone-mode: false
      - name: Reuse prebuilds from a prior run
        id: reuse
        uses: ./.github/actions/prebuild-artifact-reuse
        with:
          github-token: ${{ github.token }}
          workflow-file: on-pr-fabric.yml
          native-hash: ${{ needs.detect-native-changes.outputs.native_hash }}
          pr-number: ${{ github.event.pull_request.number }}

  prebuild:
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    needs:
      - fork-approval
      - authorize
      - ci-router
      - sanity-checks
      - detect-native-changes
      - prebuild-artifact-reuse
    if: |
      always() &&
      needs.sanity-checks.result == 'success' &&
      needs.ci-router.outputs.run_prebuilds == 'true' &&
      needs.authorize.outputs.allowed == 'true' &&
      (needs.detect-native-changes.outputs.native_changed == 'true' || needs.prebuild-artifact-reuse.outputs.reuse_hit != 'true')
    uses: ./.github/workflows/prebuilds-fabric.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      ref: ${{ github.event.pull_request.head.sha || github.ref }}

  prebuild-artifact-save:
    if: always() && needs.prebuild.result == 'success'
    needs:
      - fork-approval
      - prebuild
      - detect-native-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout prebuild-artifact-save composite (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/prebuild-artifact-save
          sparse-checkout-cone-mode: false
      - name: Save reuse marker
        uses: ./.github/actions/prebuild-artifact-save
        with:
          native-hash: ${{ needs.detect-native-changes.outputs.native_hash }}
          pr-number: ${{ github.event.pull_request.number }}

  fabric-prebuilds-publish:
    # Must stay downstream of prebuild: this artifact's name matches the
    # `fabric-*` glob reusable-prebuilds' merge job uses to collect the matrix
    # uploads, so publishing it earlier would fold the bundle into itself.
    needs:
      - fork-approval
      - prebuild
      - prebuild-artifact-reuse
    if: |
      always() &&
      (needs.prebuild.result == 'success' || needs.prebuild-artifact-reuse.outputs.reuse_hit == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download merged prebuilds bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: prebuilds
          path: fabric-prebuilds-staging

      - name: Publish fabric-prebuilds for npm-runtime consumers
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: fabric-prebuilds
          path: fabric-prebuilds-staging

  fabric-npm-consumer-smoke:
    needs:
      - fork-approval
      - authorize
      - ci-router
      - detect-fabric-stack
      - fabric-stack-matrix
      - fabric-prebuilds-publish
    if: |
      always() &&
      needs.detect-fabric-stack.outputs.fabric_stack == 'true' &&
      needs.authorize.outputs.allowed == 'true' &&
      needs.ci-router.outputs.run_prebuilds == 'true' &&
      needs.fabric-prebuilds-publish.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        consumer: ${{ fromJson(needs.fabric-stack-matrix.outputs.consumers) }}
    uses: ./.github/workflows/fabric-stack-npm-consumer-smoke.yml
    secrets: inherit
    with:
      consumer: ${{ matrix.consumer }}
      repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      ref: ${{ github.event.pull_request.head.sha || github.ref }}

  publish-prebuild-status:
    # Posts qvac/prebuild-fabric for Merge Guard's verify-prebuilds; mirrors this flow's build-status.
    needs: [prebuild, prebuild-artifact-reuse, ci-router]
    if: always() && !cancelled() && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      # Trusted base-branch checkout of only the prebuild-status scripts (never
      # PR head code), so publish logic is a single, unit-tested source.
      - name: Checkout prebuild-status scripts (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts/prebuild-status
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Publish prebuild status for Merge Guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREBUILD_RESULT: ${{ needs.prebuild.result }}
          REUSE_HIT: ${{ needs.prebuild-artifact-reuse.outputs.reuse_hit }}
          # A skipped prebuild is only a pass when ci-router succeeded and chose
          # not to build (no label); a skip from an upstream failure fails closed.
          CI_ROUTER_RESULT: ${{ needs.ci-router.result }}
          RUN_PREBUILDS: ${{ needs.ci-router.outputs.run_prebuilds }}
          # Stamps this on-pr run's URL into target_url so Merge Guard can reject a
          # status from a superseded (e.g. pre-label) run whose timestamp looks fresh.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTEXT: qvac/prebuild-fabric
        run: node .github/scripts/prebuild-status/publish.mjs

  merge-guard:
    needs:
      [
        authorize,
        ci-router,
        sanity-checks,
        cpp-lint,
        detect-fabric-stack,
        detect-native-changes,
        prebuild-artifact-reuse,
        prebuild,
        prebuild-artifact-save,
        fabric-prebuilds-publish,
        fabric-npm-consumer-smoke,
      ]
    if: always() && !cancelled()
    uses: ./.github/workflows/public-pr.yml
    with:
      sanity-checks-status: ${{ needs.sanity-checks.result == 'success' && (needs.cpp-lint.result == 'success' || needs.cpp-lint.result == 'skipped') }}
      # A skipped prebuild is a pass: doc/JS-only PRs (or PRs without the prebuilds
      # label) don't produce a compiled artifact, and a native-unchanged PR reuses a
      # prior prebuild instead of rebuilding.
      build-status: ${{ needs.prebuild.result == 'success' || needs.prebuild.result == 'skipped' || needs.prebuild-artifact-reuse.outputs.reuse_hit == 'true' }}
      # A skipped consumer smoke is a pass only when it was never meant to run:
      # a non-stack PR, or a PR without the prebuilds label (nothing to overlay).
      # A skip caused by failed detection, an empty matrix, or a failed
      # fabric-prebuilds publish means no npm consumer was tested at all.
      integration-tests-status: ${{ needs.fabric-npm-consumer-smoke.result == 'success' || (needs.fabric-npm-consumer-smoke.result == 'skipped' && needs.detect-fabric-stack.result != 'failure' && (needs.detect-fabric-stack.outputs.fabric_stack != 'true' || needs.ci-router.outputs.run_prebuilds != 'true')) }}
