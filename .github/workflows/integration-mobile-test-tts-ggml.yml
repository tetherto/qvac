name: Mobile Integration Tests (TTS GGML)

# Migrated to .github/actions/run-mobile-integration-tests in
# QVAC-18168 follow-up: rollout to remaining 9 mobile addons.
#
# As of PR #2168 (Android dynamic ggml backends), baseline TTS-GGML tests
# download models at runtime via the registry. Benchmark runs additionally
# pre-stage the requested quant files on Android Device Farm hosts (Parakeet
# pattern) to avoid runtime network variance.

on:
  workflow_call:
    inputs:
      prebuild_package:
        description: "Full NPM package spec (name@version) whose prebuilds to pin instead of the freshly-built artifact (e.g. @qvac/tts-ggml@1.0.0). Empty = artifact-first (unchanged)."
        type: string
        required: false
        default: ""
      ref:
        description: "Git ref to checkout"
        type: string
        required: false
      repository:
        description: "Repository to checkout"
        type: string
        required: false
      workdir:
        description: "Relative path to package directory in monorepo"
        type: string
        required: false
        default: "packages/tts-ggml"
      run_rtf_benchmarks:
        description: "Run on-device RTF + streaming benchmarks (extracts metrics from Device Farm logs post-run)"
        type: boolean
        required: false
        default: false
  # Manual on-demand path. A dispatched run targets ONE platform and the
  # device(s) chosen below — it never runs the full default pool. The
  # workflow_call path (benchmarks / weekend / on-merge) is unchanged.
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to run on (a manual run targets one platform)."
        type: choice
        required: true
        options: [Android, iOS]
        default: Android
      device:
        description: "Device from the common pool. Pick '(custom)' to type your own in 'devices_custom'. Valid names + how to find them: docs/ci/MOBILE-ON-DEMAND.md."
        type: choice
        required: false
        options:
          - "(custom)"
          - "Google Pixel 9"
          - "Google Pixel 8"
          - "Samsung Galaxy S25 Ultra"
          - "Apple iPhone 17"
          - "Apple iPhone 16 Pro"
          - "Apple iPhone 15"
        default: "(custom)"
      devices_custom:
        description: "Comma-separated device model(s), e.g. 'Pixel 9, Pixel 8'. Overrides the dropdown; use for new/uncommon devices or several at once. Must match a Device Farm model (list + how to check: docs/ci/MOBILE-ON-DEMAND.md)."
        type: string
        required: false
        default: ""
      device_model_operator:
        description: "Model match: EQUALS (exact fleet model only — default; dropdown values are exact fleet names) or CONTAINS (any model containing the value; use for shorthand like 'Pixel 9'). EQUALS avoids billing a different/slower variant."
        type: choice
        required: false
        options: [EQUALS, CONTAINS]
        default: EQUALS
      tests:
        description: "Optional test filter: a mocha --grep regex matched by test NAME, not file name (e.g. 'runChatterboxSpeedTest'; combine several with '|'). Empty = full mobile suite. Where to find valid names: docs/ci/MOBILE-ON-DEMAND.md."
        type: string
        required: false
        default: ""
      ref:
        description: "Git ref (branch/tag/SHA) to test. Leave blank to use the branch you dispatch from."
        type: string
        required: false
        default: ""
      package_spec:
        description: "Package to test (name@version). Leave EMPTY (default) to test this branch's native prebuild artifact; use @qvac/tts-ggml@... for npm or @tetherto/tts-ggml@... for GPR to force-install a specific build."
        type: string
        required: false
        default: ""
      workdir:
        description: "Relative path to package directory in monorepo"
        type: string
        required: false
        default: "packages/tts-ggml"

permissions:
  contents: read

concurrency:
  # workflow_dispatch: at most one manual mobile run per (workflow, branch) at a
  # time — a fresh dispatch cancels the in-flight one so a re-run never stacks a
  # second Device Farm run. Different branches map to different groups, so the
  # same addon can still be tested on 2-3 branches in parallel. workflow_call
  # (benchmarks / weekend / on-merge) is keyed per run and never cancels —
  # inputs.platform is only ever set on a manual dispatch, and under workflow_call
  # github.* resolves to the CALLER, so run_id keeps each call self-contained.
  group: ${{ inputs.platform != '' && format('mobile-dispatch-{0}-{1}', github.workflow, github.ref) || format('mobile-call-{0}', github.run_id) }}
  cancel-in-progress: ${{ inputs.platform != '' }}

jobs:
  # Manual (workflow_dispatch) runs must name a device that exists on Device
  # Farm. This gate fails fast BEFORE any build or Device Farm run,
  # so a typo or an empty selection costs nothing. Skipped for workflow_call
  # (benchmarks / weekend / on-merge), which never uses the manual device path.
  validate-devices:
    name: Validate device selection
    if: inputs.platform != ''
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false
      # Validate the tests filter + shard fan-out against test-groups.json from
      # the SAME ref the build executes (inputs.ref || github.sha), not the
      # workflow ref, so a branch that renames/adds runners or shards can't pass
      # stale validation. Data only — nothing here is executed; the composite
      # action stays on the trusted workflow ref checked out above.
      - name: Checkout validation data (matches the built ref)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            packages/tts-ggml/test/mobile/test-groups.json
          sparse-checkout-cone-mode: false
          path: validation-data
          persist-credentials: false
      - name: Validate requested devices
        uses: ./.github/actions/run-mobile-integration-tests/validate-devices
        with:
          platform: ${{ inputs.platform }}
          devices: ${{ inputs.devices_custom != '' && inputs.devices_custom || (inputs.device != '(custom)' && inputs.device || '') }}
          device-model-operator: ${{ inputs.device_model_operator }}
          tests: ${{ inputs.tests }}
          test-groups-path: validation-data/packages/tts-ggml/test/mobile/test-groups.json
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

  # NOTE: continue-on-error: true matches the previous monolithic
  # workflow.  on-pr-tts-ggml.yml's merge-guard treats `success ||
  # skipped` as a pass, so a hard Device Farm failure does not gate
  # merge today.  Tighten once the Device Farm provisioning + signing
  # + runner pool is stable.
  build-and-test:
    name: Build ${{ matrix.platform }} (${{ matrix.engine || 'chatterbox' }} ${{ matrix.variant }} ${{ matrix.use_gpu && 'gpu' || 'cpu' }}${{ matrix.enhancer == 'lavasr' && ' enh' || '' }}${{ matrix.denoiser == 'lavasr' && ' den' || '' }}) and Run E2E Tests
    # workflow_call: validate-devices is skipped; the `skipped` branch of the
    # condition keeps this job running exactly as before.
    # workflow_dispatch: a bad/empty device selection fails validate-devices
    # and blocks this job (no build, no Device Farm cost).
    needs: [validate-devices]
    if: ${{ !cancelled() && (needs.validate-devices.result == 'success' || needs.validate-devices.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    environment: release
    # Functional shards can spend up to 120 minutes in Device Farm plus queue
    # time; retain enough budget for build, scheduling, and log collection.
    timeout-minutes: ${{ !inputs.run_rtf_benchmarks && 180 || 150 }}
    continue-on-error: true
    permissions:
      contents: read
      packages: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      # Benchmark matrix (run_rtf_benchmarks=true) sweeps engine x backend on
      # Android + iOS: chatterbox (CPU q4/q8 + GPU q4), supertonic (CPU + GPU
      # q4) and supertonic3 (CPU + GPU q4). `use_gpu:true` selects Vulkan on
      # Android / Metal on iOS via the benchmark's resolveBackend(). New rows are
      # q4-only to keep the Device Farm run count bounded; chatterbox keeps its
      # q4+q8 CPU coverage. The LavaSR rows (enhancer CPU+GPU, denoiser CPU on
      # supertonic + chatterbox) use the fp16 enhancer + denoiser. On the
      # run_rtf_benchmarks matrix both platforms now pre-stage on the Device
      # Farm host (see the manifest / prestage steps below): Android
      # adb-pushes into /data/local/tmp, iOS pushes into Documents/models via
      # pymobiledevice3. Functional multi-spec runs (the default, non-benchmark
      # matrix) stay Android-only for pre-staging — iOS fetches from the
      # registry on-device there — and build once per platform, then upload
      # one Device Farm spec per model-family shard.
      # On workflow_dispatch, run a single functional row on the
      # chosen platform (device(s) come from the manual inputs, not the matrix).
      # The workflow_call expression below is unchanged.
      matrix: ${{ fromJSON(inputs.platform != '' && (inputs.platform == 'iOS' && '{"include":[{"platform":"iOS","os":"macos-14","runner":"macos-14","variant":"q4","engine":"chatterbox","use_gpu":false}]}' || '{"include":[{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","variant":"q4","engine":"chatterbox","use_gpu":false}]}') || (inputs.run_rtf_benchmarks && '{"include":[{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","variant":"q4","engine":"chatterbox","use_gpu":false},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","variant":"q8","engine":"chatterbox","use_gpu":false},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","variant":"q4","engine":"chatterbox","use_gpu":true},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","variant":"q4","engine":"supertonic","use_gpu":false},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","variant":"q4","engine":"supertonic","use_gpu":true},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","variant":"q4","engine":"supertonic3","use_gpu":false},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","variant":"q4","engine":"supertonic3","use_gpu":true},{"platform":"iOS","os":"macos-14","runner":"macos-14","variant":"q4","engine":"chatterbox","use_gpu":false},{"platform":"iOS","os":"macos-14","runner":"macos-14","variant":"q4","engine":"chatterbox","use_gpu":true},{"platform":"iOS","os":"macos-14","runner":"macos-14","variant":"q4","engine":"supertonic","use_gpu":false},{"platform":"iOS","os":"macos-14","runner":"macos-14","variant":"q4","engine":"supertonic","use_gpu":true},{"platform":"iOS","os":"macos-14","runner":"macos-14","variant":"q4","engine":"supertonic3","use_gpu":false},{"platform":"iOS","os":"macos-14","runner":"macos-14","variant":"q4","engine":"supertonic3","use_gpu":true},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","variant":"q4","engine":"supertonic","use_gpu":false,"enhancer":"lavasr"},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","variant":"q4","engine":"supertonic","use_gpu":true,"enhancer":"lavasr"},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","variant":"q4","engine":"supertonic","use_gpu":false,"denoiser":"lavasr"},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","variant":"q4","engine":"chatterbox","use_gpu":false,"enhancer":"lavasr"},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","variant":"q4","engine":"chatterbox","use_gpu":true,"enhancer":"lavasr"},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","variant":"q4","engine":"chatterbox","use_gpu":false,"denoiser":"lavasr"},{"platform":"iOS","os":"macos-14","runner":"macos-14","variant":"q4","engine":"supertonic","use_gpu":false,"enhancer":"lavasr"},{"platform":"iOS","os":"macos-14","runner":"macos-14","variant":"q4","engine":"supertonic","use_gpu":true,"enhancer":"lavasr"},{"platform":"iOS","os":"macos-14","runner":"macos-14","variant":"q4","engine":"supertonic","use_gpu":false,"denoiser":"lavasr"},{"platform":"iOS","os":"macos-14","runner":"macos-14","variant":"q4","engine":"chatterbox","use_gpu":false,"enhancer":"lavasr"},{"platform":"iOS","os":"macos-14","runner":"macos-14","variant":"q4","engine":"chatterbox","use_gpu":true,"enhancer":"lavasr"},{"platform":"iOS","os":"macos-14","runner":"macos-14","variant":"q4","engine":"chatterbox","use_gpu":false,"denoiser":"lavasr"}]}' || '{"include":[{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","variant":"q4","engine":"chatterbox","use_gpu":false},{"platform":"iOS","os":"macos-14","runner":"macos-14","variant":"q4","engine":"chatterbox","use_gpu":false}]}')) }}

    steps:
      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false

      - name: Checkout addon repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: addon
          fetch-depth: 0

      - name: Validate mobile tests are up-to-date
        working-directory: addon/${{ inputs.workdir || 'packages/tts-ggml' }}
        run: npm run test:mobile:validate || true

      - name: Setup mobile test environment
        uses: ./.github/actions/run-mobile-integration-tests/setup
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: ${{ inputs.workdir || 'packages/tts-ggml' }}
          addon-npm-name: '@qvac/tts-ggml'
          prebuild-artifact-prefix: 'tts-ggml-'
          pat-token: ${{ secrets.GITHUB_TOKEN }}
          # workflow_call uses prebuild_package; workflow_dispatch exposes the
          # equivalent package_spec input. Keep both paths pinned explicitly so
          # manual validation cannot silently ignore the requested native build.
          package-version: ${{ inputs.prebuild_package || inputs.package_spec }}
          force-npm-prebuild: ${{ (inputs.prebuild_package != '' || inputs.package_spec != '') && 'true' || 'false' }}

      # The release environment authorizes GitHub OIDC to assume the scoped AWS
      # role used for model-manifest signing; no long-lived AWS keys are stored.
      # Needed on Android always (functional multi-spec default matrix +
      # benchmark matrix both pre-stage there) and on iOS only for the
      # benchmark matrix, where it now also pre-stages via pymobiledevice3.
      # us-west-2 so the presigned model URLs target the US bucket region.
      - name: Configure AWS credentials via OIDC
        if: ${{ matrix.platform == 'Android' || inputs.run_rtf_benchmarks }}
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # 6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Generate TTS-GGML mobile model manifest
        if: ${{ matrix.platform == 'Android' || inputs.run_rtf_benchmarks }}
        working-directory: addon/${{ inputs.workdir || 'packages/tts-ggml' }}
        shell: bash
        env:
          MODEL_S3_BUCKET: tether-ai-dev-us
        run: |
          node scripts/generate-mobile-model-manifest.js
          ls -lh test/mobile/testAssets/

      # Benchmark opt-in (run_rtf_benchmarks=true): patch the addon's
      # test/mobile/integration-runtime.cjs to stub `bare-os.getEnv` so the
      # on-device test/integration/{rtf,streaming}-benchmark.test.js shims see
      # QVAC_TTS_GGML_RUN_BENCHMARK_ON_MOBILE=1 and delegate to the canonical
      # test/benchmark/* suites instead of soft-skipping. The shims emit
      # [PERF_REPORT_START] blocks scraped by the Extract step below. Must run
      # AFTER setup (which checks out the addon) and BEFORE build-mobile-app
      # (which bakes the runtime into the bundle). No-op on normal PR runs.
      - name: Inject benchmark env into mobile runtime
        if: ${{ inputs.run_rtf_benchmarks }}
        working-directory: addon/${{ inputs.workdir || 'packages/tts-ggml' }}
        env:
          PLATFORM: ${{ matrix.platform }}
          VARIANT: ${{ matrix.variant }}
          ENGINE: ${{ matrix.engine || 'chatterbox' }}
          USE_GPU: ${{ matrix.use_gpu && '1' || '0' }}
          GPU_TAG: ${{ matrix.use_gpu && 'gpu' || 'cpu' }}
          # Enhancer / denoiser axes (none|lavasr) plus the enhancer quant tier
          # (f16 default | f32 | q8_0); the mobile LavaSR rows use the fp16 enhancer
          # + denoiser. Both platforms now pre-stage on the Device Farm host so the
          # phone never fetches over its flaky network: the fp16 enhancer + denoiser
          # (and the engine + quality GGUFs) are pre-signed into the model manifest
          # and pushed by the platform prestage step below (Android → adb into
          # /data/local/tmp; iOS → pymobiledevice3 into Documents/models). Default to
          # none/f16 for the existing engine-only rows.
          ENHANCER: ${{ matrix.enhancer || 'none' }}
          ENHANCER_VARIANT: ${{ matrix.enhancer_variant || 'f16' }}
          DENOISER: ${{ matrix.denoiser || 'none' }}
          QUALITY_MODEL: ggml-tiny.bin
        run: |
          echo "Injecting QVAC_TTS_GGML_RUN_BENCHMARK_ON_MOBILE=1 into mobile runtime"
          # Tag the label with the LavaSR axes so enhancer/denoiser rows don't
          # collide with the plain engine row (matches the desktop label tokens).
          ENH_TAG=""; [ "$ENHANCER" = "lavasr" ] && ENH_TAG="-lavasr"
          DEN_TAG=""; [ "$DENOISER" = "lavasr" ] && DEN_TAG="-denoise"
          cat > test/mobile/inject-env.cjs <<NODE
          const os = require('bare-os')
          const originalGetEnv = os.getEnv
          os.getEnv = function (key) {
            if (key === 'QVAC_TTS_GGML_RUN_BENCHMARK_ON_MOBILE') return '1'
            if (key === 'QVAC_TTS_GGML_BENCHMARK_DEVICE') return '$PLATFORM-device-farm'
            if (key === 'QVAC_TTS_GGML_BENCHMARK_RUNNER') return 'aws-device-farm-$PLATFORM'
            if (key === 'QVAC_TTS_GGML_BENCHMARK_LABEL') return '$PLATFORM-$ENGINE-$VARIANT-$GPU_TAG$ENH_TAG$DEN_TAG'
            if (key === 'QVAC_TTS_GGML_BENCHMARK_VARIANT') return '$VARIANT'
            if (key === 'QVAC_TTS_GGML_BENCHMARK_ENGINE') return '$ENGINE'
            if (key === 'QVAC_TTS_GGML_BENCHMARK_USE_GPU') return '$USE_GPU'
            if (key === 'QVAC_TTS_GGML_BENCHMARK_ENHANCER') return '$ENHANCER'
            if (key === 'QVAC_TTS_GGML_BENCHMARK_ENHANCER_VARIANT') return '$ENHANCER_VARIANT'
            if (key === 'QVAC_TTS_GGML_BENCHMARK_DENOISER') return '$DENOISER'
            if (key === 'QVAC_TTS_GGML_BENCHMARK_QUALITY') return 'true'
            if (key === 'QVAC_TTS_GGML_BENCHMARK_WHISPER_MODEL') return '$QUALITY_MODEL'
            return originalGetEnv ? originalGetEnv.call(this, key) : undefined
          }
          NODE
          cat test/mobile/integration-runtime.cjs >> test/mobile/inject-env.cjs
          mv test/mobile/inject-env.cjs test/mobile/integration-runtime.cjs

      - name: Generate model pre-stage commands (Android)
        id: prestage
        if: ${{ matrix.platform == 'Android' }}
        working-directory: addon/${{ inputs.workdir || 'packages/tts-ggml' }}
        env:
          TTS_GGML_MOBILE_BENCHMARK_VARIANT: ${{ matrix.variant }}
          TTS_GGML_MOBILE_BENCHMARK_ENGINE: ${{ matrix.engine || 'chatterbox' }}
          TTS_GGML_MOBILE_BENCHMARK_ENHANCER: ${{ matrix.enhancer || 'none' }}
          TTS_GGML_MOBILE_BENCHMARK_DENOISER: ${{ matrix.denoiser || 'none' }}
          TTS_GGML_MOBILE_BENCHMARK_QUALITY: 'true'
          TTS_GGML_MOBILE_FUNCTIONAL_MULTI_SPEC: ${{ !inputs.run_rtf_benchmarks && 'true' || 'false' }}
        run: |
          node scripts/generate-prestage-block.js android > "$RUNNER_TEMP/prestage-block.txt"
          {
            echo "block<<PRESTAGE_EOF"
            cat "$RUNNER_TEMP/prestage-block.txt"
            echo "PRESTAGE_EOF"
          } >> "$GITHUB_OUTPUT"

      # iOS counterpart: the macOS Device Farm host downloads the same presigned
      # models and pushes them into the app's Documents/models container via
      # pymobiledevice3, so the phone never fetches from the registry/HF on-device.
      - name: Generate model pre-stage commands (iOS)
        id: ios_prestage
        if: ${{ inputs.run_rtf_benchmarks && matrix.platform == 'iOS' }}
        working-directory: addon/${{ inputs.workdir || 'packages/tts-ggml' }}
        env:
          TTS_GGML_MOBILE_BENCHMARK_VARIANT: ${{ matrix.variant }}
          TTS_GGML_MOBILE_BENCHMARK_ENHANCER: ${{ matrix.enhancer || 'none' }}
          TTS_GGML_MOBILE_BENCHMARK_DENOISER: ${{ matrix.denoiser || 'none' }}
          TTS_GGML_MOBILE_BENCHMARK_QUALITY: 'true'
        run: |
          node scripts/generate-prestage-block.js ios > "$RUNNER_TEMP/ios-prestage-block.txt"
          {
            echo "block<<PRESTAGE_EOF"
            cat "$RUNNER_TEMP/ios-prestage-block.txt"
            echo "PRESTAGE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build mobile app
        id: build
        uses: ./.github/actions/run-mobile-integration-tests/build-mobile-app
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: ${{ inputs.workdir || 'packages/tts-ggml' }}
          addon-npm-name: '@qvac/tts-ggml'
          ios-build-cert-base64: ${{ secrets.TEST_APP_APPLE_DISTRIBUTION_CERTIFICATE }}
          ios-build-cert-password: ${{ secrets.APPLE_P12_PASSWORD }}
          ios-keychain-password: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          ios-provisioning-profile-base64: ${{ secrets.TEST_APP_APPLE_PROVISIONING_PROFILE }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          # Chatterbox MTL takes up to 36.8 minutes on thermally throttled Pixel
          # devices, beyond the generated Android test harness's 20-minute wait.
          android-per-test-timeout-minutes: '45'

      # Benchmark runs (run_rtf_benchmarks=true): the benchmark runners are
      # intentionally NOT in test-groups.json, so they never run on normal PRs.
      # For a benchmark run, build the device-farm test-groups from the addon's
      # perf-tests.json so ONLY the benchmarks execute. To add a benchmark, add
      # its function name to perf-tests.json — no workflow changes needed. On a
      # normal run this step is skipped, the output is empty, and the action
      # falls back to auto-detecting test-groups.json (the functional tests).
      - name: Resolve benchmark test-groups from perf-tests.json
        id: perf_groups
        if: ${{ inputs.run_rtf_benchmarks }}
        working-directory: addon/${{ inputs.workdir || 'packages/tts-ggml' }}
        run: |
          GREP=$(jq -r 'join("|")' test/mobile/perf-tests.json)
          if [ -z "$GREP" ]; then
            echo "::error::perf-tests.json is empty — no benchmarks to run"
            exit 1
          fi
          echo "Benchmark grep: $GREP"
          printf 'groups=[{"name":"perf","grep":"%s"}]\n' "$GREP" >> "$GITHUB_OUTPUT"

      # On a manual run with a test filter, override to a single
      # grepped spec so only those tests run (fewer Device Farm minutes).
      # Empty filter / workflow_call falls back to the normal groups.
      - name: Resolve manual test filter
        id: manual_tests
        if: inputs.platform != '' && inputs.tests != ''
        shell: bash
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          # Reject anything but mocha-safe grep characters so a manual `tests`
          # value cannot break out of the generated WDIO config on the Device
          # Farm host (defense-in-depth; the sink is also JSON-encoded).
          if ! printf '%s' "$TESTS" | grep -Eq '^[A-Za-z0-9_ |().*+-]+$'; then
            echo "::error::Invalid 'tests' filter '$TESTS'. Allowed: letters, digits, and _ space | ( ) . * + - (a mocha --grep on test NAMES, e.g. 'runAddonTest' or 'runFoo|runBar')."
            exit 1
          fi
          MANUAL_GROUPS=$(jq -nc --arg g "$TESTS" '[{name:"manual", grep:$g}]')
          echo "groups=$MANUAL_GROUPS" >> "$GITHUB_OUTPUT"

      - name: Upload to Device Farm
        id: upload
        uses: ./.github/actions/run-mobile-integration-tests/upload-to-devicefarm
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: ${{ inputs.workdir || 'packages/tts-ggml' }}
          app-path: ${{ steps.build.outputs.app-path }}
          app-type: ${{ steps.build.outputs.app-type }}
          app-name: ${{ steps.build.outputs.app-name }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          device-farm-project-arn: ${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN_TTS_GGML || secrets.AWS_DEVICE_FARM_PROJECT_ARN_ONNX_TTS }}
          test-groups: ${{ steps.manual_tests.outputs.groups != '' && steps.manual_tests.outputs.groups || steps.perf_groups.outputs.groups }}
          enables-perf: ${{ inputs.run_rtf_benchmarks && 'true' || 'false' }}
          # Keep Mocha's per-test ceiling above the 45-minute Android wait.
          mocha-timeout-ms: '3300000'
          wdio-waitfor-timeout-ms: '600000'
          # Host pre-stages this row's models so the phone never downloads them.
          # iOS pushes into Documents/models via pymobiledevice3; Android adb-pushes
          # into /data/local/tmp. Empty on non-benchmark runs (both steps skipped).
          extra-pre-test-commands: ${{ matrix.platform == 'iOS' && steps.ios_prestage.outputs.block || steps.prestage.outputs.block }}

      - name: Schedule Device Farm test runs
        id: schedule
        uses: ./.github/actions/run-mobile-integration-tests/schedule-test-run
        with:
          platform: ${{ matrix.platform }}
          device-farm-project-arn: ${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN_TTS_GGML || secrets.AWS_DEVICE_FARM_PROJECT_ARN_ONNX_TTS }}
          ios-device-pool-arn: ${{ secrets.IOS_DEVICE_POOL_ARN_TTS_GGML || secrets.IOS_DEVICE_POOL_ARN_ONNX_TTS }}
          app-upload-arn: ${{ steps.upload.outputs.app-upload-arn }}
          test-package-upload-arn: ${{ steps.upload.outputs.test-package-upload-arn }}
          test-specs: ${{ steps.upload.outputs.test-specs }}
          # workflow_dispatch: fan out across the chosen device(s).
          # workflow_call: unchanged dual-flagship behaviour.
          scheduling-mode: ${{ inputs.platform != '' && 'manual-devices' || 'dual-flagship' }}
          multi-spec-dual-flagship: ${{ !inputs.run_rtf_benchmarks && 'true' || 'false' }}
          device-models: ${{ inputs.platform != '' && (inputs.devices_custom != '' && inputs.devices_custom || (inputs.device != '(custom)' && inputs.device || '')) || '' }}
          device-model-operator: ${{ inputs.platform != '' && inputs.device_model_operator || '' }}

      - name: Monitor Device Farm test runs
        id: monitor
        uses: ./.github/actions/run-mobile-integration-tests/monitor-test-run
        with:
          run-arns: ${{ steps.schedule.outputs.run-arns }}
          run-count: ${{ steps.schedule.outputs.run-count }}
          test-specs: ${{ steps.upload.outputs.test-specs }}
          # Functional multi-spec runs need headroom beyond Device Farm's
          # 120-minute execution ceiling for normal queue variance.
          max-wait-time-seconds: ${{ !inputs.run_rtf_benchmarks && '9000' || '7200' }}

      - name: Cancel Device Farm runs on workflow cancellation
        if: cancelled() && steps.schedule.outputs.run-arns != '' && steps.schedule.outputs.run-arns != '[]'
        uses: ./.github/actions/run-mobile-integration-tests/cancel-device-farm-runs
        with:
          run-arns: ${{ steps.schedule.outputs.run-arns }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

      - name: Collect and upload Device Farm logs
        if: always() && !cancelled()
        uses: ./.github/actions/run-mobile-integration-tests/collect-and-upload-logs
        with:
          platform: ${{ matrix.platform }}
          addon-npm-name: '@qvac/tts-ggml'
          enables-perf: ${{ inputs.run_rtf_benchmarks && 'true' || 'false' }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          run-arns: ${{ steps.schedule.outputs.run-arns }}

      # Benchmark runs (run_rtf_benchmarks=true) print one [PERF_REPORT_START]
      # block per suite (RTF + streaming) into bare_console.log. Scrape every
      # block with --merge (no last-write-wins) and union them per device. The
      # artifact name is what benchmark-performance-tts-ggml.yml's summarize job
      # downloads (pattern perf-report-tts-ggml-*). Skipped on normal PR runs.
      - name: Extract and report TTS-GGML performance
        if: always() && !cancelled() && inputs.run_rtf_benchmarks && steps.schedule.outputs.run-arns != '[]' && steps.schedule.outputs.run-arns != ''
        uses: ./.github/actions/run-mobile-integration-tests/extract-addon-perf
        with:
          platform: ${{ matrix.platform }}
          filter: ''
          merge: 'true'
          unzip-customer-artifacts: 'true'
          step-summary-title: 'Mobile Performance: tts-ggml (${{ matrix.platform }}, ${{ matrix.engine || ''chatterbox'' }} ${{ matrix.variant }} ${{ matrix.use_gpu && ''gpu'' || ''cpu'' }}${{ matrix.enhancer == ''lavasr'' && '' enh'' || '''' }}${{ matrix.denoiser == ''lavasr'' && '' den'' || '''' }})'
          artifact-name: perf-report-tts-ggml-${{ matrix.platform }}-${{ matrix.engine || 'chatterbox' }}-${{ matrix.variant }}-${{ matrix.use_gpu && 'gpu' || 'cpu' }}${{ matrix.enhancer == 'lavasr' && '-enh' || '' }}${{ matrix.denoiser == 'lavasr' && '-den' || '' }}-${{ github.run_number }}

      - name: Comment results on PR
        if: always() && !cancelled()
        uses: ./.github/actions/run-mobile-integration-tests/comment-on-pr
        with:
          addon-npm-name: '@qvac/tts-ggml'
          platform: ${{ matrix.platform }}
          test-result: ${{ steps.monitor.outputs.test-result }}
          test-total: ${{ steps.monitor.outputs.test-total }}
          test-passed: ${{ steps.monitor.outputs.test-passed }}
          test-failed: ${{ steps.monitor.outputs.test-failed }}
          test-skipped: ${{ steps.monitor.outputs.test-skipped }}
          user-test-passed: ${{ steps.monitor.outputs.user-test-passed }}
          user-test-failed: ${{ steps.monitor.outputs.user-test-failed }}
