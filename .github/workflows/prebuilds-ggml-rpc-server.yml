# Build-only workflow. Publishing is handled by on-merge-ggml-rpc-server.yml.
name: Prebuilds (GGML RPC Server)

on:
  workflow_dispatch:
    inputs:
      workdir:
        description: Working directory
        required: false
        type: string
        default: packages/ggml-rpc-server

  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        required: false
      repository:
        description: Repository to check out
        type: string
        required: false
        default: tetherto/qvac
      workdir:
        description: Working directory
        required: false
        type: string
        default: packages/ggml-rpc-server

permissions:
  contents: read

jobs:
  prebuild:
    permissions:
      contents: write
      packages: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/reusable-prebuilds.yml
    with:
      workdir: ${{ inputs.workdir }}
      ref: ${{ inputs.ref }}
      repository: ${{ inputs.repository }}
      artifact-name-prefix: ggml-rpc-server-
      include-vulkan-sdk: true
      matrix-include: >-
        [{"os":"ubuntu-22.04","platform":"linux","arch":"x64","runner":"qvac-ubuntu2204-x64"},{"os":"ubuntu-22.04-arm","platform":"linux","arch":"arm64"},{"os":"ubuntu-24.04","platform":"android","arch":"arm64"},{"os":"macos-15","platform":"ios","arch":"arm64"},{"os":"macos-15","platform":"darwin","arch":"arm64"},{"os":"macos-15-intel","platform":"darwin","arch":"x64"},{"os":"windows-2025","platform":"win32","arch":"x64","runner":"qvac-win25-x64"}]
      desktop-smoke-command: node test/node/prebuild-smoke.cjs && bare test/bare/prebuild-smoke.js
      extra-strip-binary-name: ggml-rpc-server
    secrets: inherit
