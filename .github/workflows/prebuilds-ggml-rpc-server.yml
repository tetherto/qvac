# Build-only workflow. Publishing is handled by on-merge-ggml-rpc-server.yml.
name: Prebuilds (GGML RPC Server)

on:
  workflow_dispatch:
    inputs:
      workdir:
        description: Working directory
        required: false
        type: string
        default: packages/ggml-rpc-server

  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        required: false
      repository:
        description: Repository to check out
        type: string
        required: false
        default: tetherto/qvac
      workdir:
        description: Working directory
        required: false
        type: string
        default: packages/ggml-rpc-server
      reuse-workflow-file:
        description: Calling PR workflow basename used for cross-run artifact reuse
        required: false
        type: string
        default: ""
      fabric-overlay-artifact:
        description: >-
          Workflow-run artifact name for PR-built @qvac/fabric prebuilds. Empty
          skips the overlay and uses the published npm package.
        required: false
        type: string
        default: ""
    outputs:
      reuse_hit:
        description: Whether a prior matching prebuild artifact was reused
        value: ${{ jobs.prebuild.outputs.reuse_hit }}

permissions:
  contents: read

jobs:
  prebuild:
    permissions:
      actions: read
      contents: write
      packages: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/reusable-prebuilds.yml
    with:
      workdir: ${{ inputs.workdir }}
      ref: ${{ inputs.ref }}
      repository: ${{ inputs.repository }}
      include-vulkan-sdk: true
      matrix-include: >-
        [{"os":"ubuntu-22.04","runner_key":"linux_ubuntu2204_x64","platform":"linux","arch":"x64"},{"os":"ubuntu-22.04-arm","runner_key":"ubuntu_2204_arm","platform":"linux","arch":"arm64"},{"os":"ubuntu-24.04","runner_key":"ubuntu_2404","platform":"android","arch":"arm64"},{"os":"macos-15","runner_key":"macos_15","platform":"ios","arch":"arm64"},{"os":"macos-15","runner_key":"macos_15","platform":"ios","arch":"arm64","tags":"-simulator","flags":"--simulator"},{"os":"macos-15","runner_key":"macos_15","platform":"ios","arch":"x64","tags":"-simulator","flags":"--simulator"},{"os":"macos-15","runner_key":"macos_15","platform":"darwin","arch":"arm64"},{"os":"macos-15-intel","runner_key":"macos_15_intel","platform":"darwin","arch":"x64"},{"os":"windows-2025","runner_key":"win_2025_x64","platform":"win32","arch":"x64"}]
      # The smoke test needs no libibverbs: Fabric's RPC backend loads it at
      # runtime, so the GitHub-hosted Linux leg checks the TCP-only path.
      desktop-smoke-command: node scripts/smoke-packaged.cjs
      reuse-workflow-file: ${{ inputs.reuse-workflow-file }}
      fabric-overlay-artifact: ${{ inputs.fabric-overlay-artifact }}
    secrets: inherit
