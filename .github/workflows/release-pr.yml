name: Release PR (Reusable)

on:
  workflow_call:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: string
      preid:
        description: Pre-release identifier
        required: false
        type: string
        default: ""




# Canonical runner labels — .github/actions/runner-names/runners.yaml
env:
  RN_ORCH: ubuntu-latest
  RN_U22: ubuntu-22.04
  RN_U24: ubuntu-24.04
  RN_U22_ARM: ubuntu-22.04-arm
  RN_U24_ARM: ubuntu-24.04-arm
  RN_MAC14: macos-14
  RN_MAC14_XL: macos-14-xlarge
  RN_MAC15: macos-15
  RN_MAC15_INTEL: macos-15-intel
  RN_MAC15_LG: macos-15-large
  RN_MAC15_XL: macos-15-xlarge
  RN_WIN22: windows-2022
  RN_WIN25: windows-2025
  RN_QVAC_U22: qvac-ubuntu2204-x64
  RN_QVAC_U22_GPU: qvac-ubuntu2204-x64-gpu
  RN_QVAC_U24: qvac-ubuntu2404-x64
  RN_QVAC_U24_GPU: qvac-ubuntu2404-x64-gpu
  RN_QVAC_WIN25: qvac-win25-x64
  RN_QVAC_WIN25_GPU: qvac-win25-x64-gpu
  RN_AI_LINUX: ai-run-linux
  RN_AI_LINUX_GPU: ai-run-linux-gpu
  RN_AI_U22: ai-run-ubuntu-22.04
  RN_AI_WIN11_GPU: ai-run-windows11-gpu
  RN_GEN_WIN11: generator-windows11
  RN_MINI_M4: mac-mini-m4
  RN_MINI_M4_GPU: mac-mini-m4-gpu
  RN_LBL_U22_X64: ubuntu-22.04-x64
  RN_LBL_U22_X64_GPU: ubuntu-22.04-x64-gpu
  RN_LBL_U24_X64: ubuntu-24.04-x64
  RN_LBL_U24_X64_GPU: ubuntu-24.04-x64-gpu
  RN_LBL_U24_ARM64: ubuntu-24.04-arm64
  RN_LBL_WIN22_X64: windows-2022-x64
  RN_LBL_WIN25_X64: windows-2025-x64
  RN_LBL_WIN25_X64_GPU: windows-2025-x64-gpu

jobs:
  bump-version:
    runs-on: ${{ env.RN_ORCH }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: lts/*

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          PREID: ${{ inputs.preid }}
        run: |
          PREID_ARG=${{ inputs.preid != '' && format('--preid={0}', inputs.preid) || '' }}
          NEW_VERSION=$(npm version "$BUMP" $PREID_ARG --no-git-tag-version)
          echo "version=${NEW_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "branch=release/v${NEW_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Update lockfile
        run: |
          if [ -f package-lock.json ]; then
            npm install --ignore-scripts --package-lock-only
          fi

      - name: Create branch and push
        run: |
          git checkout -b ${{ steps.bump.outputs.branch }}
          git add package.json
          [ -f package-lock.json ] && git add package-lock.json
          git commit -m "Release: v${{ steps.bump.outputs.version }}"
          git push origin ${{ steps.bump.outputs.branch }}

      - name: Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Release: v${{ steps.bump.outputs.version }}" \
            --body "Bumps version to \`v${{ steps.bump.outputs.version }}\`" \
            --base main \
            --head ${{ steps.bump.outputs.branch }}
