name: On PR Trigger (inference-addon-cpp)

# Gated entrypoint for the inference-addon-cpp mobile tests, mirroring
# on-pr-embed-llamacpp.yml's gating trimmed to just the mobile stage. The desktop
# suites keep their own `pull_request` workflows; this file only adds the privileged,
# secret-bearing Device Farm path. Mobile runs only when the shared trust gate
# authorises the PR AND the `run-mobile-addon-tests` label is present.
#
# TRUST MODEL (QVAC-22799): label-gate was retired, `fork-ci` is the sole fork gate.
# fork-approval calls reusable-fork-approval.yml (fork-ci reviewers approve, then it
# records `qvac/fork-verified` on the head SHA); authorize runs the shared authorize-pr
# composite, which resolves that SHA-bound status into one `allowed` output. Both come
# from the DEFAULT branch, so a fork cannot modify its own gate. Because approval binds
# to the exact commit, a stale approval can't authorise a new one — which is why
# `reopened` and `ready_for_review` are safe to keep. Enforced by ci-trust-policy.test.mjs.

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/inference-addon-cpp/**"
      - ".github/workflows/*inference-addon-cpp*.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # `statuses: write` must be granted HERE, by the caller: a reusable workflow
  # cannot elevate its own token, and the gate needs it to record
  # `qvac/fork-verified` on the head SHA. Asserted by ci-trust-policy.test.mjs.
  fork-approval:
    permissions:
      statuses: write
    uses: ./.github/workflows/reusable-fork-approval.yml

  ci-router:
    name: CI Router (label detection)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_mobile: ${{ steps.route.outputs.run_mobile }}
    steps:
      - name: Checkout ci-router composite (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/ci-router
          sparse-checkout-cone-mode: false
      - name: Route CI stages
        id: route
        uses: ./.github/actions/ci-router

  # Must `needs: fork-approval` so the fork-ci environment approval happens BEFORE
  # trust is resolved; authorize-pr then reads the SHA-bound status the gate wrote.
  authorize:
    name: Authorize PR
    needs: [fork-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: read
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      - name: Checkout authorize-pr (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/authorize-pr
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Authorize
        id: auth
        uses: ./.github/actions/authorize-pr
        with:
          github-token: ${{ github.token }}

  run-mobile-integration-tests:
    needs:
      - fork-approval
      - authorize
      - ci-router
    # Gates on authorize's OUTPUT, not merely on `needs:`: always() overrides GitHub's
    # needs-success rule, so a failed or rejected gate would otherwise fall through into
    # this secret-bearing workflow. An unset/false `allowed` fails closed, and since
    # authorize needs fork-approval, a rejected fork-ci approval can never yield 'true'.
    if: always() && !cancelled() && needs.authorize.outputs.allowed == 'true' && needs.ci-router.outputs.run_mobile == 'true'
    permissions:
      contents: read
      packages: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/integration-mobile-test-inference-addon-cpp.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      # Pin to the immutable head SHA, never the mutable head.ref: a fork can
      # force-push head.ref between authorisation and checkout (TOCTOU). Enforced
      # by .github/scripts/test/ci-trust-policy.test.mjs.
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
