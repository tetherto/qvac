name: Desktop tests

# Each package's desktop targets (test:integration, test:backend, benchmark) through Nx, one job per configuration on the
# runner its configuration names, against the build job's prebuilds for that platform.
on:
  workflow_call:
    inputs:
      rows:
        description: JSON rows of every desktop target
        type: string
        required: true
      perf_runs:
        description: QVAC_PERF_RUNS for the target; empty leaves the package default
        type: string
        default: ""
      perf_warmup_runs:
        description: QVAC_PERF_WARMUP_RUNS for the target; empty leaves the package default
        type: string
        default: ""
      args:
        description: BENCHMARK_ARGS, read by a benchmark command
        type: string
        default: ""

permissions: {}

jobs:
  test:
    if: inputs.rows != '[]'
    name: ${{ matrix.row.slug }} ${{ matrix.row.target }} ${{ matrix.row.config }}
    runs-on: ${{ matrix.row.runner }}
    environment: release
    timeout-minutes: ${{ matrix.row.timeout || 180 }}
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(inputs.rows) }}
    env:
      WORKDIR: src/${{ matrix.row.dir }}
      NX_DAEMON: "false"
      NX_NO_CLOUD: "true"
    steps:
      - name: Checkout actions
        uses: tetherto/qvac-actions/checkout@1f7fae693183e6181384bae9ee0cdd7ab00ddde7  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          sparse-checkout: |
            .github/actions
            .github/config
          persist-credentials: false
      - name: Checkout source
        uses: tetherto/qvac-actions/checkout@1f7fae693183e6181384bae9ee0cdd7ab00ddde7  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: src
          persist-credentials: "false"
      - uses: tetherto/qvac-actions/setup-node@1f7fae693183e6181384bae9ee0cdd7ab00ddde7  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          node-version: lts/*
      - uses: tetherto/qvac-actions/setup-pnpm@1f7fae693183e6181384bae9ee0cdd7ab00ddde7  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          package-json-file: src/package.json
      - uses: tetherto/qvac-actions/configure-aws-credentials@1f7fae693183e6181384bae9ee0cdd7ab00ddde7  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-1
      - uses: tetherto/qvac-actions/setup-aws-cli@1f7fae693183e6181384bae9ee0cdd7ab00ddde7  # TEMP rehearsal: qvac-actions PR 18 head until it merges
      - uses: ./.github/actions/setup-vulkan
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          cache-bucket: ${{ secrets.MODEL_S3_BUCKET }}
      # The native dependencies come prebuilt, so only the toolkits the configuration itself asks for.
      - if: contains(matrix.row.setup, 'cuda')
        uses: ./.github/actions/setup-cuda
        with:
          cuda-version: ${{ matrix.row.toolchain.cuda }}
      - if: contains(matrix.row.setup, 'rocm')
        uses: ./.github/actions/setup-rocm
        with:
          rocm-version: ${{ matrix.row.toolchain.rocm.version }}
          gfx: ${{ matrix.row.toolchain.rocm.gfx }}
          sha256: ${{ matrix.row.toolchain.rocm.sha256 }}
      # Translation's quality benchmark: bergamot publishes wheels for Python 3.10 and older only.
      - if: contains(matrix.row.setup, 'python')
        uses: tetherto/qvac-actions/setup-python@1f7fae693183e6181384bae9ee0cdd7ab00ddde7  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          python-version: "3.10"
      - if: contains(matrix.row.setup, 'java')
        uses: tetherto/qvac-actions/setup-java@1f7fae693183e6181384bae9ee0cdd7ab00ddde7  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          java-version: "17"
      - if: contains(matrix.row.setup, 'android')
        uses: tetherto/qvac-actions/setup-android@1f7fae693183e6181384bae9ee0cdd7ab00ddde7  # TEMP rehearsal: qvac-actions PR 18 head until it merges
      - id: models
        uses: ./.github/actions/models-cache-key
        with:
          workdir: ${{ env.WORKDIR }}
          target: ${{ matrix.row.target }}
      - if: steps.models.outputs.paths != '' && runner.environment != 'github-hosted'
        uses: tetherto/qvac-actions/cache-restore@1f7fae693183e6181384bae9ee0cdd7ab00ddde7  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          key: ${{ steps.models.outputs.key }}
          restore-keys: ${{ steps.models.outputs.restore-prefix }}
          path: ${{ steps.models.outputs.paths }}
          enable-cross-os-archive: "true"
      - uses: ./.github/actions/models-download
        with:
          workdir: ${{ env.WORKDIR }}
          bucket: ${{ secrets.MODEL_S3_BUCKET }}
          target: ${{ matrix.row.target }}
      - name: Install
        shell: bash
        working-directory: src
        env:
          NPM: ${{ matrix.row.npm }}
        run: pnpm install --frozen-lockfile --filter . --filter "$NPM..."
      # The build job's prebuilds for this platform: the package's and its native dependencies'.
      - if: matrix.row.hasBuild
        uses: tetherto/qvac-actions/download-artifact@1f7fae693183e6181384bae9ee0cdd7ab00ddde7  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          name: prebuild-${{ matrix.row.slug }}-${{ matrix.row.platform }}-${{ matrix.row.arch }}
          path: src
      - name: ci:system
        shell: bash
        working-directory: src
        env:
          PROJECT: ${{ matrix.row.project }}
          CONFIG: ${{ matrix.row.config }}
        run: pnpm exec nx run-many -t ci:system -p "$PROJECT" -c "$CONFIG" --parallel=1 --outputStyle=stream
      # Links each restored package's prebuilds where its dependents look for them, without rebuilding.
      - name: link:platform
        if: matrix.row.hasBuild
        shell: bash
        working-directory: src
        run: |
          dirs=$(printf "%s\n" packages/*/prebuilds | sed "s|/prebuilds$||" | paste -sd, -)
          pnpm exec nx run-many -t link:platform -p "$dirs" --exclude-task-dependencies --outputStyle=stream
      - name: ${{ matrix.row.target }}
        shell: bash
        working-directory: src
        env:
          PROJECT: ${{ matrix.row.project }}
          TARGET: ${{ matrix.row.target }}
          CONFIG: ${{ matrix.row.config }}
          CI_RUNNER_LABEL: ${{ matrix.row.runner }}
          QASE: ${{ contains(matrix.row.meta.secrets, 'QASE_API_TOKEN') && secrets.QASE_API_TOKEN || '' }}
          BUCKET: ${{ contains(matrix.row.meta.secrets, 'MODEL_S3_BUCKET') && secrets.MODEL_S3_BUCKET || '' }}
          HF: ${{ contains(matrix.row.meta.secrets, 'HF_TOKEN') && secrets.HF_TOKEN || '' }}
          GH: ${{ contains(matrix.row.meta.secrets, 'GITHUB_TOKEN') && github.token || '' }}
          MQTT_HOST_S: ${{ contains(matrix.row.meta.secrets, 'MQTT_HOST') && secrets.MQTT_HOST || '' }}
          MQTT_USERNAME_S: ${{ contains(matrix.row.meta.secrets, 'MQTT_USERNAME') && secrets.MQTT_USERNAME || '' }}
          MQTT_PASSWORD_S: ${{ contains(matrix.row.meta.secrets, 'MQTT_PASSWORD') && secrets.MQTT_PASSWORD || '' }}
          MQTT_CA_CERT_S: ${{ contains(matrix.row.meta.secrets, 'MQTT_CA_CERT') && secrets.MQTT_CA_CERT || '' }}
          MQTT_CLIENT_CERT_S: ${{ contains(matrix.row.meta.secrets, 'MQTT_CLIENT_CERT') && secrets.MQTT_CLIENT_CERT || '' }}
          MQTT_CLIENT_KEY_S: ${{ contains(matrix.row.meta.secrets, 'MQTT_CLIENT_KEY') && secrets.MQTT_CLIENT_KEY || '' }}
          # Variables, not secrets: GitHub masks a short secret such as a port inside other values.
          MQTT_PROTOCOL: ${{ contains(matrix.row.meta.secrets, 'MQTT_HOST') && vars.MQTT_PROTOCOL || '' }}
          MQTT_PORT: ${{ contains(matrix.row.meta.secrets, 'MQTT_HOST') && vars.MQTT_PORT || '' }}
          # The live benchmark host's runner-local files, named by the release environment's variables.
          BENCHMARK_CONFIG_PATH: ${{ matrix.row.target == 'benchmark' && vars.BENCHMARK_CONFIG_PATH || '' }}
          BENCHMARK_ENVIRONMENT_PATH: ${{ matrix.row.target == 'benchmark' && vars.BENCHMARK_ENVIRONMENT_PATH || '' }}
          # A configuration selected by a label, with the suite that label passes; see ci.labels.
          CI_LABEL: ${{ matrix.row.label }}
          CI_SUITE: ${{ matrix.row.suite }}
          PERF_RUNS: ${{ inputs.perf_runs }}
          PERF_WARMUP_RUNS: ${{ inputs.perf_warmup_runs }}
          ARGS: ${{ inputs.args }}
        # Exported only when set, so an empty input never overrides a package default.
        run: |
          if [ -n "$PERF_RUNS" ]; then export QVAC_PERF_RUNS="$PERF_RUNS"; fi
          if [ -n "$PERF_WARMUP_RUNS" ]; then export QVAC_PERF_WARMUP_RUNS="$PERF_WARMUP_RUNS"; fi
          if [ -n "$ARGS" ]; then export BENCHMARK_ARGS="$ARGS"; fi
          if [ -n "$QASE" ]; then export QASE_API_TOKEN="$QASE"; fi
          if [ -n "$BUCKET" ]; then export MODEL_S3_BUCKET="$BUCKET"; fi
          if [ -n "$HF" ]; then export HF_TOKEN="$HF"; fi
          if [ -n "$GH" ]; then export GITHUB_TOKEN="$GH"; fi
          for name in MQTT_HOST MQTT_USERNAME MQTT_PASSWORD MQTT_CA_CERT MQTT_CLIENT_CERT MQTT_CLIENT_KEY; do
            value_var="${name}_S"
            if [ -n "${!value_var}" ]; then export "$name=${!value_var}"; fi
          done
          pnpm exec nx run-many -t "$TARGET" -p "$PROJECT" -c "$CONFIG" --exclude-task-dependencies --outputStyle=stream
      # Diagnostic: the addon's DLL imports, for when LoadLibrary misses one.
      - if: failure() && runner.os == 'Windows'
        shell: powershell
        working-directory: ${{ env.WORKDIR }}
        run: |
          $addon = Get-ChildItem -Recurse -Filter '*.bare' prebuilds/ -ErrorAction SilentlyContinue | Select-Object -First 1
          $dumpbin = Get-ChildItem -Path 'C:\Program Files\Microsoft Visual Studio', 'C:\Program Files (x86)\Microsoft Visual Studio' -Filter dumpbin.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($addon -and $dumpbin) { & $dumpbin.FullName /dependents $addon.FullName }
      - if: always() && !cancelled()
        uses: tetherto/qvac-actions/upload-artifact@1f7fae693183e6181384bae9ee0cdd7ab00ddde7  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          name: ${{ matrix.row.slug }}-perf-${{ matrix.row.config }}-${{ strategy.job-index }}
          path: ${{ env.WORKDIR }}/test/results/performance-report*.json
          if-no-files-found: ignore
          retention-days: "14"
      # A package's e2e reports; a dispatch on main keeps them 90 days as the baseline later runs compare with.
      - if: always() && !cancelled()
        uses: tetherto/qvac-actions/upload-artifact@1f7fae693183e6181384bae9ee0cdd7ab00ddde7  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          name: ${{ matrix.row.slug }}-results-${{ matrix.row.config }}
          path: ${{ env.WORKDIR }}/test/results/e2e/
          if-no-files-found: ignore
          retention-days: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && '90' || '30' }}
      - if: always() && !cancelled() && matrix.row.target == 'benchmark'
        uses: tetherto/qvac-actions/upload-artifact@1f7fae693183e6181384bae9ee0cdd7ab00ddde7  # TEMP rehearsal: qvac-actions PR 18 head until it merges
        with:
          name: ${{ matrix.row.slug }}-benchmark-${{ matrix.row.config }}
          path: ${{ env.WORKDIR }}/benchmarks/results/
          if-no-files-found: warn
          retention-days: "30"
