name: Bare majors

# Unit-tests the merge-guard bare-major check. The blocking run itself is the
# `bare-majors` job in pr-gate-merge.yml, which feeds qvac-merge-guard.

on:
  pull_request:
    paths:
      - ".github/scripts/lib/bare-majors.mjs"
      - ".github/scripts/check-bare-majors.mjs"
      - ".github/scripts/test/check-bare-majors.test.mjs"
      - ".github/workflows/bare-majors.yml"
      - ".github/workflows/pr-gate-merge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Unit tests
        run: node --test .github/scripts/test/check-bare-majors.test.mjs
