name: QVAC Node Consumer Tests
# Reusable workflow for the runner-hosted SDK consumers that share one job
# shape: desktop, electron, and python. Strict Snap needs LXD, snapd and its own
# model cache, so it runs from test-snap-sdk.yml; both build their legs from the
# same sdk-e2e-node-* actions.

on:
  workflow_call:
    inputs:
      consumer:
        description: "Consumer to run (desktop, electron, or python); Snap runs from test-snap-sdk.yml"
        required: false
        type: string
        default: desktop
      working-directory:
        description: "Working directory for tests (consumer/test runner)"
        required: false
        type: string
        default: "."
      project-directory:
        description: "Root project directory (where package.json lives)"
        required: true
        type: string
      platforms:
        description: 'JSON array of runner labels (e.g., ["qvac-ubuntu2404-x64"] or ["qvac-ubuntu2404-x64-gpu", "qvac-macos26-arm64-gpu"])'
        required: true
        type: string
      consumer-timeout:
        description: "Timeout in seconds for consumer connection"
        required: false
        type: number
        default: 30
      filter:
        description: 'Filter tests by category or testId prefix (comma-separated, e.g., "model,completion")'
        required: false
        type: string
      suite:
        description: "Suite filter (e.g. 'smoke'). Empty = all tests."
        required: false
        type: string
      exclude-suite:
        description: "Exclude suites (comma-separated)"
        required: false
        type: string
      rerun-plan:
        description: >-
          JSON {family: {platform: [testId]}} of previously failed tests. When set,
          each matrix leg replaces `filter` with the list recorded for its own
          platform. Empty = normal run.
        required: false
        type: string
        default: ""
      include:
        description: "Exact testIds to run on top of the suite/filter selection (comma-separated)"
        required: false
        type: string
        default: ""
      test-version:
        description: "Git ref to checkout (branch, tag, or SHA). Defaults to trigger ref."
        required: false
        type: string
      inference-source:
        description: "Resolved inference source"
        required: false
        type: string
        default: manifest
      inference-dependency-spec:
        description: "Resolved inference package spec for npm"
        required: false
        type: string
        default: ""
      inference-artifact-name:
        description: "Branch inference tarball artifact"
        required: false
        type: string
        default: ""
      inference-provenance:
        description: "Immutable inference source identity"
        required: false
        type: string
        default: ""
      test-suite-source:
        description: "Resolved test-suite source"
        required: false
        type: string
        default: manifest
      test-suite-dependency-spec:
        description: "Resolved test-suite package spec for npm"
        required: false
        type: string
        default: ""
      test-suite-artifact-name:
        description: "Branch test-suite tarball artifact"
        required: false
        type: string
        default: ""
      test-suite-provenance:
        description: "Immutable test-suite source identity"
        required: false
        type: string
        default: ""
      cache-models:
        description: "Cache downloaded models between runs"
        required: false
        type: boolean
        default: true
    secrets:
      # MQTT_* secrets are typically provided via the release environment
      # (see the `environment: release` job). They are declared required: false
      # here so `secrets: inherit` from a caller with no repo-level values
      # does not fail at the workflow_call boundary; the jobs that consume
      # them have environment access.
      MQTT_HOST:
        required: false
      MQTT_USERNAME:
        required: false
      MQTT_PASSWORD:
        required: false
      MQTT_CA_CERT:
        required: false
      MQTT_CLIENT_CERT:
        required: false
      MQTT_CLIENT_KEY:
        required: false

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  report-start:
    name: "[${{ inputs.consumer }}] report-start"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      comment-ids: ${{ steps.report.outputs.comment-ids }}
      platform-keys: ${{ steps.keys.outputs.platforms }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: .github/actions/sdk-e2e-report-start
          sparse-checkout-cone-mode: false

      - name: Derive node platform keys
        id: keys
        shell: node {0}
        env:
          CONSUMER: ${{ inputs.consumer }}
          PLATFORMS_IN: ${{ inputs.platforms }}
        run: |
          const fs = require('fs');
          // A Snap leg here would skip the Snap build and install, so a caller
          // still pointing it at this workflow must turn the run red.
          if (!['desktop', 'electron', 'python'].includes(process.env.CONSUMER)) {
            console.log(
              `::error::Unsupported consumer "${process.env.CONSUMER}". Snap runs from test-snap-sdk.yml.`
            );
            process.exit(1);
          }
          const runners = JSON.parse(process.env.PLATFORMS_IN || '[]');
          const keys = runners.map((r) => {
            const s = String(r).toLowerCase();
            if (s.includes('win')) return 'windows';
            if (s.includes('mac') || s.includes('darwin')) return 'macos';
            return 'linux';
          });
          const unique = [...new Set(keys)];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `platforms=${JSON.stringify(unique)}\n`);
          console.log(`Derived platform keys: ${JSON.stringify(unique)}`);

      - name: Post running comments
        id: report
        uses: ./.github/actions/sdk-e2e-report-start
        with:
          family: ${{ inputs.consumer }}
          platforms: ${{ steps.keys.outputs.platforms }}
          suite: ${{ inputs.suite }}
          filter: ${{ inputs.rerun-plan != '' && 'rerun of previously failed tests' || inputs.filter }}
          exclude-suite: ${{ inputs.exclude-suite }}
          inference-provenance: ${{ inputs.inference-provenance }}
          test-suite-provenance: ${{ inputs.test-suite-provenance }}

  test-node:
    name: "[${{ inputs.consumer }}] test (${{ matrix.os }})"
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    environment: release
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Not secrets: GitHub masks a short secret such as a port inside other
      # values and drops any job output that contains it.
      MQTT_PROTOCOL: ${{ vars.MQTT_PROTOCOL }}
      MQTT_PORT: ${{ vars.MQTT_PORT }}
      MQTT_HOST: ${{ secrets.MQTT_HOST }}
      MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
      MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ inputs.test-version || github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            ${{ inputs.project-directory }}
            ${{ inputs.working-directory }}
            packages/inference
            ${{ inputs.consumer == 'python' && 'packages/sdk-python' || '' }}
            .github/actions/sdk-e2e-fail-on-failures
            .github/actions/sdk-e2e-prepare-inference
            .github/actions/sdk-e2e-prepare-test-suite
            .github/actions/sdk-python-venv

      # The shared steps come from the commit this workflow was loaded from, not
      # from the code under test: a PR that predates them, or a dispatch with an
      # older test-version, still has to run the workflow it was given. Actions
      # they call by ./.github/actions/... still resolve in the checkout above.
      - name: Check out the shared e2e actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
          path: .sdk-e2e-workflow
          sparse-checkout: |
            .github/actions/sdk-e2e-node-leg
            .github/actions/sdk-e2e-node-prepare
            .github/actions/sdk-e2e-node-results
            .github/actions/sdk-e2e-node-run

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 22

      - name: Resolve leg
        id: leg
        uses: ./.sdk-e2e-workflow/.github/actions/sdk-e2e-node-leg
        with:
          family: ${{ inputs.consumer }}
          runner-label: ${{ matrix.os }}
          filter: ${{ inputs.filter }}
          rerun-plan: ${{ inputs.rerun-plan }}
          allowed-families: desktop,electron,python

      - name: Install and build
        uses: ./.sdk-e2e-workflow/.github/actions/sdk-e2e-node-prepare
        with:
          project-directory: ${{ inputs.project-directory }}
          working-directory: ${{ inputs.working-directory }}
          inference-source: ${{ inputs.inference-source }}
          inference-dependency-spec: ${{ inputs.inference-dependency-spec }}
          inference-artifact-name: ${{ inputs.inference-artifact-name }}
          inference-provenance: ${{ inputs.inference-provenance }}
          test-suite-source: ${{ inputs.test-suite-source }}
          test-suite-dependency-spec: ${{ inputs.test-suite-dependency-spec }}
          test-suite-artifact-name: ${{ inputs.test-suite-artifact-name }}
          test-suite-provenance: ${{ inputs.test-suite-provenance }}
          mqtt-ca-cert: ${{ secrets.MQTT_CA_CERT }}
          mqtt-client-cert: ${{ secrets.MQTT_CLIENT_CERT }}
          mqtt-client-key: ${{ secrets.MQTT_CLIENT_KEY }}

      # The Python client runs from source; the action carries the reason the
      # runner's own Python is used rather than actions/setup-python.
      - name: Set up the Python client
        if: inputs.consumer == 'python'
        uses: ./.github/actions/sdk-python-venv

      # Python too: the external consumer's config points its client at this
      # worker entry, so both legs drive the same binary and a difference in a
      # result can only have come from the client.
      - name: Bundle SDK worker (custom plugins)
        if: inputs.consumer == 'desktop' || inputs.consumer == 'python'
        working-directory: ${{ inputs.working-directory }}
        run: npm run bundle:sdk

      - name: Configure SDK cache directory
        shell: node {0}
        run: |
          const fs = require('fs');
          const path = require('path');
          const cacheDir = path.resolve('${{ inputs.working-directory }}', '.qvac-cache');
          fs.mkdirSync(cacheDir, { recursive: true });
          const config = { cacheDirectory: cacheDir };
          const configPath = path.resolve('${{ inputs.working-directory }}', 'qvac.config.ci.json');
          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `QVAC_CONFIG_PATH=${configPath}\n`);
          console.log(`SDK cache dir: ${cacheDir}`);
          console.log(`Config written to: ${configPath}`);

      - name: Restore models cache
        id: models-cache
        if: inputs.cache-models != false
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          path: ${{ inputs.working-directory }}/.qvac-cache
          key: qvac-models-${{ inputs.consumer == 'python' && 'desktop' || inputs.consumer }}-${{ hashFiles('packages/inference/src/models/registry/models.ts') }}
          enableCrossOsArchive: true

      # The Python leg resolves the same resource table against the same
      # registry, so it bootstraps and caches as `desktop` rather than paying
      # for a second copy of every model.
      - name: Bootstrap (download models)
        if: steps.models-cache.outputs.cache-hit != 'true'
        working-directory: ${{ inputs.working-directory }}
        run: npx qvac-test run:bootstrap:${{ inputs.consumer == 'python' && 'desktop' || inputs.consumer }} --config=.

      # Save right after bootstrap. On parallel runners, first to finish reserves the key;
      # others get a non-fatal "unable to reserve" warning which is expected.
      - name: Save models cache
        if: steps.models-cache.outputs.cache-hit != 'true' && inputs.cache-models != false
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          path: ${{ inputs.working-directory }}/.qvac-cache
          key: qvac-models-${{ inputs.consumer == 'python' && 'desktop' || inputs.consumer }}-${{ hashFiles('packages/inference/src/models/registry/models.ts') }}
          enableCrossOsArchive: true

      - name: Build Electron package
        if: inputs.consumer == 'electron'
        working-directory: ${{ inputs.working-directory }}
        run: npx qvac-test build:consumer:electron --config=. --skip-install

      # A non-JS client is not its own consumer: the framework drives it over
      # the stdin/stdout bridge, so the command is the external consumer and
      # the client is named in the config.
      - name: Run tests
        timeout-minutes: 60
        uses: ./.sdk-e2e-workflow/.github/actions/sdk-e2e-node-run
        with:
          family: ${{ inputs.consumer }}
          runner-label: ${{ matrix.os }}
          platform: ${{ steps.leg.outputs.platform }}
          working-directory: ${{ inputs.working-directory }}
          consumer-command: ${{ inputs.consumer == 'python' && 'run:consumer:external' || format('run:consumer:{0}', inputs.consumer) }}
          consumer-args: ${{ inputs.consumer == 'python' && '--name=python' || inputs.consumer == 'electron' && '--skip-build' || '' }}
          consumer-timeout: ${{ inputs.consumer-timeout }}
          filter: ${{ steps.leg.outputs.filter }}
          suite: ${{ inputs.suite }}
          exclude-suite: ${{ inputs.exclude-suite }}
          include: ${{ inputs.include }}

      - name: Collect results
        if: always() && steps.leg.outputs.platform != ''
        uses: ./.sdk-e2e-workflow/.github/actions/sdk-e2e-node-results
        with:
          family: ${{ inputs.consumer }}
          platform: ${{ steps.leg.outputs.platform }}
          working-directory: ${{ inputs.working-directory }}

      - name: Fail on e2e result failures
        if: success() || failure()
        uses: ./.github/actions/sdk-e2e-fail-on-failures
        with:
          report-dir: ${{ inputs.working-directory }}/reports

      - name: Show consumer log on failure
        if: failure()
        shell: node {0}
        working-directory: ${{ inputs.working-directory }}
        run: |
          const fs = require('fs');
          if (fs.existsSync('consumer.log')) {
            console.log(fs.readFileSync('consumer.log', 'utf8'));
          }

  report-finalize:
    name: "[${{ inputs.consumer }}] report-finalize"
    needs: [report-start, test-node]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: .github/actions/sdk-e2e-report-finalize
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/sdk-e2e-report-finalize
        with:
          family: ${{ inputs.consumer }}
          platforms: ${{ needs.report-start.outputs.platform-keys }}
          comment-ids: ${{ needs.report-start.outputs.comment-ids }}
          suite: ${{ inputs.suite }}
          filter: ${{ inputs.rerun-plan != '' && 'rerun of previously failed tests' || inputs.filter }}
          exclude-suite: ${{ inputs.exclude-suite }}
          inference-provenance: ${{ inputs.inference-provenance }}
          test-suite-provenance: ${{ inputs.test-suite-provenance }}
