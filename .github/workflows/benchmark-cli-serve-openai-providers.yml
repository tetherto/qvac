name: Benchmark CLI — OpenAI serve provider compare

# Harness unit tests on PRs that touch the benchmark or this workflow.
# Live smoke/full sweeps are dispatch-only on a self-hosted macOS GPU runner
# (LM Studio, Ollama, and qvac serve must already be configured there).

on:
  pull_request:
    paths:
      - 'packages/cli/benchmarks/serve-openai-providers/**'
      - 'packages/cli/package.json'
      - 'packages/cli/tsconfig.benchmark.json'
      - '.github/workflows/benchmark-cli-serve-openai-providers.yml'
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/SHA to run (default: current ref)'
        required: false
        type: string
      mode:
        description: 'harness-unit (tsx tests only) | smoke | full'
        required: true
        type: choice
        options:
          - harness-unit
          - smoke
          - full
        default: harness-unit

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  BENCH_DIR: packages/cli/benchmarks/serve-openai-providers
  CLI_DIR: packages/cli

jobs:
  harness-unit:
    name: Harness unit tests
    if: >
      github.event_name == 'pull_request' ||
      inputs.mode == 'harness-unit' ||
      inputs.mode == 'smoke' ||
      inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: '22'
          # packages/*/package-lock.json is gitignored in this monorepo — no npm cache path.

      - name: Install CLI deps
        working-directory: ${{ env.CLI_DIR }}
        run: npm install --no-fund --no-audit

      - name: Typecheck benchmark harness
        working-directory: ${{ env.CLI_DIR }}
        run: npm run typecheck:bench-serve-openai-providers

      - name: Harness unit tests
        working-directory: ${{ env.CLI_DIR }}
        run: npm run test:bench-serve-openai-providers

  label-gate:
    name: Authorise (label-gate)
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'smoke' || inputs.mode == 'full')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      authorised: ${{ steps.gate.outputs.authorised }}
    steps:
      - name: Checkout (label-gate action only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/label-gate
          sparse-checkout-cone-mode: false
      - name: Run label-gate
        id: gate
        uses: ./.github/actions/label-gate
        with:
          github-token: ${{ github.token }}

  live:
    name: Live provider ${{ inputs.mode }}
    needs:
      - harness-unit
      - label-gate
    if: >
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'smoke' || inputs.mode == 'full') &&
      needs.label-gate.outputs.authorised == 'true'
    runs-on: [self-hosted, qvac-macos26-arm64-gpu]
    timeout-minutes: 180
    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: '22'
          # packages/*/package-lock.json is gitignored in this monorepo — no npm cache path.

      - name: Install CLI deps
        working-directory: ${{ env.CLI_DIR }}
        run: npm install --no-fund --no-audit

      - name: Require runner config
        working-directory: ${{ env.BENCH_DIR }}
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if grep -q 'REPLACE_WITH_' benchmark.yaml; then
            echo "::error::benchmark.yaml still contains REPLACE_WITH_ placeholders."
            echo "Configure model IDs and gguf_path on the runner (or commit a CI overlay) before mode=${MODE}."
            exit 1
          fi

      - name: Run live mode
        working-directory: ${{ env.BENCH_DIR }}
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            smoke|full)
              npx tsx benchmark.ts "$MODE"
              ;;
            *)
              echo "::error::invalid mode: $MODE"
              exit 1
              ;;
          esac

      - name: Upload results
        if: always() && inputs.mode == 'full'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: serve-openai-providers-${{ github.run_id }}
          path: |
            ${{ env.BENCH_DIR }}/results/
            ${{ env.BENCH_DIR }}/environment.md
          if-no-files-found: warn
