name: Merge Guard

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  packages: read

concurrency:
  group: pr-gate-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  fork-approval:
    permissions:
      statuses: write
    uses: ./.github/workflows/reusable-fork-approval.yml
  authorize:
    needs: [fork-approval]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: read
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      - name: Checkout authorize-pr (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/authorize-pr
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Authorize
        id: auth
        uses: ./.github/actions/authorize-pr
        with:
          github-token: ${{ github.token }}

  changes:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.pkglist.outputs.packages }}
      packages-with-path: ${{ steps.pkglist.outputs.packages-with-path }}
      any: ${{ steps.filter.outputs.pkg-any }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # 4.0.1
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            pkg-any:
              - "packages/**"
              - ".github/workflows/prebuilds-*.yml"
            asr-ggml:
              - "packages/asr-ggml/**"
              - ".github/workflows/prebuilds-asr-ggml.yml"
            bci-whispercpp:
              - "packages/bci-whispercpp/**"
              - ".github/workflows/prebuilds-bci-whispercpp.yml"
            classification-ggml:
              - "packages/classification-ggml/**"
              - ".github/workflows/prebuilds-classification-ggml.yml"
            decoder-audio:
              - "packages/decoder-audio/**"
            diffusion-cpp:
              - "packages/diffusion-cpp/**"
              - ".github/workflows/prebuilds-diffusion-cpp.yml"
            embed-llamacpp:
              - "packages/embed-llamacpp/**"
              - ".github/workflows/prebuilds-embed-llamacpp.yml"
            # Pure-JS/TS package (no prebuilds). Listed so its lint, typecheck,
            # declaration and generated-artifact checks run under sanity-checks
            # and reach the required qvac-merge-guard status.
            infer-base:
              - "packages/infer-base/**"
            llm-llamacpp:
              - "packages/llm-llamacpp/**"
              - ".github/workflows/prebuilds-llm-llamacpp.yml"
            model-fit:
              - "packages/model-fit/**"
              - ".github/workflows/prebuilds-model-fit.yml"
            ocr-ggml:
              - "packages/ocr-ggml/**"
              - ".github/workflows/prebuilds-ocr-ggml.yml"
            onnx:
              - "packages/onnx/**"
              - ".github/workflows/prebuilds-onnx.yml"
            translation-nmtcpp:
              - "packages/translation-nmtcpp/**"
              - ".github/workflows/prebuilds-translation-nmtcpp.yml"
            tts-ggml:
              - "packages/tts-ggml/**"
              - ".github/workflows/prebuilds-tts-ggml.yml"
            fabric:
              - "packages/fabric/**"
              - ".github/workflows/prebuilds-fabric.yml"
            vla:
              - "packages/vla-ggml/**"
              - ".github/workflows/prebuilds-vla.yml"

      # Package dir names mostly match the filter/job key (packages/<key>),
      # except vla (packages/vla-ggml) - mapped explicitly here so
      # sanity-checks' workdir is always correct. Two outputs: a flat name
      # list (intersected with PREBUILD_KEYS in verify-prebuilds) and a
      # name+path list (for the sanity-checks matrix's workdir).
      - name: Build package lists
        id: pkglist
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          CHANGED=$(echo "$CHANGES" | jq -c 'map(select(. != "pkg-any"))')
          echo "packages=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "packages-with-path=$(echo "$CHANGED" | jq -c '
            map({package: ., path: (if . == "vla" then "packages/vla-ggml" else "packages/" + . end)})
          ')" >> "$GITHUB_OUTPUT"

  sanity-checks:
    # Runs per-package (matches how ./.github/actions/sanity-checks is
    # already invoked from every on-pr-<pkg>.yml - workdir is a package
    # path, there is no root package.json in this monorepo).
    # Gate on the concrete package list: a non-addon packages/** change leaves
    # packages=[], which would make this matrix zero-run and result='' downstream.
    if: needs.authorize.outputs.allowed == 'true' && needs.changes.outputs.packages != '[]' && needs.changes.outputs.packages != ''
    needs: [authorize, changes, fork-approval]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.packages-with-path || '[]') }}
    runs-on: ubuntu-latest
    name: sanity-checks (${{ matrix.package }})
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Sanity checks
        uses: ./.github/actions/sanity-checks
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          pat-token: ${{ secrets.PAT_TOKEN }}
          run-integration: ${{ needs.authorize.outputs.allowed == 'true' }}
          workdir: ${{ matrix.path }}

  # Merge Guard VERIFIES that prebuilds passed - it must NOT trigger them
  # (Gianfranco's requirement). Building is owned by the label-gated
  # on-pr-<pkg>.yml flow, which keeps the native-change detection + artifact-reuse
  # optimisations. Each prebuild-bearing on-pr-<pkg>.yml publishes a
  # `qvac/prebuild-<pkg>` commit status on the PR head SHA (success when the
  # prebuild passed OR was legitimately skipped/reused; failure only on a real
  # prebuild failure). This job reads those statuses for the changed packages and
  # mirrors them into build-status. It compiles nothing and inherits no secrets.
  #
  # PREBUILD_KEYS must list every package whose on-pr-<pkg>.yml carries the
  # publish-prebuild-status job (i.e. every prebuild-bearing addon in `changes`).
  verify-prebuilds:
    needs: [authorize, changes, fork-approval]
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    # Generous: the gate stays pending until the on-pr prebuild it mirrors finishes.
    timeout-minutes: 180
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Verify addon prebuild statuses on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_PACKAGES: ${{ needs.changes.outputs.packages || '[]' }}
        run: |
          set -euo pipefail
          # Packages whose on-pr-<pkg>.yml publishes a qvac/prebuild-<pkg> status.
          PREBUILD_KEYS='["asr-ggml","bci-whispercpp","classification-ggml","diffusion-cpp","embed-llamacpp","fabric","llm-llamacpp","model-fit","ocr-ggml","onnx","translation-nmtcpp","tts-ggml","vla"]'
          expected=$(jq -cn --argjson a "$CHANGED_PACKAGES" --argjson b "$PREBUILD_KEYS" '[ $a[] | select( . as $x | $b | index($x) ) ]')
          count=$(echo "$expected" | jq 'length')
          echo "Head SHA:          $HEAD_SHA"
          echo "Changed packages:  $CHANGED_PACKAGES"
          echo "Prebuilds to check: $expected"
          if [ "$count" -eq 0 ]; then
            echo "No prebuild-bearing package changed - build not applicable, passing."
            exit 0
          fi
          deadline=$(( $(date +%s) + 180 * 60 ))
          while :; do
            statuses=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/statuses" --paginate)
            pending=""
            failed=""
            for pkg in $(echo "$expected" | jq -r '.[]'); do
              ctx="qvac/prebuild-${pkg}"
              state=$(echo "$statuses" | jq -r --arg c "$ctx" 'map(select(.context == $c)) | .[0].state // ""')
              case "$state" in
                success) ;;
                failure | error) failed="${failed} ${ctx}" ;;
                *) pending="${pending} ${ctx}" ;;
              esac
            done
            if [ -n "$failed" ]; then
              echo "::error title=Prebuild has not returned success::Failing prebuild status(es):${failed}"
              exit 1
            fi
            if [ -z "$pending" ]; then
              echo "All required prebuild statuses succeeded."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error title=Prebuild verification timed out::No terminal prebuild status after timeout for:${pending}"
              exit 1
            fi
            echo "Waiting on prebuild status(es):${pending} - re-checking in 30s"
            sleep 30
          done

  # Calls pr-checks-sdk-pod.yml via its workflow_call trigger. No sdk-pod-any
  # pre-filter: the called workflow self-detects SDK pod changes and is a fast
  # no-op when none changed, so this stays graceful for addon-only / non-SDK PRs.
  sdk-pod-checks:
    needs: [authorize, fork-approval]
    if: needs.authorize.outputs.allowed == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/pr-checks-sdk-pod.yml

  qvac-merge-guard:
    needs: [authorize, changes, sanity-checks, verify-prebuilds, sdk-pod-checks]
    if: |
      always() && !cancelled() &&
      (needs.changes.result == 'success' || needs.changes.result == 'skipped')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/public-pr.yml
    with:
      sanity-checks-status: ${{ needs.sanity-checks.result == 'success' || needs.sanity-checks.result == 'skipped' }}
      build-status: ${{ needs.verify-prebuilds.result == 'success' || needs.verify-prebuilds.result == 'skipped' }}
      general-checks-status: ${{ needs.sdk-pod-checks.result == 'success' || needs.sdk-pod-checks.result == 'skipped' }}
