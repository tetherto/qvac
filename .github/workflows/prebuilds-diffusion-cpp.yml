# Build-only workflow. Publishing is handled by on-merge-diffusion-cpp.yml
name: Prebuilds (Stable Diffusion)

on:
  workflow_dispatch:
    inputs:
      workdir:
        description: "Working directory (optional)"
        required: false
        type: string
        default: "packages/diffusion-cpp"

  workflow_call:
    inputs:
      ref:
        description: "ref"
        type: string
        required: false
      repository:
        type: string
        required: false
        default: "tetherto/qvac"
      workdir:
        description: "Working directory (optional)"
        required: false
        type: string
        default: "packages/diffusion-cpp"

permissions:
  contents: read

jobs:
  prebuild:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/reusable-prebuilds.yml
    with:
      workdir: ${{ inputs.workdir }}
      ref: ${{ inputs.ref }}
      repository: ${{ inputs.repository }}
      artifact-name-prefix: sd-cpp-
      include-vulkan-sdk: true
      include-cuda: true
      include-cuda-arm64: true
      include-cuda-arm64-jetson: true
      cuda-arm64-jetson-cmake-option: SD_CUDA_JETSON
      cuda-arm64-jetson-primary-cmake-option: SD_CUDA
      include-cuda-win32: true
      platform-cmake-defines: |
        linux: -D SD_CUDA=ON
        win32-x64: -D SD_CUDA=ON
    secrets: inherit
