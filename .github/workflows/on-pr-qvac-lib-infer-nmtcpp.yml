name: On PR Trigger (NMTCPP)

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/qvac-lib-infer-nmtcpp/**"
      - ".github/workflows/*nmtcpp*.yml"
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  PKG_DIR: packages/qvac-lib-infer-nmtcpp

jobs:
  # ---------------------------------------------------------------------------
  # 1. Security Gate
  # ---------------------------------------------------------------------------
  authorize:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - name: Security Gate
        id: gate
        uses: tetherto/qvac-devops/.github/actions/auth-gate@main # Change to your branch/tag
        with:
          required-label: 'verify'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 3. Path Filter
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      pkg: ${{ steps.filter.outputs.pkg }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # 4.0.1
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            pkg:
              - "packages/qvac-lib-infer-nmtcpp/**"
              - ".github/workflows/*nmtcpp*.yml"

  # ---------------------------------------------------------------------------
  # 4. Execution Jobs
  # ---------------------------------------------------------------------------
  sanity-checks:
    needs: [authorize, changes]
    if: |
      needs.authorize.outputs.allowed == 'true' &&
      (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Run Sanity checks
        uses: tetherto/qvac-devops/.github/actions/sanity-checks@monorepo_update
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          pat-token: ${{ secrets.PAT_TOKEN }}
          run-integration: true
          workdir: packages/qvac-lib-infer-nmtcpp

  ts-checks:
    needs: [authorize, changes, sanity-checks]
    if: |
      needs.authorize.outputs.allowed == 'true' &&
      (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PKG_DIR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 20

      - name: Configure npm auth
        run: |
          qvac_registry="https://registry.npmjs.org/"
          cat > .npmrc <<NPMRC
          registry=https://registry.npmjs.org/
          @qvac:registry=${qvac_registry}
          @tetherto:registry=https://npm.pkg.github.com/
          //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}
          //npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}
          NPMRC

      - name: Install dependencies
        run: npm install

      - name: Type declaration check
        run: npm run test:dts

  cpp-lint:
    needs: [authorize, changes, sanity-checks]
    if: |
      needs.authorize.outputs.allowed == 'true' &&
      (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch')
    uses: tetherto/qvac-devops/.github/workflows/cpp-lint.yaml@monorepo_update
    secrets: inherit
    with:
      sha: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
      pr_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      workdir: packages/qvac-lib-infer-nmtcpp

  cpp-tests:
    needs: [authorize, changes, sanity-checks]
    if: |
      needs.authorize.outputs.allowed == 'true' &&
      (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/reusable-cpp-tests-qvac-lib-infer-nmtcpp.yml
    secrets: inherit
    with:
      ref: ${{ github.event.pull_request.head.ref }}
      repository: ${{ github.event.pull_request.head.repo.full_name }}

  prebuild:
    needs: [authorize, changes, sanity-checks]
    if: |
      needs.authorize.outputs.allowed == 'true' &&
      (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/prebuilds-qvac-lib-infer-nmtcpp.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}
      tag: "dev"
      publish_target: "gpr"

  run-integration-tests:
    needs: [authorize, changes, sanity-checks, prebuild]
    if: |
      needs.authorize.outputs.allowed == 'true' &&
      (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/integration-test-qvac-lib-infer-nmtcpp.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}

  run-mobile-integration-tests:
    needs: [authorize, changes, sanity-checks, prebuild]
    if: |
      needs.authorize.outputs.allowed == 'true' &&
      (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/integration-mobile-test-qvac-lib-infer-nmtcpp.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}

  merge-guard:
    needs:
      - authorize
      - changes
      - sanity-checks
      - ts-checks
      - cpp-lint
      - cpp-tests
      - prebuild
      - run-integration-tests
      - run-mobile-integration-tests
    if: always() && (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch')
    uses: tetherto/qvac-devops/.github/workflows/public-pr.yml@monorepo_update
    with:
      sanity-checks-status: ${{ (needs.sanity-checks.result == 'success' || needs.sanity-checks.result == 'skipped') && (needs.cpp-tests.result == 'success' || needs.cpp-tests.result == 'skipped') && (needs.ts-checks.result == 'success' || needs.ts-checks.result == 'skipped') }}
      build-status: ${{ needs.prebuild.result == 'success' || needs.prebuild.result == 'skipped' }}
      integration-tests-status: ${{ needs.run-integration-tests.result == 'success' || needs.run-integration-tests.result == 'skipped' }}
    secrets: inherit