name: Mobile Integration Tests (Embed)

# Migrated to .github/actions/run-mobile-integration-tests in
# QVAC-18168 follow-up: rollout to remaining 9 mobile addons.
#
# Embed uses single-pool scheduling (one Device Farm run per platform
# against the addon's own pool — no dual-flagship split, no sharding).

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        type: string
        required: false
      repository:
        description: "Repository to checkout"
        type: string
        required: false
      package:
        description: "Full NPM package spec to test (optional for workflow_call)"
        type: string
        required: false
      test_groups:
        description: "JSON array of {name,grep} overrides. When set, the run is a perf benchmark batch (perf collection + the benchmark shard set) instead of the auto-detected test-groups.json shards. Default empty preserves normal mobile-integration behaviour."
        type: string
        required: false
        default: ""
      job_timeout_minutes:
        description: "Override the build-and-test job timeout (minutes). Default 120; raised by Benchmark Performance where a batch needs more headroom."
        type: number
        required: false
        default: 120
      artifact_suffix:
        description: "Suffix appended to the perf-report artifact name (before the platform segment) so multiple benchmark batches in one run don't collide. Default empty keeps the existing name."
        type: string
        required: false
        default: ""
  # Manual on-demand path. A dispatched run targets ONE platform and the
  # device(s) chosen below — it never runs the full default pool. The
  # workflow_call path (benchmarks / weekend / on-merge) is unchanged.
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to run on (a manual run targets one platform)."
        type: choice
        required: true
        options: [Android, iOS]
        default: Android
      device:
        description: "Device from the common pool. Pick '(custom)' to type your own in 'devices_custom'. Valid names + how to find them: docs/ci/MOBILE-ON-DEMAND.md."
        type: choice
        required: false
        options:
          - "(custom)"
          - "Google Pixel 9"
          - "Google Pixel 8"
          - "Samsung Galaxy S25 Ultra"
          - "Apple iPhone 17"
          - "Apple iPhone 16 Pro"
          - "Apple iPhone 15"
        default: "(custom)"
      devices_custom:
        description: "Comma-separated device model(s), e.g. 'Pixel 9, Pixel 8'. Overrides the dropdown; use for new/uncommon devices or several at once. Must match a Device Farm model (list + how to check: docs/ci/MOBILE-ON-DEMAND.md)."
        type: string
        required: false
        default: ""
      device_model_operator:
        description: "Model match: EQUALS (exact fleet model only — default; dropdown values are exact fleet names) or CONTAINS (any model containing the value; use for shorthand like 'Pixel 9'). EQUALS avoids billing a different/slower variant."
        type: choice
        required: false
        options: [EQUALS, CONTAINS]
        default: EQUALS
      tests:
        description: "Optional test filter: a mocha --grep regex matched by test NAME, not file name (e.g. 'runEmbedSmoke'; combine several with '|'). Empty = full mobile suite. Where to find valid names: docs/ci/MOBILE-ON-DEMAND.md."
        type: string
        required: false
        default: ""
      ref:
        description: "Git ref (branch/tag/SHA) to test. Leave blank to use the branch you dispatch from."
        type: string
        required: false
        default: ""
      package:
        description: "Full NPM package spec to test. Leave EMPTY (default) to test this branch's native prebuild artifact; set @qvac/embed-llamacpp@<ver> (published) or @tetherto/embed-llamacpp@<dev> (GPR) to force-install a specific build."
        type: string
        required: false
        default: ""

concurrency:
  # workflow_dispatch: at most one manual mobile run per (workflow, branch) at a
  # time — a fresh dispatch cancels the in-flight one so a re-run never stacks a
  # second Device Farm run. Different branches map to different groups, so the
  # same addon can still be tested on 2-3 branches in parallel. workflow_call
  # (benchmarks / weekend / on-merge) is keyed per run and never cancels —
  # inputs.platform is only ever set on a manual dispatch, and under workflow_call
  # github.* resolves to the CALLER, so run_id keeps each call self-contained.
  group: ${{ inputs.platform != '' && format('mobile-dispatch-{0}-{1}', github.workflow, github.ref) || format('mobile-call-{0}', github.run_id) }}
  cancel-in-progress: ${{ inputs.platform != '' }}

jobs:
  # Manual (workflow_dispatch) runs must name a device that exists on Device
  # Farm. This gate fails fast BEFORE the build or any Device Farm run, so a typo
  # or an empty selection costs nothing. Skipped for workflow_call.
  validate-devices:
    name: Validate device selection
    if: inputs.platform != ''
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false
      # Validate the tests filter + shard fan-out against test-groups.json from
      # the SAME ref the build executes (inputs.ref || github.sha), not the
      # workflow ref, so a branch that renames/adds runners or shards can't pass
      # stale validation. Data only — nothing here is executed; the composite
      # action stays on the trusted workflow ref checked out above.
      - name: Checkout validation data (matches the built ref)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            packages/embed-llamacpp/test/mobile/test-groups.json
          sparse-checkout-cone-mode: false
          path: validation-data
          persist-credentials: false
      - name: Validate requested devices
        uses: ./.github/actions/run-mobile-integration-tests/validate-devices
        with:
          platform: ${{ inputs.platform }}
          devices: ${{ inputs.devices_custom != '' && inputs.devices_custom || (inputs.device != '(custom)' && inputs.device || '') }}
          device-model-operator: ${{ inputs.device_model_operator }}
          tests: ${{ inputs.tests }}
          test-groups-path: validation-data/packages/embed-llamacpp/test/mobile/test-groups.json
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

  # One non-matrixed writer mirrors embed's models into the US bucket, so the two
  # platform legs below never download/upload the same objects concurrently. Each
  # leg then only presigns (fast, no S3 write) for itself.
  seed-models:
    name: Seed embed models (US bucket)
    # Gated on validate-devices so a bad/empty manual device selection fails
    # fast BEFORE this up-to-120-min seed runs (the ticket's whole point is not
    # to spend on a doomed run). Skipped on workflow_call — validate-devices is
    # itself skipped there, and the `skipped` branch keeps this job running.
    needs: [validate-devices]
    if: ${{ !cancelled() && (needs.validate-devices.result == 'success' || needs.validate-devices.result == 'skipped') }}
    runs-on: qvac-ubuntu2204-x64
    environment: release
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false

      - name: Checkout addon repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.PAT_TOKEN }}
          path: addon
          fetch-depth: 0

      # node is job-managed on the self-hosted runners (only on PATH after this
      # step); the seed action shells out to node, so it must run first.
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Seed embed models into US bucket (mirror-only)
        uses: ./.github/actions/run-mobile-integration-tests/seed-and-presign-models
        with:
          manifest-path: addon/packages/embed-llamacpp/test/integration/models.manifest.json
          s3-prefix: qvac_models_compiled/mobile-pilot/embed/
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          hf-token: ${{ secrets.HF_TOKEN }}
          mode: seed

  build-and-test:
    name: Build ${{ matrix.platform }} and Run E2E Tests
    # validate-devices is skipped on workflow_call (its `skipped` result keeps
    # this job running once seed-models succeeds); on a manual run a bad/empty
    # device selection blocks the build before it starts.
    needs: [seed-models, validate-devices]
    if: ${{ !cancelled() && needs.seed-models.result == 'success' && (needs.validate-devices.result == 'success' || needs.validate-devices.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: ${{ inputs.job_timeout_minutes || 120 }}
    # No continue-on-error: a Device Farm test failure must fail this run on
    # every trigger (workflow_dispatch, workflow_call, schedule). Re-adding it
    # silently turns failed runs green.
    permissions:
      contents: read
      packages: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      # On workflow_dispatch, build only the chosen platform. workflow_call
      # builds both platforms as before.
      matrix: ${{ fromJSON(inputs.platform != '' && (inputs.platform == 'iOS' && '{"include":[{"platform":"iOS","os":"macos-14","runner":"macos-14"}]}' || '{"include":[{"platform":"Android","os":"ubuntu-22.04","runner":"qvac-ubuntu2204-x64"}]}') || '{"include":[{"platform":"Android","os":"ubuntu-22.04","runner":"qvac-ubuntu2204-x64"},{"platform":"iOS","os":"macos-14","runner":"macos-14"}]}') }}

    steps:
      - name: Validate Dispatch Inputs
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.package
        env:
          PKG: ${{ github.event.inputs.package }}
        run: |
          if [[ ! "$PKG" =~ ^@qvac/|^@tetherto/ ]]; then
            echo "::error::Invalid package scope. Only @qvac/* or @tetherto/* is allowed."
            exit 1
          fi

      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false

      - name: Checkout addon repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: addon
          fetch-depth: 0

      - name: Validate mobile tests are up-to-date
        working-directory: addon/packages/embed-llamacpp
        run: npm run test:mobile:validate || true

      - name: Setup mobile test environment
        uses: ./.github/actions/run-mobile-integration-tests/setup
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: 'packages/embed-llamacpp'
          addon-npm-name: '@qvac/embed-llamacpp'
          prebuild-artifact-prefix: 'llama-cpp-'
          pat-token: ${{ secrets.GITHUB_TOKEN }}
          # Manual dispatch (inputs.platform set): default (empty `package`) tests
          # this branch's native prebuild; @qvac/embed-llamacpp@<ver> = published, @tetherto/embed-llamacpp@<dev>
          # = this branch's GPR build). workflow_call is untouched (artifact-first).
          package-version: ${{ inputs.platform != '' && inputs.package || '' }}
          force-npm-prebuild: ${{ (inputs.platform != '' && inputs.package != '') && 'true' || 'false' }}

      # The mobile perf benchmark shards (benchmark-perf-*.test.js) are not
      # committed — they are generated from test/integration/_benchmark-matrix.js.
      # Only a benchmark batch (test_groups set) needs them: regenerate after
      # setup (which provisions Node) but before the bundle is built, then
      # hard-fail if any are missing so the Device Farm app can't be built
      # without them. Normal mobile runs (no test_groups) skip this.
      - name: Generate benchmark shards
        if: inputs.test_groups != ''
        working-directory: addon/packages/embed-llamacpp
        run: |
          npm run generate:benchmark-shards
          node scripts/generate-benchmark-shards.js --assert-shards

      - name: Build mobile app
        id: build
        uses: ./.github/actions/run-mobile-integration-tests/build-mobile-app
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: 'packages/embed-llamacpp'
          addon-npm-name: '@qvac/embed-llamacpp'
          ios-build-cert-base64: ${{ secrets.TEST_APP_APPLE_DISTRIBUTION_CERTIFICATE }}
          ios-build-cert-password: ${{ secrets.APPLE_P12_PASSWORD }}
          ios-keychain-password: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          ios-provisioning-profile-base64: ${{ secrets.TEST_APP_APPLE_PROVISIONING_PROFILE }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

      # Presign the already-seeded (by the seed-models job) US-bucket objects into
      # a map the prestage steps below consume. Presign-only: no S3 write, fresh
      # URLs minted per leg right before this leg builds and runs.
      - name: Presign embed models (US bucket)
        uses: ./.github/actions/run-mobile-integration-tests/seed-and-presign-models
        with:
          manifest-path: addon/packages/embed-llamacpp/test/integration/models.manifest.json
          s3-prefix: qvac_models_compiled/mobile-pilot/embed/
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          output-map: ${{ runner.temp }}/embed-url-map.json
          mode: presign

      # Generate the model pre-stage script. The Device Farm host has reliable
      # network; it downloads embed's models and pushes them to a platform-local
      # staging dir so the phone never fetches from huggingface.co
      # (QVAC-21799). Embed is single-pool, so all models are staged (no shards).
      - name: Generate model pre-stage commands (Android)
        id: prestage
        if: matrix.platform == 'Android'
        working-directory: addon/packages/embed-llamacpp
        # Repoint staged models to the US-bucket presigned URLs from the seed step.
        env:
          PRESTAGE_URL_MAP: ${{ runner.temp }}/embed-url-map.json
        run: |
          node scripts/generate-prestage-block.js android > "$RUNNER_TEMP/prestage-block.txt"
          {
            echo "block<<PRESTAGE_EOF"
            cat "$RUNNER_TEMP/prestage-block.txt"
            echo "PRESTAGE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate model pre-stage commands (iOS)
        id: ios_prestage
        if: matrix.platform == 'iOS'
        working-directory: addon/packages/embed-llamacpp
        # Repoint staged models to the US-bucket presigned URLs from the seed step.
        env:
          PRESTAGE_URL_MAP: ${{ runner.temp }}/embed-url-map.json
        run: |
          node scripts/generate-prestage-block.js ios > "$RUNNER_TEMP/prestage-block.txt"
          {
            echo "block<<PRESTAGE_EOF"
            cat "$RUNNER_TEMP/prestage-block.txt"
            echo "PRESTAGE_EOF"
          } >> "$GITHUB_OUTPUT"

      # On a manual run with a test filter, run only the matching tests (single
      # grepped spec). Empty filter / workflow_call keeps the default behaviour.
      - name: Resolve manual test filter
        id: manual_tests
        if: inputs.platform != '' && inputs.tests != ''
        shell: bash
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          # Reject anything but mocha-safe grep characters so a manual `tests`
          # value cannot break out of the generated WDIO config on the Device
          # Farm host (defense-in-depth; the sink is also JSON-encoded).
          if ! printf '%s' "$TESTS" | grep -Eq '^[A-Za-z0-9_ |().*+-]+$'; then
            echo "::error::Invalid 'tests' filter '$TESTS'. Allowed: letters, digits, and _ space | ( ) . * + - (a mocha --grep on test NAMES, e.g. 'runAddonTest' or 'runFoo|runBar')."
            exit 1
          fi
          MANUAL_GROUPS=$(jq -nc --arg g "$TESTS" '[{name:"manual", grep:$g}]')
          echo "groups=$MANUAL_GROUPS" >> "$GITHUB_OUTPUT"

      - name: Upload to Device Farm
        id: upload
        uses: ./.github/actions/run-mobile-integration-tests/upload-to-devicefarm
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: 'packages/embed-llamacpp'
          app-path: ${{ steps.build.outputs.app-path }}
          app-type: ${{ steps.build.outputs.app-type }}
          app-name: ${{ steps.build.outputs.app-name }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          device-farm-project-arn: ${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN_LLAMACPP_EMBED }}
          # Perf collection + the benchmark shard group only for a benchmark
          # batch; normal mobile runs keep perf off and auto-detect test-groups.
          enables-perf: ${{ inputs.test_groups != '' && 'true' || 'false' }}
          # A manual test filter wins; else the benchmark batch groups (workflow_call)
          # or auto-detected test-groups.json (empty).
          test-groups: ${{ steps.manual_tests.outputs.groups != '' && steps.manual_tests.outputs.groups || inputs.test_groups }}
          # Host pre-stages all embed models so the phone never downloads from
          # huggingface.co (QVAC-21799).
          extra-pre-test-commands: ${{ matrix.platform == 'iOS' && steps.ios_prestage.outputs.block || steps.prestage.outputs.block }}

      - name: Schedule Device Farm test run
        id: schedule
        uses: ./.github/actions/run-mobile-integration-tests/schedule-test-run
        with:
          platform: ${{ matrix.platform }}
          device-farm-project-arn: ${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN_LLAMACPP_EMBED }}
          android-device-pool-arn: ${{ secrets.ANDROID_DEVICE_POOL_ARN_LLAMACPP_EMBED }}
          ios-device-pool-arn: ${{ secrets.IOS_DEVICE_POOL_ARN_LLAMACPP_EMBED }}
          app-upload-arn: ${{ steps.upload.outputs.app-upload-arn }}
          test-package-upload-arn: ${{ steps.upload.outputs.test-package-upload-arn }}
          test-specs: ${{ steps.upload.outputs.test-specs }}
          # On workflow_dispatch, pin the run to the chosen device(s); otherwise
          # keep single-pool scheduling for workflow_call.
          scheduling-mode: ${{ inputs.platform != '' && 'manual-devices' || 'single-pool' }}
          device-models: ${{ inputs.platform != '' && (inputs.devices_custom != '' && inputs.devices_custom || (inputs.device != '(custom)' && inputs.device || '')) || '' }}
          device-model-operator: ${{ inputs.platform != '' && inputs.device_model_operator || '' }}

      - name: Monitor Device Farm test run
        id: monitor
        uses: ./.github/actions/run-mobile-integration-tests/monitor-test-run
        with:
          run-arns: ${{ steps.schedule.outputs.run-arns }}
          run-count: ${{ steps.schedule.outputs.run-count }}
          test-specs: ${{ steps.upload.outputs.test-specs }}

      - name: Cancel Device Farm runs on workflow cancellation
        if: cancelled() && steps.schedule.outputs.run-arns != '' && steps.schedule.outputs.run-arns != '[]'
        uses: ./.github/actions/run-mobile-integration-tests/cancel-device-farm-runs
        with:
          run-arns: ${{ steps.schedule.outputs.run-arns }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

      - name: Collect and upload Device Farm logs
        if: always() && !cancelled()
        uses: ./.github/actions/run-mobile-integration-tests/collect-and-upload-logs
        with:
          platform: ${{ matrix.platform }}
          addon-npm-name: '@qvac/embed-llamacpp'
          enables-perf: ${{ inputs.test_groups != '' && 'true' || 'false' }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          run-arns: ${{ steps.schedule.outputs.run-arns }}
          # Benchmark calls this reusable workflow once per (batchSize, flashAttn)
          # batch with a distinct artifact_suffix; pass it through so each batch's
          # console-logs/perf-report artifacts get a unique name instead of all 8
          # batches colliding on the same one (which dropped every batch's logs).
          batch-suffix: ${{ inputs.artifact_suffix }}

      # Benchmark batches only: pull the per-device perf-report.json the on-device
      # runner emitted out of the Device Farm customer artifacts and upload it
      # under a batch-suffixed name so the Benchmark Performance summarize job can
      # aggregate every batch. Normal mobile runs (no test_groups) skip this.
      - name: Extract & upload addon perf report (embed)
        if: always() && !cancelled() && inputs.test_groups != '' && steps.schedule.outputs.run-count != '0' && steps.schedule.outputs.run-count != ''
        uses: ./.github/actions/run-mobile-integration-tests/extract-addon-perf
        with:
          platform: ${{ matrix.platform }}
          merge: 'true'
          unzip-customer-artifacts: 'true'
          artifact-name: perf-report-llamacpp-embed-${{ inputs.artifact_suffix }}${{ matrix.platform }}-${{ github.run_number }}

      - name: Comment results on PR
        if: always() && !cancelled()
        uses: ./.github/actions/run-mobile-integration-tests/comment-on-pr
        with:
          addon-npm-name: '@qvac/embed-llamacpp'
          platform: ${{ matrix.platform }}
          test-result: ${{ steps.monitor.outputs.test-result }}
          test-total: ${{ steps.monitor.outputs.test-total }}
          test-passed: ${{ steps.monitor.outputs.test-passed }}
          test-failed: ${{ steps.monitor.outputs.test-failed }}
          test-skipped: ${{ steps.monitor.outputs.test-skipped }}
          user-test-passed: ${{ steps.monitor.outputs.user-test-passed }}
          user-test-failed: ${{ steps.monitor.outputs.user-test-failed }}
