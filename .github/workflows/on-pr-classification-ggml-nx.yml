# Parallel Nx/pnpm PR pipeline for classification-ggml. Mirrors
# on-pr-classification-ggml.yml job graph; delegates package work to *-nx.yml
# reusable workflows and Nx targets. Does not replace the legacy merge gate.
name: On PR Trigger (Classification-ggml, Nx)

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/classification-ggml/**"
      - "packages/infer-base/**"
      - "packages/logging/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "nx.json"
      - "tools/ci/**"
      - "packages/classification-ggml/project.json"
      - ".github/workflows/*classification-ggml*-nx*.yml"
      - ".github/actions/setup-pnpm-workspace/**"
      - ".github/actions/nx-run/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  packages: read
  id-token: write

env:
  PKG_DIR: packages/classification-ggml
  NX_PROJECT: classification-ggml

concurrency:
  group: nx-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  label-gate:
    name: Authorise (label-gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      authorised: ${{ steps.gate.outputs.authorised }}
    steps:
      - name: Checkout (label-gate action only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/label-gate
          sparse-checkout-cone-mode: false
      - name: Run label-gate
        id: gate
        uses: ./.github/actions/label-gate
        with:
          github-token: ${{ secrets.PAT_TOKEN }}

  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - name: Authorize
        id: auth
        uses: ./.github/actions/authorize-pr
        with:
          github-token: ${{ github.token }}

  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pkg: ${{ steps.filter.outputs.pkg }}
    steps:
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # 4.0.1
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            pkg:
              - "packages/classification-ggml/**"
              - "packages/infer-base/**"
              - "packages/logging/**"
              - "pnpm-workspace.yaml"
              - "pnpm-lock.yaml"
              - "package.json"
              - "nx.json"
              - "tools/ci/**"
              - "packages/classification-ggml/project.json"
              - ".github/workflows/*classification-ggml*-nx*.yml"
              - ".github/actions/setup-pnpm-workspace/**"
              - ".github/actions/nx-run/**"

  sanity-checks-nx:
    needs: [authorize, changes, label-gate]
    if: always() && !cancelled() && needs.label-gate.outputs.authorised == 'true' && ((needs.changes.outputs.pkg == 'true' && needs.authorize.outputs.allowed == 'true') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0

      - name: Run Sanity checks (Nx)
        uses: ./.github/actions/sanity-checks
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          pat-token: ${{ secrets.PAT_TOKEN }}
          run-integration: ${{ needs.authorize.outputs.allowed == 'true' }}
          workdir: packages/classification-ggml
          nx-project: classification-ggml

  ts-checks-nx:
    needs: [authorize, changes, sanity-checks-nx]
    if: always() && !cancelled() && needs.authorize.outputs.allowed == 'true' && (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - name: Setup pnpm workspace
        uses: ./.github/actions/setup-pnpm-workspace
        with:
          pat-token: ${{ secrets.PAT_TOKEN }}
          ignore-scripts: "true"
          install-bare: "false"
      - name: Type declaration check (Nx)
        uses: ./.github/actions/nx-run
        with:
          target: classification-ggml:test-dts

  cpp-lint:
    needs: [authorize, changes, sanity-checks-nx, label-gate]
    if: |
      always() &&
      !cancelled() &&
      needs.label-gate.outputs.authorised == 'true' &&
      needs.authorize.outputs.allowed == 'true' &&
      (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/cpp-lint.yaml
    secrets: inherit
    with:
      sha: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
      pr_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      workdir: packages/classification-ggml

  cpp-tests-nx:
    needs: [authorize, changes, sanity-checks-nx, label-gate]
    if: |
      always() &&
      !cancelled() &&
      needs.label-gate.outputs.authorised == 'true' &&
      needs.authorize.outputs.allowed == 'true' &&
      (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/cpp-tests-classification-ggml-nx.yml
    secrets: inherit
    with:
      workdir: packages/classification-ggml
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}

  prebuild-nx:
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    needs: [authorize, changes, sanity-checks-nx, label-gate]
    if: |
      always() &&
      !cancelled() &&
      needs.label-gate.outputs.authorised == 'true' &&
      needs.authorize.outputs.allowed == 'true' &&
      (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/prebuilds-classification-ggml-nx.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}

  run-integration-tests-nx:
    needs: [authorize, changes, sanity-checks-nx, prebuild-nx, label-gate]
    if: |
      always() &&
      !cancelled() &&
      needs.label-gate.outputs.authorised == 'true' &&
      needs.authorize.outputs.allowed == 'true' &&
      (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/integration-test-classification-ggml-nx.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}

  run-mobile-integration-tests-nx:
    permissions:
      contents: read
      packages: read
      pull-requests: write
      id-token: write
    needs: [authorize, changes, sanity-checks-nx, prebuild-nx, label-gate]
    if: |
      always() &&
      !cancelled() &&
      needs.label-gate.outputs.authorised == 'true' &&
      needs.authorize.outputs.allowed == 'true' &&
      (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/integration-mobile-test-classification-ggml-nx.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}

  merge-guard-nx:
    needs:
      [
        authorize,
        changes,
        sanity-checks-nx,
        ts-checks-nx,
        cpp-lint,
        cpp-tests-nx,
        prebuild-nx,
        run-integration-tests-nx,
        run-mobile-integration-tests-nx,
      ]
    if: always() && !cancelled() && (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/public-pr.yml
    with:
      sanity-checks-status: ${{ needs.sanity-checks-nx.result == 'success' && needs.ts-checks-nx.result == 'success' && needs.cpp-lint.result == 'success' && needs.cpp-tests-nx.result == 'success' }}
      build-status: ${{ needs.prebuild-nx.result == 'success' }}
      integration-tests-status: ${{ (needs.run-integration-tests-nx.result == 'success' || needs.run-integration-tests-nx.result == 'skipped') && (needs.run-mobile-integration-tests-nx.result == 'success' || needs.run-mobile-integration-tests-nx.result == 'skipped') }}
