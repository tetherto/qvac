name: Mobile Integration Tests (Model Fit)

# Runs the model-fit integration suite on real iOS/Android devices via AWS
# Device Farm, using the shared .github/actions/run-mobile-integration-tests
# composite actions. Single-pool scheduling (one Device Farm run per platform
# against the shared LLM pool).
#
# Device Farm projects and device pools are addon-agnostic — they only decide
# which physical devices the run lands on — so this track shares the llm-llamacpp
# project/pools rather than provisioning its own, matching what diffusion-cpp and
# classification-ggml already do:
#   LLM_AWS_DEVICE_FARM_PROJECT_ARN
#   LLM_ANDROID_DEVICE_POOL_ARN
#   LLM_IOS_DEVICE_POOL_ARN

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        type: string
        required: false
      repository:
        description: "Repository to checkout"
        type: string
        required: false
      package:
        description: "Full NPM package spec to test (optional for workflow_call)"
        type: string
        required: false
      job_timeout_minutes:
        description: "Override the build-and-test job timeout (minutes)."
        type: number
        required: false
        default: 120
  # Manual on-demand path. A dispatched run targets ONE platform and the
  # device(s) chosen below — it never runs the full default pool. The
  # workflow_call path (benchmarks / weekend / on-merge) is unchanged.
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to run on (a manual run targets one platform)."
        type: choice
        required: true
        options: [Android, iOS]
        default: Android
      device:
        description: "Device from the common pool. Pick '(custom)' to type your own in 'devices_custom'. Valid names + how to find them: docs/ci/MOBILE-ON-DEMAND.md."
        type: choice
        required: false
        options:
          - "(custom)"
          - "Google Pixel 9"
          - "Google Pixel 8"
          - "Samsung Galaxy S25 Ultra"
          - "Apple iPhone 17"
          - "Apple iPhone 16 Pro"
          - "Apple iPhone 15"
        default: "(custom)"
      devices_custom:
        description: "Comma-separated device model(s), e.g. 'Pixel 9, Pixel 8'. Overrides the dropdown; use for new/uncommon devices or several at once. Must match a Device Farm model (list + how to check: docs/ci/MOBILE-ON-DEMAND.md)."
        type: string
        required: false
        default: ""
      device_model_operator:
        description: "Model match: EQUALS (exact fleet model only — default; dropdown values are exact fleet names) or CONTAINS (any model containing the value; use for shorthand like 'Pixel 9'). EQUALS avoids billing a different/slower variant."
        type: choice
        required: false
        options: [EQUALS, CONTAINS]
        default: EQUALS
      tests:
        description: "Optional test filter: a mocha --grep regex matched by test NAME, not file name (e.g. 'runAddonTest'; combine several with '|'). Empty = full mobile suite. Where to find valid names: docs/ci/MOBILE-ON-DEMAND.md."
        type: string
        required: false
        default: ""
      ref:
        description: "Git ref (branch/tag/SHA) to test. Leave blank to use the branch you dispatch from."
        type: string
        required: false
        default: ""
      package:
        description: "Full NPM package spec to test. Leave EMPTY only when this workflow is called from a run that built prebuilds — a standalone dispatch has none, so empty resolves the PUBLISHED @latest, not your branch's native code; set @qvac/model-fit@<ver> (published) or @tetherto/model-fit-mono@<dev> (GPR) to force-install a specific build."
        type: string
        required: false
        default: ""

concurrency:
  # workflow_dispatch: at most one manual mobile run per (workflow, branch) at a
  # time — a fresh dispatch cancels the in-flight one so a re-run never stacks a
  # second Device Farm run. Different branches map to different groups, so the
  # same addon can still be tested on 2-3 branches in parallel. workflow_call
  # (benchmarks / weekend / on-merge) is keyed per run and never cancels —
  # inputs.platform is only ever set on a manual dispatch, and under workflow_call
  # github.* resolves to the CALLER, so run_id keeps each call self-contained.
  group: ${{ inputs.platform != '' && format('mobile-dispatch-{0}-{1}', github.workflow, github.ref) || format('mobile-call-{0}', github.run_id) }}
  cancel-in-progress: ${{ inputs.platform != '' }}

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  # Manual (workflow_dispatch) runs must name a device that exists on Device
  # Farm. This gate fails fast BEFORE any build or Device Farm run, so a typo
  # or an empty selection costs nothing. Skipped for workflow_call.
  validate-devices:
    name: Validate device selection
    if: inputs.platform != ''
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false
      # Validate the tests filter against the runner list from the SAME ref the
      # build executes (inputs.ref || github.sha), not the workflow ref, so a
      # branch that renames/adds runners can't pass stale validation. Data only —
      # nothing here is executed; the composite action stays on the trusted
      # workflow ref checked out above.
      - name: Checkout validation data (matches the built ref)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            packages/model-fit/test/mobile/integration.auto.cjs
          sparse-checkout-cone-mode: false
          path: validation-data
          persist-credentials: false
      - name: Validate requested devices
        uses: ./.github/actions/run-mobile-integration-tests/validate-devices
        with:
          platform: ${{ inputs.platform }}
          devices: ${{ inputs.devices_custom != '' && inputs.devices_custom || (inputs.device != '(custom)' && inputs.device || '') }}
          device-model-operator: ${{ inputs.device_model_operator }}
          tests: ${{ inputs.tests }}
          # Single-spec addon: validate the tests filter against the runner list
          # (checked out from the tested ref above) so a typo fails fast instead
          # of a billed false-green run.
          runner-source-path: validation-data/packages/model-fit/test/mobile/integration.auto.cjs
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

  # TEMPORARY DIAGNOSTIC — QVAC-24365. Delete this job before merge.
  #
  # Mobile runs schedule fine but the monitor step gets no state back, and
  # every AWS error was swallowed by `2>/dev/null`, so we could not tell an IAM
  # denial from a flaky API. This job makes the same Device Farm calls the
  # pipeline makes, with the same OIDC role, keeping stderr, and prints an
  # ALLOWED/DENIED map grouped by resource type.
  #
  # It lives in this workflow file rather than its own because the OIDC role's
  # trust policy is scoped to `environment: release` — a standalone workflow is
  # refused with "Not authorized to perform sts:AssumeRoleWithWebIdentity".
  #
  # Costs nothing: no build, no upload, no device time. Read-only calls.
  devicefarm-iam-probe:
    name: TMP QVAC-24365 Device Farm IAM probe
    if: inputs.platform != ''
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # 6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2

      - name: Probe
        shell: bash
        env:
          PROJECT_ARN: ${{ secrets.LLM_AWS_DEVICE_FARM_PROJECT_ARN }}
          # The run from https://github.com/tetherto/qvac/actions/runs/33537615113
          # whose monitor step could not read any state back.
          KNOWN_RUN_ARN: "arn:aws:devicefarm:us-west-2:833707431398:run:dcde833e-77ce-4248-976d-3828f303039c/5ef19af5-c0ef-42d7-88bc-4754582af6a4"
        run: |
          # `set +e` is load-bearing. GitHub's default shell line is
          # `bash --noprofile --norc -e -o pipefail`, and `set -uo pipefail`
          # does NOT clear that inherited -e. With -e still on, the first DENIED
          # probe aborted the whole job inside probe()'s command substitution —
          # which is exactly what happened on run 33670793241, killing the job at
          # the first GetRun and hiding every probe after it. The point of this
          # job is to run ALL the probes and print a map, so -e must be off.
          set +e
          set -uo pipefail

          RESULTS=""

          # Run one AWS call with stderr kept. Never aborts the job — every
          # probe must run so we get the full allow/deny map in one pass.
          probe() {
            local label="$1" resource_type="$2"
            shift 2
            echo "::group::$label  [resource type: $resource_type]"
            echo "\$ $*"
            local out rc
            out=$("$@" 2>&1)
            rc=$?
            # Truncate: ListRuns on a busy project returns every run ever, which
            # printed 1.1M log lines and got the job killed on the first attempt.
            # We only need the verdict and, on failure, the AWS error — both fit
            # well inside the first 40 lines.
            echo "$out" | head -40
            if [ "$(echo "$out" | wc -l)" -gt 40 ]; then
              echo "  ... output truncated ($(echo "$out" | wc -l) lines total)"
            fi
            if [ $rc -eq 0 ]; then
              echo "-> exit 0 (ALLOWED)"
              RESULTS="${RESULTS}ALLOWED|${resource_type}|${label}\n"
            else
              echo "-> exit $rc (FAILED)"
              local reason
              reason=$(echo "$out" | grep -o '([A-Za-z]*Exception)' | head -1)
              [ -z "$reason" ] && reason="(no AWS exception name in output)"
              RESULTS="${RESULTS}DENIED |${resource_type}|${label} ${reason}\n"
            fi
            echo "::endgroup::"
          }

          echo "=================================================="
          echo "Who am I"
          echo "=================================================="
          probe "sts:GetCallerIdentity" "n/a" \
            aws sts get-caller-identity --output json

          echo "=================================================="
          echo "Calls that SUCCEED in the real pipeline (project / * scoped)"
          echo "=================================================="
          probe "devicefarm:ListProjects" "* (no resource)" \
            aws devicefarm list-projects --output json
          probe "devicefarm:GetProject" "project:" \
            aws devicefarm get-project --arn "$PROJECT_ARN" --output json
          # --max-items 1: this project has thousands of runs. Without a cap the
          # CLI pages through all of them, which stalled the job past the point
          # where it was cancelled twice. One row proves the permission.
          probe "devicefarm:ListRuns" "project:" \
            aws devicefarm list-runs --arn "$PROJECT_ARN" --max-items 1 --output json
          probe "devicefarm:ListDevicePools" "project:" \
            aws devicefarm list-device-pools --arn "$PROJECT_ARN" --output json

          echo "=================================================="
          echo "Calls the MONITOR step depends on (run: / job: scoped)"
          echo "=================================================="

          # Prefer a run ARN discovered live, so a stale/expired ARN cannot be
          # mistaken for a permission problem. Fall back to the known one.
          DISCOVERED_RUN_ARN=""
          # head -1: with --max-items the CLI appends its pagination token as a
          # second output line, so this captured "<arn>\nNone" and built the
          # command `get-run --arn <arn> None --output json` (exit 254).
          DISCOVERED_RUN_ARN=$(aws devicefarm list-runs --arn "$PROJECT_ARN" \
            --max-items 1 --query 'runs[0].arn' --output text 2>/dev/null | head -1)
          if [ "$DISCOVERED_RUN_ARN" = "None" ]; then DISCOVERED_RUN_ARN=""; fi

          if [ -n "$DISCOVERED_RUN_ARN" ]; then
            echo "Most recent run discovered via ListRuns: $DISCOVERED_RUN_ARN"
            probe "devicefarm:GetRun (run discovered just now)" "run:" \
              aws devicefarm get-run --arn "$DISCOVERED_RUN_ARN" --output json
            probe "devicefarm:ListJobs (run discovered just now)" "run:" \
              aws devicefarm list-jobs --arn "$DISCOVERED_RUN_ARN" --output json

            JOB_ARN=""
            JOB_ARN=$(aws devicefarm list-jobs --arn "$DISCOVERED_RUN_ARN" \
              --query 'jobs[0].arn' --output text 2>/dev/null | head -1)
            if [ "$JOB_ARN" = "None" ]; then JOB_ARN=""; fi
            if [ -n "$JOB_ARN" ]; then
              probe "devicefarm:GetJob" "job:" \
                aws devicefarm get-job --arn "$JOB_ARN" --output json
              probe "devicefarm:ListSuites" "job:" \
                aws devicefarm list-suites --arn "$JOB_ARN" --output json
              probe "devicefarm:ListArtifacts" "job:" \
                aws devicefarm list-artifacts --arn "$JOB_ARN" --type FILE --output json
            else
              echo "(could not discover a job ARN — ListJobs returned nothing usable)"
            fi
          else
            echo "(could not discover a run ARN — ListRuns returned nothing usable)"
          fi

          probe "devicefarm:GetRun (the run from GH run 33537615113)" "run:" \
            aws devicefarm get-run --arn "$KNOWN_RUN_ARN" --output json
          probe "devicefarm:ListJobs (the run from GH run 33537615113)" "run:" \
            aws devicefarm list-jobs --arn "$KNOWN_RUN_ARN" --output json

          echo ""
          echo "=================================================="
          echo "SUMMARY — hand this to DevOps"
          echo "=================================================="
          printf "%b" "$RESULTS" | while IFS='|' read -r verdict rtype label; do
            printf '%-8s %-16s %s\n' "$verdict" "$rtype" "$label"
          done

          echo ""
          echo "Reading this: ScheduleRun/CreateUpload authorize against the"
          echo "*project* ARN, GetRun/ListJobs/GetJob authorize against the *run*"
          echo "and *job* ARNs. If the project rows are ALLOWED and the run/job"
          echo "rows are DENIED, the policy's Resource list needs the run/job"
          echo "ARNs added (or the actions themselves are missing)."

          {
            echo "## Device Farm IAM probe (QVAC-24365)"
            echo ""
            echo '```'
            printf "%b" "$RESULTS" | while IFS='|' read -r verdict rtype label; do
              printf '%-8s %-16s %s\n' "$verdict" "$rtype" "$label"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-test:
    name: Build ${{ matrix.platform }} and Run E2E Tests
    # workflow_call: validate-devices is skipped; the `skipped` branch of the
    # condition keeps this job running exactly as before.
    # workflow_dispatch: a bad/empty device selection blocks this job.
    needs: [runner_names, validate-devices]
    if: ${{ !cancelled() && needs.runner_names.result == 'success' && (needs.validate-devices.result == 'success' || needs.validate-devices.result == 'skipped') }}
    runs-on: ${{ matrix.platform == 'iOS' && needs.runner_names.outputs.macos_ios || needs.runner_names.outputs.linux_ubuntu2204_x64 }}
    environment: release
    timeout-minutes: ${{ inputs.job_timeout_minutes || 120 }}
    # No continue-on-error: a Device Farm test failure must fail this run on
    # every trigger (workflow_dispatch, workflow_call, schedule). Re-adding it
    # silently turns failed runs green.
    permissions:
      contents: read
      packages: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      # On workflow_dispatch, run only the chosen platform (devices come from
      # the manual inputs). workflow_call runs both platforms as before.
      matrix: ${{ fromJSON(inputs.platform != '' && (inputs.platform == 'iOS' && '{"include":[{"platform":"iOS","os":"macos-14"}]}' || '{"include":[{"platform":"Android","os":"ubuntu-22.04"}]}') || '{"include":[{"platform":"Android","os":"ubuntu-22.04"},{"platform":"iOS","os":"macos-14"}]}') }}

    steps:
      - name: Validate Dispatch Inputs
        if: inputs.platform != '' && github.event.inputs.package
        env:
          PKG: ${{ github.event.inputs.package }}
        run: |
          if [[ ! "$PKG" =~ ^@qvac/|^@tetherto/ ]]; then
            echo "::error::Invalid package scope. Only @qvac/* or @tetherto/* is allowed."
            exit 1
          fi

      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false

      - name: Checkout addon repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: addon
          fetch-depth: 0

      - name: Validate mobile tests are up-to-date
        working-directory: addon/packages/model-fit
        run: npm run test:mobile:validate || true

      - name: Setup mobile test environment
        uses: ./.github/actions/run-mobile-integration-tests/setup
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: 'packages/model-fit'
          addon-npm-name: '@qvac/model-fit'
          prebuild-artifact-prefix: 'model-fit-'
          pat-token: ${{ secrets.GITHUB_TOKEN }}
          # Manual dispatch (inputs.platform set). An empty `package` does NOT test
          # this branch's native code: a standalone dispatch produces no prebuild
          # artifacts, so the fallback resolves the published @qvac/model-fit@latest.
          # @qvac/model-fit@<ver> = published; @tetherto/model-fit-mono@<dev> = a branch
          # build from GitHub Packages, the only way to put unmerged native code on a
          # device. See docs/ci/MOBILE-ON-DEMAND.md. workflow_call is untouched (artifact-first).
          package-version: ${{ inputs.platform != '' && inputs.package || '' }}
          force-npm-prebuild: ${{ (inputs.platform != '' && inputs.package != '') && 'true' || 'false' }}

      - name: Build mobile app
        id: build
        uses: ./.github/actions/run-mobile-integration-tests/build-mobile-app
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: 'packages/model-fit'
          addon-npm-name: '@qvac/model-fit'
          ios-build-cert-base64: ${{ secrets.TEST_APP_APPLE_DISTRIBUTION_CERTIFICATE }}
          ios-build-cert-password: ${{ secrets.APPLE_P12_PASSWORD }}
          ios-keychain-password: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          ios-provisioning-profile-base64: ${{ secrets.TEST_APP_APPLE_PROVISIONING_PROFILE }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

      # On a manual run with a test filter, override to a single grepped spec
      # so only those tests run. Empty filter / workflow_call is unchanged.
      - name: Resolve manual test filter
        id: manual_tests
        if: inputs.platform != '' && inputs.tests != ''
        shell: bash
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          # Reject anything but mocha-safe grep characters so a manual `tests`
          # value cannot break out of the generated WDIO config on the Device
          # Farm host (defense-in-depth; the sink is also JSON-encoded).
          if ! printf '%s' "$TESTS" | grep -Eq '^[A-Za-z0-9_ |().*+-]+$'; then
            echo "::error::Invalid 'tests' filter '$TESTS'. Allowed: letters, digits, and _ space | ( ) . * + - (a mocha --grep on test NAMES, e.g. 'runAddonTest' or 'runFoo|runBar')."
            exit 1
          fi
          MANUAL_GROUPS=$(jq -nc --arg g "$TESTS" '[{name:"manual", grep:$g}]')
          echo "groups=$MANUAL_GROUPS" >> "$GITHUB_OUTPUT"

      - name: Upload to Device Farm
        id: upload
        uses: ./.github/actions/run-mobile-integration-tests/upload-to-devicefarm
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: 'packages/model-fit'
          app-path: ${{ steps.build.outputs.app-path }}
          app-type: ${{ steps.build.outputs.app-type }}
          app-name: ${{ steps.build.outputs.app-name }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          device-farm-project-arn: ${{ secrets.LLM_AWS_DEVICE_FARM_PROJECT_ARN }}
          test-groups: ${{ steps.manual_tests.outputs.groups }}
          enables-perf: 'false'

      - name: Schedule Device Farm test run
        id: schedule
        uses: ./.github/actions/run-mobile-integration-tests/schedule-test-run
        with:
          platform: ${{ matrix.platform }}
          device-farm-project-arn: ${{ secrets.LLM_AWS_DEVICE_FARM_PROJECT_ARN }}
          android-device-pool-arn: ${{ secrets.LLM_ANDROID_DEVICE_POOL_ARN }}
          ios-device-pool-arn: ${{ secrets.LLM_IOS_DEVICE_POOL_ARN }}
          app-upload-arn: ${{ steps.upload.outputs.app-upload-arn }}
          test-package-upload-arn: ${{ steps.upload.outputs.test-package-upload-arn }}
          test-specs: ${{ steps.upload.outputs.test-specs }}
          # workflow_dispatch: fan out across the chosen device(s).
          # workflow_call: unchanged default (single-pool) behaviour.
          scheduling-mode: ${{ inputs.platform != '' && 'manual-devices' || 'single-pool' }}
          device-models: ${{ inputs.platform != '' && (inputs.devices_custom != '' && inputs.devices_custom || (inputs.device != '(custom)' && inputs.device || '')) || '' }}
          device-model-operator: ${{ inputs.platform != '' && inputs.device_model_operator || '' }}
          # TEMPORARY — QVAC-24365. Restore the 120 default once devicefarm:StopRun
          # is granted. Until it is, CI cannot cancel a Device Farm run: the
          # preflight's stop-run is itself denied, so a run we abandon keeps a
          # device until jobTimeoutMinutes expires. model-fit's mobile suite is a
          # single test file, so 20 minutes is ample and caps the waste at 20
          # device-minutes instead of 120.
          job-timeout-minutes: "20"

      - name: Monitor Device Farm test run
        id: monitor
        uses: ./.github/actions/run-mobile-integration-tests/monitor-test-run
        with:
          run-arns: ${{ steps.schedule.outputs.run-arns }}
          run-count: ${{ steps.schedule.outputs.run-count }}
          test-specs: ${{ steps.upload.outputs.test-specs }}

      - name: Cancel Device Farm runs on workflow cancellation
        if: cancelled() && steps.schedule.outputs.run-arns != '' && steps.schedule.outputs.run-arns != '[]'
        uses: ./.github/actions/run-mobile-integration-tests/cancel-device-farm-runs
        with:
          run-arns: ${{ steps.schedule.outputs.run-arns }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

      - name: Collect and upload Device Farm logs
        if: always() && !cancelled()
        uses: ./.github/actions/run-mobile-integration-tests/collect-and-upload-logs
        with:
          platform: ${{ matrix.platform }}
          addon-npm-name: '@qvac/model-fit'
          enables-perf: 'false'
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          run-arns: ${{ steps.schedule.outputs.run-arns }}

      - name: Comment results on PR
        if: always() && !cancelled()
        uses: ./.github/actions/run-mobile-integration-tests/comment-on-pr
        with:
          addon-npm-name: '@qvac/model-fit'
          platform: ${{ matrix.platform }}
          test-result: ${{ steps.monitor.outputs.test-result }}
          test-total: ${{ steps.monitor.outputs.test-total }}
          test-passed: ${{ steps.monitor.outputs.test-passed }}
          test-failed: ${{ steps.monitor.outputs.test-failed }}
          test-skipped: ${{ steps.monitor.outputs.test-skipped }}
          user-test-passed: ${{ steps.monitor.outputs.user-test-passed }}
          user-test-failed: ${{ steps.monitor.outputs.user-test-failed }}


