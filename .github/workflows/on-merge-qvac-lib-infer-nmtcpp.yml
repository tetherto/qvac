name: On Merge to Main (Qvac-lib-infer-nmtcpp)

on:
  push:
    branches:
      - main
    paths:
      - "packages/qvac-lib-infer-nmtcpp/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish with"
        required: true
        default: "dev"
        type: choice
        options:
          - latest
          - dev

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  prebuild:
    uses: ./.github/workflows/prebuilds-qvac-lib-infer-nmtcpp.yml
    secrets: inherit
    with:
      tag: ${{ inputs.tag || 'latest' }}
      publish_target: "npm"

  model-conversion-test:
    needs: [prebuild]
    uses: ./.github/workflows/model-conversion-test-qvac-lib-infer-nmtcpp.yml
    secrets: inherit

  run-integration-tests:
    needs: [prebuild]
    uses: ./.github/workflows/integration-test-qvac-lib-infer-nmtcpp.yml
    secrets: inherit
