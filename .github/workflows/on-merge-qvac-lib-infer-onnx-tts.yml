name: On Merge Trigger (TTS)

on:
  push:
    branches:
      - main
      - release-*
    paths:
      - "packages/qvac-lib-infer-onnx-tts/**"

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  prebuild-main:
    if: github.ref_name == 'main'
    uses: ./.github/workflows/prebuilds-qvac-lib-infer-onnx-tts.yml
    secrets: inherit
    with:
      publish_target: "gpr"
      repository: ${{ github.repository }}
      ref: ${{ github.ref }}

  run-integration-tests:
    needs: prebuild-main
    if: github.ref_name == 'main'
    uses: ./.github/workflows/integration-test-qvac-lib-infer-onnx-tts.yml
    secrets: inherit
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.ref }}
      workdir: packages/qvac-lib-infer-onnx-tts

  mobile-integration-tests:
    needs: prebuild-main
    if: github.ref_name == 'main'
    uses: ./.github/workflows/integration-mobile-test-qvac-lib-infer-onnx-tts.yml
    secrets: inherit
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.ref }}
      workdir: packages/qvac-lib-infer-onnx-tts

  prebuild-release:
    if: startsWith(github.ref_name, 'release-')
    uses: ./.github/workflows/prebuilds-qvac-lib-infer-onnx-tts.yml
    secrets: inherit
    with:
      publish_target: "npm"
      repository: ${{ github.repository }}
      ref: ${{ github.ref }}
      workdir: packages/qvac-lib-infer-onnx-tts

  run-integration-tests-release:
    needs: prebuild-release
    if: startsWith(github.ref_name, 'release-')
    uses: ./.github/workflows/integration-test-qvac-lib-infer-onnx-tts.yml
    secrets: inherit
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.ref }}
      workdir: packages/qvac-lib-infer-onnx-tts

  mobile-integration-tests-release:
    needs: prebuild-release
    if: startsWith(github.ref_name, 'release-')
    uses: ./.github/workflows/integration-mobile-test-qvac-lib-infer-onnx-tts.yml
    secrets: inherit
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.ref }}
      workdir: packages/qvac-lib-infer-onnx-tts

  publish-release:
    needs: prebuild-release
    if: startsWith(github.ref_name, 'release-') && needs.prebuild-release.outputs.published_version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/create-github-release-qvac-lib-infer-onnx-tts.yml
    secrets: inherit
    with:
      published_version: ${{ needs.prebuild-release.outputs.published_version }}
      prev_sha: ${{ github.event.before }}
      workdir: packages/qvac-lib-infer-onnx-tts
