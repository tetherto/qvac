# Consolidates all 6 benchmark-performance-<pkg>.yml files.
name: "Benchmark Performance (nx)"

on:
  # TEMP (tmp-benchmark-leaf-test only): benchmark-nx cannot be workflow_dispatch'd
  # because the file is not on the default branch. This scoped pull_request trigger
  # lets a PR into feature-nx-workflow-consolidation fire it so nx-set-shas computes
  # affected == {llm-llamacpp, diffusion-cpp} from the 2 marker files. Revert before merge.
  pull_request:
    branches: [feature-nx-workflow-consolidation]
  workflow_dispatch:
    inputs:
      base-ref:
        required: false
        type: string
        default: "main"
      head-ref:
        required: false
        type: string
        default: "HEAD"
      repository:
        description: "Repository to benchmark"
        required: false
        type: string
      ref:
        description: "Git ref (branch/tag/SHA) to benchmark"
        required: false
        type: string
      run_desktop:
        description: "Run desktop (CPU/GPU) RTF benchmarks"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  matrix:
    name: Determine affected packages (nx project.json, transitive)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      any: ${{ steps.compute.outputs.any }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - id: compute
        uses: ./.github/actions/nx-project-matrix
        with:
          target: benchmark
          base-ref: ${{ inputs.base-ref }}
          head-ref: ${{ inputs.head-ref }}

  context:
    needs: matrix
    if: needs.matrix.outputs.any == 'true'
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.ctx.outputs.repository }}
      ref: ${{ steps.ctx.outputs.ref }}
    steps:
      - id: ctx
        shell: bash
        env:
          INPUT_REPO: ${{ inputs.repository }}
          INPUT_REF: ${{ inputs.ref }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          repo="${INPUT_REPO:-$REPO}"
          ref="${INPUT_REF:-$REF_NAME}"
          echo "repository=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  prebuild:
    needs: [matrix, context]
    if: needs.matrix.outputs.any == 'true'
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
      # prebuilds-nx's prebuild job requests actions: read (reuse action lists
      # prior runs); the calling job must grant at least that or startup fails.
      actions: read
    uses: ./.github/workflows/prebuilds-nx.yml
    secrets: inherit
    with:
      repository: ${{ needs.context.outputs.repository }}
      ref: ${{ needs.context.outputs.ref }}
      base-ref: ${{ inputs.base-ref }}
      head-ref: ${{ inputs.head-ref }}

  desktop-benchmarks:
    needs: [matrix, context, prebuild]
    # TEMP (tmp-benchmark-leaf-test): admit pull_request so the desktop leg runs without inputs.run_desktop. Revert before merge.
    if: needs.matrix.outputs.any == 'true' && !cancelled() && (inputs.run_desktop || github.event_name == 'pull_request') && needs.prebuild.result == 'success'
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/integration-test-nx.yml
    secrets: inherit
    with:
      repository: ${{ needs.context.outputs.repository }}
      ref: ${{ needs.context.outputs.ref }}
      base-ref: ${{ inputs.base-ref }}
      head-ref: ${{ inputs.head-ref }}

  # Mobile RTF benchmarks are NOT consolidated: they remain on the per-package
  # legacy benchmark-performance-<pkg>.yml (Device Farm), unchanged from main.
  # This leaf covers the desktop RTF matrix only.

  summarize:
    needs:
      - matrix
      - context
      - desktop-benchmarks
    if: always() && needs.matrix.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ needs.context.outputs.repository }}
          ref: ${{ needs.context.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all benchmark artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        continue-on-error: true
        with:
          path: artifacts/all

      - name: Generate consolidated benchmark reports (one per affected package)
        shell: bash
        env:
          AFFECTED_JSON: ${{ needs.matrix.outputs.matrix }}
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts

          echo "$AFFECTED_JSON" | jq -c '.[]' | while read -r pkg_json; do
            pkg=$(echo "$pkg_json" | jq -r '.package')
            script=$(echo "$pkg_json" | jq -r '.aggregateScript')
            manual=$(echo "$pkg_json" | jq -r '.manualDir')
            echo "=== Summarizing $pkg ==="
            if [ ! -f "$script" ]; then
              echo "::warning::$script not found for $pkg, skipping"
              continue
            fi
            node "$script" \
              --dir artifacts/all \
              --manual-dir "$manual" \
              --output "benchmark-artifacts/$pkg-performance-findings.md" \
              --output-json "benchmark-artifacts/$pkg-performance-findings.json" \
              || echo "::warning::aggregate script failed for $pkg (likely no matching artifacts this run)"
          done

      - name: Add combined summary
        shell: bash
        run: |
          echo "## Benchmark Performance Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for f in benchmark-artifacts/*-performance-findings.md; do
            if [ -f "$f" ]; then
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload consolidated benchmark reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: benchmark-performance-findings
          path: benchmark-artifacts/
          if-no-files-found: ignore
          retention-days: 30
