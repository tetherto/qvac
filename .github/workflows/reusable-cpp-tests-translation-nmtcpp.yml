name: C++ Tests with Coverage (NMTCPP)

on:
  # push and schedule warm this carve-out's vcpkg caches, which cpp-tests-nx.yml's
  # warm roster does not cover. The push paths are the cache key's inputs.
  push:
    branches: [main]
    paths:
      - 'packages/translation-nmtcpp/vcpkg.json'
      - 'packages/translation-nmtcpp/vcpkg-configuration.json'
      - 'packages/translation-nmtcpp/vcpkg/**'
      - '.github/workflows/reusable-cpp-tests-translation-nmtcpp.yml'
      - '.github/actions/vcpkg-*/**'
      - 'vcpkg-overlays/triplets/**'
      - 'vcpkg-overlays/toolchains/**'
  # Every 2 days, like cpp-tests-nx.yml, to stay inside the cache server's prune
  # window.
  schedule:
    - cron: "47 7 */2 * *"
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        type: string
        required: false
      repository:
        description: "Repository to checkout"
        type: string
        required: false
      fabric-overlay-artifact:
        description: >-
          Workflow-run artifact name for PR-built @qvac/fabric prebuilds. Empty
          skips the overlay (published npm baseline).
        type: string
        required: false
        default: ""

env:
  WORKDIR: packages/translation-nmtcpp

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  cpp-tests:
    needs: runner_names
    runs-on: ${{ needs.runner_names.outputs.linux_ubuntu2204_x64 }}
    environment: release
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    permissions:
      contents: read
      packages: read
      id-token: write
      pull-requests: write
    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Install NPM dependencies
        run: |
          npm install

      - name: Download fabric-prebuilds for overlay
        if: ${{ inputs.fabric-overlay-artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ inputs.fabric-overlay-artifact }}
          path: ${{ runner.temp }}/fabric-prebuilds

      - name: Overlay PR @qvac/fabric prebuilds
        if: ${{ inputs.fabric-overlay-artifact != '' }}
        uses: tetherto/qvac/.github/actions/overlay-local-fabric@6620d695d3a07cafe3931182e7844dde376a23f8
        with:
          workdir: ${{ env.WORKDIR }}
          prebuilds-root: ${{ runner.temp }}/fabric-prebuilds
          platform: linux
          arch: x64

      - name: Install bare tooling
        run: npm install -g --force bare bare-make@1.8.0

      - name: Configure vcpkg
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

      # The same two layers as cpp-tests-nx.yml: the host directory shared by
      # every runner instance on the box, and this package's keyed actions/cache
      # entry. Trusted runs on the default branch write both; PR legs only read.
      - name: Point vcpkg at its binary cache
        uses: ./.github/actions/vcpkg-binary-cache-dir
        with:
          workdir: ${{ env.WORKDIR }}
          trusted: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || github.event_name == 'schedule') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.ref == '' || inputs.ref == github.ref_name) && (inputs.repository == '' || inputs.repository == github.repository) }}

      - name: Cleanup vcpkg
        shell: bash
        run: |
          rm -rf $VCPKG_ROOT/buildtrees/*
          rm -rf $VCPKG_ROOT/packages/*

      - name: Fingerprint the toolchain
        uses: ./.github/actions/vcpkg-toolchain-fingerprint

      # Restore only. The save sits below the build, so a run that restored from
      # the host layer and compiled nothing cannot save an empty entry.
      - name: Get vcpkg cache (restore)
        id: vcpkg-cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          key: >-
            cpp-tests-translation-nmtcpp-v1-coverage-linux-x64-${{
              hashFiles(
                format('{0}/vcpkg.json', env.WORKDIR),
                format('{0}/vcpkg-configuration.json', env.WORKDIR),
                format('{0}/vcpkg/triplets/**', env.WORKDIR),
                format('{0}/vcpkg/ports/**', env.WORKDIR),
                'vcpkg-overlays/triplets/**',
                'vcpkg-overlays/toolchains/**'
              )
            }}-${{ env.TOOLCHAIN_FINGERPRINT }}
          path: ${{ env.WORKDIR }}/vcpkg/cache

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # 6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Download models from S3
        run: |
          echo "Creating models directory..."
          mkdir -p models/unit-test
          echo "Downloading models from S3..."
          aws s3 cp s3://${{ secrets.MODEL_S3_BUCKET }}/qvac_models_compiled/ggml/indictrans2/q4_0/ggml-indictrans2-en-indic-dist-200M/2026-01-01/ggml-indictrans2-en-indic-dist-200M-q4_0.bin models/unit-test/
          echo "Verifying downloaded models..."
          ls -lh models/unit-test/
          du -sh models/unit-test/*

      - name: Create config.cmake to disable Bergamot for tests
        run: |
          # Disable Bergamot for C++ tests because TranslationModel.cpp includes
          # bergamot function calls that can't be linked without bergamot-translator,
          # but linking bergamot-translator causes header conflicts with gtest.
          echo "set(USE_BERGAMOT OFF CACHE BOOL \"Disable Bergamot for tests\" FORCE)" > config.cmake
          cat config.cmake

      - name: Build C++ tests with coverage
        run: npm run coverage:cpp:build

      # Workspace -> host only, before the tests so a failing or hung test run
      # still warms the caches. See cpp-tests-nx.yml for why the host -> workspace
      # direction is absent.
      - name: Sync the host and workspace vcpkg caches
        if: >-
          env.VCPKG_CACHE_PERSISTENT == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || github.event_name == 'schedule') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.ref == '' || inputs.ref == github.ref_name) && (inputs.repository == '' || inputs.repository == github.repository)
        shell: bash
        working-directory: .
        run: |
          set +e
          host_dir=$(echo "${VCPKG_BINARY_SOURCES}" | tr ';' '\n' | grep '^files,' | head -n 1 | cut -d, -f2)
          ws_dir="${VCPKG_CACHE_DIR}"
          echo "sync: host=${host_dir} workspace=${ws_dir}"
          [ -n "${host_dir}" ] && [ -d "${host_dir}" ] || { echo "sync: no host dir"; exit 0; }
          [ "${host_dir}" = "${ws_dir}" ] && exit 0
          mkdir -p "${ws_dir}"
          umask 000

          sync_dir() {
            find "$1" -type f 2>/dev/null | while read -r f; do
              out="$2/${f#$1/}"
              [ -f "$out" ] && continue
              mkdir -p "$(dirname "$out")" 2>/dev/null
              tmp="$out.tmp.$$"
              cp "$f" "$tmp" 2>/dev/null && mv -f "$tmp" "$out" 2>/dev/null
              rm -f "$tmp" 2>/dev/null
            done
          }
          sync_dir "${ws_dir}" "${host_dir}"

          echo "sync: host=$(find "${host_dir}" -type f 2>/dev/null | wc -l) archives, workspace=$(find "${ws_dir}" -type f 2>/dev/null | wc -l)"
          exit 0

      # Only trusted events may write the shared cache (see .github/AGENTS.md),
      # and only when there are archives to write: hashFiles is empty for an
      # empty directory.
      - name: Save vcpkg cache (trusted contexts)
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || github.event_name == 'schedule') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.ref == '' || inputs.ref == github.ref_name) && (inputs.repository == '' || inputs.repository == github.repository) &&
          hashFiles(format('{0}/vcpkg/cache/**', env.WORKDIR)) != ''
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
        with:
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
          path: ${{ env.WORKDIR }}/vcpkg/cache

      - name: Run C++ tests
        id: cpp-tests
        run: |
          if [ ! -f "build/addon/tests/addon-test" ]; then
            echo "ERROR: Test executable not found at build/addon/tests/addon-test"
            exit 1
          fi

          # coverage:cpp:run applies fabric-boundary ASAN_OPTIONS via
          # scripts/run-cpp-tests.js (alloc_dealloc_mismatch=0:detect_leaks=0).
          # addon-test links ASan but dlopens the non-ASan, -static-libstdc++
          # @qvac/fabric prebuild; cross-module new/delete and fabric's
          # long-lived runtime allocations would otherwise abort after gtest
          # already passed. See addon/tests/CMakeLists.txt.
          npm run coverage:cpp:run

          # Verify that tests were actually executed
          if [ -f build/addon/tests/cpp-test-results.xml ]; then
            test_count=$(grep -c '<testcase' build/addon/tests/cpp-test-results.xml || echo "0")
            if [ "$test_count" -eq 0 ]; then
              echo "ERROR: No tests were executed! Test count: $test_count"
              exit 1
            fi
            echo "✓ Successfully executed $test_count test(s)"
          else
            echo "ERROR: Test results file not generated"
            exit 1
          fi

      - name: Generate Coverage Report
        if: always()
        run: |
          npm run coverage:cpp:report
          COVERAGE=$(grep 'TOTAL' coverage-summary.txt | awk '{print $10}')
          echo "LINE_COVERAGE_PERCENTAGE=${COVERAGE}" >> $GITHUB_ENV

      - name: Archive Coverage Results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: coverage-report
          path: |
            ${{ env.WORKDIR }}/build/addon/tests/coverage-html/
            ${{ env.WORKDIR }}/build/addon/tests/lcov.info
            ${{ env.WORKDIR }}/build/addon/tests/coverage-summary.txt
            ${{ env.WORKDIR }}/build/addon/tests/cpp-test-results.xml
          retention-days: 30

      - name: Comment Coverage on PR
        if: github.event_name == 'pull_request_target' && always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # 8.0.0
        with:
          script: |
            const fs = require('fs');
            const path = '${{ env.WORKDIR }}/build/addon/tests/coverage-summary.txt';
            if (fs.existsSync(path)) {
              const coverage = fs.readFileSync(path, 'utf8');
              const body = `## 🧪 C++ Test Coverage Report

              **Coverage:** ${process.env.LINE_COVERAGE_PERCENTAGE}

              <details>
              <summary>📊 Detailed Coverage</summary>

              \`\`\`
              ${coverage}
              \`\`\`

              </details>`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Coverage Summary
        if: always()
        run: |
          echo "## 🎯 C++ Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Coverage:** ${{ env.LINE_COVERAGE_PERCENTAGE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f build/addon/tests/coverage-summary.txt ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat build/addon/tests/coverage-summary.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

