# Real consolidation of the 15 prebuilds-<pkg>.yml files (all of which are
# thin wrappers around reusable-prebuilds.yml with only `with:` data
# differing - see QVAC-17422/#1806). Since every legacy file calls the SAME
# reusable workflow, GHA's static-`uses:` limit does not block a genuine
# matrix consolidation here (unlike cpp-tests/cpp-test-coverage, where each
# package calls a DIFFERENT reusable workflow file).
#
# The matrix is pre-filtered to nx-affected packages INSIDE the `affected`
# job (not via a job-level `if: contains(..., matrix.package)`) - a job that
# calls a reusable workflow (`uses:`) cannot reference the `matrix` context
# in its own `if:` condition (real GHA constraint, confirmed via `act`).
#
# Config table is real YAML (env.PREBUILDS_CONFIG), not a JSON string - `yq`
# (pre-installed on GitHub-hosted runners) converts it to JSON only at the
# point of use, so the config stays human-readable/editable.
#
# Additive only - none of the 15 legacy files touched or deleted.
name: "Prebuilds (nx)"

on:
  workflow_dispatch:
    inputs:
      base-ref:
        required: false
        type: string
        default: "main"
      head-ref:
        required: false
        type: string
        default: "HEAD"
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      repository:
        type: string
        required: false
        default: "tetherto/qvac"
      base-ref:
        required: false
        type: string
        default: "main"
      head-ref:
        required: false
        type: string
        default: "HEAD"

permissions:
  contents: read

jobs:
  matrix:
    name: Determine affected packages + build matrix (nx affected, transitive)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    env:
      # Real YAML, human-readable/editable - converted to JSON via `yq` at
      # the point of use, not hand-written as a JSON string.
      PREBUILDS_CONFIG: |
        - package: audiogen-ggml
          workdir: packages/audiogen-ggml
          artifact-name-prefix: audiogen-ggml-
          linux-extra-packages: pkg-config libx11-dev libxcb1-dev libxkbcommon-dev
          include-vulkan-sdk: true
        - package: bci-whispercpp
          workdir: packages/bci-whispercpp
          artifact-name-prefix: bci-whispercpp-
          linux-extra-packages: libopenblas-dev liblapack-dev libfftw3-dev
          mac-brew-packages: openblas lapack fftw
          include-vulkan-sdk: true
          extra-cmake-defines: -D WHISPER_USE_CUDA=OFF -D WHISPER_USE_OPENVINO=OFF
          platform-cmake-defines: |
            darwin: -D WHISPER_USE_METAL=ON
            ios: -D WHISPER_USE_METAL=ON
            linux: -D WHISPER_USE_METAL=OFF
            android: -D WHISPER_USE_METAL=OFF
            win32: -D WHISPER_USE_METAL=OFF
        - package: classification-ggml
          workdir: packages/classification-ggml
          artifact-name-prefix: classification-ggml-
          include-vulkan-sdk: true
        - package: diffusion-cpp
          workdir: packages/diffusion-cpp
          artifact-name-prefix: sd-cpp-
          include-vulkan-sdk: true
        - package: embed-llamacpp
          workdir: packages/embed-llamacpp
          artifact-name-prefix: llama-cpp-
          include-vulkan-sdk: true
        - package: fabric
          workdir: packages/fabric
          artifact-name-prefix: fabric-
          include-vulkan-sdk: true
        - package: llm-llamacpp
          workdir: packages/llm-llamacpp
          artifact-name-prefix: llama-cpp-
          include-vulkan-sdk: true
        - package: ocr-ggml
          workdir: packages/ocr-ggml
          artifact-name-prefix: ggml-ocr-
          include-vulkan-sdk: true
        - package: ocr-onnx
          workdir: packages/ocr-onnx
          artifact-name-prefix: onnx-ocr-
        - package: onnx
          workdir: packages/onnx
          artifact-name-prefix: onnx-
        - package: transcription-parakeet
          workdir: packages/transcription-parakeet
          artifact-name-prefix: parakeet-
          linux-extra-packages: pkg-config libx11-dev libxcb1-dev libxkbcommon-dev
          include-vulkan-sdk: true
        - package: transcription-whispercpp
          workdir: packages/transcription-whispercpp
          artifact-name-prefix: whisper-cpp-
          linux-extra-packages: libopenblas-dev liblapack-dev libfftw3-dev
          mac-brew-packages: openblas lapack fftw
          include-vulkan-sdk: true
          extra-cmake-defines: -D WHISPER_USE_CUDA=OFF -D WHISPER_USE_OPENVINO=OFF
          platform-cmake-defines: |
            darwin: -D WHISPER_USE_METAL=ON
            ios: -D WHISPER_USE_METAL=ON
            linux: -D WHISPER_USE_METAL=OFF
            android: -D WHISPER_USE_METAL=OFF
            win32: -D WHISPER_USE_METAL=OFF
        - package: translation-nmtcpp
          workdir: packages/translation-nmtcpp
          include-vulkan-sdk: true
        - package: tts-ggml
          workdir: packages/tts-ggml
          artifact-name-prefix: tts-ggml-
          linux-extra-packages: pkg-config libx11-dev libxcb1-dev libxkbcommon-dev
          include-vulkan-sdk: true
        - package: vla-ggml
          workdir: packages/vla-ggml
          artifact-name-prefix: vla-
          linux-extra-packages: libxi-dev libxtst-dev libxrandr-dev
          include-vulkan-sdk: true
          include-rocm: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - run: pnpm install --frozen-lockfile
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          AFFECTED=$(nx show projects --affected --base="${{ inputs.base-ref }}" --head="${{ inputs.head-ref }}" --json \
            | jq -c 'map(sub("^@qvac/"; ""))')
          echo "Affected (transitive): $AFFECTED"

          CONFIG_JSON=$(yq -o=json -I=0 e '.' <<< "$PREBUILDS_CONFIG")

          MATRIX=$(jq -c --argjson affected "$AFFECTED" '[.[] | select(.package as $p | $affected | index($p) != null)]' <<< "$CONFIG_JSON")
          echo "Matrix (config ∩ affected): $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$MATRIX" != "[]" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  prebuild:
    name: Prebuild (${{ matrix.package }})
    needs: matrix
    if: needs.matrix.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix || '[]') }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/reusable-prebuilds.yml
    with:
      workdir: ${{ matrix.workdir }}
      ref: ${{ inputs.ref }}
      repository: ${{ inputs.repository || 'tetherto/qvac' }}
      artifact-name-prefix: ${{ matrix.artifact-name-prefix }}
      linux-extra-packages: ${{ matrix.linux-extra-packages }}
      mac-brew-packages: ${{ matrix.mac-brew-packages }}
      include-vulkan-sdk: ${{ matrix.include-vulkan-sdk == true }}
      include-rocm: ${{ matrix.include-rocm == true }}
      extra-cmake-defines: ${{ matrix.extra-cmake-defines }}
      platform-cmake-defines: ${{ matrix.platform-cmake-defines }}
    secrets: inherit
