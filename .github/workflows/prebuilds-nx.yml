# Consolidates the 13 prebuilds-<pkg>.yml files.
name: "Prebuilds (nx)"

on:
  workflow_dispatch:
    inputs:
      base-ref:
        required: false
        type: string
        default: "main"
      head-ref:
        required: false
        type: string
        default: "HEAD"
      packages:
        description: "JSON array of explicit package short-names. When non-empty, skips nx-affected and builds exactly these packages."
        type: string
        required: false
        default: "[]"
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      repository:
        type: string
        required: false
        default: "tetherto/qvac"
      base-ref:
        required: false
        type: string
        default: "main"
      head-ref:
        required: false
        type: string
        default: "HEAD"
      packages:
        description: "JSON array of explicit package short-names. When non-empty, skips nx-affected and builds exactly these packages."
        type: string
        required: false
        default: "[]"

permissions:
  contents: read

jobs:
  matrix:
    name: Determine affected packages (nx project.json, transitive)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      any: ${{ steps.compute.outputs.any }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - id: compute
        uses: ./.github/actions/nx-project-matrix
        with:
          target: build
          base-ref: ${{ inputs.base-ref }}
          head-ref: ${{ inputs.head-ref }}
          packages: ${{ inputs.packages }}

  prebuild:
    name: Prebuild (${{ matrix.package }})
    needs: matrix
    if: needs.matrix.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix || '[]') }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/reusable-prebuilds.yml
    with:
      workdir: ${{ matrix.workdir }}
      ref: ${{ inputs.ref }}
      repository: ${{ inputs.repository || 'tetherto/qvac' }}
      artifact-name-prefix: ${{ matrix.artifactNamePrefix }}
      # This leaf can build several packages in ONE run (nx-affected), and every
      # selected package shares that run's artifact namespace. Namespace each
      # package's content and merge exactly once, at run level (below) — one
      # merge per package would collide on the shared `prebuilds` name, which
      # upload-artifact rejects outright.
      artifact-subdir: ${{ matrix.package }}
      merge-artifacts: false
      linux-extra-packages: ${{ matrix.linuxExtraPackages }}
      mac-brew-packages: ${{ matrix.macBrewPackages }}
      setup-python-on-windows: ${{ matrix.setupPythonOnWindows == true }}
      include-vulkan-sdk: ${{ matrix.includeVulkanSdk == true }}
      include-rocm: ${{ matrix.includeRocm == true }}
      extra-cmake-defines: ${{ matrix.extraCmakeDefines }}
      platform-cmake-defines: ${{ matrix.platformCmakeDefines }}
    secrets: inherit

  # One merge for the whole run, across every selected package. Content arrives
  # already namespaced as <package>/<platform>-<arch>/, so consumers pull their
  # own package's subtree out of the single well-known `prebuilds` bundle (see
  # the prebuild-artifact-materialize action, which also strips that level again
  # before anything is published).
  #
  # !cancelled() rather than the implicit success(): with fail-fast disabled, one
  # package's failed build must not deny the packages that did build their
  # bundle. A package absent from the merged bundle is precisely the per-package
  # signal consumers gate on.
  merge:
    name: Merge prebuild bundles
    needs: [matrix, prebuild]
    if: always() && !cancelled() && needs.matrix.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download every per-matrix prebuild artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          path: prebuilds
          merge-multiple: true

      - name: Upload merged bundle
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: prebuilds
          path: prebuilds
