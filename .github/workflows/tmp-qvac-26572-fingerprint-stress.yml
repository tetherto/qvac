name: tmp QVAC-26572 fingerprint stress (throwaway)

on:
  push:
    branches: [infra/QVAC-26572-win-vcpkg-fingerprint]
    paths: [.github/workflows/tmp-qvac-26572-fingerprint-stress.yml]

permissions:
  contents: read

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: qvac-win25-x64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Locate vcpkg
        shell: powershell
        run: |
          $root = $env:VCPKG_ROOT
          foreach ($c in @($root, 'C:/Users/actions-runner/vcpkg', $env:VCPKG_INSTALLATION_ROOT)) {
            if ($c -and (Test-Path (Join-Path $c 'vcpkg.exe'))) { $root = $c; break }
          }
          echo "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          Write-Output "runner=$env:RUNNER_NAME VCPKG_ROOT=$root"
          & (Join-Path $root 'vcpkg.exe') version
          exit 0

      - name: Old pattern, 100 iterations (report only)
        shell: powershell
        run: |
          $bin = Join-Path $env:VCPKG_ROOT 'vcpkg.exe'
          $bad = 0
          for ($i = 0; $i -lt 100; $i++) {
            $null = (& $bin version | Select-Object -First 1)
            if ($LASTEXITCODE -ne 0) { $bad++ }
          }
          Write-Output "OLD runner=$env:RUNNER_NAME nonzero=$bad/100"
          exit 0

      - name: New pattern, 100 iterations (must be 0)
        shell: powershell
        run: |
          $bin = Join-Path $env:VCPKG_ROOT 'vcpkg.exe'
          $bad = 0
          for ($i = 0; $i -lt 100; $i++) {
            $raw = & $bin version
            if ($LASTEXITCODE -ne 0) { $bad++ }
            $first = $raw | Select-Object -First 1
          }
          Write-Output "NEW runner=$env:RUNNER_NAME nonzero=$bad/100 first=$first"
          if ($bad -ne 0) { exit 1 }

      - name: Fingerprint (1)
        uses: ./.github/actions/vcpkg-toolchain-fingerprint
      - name: Fingerprint (2)
        uses: ./.github/actions/vcpkg-toolchain-fingerprint
      - name: Fingerprint (3)
        uses: ./.github/actions/vcpkg-toolchain-fingerprint
      - name: Report
        shell: bash
        run: echo "RESULT runner=${RUNNER_NAME} fingerprint=${TOOLCHAIN_FINGERPRINT}"
