name: "create-github-release (Qvac-lib-infer-whispercpp)"

on:
  workflow_call:
    inputs:
      published_version:
        description: "Version published in prebuild workflow"
        required: false
        type: string
      prev_sha:
        description: "Previous commit SHA for version comparison"
        required: false
        type: string
      workdir:
        description: 'Package working directory in monorepo (e.g., packages/qvac-lib-infer-whispercpp)'
        required: true
        default: 'packages/qvac-lib-infer-whispercpp'

permissions:
  contents: write

env:
  WORKDIR: ${{ inputs.workdir }}

jobs:
  publish-release:
    if: inputs.published_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: version
        uses: ./.github/actions/detect-version-bump
        with:
          current_version: ${{ inputs.published_version }}
          prev_sha: ${{ inputs.prev_sha }}

      - name: Verify Release Notes
        if: steps.version.outputs.bumped == 'true'
        run: |
          set -euo pipefail
          notes_path="${WORKDIR}/release-notes/v${{ steps.version.outputs.current }}.md"
          if [ ! -s "${notes_path}" ]; then
            echo "Missing or empty release notes: ${notes_path}"
            exit 1
          fi

      - name: Create GitHub Release
        if: steps.version.outputs.bumped == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.current }}
          name: QVAC Transcription Whisper Addon v${{ steps.version.outputs.current }}
          body_path: ${{ inputs.workdir }}/release-notes/v${{ steps.version.outputs.current }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
