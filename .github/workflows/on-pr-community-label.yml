name: Label community PRs

on:
  # Any PR checks run starting: main's copy labels the PR found by its head, checking out nothing. Labelling is
  # idempotent, so every push and label event may run it.
  workflow_run:
    workflows: [PR checks]
    types: [requested]

permissions:
  pull-requests: write

# Runs on the default branch's ref, so a save would land in its cache; this workflow uses none.
cache-mode: none

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  label-community-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply community-contribution label if external contributor
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        with:
          script: |
            const crypto = require('crypto');

            // The open PR whose head is the triggering commit, from the API; nothing else in the trigger is read.
            const { HEAD_SHA, HEAD_REPO, HEAD_BRANCH } = process.env;
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${HEAD_REPO.split('/')[0]}:${HEAD_BRANCH}`
            });
            const pr = pulls.length === 1 && pulls[0].head.sha === HEAD_SHA ? pulls[0] : null;
            if (!pr) return;
            if (pr.labels.some((l) => l.name === 'community-contribution')) return;

            // Skip bot authors — they are not external human contributors
            if (pr.user.type === 'Bot') return;

            // Build a JWT to authenticate as the GitHub App
            const now = Math.floor(Date.now() / 1000);
            const header = Buffer.from(JSON.stringify({ alg: 'RS256', typ: 'JWT' })).toString('base64url');
            const payload = Buffer.from(JSON.stringify({ iat: now - 60, exp: now + 540, iss: process.env.APP_ID })).toString('base64url');
            const sign = crypto.createSign('RSA-SHA256');
            sign.update(`${header}.${payload}`);
            const jwt = `${header}.${payload}.${sign.sign(process.env.APP_PRIVATE_KEY, 'base64url')}`;

            const ghHeaders = (token) => ({
              Authorization: `Bearer ${token}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
            });

            // Exchange the JWT for an installation access token scoped to this repo
            const installRes = await fetch(
              `https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}/installation`,
              { headers: ghHeaders(jwt) }
            );
            if (!installRes.ok) {
              core.setFailed(`Installation lookup failed: ${installRes.status}`);
              return;
            }
            const { id: installationId } = await installRes.json();

            const tokenRes = await fetch(
              `https://api.github.com/app/installations/${installationId}/access_tokens`,
              { method: 'POST', headers: ghHeaders(jwt) }
            );
            if (!tokenRes.ok) {
              core.setFailed(`Token exchange failed: ${tokenRes.status}`);
              return;
            }
            const { token } = await tokenRes.json();

            // Check org membership using the installation token (needs read:org scope)
            const author = pr.user.login;
            const memberRes = await fetch(
              `https://api.github.com/orgs/tetherto/members/${author}`,
              { headers: ghHeaders(token), redirect: 'manual' }
            );

            if (memberRes.status === 204) {
              // Confirmed org member — do nothing
              return;
            } else if (memberRes.status === 404) {
              // Confirmed non-member — apply label
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['community-contribution']
              });
            } else {
              core.setFailed(`Unexpected membership response: ${memberRes.status}`);
            }
