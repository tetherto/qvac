name: "create-github-release (Qvac-lib-infer-llamacpp-embed)"

on:
  workflow_call:
    inputs:
      published_version:
        description: "Version published in prebuild workflow"
        required: false
        type: string
      prev_sha:
        description: "Previous commit SHA for version comparison"
        required: false
        type: string
      workdir:
        description: "Working directory (monorepo package path)"
        required: false
        type: string
        default: "packages/qvac-lib-infer-llamacpp-embed"
      ref:
        description: "Git ref to checkout (optional)"
        required: false
        type: string
      repository:
        description: "Repository to checkout (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish-release:
    if: inputs.published_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.ref || github.ref }}
          repository: ${{ inputs.repository || github.repository }}

      - name: Detect version bump (monorepo-aware)
        id: version
        shell: bash
        env:
          WORKDIR: ${{ inputs.workdir }}
          CURRENT_VERSION: ${{ inputs.published_version }}
          PREV_SHA: ${{ inputs.prev_sha }}
        run: |
          set -euo pipefail

          if [ -z "${CURRENT_VERSION:-}" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve prev sha if not provided
          if [ -z "${PREV_SHA:-}" ]; then
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              PREV_SHA="$(git rev-parse HEAD^)"
            else
              echo "No previous commit found; cannot compare versions."
              echo "bumped=false" >> "$GITHUB_OUTPUT"
              echo "current=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          PKG_JSON="${WORKDIR}/package.json"
          if [ ! -f "$PKG_JSON" ]; then
            echo "ERROR: package.json not found at: $PKG_JSON"
            exit 1
          fi

          # Read previous version from prev_sha
          if git cat-file -e "${PREV_SHA}:${PKG_JSON}" 2>/dev/null; then
            PREV_VERSION="$(git show "${PREV_SHA}:${PKG_JSON}" | jq -r '.version')"
          else
            echo "WARN: ${PKG_JSON} not found at prev_sha=${PREV_SHA}; treating as not bumped."
            PREV_VERSION=""
          fi

          echo "prev=${PREV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

          if [ -n "$PREV_VERSION" ] && [ "$PREV_VERSION" != "$CURRENT_VERSION" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Release Notes (monorepo-aware)
        if: steps.version.outputs.bumped == 'true'
        shell: bash
        env:
          WORKDIR: ${{ inputs.workdir }}
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          set -euo pipefail
          notes_path="${WORKDIR}/release-notes/v${VERSION}.md"
          if [ ! -s "${notes_path}" ]; then
            echo "Missing or empty release notes: ${notes_path}"
            exit 1
          fi

      - name: Create GitHub Release (namespaced tag for monorepo)
        if: steps.version.outputs.bumped == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Avoid tag collisions across packages in a monorepo
          tag_name: ${{ format('{0}-v{1}', inputs.workdir && inputs.workdir != '' && fromJSON(format('["{0}"]', inputs.workdir))[0] || 'package', steps.version.outputs.current) }}
          name: ${{ format('{0} v{1}', inputs.workdir && inputs.workdir != '' && fromJSON(format('["{0}"]', inputs.workdir))[0] || 'Package', steps.version.outputs.current) }}
          body_path: ${{ format('{0}/release-notes/v{1}.md', inputs.workdir, steps.version.outputs.current) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize tag/name (bash fallback)
        if: steps.version.outputs.bumped == 'true' && always()
        shell: bash
        env:
          WORKDIR: ${{ inputs.workdir }}
          VERSION: ${{ steps.version.outputs.current }}
        run: |
          set -euo pipefail
          # This step is informational only—kept for visibility/debugging in logs.
          pkg="$(basename "$WORKDIR")"
          echo "Monorepo release tag would be: ${pkg}-v${VERSION}"
          echo "Release notes: ${WORKDIR}/release-notes/v${VERSION}.md"
