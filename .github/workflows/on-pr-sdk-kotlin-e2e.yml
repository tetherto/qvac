name: QVAC Tests (sdk-kotlin) - real worker

on:
  # Runs on test-e2e-smoke-labelled PRs, and on every PR into a release branch:
  # the release ships the Kotlin SDK.
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    paths:
      - 'packages/sdk-kotlin/**'
      - 'packages/inference/package.json'
      - 'packages/inference/src/schemas/**'
      - 'packages/sdk/src/worker/**'
      - 'packages/sdk/src/commands/**'
      - 'packages/sdk-e2e/catalog/conformance/**'
      - 'packages/sdk/contract/**'
      - 'packages/sdk/package.json'
      - '.github/workflows/on-pr-sdk-kotlin-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A label other than test-e2e-smoke gets a group of its own, so adding it
  # does not cancel a running check.
  group: >-
    kotlin-conformance-${{ github.event.pull_request.number || github.ref }}-${{
      (github.event.action == 'labeled' && github.event.label.name != 'test-e2e-smoke')
      && format('ignored-{0}', github.event.label.name) || 'run' }}
  cancel-in-progress: true

jobs:
  conformance:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.label.name == 'test-e2e-smoke'
      || (github.event.action != 'labeled'
          && (startsWith(github.event.pull_request.base.ref, 'release-')
              || contains(github.event.pull_request.labels.*.name, 'test-e2e-smoke')))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: packages/sdk-kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # 7.1.0
        with:
          python-version: '3.10'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # 6.2.0
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # 4.0.4
        with:
          # Drops `tools` from the action's default: the obsolete SDK Tools
          # package is gone from Google's repository and fails provisioning.
          packages: platform-tools
      - name: Build and install the in-repo @qvac/sdk and @qvac/inference
        run: ./scripts/install-workspace-sdk.sh
      # packages/sdk is built above, so Gradle skips its rebuild.
      - name: Run shared cross-client corpus
        run: >-
          ./gradlew --no-daemon :jvm-barekit:test --tests '*WorkerConformanceTest' --rerun-tasks
          -x :android-barekit:buildWorkspaceSdk
        env:
          QVAC_RUN_CONFORMANCE: '1'
      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 7.0.2
        with:
          name: kotlin-worker-conformance
          path: packages/sdk-kotlin/jvm-barekit/build/reports/tests/test
