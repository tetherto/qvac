name: Mobile Integration Tests (LLM)

# Migrated to .github/actions/run-mobile-integration-tests in QVAC-18168.
#
# LLM uses sharded scheduling: 2 Android groups + 10 iOS groups, each
# scheduled as its own Device Farm run against the LLM device pool. The
# group definitions live in the addon at test/mobile/test-groups.json so
# adding/moving a test changes the shard composition without editing this
# workflow.
#
# See docs/integration-test-workflow-refactor.md.

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        type: string
        required: false
      repository:
        description: "Repository to checkout"
        type: string
        required: false
      qvac_perf_runs:
        description: "Override QVAC_PERF_RUNS pushed to the device"
        type: string
        required: false
        default: ""
      qvac_perf_warmup_runs:
        description: "Override QVAC_PERF_WARMUP_RUNS pushed to the device"
        type: string
        required: false
        default: ""
      qvac_perf_only:
        description: "If true, restrict each test group to its perf-emitting tests only. Used by Benchmark Performance (LLM)."
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to test"
        type: string
        required: false
        default: main
      package:
        description: "Full NPM package spec to test"
        type: string
        required: true
        default: "@qvac/llm-llamacpp@latest"
      qvac_perf_runs:
        description: "Override QVAC_PERF_RUNS pushed to the device"
        type: string
        required: false
        default: ""
      qvac_perf_warmup_runs:
        description: "Override QVAC_PERF_WARMUP_RUNS pushed to the device"
        type: string
        required: false
        default: ""
      qvac_perf_only:
        description: "If true, restrict each test group to its perf-emitting tests only."
        type: boolean
        required: false
        default: false

jobs:
  build-and-test:
    name: Build ${{ matrix.platform }} and Run E2E Tests
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 120
    continue-on-error: true
    permissions:
      contents: read
      packages: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            runner: ai-run-linux
          - platform: iOS
            runner: macos-14

    steps:
      - name: Validate Dispatch Inputs
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.package
        run: |
          if [[ ! "${{ github.event.inputs.package }}" =~ ^@qvac/ ]]; then
            echo "::error::Invalid package scope. Only @qvac/* is allowed."
            exit 1
          fi

      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false

      - name: Checkout addon repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.PAT_TOKEN }}
          path: addon
          fetch-depth: 0

      - name: Validate mobile tests are up-to-date
        working-directory: addon/packages/llm-llamacpp
        run: npm run test:mobile:validate || true

      - name: Setup mobile test environment
        uses: ./.github/actions/run-mobile-integration-tests/setup
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: 'packages/llm-llamacpp'
          addon-npm-name: '@qvac/llm-llamacpp'
          prebuild-artifact-prefix: 'llama-cpp-'
          pat-token: ${{ secrets.PAT_TOKEN }}

      - name: Build mobile app
        id: build
        uses: ./.github/actions/run-mobile-integration-tests/build-mobile-app
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: 'packages/llm-llamacpp'
          addon-npm-name: '@qvac/llm-llamacpp'
          ios-build-cert-base64: ${{ secrets.TEST_APP_APPLE_DISTRIBUTION_CERTIFICATE }}
          ios-build-cert-password: ${{ secrets.APPLE_P12_PASSWORD }}
          ios-keychain-password: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          ios-provisioning-profile-base64: ${{ secrets.TEST_APP_APPLE_PROVISIONING_PROFILE }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

      # QVAC-17830: VLM image tests on Android take longer than the
      # generated 20-minute per-test ceiling in app.test.js. Bump the
      # generated `timeout: 1200000` / "20 minutes" wording up to 30
      # minutes so individual VLM tests don't trip Mocha first. The
      # WDIO Mocha ceiling on `upload-to-devicefarm` (mocha-timeout-ms)
      # is then bumped to 35 minutes so the runner outlives any single
      # test.
      #
      # Must run AFTER build-mobile-app (which generates app.test.js
      # via `npm run build`) and BEFORE upload-to-devicefarm (which
      # packs `e2e/tests/` into the Device Farm test package).
      - name: Extend Android mobile test timeouts
        if: matrix.platform == 'Android'
        working-directory: test-framework
        run: |
          node <<'NODE'
          const fs = require('fs')
          const testFile = 'e2e/tests/app.test.js'
          if (!fs.existsSync(testFile)) {
            throw new Error(`Expected generated ${testFile} not found — did build-mobile-app run?`)
          }
          let content = fs.readFileSync(testFile, 'utf8')

          const patched = content
            .replaceAll('timeout: 1200000,', 'timeout: 1800000,')
            .replaceAll('did not complete within 20 minutes', 'did not complete within 30 minutes')

          if (patched === content) {
            throw new Error('No generated Android test timeout blocks matched expected format')
          }

          fs.writeFileSync(testFile, patched)
          console.log('Extended generated Android test timeouts to 30 minutes')
          NODE

      # LLM ships with its own dedicated Device Farm project + iOS pool
      # (the LLM_* secrets), historically because LLM runs more often
      # than the others. Sharded mode is wired automatically: the composite
      # auto-detects test-groups.json under <addon-workdir>/test/mobile/.
      - name: Upload to Device Farm
        id: upload
        uses: ./.github/actions/run-mobile-integration-tests/upload-to-devicefarm
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: 'packages/llm-llamacpp'
          app-path: ${{ steps.build.outputs.app-path }}
          app-type: ${{ steps.build.outputs.app-type }}
          app-name: ${{ steps.build.outputs.app-name }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          device-farm-project-arn: ${{ secrets.LLM_AWS_DEVICE_FARM_PROJECT_ARN }}
          enables-perf: 'true'
          # QVAC-17830: 35-minute WDIO/Mocha ceiling so the runner
          # outlives the per-test 30-minute ceiling enforced above.
          mocha-timeout-ms: '2100000'
          qvac-perf-runs: ${{ inputs.qvac_perf_runs }}
          qvac-perf-warmup-runs: ${{ inputs.qvac_perf_warmup_runs }}
          qvac-perf-only: ${{ inputs.qvac_perf_only }}

      - name: Schedule Device Farm test runs
        id: schedule
        uses: ./.github/actions/run-mobile-integration-tests/schedule-test-run
        with:
          platform: ${{ matrix.platform }}
          device-farm-project-arn: ${{ secrets.LLM_AWS_DEVICE_FARM_PROJECT_ARN }}
          android-device-pool-arn: ${{ secrets.LLM_ANDROID_DEVICE_POOL_ARN }}
          ios-device-pool-arn: ${{ secrets.LLM_IOS_DEVICE_POOL_ARN }}
          app-upload-arn: ${{ steps.upload.outputs.app-upload-arn }}
          test-package-upload-arn: ${{ steps.upload.outputs.test-package-upload-arn }}
          test-specs: ${{ steps.upload.outputs.test-specs }}

      - name: Monitor Device Farm test runs
        id: monitor
        uses: ./.github/actions/run-mobile-integration-tests/monitor-test-run
        with:
          run-arns: ${{ steps.schedule.outputs.run-arns }}
          run-count: ${{ steps.schedule.outputs.run-count }}

      - name: Collect and upload Device Farm logs
        if: always()
        uses: ./.github/actions/run-mobile-integration-tests/collect-and-upload-logs
        with:
          platform: ${{ matrix.platform }}
          addon-npm-name: '@qvac/llm-llamacpp'
          enables-perf: 'true'
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          run-arns: ${{ steps.schedule.outputs.run-arns }}

      # QVAC-17830: VLM image tests are split across multiple
      # `image-*.test.js` files; each Device Farm group emits its own
      # `performance-report.json` payload. We pass --merge so
      # extract-from-log.js concatenates them per device. Output goes
      # to `perf-results/<platform>/...` so the artifact below mirrors
      # the layout that the umbrella `combine-perf-reports` job (in
      # on-pr-llm-llamacpp.yml) expects when running aggregate.js with
      # --addon-type vision.
      - name: Extract performance report from logs (LLM)
        if: always() && steps.schedule.outputs.run-count != '0' && steps.schedule.outputs.run-count != ''
        shell: bash
        run: |
          set +e

          ARTIFACT_DIR="devicefarm-logs/${{ matrix.platform }}"
          OUTPUT_DIR="${GITHUB_WORKSPACE}/perf-results/${{ matrix.platform }}"
          mkdir -p "$OUTPUT_DIR"

          if [ ! -d "$ARTIFACT_DIR" ]; then
            echo "No Device Farm logs directory at $ARTIFACT_DIR — skipping perf extraction"
            exit 0
          fi

          # Unzip Customer_Artifacts.zip inline so bare_console.log /
          # appium.log (which carry the PERF_REPORT markers) are
          # scannable by extract-from-log.js alongside the plain LOG
          # artifacts. collect-and-upload-logs already extracted one
          # bare_console.log per device into a flat console-logs/ tree,
          # but extract-from-log.js needs the per-device subdir layout
          # to bucket markers correctly.
          echo "=== Unzipping Customer_Artifacts.zip inline ==="
          find "$ARTIFACT_DIR" -name "*Customer_Artifacts.zip" -type f | while read -r zf; do
            base=$(basename "$zf" .zip)
            extract_to="$(dirname "$zf")/${base}_unpacked"
            rm -rf "$extract_to"
            mkdir -p "$extract_to"
            if unzip -qo "$zf" -d "$extract_to" 2>/dev/null; then
              echo "  Unpacked: $zf -> $extract_to"
            else
              echo "  WARNING: failed to unzip $zf"
            fi
          done

          echo "=== Searching for PERF_REPORT markers in $ARTIFACT_DIR ==="
          MARKER_HITS=$(grep -rl "PERF_REPORT_START" "$ARTIFACT_DIR" 2>/dev/null || true)
          if [ -z "$MARKER_HITS" ]; then
            echo "No PERF_REPORT markers found in Device Farm logs — nothing to extract"
            exit 0
          fi
          echo "Files containing markers:"
          echo "$MARKER_HITS"

          echo "=== Running extract-from-log.js ==="
          node "${GITHUB_WORKSPACE}/addon/scripts/perf-report/extract-from-log.js" \
            "$ARTIFACT_DIR" \
            "$OUTPUT_DIR/performance-report.json" \
            --run-number "${{ github.run_number }}" \
            --merge

          if find "$OUTPUT_DIR" -name "performance-report.json" -type f 2>/dev/null | head -1 | grep -q .; then
            echo "=== Generating aggregated HTML / MD report ==="
            node "${GITHUB_WORKSPACE}/addon/scripts/perf-report/aggregate.js" \
              --dir "$OUTPUT_DIR" \
              --output-html "$OUTPUT_DIR/performance-report.html" \
              --output-json "$OUTPUT_DIR/performance-summary.json" \
              --output "$OUTPUT_DIR/performance-report.md"
          else
            echo "extract-from-log.js did not produce a performance-report.json — nothing to aggregate"
          fi

      # Separate from the composite's perf-report artifact so the
      # umbrella combine-perf-reports job (which scans for
      # `perf-report-llamacpp-llm-*-<run_number>`) picks this one up.
      - name: Upload performance report (LLM)
        if: always() && steps.schedule.outputs.run-count != '0' && steps.schedule.outputs.run-count != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: perf-report-llamacpp-llm-${{ matrix.platform }}-${{ github.run_number }}
          path: |
            perf-results/${{ matrix.platform }}/**/performance-report.json
            perf-results/${{ matrix.platform }}/performance-report.html
            perf-results/${{ matrix.platform }}/performance-report.md
            perf-results/${{ matrix.platform }}/performance-summary.json
          retention-days: 90
          if-no-files-found: ignore

      - name: Comment results on PR
        if: always()
        uses: ./.github/actions/run-mobile-integration-tests/comment-on-pr
        with:
          addon-npm-name: '@qvac/llm-llamacpp'
          platform: ${{ matrix.platform }}
          test-result: ${{ steps.monitor.outputs.test-result }}
          test-total: ${{ steps.monitor.outputs.test-total }}
          test-passed: ${{ steps.monitor.outputs.test-passed }}
          test-failed: ${{ steps.monitor.outputs.test-failed }}
          test-skipped: ${{ steps.monitor.outputs.test-skipped }}
          user-test-passed: ${{ steps.monitor.outputs.user-test-passed }}
          user-test-failed: ${{ steps.monitor.outputs.user-test-failed }}
