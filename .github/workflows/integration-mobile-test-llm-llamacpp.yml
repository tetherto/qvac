name: Mobile Integration Tests (LLM)

# Migrated to .github/actions/run-mobile-integration-tests in QVAC-18168.
#
# LLM uses sharded scheduling: 8 Android groups + 15 iOS groups, each
# scheduled as its own Device Farm run against the LLM device pool. The
# group definitions live in the addon at test/mobile/test-groups.json so
# adding/moving a test changes the shard composition without editing this
# workflow.
#
# See docs/integration-test-workflow-refactor.md.

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        type: string
        required: false
      repository:
        description: "Repository to checkout"
        type: string
        required: false
      qvac_perf_runs:
        description: "Override QVAC_PERF_RUNS pushed to the device"
        type: string
        required: false
        default: ""
      qvac_perf_warmup_runs:
        description: "Override QVAC_PERF_WARMUP_RUNS pushed to the device"
        type: string
        required: false
        default: ""
      qvac_perf_only:
        description: "If true, restrict each test group to its perf-emitting tests only. Used by Benchmark Performance (LLM)."
        type: boolean
        required: false
        default: false
      test_groups:
        description: "JSON array of {name,grep} overrides. When set, replaces auto-detected test-groups.json shards."
        type: string
        required: false
        default: ""
      job_timeout_minutes:
        description: "Override the build-and-test job timeout (minutes). Default 150. Raised by Benchmark Performance (LLM) where the sharded matrix needs more headroom."
        type: number
        required: false
        default: 150
      artifact_suffix:
        description: "Optional suffix appended to the perf-report artifact-name stem (before the platform segment) so multiple invocations in one run (e.g. Benchmark batches) don't collide. Default empty keeps the existing name."
        type: string
        required: false
        default: ""
      pre_build_script:
        description: "Optional node script (path under packages/llm-llamacpp) run before the mobile build to bootstrap a benchmark into the framework (stage files + regenerate the test list). Default '' = no-op."
        type: string
        required: false
        default: ""
      fixture_images_uri:
        description: "Optional object-store URI (e.g. s3://…) the bootstrap syncs fixture assets from before staging. Caller supplies the URI; default '' = skip."
        type: string
        required: false
        default: ""
      platforms:
        description: "Optional CSV-ish platform filter: 'Android' or 'iOS' to run a single platform. Default '' = both (unchanged for existing callers)."
        type: string
        required: false
        default: ""
      device_model:
        description: "Optional Device Farm MODEL filter (e.g. 'S25 Ultra', 'iPhone 17'). When set, the single test spec is scheduled on exactly ONE matching device (single-device mode) instead of the dual-flagship default. Default '' = unchanged for existing callers."
        type: string
        required: false
        default: ""
      device_manufacturer:
        description: "Optional Device Farm MANUFACTURER filter used with device_model (e.g. 'Samsung', 'Apple'). Default '' = any."
        type: string
        required: false
        default: ""
      device_model_operator:
        description: "Optional MODEL filter operator for device_model: CONTAINS (any model containing the value; Device Farm picks by availability) or EQUALS (exact model only — variants like 'Pixel 9 Pro XL' for 'Pixel 9' can never be substituted). Default '' = CONTAINS, unchanged for existing callers."
        type: string
        required: false
        default: ""
      device_env:
        description: "Optional semicolon-separated KEY=VALUE pairs pushed to the on-device test app (qvacPerfConfig.txt channel; each key is os.setEnv()'d before the tests load). Default '' = nothing extra."
        type: string
        required: false
        default: ""
      mocha_timeout_ms:
        description: "Override the WDIO/Mocha per-test timeout in ms (mochaOpts.timeout). Default '' keeps the established 2100000 (35 min) — unchanged for existing callers."
        type: string
        required: false
        default: ""
      per_test_timeout_minutes:
        description: "Override the generated-spec per-test timeout in minutes on ALL platforms (Android + iOS). Default '' keeps the established per-platform defaults (Android 30 / iOS 20) — unchanged for existing callers."
        type: string
        required: false
        default: ""
      addon_npm_version:
        description: "Bundle a specific published addon version from npm instead of the freshly-built prebuild artifact (skips the artifact download). Used to run a pinned BASELINE build on-device. Default '' keeps the established artifact-first behaviour (test the build produced in this run) — unchanged for existing callers."
        type: string
        required: false
        default: ""
    # Additive outputs (QVAC weekend job): surface the monitor verdict so a
    # caller can read real pass/fail past the job's `continue-on-error: true`.
    # When a caller runs both platforms in one call the matrix overwrites these
    # nondeterministically — single-platform callers (the weekend workflow uses
    # `platforms:` to run one platform per call) get a well-defined value.
    outputs:
      test-result:
        description: "Aggregate Device Farm verdict ('passed'/'failed')."
        value: ${{ jobs.build-and-test.outputs.test-result }}
      test-total:
        description: "Total test cases executed."
        value: ${{ jobs.build-and-test.outputs.test-total }}
      test-passed:
        description: "Test cases passed."
        value: ${{ jobs.build-and-test.outputs.test-passed }}
      test-failed:
        description: "Test cases failed."
        value: ${{ jobs.build-and-test.outputs.test-failed }}
  # Manual on-demand path. A dispatched run targets ONE platform and the
  # device(s) chosen below. LLM is sharded, so leaving 'tests' empty runs the
  # FULL shard set pinned to the chosen device(s) (many runs) — set a 'tests'
  # filter to run only what you need. The workflow_call path (benchmarks /
  # weekend / on-merge) is unchanged.
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to run on (a manual run targets one platform)."
        type: choice
        required: true
        options: [Android, iOS]
        default: Android
      device:
        description: "Device from the common pool. Pick '(custom)' to type your own in 'devices_custom'. Valid names + how to find them: docs/ci/MOBILE-ON-DEMAND.md."
        type: choice
        required: false
        options:
          - "(custom)"
          - "Google Pixel 9"
          - "Google Pixel 8"
          - "Samsung Galaxy S25 Ultra"
          - "Apple iPhone 17"
          - "Apple iPhone 16 Pro"
          - "Apple iPhone 15"
        default: "(custom)"
      devices_custom:
        description: "Comma-separated device model(s), e.g. 'Pixel 9, Pixel 8'. Overrides the dropdown; use for new/uncommon devices or several at once. Must match a Device Farm model (list + how to check: docs/ci/MOBILE-ON-DEMAND.md)."
        type: string
        required: false
        default: ""
      device_model_operator:
        description: "Model match: EQUALS (exact fleet model only — default; dropdown values are exact fleet names) or CONTAINS (any model containing the value; use for shorthand like 'Pixel 9'). EQUALS avoids billing a different/slower variant."
        type: choice
        required: false
        options: [EQUALS, CONTAINS]
        default: EQUALS
      tests:
        description: "Optional test filter: a mocha --grep regex matched by test NAME, not file name (e.g. 'runLlmSpeedTest'; combine several with '|'). Empty = full sharded suite (many runs). Where to find valid names: docs/ci/MOBILE-ON-DEMAND.md."
        type: string
        required: false
        default: ""
      ref:
        description: "Git ref (branch/tag/SHA) to test. Leave blank to use the branch you dispatch from."
        type: string
        required: false
        default: ""
      package:
        description: "Full NPM package spec to test. Leave EMPTY (default) to test this branch's native prebuild artifact; set @qvac/llm-llamacpp@<ver> (published) or @tetherto/llm-llamacpp@<dev> (GPR) to force-install a specific build."
        type: string
        required: false
        default: ""
      qvac_perf_runs:
        description: "Override QVAC_PERF_RUNS pushed to the device"
        type: string
        required: false
        default: ""
      qvac_perf_warmup_runs:
        description: "Override QVAC_PERF_WARMUP_RUNS pushed to the device"
        type: string
        required: false
        default: ""
      qvac_perf_only:
        description: "If true, restrict each test group to its perf-emitting tests only."
        type: boolean
        required: false
        default: false

concurrency:
  # workflow_dispatch: at most one manual mobile run per (workflow, branch) at a
  # time — a fresh dispatch cancels the in-flight one so a re-run never stacks a
  # second Device Farm run. Different branches map to different groups, so the
  # same addon can still be tested on 2-3 branches in parallel.
  #
  # workflow_call NEVER cancels. It is keyed per run AND per artifact_suffix
  # because benchmark-vlm-model-comparison fans several parallel legs from ONE
  # run (all sharing run_id, since github.* resolves to the CALLER under
  # workflow_call); each leg passes a distinct artifact_suffix, so this keeps the
  # legs in separate groups instead of serialising or cancelling them.
  group: ${{ inputs.platform != '' && format('mobile-dispatch-{0}-{1}', github.workflow, github.ref) || format('mobile-call-{0}-{1}', github.run_id, inputs.artifact_suffix) }}
  cancel-in-progress: ${{ inputs.platform != '' }}

jobs:
  # Manual (workflow_dispatch) runs must name a device that exists on Device
  # Farm. This gate fails fast BEFORE seed-models/build or any Device Farm run,
  # so a typo or an empty selection costs nothing. Skipped for workflow_call.
  validate-devices:
    name: Validate device selection
    if: inputs.platform != ''
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false
      # Validate the tests filter + shard fan-out against test-groups.json from
      # the SAME ref the build executes (inputs.ref || github.sha), not the
      # workflow ref, so a branch that renames/adds runners or shards can't pass
      # stale validation. Data only — nothing here is executed; the composite
      # action stays on the trusted workflow ref checked out above.
      - name: Checkout validation data (matches the built ref)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            packages/llm-llamacpp/test/mobile/test-groups.json
          sparse-checkout-cone-mode: false
          path: validation-data
          persist-credentials: false
      - name: Validate requested devices
        uses: ./.github/actions/run-mobile-integration-tests/validate-devices
        with:
          platform: ${{ inputs.platform }}
          devices: ${{ inputs.devices_custom != '' && inputs.devices_custom || (inputs.device != '(custom)' && inputs.device || '') }}
          device-model-operator: ${{ inputs.device_model_operator }}
          tests: ${{ inputs.tests }}
          test-groups-path: validation-data/packages/llm-llamacpp/test/mobile/test-groups.json
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

  # One non-matrixed writer mirrors the mobile model set into the US bucket, so
  # the two platform legs below never download/upload the same multi-GB objects
  # concurrently. Each leg then only presigns (fast, no S3 write) for itself.
  seed-models:
    name: Seed LLM models (US bucket)
    # Gated on validate-devices so a bad/empty manual device selection fails
    # fast BEFORE this up-to-120-min seed runs (the ticket's whole point is not
    # to spend on a doomed run). Skipped on workflow_call — validate-devices is
    # itself skipped there, and the `skipped` branch keeps this job running.
    needs: [validate-devices]
    if: ${{ !cancelled() && (needs.validate-devices.result == 'success' || needs.validate-devices.result == 'skipped') }}
    runs-on: qvac-ubuntu2204-x64
    environment: release
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false

      - name: Checkout addon repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.PAT_TOKEN }}
          path: addon
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Compute LLM mobile model set
        id: mobileset
        working-directory: addon/packages/llm-llamacpp
        run: |
          NAMES=$(node -e "const {resolvePinnedManifest}=require('./scripts/generate-prestage-block.js');const fs=require('fs');const mob=JSON.parse(fs.readFileSync('test/mobile/model-manifest.json','utf8'));const integ=JSON.parse(fs.readFileSync('test/integration/models.manifest.json','utf8'));const r=resolvePinnedManifest(mob,integ);const s=new Set();for(const a of Object.values(r))for(const e of a)s.add(e.name);process.stdout.write([...s].join(','))")
          echo "names=$NAMES" >> "$GITHUB_OUTPUT"
          echo "LLM mobile model set: $NAMES"

      - name: Seed LLM models into US bucket (mirror-only)
        uses: ./.github/actions/run-mobile-integration-tests/seed-and-presign-models
        with:
          manifest-path: addon/packages/llm-llamacpp/test/integration/models.manifest.json
          s3-prefix: qvac_models_compiled/mobile-pilot/llm/
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          hf-token: ${{ secrets.HF_TOKEN }}
          model-names: ${{ steps.mobileset.outputs.names }}
          mode: seed

  build-and-test:
    name: Build ${{ matrix.platform }} and Run E2E Tests
    # validate-devices is skipped on workflow_call (its `skipped` result keeps
    # this job running once seed-models succeeds); on a manual run a bad/empty
    # device selection blocks the build before it starts.
    needs: [seed-models, validate-devices]
    if: ${{ !cancelled() && needs.seed-models.result == 'success' && (needs.validate-devices.result == 'success' || needs.validate-devices.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: ${{ inputs.job_timeout_minutes || 150 }}
    continue-on-error: true
    # Surfaced as workflow_call outputs above so schedule-driven callers can
    # report a verdict (the job itself never fails — continue-on-error).
    outputs:
      test-result: ${{ steps.monitor.outputs.test-result }}
      test-total: ${{ steps.monitor.outputs.test-total }}
      test-passed: ${{ steps.monitor.outputs.test-passed }}
      test-failed: ${{ steps.monitor.outputs.test-failed }}
    permissions:
      contents: read
      packages: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # workflow_dispatch (inputs.platform set) runs the ONE chosen platform.
        # workflow_call is unchanged: platforms='' runs both, platforms='Android'
        # or 'iOS' runs a single one.
        include: ${{ fromJSON(inputs.platform != '' && (inputs.platform == 'iOS' && '[{"platform":"iOS","os":"macos-14","runner":"macos-14"}]' || '[{"platform":"Android","os":"ubuntu-22.04","runner":"qvac-ubuntu2204-x64"}]') || inputs.platforms == 'Android' && '[{"platform":"Android","os":"ubuntu-22.04","runner":"qvac-ubuntu2204-x64"}]' || inputs.platforms == 'iOS' && '[{"platform":"iOS","os":"macos-14","runner":"macos-14"}]' || '[{"platform":"Android","os":"ubuntu-22.04","runner":"qvac-ubuntu2204-x64"},{"platform":"iOS","os":"macos-14","runner":"macos-14"}]') }}

    steps:
      - name: Validate Dispatch Inputs
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.package
        env:
          PKG: ${{ github.event.inputs.package }}
        run: |
          if [[ ! "$PKG" =~ ^@qvac/|^@tetherto/ ]]; then
            echo "::error::Invalid package scope. Only @qvac/* or @tetherto/* is allowed."
            exit 1
          fi

      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false

      - name: Checkout addon repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: addon
          fetch-depth: 0

      # node/npm is job-managed on the self-hosted runners (installed per runner
      # user via setup-node, not globally), so npm is only on PATH after this
      # step runs. The validate step below invokes npm, so it must be set up
      # first — matches the lts/* used by the setup composite action.
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      # Hard-fails on purpose. This covers both the generated mobile test list
      # and test/mobile/model-manifest.json — an incomplete pre-stage map does
      # not fail loudly on-device, it silently sends the phone to
      # huggingface.co mid-test, which is the flakiness the pre-stage removes.
      - name: Validate mobile tests are up-to-date
        working-directory: addon/packages/llm-llamacpp
        run: npm run test:mobile:validate

      - name: Setup mobile test environment
        uses: ./.github/actions/run-mobile-integration-tests/setup
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: 'packages/llm-llamacpp'
          addon-npm-name: '@qvac/llm-llamacpp'
          # Default (addon_npm_version unset): artifact-first — bundle the prebuild built
          # in THIS run (the established behaviour for PR/merge mobile tests). When a
          # pinned version is requested (baseline leg), skip the artifact so it can't pick
          # up a candidate prebuild from the same run, and pull that exact version from npm.
          prebuild-artifact-prefix: ${{ inputs.addon_npm_version == '' && 'llama-cpp-' || '' }}
          # Baseline leg (pinned version): force the npm prebuild and ignore ALL
          # CI artifacts. Without this the merged `prebuilds` artifact (built from
          # the candidate in this same run) is pulled in when the per-matrix
          # artifact is absent, so the baseline session would silently run the
          # candidate binary. See run-mobile-integration-tests/setup.
          # Manual dispatch (inputs.platform set): default (empty `package`) tests
          # this branch's native prebuild; @qvac/llm-llamacpp@<ver> = published, @tetherto/llm-llamacpp@<dev>
          # = this branch's GPR build). workflow_call keeps addon_npm_version/artifact-first.
          force-npm-prebuild: ${{ ((inputs.platform != '' && inputs.package != '') || inputs.addon_npm_version != '') && 'true' || 'false' }}
          package-version: ${{ inputs.platform != '' && inputs.package || inputs.addon_npm_version }}
          pat-token: ${{ secrets.GITHUB_TOKEN }}

      # The mobile perf benchmark shards (benchmark-perf-*.test.js) are not
      # committed — they are generated from test/integration/_benchmark-matrix.js.
      # Regenerate them after setup (which provisions Node) but before the
      # bundle is built, so the Device Farm app contains them, then hard-fail if
      # any are still missing. This makes it impossible to build the bundle
      # without the shards present. (Runs for every LLM mobile run; for
      # non-benchmark runs the generated shards are simply skipped, like any
      # other mobile-only test.)
      - name: Generate benchmark shards
        working-directory: addon/packages/llm-llamacpp
        run: |
          npm run generate:benchmark-shards
          node scripts/generate-benchmark-shards.js --assert-shards

      # ── Benchmark bootstrap (additive, opt-in via pre_build_script) ──────────
      # When a caller passes pre_build_script (only the VLM benchmark does), run the
      # bootstrap: optionally pull fixture assets from the caller-supplied object-store
      # URI (fixture_images_uri — the literal URI lives in the caller, not here), copy
      # the test/harness/config/fixture into test/integration + assets into testAssets,
      # then regenerate the mobile test list so the new test is bundled. All in the
      # ephemeral checkout — nothing committed. Other callers leave these inputs '' → no-op.
      - name: Configure AWS credentials (benchmark assets)
        if: inputs.fixture_images_uri != ''
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # 6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2
      - name: Bootstrap benchmark into the mobile framework (pre-build)
        if: inputs.pre_build_script != ''
        working-directory: addon/packages/llm-llamacpp
        env:
          FIXTURE_IMAGES_URI: ${{ inputs.fixture_images_uri }}
        run: |
          if [ -n "$FIXTURE_IMAGES_URI" ]; then
            aws s3 sync "$FIXTURE_IMAGES_URI" benchmarks/vlm-benchmark/fixture/
          fi
          node "${{ inputs.pre_build_script }}"
          # the test-list generator runs under `bare` and imports bare-fs/bare-path,
          # so the addon's JS deps must be present (skip native build via --ignore-scripts).
          npm install --no-audit --no-fund --ignore-scripts
          npm install -g bare 2>/dev/null || true
          npm run test:mobile:generate
          echo "bootstrapped: staged files + regenerated mobile test list"

      # Compute the models this addon stages on mobile (mobile manifest +
      # benchmark matrix) so the seed skips desktop-only giants in the manifest.
      - name: Compute LLM mobile model set
        id: mobileset
        working-directory: addon/packages/llm-llamacpp
        run: |
          NAMES=$(node -e "const {resolvePinnedManifest}=require('./scripts/generate-prestage-block.js');const fs=require('fs');const mob=JSON.parse(fs.readFileSync('test/mobile/model-manifest.json','utf8'));const integ=JSON.parse(fs.readFileSync('test/integration/models.manifest.json','utf8'));const r=resolvePinnedManifest(mob,integ);const s=new Set();for(const a of Object.values(r))for(const e of a)s.add(e.name);process.stdout.write([...s].join(','))")
          echo "names=$NAMES" >> "$GITHUB_OUTPUT"
          echo "LLM mobile model set: $NAMES"

      # Presign the already-seeded (by the seed-models job) US-bucket objects into
      # a map the prestage steps below consume. Presign-only: no S3 write, fresh
      # URLs minted per leg right before this leg builds and runs.
      - name: Presign LLM models (US bucket)
        uses: ./.github/actions/run-mobile-integration-tests/seed-and-presign-models
        with:
          manifest-path: addon/packages/llm-llamacpp/test/integration/models.manifest.json
          s3-prefix: qvac_models_compiled/mobile-pilot/llm/
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          output-map: ${{ runner.temp }}/llm-url-map.json
          model-names: ${{ steps.mobileset.outputs.names }}
          mode: presign

      - name: Build mobile app
        id: build
        uses: ./.github/actions/run-mobile-integration-tests/build-mobile-app
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: 'packages/llm-llamacpp'
          addon-npm-name: '@qvac/llm-llamacpp'
          ios-build-cert-base64: ${{ secrets.TEST_APP_APPLE_DISTRIBUTION_CERTIFICATE }}
          ios-build-cert-password: ${{ secrets.APPLE_P12_PASSWORD }}
          ios-keychain-password: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          ios-provisioning-profile-base64: ${{ secrets.TEST_APP_APPLE_PROVISIONING_PROFILE }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          # QVAC-17830: VLM image tests on Android exceed the 20-minute
          # default per-test ceiling. Paired with mocha-timeout-ms on
          # upload-to-devicefarm below (35 min) so the WDIO/Mocha
          # session outlives any single test. This Android-only 30-min
          # default is preserved for every caller (iOS keeps its 20 min).
          android-per-test-timeout-minutes: '30'
          # Platform-neutral override (Android + iOS) — set only by callers
          # that need iOS too (the VLM benchmark forwards per_test_timeout_minutes).
          # Empty keeps the per-platform defaults above; when set it wins.
          per-test-timeout-minutes: ${{ inputs.per_test_timeout_minutes }}

      # Generate the per-shard model pre-stage script. The Device Farm host has
      # reliable network; it downloads exactly the models the shard needs and
      # pushes them onto the device so the phone never fetches from
      # huggingface.co. Block is derived from model-manifest.json.
      #   Android → adb push into /data/local/tmp/prestaged-models
      #   iOS     → pymobiledevice3 apps push into the app Documents/ container
      - name: Generate model pre-stage commands (Android)
        id: prestage
        if: matrix.platform == 'Android'
        working-directory: addon/packages/llm-llamacpp
        # Repoint staged models to the US-bucket presigned URLs from the seed step.
        env:
          PRESTAGE_URL_MAP: ${{ runner.temp }}/llm-url-map.json
        run: |
          node scripts/generate-prestage-block.js android > "$RUNNER_TEMP/prestage-block.txt"
          {
            echo "block<<PRESTAGE_EOF"
            cat "$RUNNER_TEMP/prestage-block.txt"
            echo "PRESTAGE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate model pre-stage commands (iOS)
        id: ios_prestage
        if: matrix.platform == 'iOS'
        working-directory: addon/packages/llm-llamacpp
        # Repoint staged models to the US-bucket presigned URLs from the seed step.
        env:
          PRESTAGE_URL_MAP: ${{ runner.temp }}/llm-url-map.json
        run: |
          node scripts/generate-prestage-block.js ios > "$RUNNER_TEMP/ios-prestage-block.txt"
          {
            echo "block<<PRESTAGE_EOF"
            cat "$RUNNER_TEMP/ios-prestage-block.txt"
            echo "PRESTAGE_EOF"
          } >> "$GITHUB_OUTPUT"

      # On a manual run with a test filter, collapse the sharded suite to a single
      # grepped spec so only the matching tests run. Empty filter / workflow_call
      # keeps the auto-detected shards.
      - name: Resolve manual test filter
        id: manual_tests
        if: inputs.platform != '' && inputs.tests != ''
        shell: bash
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          # Reject anything but mocha-safe grep characters so a manual `tests`
          # value cannot break out of the generated WDIO config on the Device
          # Farm host (defense-in-depth; the sink is also JSON-encoded).
          if ! printf '%s' "$TESTS" | grep -Eq '^[A-Za-z0-9_ |().*+-]+$'; then
            echo "::error::Invalid 'tests' filter '$TESTS'. Allowed: letters, digits, and _ space | ( ) . * + - (a mocha --grep on test NAMES, e.g. 'runAddonTest' or 'runFoo|runBar')."
            exit 1
          fi
          MANUAL_GROUPS=$(jq -nc --arg g "$TESTS" '[{name:"manual", grep:$g}]')
          echo "groups=$MANUAL_GROUPS" >> "$GITHUB_OUTPUT"

      # LLM ships with its own dedicated Device Farm project + iOS pool
      # (the LLM_* secrets), historically because LLM runs more often
      # than the others. Sharded mode is wired automatically: the composite
      # auto-detects test-groups.json under <addon-workdir>/test/mobile/.
      - name: Upload to Device Farm
        id: upload
        uses: ./.github/actions/run-mobile-integration-tests/upload-to-devicefarm
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: 'packages/llm-llamacpp'
          app-path: ${{ steps.build.outputs.app-path }}
          app-type: ${{ steps.build.outputs.app-type }}
          app-name: ${{ steps.build.outputs.app-name }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          device-farm-project-arn: ${{ secrets.LLM_AWS_DEVICE_FARM_PROJECT_ARN }}
          enables-perf: 'true'
          # QVAC-17830: 35-minute WDIO/Mocha ceiling so the runner
          # outlives the per-test 30-minute ceiling enforced above.
          # Caller-overridable (mocha_timeout_ms); '' keeps 2100000.
          mocha-timeout-ms: ${{ inputs.mocha_timeout_ms != '' && inputs.mocha_timeout_ms || '2100000' }}
          qvac-perf-runs: ${{ inputs.qvac_perf_runs }}
          qvac-perf-warmup-runs: ${{ inputs.qvac_perf_warmup_runs }}
          qvac-perf-only: ${{ inputs.qvac_perf_only }}
          # A manual test filter wins; else the caller's test_groups override
          # (empty => auto-detect the sharded test-groups.json).
          test-groups: ${{ steps.manual_tests.outputs.groups != '' && steps.manual_tests.outputs.groups || inputs.test_groups }}
          extra-device-env: ${{ inputs.device_env }}
          # Host pre-stages this shard's models so the phone never downloads
          # from huggingface.co. iOS uses pymobiledevice3 into Documents/;
          # Android uses adb push into /data/local/tmp.
          extra-pre-test-commands: ${{ matrix.platform == 'iOS' && steps.ios_prestage.outputs.block || steps.prestage.outputs.block }}

      - name: Schedule Device Farm test runs
        id: schedule
        uses: ./.github/actions/run-mobile-integration-tests/schedule-test-run
        with:
          platform: ${{ matrix.platform }}
          device-farm-project-arn: ${{ secrets.LLM_AWS_DEVICE_FARM_PROJECT_ARN }}
          android-device-pool-arn: ${{ secrets.LLM_ANDROID_DEVICE_POOL_ARN }}
          ios-device-pool-arn: ${{ secrets.LLM_IOS_DEVICE_POOL_ARN }}
          # workflow_dispatch pins the run to the chosen device(s) (manual-devices).
          # workflow_call is unchanged: single-device when device_model is set,
          # else the sharded/dual-flagship default.
          scheduling-mode: ${{ inputs.platform != '' && 'manual-devices' || (inputs.device_model != '' && 'single-device' || 'dual-flagship') }}
          device-models: ${{ inputs.platform != '' && (inputs.devices_custom != '' && inputs.devices_custom || (inputs.device != '(custom)' && inputs.device || '')) || '' }}
          device-model: ${{ inputs.device_model }}
          device-model-operator: ${{ inputs.device_model_operator }}
          device-manufacturer: ${{ inputs.device_manufacturer }}
          app-upload-arn: ${{ steps.upload.outputs.app-upload-arn }}
          test-package-upload-arn: ${{ steps.upload.outputs.test-package-upload-arn }}
          test-specs: ${{ steps.upload.outputs.test-specs }}

      - name: Monitor Device Farm test runs
        id: monitor
        uses: ./.github/actions/run-mobile-integration-tests/monitor-test-run
        with:
          run-arns: ${{ steps.schedule.outputs.run-arns }}
          run-count: ${{ steps.schedule.outputs.run-count }}
          test-specs: ${{ steps.upload.outputs.test-specs }}

      - name: Cancel Device Farm runs on workflow cancellation
        if: cancelled() && steps.schedule.outputs.run-arns != '' && steps.schedule.outputs.run-arns != '[]'
        uses: ./.github/actions/run-mobile-integration-tests/cancel-device-farm-runs
        with:
          run-arns: ${{ steps.schedule.outputs.run-arns }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

      - name: Collect and upload Device Farm logs
        if: always() && !cancelled()
        uses: ./.github/actions/run-mobile-integration-tests/collect-and-upload-logs
        with:
          platform: ${{ matrix.platform }}
          addon-npm-name: '@qvac/llm-llamacpp'
          artifact-name-suffix: ${{ inputs.artifact_suffix }}
          enables-perf: 'true'
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          run-arns: ${{ steps.schedule.outputs.run-arns }}

      # QVAC-17830: VLM image tests are split across multiple
      # `image-*.test.js` files; each Device Farm group emits its own
      # `performance-report.json` payload, so we pass merge=true to
      # union them per device. We also need
      # unzip-customer-artifacts=true so the markers buried in
      # bare_console.log inside Customer_Artifacts.zip are visible to
      # extract-from-log.js. Artifact name matches the pattern the
      # umbrella `combine-perf-reports` job (on-pr-llm-llamacpp.yml)
      # scans for.
      - name: Extract & upload addon perf report (LLM)
        if: always() && !cancelled() && steps.schedule.outputs.run-count != '0' && steps.schedule.outputs.run-count != ''
        uses: ./.github/actions/run-mobile-integration-tests/extract-addon-perf
        with:
          platform: ${{ matrix.platform }}
          merge: 'true'
          unzip-customer-artifacts: 'true'
          artifact-name: perf-report-llamacpp-llm-${{ inputs.artifact_suffix }}${{ matrix.platform }}-${{ github.run_number }}

      - name: Comment results on PR
        if: always() && !cancelled()
        uses: ./.github/actions/run-mobile-integration-tests/comment-on-pr
        with:
          addon-npm-name: '@qvac/llm-llamacpp'
          platform: ${{ matrix.platform }}
          test-result: ${{ steps.monitor.outputs.test-result }}
          test-total: ${{ steps.monitor.outputs.test-total }}
          test-passed: ${{ steps.monitor.outputs.test-passed }}
          test-failed: ${{ steps.monitor.outputs.test-failed }}
          test-skipped: ${{ steps.monitor.outputs.test-skipped }}
          user-test-passed: ${{ steps.monitor.outputs.user-test-passed }}
          user-test-failed: ${{ steps.monitor.outputs.user-test-failed }}
