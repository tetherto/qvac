    runs-on: ubuntu-latest
    outputs:
      orch: ${{ steps.export.outputs.orch }}
      u22: ${{ steps.export.outputs.u22 }}
      u24: ${{ steps.export.outputs.u24 }}
      u22_arm: ${{ steps.export.outputs.u22_arm }}
