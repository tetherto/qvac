# Reusable workflow — canonical CI runner labels for caller workflows.
# Generated by .github/scripts/sync-runner-names.mjs from runners.yaml.
# Do not edit by hand; run the sync script after changing runners.yaml.

name: Runner names (reusable)

on:
  workflow_call:
    outputs:
      orch:
        description: Default orchestration runner
        value: ${{ jobs.export.outputs.orch }}
      u22:
        description: GitHub-hosted Ubuntu 22.04
        value: ${{ jobs.export.outputs.u22 }}
      u24:
        description: GitHub-hosted Ubuntu 24.04
        value: ${{ jobs.export.outputs.u24 }}
      u22_arm:
        description: GitHub-hosted Ubuntu 22.04 ARM64
        value: ${{ jobs.export.outputs.u22_arm }}
