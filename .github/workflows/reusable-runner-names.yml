      mac14: ${{ steps.export.outputs.mac14 }}
      mac14_xl: ${{ steps.export.outputs.mac14_xl }}
      mac15: ${{ steps.export.outputs.mac15 }}
      mac15_intel: ${{ steps.export.outputs.mac15_intel }}
      mac15_lg: ${{ steps.export.outputs.mac15_lg }}
      mac15_xl: ${{ steps.export.outputs.mac15_xl }}
      win22: ${{ steps.export.outputs.win22 }}
      win25: ${{ steps.export.outputs.win25 }}
      qvac_u22: ${{ steps.export.outputs.qvac_u22 }}
      qvac_u22_gpu: ${{ steps.export.outputs.qvac_u22_gpu }}
      qvac_u24: ${{ steps.export.outputs.qvac_u24 }}
      qvac_u24_gpu: ${{ steps.export.outputs.qvac_u24_gpu }}
      qvac_win25: ${{ steps.export.outputs.qvac_win25 }}
      qvac_win25_gpu: ${{ steps.export.outputs.qvac_win25_gpu }}
      ai_linux: ${{ steps.export.outputs.ai_linux }}
      ai_linux_gpu: ${{ steps.export.outputs.ai_linux_gpu }}
      ai_u22: ${{ steps.export.outputs.ai_u22 }}
      ai_win11_gpu: ${{ steps.export.outputs.ai_win11_gpu }}
      gen_win11: ${{ steps.export.outputs.gen_win11 }}
      mini_m4: ${{ steps.export.outputs.mini_m4 }}
      mini_m4_gpu: ${{ steps.export.outputs.mini_m4_gpu }}
      lbl_u22_x64: ${{ steps.export.outputs.lbl_u22_x64 }}
      lbl_u22_x64_gpu: ${{ steps.export.outputs.lbl_u22_x64_gpu }}
      lbl_u24_x64: ${{ steps.export.outputs.lbl_u24_x64 }}
      lbl_u24_x64_gpu: ${{ steps.export.outputs.lbl_u24_x64_gpu }}
      lbl_u24_arm64: ${{ steps.export.outputs.lbl_u24_arm64 }}
      lbl_win22_x64: ${{ steps.export.outputs.lbl_win22_x64 }}
      lbl_win25_x64: ${{ steps.export.outputs.lbl_win25_x64 }}
      lbl_win25_x64_gpu: ${{ steps.export.outputs.lbl_win25_x64_gpu }}
    steps:
      - id: export
        shell: bash
        run: |
          echo orch='ubuntu-latest' >> "$GITHUB_OUTPUT"
          echo u22='ubuntu-22.04' >> "$GITHUB_OUTPUT"
          echo u24='ubuntu-24.04' >> "$GITHUB_OUTPUT"
          echo u22_arm='ubuntu-22.04-arm' >> "$GITHUB_OUTPUT"
          echo u24_arm='ubuntu-24.04-arm' >> "$GITHUB_OUTPUT"
          echo mac14='macos-14' >> "$GITHUB_OUTPUT"
          echo mac14_xl='macos-14-xlarge' >> "$GITHUB_OUTPUT"
          echo mac15='macos-15' >> "$GITHUB_OUTPUT"
          echo mac15_intel='macos-15-intel' >> "$GITHUB_OUTPUT"
          echo mac15_lg='macos-15-large' >> "$GITHUB_OUTPUT"
          echo mac15_xl='macos-15-xlarge' >> "$GITHUB_OUTPUT"
          echo win22='windows-2022' >> "$GITHUB_OUTPUT"
          echo win25='windows-2025' >> "$GITHUB_OUTPUT"
          echo qvac_u22='qvac-ubuntu2204-x64' >> "$GITHUB_OUTPUT"
          echo qvac_u22_gpu='qvac-ubuntu2204-x64-gpu' >> "$GITHUB_OUTPUT"
          echo qvac_u24='qvac-ubuntu2404-x64' >> "$GITHUB_OUTPUT"
          echo qvac_u24_gpu='qvac-ubuntu2404-x64-gpu' >> "$GITHUB_OUTPUT"
          echo qvac_win25='qvac-win25-x64' >> "$GITHUB_OUTPUT"
          echo qvac_win25_gpu='qvac-win25-x64-gpu' >> "$GITHUB_OUTPUT"
          echo ai_linux='ai-run-linux' >> "$GITHUB_OUTPUT"
          echo ai_linux_gpu='ai-run-linux-gpu' >> "$GITHUB_OUTPUT"
          echo ai_u22='ai-run-ubuntu-22.04' >> "$GITHUB_OUTPUT"
          echo ai_win11_gpu='ai-run-windows11-gpu' >> "$GITHUB_OUTPUT"
          echo gen_win11='generator-windows11' >> "$GITHUB_OUTPUT"
          echo mini_m4='mac-mini-m4' >> "$GITHUB_OUTPUT"
          echo mini_m4_gpu='mac-mini-m4-gpu' >> "$GITHUB_OUTPUT"
          echo lbl_u22_x64='ubuntu-22.04-x64' >> "$GITHUB_OUTPUT"
          echo lbl_u22_x64_gpu='ubuntu-22.04-x64-gpu' >> "$GITHUB_OUTPUT"
          echo lbl_u24_x64='ubuntu-24.04-x64' >> "$GITHUB_OUTPUT"
          echo lbl_u24_x64_gpu='ubuntu-24.04-x64-gpu' >> "$GITHUB_OUTPUT"
