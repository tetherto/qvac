        description: Self-hosted Windows 11 image builder
        value: ${{ jobs.export.outputs.gen_win11 }}
      mini_m4:
        description: Self-hosted Mac mini M4
        value: ${{ jobs.export.outputs.mini_m4 }}
      mini_m4_gpu:
        description: Self-hosted Mac mini M4 GPU
        value: ${{ jobs.export.outputs.mini_m4_gpu }}
      lbl_u22_x64:
        description: Benchmark device label (ubuntu-22.04-x64)
        value: ${{ jobs.export.outputs.lbl_u22_x64 }}
      lbl_u22_x64_gpu:
