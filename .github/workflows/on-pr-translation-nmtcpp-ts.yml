name: Translation TypeScript Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/translation-nmtcpp/**"
      - ".github/workflows/*nmtcpp*.yml"
      - "packages/fabric/vcpkg.json"
      - "packages/fabric/vcpkg-configuration.json"
      - ".github/workflows/reusable-ts-checks.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  translation-nmtcpp-pr-head-ts-checks:
    uses: ./.github/workflows/reusable-ts-checks.yml
    with:
      workdir: packages/translation-nmtcpp
