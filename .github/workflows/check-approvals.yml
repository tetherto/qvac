name: Check Approvals

on:
  issue_comment:
    types: [created]
  # Each PR checks run starts the default branch's copy with the App key, for fork PRs as well; it checks out nothing.
  workflow_run:
    workflows: [PR checks]
    types: [requested]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

# Runs on the default branch's ref, so a save would land in its cache; this workflow uses none.
cache-mode: none

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || format('{0}-{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) }}
  cancel-in-progress: false

jobs:
  check-approvals:
    name: Check Approvals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    if: >-
      github.event_name == 'workflow_run' || (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, 'review') &&
        github.event.issue.pull_request != null
      )
    steps:
      # The open, non-draft PR whose head is the triggering commit, from the API; the trigger gives only its head.
      - name: Find the pull request
        id: pr
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          BASES: ^(main|release-[^/]*)$
        run: |
          number=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f per_page=100 \
            -f head="${HEAD_REPO%%/*}:$HEAD_BRANCH" --jq '
              [.[] | select(.head.sha == env.HEAD_SHA
                and (.head.repo.full_name | ascii_downcase) == (env.HEAD_REPO | ascii_downcase)
                and (.draft | not) and (.base.ref | test(env.BASES)))]
              | if length == 1 then .[0].number else "" end')
          [ -n "$number" ] || echo "::notice::No open non-draft PR at $HEAD_SHA to check"
          [ -z "$number" ] || echo "PR #$number at $HEAD_SHA"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Install @qvac/ci
        if: github.event_name == 'issue_comment' || steps.pr.outputs.number != ''
        run: npm install -g @qvac/ci@0.2.0

      - name: Check Approvals
        if: github.event_name == 'issue_comment' || steps.pr.outputs.number != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_APP_ID: ${{ secrets.APP_ID }}
          GITHUB_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          PR_NUMBER: ${{ steps.pr.outputs.number || github.event.issue.number }}
        run: |
          qvac-ci pending-approvals \
            --pr-number "$PR_NUMBER" \
            --maintainers-team 'qvac-internal-mgmt' \
            --team-leads-team 'qvac-internal-merge' \
            --min-approvals '2'

      # The required check: a workflow_run job is not a check on the PR, so the run reports as a status on its head.
      - name: Report on the pull request
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=success -f context='Check Approvals' \
            -f description='Approval status is in the PR comment' -f target_url="$RUN_URL" > /dev/null
