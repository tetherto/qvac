name: Release Train (nx)

# Publishes a release train: the nx release groups that
# .github/release-trains.json joins into one train, from one
# release-train-<train>-<x.y.z> branch, behind one npm approval. The version is
# the anchor group's. The train's `checks` decide which check jobs below must
# pass. See docs/ci/RELEASE-TRAIN.md.
#
# The per-package release workflows run their merge guard with strict-slug, so
# a release-train-* branch cannot publish through them.
#
# A release PR into a train branch runs everything up to `pnpm publish
# --dry-run` as a check. The dry run has its own job without an environment;
# publishing, PyPI, tags and the GitHub release need the npm environment's
# approval.

on:
  push:
    branches:
      - release-train-*

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - release-train-*

  workflow_dispatch:
    inputs:
      publish_pypi_only:
        description: "Skip npm and publish tetherto-qvac-sdk only (npm already shipped)."
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Run every check and `pnpm publish --dry-run`; publish, tag and release nothing."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fork-approval:
    permissions:
      statuses: write
    uses: ./.github/workflows/reusable-fork-approval.yml

  authorize:
    needs: [fork-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: read
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      - name: Checkout authorize-pr (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/authorize-pr
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Authorize
        id: auth
        uses: ./.github/actions/authorize-pr
        with:
          github-token: ${{ github.token }}

  train:
    name: Resolve the train
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      name: ${{ steps.resolve.outputs.name }}
      projects: ${{ steps.resolve.outputs.projects }}
      dist_paths: ${{ steps.resolve.outputs.dist_paths }}
      moved: ${{ steps.resolve.outputs.moved }}
      checks: ${{ steps.resolve.outputs.checks }}
      release_slug: ${{ steps.resolve.outputs.release_slug }}
      release_dir: ${{ steps.resolve.outputs.release_dir }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      dry_run: ${{ github.event_name == 'pull_request' || inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: "24.14.1"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # 4.1.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Measured from the merge base with the default branch, so the push that
      # creates a branch is checked too, and a fix PR into a train branch that
      # has not published checks the whole train again. On a PR, npm must not
      # have any moved version yet.
      - name: Resolve and check the train
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BASE_SHA=$(git merge-base HEAD "origin/$DEFAULT_BRANCH")
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node .github/scripts/release-train.mjs resolve "$PR_BASE_REF" "$BASE_SHA" "$GITHUB_SHA" --check-npm
          else
            node .github/scripts/release-train.mjs resolve "$REF_NAME" "$BASE_SHA" "$GITHUB_SHA"
          fi

  build:
    name: Build the train
    needs:
      - fork-approval
      - authorize
      - train
    if: needs.authorize.outputs.allowed == 'true' && needs.train.outputs.moved != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: "24.14.1"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # 4.1.0

      # Train packages resolve each other from the workspace, so none waits for
      # the one below it to reach npm.
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the linked siblings are on npm
        env:
          TRAIN: ${{ needs.train.outputs.name }}
        run: node .github/scripts/release-train.mjs linked "$TRAIN"

      # Without --exclude-task-dependencies, `^build` also builds the native
      # addons the train links, which needs a C++ toolchain this runner lacks.
      - name: Build
        env:
          TRAIN_PROJECTS: ${{ needs.train.outputs.projects }}
        run: pnpm exec nx run-many -t build --projects="$TRAIN_PROJECTS" --exclude-task-dependencies

      # The publish job runs no lifecycle scripts, so cli's prepublishOnly check
      # runs here.
      - name: Run prepublishOnly checks
        env:
          TRAIN_PROJECTS: ${{ needs.train.outputs.projects }}
        run: pnpm exec nx run-many -t prepublishOnly --projects="$TRAIN_PROJECTS"

      # The served job compares what npm stores against these tarballs. Packing
      # also fails on a package whose dist/ is empty.
      - name: Pack the train
        env:
          TRAIN: ${{ needs.train.outputs.name }}
        run: node .github/scripts/release-train.mjs pack "$TRAIN" "$RUNNER_TEMP/train-tarballs"

      - name: Upload train dist artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: dist-${{ needs.train.outputs.name }}
          path: ${{ needs.train.outputs.dist_paths }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload train tarballs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: tarballs-${{ needs.train.outputs.name }}
          path: ${{ runner.temp }}/train-tarballs
          if-no-files-found: error
          retention-days: 30

  # The checks publish-inference.yml and publish-sdk.yml run before npm. The
  # engine is not on npm yet, so the sdk check uses the workspace copy.
  shared-runtime-libs:
    name: Shared runtime libs resolve once
    needs: [train]
    if: needs.train.outputs.moved != '[]' && contains(fromJSON(needs.train.outputs.checks), 'shared-runtime-libs')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Check @qvac/inference
        run: node .github/scripts/check-shared-runtime-libs.mjs packages/inference

      - name: Check @qvac/sdk
        run: node .github/scripts/check-shared-runtime-libs.mjs packages/sdk --local packages/inference

  # Each package's own checks, as on its release PR, with every train package
  # installed from a tarball of this commit. Its tarballs are its own: the
  # publish job never takes anything from this run.
  package-checks:
    name: Package checks before publish
    needs: [train]
    if: needs.train.outputs.moved != '[]' && contains(fromJSON(needs.train.outputs.checks), 'package-checks')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/pr-checks-sdk-pod.yml
    with:
      train: ${{ needs.train.outputs.name }}
      source: train
      ref: ${{ github.sha }}

  sdk-python:
    name: Build tetherto-qvac-sdk (Python)
    needs:
      - fork-approval
      - authorize
      - train
    if: >-
      needs.authorize.outputs.allowed == 'true' &&
      needs.train.outputs.moved != '[]' &&
      contains(fromJSON(needs.train.outputs.checks), 'sdk-python')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # 6.2.0
        with:
          python-version: "3.10"

      - name: Install build tooling
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -U pip
          .venv/bin/pip install --quiet build twine
          .venv/bin/pip install --quiet -e ".[gen]"

      - name: Contract check
        run: .venv/bin/python3 scripts/generate.py --check

      - name: Build
        run: .venv/bin/python3 -m build --sdist --wheel --outdir dist/

      - name: Verify python version matches @qvac/sdk
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          SDK_VER=$(git show "${GITHUB_SHA}":packages/sdk/package.json | jq -r .version)
          PY_VER=$(git show "${GITHUB_SHA}":packages/sdk-python/src/tetherto/qvac_sdk/_generated/sdk_version.py | sed -n 's/^SDK_VERSION = "\(.*\)"/\1/p')
          if [ -z "$PY_VER" ]; then
            echo "::error title=Version mismatch::Could not parse SDK_VERSION from sdk_version.py at ${GITHUB_SHA}"
            exit 1
          fi
          if [ "$PY_VER" != "$SDK_VER" ]; then
            echo "::error title=Version mismatch::tetherto-qvac-sdk@$PY_VER vs @qvac/sdk@$SDK_VER at ${GITHUB_SHA}. Run packages/sdk-python/scripts/generate.py before release."
            exit 1
          fi
          echo "OK: tetherto-qvac-sdk and @qvac/sdk both at $SDK_VER"

      - name: Check metadata
        run: .venv/bin/twine check dist/*

      - name: Upload python dist artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: dist-sdk-python
          path: packages/sdk-python/dist/*
          if-no-files-found: error
          retention-days: 30

  # The gate both publish jobs wait for: the train resolved, the run is
  # authorized, the build passed, and so did every check the train lists. A
  # check the train does not list is skipped. Each check kind is the id of its
  # job. It runs on every outcome, because a required check that is skipped
  # counts as passed.
  checks-passed:
    name: Train checks passed
    needs:
      - authorize
      - train
      - build
      - shared-runtime-libs
      - package-checks
      - sdk-python
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the build and the train's checks
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          TRAIN_RESULT: ${{ needs.train.result }}
          ALLOWED: ${{ needs.authorize.outputs.allowed }}
          MOVED: ${{ needs.train.outputs.moved }}
          CHECKS: ${{ needs.train.outputs.checks }}
        run: |
          set -euo pipefail
          if [ "$TRAIN_RESULT" != "success" ]; then
            echo "::error::The train did not resolve: $TRAIN_RESULT"
            exit 1
          fi
          if [ "$ALLOWED" != "true" ]; then
            echo "::error::This run is not authorized; see the authorize job"
            exit 1
          fi
          if [ "$MOVED" = "[]" ]; then
            echo "No train package moved; nothing to check."
            exit 0
          fi
          FAILED=$(jq -r --argjson checks "$CHECKS" '
            . as $needs
            | (["build"] + $checks)[]
            | select($needs[.].result != "success")
            | "\(.): \($needs[.].result)"' <<<"$NEEDS")
          if [ -n "$FAILED" ]; then
            echo "::error::Did not pass:"
            echo "$FAILED"
            exit 1
          fi

  # checks-passed needs every check job, and a train skips the ones it does not
  # list. Without a status function GitHub skips any job below a skipped one,
  # so each job from here on names the result it waits for.
  publish-npm:
    name: Publish the train to npm
    needs: [train, checks-passed]
    if: >-
      !cancelled() &&
      needs.checks-passed.result == 'success' &&
      needs.train.outputs.moved != '[]' &&
      needs.train.outputs.dry_run != 'true' &&
      !(github.event_name == 'workflow_dispatch' && inputs.publish_pypi_only == true)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: "24.14.1"
          registry-url: https://registry.npmjs.org/
          scope: "@qvac"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # 4.1.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download train dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: dist-${{ needs.train.outputs.name }}

      # pnpm 11 reads PNPM_CONFIG_* and ignores NPM_CONFIG_*. Lifecycle scripts
      # stay off so inference's `prepare` does not rebuild over the downloaded
      # dist.
      - name: Publish the train
        id: publish
        env:
          PNPM_CONFIG_IGNORE_SCRIPTS: "true"
          PNPM_CONFIG_PROVENANCE: "true"
          MOVED: ${{ needs.train.outputs.moved }}
        run: node .github/scripts/release-train.mjs publish "$MOVED"

  # The same publish with --dry-run, as a release PR check or a dispatch with
  # dry_run. No environment and no id-token: it never needs to authenticate.
  publish-npm-dry-run:
    name: Publish the train to npm (dry run)
    needs: [train, checks-passed]
    if: >-
      !cancelled() &&
      needs.checks-passed.result == 'success' &&
      needs.train.outputs.moved != '[]' &&
      needs.train.outputs.dry_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: "24.14.1"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # 4.1.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download train dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: dist-${{ needs.train.outputs.name }}

      - name: Publish the train (dry run)
        env:
          PNPM_CONFIG_IGNORE_SCRIPTS: "true"
          MOVED: ${{ needs.train.outputs.moved }}
        run: node .github/scripts/release-train.mjs publish "$MOVED" --dry-run

  # From here on, each job also runs when publish-npm published nothing because
  # npm already had every version from this commit: a re-run after a later job
  # failed. Each job skips what already exists from this commit and fails on
  # what exists from another.
  served:
    name: Wait until npm serves the train
    needs: [train, publish-npm]
    if: >-
      !cancelled() &&
      needs.publish-npm.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download train tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: tarballs-${{ needs.train.outputs.name }}
          path: ${{ runner.temp }}/train-tarballs

      # Compares only what this run published: re-running every job or a
      # dispatch rebuilds the tarballs, and a rebuild can pack other bytes.
      # Re-running failed jobs keeps publish-npm's output from the attempt that
      # published.
      - name: Wait and compare with the built tarballs
        env:
          MOVED: ${{ needs.train.outputs.moved }}
          PUBLISHED: ${{ needs.publish-npm.outputs.published }}
        run: node .github/scripts/release-train.mjs wait "$MOVED" "$PUBLISHED" "$RUNNER_TEMP/train-tarballs"

  # The same checks against what npm now serves. Tags, the GitHub release,
  # PyPI and the wheels wait for them.
  published-checks:
    name: Package checks after publish
    needs: [train, served]
    if: >-
      !cancelled() &&
      needs.served.result == 'success' &&
      contains(fromJSON(needs.train.outputs.checks), 'package-checks')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/pr-checks-sdk-pod.yml
    with:
      train: ${{ needs.train.outputs.name }}
      source: published
      ref: ${{ github.sha }}

  publish-pypi:
    name: Publish tetherto-qvac-sdk to PyPI
    needs:
      - fork-approval
      - authorize
      - train
      - sdk-python
      - served
      - published-checks
    if: >-
      !cancelled() &&
      github.repository == 'tetherto/qvac' &&
      needs.authorize.outputs.allowed == 'true' &&
      needs.sdk-python.result == 'success' &&
      needs.train.outputs.release_version != '' &&
      (
        (
          needs.served.result == 'success' &&
          (needs.published-checks.result == 'success' || !contains(fromJSON(needs.train.outputs.checks), 'package-checks'))
        )
        ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_pypi_only == true &&
          inputs.dry_run != true
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/tetherto-qvac-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: dist-sdk-python
          path: dist

      # A PyPI file records no commit. tetherto-qvac-sdk has @qvac/sdk's version
      # (sdk-python checks it), and once served passed, npm has that version
      # from this commit, so a file PyPI already has comes from this commit.
      # publish_pypi_only runs without served, so there an existing file fails.
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: ${{ needs.served.result == 'success' }}

  # Tags go on the commit npm records as each version's gitHead, the GitHub
  # release's tag included.
  tag:
    name: Tag the published packages
    needs:
      - train
      - served
      - published-checks
    if: >-
      !cancelled() &&
      needs.served.result == 'success' &&
      (needs.published-checks.result == 'success' || !contains(fromJSON(needs.train.outputs.checks), 'package-checks'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Tag
        env:
          MOVED: ${{ needs.train.outputs.moved }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node .github/scripts/release-train.mjs tag "$MOVED" --push

  # Created on the tag the tag job checked against npm's gitHead. An existing
  # release on that tag gets its notes updated.
  github-release:
    name: Create the GitHub release
    needs:
      - train
      - tag
    if: >-
      !cancelled() &&
      needs.tag.result == 'success' &&
      needs.train.outputs.release_version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/create-github-release.yml
    with:
      repo_name: ${{ needs.train.outputs.release_slug }}
      release_name: ${{ needs.train.outputs.release_name }}
      published_version: ${{ needs.train.outputs.release_version }}
      prev_sha: ${{ github.event.before }}
      workdir: ${{ needs.train.outputs.release_dir }}

  attach-fat-wheels:
    name: Attach the fat wheels
    needs:
      - train
      - github-release
    if: ${{ !cancelled() && needs.github-release.result == 'success' && contains(fromJSON(needs.train.outputs.checks), 'sdk-python') }}
    permissions:
      contents: write
    uses: ./.github/workflows/build-sdk-python-fat-wheels.yml
    with:
      version: ${{ needs.train.outputs.release_version }}
