name: General CI/CD (cli)
# Publishes the @qvac/cli entry point from a per-package release-* branch (a
# hotfix); train releases publish from release-train.yml. It publishes no GitHub
# Packages snapshots: the entry point only runs @qvac/sdk-tools, whose own
# workflow publishes those.

on:
  push:
    branches:
      - release-*
      # release-train-* branches publish from release-train.yml.
      - "!release-train-*"
    paths:
      - "packages/cli/**"
      - ".github/workflows/trigger-reusable-lib-cli.yml"
  workflow_dispatch:
    inputs:
      npm_tag:
        description: "NPM dist-tag (default: latest). e.g. release-1.x"
        required: false
        default: ""
        type: string

env:
  WORKDIR: packages/cli

permissions:
  contents: read

jobs:
  release-merge-guard:
    name: Release Merge Guard
    if: >-
      startsWith(github.ref_name, 'release-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-merge-guard
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: ${{ github.ref_name }}
          base-sha: ${{ github.event.before }}
          head-sha: ${{ github.sha }}
          package-slug: cli
          package-json-path: packages/cli/package.json
          changelog-path: packages/cli/CHANGELOG.md
          strict-slug: true

  publish-logic:
    runs-on: ubuntu-latest
    outputs:
      publish_release: ${{ steps.logic.outputs.publish_release }}
    steps:
      - id: logic
        uses: tetherto/qvac-actions/npm-publish-logic@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0

  build:
    needs: [publish-logic]
    if: needs.publish-logic.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 22

      # Installs the released @qvac/sdk-tools from npm.
      - name: Install dependencies
        run: npm install --ignore-scripts
        working-directory: ${{ env.WORKDIR }}

      - name: Run format
        run: npm run format
        working-directory: ${{ env.WORKDIR }}

      - name: Run lint
        run: npm run lint
        working-directory: ${{ env.WORKDIR }}

      - name: Run typecheck
        run: npm run typecheck
        working-directory: ${{ env.WORKDIR }}

      - name: Build
        run: npm run build
        working-directory: ${{ env.WORKDIR }}

      - name: Run unit tests
        run: npm run test:unit
        working-directory: ${{ env.WORKDIR }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: cli-dist
          path: ${{ env.WORKDIR }}/dist/
          if-no-files-found: error
          retention-days: 30

  publish-release-npm:
    needs:
      - build
      - publish-logic
      - release-merge-guard
    if: >-
      (needs.publish-logic.outputs.publish_release == 'true' && needs.release-merge-guard.result == 'success')
    runs-on: ubuntu-latest
    environment: npm
    outputs:
      published_version: ${{ steps.publish.outputs.npm_published_version }}
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Validate npm_tag input
        if: inputs.npm_tag != ''
        shell: bash
        env:
          NPM_TAG_INPUT: ${{ inputs.npm_tag }}
        run: |
          if ! echo "$NPM_TAG_INPUT" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'; then
            echo "::error::Invalid npm dist-tag '$NPM_TAG_INPUT'. Must match ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ (e.g. release-1.x)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Download build artifacts
        uses: ./.github/actions/download-release-artifact
        with:
          name: cli-dist
          path: ${{ env.WORKDIR }}/dist/

      - name: Determine dist-tag
        id: dist-tag
        uses: tetherto/qvac-actions/npm-dist-tag-determination@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
        with:
          workdir: ${{ env.WORKDIR }}
          tag: ${{ inputs.npm_tag }}

      - name: Publish to NPM
        id: publish
        uses: tetherto/qvac-actions/publish-library-to-npm@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
        with:
          tag: ${{ steps.dist-tag.outputs.tag }}
          workdir: ${{ env.WORKDIR }}

  # Tag the published version (no GitHub Release; SDK-only releases policy)
  create-tag:
    needs: [publish-release-npm]
    if: needs.publish-release-npm.result == 'success' && needs.publish-release-npm.outputs.published_version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/create-release-tag.yml
    with:
      repo_name: "cli"
      published_version: ${{ needs.publish-release-npm.outputs.published_version }}
