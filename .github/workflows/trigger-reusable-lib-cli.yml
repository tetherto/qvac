name: General CI/CD (cli)

on:
  push:
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/cli/**"
      - ".github/workflows/trigger-reusable-lib-cli.yml"
  workflow_dispatch:
    inputs:
      custom_input_1:
        required: false
        type: string
      custom_input_2:
        required: false
        type: string
      custom_input_3:
        required: false
        type: string
      npm_tag:
        description: "NPM dist-tag (default: latest). e.g. release-1.x"
        required: false
        default: ""
        type: string

env:
  WORKDIR: packages/cli

permissions:
  contents: read

jobs:
  release-merge-guard:
    name: Release Merge Guard
    if: >-
      github.event_name == 'push' && startsWith(github.ref_name, 'release-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-merge-guard
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: ${{ github.ref_name }}
          base-sha: ${{ github.event.before }}
          head-sha: ${{ github.sha }}
          package-slug: cli
          package-json-path: packages/cli/package.json
          changelog-path: packages/cli/CHANGELOG.md

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Workspace SDK compiles in-repo inference + SDK; keep a cap so a hung
    # bun install cannot sit on the runner indefinitely.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 22

      # Match SDK pod policy: in-repo SDK on main/tmp/feature, published on
      # release-* (packages/cli/README.md "How CI tests the CLI/SDK pair").
      # sdk-source:workspace needs bun (builds inference + SDK) and GPR
      # (@tetherto/*) via GITHUB_TOKEN.
      - name: Setup Bun
        if: ${{ !startsWith(github.ref_name, 'release-') }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # 2.2.0
        with:
          bun-version: latest

      - name: Configure npm registries
        if: ${{ !startsWith(github.ref_name, 'release-') }}
        shell: node {0}
        env:
          GPR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          const fs = require('fs');
          const path = require('path');

          if (!process.env.GPR_TOKEN) {
            console.log('::error::GITHUB_TOKEN is empty — cannot read @tetherto GPR packages');
            process.exit(1);
          }

          const lines = [
            'registry=https://registry.npmjs.org/',
            '@qvac:registry=https://registry.npmjs.org/',
            '@tetherto:registry=https://npm.pkg.github.com/',
            `//npm.pkg.github.com/:_authToken=${process.env.GPR_TOKEN}`,
          ];
          const npmrc = lines.join('\n') + '\n';
          const target = path.join(process.env.GITHUB_WORKSPACE, '.npmrc');
          fs.writeFileSync(target, npmrc, 'utf8');
          console.log(`::notice::.npmrc configured at ${target} (@tetherto → GPR via GITHUB_TOKEN)`);

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.WORKDIR }}

      - name: Link workspace SDK
        if: ${{ !startsWith(github.ref_name, 'release-') }}
        run: npm run sdk-source:workspace
        working-directory: ${{ env.WORKDIR }}

      - name: Run format
        run: npm run format
        working-directory: ${{ env.WORKDIR }}

      - name: Run lint
        run: npm run lint
        working-directory: ${{ env.WORKDIR }}

      - name: Run typecheck
        run: npm run typecheck
        working-directory: ${{ env.WORKDIR }}

      - name: Build
        run: npm run build
        working-directory: ${{ env.WORKDIR }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: cli-dist
          path: ${{ env.WORKDIR }}/dist/
          retention-days: 30

  publish-logic:
    runs-on: ubuntu-latest
    outputs:
      publish_main: ${{ steps.logic.outputs.publish_main }}
      publish_release: ${{ steps.logic.outputs.publish_release }}
      publish_feature: ${{ steps.logic.outputs.publish_feature }}
      publish_tmp: ${{ steps.logic.outputs.publish_tmp }}
      gpr_tag: ${{ steps.logic.outputs.gpr_tag }}
    steps:
      - id: logic
        uses: tetherto/qvac-actions/npm-publish-logic@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0

  publish-main-gpr-dev:
    needs:
      - build
      - publish-logic
    if: (needs.publish-logic.outputs.publish_main == 'true')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: ./.github/actions/download-release-artifact
        with:
          name: cli-dist
          path: ${{ env.WORKDIR }}/dist/

      - name: Rewrite SDK scope for GPR
        uses: ./.github/actions/cli-rewrite-sdk-scope-for-gpr

      - name: Publish to GitHub Packages (dev)
        uses: ./.github/actions/publish-library-to-gpr
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          tag: ${{ needs.publish-logic.outputs.gpr_tag }}
          workdir: packages/cli
          name-suffix: "-mono"

  publish-release-npm:
    needs:
      - build
      - publish-logic
      - release-merge-guard
    if: >-
      (needs.publish-logic.outputs.publish_release == 'true' && (needs.release-merge-guard.result == 'success' || needs.release-merge-guard.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: npm
    outputs:
      published_version: ${{ steps.publish.outputs.npm_published_version }}
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Validate npm_tag input
        if: inputs.npm_tag != ''
        shell: bash
        run: |
          tag="${{ inputs.npm_tag }}"
          if ! echo "$tag" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'; then
            echo "::error::Invalid npm dist-tag '$tag'. Must match ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ (e.g. release-1.x)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Download build artifacts
        uses: ./.github/actions/download-release-artifact
        with:
          name: cli-dist
          path: ${{ env.WORKDIR }}/dist/

      - name: Determine dist-tag
        id: dist-tag
        uses: tetherto/qvac-actions/npm-dist-tag-determination@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
        with:
          workdir: ${{ env.WORKDIR }}
          tag: ${{ inputs.npm_tag }}

      - name: Publish to NPM
        id: publish
        uses: tetherto/qvac-actions/publish-library-to-npm@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
        with:
          tag: ${{ steps.dist-tag.outputs.tag }}
          workdir: ${{ env.WORKDIR }}

  # Tag the published version (no GitHub Release; SDK-only releases policy)
  create-tag:
    needs: [publish-release-npm]
    if: needs.publish-release-npm.result == 'success' && needs.publish-release-npm.outputs.published_version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/create-release-tag.yml
    with:
      repo_name: "cli"
      published_version: ${{ needs.publish-release-npm.outputs.published_version }}

  publish-feature-gpr:
    needs:
      - build
      - publish-logic
    if: (needs.publish-logic.outputs.publish_feature == 'true')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: ./.github/actions/download-release-artifact
        with:
          name: cli-dist
          path: ${{ env.WORKDIR }}/dist/

      - name: Rewrite SDK scope for GPR
        uses: ./.github/actions/cli-rewrite-sdk-scope-for-gpr

      - name: Publish to GitHub Packages (feature)
        uses: ./.github/actions/publish-library-to-gpr
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          tag: ${{ needs.publish-logic.outputs.gpr_tag }}
          workdir: packages/cli
          name-suffix: "-mono"

  publish-tmp-gpr:
    needs:
      - build
      - publish-logic
    if: (needs.publish-logic.outputs.publish_tmp == 'true')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: ./.github/actions/download-release-artifact
        with:
          name: cli-dist
          path: ${{ env.WORKDIR }}/dist/

      - name: Rewrite SDK scope for GPR
        uses: ./.github/actions/cli-rewrite-sdk-scope-for-gpr

      - name: Publish to GitHub Packages (tmp)
        uses: ./.github/actions/publish-library-to-gpr
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          tag: ${{ needs.publish-logic.outputs.gpr_tag }}
          workdir: packages/cli
          name-suffix: "-mono"
