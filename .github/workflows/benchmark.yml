name: Benchmark

on:
  workflow_dispatch:
    inputs:
      addon_version:
        description: 'Version of @qvac/tts-onnx to benchmark (e.g., 0.1.0, latest, ^0.2.0)'
        required: false
        type: string
        default: 'latest'
      dataset:
        description: 'Dataset for benchmarking'
        required: true
        type: choice
        default: harvard
        options:
          - harvard
          - ag_news
          - librispeech
      max_samples:
        description: 'Maximum number of samples to test (0 = unlimited)'
        required: false
        type: number
        default: 0
      run_addon:
        description: 'Run TTS Addon benchmark'
        required: true
        type: boolean
        default: true
      run_python:
        description: 'Run Python Native benchmark'
        required: true
        type: boolean
        default: true
      round_trip_test:
        description: 'Enable round-trip quality test (TTS → Whisper → Text)'
        required: true
        type: boolean
        default: true
      whisper_model:
        description: 'Whisper model for round-trip test'
        required: false
        type: choice
        default: base
        options:
          - tiny
          - base
          - small
          - medium
      num_runs:
        description: 'Number of runs per sample (for determinism testing)'
        required: false
        type: number
        default: 3
      use_gpu:
        description: 'Enable GPU acceleration'
        required: true
        type: boolean
        default: true
      language:
        description: 'Language code (e.g., en-us, es, de, it, fr)'
        required: false
        type: string
        default: 'en-us'
  release:
    types: [published]

jobs:
  benchmark-tts:
    runs-on: macos-14-xlarge
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive

      - name: Configure scoped registry for @tetherto and @qvac packages
        env:
          GPR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_PAT: ${{ secrets.PAT_TOKEN }}
        shell: bash
        run: |
          echo "Configuring scoped registry for @tetherto and @qvac packages..."
          set -eu
          echo "Writing .npmrc for dual registry install…"
          cat > .npmrc <<NPMRC
          always-auth=true
          registry=https://registry.npmjs.org/
          @qvac:registry=https://registry.npmjs.org/
          @tetherto:registry=https://npm.pkg.github.com/
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          //npm.pkg.github.com/:_authToken=${GPR_TOKEN}
          NPMRC

          if [ -n "${GIT_PAT:-}" ]; then
            git config --global url."https://${GIT_PAT}:@github.com/".insteadOf "https://github.com/"
          else
            git config --global url."https://${{ github.token }}:@github.com/".insteadOf "https://github.com/"
          fi

          cp .npmrc benchmarks/server/.npmrc

          echo "=== .npmrc contents ==="
          cat .npmrc

      - name: Install system dependencies
        run: |
          brew install ffmpeg cmake

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bare runtime
        run: |
          npm install -g bare-dev
          npm install -g bare bare-make

      - name: Determine addon version
        id: version
        run: |
          # Determine version based on trigger type
          if [ "${{ github.event_name }}" = "release" ]; then
            # Extract version from release tag (e.g., v0.1.0 -> 0.1.0)
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix if present
            echo "Using version from release: $VERSION"
          else
            # Use workflow input or default to latest
            VERSION="${{ github.event.inputs.addon_version || 'latest' }}"
            echo "Using version from input: $VERSION"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Addon version to benchmark: $VERSION"

      - name: Update addon version in package.json
        if: github.event.inputs.run_addon == 'true' || github.event_name == 'release'
        working-directory: benchmarks/server
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Update package.json with the specified version
          if [ "$VERSION" = "latest" ]; then
            npm pkg set dependencies.@qvac/tts-onnx="latest"
            echo "Set @qvac/tts-onnx to latest version"
          else
            npm pkg set dependencies.@qvac/tts-onnx="$VERSION"
            echo "Set @qvac/tts-onnx to version $VERSION"
          fi

          echo "=== Updated package.json dependencies ==="
          npm pkg get dependencies

      - name: Update benchmark configuration
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATASET="${{ github.event.inputs.dataset || 'harvard' }}"
          MAX_SAMPLES="${{ github.event.inputs.max_samples || 0 }}"
          RUN_ADDON="${{ github.event.inputs.run_addon || 'true' }}"
          RUN_PYTHON="${{ github.event.inputs.run_python || 'true' }}"
          ROUND_TRIP_TEST="${{ github.event.inputs.round_trip_test || 'true' }}"
          WHISPER_MODEL="${{ github.event.inputs.whisper_model || 'base' }}"
          NUM_RUNS="${{ github.event.inputs.num_runs || 3 }}"
          USE_GPU="${{ github.event.inputs.use_gpu || 'true' }}"
          LANGUAGE="${{ github.event.inputs.language || 'en-us' }}"

          # Set timeout based on dataset size and round-trip test
          if [ "$ROUND_TRIP_TEST" = "true" ]; then
            TIMEOUT=120
          else
            TIMEOUT=60
          fi

          # Update config.yaml with workflow inputs (using BSD sed syntax for macOS)
          sed -i '' "s|addon_version:.*|addon_version: \"${VERSION}\"|" benchmarks/client/config/config.yaml
          sed -i '' "s|timeout:.*|timeout: ${TIMEOUT}|" benchmarks/client/config/config.yaml
          sed -i '' "/^dataset:/,/^[^ ]/ s|  name:.*|  name: \"${DATASET}\"|" benchmarks/client/config/config.yaml
          sed -i '' "/^dataset:/,/^[^ ]/ s|  max_samples:.*|  max_samples: ${MAX_SAMPLES}|" benchmarks/client/config/config.yaml
          sed -i '' "/^comparison:/,/^[^ ]/ s|  run_addon:.*|  run_addon: ${RUN_ADDON}|" benchmarks/client/config/config.yaml
          sed -i '' "/^comparison:/,/^[^ ]/ s|  run_python:.*|  run_python: ${RUN_PYTHON}|" benchmarks/client/config/config.yaml
          sed -i '' "/^comparison:/,/^[^ ]/ s|  round_trip_test:.*|  round_trip_test: ${ROUND_TRIP_TEST}|" benchmarks/client/config/config.yaml
          sed -i '' "/^comparison:/,/^[^ ]/ s|  whisper_model:.*|  whisper_model: \"${WHISPER_MODEL}\"|" benchmarks/client/config/config.yaml
          sed -i '' "/^comparison:/,/^[^ ]/ s|  num_runs:.*|  num_runs: ${NUM_RUNS}|" benchmarks/client/config/config.yaml
          sed -i '' "/^model:/,/^[^ ]/ s|  useGPU:.*|  useGPU: ${USE_GPU}|" benchmarks/client/config/config.yaml
          sed -i '' "/^model:/,/^[^ ]/ s|  language:.*|  language: \"${LANGUAGE}\"|" benchmarks/client/config/config.yaml

          echo "=== Updated config.yaml ==="
          cat benchmarks/client/config/config.yaml

      - name: Install benchmark server dependencies
        working-directory: benchmarks/server
        run: |
          npm install
          npm run setup

      - name: Install Python server dependencies
        if: github.event.inputs.run_python == 'true'
        working-directory: benchmarks/python-server
        run: pip install -r requirements.txt

      - name: Install benchmark client dependencies
        working-directory: benchmarks/client
        run: pip install -r requirements.txt

      - name: Start TTS Addon server
        if: github.event.inputs.run_addon == 'true'
        working-directory: benchmarks/server
        run: |
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid
          sleep 5
          if ! kill -0 $(cat server.pid) 2>/dev/null; then
            echo "Addon server failed to start"
            cat server.log
            exit 1
          fi
          echo "Addon server started successfully on port 8080"

      - name: Start Python Native server
        if: github.event.inputs.run_python == 'true'
        working-directory: benchmarks/python-server
        run: |
          nohup python main.py > server.log 2>&1 &
          echo $! > server.pid
          sleep 5
          if ! kill -0 $(cat server.pid) 2>/dev/null; then
            echo "Python server failed to start"
            cat server.log
            exit 1
          fi
          echo "Python server started successfully on port 8081"

      - name: Run benchmark
        working-directory: benchmarks/client
        env:
          PYTHONUNBUFFERED: "1"
          HF_DATASETS_CACHE: /tmp/hf_cache
        run: |
          python -u -m src.tts.main --config config/config.yaml
          rm -rf /tmp/hf_cache || true

      - name: Stop servers
        if: always()
        run: |
          # Stop addon server
          if [ -f benchmarks/server/server.pid ]; then
            kill $(cat benchmarks/server/server.pid) || true
            rm benchmarks/server/server.pid
          fi

          # Stop python server
          if [ -f benchmarks/python-server/server.pid ]; then
            kill $(cat benchmarks/python-server/server.pid) || true
            rm benchmarks/python-server/server.pid
          fi

      - name: Display server logs
        if: always()
        run: |
          if [ -f benchmarks/server/server.log ]; then
            echo "=== Addon Server Logs ==="
            cat benchmarks/server/server.log
          fi

          if [ -f benchmarks/python-server/server.log ]; then
            echo "=== Python Server Logs ==="
            cat benchmarks/python-server/server.log
          fi

      - name: Display results summary
        if: always()
        run: |
          DATASET="${{ github.event.inputs.dataset || 'harvard' }}"
          MODEL_NAME="model"  # Default model name
          VERSION="${{ steps.version.outputs.version }}"

          echo "=== Benchmark Configuration ==="
          echo "Addon Version: $VERSION"
          echo "Dataset: $DATASET"
          echo "Max Samples: ${{ github.event.inputs.max_samples || 0 }}"
          echo "Run Addon: ${{ github.event.inputs.run_addon || 'true' }}"
          echo "Run Python: ${{ github.event.inputs.run_python || 'true' }}"
          echo "Round-Trip Test: ${{ github.event.inputs.round_trip_test || 'true' }}"
          echo "Whisper Model: ${{ github.event.inputs.whisper_model || 'base' }}"
          echo "Number of Runs: ${{ github.event.inputs.num_runs || 3 }}"
          echo "Use GPU: ${{ github.event.inputs.use_gpu || 'true' }}"
          echo "Language: ${{ github.event.inputs.language || 'en-us' }}"
          echo ""
          echo "Note: Model selection is automatic based on language (handled by setup.js)"
          echo ""

          # Display addon results if available
          if [ -f "benchmarks/results/${MODEL_NAME}_addon.md" ]; then
            echo "=== Addon Results ==="
            cat "benchmarks/results/${MODEL_NAME}_addon.md"
            echo ""
          fi

          # Display python results if available
          if [ -f "benchmarks/results/${MODEL_NAME}_python-native.md" ]; then
            echo "=== Python Native Results ==="
            cat "benchmarks/results/${MODEL_NAME}_python-native.md"
            echo ""
          fi

          # Display comparison if available
          if [ -f "benchmarks/results/${MODEL_NAME}_comparison.md" ]; then
            echo "=== Comparison Results ==="
            cat "benchmarks/results/${MODEL_NAME}_comparison.md"
          fi

      - name: Add results to job summary
        if: always()
        run: |
          MODEL_NAME="model"
          DATASET="${{ github.event.inputs.dataset || 'harvard' }}"
          VERSION="${{ steps.version.outputs.version }}"

          echo "## TTS Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Addon Version | ${VERSION} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dataset | ${DATASET} |" >> $GITHUB_STEP_SUMMARY
          echo "| Max Samples | ${{ github.event.inputs.max_samples || 0 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Addon | ${{ github.event.inputs.run_addon || 'true' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Python | ${{ github.event.inputs.run_python || 'true' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Round-Trip Test | ${{ github.event.inputs.round_trip_test || 'true' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Whisper Model | ${{ github.event.inputs.whisper_model || 'base' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Number of Runs | ${{ github.event.inputs.num_runs || 3 }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Use GPU | ${{ github.event.inputs.use_gpu || 'true' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Language | ${{ github.event.inputs.language || 'en-us' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** Model selection is automatic based on language (handled by setup.js)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if comparison results exist
          if [ -f "benchmarks/results/${MODEL_NAME}_comparison.md" ]; then
            echo "### Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat "benchmarks/results/${MODEL_NAME}_comparison.md" >> $GITHUB_STEP_SUMMARY
          else
            # Show individual results if comparison not available
            if [ -f "benchmarks/results/${MODEL_NAME}_addon.md" ]; then
              echo "### Addon Results" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              cat "benchmarks/results/${MODEL_NAME}_addon.md" >> $GITHUB_STEP_SUMMARY
            fi

            if [ -f "benchmarks/results/${MODEL_NAME}_python-native.md" ]; then
              echo "### Python Native Results" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              cat "benchmarks/results/${MODEL_NAME}_python-native.md" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-v${{ steps.version.outputs.version }}
          path: benchmarks/results/
          retention-days: 30

