name: On Merge Model Cache (Embed)

# Seeds `models-embed-llamacpp-v1-*`. Same reasoning as
# on-merge-model-cache-llm.yml: the integration workflow is only reachable from
# a pull_request_target caller, where cache-models takes its restore-only
# branch, so nothing writes the entry. Warm set is ~1.0 GB.

on:
  push:
    branches:
      - main
      - tmp-QVAC-24630-seed-proof

  # Longest gap must stay under the cache server's five-day prune window.
  # Offset from the other seeds so they do not contend for the same runner.
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  seed:
    needs: runner_names
    runs-on: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64 }}
    timeout-minutes: 60
    name: seed-model-cache

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      # Must match integration-test-embed-llamacpp.yml:96-99 exactly.
      - name: Seed integration test models
        uses: ./.github/actions/cache-models
        with:
          package: embed-llamacpp
