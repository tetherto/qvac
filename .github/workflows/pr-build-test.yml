name: PR build and test
# Carries the PR head: Merge Guard finds this run by it, and prebuild-reuse.mjs checks it before reusing a PR artifact.
run-name: PR build and test ${{ github.event.workflow_run.head_sha || inputs.sha || github.ref_name }}

# Native builds, C++ lint and tests, and desktop tests for packages on the CI contract, after trust and approval.
on:
  # PR checks starting on a PR, a label included: main's copy of this file builds the PR head that context finds.
  workflow_run:
    workflows: [PR checks]
    types: [requested]
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated package names or directories; empty selects by change
        type: string
        default: ""
      # Set by Merge Guard when a maintainer accepts a fork PR's .github/ changes; context checks both against the PR.
      pr:
        description: PR number to build at its head, instead of this ref
        type: string
        default: ""
      sha:
        description: That PR's head commit
        type: string
        default: ""

permissions: {}

# PR code never saves to the default branch's Actions cache.
cache-mode: read

# One run per PR, keyed on the trigger's head; a dispatch per ref, or per PR when it names one.
concurrency:
  group: pr-build-test-${{ github.event.workflow_run.head_repository.full_name || github.ref }}-${{ github.event.workflow_run.head_branch || inputs.pr }}
  cancel-in-progress: true

jobs:
  # The PR from the API; nothing else in the trigger is read. Every later job takes its commit and facts from here.
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    outputs:
      ok: ${{ steps.pr.outputs.ok }}
      refused: ${{ steps.pr.outputs.refused }}
      pr: ${{ steps.pr.outputs.pr }}
      sha: ${{ steps.pr.outputs.sha }}
      repository: ${{ steps.pr.outputs.repository }}
      fork: ${{ steps.pr.outputs.fork }}
      draft: ${{ steps.pr.outputs.draft }}
      base-sha: ${{ steps.pr.outputs.base-sha }}
      labels: ${{ steps.pr.outputs.labels }}
      action: ${{ steps.pr.outputs.action }}
      event: ${{ steps.pr.outputs.event }}
    steps:
      - name: Checkout actions
        uses: tetherto/qvac-actions/checkout@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: pr
        uses: ./.github/actions/workflow-run-pr
        with:
          github-token: ${{ github.token }}
          branches: main, release-*, feature-*, tmp-*
          status-context: qvac/pr-build-test

  select:
    needs: context
    if: needs.context.outputs.ok == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_select-projects.yml
    with:
      targets: ci:setup,build,cpp:lint,cpp:build,cpp:tests,test:integration,test:backend
      combine: desktop=test:integration+test:backend
      packages: ${{ inputs.packages }}
      event: ${{ needs.context.outputs.event }}

  fork-approval:
    needs: [context, select]
    if: needs.select.outputs.any == 'true'
    permissions:
      statuses: write
    uses: ./.github/workflows/reusable-fork-approval.yml
    with:
      fork: ${{ needs.context.outputs.fork == 'true' }}
      head-sha: ${{ needs.context.outputs.sha }}

  # Labels to stages, as main's ci-router: independent of approval, so a skip still reads as a routing choice.
  route:
    needs: [context, select]
    if: needs.select.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run_verified_checks: ${{ steps.route.outputs.run_verified_checks }}
      run_prebuilds: ${{ steps.route.outputs.run_prebuilds }}
      run_cpp_tests: ${{ steps.route.outputs.run_cpp_tests }}
      run_desktop: ${{ steps.route.outputs.run_desktop }}
    steps:
      - name: Checkout actions
        uses: tetherto/qvac-actions/checkout@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: route
        uses: ./.github/actions/ci-route-stages
        with:
          labels: ${{ needs.context.outputs.labels }}
          head-repo: ${{ needs.context.outputs.repository }}
          draft: ${{ needs.context.outputs.draft }}

  trust:
    needs: [context, select, fork-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      allowed: ${{ steps.trust.outputs.allowed }}
    steps:
      - name: Checkout actions
        uses: tetherto/qvac-actions/checkout@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: trust
        uses: ./.github/actions/pr-check-trust
        with:
          github-token: ${{ github.token }}
          # A dispatch that names a PR builds PR code, so it gets the fork rules a workflow_run build does.
          event: ${{ needs.context.outputs.pr != '' && 'workflow_run' || '' }}
          action: ${{ needs.context.outputs.action }}
          head-sha: ${{ needs.context.outputs.sha }}
          head-repo: ${{ needs.context.outputs.repository }}
          draft: ${{ needs.context.outputs.draft }}
          labels: ${{ needs.context.outputs.labels }}

  # Providers build first, once per configuration: for the labelled build, the baseline build, or C++ lint alone.
  providers:
    needs: [context, select, route, trust]
    if: needs.trust.outputs.allowed == 'true' && needs.route.result == 'success'
    cache-mode: read
    permissions:
      contents: read
      actions: read
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      rows: >-
        ${{ toJSON(needs.route.outputs.run_prebuilds == 'true' && fromJSON(needs.select.outputs.matrices)['build:providers']
        || fromJSON(needs.select.outputs.matrices)['build:baseline'][0] != null && fromJSON(needs.select.outputs.matrices)['build:baseline:providers']
        || needs.route.outputs.run_verified_checks == 'true' && fromJSON(needs.select.outputs.matrices)['cpp:lint:providers'] || fromJSON('[]')) }}
      reuse: true
      repository: ${{ needs.context.outputs.repository }}
      ref: ${{ needs.context.outputs.sha }}
      pr: ${{ needs.context.outputs.pr }}

  # A cpp:tests baseline package builds and runs its C++ tests without the labels; the labels widen to every package.
  build:
    needs: [context, select, route, trust, providers]
    if: always() && !cancelled() && needs.trust.outputs.allowed == 'true' && needs.route.result == 'success' && (needs.providers.result == 'success' || needs.providers.result == 'skipped') && (needs.route.outputs.run_prebuilds == 'true' || fromJSON(needs.select.outputs.matrices)['build:baseline'][0] != null)
    cache-mode: read
    permissions:
      contents: read
      actions: read
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/_build.yml
    secrets: inherit
    with:
      rows: ${{ toJSON(needs.route.outputs.run_prebuilds == 'true' && fromJSON(needs.select.outputs.matrices).build || fromJSON(needs.select.outputs.matrices)['build:baseline']) }}
      reuse: true
      repository: ${{ needs.context.outputs.repository }}
      ref: ${{ needs.context.outputs.sha }}
      pr: ${{ needs.context.outputs.pr }}

  # Folds a package's build jobs into prebuilds-<slug>, taking its own prebuilds from each job's artifact.
  merge:
    needs: [select, route, providers, build]
    if: always() && !cancelled() && needs.build.result == 'success' && (needs.providers.result == 'success' || needs.providers.result == 'skipped')
    name: merge ${{ matrix.project.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.select.outputs.projects) }}
    env:
      BUILT: ${{ contains(matrix.project.targets, 'build') && (needs.route.outputs.run_prebuilds == 'true' || matrix.project.cppBaseline) }}
    steps:
      - name: Checkout actions
        uses: tetherto/qvac-actions/checkout@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - if: env.BUILT == 'true'
        uses: tetherto/qvac-actions/download-artifact@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          pattern: prebuild-${{ matrix.project.slug }}-*
          path: prebuilds
          merge-multiple: "true"
      - if: env.BUILT == 'true'
        uses: tetherto/qvac-actions/upload-artifact@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          name: prebuilds-${{ matrix.project.slug }}
          path: prebuilds/${{ matrix.project.dir }}/prebuilds

  cpp-lint:
    needs: [context, select, route, trust, providers]
    if: always() && !cancelled() && needs.trust.outputs.allowed == 'true' && needs.route.outputs.run_verified_checks == 'true' && (needs.providers.result == 'success' || needs.providers.result == 'skipped')
    cache-mode: read
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/_cpp-lint.yml
    secrets: inherit
    with:
      rows: ${{ toJSON(fromJSON(needs.select.outputs.matrices)['cpp:lint']) }}
      repository: ${{ needs.context.outputs.repository }}
      ref: ${{ needs.context.outputs.sha }}
      base: ${{ needs.context.outputs.base-sha }}

  # C++ and desktop tests run against the build's outputs; a package with no build target runs against the checkout.
  cpp-tests:
    needs: [context, select, route, trust, build]
    if: always() && !cancelled() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && fromJSON(needs.select.outputs.matrices).build[0] == null)) && needs.trust.outputs.allowed == 'true' && (needs.route.outputs.run_cpp_tests == 'true' || fromJSON(needs.select.outputs.matrices)['cpp:tests:baseline'][0] != null)
    cache-mode: read
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    uses: ./.github/workflows/_cpp-tests.yml
    secrets: inherit
    with:
      rows: ${{ toJSON(needs.route.outputs.run_cpp_tests == 'true' && fromJSON(needs.select.outputs.matrices)['cpp:tests'] || fromJSON(needs.select.outputs.matrices)['cpp:tests:baseline']) }}
      repository: ${{ needs.context.outputs.repository }}
      ref: ${{ needs.context.outputs.sha }}

  desktop:
    needs: [context, select, route, trust, build]
    if: always() && !cancelled() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && fromJSON(needs.select.outputs.matrices).build[0] == null)) && needs.trust.outputs.allowed == 'true' && needs.route.outputs.run_desktop == 'true'
    cache-mode: read
    permissions:
      contents: read
      actions: read
      packages: read
      id-token: write
    uses: ./.github/workflows/_desktop.yml
    secrets: inherit
    with:
      rows: ${{ toJSON(fromJSON(needs.select.outputs.matrices).desktop) }}
      repository: ${{ needs.context.outputs.repository }}
      ref: ${{ needs.context.outputs.sha }}

  # One cross-platform report per package whose test:integration asks for it, from the desktop jobs' perf artifacts.
  perf-report:
    needs: [select, desktop]
    if: always() && !cancelled() && needs.desktop.result != 'skipped'
    name: perf-report ${{ matrix.project.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.select.outputs.projects) }}
    steps:
      - if: matrix.project.perfReport
        name: Checkout actions and report scripts
        uses: tetherto/qvac-actions/checkout@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          sparse-checkout: |
            .github/actions
            scripts/perf-report
          persist-credentials: false
      - if: matrix.project.perfReport
        uses: tetherto/qvac-actions/setup-node@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          node-version: lts/*
      - if: matrix.project.perfReport
        uses: ./.github/actions/run-mobile-integration-tests/combine-perf-reports
        with:
          artifact-pattern: ${{ matrix.project.slug }}-perf-*
          report-title: ${{ matrix.project.perfReport.title }}
          exclude: ${{ matrix.project.perfReport.exclude }}

  # Fails when a package's prebuild or C++ tests failed; a skip passes only when routing chose not to run.
  status:
    needs: [context, select, route, providers, build, merge, cpp-tests]
    if: always() && !cancelled() && needs.context.outputs.pr != '' && needs.select.outputs.any == 'true'
    name: status ${{ matrix.project.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.select.outputs.projects) }}
    env:
      CI_ROUTER_RESULT: ${{ needs.route.result }}
    steps:
      - name: Prebuild
        if: matrix.project.prebuildStatus
        env:
          # A package the run did not build reads as a routing skip, even when a baseline package started the job; a
          # failed provider fails every package, its consumers and itself included.
          RESULT: ${{ (needs.route.outputs.run_prebuilds == 'true' || matrix.project.cppBaseline) && (needs.providers.result == 'failure' && 'failure' || needs.build.result == 'success' && needs.merge.result || needs.build.result) || 'skipped' }}
          RUN: ${{ (needs.route.outputs.run_prebuilds == 'true' || matrix.project.cppBaseline) && 'true' || needs.route.outputs.run_prebuilds }}
        run: &verdict |
          [ "$RESULT" = success ] && exit 0
          [ "$RESULT" = skipped ] && [ "$CI_ROUTER_RESULT" = success ] && [ "$RUN" = false ] && exit 0
          echo "::error::$RESULT (routing: $CI_ROUTER_RESULT, run: $RUN)"
          exit 1
      - name: C++ tests
        if: "!cancelled() && matrix.project.cppStatus"
        env:
          RESULT: ${{ (needs.route.outputs.run_cpp_tests == 'true' || matrix.project.cppBaseline) && needs.cpp-tests.result || 'skipped' }}
          RUN: ${{ (needs.route.outputs.run_cpp_tests == 'true' || matrix.project.cppBaseline) && 'true' || needs.route.outputs.run_cpp_tests }}
        run: *verdict

  # Starts Merge Guard once the status jobs are done.
  # Fails a refused PR or a failed selection, which Merge Guard requires.
  selected:
    needs: [context, select]
    if: always() && !cancelled() && needs.context.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          OK: ${{ needs.context.outputs.ok }}
          REFUSED: ${{ needs.context.outputs.refused }}
          SELECT: ${{ needs.select.result }}
        run: |
          if [ "$OK" != true ]; then echo "::error::${REFUSED:-Not built: the PR head moved}"; exit 1; fi
          if [ "$SELECT" != success ]; then echo "::error::Package selection: $SELECT"; exit 1; fi

  merge-guard:
    needs: [context, selected, status]
    if: always() && !cancelled() && needs.context.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.context.outputs.pr }}
          SHA: ${{ needs.context.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pr-gate-merge.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f pr="$PR" -f sha="$SHA"

  # Not named qvac-merge-guard: that is the required check's job, and a second one would share its context.
  # Reads this run's jobs, so the table shows each package, stage and failed job, not only the reusable callers.
  # Also sets qvac/pr-build-test on the PR head; it runs no PR code.
  summary:
    needs: [context, select, fork-approval, route, trust, providers, build, merge, cpp-lint, cpp-tests, desktop, perf-report, status, selected]
    if: always() && needs.context.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: write
    steps:
      - name: Checkout actions
        uses: tetherto/qvac-actions/checkout@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECTS: ${{ needs.select.outputs.projects }}
          TITLE: PR build and test
        run: node .github/scripts/summarize-run.mjs
      - if: "!cancelled() && needs.context.outputs.pr != ''"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.context.outputs.sha }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=success; description="Passed or skipped by routing"
          if [ "$FAILED" = "true" ]; then state=failure; description="A job failed or was cancelled"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" -f context=qvac/pr-build-test \
            -f description="$description" -f target_url="$RUN_URL" > /dev/null
