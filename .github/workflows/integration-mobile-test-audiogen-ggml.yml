name: Mobile Integration Tests (AudioGen GGML)

# On-device (AWS Device Farm) integration smoke for @qvac/audiogen-ggml, built on
# the shared .github/actions/run-mobile-integration-tests composite (same layer
# tts-ggml / parakeet / the other mobile addons use).
#
# Android pre-stages the ACE-Step GGUFs from the Device Farm host and adb-pushes
# them before Appium starts, avoiding multi-gigabyte phone-side downloads. iOS
# retains its proven on-device registry path. Device Farm project + iOS pool
# fall back to the shared ONNX_TTS ARNs until dedicated audiogen ARNs exist.

on:
  workflow_call:
    inputs:
      prebuild_package:
        description: "Full NPM package spec (name@version) whose prebuilds to pin instead of the freshly-built artifact (e.g. @qvac/audiogen-ggml@0.1.0). Empty = artifact-first."
        type: string
        required: false
        default: ""
      ref:
        description: "Git ref to checkout"
        type: string
        required: false
      repository:
        description: "Repository to checkout"
        type: string
        required: false
      workdir:
        description: "Relative path to package directory in monorepo"
        type: string
        required: false
        default: "packages/audiogen-ggml"
      run_rtf_benchmarks:
        description: "Run the on-device RTF benchmark (extracts metrics from Device Farm logs post-run)"
        type: boolean
        required: false
        default: false
  # Manual on-demand path. A dispatched run targets ONE platform and the
  # device(s) chosen below — it never runs the full default pool. The
  # workflow_call path (benchmarks / weekend / on-merge) is unchanged.
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to run on (a manual run targets one platform)."
        type: choice
        required: true
        options: [Android, iOS]
        default: Android
      device:
        description: "Device from the common pool. Pick '(custom)' to type your own in 'devices_custom'. Valid names + how to find them: docs/ci/MOBILE-ON-DEMAND.md."
        type: choice
        required: false
        options:
          - "(custom)"
          - "Google Pixel 9"
          - "Google Pixel 8"
          - "Samsung Galaxy S25 Ultra"
          - "Apple iPhone 17"
          - "Apple iPhone 16 Pro"
          - "Apple iPhone 15"
        default: "(custom)"
      devices_custom:
        description: "Comma-separated device model(s), e.g. 'Pixel 9, Pixel 8'. Overrides the dropdown; use for new/uncommon devices or several at once. Must match a Device Farm model (list + how to check: docs/ci/MOBILE-ON-DEMAND.md)."
        type: string
        required: false
        default: ""
      device_model_operator:
        description: "Model match: EQUALS (exact fleet model only — default; dropdown values are exact fleet names) or CONTAINS (any model containing the value; use for shorthand like 'Pixel 9'). EQUALS avoids billing a different/slower variant."
        type: choice
        required: false
        options: [EQUALS, CONTAINS]
        default: EQUALS
      tests:
        description: "Optional test filter: a mocha --grep regex matched by test NAME, not file name (e.g. 'runAudioGenSmoke'; combine several with '|'). Empty = full mobile suite. Where to find valid names: docs/ci/MOBILE-ON-DEMAND.md."
        type: string
        required: false
        default: ""
      ref:
        description: "Git ref (branch/tag/SHA) to test. Leave blank to use the branch you dispatch from."
        type: string
        required: false
        default: ""
      package_spec:
        description: "Package to test (name@version). Leave EMPTY only when this workflow is called from a run that built prebuilds — a standalone dispatch has none, so empty resolves the PUBLISHED @latest, not your branch's native code; use @qvac/audiogen-ggml@... for npm or @tetherto/audiogen-ggml-mono@... for GPR to force-install a specific build."
        type: string
        required: false
        default: ""
      workdir:
        description: "Relative path to package directory in monorepo"
        type: string
        required: false
        default: "packages/audiogen-ggml"
      # NOTE: RTF benchmarks are intentionally NOT a manual-dispatch input. A
      # manual run always sets `platform`, which takes precedence in the build
      # matrix, so a dispatched run_rtf_benchmarks would be silently ignored.
      # Benchmarks run via workflow_call (benchmark-performance-audiogen-ggml).

permissions:
  contents: read

concurrency:
  # workflow_dispatch: at most one manual mobile run per (workflow, branch) at a
  # time — a fresh dispatch cancels the in-flight one so a re-run never stacks a
  # second Device Farm run. Different branches map to different groups, so the
  # same addon can still be tested on 2-3 branches in parallel. workflow_call
  # (benchmarks / weekend / on-merge) is keyed per run and never cancels —
  # inputs.platform is only ever set on a manual dispatch, and under workflow_call
  # github.* resolves to the CALLER, so run_id keeps each call self-contained.
  group: ${{ inputs.platform != '' && format('mobile-dispatch-{0}-{1}', github.workflow, github.ref) || format('mobile-call-{0}', github.run_id) }}
  cancel-in-progress: ${{ inputs.platform != '' }}

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  # Manual (workflow_dispatch) runs must name a device that exists on Device
  # Farm. This gate fails fast BEFORE the (~120 min) build or any Device Farm
  # run, so a typo or an empty selection costs nothing. Skipped for workflow_call.
  validate-devices:
    name: Validate device selection
    if: inputs.platform != ''
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      # This job runs in the `release` environment with OIDC, so — like the
      # build-and-test job below — it must source the composite action from the
      # default branch, never from a caller-selected ref. (Consequence: the
      # validate-devices action is only available here once this PR is merged.)
      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false
          path: trusted-actions
          persist-credentials: false
      # The composite action stays pinned to the default branch above (the
      # release-environment supply-chain guard). test-groups.json is DATA only
      # (runner names + shard count, never executed), so it must come from the
      # SAME ref the build executes (inputs.ref || github.sha) — otherwise a
      # branch that renames/adds runners or shards would pass stale default-branch
      # validation and could run zero tests.
      - name: Checkout validation data (matches the built ref)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            packages/audiogen-ggml/test/mobile/test-groups.json
          sparse-checkout-cone-mode: false
          path: validation-data
          persist-credentials: false
      - name: Validate requested devices
        uses: ./trusted-actions/.github/actions/run-mobile-integration-tests/validate-devices
        with:
          platform: ${{ inputs.platform }}
          devices: ${{ inputs.devices_custom != '' && inputs.devices_custom || (inputs.device != '(custom)' && inputs.device || '') }}
          device-model-operator: ${{ inputs.device_model_operator }}
          tests: ${{ inputs.tests }}
          test-groups-path: validation-data/packages/audiogen-ggml/test/mobile/test-groups.json
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

  # A Device Farm test failure fails this run on every trigger (no
  # continue-on-error). Mobile is on-demand for this addon (not part of
  # on-pr-audiogen-ggml.yml's PR lane), so this does not gate PR merges — it
  # makes manual/scheduled runs trustworthy instead of silently green.
  build-and-test:
    name: Build ${{ matrix.platform }}${{ inputs.run_rtf_benchmarks && format(' ({0} {1})', matrix.dit_variant, matrix.use_gpu && 'gpu' || 'cpu') || '' }} and Run E2E Tests
    # validate-devices is skipped on workflow_call (its `skipped` result keeps
    # this job running); on a manual run a bad/empty device selection blocks the
    # build before it starts, so no long build is wasted on a typo.
    needs: [runner_names, validate-devices]
    if: ${{ !cancelled() && needs.runner_names.result == 'success' && (needs.validate-devices.result == 'success' || needs.validate-devices.result == 'skipped') }}
    runs-on: ${{ matrix.platform == 'iOS' && needs.runner_names.outputs.macos_ios || needs.runner_names.outputs.linux_ubuntu2404_x64 }}
    environment: release
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      # The default matrix runs the functional smoke on one Android and one iOS
      # device. The engine loads the ACE-Step stages sequentially, so the
      # load-time peak is a single stage instead of all six at once and create()
      # does not jetsam-OOM on a non-entitled iPhone during the ~3 GB load.
      # A Device Farm failure on either platform fails the run (see the
      # build-and-test comment above — no continue-on-error).
      #
      # The benchmark matrix (run_rtf_benchmarks=true) sweeps the three DiT
      # variants on CPU and GPU (Vulkan on Android, Metal on iOS) — one Device
      # Farm row per configuration, since a row must download the variant's
      # ~3 GB GGUF set on-device before it can measure anything. `sft` runs the
      # ~50-step schedule instead of turbo's ~8, so its rows drop the warmup and
      # shorten the clip to have any chance of fitting a device slot.
      # On workflow_dispatch, build only the chosen platform (functional smoke).
      # workflow_call keeps the benchmark sweep / default both-platform matrix.
      matrix: ${{ fromJSON(inputs.platform != '' && (inputs.platform == 'iOS' && '{"include":[{"platform":"iOS","os":"macos-14"}]}' || '{"include":[{"platform":"Android","os":"ubuntu-24.04"}]}') || inputs.run_rtf_benchmarks && '{"include":[{"platform":"Android","os":"ubuntu-24.04","dit_variant":"turbo-q4","use_gpu":false,"warmup":1,"runs":2,"duration":15},{"platform":"Android","os":"ubuntu-24.04","dit_variant":"turbo-q8","use_gpu":false,"warmup":1,"runs":2,"duration":15},{"platform":"Android","os":"ubuntu-24.04","dit_variant":"sft","use_gpu":false,"warmup":0,"runs":1,"duration":10},{"platform":"Android","os":"ubuntu-24.04","dit_variant":"turbo-q4","use_gpu":true,"warmup":1,"runs":2,"duration":15},{"platform":"Android","os":"ubuntu-24.04","dit_variant":"turbo-q8","use_gpu":true,"warmup":1,"runs":2,"duration":15},{"platform":"Android","os":"ubuntu-24.04","dit_variant":"sft","use_gpu":true,"warmup":0,"runs":1,"duration":10},{"platform":"iOS","os":"macos-14","dit_variant":"turbo-q4","use_gpu":false,"warmup":1,"runs":2,"duration":15},{"platform":"iOS","os":"macos-14","dit_variant":"turbo-q8","use_gpu":false,"warmup":1,"runs":2,"duration":15},{"platform":"iOS","os":"macos-14","dit_variant":"sft","use_gpu":false,"warmup":0,"runs":1,"duration":10},{"platform":"iOS","os":"macos-14","dit_variant":"turbo-q4","use_gpu":true,"warmup":1,"runs":2,"duration":15},{"platform":"iOS","os":"macos-14","dit_variant":"turbo-q8","use_gpu":true,"warmup":1,"runs":2,"duration":15},{"platform":"iOS","os":"macos-14","dit_variant":"sft","use_gpu":true,"warmup":0,"runs":1,"duration":10}]}' || '{"include":[{"platform":"Android","os":"ubuntu-24.04"},{"platform":"iOS","os":"macos-14"}]}') }}

    steps:
      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.repository }}
          # Always pull the trusted composite actions from the default branch —
          # this is the supply-chain guard for the release-environment job, for
          # both workflow_call and workflow_dispatch. Note: manual-devices
          # scheduling is only available once this PR is merged to the default
          # branch, so it cannot be validated pre-merge on this addon by design.
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-actions
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout addon repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: addon
          fetch-depth: 0

      - name: Setup mobile test environment
        uses: ./trusted-actions/.github/actions/run-mobile-integration-tests/setup
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: ${{ inputs.workdir || 'packages/audiogen-ggml' }}
          addon-npm-name: '@qvac/audiogen-ggml'
          prebuild-artifact-prefix: 'prebuild-audiogen-ggml-'
          pat-token: ${{ secrets.GITHUB_TOKEN }}
          # workflow_call passes prebuild_package; workflow_dispatch passes package_spec.
          package-version: ${{ inputs.prebuild_package || inputs.package_spec }}
          force-npm-prebuild: ${{ (inputs.prebuild_package || inputs.package_spec) != '' && 'true' || 'false' }}

      - name: Build mobile app
        id: build
        uses: ./trusted-actions/.github/actions/run-mobile-integration-tests/build-mobile-app
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: ${{ inputs.workdir || 'packages/audiogen-ggml' }}
          addon-npm-name: '@qvac/audiogen-ggml'
          ios-build-cert-base64: ${{ secrets.TEST_APP_APPLE_DISTRIBUTION_CERTIFICATE }}
          ios-build-cert-password: ${{ secrets.APPLE_P12_PASSWORD }}
          ios-keychain-password: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          ios-provisioning-profile-base64: ${{ secrets.TEST_APP_APPLE_PROVISIONING_PROFILE }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

      # On a manual run with a test filter, run only the matching tests (single
      # grepped spec). Empty filter / workflow_call keeps the default behaviour.
      - name: Resolve manual test filter
        id: manual_tests
        if: inputs.platform != '' && inputs.tests != ''
        shell: bash
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          # Reject anything but mocha-safe grep characters so a manual `tests`
          # value cannot break out of the generated WDIO config on the Device
          # Farm host (defense-in-depth; the sink is also JSON-encoded).
          if ! printf '%s' "$TESTS" | grep -Eq '^[A-Za-z0-9_ |().*+-]+$'; then
            echo "::error::Invalid 'tests' filter '$TESTS'. Allowed: letters, digits, and _ space | ( ) . * + - (a mocha --grep on test NAMES, e.g. 'runAddonTest' or 'runFoo|runBar')."
            exit 1
          fi
          MANUAL_GROUPS=$(jq -nc --arg g "$TESTS" '[{name:"manual", grep:$g}]')
          echo "groups=$MANUAL_GROUPS" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials for Android model pre-stage
        if: matrix.platform == 'Android'
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # 6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-1
          role-duration-seconds: 7200

      - name: Generate model pre-stage commands (Android)
        id: prestage
        if: matrix.platform == 'Android'
        working-directory: addon/${{ inputs.workdir || 'packages/audiogen-ggml' }}
        shell: bash
        env:
          MODEL_S3_BUCKET: ${{ secrets.MODEL_S3_BUCKET }}
          MODEL_PRESIGN_EXPIRES_IN: '7200'
        run: |
          node scripts/generate-mobile-prestage-block.js \
            android "${{ matrix.dit_variant || 'turbo-q4' }}" \
            > "$RUNNER_TEMP/audiogen-prestage-block.txt"
          {
            echo "block<<PRESTAGE_EOF"
            cat "$RUNNER_TEMP/audiogen-prestage-block.txt"
            echo "PRESTAGE_EOF"
          } >> "$GITHUB_OUTPUT"

      # The benchmark runner is deliberately absent from test-groups.json, so it
      # never runs on a normal PR. A benchmark run builds the device-farm groups
      # from perf-tests.json instead, so ONLY the benchmark executes. Adding a
      # benchmark means adding its function name to perf-tests.json — no
      # workflow change needed.
      - name: Resolve benchmark test-groups from perf-tests.json
        id: perf_groups
        if: ${{ inputs.run_rtf_benchmarks }}
        working-directory: addon/${{ inputs.workdir || 'packages/audiogen-ggml' }}
        shell: bash
        run: |
          set -euo pipefail
          GREP=$(jq -r 'join("|")' test/mobile/perf-tests.json)
          if [ -z "$GREP" ]; then
            echo "::error::perf-tests.json is empty — no benchmarks to run"
            exit 1
          fi
          echo "Benchmark grep: $GREP"
          printf 'groups=[{"name":"perf","grep":"%s"}]\n' "$GREP" >> "$GITHUB_OUTPUT"

      - name: Upload to Device Farm
        id: upload
        uses: ./trusted-actions/.github/actions/run-mobile-integration-tests/upload-to-devicefarm
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: ${{ inputs.workdir || 'packages/audiogen-ggml' }}
          app-path: ${{ steps.build.outputs.app-path }}
          app-type: ${{ steps.build.outputs.app-type }}
          app-name: ${{ steps.build.outputs.app-name }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          device-farm-project-arn: ${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN_AUDIOGEN_GGML || secrets.AWS_DEVICE_FARM_PROJECT_ARN_ONNX_TTS }}
          # A manual test filter wins; else empty on a normal run => auto-detect
          # test-groups.json (functional); set on a benchmark run => only the benchmark.
          test-groups: ${{ steps.manual_tests.outputs.groups != '' && steps.manual_tests.outputs.groups || steps.perf_groups.outputs.groups }}
          enables-perf: ${{ inputs.run_rtf_benchmarks && 'true' || 'false' }}
          # The device has no workflow env, so the benchmark's configuration
          # travels in the config file the runner pushes and os.setEnv()s before
          # the tests load. One row = one (variant, provider) combination.
          extra-device-env: ${{ inputs.run_rtf_benchmarks && format('QVAC_AUDIOGEN_GGML_BENCHMARK_DIT_VARIANT={0};QVAC_AUDIOGEN_GGML_BENCHMARK_USE_GPU={1};QVAC_AUDIOGEN_GGML_BENCHMARK_WARMUP_RUNS={2};QVAC_AUDIOGEN_GGML_BENCHMARK_RUNS={3};QVAC_AUDIOGEN_GGML_BENCHMARK_DURATION_S={4};QVAC_AUDIOGEN_GGML_BENCHMARK_DEVICE={5}-device-farm;QVAC_AUDIOGEN_GGML_BENCHMARK_RUNNER=aws-device-farm-{5};QVAC_AUDIOGEN_GGML_BENCHMARK_LABEL={5}-{0}-{6}', matrix.dit_variant, matrix.use_gpu && '1' || '0', matrix.warmup, matrix.runs, matrix.duration, matrix.platform, matrix.use_gpu && 'gpu' || 'cpu') || '' }}
          # Android gets the host-generated block above; iOS keeps its existing
          # on-device registry download. No shared action changes are required.
          extra-pre-test-commands: ${{ steps.prestage.outputs.block }}
          # Keep enough budget for iOS download and both platforms' model load.
          mocha-timeout-ms: '3600000'
          wdio-waitfor-timeout-ms: '600000'

      - name: Schedule Device Farm test runs
        id: schedule
        uses: ./trusted-actions/.github/actions/run-mobile-integration-tests/schedule-test-run
        with:
          platform: ${{ matrix.platform }}
          device-farm-project-arn: ${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN_AUDIOGEN_GGML || secrets.AWS_DEVICE_FARM_PROJECT_ARN_ONNX_TTS }}
          ios-device-pool-arn: ${{ secrets.IOS_DEVICE_POOL_ARN_AUDIOGEN_GGML || secrets.IOS_DEVICE_POOL_ARN_ONNX_TTS }}
          app-upload-arn: ${{ steps.upload.outputs.app-upload-arn }}
          test-package-upload-arn: ${{ steps.upload.outputs.test-package-upload-arn }}
          test-specs: ${{ steps.upload.outputs.test-specs }}
          # On workflow_dispatch, pin the run to the chosen device(s); otherwise
          # keep the composite's default dual-flagship scheduling for workflow_call.
          scheduling-mode: ${{ inputs.platform != '' && 'manual-devices' || 'dual-flagship' }}
          device-models: ${{ inputs.platform != '' && (inputs.devices_custom != '' && inputs.devices_custom || (inputs.device != '(custom)' && inputs.device || '')) || '' }}
          device-model-operator: ${{ inputs.platform != '' && inputs.device_model_operator || '' }}

      - name: Monitor Device Farm test runs
        id: monitor
        uses: ./trusted-actions/.github/actions/run-mobile-integration-tests/monitor-test-run
        with:
          run-arns: ${{ steps.schedule.outputs.run-arns }}
          run-count: ${{ steps.schedule.outputs.run-count }}
          test-specs: ${{ steps.upload.outputs.test-specs }}

      - name: Cancel Device Farm runs on workflow cancellation
        if: cancelled() && steps.schedule.outputs.run-arns != '' && steps.schedule.outputs.run-arns != '[]'
        uses: ./trusted-actions/.github/actions/run-mobile-integration-tests/cancel-device-farm-runs
        with:
          run-arns: ${{ steps.schedule.outputs.run-arns }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

      - name: Collect and upload Device Farm logs
        if: always() && !cancelled()
        uses: ./trusted-actions/.github/actions/run-mobile-integration-tests/collect-and-upload-logs
        with:
          platform: ${{ matrix.platform }}
          addon-npm-name: '@qvac/audiogen-ggml'
          enables-perf: ${{ inputs.run_rtf_benchmarks && 'true' || 'false' }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          run-arns: ${{ steps.schedule.outputs.run-arns }}

      # A benchmark run prints one [PERF_REPORT_START] block (plus chunked
      # fragments, for log sinks that truncate) into bare_console.log. The
      # artifact name is what benchmark-performance-audiogen-ggml.yml's
      # summarize job downloads (pattern perf-report-audiogen-ggml-*).
      - name: Extract and report AudioGen GGML performance
        if: always() && !cancelled() && inputs.run_rtf_benchmarks && steps.schedule.outputs.run-arns != '[]' && steps.schedule.outputs.run-arns != ''
        uses: ./trusted-actions/.github/actions/run-mobile-integration-tests/extract-addon-perf
        with:
          platform: ${{ matrix.platform }}
          filter: ''
          merge: 'true'
          unzip-customer-artifacts: 'true'
          step-summary-title: 'Mobile Performance: audiogen-ggml (${{ matrix.platform }}, ${{ matrix.dit_variant }} ${{ matrix.use_gpu && ''gpu'' || ''cpu'' }})'
          artifact-name: perf-report-audiogen-ggml-${{ matrix.platform }}-${{ matrix.dit_variant }}-${{ matrix.use_gpu && 'gpu' || 'cpu' }}-${{ github.run_number }}

      - name: Comment results on PR
        if: always() && !cancelled()
        uses: ./trusted-actions/.github/actions/run-mobile-integration-tests/comment-on-pr
        with:
          addon-npm-name: '@qvac/audiogen-ggml'
          platform: ${{ matrix.platform }}
          test-result: ${{ steps.monitor.outputs.test-result }}
          test-total: ${{ steps.monitor.outputs.test-total }}
          test-passed: ${{ steps.monitor.outputs.test-passed }}
          test-failed: ${{ steps.monitor.outputs.test-failed }}
          test-skipped: ${{ steps.monitor.outputs.test-skipped }}
          user-test-passed: ${{ steps.monitor.outputs.user-test-passed }}
          user-test-failed: ${{ steps.monitor.outputs.user-test-failed }}


