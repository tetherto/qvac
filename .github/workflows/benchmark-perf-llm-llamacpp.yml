name: Benchmark Performance — LLM Parameter Sweep

# Manually-triggered LLM benchmark (no sweep inputs — everything is in the scripts).
# Desktop: bare benchmarks/performance/llm-parameter-sweep.js on a Linux GPU runner.
# Mobile:  runBenchmarkPerfTest on Android + iOS via Device Farm.
#
# To change what runs, edit:
#   desktop: models.manifest.json (models) + llm-parameter-sweep.config.js (sweep dims)
#   mobile:  test/integration/_benchmark-perf.js (shared runner) + the
#            benchmark-perf-*.test.js shards (one per model x KV-cache type)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA of the benchmark code+addon to build and run. Defaults to the branch this workflow is launched from."
        required: false
        type: string
      run_desktop:
        description: "Run desktop benchmark (Linux GPU)"
        required: false
        default: true
        type: boolean
      run_mobile:
        description: "Run mobile benchmark (Android / iOS via Device Farm)"
        required: false
        default: true
        type: boolean
      desktop_platforms:
        description: 'JSON array of desktop platforms. Default ["linux-x64"]. QVAC-25043 needs ["linux-x64","win32-x64","darwin-x64","linux-arm64"]; darwin-arm64 is also available. darwin-x64 and linux-arm64 are CPU-only runners.'
        required: false
        default: '["linux-x64"]'
        type: string
      sweep_params:
        description: >-
          OPTIONAL. Which parameters to sweep. Empty (the default) runs
          everything, exactly as before. Params separate with "," and their
          values with "|". Name a param bare for its full range, or
          "name=a|b" for specific values; anything not named is pinned, so a
          focused run does not pay for axes it is not about. Naming an
          additive sweep (load-mode, batch-sweep) selects that sweep instead
          of the throughput grid. Known params: quantization, device,
          ctx-size, threads, batch-size, ubatch-size, flash-attn,
          cache-type-k, cache-type-v, reasoning-budget, load-mode,
          batch-sweep. Examples - "load-mode" (the QVAC-25043 qualifying run:
          12 mobile shards instead of 86, and no 6h grid),
          "load-mode=auto|mmap,device=gpu", "quantization=Q4_0|Q8_0". An axis a
          shard runs internally, or a selection matching no case, fails in the
          context job rather than running something other than what was asked.
        required: false
        default: ''
        type: string
      summarize_only:
        description: "Summarize a PREVIOUS run only: re-render its report in ~1 min, skip the ~6h benchmarks. Requires 'Previous run ID to summarize' below."
        required: false
        default: false
        type: boolean
      artifact_run_id:
        description: "Previous run ID to summarize (the number in that run's URL). Only used when 'summarize_only' is checked."
        required: false
        type: string
      compare_run_id:
        description: "Optional baseline run ID to compare against (the number in that run's URL). Adds Δ TTFT / TPS / ppTPS columns vs that run."
        required: false
        type: string

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  context:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      desktop_matrix: ${{ steps.desktop.outputs.desktop_matrix }}
      sweep_params: ${{ steps.selector.outputs.sweep_params }}
      run_grid: ${{ steps.selector.outputs.run_grid }}
      run_load_mode: ${{ steps.selector.outputs.run_load_mode }}
      run_batch: ${{ steps.selector.outputs.run_batch }}
    steps:
      # Resolve the ref FIRST, so the matrix this job validates against is the
      # same revision prebuild and the benchmarks will run. Checking out the
      # workflow's own branch here would validate one revision and execute
      # another whenever `ref` is set.
      - id: ref
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "ref=${INPUT_REF:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      # The selector is parsed by the canonical implementation, not a copy: a
      # second parser in another language is a second set of rules to drift.
      - name: Checkout benchmark matrix
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ steps.ref.outputs.ref }}
          sparse-checkout: |
            .github/scripts/plan-desktop-platforms.py
            .github/scripts/resolve-sweep-selection.js
            packages/llm-llamacpp/test/integration/_benchmark-matrix.js
          sparse-checkout-cone-mode: false

      # The desktop matrix is built here rather than with `include:` in the
      # job. A matrix `include` entry whose key does not match an existing
      # matrix value is APPENDED as a new combination, so listing every
      # platform's runner under `include` would run all of them on every
      # dispatch regardless of desktop_platforms. Emitting the selected
      # {platform, runner} pairs as one JSON array avoids that entirely.
      - id: desktop
        name: Plan desktop platforms
        shell: bash
        env:
          DESKTOP_PLATFORMS: ${{ inputs.desktop_platforms }}
        run: |
          python3 .github/scripts/plan-desktop-platforms.py >> "$GITHUB_OUTPUT"

      # One selector implementation, end to end: the same parser the runners
      # and the mobile planner use. A typo, an axis that cannot narrow a
      # shard, or a selection matching no case fails here in ~30s rather than
      # after the prebuild.
      - id: selector
        name: Resolve sweep selection
        shell: bash
        env:
          SWEEP_PARAMS: ${{ inputs.sweep_params }}
          RUN_MOBILE: ${{ inputs.run_mobile }}
        run: |
          node .github/scripts/resolve-sweep-selection.js >> "$GITHUB_OUTPUT"

  # Fast fail-first gate (~30s, no prebuild): the benchmark shards are generated
  # from test/integration/_benchmark-matrix.js and not committed, so the
  # committed integration.auto.cjs and this workflow's test_groups must stay in
  # lockstep with the matrix. prebuild depends on this job, so a drift fails the
  # run in ~30s instead of after the expensive prebuild.
  verify-shards:
    needs:
      - context
    if: inputs.run_mobile && !inputs.summarize_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mobile_matrix: ${{ steps.plan.outputs.mobile_matrix }}
    steps:
      - name: Checkout matrix + generated artifacts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ needs.context.outputs.ref }}
          sparse-checkout: |
            packages/llm-llamacpp/scripts/generate-benchmark-shards.js
            packages/llm-llamacpp/test/integration/_benchmark-matrix.js
            packages/llm-llamacpp/test/mobile/integration.auto.cjs
            .github/workflows/benchmark-perf-llm-llamacpp.yml
            .github/scripts/plan-mobile-matrix.js
          sparse-checkout-cone-mode: false
      - name: Verify benchmark matrix is in sync
        working-directory: packages/llm-llamacpp
        run: node scripts/generate-benchmark-shards.js --check

      # The mobile matrix is PLANNED here rather than written literally in the
      # YAML below, so `sweep_params` actually reduces what Device Farm runs.
      # This job already checks out the canonical matrix and gates on its
      # drift check, so the plan cannot be emitted from a stale definition.
      # A selection matching no canonical case throws, failing the run in
      # ~30s instead of dispatching nothing.
      - name: Plan mobile matrix
        id: plan
        env:
          SWEEP_PARAMS: ${{ inputs.sweep_params }}
        run: |
          node .github/scripts/plan-mobile-matrix.js >> "$GITHUB_OUTPUT"

  # Records, into a run-meta.json artifact, the exact addon version this run
  # benchmarks (from the checked-out package.json) AND the mobile shard list it
  # targets (from the checked-out matrix). The summarize/comparison step reads
  # both from this artifact, so a stamped run can never be mislabelled and its
  # coverage is always scored against its OWN matrix — even when re-rendered
  # after the matrix has grown.
  stamp-version:
    needs:
      - context
    if: ${{ !inputs.summarize_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout package.json + benchmark matrix
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ needs.context.outputs.ref }}
          sparse-checkout: |
            packages/llm-llamacpp/package.json
            packages/llm-llamacpp/test/integration/_benchmark-matrix.js
          sparse-checkout-cone-mode: false
      - name: Write run-meta.json
        env:
          SWEEP_PARAMS: ${{ inputs.sweep_params }}
          RUN_MOBILE: ${{ inputs.run_mobile }}
        shell: bash
        run: |
          mkdir -p run-meta
          # Stamp the shards THIS dispatch selected, not the whole matrix.
          # Coverage is scored against this list, so stamping all 86 on a
          # load-mode-only run would report 74 phantom gaps for cases the
          # dispatch deliberately did not select.
          node -e "
            const pkg = require('./packages/llm-llamacpp/package.json')
            const m = require('./packages/llm-llamacpp/test/integration/_benchmark-matrix.js')
            // expectedShards is the MOBILE coverage target. A desktop-only
            // dispatch requests none, so stamping the planned mobile shards
            // there would report coverage missing for a leg that never ran.
            const wantsMobile = process.env.RUN_MOBILE === 'true'
            const selected = m.parseSweepParams(process.env.SWEEP_PARAMS || '')
            const planned = new Set(
              wantsMobile ? m.planMobileBatches(selected).flatMap((b) => b.groups.map((g) => g.grep)) : []
            )
            const expectedShards = m.matrix()
              .filter((cell) => planned.has(m.runFunctionName(cell)))
              .map(m.mobileShardKey)
            require('fs').writeFileSync('run-meta/run-meta.json', JSON.stringify({
              addonVersion: '@qvac/llm-llamacpp@' + pkg.version,
              sweepParams: process.env.SWEEP_PARAMS || '',
              expectedShards
            }) + '\\n')
          "
          cat run-meta/run-meta.json
      - name: Upload run-meta
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: benchmark-run-meta-${{ github.run_number }}
          path: run-meta/
          retention-days: 90

  prebuild:
    needs:
      - context
      - verify-shards
    # verify-shards is a gate so a shard drift fails before this expensive build.
    # It is skipped on a desktop-only run (run_mobile false), so !cancelled() +
    # the explicit result check let that case through rather than a skipped gate
    # skipping the build.
    if: (inputs.run_mobile || inputs.run_desktop) && !inputs.summarize_only && !cancelled() && needs.verify-shards.result != 'failure'
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/prebuilds-llm-llamacpp.yml
    # Bounded: prebuild needs the GPR/signing secrets; no repository input, and the
    # release environment + fork-approval keep this to trusted in-repo refs.
    secrets: inherit
    with:
      repository: ${{ github.repository }}
      ref: ${{ needs.context.outputs.ref }}

  desktop-benchmark:
    needs:
      - context
      - prebuild
    # !cancelled() + the explicit prebuild-success check so the skip of the
    # mobile-only verify-shards job (on a desktop-only run) does not propagate
    # through prebuild and skip this job.
    if: inputs.run_desktop && !inputs.summarize_only && !cancelled() && needs.prebuild.result == 'success'
    name: Desktop Parameter Sweep (${{ matrix.platform }})
    # QVAC-25043 requires load-mode evidence on each desktop platform the
    # project calibrates for, so the desktop leg is a matrix rather than a
    # single Linux runner. linux-x64 alone is the default because the routine
    # parameter-sweep cadence is a ~6h Linux run and widening it by default
    # would multiply that; `desktop_platforms` opts the others in per dispatch.
    strategy:
      fail-fast: false
      # Sequential: these are shared self-hosted GPU runners and a parallel
      # desktop leg would contend with the mobile legs for the same pool.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.context.outputs.desktop_matrix) }}
    runs-on: ${{ startsWith(matrix.runner, '[') && fromJSON(matrix.runner) || matrix.runner }}
    timeout-minutes: 360

    steps:
      # Self-hosted runners are persistent, so the workspace must be wiped
      # between runs (skipped on the rare github-hosted fallback).
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ needs.context.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Install addon dependencies
        working-directory: packages/llm-llamacpp
        run: npm install

      # Run the exact linux-x64 binary the prebuild job built (the same artifacts
      # the integration tests consume) instead of compiling on the runner, so the
      # benchmark needs no build toolchain and matches what ships.
      - name: Download prebuilds (from artifacts)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          # Workspace-relative, NOT ${{ runner.temp }}: on Windows that expands
          # to a backslash path (D:\a\_temp), and the backslashes are escape
          # characters to the Git Bash step below, which mangled the path and
          # failed the whole win32-x64 leg of run 35778027044 before the sweep
          # ran. A relative path has no backslashes on any runner.
          path: prebuilds-staging
          merge-multiple: true

      - name: Move prebuilds into the addon
        shell: bash
        run: |
          mkdir -p packages/llm-llamacpp/prebuilds
          cp -r prebuilds-staging/* packages/llm-llamacpp/prebuilds/
          ls -la packages/llm-llamacpp/prebuilds/

      - name: Detect GPU
        id: gpu
        shell: bash
        run: |
          gpu_name=$(nvidia-smi --query-gpu=name --format=csv,noheader 2>/dev/null | head -1 | tr -d '\r' || echo "GPU")
          echo "name=$gpu_name" >> "$GITHUB_OUTPUT"

      - name: Install benchmark dependencies
        working-directory: packages/llm-llamacpp/benchmarks/performance
        run: npm install

      - name: Download models
        working-directory: packages/llm-llamacpp/benchmarks/performance
        # Models are public (unsloth Qwen3.5 GGUFs) — no HF_TOKEN needed.
        run: node ./prepare-models.js --target addon

      # Skippable so a load-mode dispatch does not have to pay for it. The
      # parameter sweep is a ~6h GPU run; the load-mode sweep is minutes, and
      # on the CPU-only legs (darwin-x64, linux-arm64) the parameter sweep
      # would additionally be asking a GPU-shaped run of a runner with no GPU.
      # Skipped when the selector names only load-mode, so a load-mode run
      # does not pay for a ~6h grid it did not ask for.
      - name: Run parameter sweep
        if: needs.context.outputs.run_grid == 'true' || needs.context.outputs.run_batch == 'true'
        working-directory: packages/llm-llamacpp/benchmarks/performance
        shell: bash
        env:
          SWEEP_PARAMS: ${{ needs.context.outputs.sweep_params }}
        run: |
          npx --yes bare ./llm-parameter-sweep.js \
            --addon-source local \
            --sweep-params "$SWEEP_PARAMS"

      # The load-mode sweep is a separate runner, not another case in the
      # parameter sweep, because each of its samples needs its own process:
      # unload() leaves mode-dependent resident memory behind and the page
      # cache carries across modes, so cells measured in one shared process
      # record load order rather than load mode (see load-mode-probe.js).
      # It writes into the same results directory, so the summarize job picks
      # it up with everything else.
      - name: Run load-mode sweep
        if: needs.context.outputs.run_load_mode == 'true'
        working-directory: packages/llm-llamacpp/benchmarks/performance
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          # No device is forced here. The leg requests what the sweep selects,
          # and a GPU request that silently lands on the CPU is recorded as a
          # backend mismatch rather than published as GPU evidence — that, not
          # a platform-name allowlist, is what keeps the report honest.
          # `device=cpu` in sweep_params asks for CPU measurements deliberately.
          SWEEP_PARAMS: ${{ needs.context.outputs.sweep_params }}
        run: |
          node ./load-mode-sweep.js \
            --addon-source local \
            --platform "$PLATFORM" \
            --sweep-params "$SWEEP_PARAMS" \
            --results-dir results/parameter-sweep

      # Stamp the desktop device name (incl. detected GPU) into the results so
      # the renderer shows it even on a later summarize-only re-render, when this
      # job didn't run.
      - name: Stamp desktop device
        if: always()
        shell: bash
        env:
          GPU_NAME: ${{ steps.gpu.outputs.name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p packages/llm-llamacpp/benchmarks/performance/results/parameter-sweep
          printf '{"desktopDevice":"Desktop %s (%s)"}\n' "$PLATFORM" "$GPU_NAME" \
            > packages/llm-llamacpp/benchmarks/performance/results/parameter-sweep/desktop-meta.json
          cat packages/llm-llamacpp/benchmarks/performance/results/parameter-sweep/desktop-meta.json

      # The run summary is rendered by the summarize job (unified desktop +
      # mobile view); this job just uploads the raw sweep results.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          # Per-platform artifact name: a matrix of desktop legs would
          # otherwise collide on one name and only the first would survive.
          name: llm-param-sweep-desktop-${{ matrix.platform }}-${{ github.run_number }}
          path: packages/llm-llamacpp/benchmarks/performance/results/parameter-sweep/
          retention-days: 90
          if-no-files-found: ignore

  # Mobile is sharded one group per (model x KV-cache type) = 70 groups, plus a
  # small additive batch-sweep group (size x batch = 4), so each Device Farm
  # session finishes inside the fixed 20-minute iOS per-test ceiling. All of them
  # in one reused-workflow call do NOT fit: Android serializes the runs against
  # its device pool and the macOS runner fills its disk collecting logs. So we
  # split the groups into one batch per KV-cache type (10 each — the proven
  # in-budget load) plus one 'batchsweep' batch (4), and run them sequentially
  # (max-parallel: 1) to avoid Device Farm pool contention. Each batch raises the
  # job timeout to 180 for headroom (proven 10-shard wall ~119 min) and gets a
  # distinct artifact_suffix so its perf-report doesn't collide; summarize
  # aggregates all of them. The TurboQuant/PolarQuant batches (tbq*/pq*) are
  # Vulkan + CPU only, so they show Crashed on iOS (Metal) and Samsung GPU. The
  # batchsweep group holds batch === ubatch at a fixed Q4_0/f16 baseline against a
  # long prompt: batch is orthogonal to quant/KV, so it is swept once here rather
  # than crossed with all 70 cross-product shards. The loadmode group (6) holds
  # the six load_mode values at the same fixed baseline, orthogonal for the same
  # reason; Android is where it earns its keep, since Adreno's OpenCL backend
  # reports no mmap support and 'auto' resolves differently there than on Metal.
  # These wrappers are deliberately
  # absent from the addon's test-groups.json, so this override is the only path
  # that runs them — normal mobile integration runs never trigger the benchmark.
  mobile-benchmark:
    needs:
      - context
      - prebuild
      - verify-shards
    if: inputs.run_mobile && !inputs.summarize_only
    permissions:
      contents: read
      packages: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Planned from the canonical matrix in verify-shards, so
        # `sweep_params` actually reduces what Device Farm runs. Writing the
        # batches literally here is what made the selector cosmetic: the job
        # executed all 86 shards while run-meta recorded only the selected
        # ones, so coverage described a different run than the one that ran.
        include: ${{ fromJSON(needs.verify-shards.outputs.mobile_matrix) }}
    uses: ./.github/workflows/integration-mobile-test-llm-llamacpp.yml
    # Bounded: Device Farm needs the AWS/Apple/pool secrets; no repository input, and
    # the release environment + fork-approval keep this to trusted in-repo refs.
    secrets: inherit
    with:
      repository: ${{ github.repository }}
      ref: ${{ needs.context.outputs.ref }}
      job_timeout_minutes: 180
      test_groups: ${{ matrix.groups }}
      artifact_suffix: ${{ matrix.cache }}-

  # Aggregates desktop + mobile artifacts into one unified markdown report.
  # Runs after benchmarks finish, or standalone when summarize_only=true
  # (set artifact_run_id to re-render a previous run).
  # Set compare_run_id to add Δ TPS / TTFT / ppTPS columns vs a baseline run.
  summarize:
    needs:
      - context
      - stamp-version
      - desktop-benchmark
      - mobile-benchmark
    if: always() && needs.context.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout aggregator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ needs.context.outputs.ref }}
          sparse-checkout: |
            packages/llm-llamacpp/benchmarks/performance/render-report.js
            packages/llm-llamacpp/test/integration/_benchmark-matrix.js
            packages/llm-llamacpp/package.json

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Get addon version
        id: addon_ver
        shell: bash
        run: |
          ver=$(node -e "process.stdout.write(require('./packages/llm-llamacpp/package.json').version)" 2>/dev/null || true)
          echo "version=${ver:+@qvac/llm-llamacpp@$ver}" >> "$GITHUB_OUTPUT"

      # Artifacts are matched by name prefix and scoped to a single run via
      # run-id, so the run number is never needed — run-id alone identifies the
      # run. Defaults to the current run; artifact_run_id targets a previous one.
      - name: Download desktop sweep artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: llm-param-sweep-desktop-*
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: combined-reports
        continue-on-error: true

      - name: Download mobile perf-report artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: perf-report-llamacpp-llm-*
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: combined-reports
        continue-on-error: true

      # The version this run benchmarked (run-meta.json), authoritative over any
      # manual --addon-version. Lands alongside the data so the renderer reads it.
      - name: Download run-meta (current)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: benchmark-run-meta-*
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: combined-reports
        continue-on-error: true

      - name: Download baseline desktop artifact for comparison
        if: inputs.compare_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: llm-param-sweep-desktop-*
          run-id: ${{ inputs.compare_run_id }}
          github-token: ${{ github.token }}
          path: baseline-reports
        continue-on-error: true

      - name: Download baseline mobile artifacts for comparison
        if: inputs.compare_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: perf-report-llamacpp-llm-*
          run-id: ${{ inputs.compare_run_id }}
          github-token: ${{ github.token }}
          path: baseline-reports
        continue-on-error: true

      - name: Download baseline run-meta for comparison
        if: inputs.compare_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: benchmark-run-meta-*
          run-id: ${{ inputs.compare_run_id }}
          github-token: ${{ github.token }}
          path: baseline-reports
        continue-on-error: true

      - name: Verify baseline artifacts downloaded
        if: inputs.compare_run_id != ''
        shell: bash
        env:
          COMPARE_RUN_ID: ${{ inputs.compare_run_id }}
        run: |
          if [ "$(find baseline-reports -name '*.json' -type f 2>/dev/null | wc -l)" -eq 0 ]; then
            echo "::error::No baseline artifacts found for run $COMPARE_RUN_ID (wrong run ID, or artifacts expired past the 90-day retention). A comparison was requested but cannot be produced."
            exit 1
          fi

      - name: Render unified benchmark report
        shell: bash
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || github.run_id }}
          COMPARE_RUN_ID: ${{ inputs.compare_run_id }}
          ADDON_VERSION: ${{ steps.addon_ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # Count with wc, not `find | grep -q`: under `set -o pipefail` grep -q
          # closes the pipe on the first match, find gets SIGPIPE, and the
          # pipeline reports a false non-zero — misreading a present (and, with
          # more shards, larger) report set as "none found". wc consumes all of
          # find's output, so find never gets SIGPIPE.
          if [ "$(find combined-reports -name '*.json' -type f 2>/dev/null | wc -l)" -eq 0 ]; then
            echo "::error::No benchmark reports found for run $ARTIFACT_RUN_ID. Nothing to render."
            exit 1
          fi
          mkdir -p benchmark-artifacts

          # Build args as an array so values containing spaces (e.g. the GPU
          # device name "Desktop (NVIDIA RTX 3090)") survive intact.
          # The desktop device name (incl. GPU) comes from the stamped
          # desktop-meta.json inside the sweep artifact, so it's correct on
          # re-renders too; no --desktop-device needed here.
          ARGS=(--dir combined-reports --output benchmark-artifacts/qwen35-benchmark-findings.md --html benchmark-artifacts/qwen35-benchmark-charts.html --charts-url "__CHARTS_URL__")
          if [ -n "$ADDON_VERSION" ]; then
            ARGS+=(--addon-version "$ADDON_VERSION")
          fi
          if [ -d baseline-reports ] && [ "$(find baseline-reports -name '*.json' -type f 2>/dev/null | wc -l)" -ne 0 ]; then
            ARGS+=(--compare-dir baseline-reports)
            if [ -n "$COMPARE_RUN_ID" ]; then
              ARGS+=(--baseline-run-id "$COMPARE_RUN_ID")
              ARGS+=(--baseline-run-url "https://github.com/$REPO/actions/runs/$COMPARE_RUN_ID")
            fi
          fi

          # Android cannot currently run ANY llm-llamacpp integration test: the
          # bundle reaches bare-type (brittle -> bare-assert -> bare-inspect ->
          # bare-type) and the app links no libbare-type, so every shard dies
          # with ADDON_NOT_FOUND before its body runs. Naming it here keeps the
          # summary from showing an unexplained hole where Android should be.
          # Remove this once the mobile app links the addon.
          ARGS+=(--known-issue "Android: every shard fails with ADDON_NOT_FOUND on bare-type (brittle -> bare-assert -> bare-inspect -> bare-type; the app links no libbare-type), so no Android row appears below. iOS is unaffected. Pre-existing — this workflow last ran mobile in July 2026.")

          node packages/llm-llamacpp/benchmarks/performance/render-report.js "${ARGS[@]}"

      # Upload first so the artifact's download URL is known, then substitute it
      # into the report's chart-download link before writing the run summary — so
      # the link in the summary points straight at the download instead of telling
      # readers to scroll to the artifacts section. Falls back to the run page URL
      # if the upload didn't yield a URL.
      - name: Upload consolidated report
        id: upload
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: qwen35-benchmark-findings-${{ github.run_number }}
          path: benchmark-artifacts/
          retention-days: 90
          if-no-files-found: ignore

      - name: Add to run summary
        if: always()
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          MD_FILE="benchmark-artifacts/qwen35-benchmark-findings.md"
          if [ -f "$MD_FILE" ]; then
            url="$ARTIFACT_URL"
            if [ -z "$url" ]; then url="$RUN_URL"; fi
            sed "s|__CHARTS_URL__|$url|g" "$MD_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No consolidated benchmark report available." >> "$GITHUB_STEP_SUMMARY"
          fi
