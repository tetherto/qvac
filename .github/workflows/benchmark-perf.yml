name: LLM Perf Benchmark

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Optional comma-separated model IDs (e.g. qwen3-1.7b,qwen3-4b)'
        default: ''
      repeats:
        description: 'Repetitions per config'
        default: '5'
      addon_source:
        description: 'Addon source for sweep: local or npm'
        default: 'local'
      hf_token:
        description: 'Hugging Face token for gated models (optional)'
        default: ''
      debug:
        description: 'Enable debug logging (true/false)'
        default: 'false'

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bare runtime
        run: npm install -g bare-runtime

      - name: Install and build addon
        working-directory: packages/qvac-lib-infer-llamacpp-llm
        run: npm install && npm run build

      - name: Install benchmark dependencies
        working-directory: packages/qvac-lib-infer-llamacpp-llm/benchmarks/performance
        run: npm install

      - name: Prepare and verify prompts
        working-directory: packages/qvac-lib-infer-llamacpp-llm/benchmarks/performance
        env:
          HF_TOKEN: ${{ inputs.hf_token || secrets.HF_TOKEN }}
        run: npm run prepare:prompts && npm run verify:prompts

      - name: Run parameter sweep
        working-directory: packages/qvac-lib-infer-llamacpp-llm/benchmarks/performance
        shell: bash
        env:
          HF_TOKEN: ${{ inputs.hf_token || secrets.HF_TOKEN }}
        run: |
          args=(--repeats "${{ inputs.repeats }}" --addon-source "${{ inputs.addon_source }}")
          if [[ -n "${{ inputs.models }}" ]]; then args+=(--models "${{ inputs.models }}"); fi
          if [[ "${{ inputs.debug }}" == "true" ]]; then args+=(--debug); fi
          npm run run:param-sweep -- "${args[@]}"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-perf-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            packages/qvac-lib-infer-llamacpp-llm/benchmarks/performance/results/parameter-sweep/*.json
            packages/qvac-lib-infer-llamacpp-llm/benchmarks/performance/results/parameter-sweep/*.jsonl
            packages/qvac-lib-infer-llamacpp-llm/benchmarks/performance/results/parameter-sweep/*.md
