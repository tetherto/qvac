name: PR checks
# PR build and test and SDK e2e read the event, and the label for a labeled run, from this name.
run-name: >-
  ${{ github.event_name == 'pull_request' && format('[{0}{1}] {2}', github.event.action,
  github.event.label.name && format(': {0}', github.event.label.name) || '', github.event.pull_request.title)
  || github.workflow }}

# Lint, typecheck, unit tests, generated files and dependency checks for the changed contract packages and dependents,
# through Nx from the PR's own targets with no secrets, so forks get real results. The SDK pod (ci:sdk) runs sdk-checks.yml.
on:
  # labeled only starts PR build and test and SDK e2e, which run on this workflow being requested; jobs here skip.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main, release-*, feature-*, tmp-*]
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated package names or directories; empty selects every package on the contract
        type: string
        default: ""

permissions:
  contents: read

# A label's run has its own group, so it never cancels the PR's checks.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  select:
    if: github.event.action != 'labeled'
    uses: ./.github/workflows/_select-projects.yml
    with:
      targets: lint,typecheck,test:unit,verify:generated,verify:deps
      packages: ${{ inputs.packages }}

  # A range on a workspace package that excludes its workspace version makes pnpm install the npm copy instead, so a
  # bump updates its dependents' ranges in the same pull request.
  workspace-ranges:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pull request
        uses: tetherto/qvac-actions/checkout@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: tetherto/qvac-actions/setup-node@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          node-version: lts/*
      - run: node scripts/ci/check-workspace-ranges.mjs

  # Every package that builds the qvac-fabric port pins one version, and records it in package.json as qvac["qvac-fabric"].
  # On every pull request, since a pin or a record lives in any package's vcpkg.json or package.json.
  fabric-lockstep:
    name: qvac-fabric version lockstep
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pull request
        uses: tetherto/qvac-actions/checkout@f8e0afb2e5c51b94abdef6bea77caa4a9fb3adaf # 0.6.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/verify-qvac-fabric-lockstep

  # No git URLs and no dev or tmp prerelease pins in a contract package's dependencies.
  disallowed-deps:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request
        uses: tetherto/qvac-actions/checkout@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: tetherto/qvac-actions/setup-node@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          node-version: lts/*
      - uses: tetherto/qvac-actions/setup-pnpm@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
      - run: |
          pnpm install --frozen-lockfile --ignore-scripts --filter .
          node scripts/ci/check-disallowed-deps.mjs

  checks:
    needs: select
    if: needs.select.outputs.any == 'true'
    name: checks (${{ matrix.project.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NX_DAEMON: "false"
      NX_NO_CLOUD: "true"
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.select.outputs.projects) }}
    steps:
      - name: Checkout actions
        uses: tetherto/qvac-actions/checkout@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Checkout pull request
        uses: tetherto/qvac-actions/checkout@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: src
          persist-credentials: "false"
      - uses: tetherto/qvac-actions/setup-node@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          node-version: lts/*
      - uses: tetherto/qvac-actions/setup-pnpm@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          package-json-file: src/package.json
      # A workspace install, so a package checks against its dependencies' sources in this PR, not their published builds.
      - name: Install
        working-directory: src
        run: pnpm install --frozen-lockfile
      # One step per target; nx run-many skips a target the package does not declare.
      - name: lint
        working-directory: src
        env:
          PROJECT: ${{ matrix.project.name }}
        run: pnpm exec nx run-many -t lint -p "$PROJECT" --outputStyle=stream
      - name: typecheck
        working-directory: src
        env:
          PROJECT: ${{ matrix.project.name }}
        run: pnpm exec nx run-many -t typecheck -p "$PROJECT" --outputStyle=stream
      - name: test:unit
        working-directory: src
        env:
          PROJECT: ${{ matrix.project.name }}
        run: pnpm exec nx run-many -t test:unit -p "$PROJECT" --outputStyle=stream
      - name: verify:generated
        working-directory: src
        env:
          PROJECT: ${{ matrix.project.name }}
        run: pnpm exec nx run-many -t verify:generated -p "$PROJECT" --outputStyle=stream
      - name: verify:deps
        working-directory: src
        env:
          PROJECT: ${{ matrix.project.name }}
        run: pnpm exec nx run-many -t verify:deps -p "$PROJECT" --outputStyle=stream
