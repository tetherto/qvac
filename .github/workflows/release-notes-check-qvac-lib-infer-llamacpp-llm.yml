name: Release Notes Check (LLM)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "packages/qvac-lib-infer-llamacpp-llm/**"

permissions:
  pull-requests: read
  contents: read
  
jobs:
  release-notes-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release notes on version bump (monorepo-aware)
        uses: actions/github-script@v7
        with:
          script: |
            const pullNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const baseSha = context.payload.pull_request.base.sha;
            const headSha = context.payload.pull_request.head.sha;

            // List PR files with pagination
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pullNumber, per_page: 100 }
            );

            // Helper: decode base64 content response from getContent
            function decodeContent(resp) {
              // getContent can return either a file object or an array (directory listing)
              if (!resp || Array.isArray(resp.data)) return null;
              const { content, encoding } = resp.data;
              if (!content) return null;
              if (encoding === 'base64') {
                return Buffer.from(content, 'base64').toString('utf8');
              }
              // Fallback
              return content;
            }

            async function readJsonAtRef(path, ref) {
              try {
                const resp = await github.rest.repos.getContent({ owner, repo, path, ref });
                const raw = decodeContent(resp);
                if (!raw) return null;
                return JSON.parse(raw);
              } catch (e) {
                core.warning(`Could not read ${path} at ref ${ref}: ${e.message}`);
                return null;
              }
            }

            async function readTextAtRef(path, ref) {
              try {
                const resp = await github.rest.repos.getContent({ owner, repo, path, ref });
                return decodeContent(resp);
              } catch (e) {
                core.warning(`Could not read ${path} at ref ${ref}: ${e.message}`);
                return null;
              }
            }

            function escapeRegExp(value) {
              return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            function extractVersionSection(changelog, version) {
              const lines = changelog.split(/\r?\n/);
              const headingPattern = new RegExp(`^## \\[${escapeRegExp(version)}\\] - \\d{4}-\\d{2}-\\d{2}\\s*$`);

              let start = -1;
              for (let i = 0; i < lines.length; i++) {
                if (headingPattern.test(lines[i])) {
                  start = i;
                  break;
                }
              }

              if (start === -1) {
                return { found: false, body: '' };
              }

              let end = lines.length;
              for (let i = start + 1; i < lines.length; i++) {
                if (/^## \[/.test(lines[i])) {
                  end = i;
                  break;
                }
              }

              return {
                found: true,
                body: lines.slice(start + 1, end).join('\n').trim(),
              };
            }

            // Find any changed package.json files (root or nested)
            const packageJsonFiles = files
              .filter(f => f.filename === 'package.json' || f.filename.endsWith('/package.json'))
              .map(f => f.filename);

            if (packageJsonFiles.length === 0) {
              core.info('No package.json files changed; no release notes required.');
              return;
            }

            // Convenience set for quick existence checks
            const changedFileSet = new Set(files.map(f => f.filename));

            const failures = [];

            for (const pkgPath of packageJsonFiles) {
              const baseJson = await readJsonAtRef(pkgPath, baseSha);
              const headJson = await readJsonAtRef(pkgPath, headSha);

              if (!baseJson || !headJson) {
                core.info(`Skipping ${pkgPath}: unable to read base/head contents.`);
                continue;
              }

              const baseVer = baseJson.version;
              const headVer = headJson.version;

              if (!headVer) {
                core.info(`Skipping ${pkgPath}: no "version" field found in head.`);
                continue;
              }

              const bumped = baseVer !== headVer;

              if (!bumped) {
                core.info(`No version bump detected for ${pkgPath} (version stays ${headVer}).`);
                continue;
              }

              // Derive package directory and changelog path.
              const pkgDir = pkgPath.includes('/') ? pkgPath.slice(0, pkgPath.lastIndexOf('/')) : '';
              const changelogPath = pkgDir ? `${pkgDir}/CHANGELOG.md` : 'CHANGELOG.md';

              core.info(
                `Detected version bump in ${pkgPath}: ${baseVer ?? '<missing>'} -> ${headVer}. ` +
                `Validating changelog section in: ${changelogPath}`
              );

              if (!changedFileSet.has(changelogPath)) {
                failures.push(
                  `- ${pkgPath} bumped ${baseVer ?? '<missing>'} -> ${headVer} but \`${changelogPath}\` was not changed.\n` +
                  `  Add a changelog entry with heading: \`## [${headVer}] - YYYY-MM-DD\``
                );
                continue;
              }

              const changelog = await readTextAtRef(changelogPath, headSha);
              if (!changelog) {
                failures.push(
                  `- ${pkgPath} bumped ${baseVer ?? '<missing>'} -> ${headVer} but \`${changelogPath}\` could not be read from PR head.`
                );
                continue;
              }

              const section = extractVersionSection(changelog, headVer);
              if (!section.found) {
                failures.push(
                  `- ${pkgPath} bumped ${baseVer ?? '<missing>'} -> ${headVer} but \`${changelogPath}\` has no section heading \`## [${headVer}] - YYYY-MM-DD\`.`
                );
                continue;
              }

              if (!section.body) {
                failures.push(
                  `- ${pkgPath} bumped ${baseVer ?? '<missing>'} -> ${headVer} but changelog section \`## [${headVer}] - YYYY-MM-DD\` is empty.`
                );
              }
            }

            if (failures.length > 0) {
              core.setFailed(
                `Release notes check failed.\n\n` +
                `One or more package.json version bumps were detected without matching changelog release notes:\n\n` +
                failures.join('\n\n')
              );
            } else {
              core.info('All detected version bumps have matching changelog sections.');
            }
