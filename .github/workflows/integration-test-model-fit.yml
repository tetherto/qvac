name: Integration Tests (Model Fit)

on:
  workflow_call:
    inputs:
      ref:
        description: "ref"
        type: string
      repository:
        type: string
      fabric-overlay-artifact:
        description: >-
          Workflow-run artifact name for PR-built @qvac/fabric prebuilds. Empty
          skips the overlay (published npm baseline).
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to test"
        type: string
        required: false
        default: main
      prebuild_package:
        description: "NPM package containing prebuilds (e.g. @qvac/model-fit@1.0.0)"
        type: string
        required: true

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  run-integration-tests:
    needs: runner_names
    runs-on: ${{ matrix.runner || matrix.os }}
    environment: release
    name: ${{ matrix.platform }}-${{ matrix.arch }}-integration-tests
    permissions:
      contents: read
      packages: read

    env:
      WORKDIR: packages/model-fit

    strategy:
      fail-fast: false
      matrix:
        include:
          # Run Linux x64 tests on both Ubuntu 22.04 and 24.04 to ensure compatibility
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            runner: ${{ needs.runner_names.outputs.linux_ubuntu2204_x64_gpu }}
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            runner: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64_gpu }}
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            runner: ${{ needs.runner_names.outputs.ubuntu_2204_arm }}
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            runner: ${{ needs.runner_names.outputs.ubuntu_2404_arm }}
          - os: macos-15-xlarge
            platform: darwin
            arch: arm64
          - os: macos-15-large
            runner: ${{ needs.runner_names.outputs.macos_15_large }}
            platform: darwin
            arch: x64
          - os: windows-2025
            platform: win32
            arch: x64
            runner: ${{ needs.runner_names.outputs.win_2025_x64_gpu }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache integration test models
        id: model-cache
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/cache-models
        with:
          package: model-fit

      - name: Install NPM dependencies
        working-directory: ${{ env.WORKDIR }}
        run: |
          npm install

      - name: Download fabric-prebuilds for overlay
        if: ${{ inputs.fabric-overlay-artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ inputs.fabric-overlay-artifact }}
          path: ${{ runner.temp }}/fabric-prebuilds

      - name: Overlay PR @qvac/fabric prebuilds
        if: ${{ inputs.fabric-overlay-artifact != '' }}
        uses: tetherto/qvac/.github/actions/overlay-local-fabric@6620d695d3a07cafe3931182e7844dde376a23f8
        with:
          workdir: ${{ env.WORKDIR }}
          prebuilds-root: ${{ runner.temp }}/fabric-prebuilds
          platform: ${{ matrix.platform == 'windows' && 'win32' || matrix.platform }}
          arch: ${{ matrix.arch }}

      - name: Install bare tooling
        run: npm install -g --force bare bare-make

      # Prebuilds live in the merged `prebuilds` bundle. Extract to runner.temp,
      # not the package tree: unscoped merge-multiple into $GITHUB_WORKSPACE is
      # CodeQL actions/artifact-poisoning/critical when this reusable workflow
      # is reachable from workflow_dispatch callers (on-pr / on-merge). Same
      # staging pattern as integration-test-classification-ggml.yml. Scoping to
      # `name: prebuilds` also keeps fabric-prebuilds out of this addon's
      # prebuilds/, so resolveBackendsDir() cannot pass via the mobile fallback.
      - name: Download prebuilds bundle
        if: ${{ !inputs.prebuild_package }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: prebuilds
          path: ${{ runner.temp }}/prebuilds-staging

      - name: Move prebuilds from staging to workspace (Unix)
        if: ${{ !inputs.prebuild_package && matrix.platform != 'win32' }}
        shell: bash
        run: |
          SRC="${{ runner.temp }}/prebuilds-staging/${{ matrix.platform }}-${{ matrix.arch }}"
          if [ ! -d "$SRC" ]; then
            echo "::error::No '${{ matrix.platform }}-${{ matrix.arch }}/' directory in the 'prebuilds' bundle."
            ls -la "${{ runner.temp }}/prebuilds-staging" 2>/dev/null || true
            exit 1
          fi
          mkdir -p ${{ env.WORKDIR }}/prebuilds
          cp -r "$SRC" ${{ env.WORKDIR }}/prebuilds/
          echo "Prebuilds moved from staging area"
          ls -la ${{ env.WORKDIR }}/prebuilds/

      # Windows path: bash cp -r mangles `${{ runner.temp }}` (= "C:\a\_temp")
      # because Git Bash interprets `\a`/`\_` as escape sequences, so the
      # source path becomes invalid and the copy silently no-ops. Use
      # PowerShell Copy-Item with native Windows paths.
      - name: Move prebuilds from staging to workspace (Windows)
        if: ${{ !inputs.prebuild_package && matrix.platform == 'win32' }}
        shell: powershell
        run: |
          $src = "${{ runner.temp }}\prebuilds-staging\${{ matrix.platform }}-${{ matrix.arch }}"
          if (-not (Test-Path $src)) {
            Write-Output "::error::No '${{ matrix.platform }}-${{ matrix.arch }}/' directory in the 'prebuilds' bundle."
            if (Test-Path "${{ runner.temp }}\prebuilds-staging") { Get-ChildItem -Force "${{ runner.temp }}\prebuilds-staging" | Format-Table -AutoSize }
            exit 1
          }
          $dst = "${{ env.WORKDIR }}/prebuilds"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force $src $dst
          Write-Host "Prebuilds moved from staging area"
          Get-ChildItem -Recurse $dst | Select-Object FullName | Format-Table -AutoSize

      - name: Download prebuilds from package (Linux/macOS)
        if: ${{ inputs.prebuild_package && matrix.platform != 'win32' }}
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          PACKAGE="${{ inputs.prebuild_package }}"
          echo "Downloading $PACKAGE from npm..."

          # Download package from npm with error handling
          if ! npm pack $PACKAGE; then
            echo "ERROR: Failed to download $PACKAGE from npm"
            echo "Please check that the package exists"
            exit 1
          fi

          # Extract the tarball
          tar -xzf *.tgz

          # Validate prebuilds directory exists
          if [ ! -d "package/prebuilds" ]; then
            echo "ERROR: No prebuilds directory found in package"
            echo "The downloaded package may not contain prebuilt binaries"
            exit 1
          fi

          # Move prebuilds to expected location
          mv package/prebuilds ./prebuilds

          # Cleanup
          rm -rf package *.tgz

          echo "Prebuilds downloaded from npm successfully"
          ls -la prebuilds/

      - name: Download prebuilds from package (Windows)
        if: ${{ inputs.prebuild_package && matrix.platform == 'win32' }}
        working-directory: ${{ env.WORKDIR }}
        shell: powershell
        run: |
          $PACKAGE = "${{ inputs.prebuild_package }}"

          echo "Downloading $PACKAGE from npm..."

          # Download package from npm with error handling
          npm pack $PACKAGE
          if ($LASTEXITCODE -ne 0) {
            echo "ERROR: Failed to download $PACKAGE from npm"
            echo "Please check that the package exists"
            exit 1
          }

          # Find the downloaded tarball
          $TARBALL = Get-ChildItem -Filter "*.tgz" | Select-Object -First 1 -ExpandProperty Name
          if (-not $TARBALL) {
            echo "ERROR: Could not find downloaded tarball"
            exit 1
          }

          echo "Extracting $TARBALL..."
          tar -xzf $TARBALL

          # Validate prebuilds directory exists
          if (-not (Test-Path "package/prebuilds")) {
            echo "ERROR: No prebuilds directory found in package"
            echo "The downloaded package may not contain prebuilt binaries"
            exit 1
          }

          # Move prebuilds to expected location
          Move-Item package/prebuilds ./prebuilds

          # Cleanup
          Remove-Item -Recurse -Force package
          Remove-Item $TARBALL

          echo "Prebuilds downloaded from npm successfully"
          Get-ChildItem prebuilds/

      - name: Print run state
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: |
          echo "node version: $(node -v)"
          echo "npm version: $(npm -v)"
          echo "bare version: $(bare -v)"
          echo "bare-make version: $(bare-make --version)"
          npm list
          npm config list
          ls -la prebuilds || true
          tree prebuilds || true
        continue-on-error: true

      - name: Linux - install dependencies
        if: matrix.os == 'ubuntu-22.04-arm' || matrix.os == 'ubuntu-24.04-arm'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - name: Run integration test
        working-directory: ${{ env.WORKDIR }}
        run: npm run test:integration ${{ matrix.platform }}-${{ matrix.arch }}

