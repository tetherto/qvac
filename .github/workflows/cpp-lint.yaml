name: cpp-lint

on:
  workflow_call:
    inputs:
      sha:
        required: false
        description: >-
          Base ref/SHA to diff against for clang-format. When empty (e.g. on
          workflow_dispatch runs without a PR context), the workflow falls
          back to `github.event.before` and finally to `HEAD~1`.
        type: string
      pr_head_sha:
        required: false
        description: >-
          PR head SHA to checkout. When empty, falls back to `github.sha`.
        type: string
      workdir:
        default: "."
        type: string

env:
  LLVM_VERSION: "19"

jobs:
  cpp-lint:
    runs-on: ai-run-linux
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      WORKDIR: ${{ inputs.workdir }}
    steps:
      - name: Resolve refs
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
        run: |
          BASE_SHA="${INPUT_SHA:-${EVENT_BEFORE:-HEAD~1}}"
          HEAD_SHA="${INPUT_PR_HEAD_SHA:-$GH_SHA}"
          HEAD_REPO="${PR_HEAD_REPO:-$GH_REPO}"
          HEAD_REF="${PR_HEAD_REF:-$GH_REF}"
          {
            echo "BASE_SHA=$BASE_SHA"
            echo "HEAD_SHA=$HEAD_SHA"
            echo "HEAD_REPO=$HEAD_REPO"
            echo "HEAD_REF=$HEAD_REF"
          } >> "$GITHUB_ENV"
          echo "Resolved:"
          echo "  BASE_SHA=$BASE_SHA"
          echo "  HEAD_SHA=$HEAD_SHA"
          echo "  HEAD_REPO=$HEAD_REPO"
          echo "  HEAD_REF=$HEAD_REF"

      - name: Setup build host
        uses: tetherto/qvac/.github/actions/setup-build-host@1d9b2165867d03c6edd675e402ee101a5d48a6d8
        with:
          platform: linux
          arch: x64

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          submodules: recursive
          repository: ${{ env.HEAD_REPO }}
          ref: ${{ env.HEAD_REF }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git insteadOf (ssh -> https+token)
        run: git config --global --add url."https://${{ secrets.PAT_TOKEN }}:x-oauth-basic@github.com/".insteadOf "git@github.com:"

      - name: Setup AWS + Windows CLI
        uses: tetherto/qvac/.github/actions/setup-aws-prebuild@0bbdca93da303a0b1634ba14a89cec085621078d
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

      - name: Setup vcpkg
        uses: tetherto/qvac/.github/actions/setup-vcpkg@1d9b2165867d03c6edd675e402ee101a5d48a6d8
        env:
          MODEL_S3_BUCKET: ${{ secrets.MODEL_S3_BUCKET }}
        with:
          platform: linux
          arch: x64

      - name: Setup Bare tooling
        uses: tetherto/qvac/.github/actions/setup-bare-tooling@0bbdca93da303a0b1634ba14a89cec085621078d
        with:
          node-version: 18.x

      - name: Setup Vulkan SDK
        uses: tetherto/qvac/.github/actions/setup-vulkan-sdk@0bbdca93da303a0b1634ba14a89cec085621078d
        env:
          MODEL_S3_BUCKET: ${{ secrets.MODEL_S3_BUCKET }}
        with:
          platform: linux
          arch: x64
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Configure npm registries
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: |
          echo "@tetherto:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.PAT_TOKEN }}" >> .npmrc
          git config --global url."https://${{ secrets.PAT_TOKEN }}:@github.com/".insteadOf "https://github.com/"

      - name: Restore npm cache
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs.workdir), format('{0}/package.json', inputs.workdir)) }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install npm dependencies
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: npm install

      - name: Generate build system
        id: bare_make_generate
        working-directory: ${{ env.WORKDIR }}
        run: bare-make generate -D ENABLE_VULKAN=OFF

      - name: Check C++ files format
        id: cpp_files_fmt
        continue-on-error: true
        run: |
          if ! git-clang-format-${{ env.LLVM_VERSION }} --extensions c,cc,cpp,cxx,h,hh,hpp,hxx --diff "$BASE_SHA" -- "${{ inputs.workdir }}"; then
            echo "::error title=Unformatted C++ files::Please format your C++ files with 'git-clang-format-${{ env.LLVM_VERSION }} --extensions c,cc,cpp,cxx,h,hh,hpp,hxx $BASE_SHA -- ${{ inputs.workdir }}'"
            exit 1
          fi

      - name: Run C++ clang-tidy
        id: run_cpp_clang_tidy
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: |
          read -r -a tidy_cmd < <($(find build -name clang-tidy-helper.py) build/compile_commands.json --clang-tidy-cmd)
          echo "Running: ${tidy_cmd[*]}"
          if "${tidy_cmd[@]}"; then
            echo "OK: clang-tidy passed without errors."
          else
            echo "::error title=Static analysis failed::clang-tidy found issues."
          fi

      - name: Build
        id: bare_make_build
        if: steps.bare_make_generate.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.WORKDIR }}
        run: bare-make build

      - name: Run C++ tests
        id: run_cpp_tests
        if: steps.bare_make_build.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.WORKDIR }}
        run: bare-make test

      - name: Check for errors
        run: |
          count=0
          if [ "${{ steps.cpp_files_fmt.outcome }}" = "failure" ]; then
            echo "::error::Step - Check C++ files format failed"
            count=$((count + 1))
          fi
          if [ $count -gt 0 ]; then
            echo "::error::There were $count failed checks"
            exit 1
          fi
