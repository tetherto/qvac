name: On Merge Model Cache (TTS)

# Seeds `models-tts-ggml-v1-*`. The integration workflow is only reachable from
# a pull_request_target caller, where cache-models takes its restore-only
# branch, so nothing writes the entry.
#
# tts has no models.manifest.json, so cache-models' warm step cannot fill the
# directory -- the models come from `npm run download-models:registry`. Hence
# the step order: cache-models first, download second, so the post-job save
# picks up what the download wrote.
#
# SEEDS UNDER ITS OWN SUFFIX, unlike every other addon here, and that is the
# whole design. packages/tts-ggml/models holds two populations: the registry
# GGUFs this seed stages, and a set the tests stage at runtime through
# test/utils/downloadModel.js (lavasr, cosyvoice and its clone set,
# mecab-ipadic, the Cangjie TSV, whisper ggml-medium). Seeding the first under
# the integration lane's exact key would hand every leg an exact primary-key
# hit, actions/cache skips its save on an exact hit by design, and the second
# population could never enter the entry -- re-fetched on every leg of every
# run, permanently.
#
# Writing `models-tts-ggml-v1-seed-<hash>` instead means the lane misses its
# exact key, falls to its `models-tts-ggml-v1-` restore-key, PREFIX-matches
# this entry and gets the expensive GGUFs for free, then stages the rest and --
# because a prefix hit does not suppress the save -- writes the complete set
# under its own exact key. Completeness stops being a correctness requirement
# and becomes an optimisation, which matters because the tests request models
# by computed variant/quant/tier, so no guard can prove a staged set complete.
#
# This is the same restore-key prefix mechanism behind the audiogen bug, used
# deliberately, and it is safe here for a reason that does not hold there. The
# seed's key is the LONGER one, so its own restore prefix
# (`models-tts-ggml-v1-seed-`) cannot reach the lane's entries -- it can never
# absorb the complete set. audiogen's collision ran the other way: the empty
# suffix made the functional leg's prefix reach the benchmark entry. Two
# consumers whose keys prefix each other is the bug; a seed deliberately
# sitting one segment below its consumer is the recovery path restore-keys
# exists for. validate-model-cache-sync.mjs enforces both halves.

on:
  push:
    branches:
      - main
    # The cache key hashes this script, so it is the only file whose change can
    # invalidate the entry.
    paths:
      - "packages/tts-ggml/scripts/download-tts-ggml-models.js"
      # `paths` is pinned at the call site, but cache-models still builds the key
      # string and resolves the hash glob, so an edit there can still move this
      # entry. A run that finds nothing moved costs seconds: the probe answers
      # from a lookup.
      - ".github/actions/cache-models/**"
      # And this file. A commit that fixes the seed itself -- a corrected
      # cache-key-suffix, say -- would otherwise sit dormant until the cron.
      - ".github/workflows/on-merge-model-cache-tts.yml"
  # Every two days. The cache server prunes at CACHE_CLEANUP_OLDER_THAN_DAYS=5,
  # and Mon/Thu left a 4-day gap -- inside the window, but with no slack: ONE
  # failed run stretched it to 7 days and the entry was gone. `*/2` caps the gap
  # at 2 days, and at 4 after a missed run, so a single failure is survivable.
  # The hour is offset per addon so the seeds do not contend for a runner.
  schedule:
    - cron: "17 10 */2 * *"
  # No workflow_call. Nothing calls this, and a `pull_request` caller would put
  # the job on cache-models' trusted-save branch, letting PR-head code write an
  # entry every addon lane afterwards restores. Dispatch covers on-demand runs.
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Restore the archive even on a hit, exactly as the cron does. That download is what resets the cache server's prune clock; the probe alone does not."
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  seed:
    needs: runner_names
    # enable-cross-os is 'true' at the call site, so this one entry serves every
    # platform's integration leg.
    runs-on: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64 }}
    timeout-minutes: 120
    name: seed-model-cache

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      # download-tts-ggml-models.js requires @qvac/registry-client, so the
      # package's dependencies have to be present before it runs. Same command
      # and working directory as integration-test-tts-ggml.yml:153-156.
      - name: Install NPM dependencies
        working-directory: ${{ github.workspace }}/packages/tts-ggml
        run: npm install

      # Must match integration-test-tts-ggml.yml's "Cache TTS GGML GGUF models"
      # step exactly. Named, not line-numbered: line numbers rot.
      - name: Cache TTS GGML GGUF models
        id: model-cache
        uses: ./.github/actions/cache-models
        with:
          package: tts-ggml
          # Deliberately one segment below the lane's key; see the header.
          cache-key-suffix: seed
          paths: packages/tts-ggml/models
          hash-files-glob: packages/tts-ggml/scripts/download-tts-ggml-models.js
          enable-cross-os: 'true'
          seed-probe: 'true'
          force-refresh: ${{ inputs.force_refresh || false }}

      - name: Download GGUF models from registry
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ${{ github.workspace }}/packages/tts-ggml
        run: npm run download-models:registry

  # actions/cache only WARNS when the cache server rejects a reservation, so the
  # seed job above reports success whether or not an entry was written. This
  # turns that into a red run. It has to be a separate job: the save runs in the
  # seed job's post-steps, after every step there has finished.
  verify:
    needs: [runner_names, seed]
    # Not the default `success()`. The seed matrices are fail-fast: false, so one
    # leg failing for an unrelated reason would skip this job outright -- and the
    # silent write failure it exists to catch would go unreported on every other
    # leg. Each leg asserts its own entry, so a genuinely failed seed leg just
    # fails here too. runner_names is still required: without its outputs there
    # is no runs-on.
    if: ${{ !cancelled() && needs.runner_names.result == 'success' }}
    # No id-token: nothing here talks to AWS; the lookup needs the
    # repository and nothing else.
    permissions:
      contents: read
    runs-on: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64 }}
    timeout-minutes: 15
    name: verify-model-cache

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      # Inputs must stay identical to the seed step's: `path` feeds the cache
      # version, so a different one silently probes a different entry.
      - name: Assert the seeded entry exists
        uses: ./.github/actions/cache-models
        with:
          package: tts-ggml
          # Deliberately one segment below the lane's key; see the header.
          cache-key-suffix: seed
          paths: packages/tts-ggml/models
          hash-files-glob: packages/tts-ggml/scripts/download-tts-ggml-models.js
          enable-cross-os: 'true'
          assert-exists: 'true'
