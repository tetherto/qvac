name: On Merge Model Cache (TTS)

# KEEP-ALIVE, not a seed. tts is the one addon here that must not be seeded.
#
# on-merge-tts-ggml.yml calls integration-test-tts-ggml.yml on a push to main,
# gated on a successful publish. That run is a `push`, so cache-models takes its
# trusted-save branch, and the post-job save captures whatever the suite left in
# packages/tts-ggml/models -- the registry GGUFs AND the set the tests stage at
# runtime through test/utils/downloadModel.js (lavasr, cosyvoice and its clone
# set, mecab-ipadic, the Cangjie TSV, whisper ggml-medium). The entry is
# complete by construction. Same-repo PR lanes write it too, for the same
# reason.
#
# So the entry is not missing, it is perishable: publishes are infrequent and
# the cache server prunes at CACHE_CLEANUP_OLDER_THAN_DAYS=5.
#
# Seeding it would make things worse, which is why this does not. The seed
# could only stage the registry GGUFs -- the tests request the rest by computed
# variant/quant/tier, so no staging script can be proven complete. Writing that
# subset under the lane's key gives every leg an exact primary-key hit,
# actions/cache skips its save on an exact hit by design, and the complete entry
# is replaced by a partial one that can never grow back.
#
# A restore is all that is needed. Only a real download moves the cache
# server's lastDownloadedAt, so restoring resets the prune clock; `restore-only`
# means this job never writes, so the complete entry is never displaced. A miss
# is a legitimate no-op -- the next publish or same-repo PR recreates it.

on:
  push:
    branches:
      - main
    paths:
      # The key's hash input, so a change here means the old entry is dead and
      # there is a new one to start keeping alive.
      - "packages/tts-ggml/scripts/download-tts-ggml-models.js"
      - ".github/actions/cache-models/**"
      - ".github/workflows/on-merge-model-cache-tts.yml"
  # Every two days. The cache server prunes at CACHE_CLEANUP_OLDER_THAN_DAYS=5,
  # and Mon/Thu left a 4-day gap -- inside the window, but with no slack: ONE
  # failed run stretched it to 7 days and the entry was gone. `*/2` caps the gap
  # at 2 days, and at 4 after a missed run, so a single failure is survivable.
  # The hour is offset per addon so the lanes do not contend for a runner.
  schedule:
    - cron: "17 10 */2 * *"
  # No workflow_call. Nothing calls this, and a `pull_request` caller would run
  # repo-local composites from PR-head code. Dispatch covers on-demand runs.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  keep-alive:
    needs: runner_names
    # Self-hosted: only these runners reach the cache server holding the entry.
    runs-on: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64 }}
    # One restore of an ~8.5 GB entry, not a seed's download-and-upload.
    timeout-minutes: 45
    name: keep-alive-model-cache
    permissions:
      contents: read

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}

      # cache-models shells out to `node` in its path-resolution step even when
      # there is no manifest to warm.
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      # Inputs must stay identical to integration-test-tts-ggml.yml's "Cache TTS
      # GGML GGUF models" step, so this addresses the same entry. `warm: false`
      # because tts has no models.manifest.json and there is nothing to fill:
      # the point is the transfer, not the contents.
      - name: Keep the integration model cache alive
        id: keep-alive
        uses: ./.github/actions/cache-models
        with:
          package: tts-ggml
          paths: packages/tts-ggml/models
          hash-files-glob: packages/tts-ggml/scripts/download-tts-ggml-models.js
          enable-cross-os: 'true'
          warm: 'false'
          restore-only: 'true'

      - name: Report
        shell: bash
        env:
          HIT: ${{ steps.keep-alive.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$HIT" = 'true' ]; then
            echo "Restored the integration entry; its prune clock is reset."
          else
            echo "No entry to keep alive yet."
            echo "Expected when the key has just moved, or nothing has published"
            echo "since the last prune. The next publish or same-repo PR lane"
            echo "writes a complete entry and this job starts refreshing it."
          fi
