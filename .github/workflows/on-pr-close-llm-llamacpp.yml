name: Delete NPM Versions (LLM)

on:
  pull_request:
    types:
      - closed
    paths:
      - "packages/llm-llamacpp/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Specific version to target for deletion"
        required: false
        type: string
      pr-number:
        description: "PR number to target for deletion"
        required: false
        type: string
      pattern:
        description: "Pattern to target for deletion"
        required: false
        type: string
      packages:
        description: "Packages to target for deletion, space separated"
        required: false
        type: string
        default: "@qvac/llm-llamacpp @tetherto/llm-llamacpp"
      dry-run:
        description: "Is dry run? If true, lists versions without deleting."
        type: boolean
        default: true




# Canonical runner labels — .github/actions/runner-names/runners.yaml
env:
  RN_ORCH: ubuntu-latest
  RN_U22: ubuntu-22.04
  RN_U24: ubuntu-24.04
  RN_U22_ARM: ubuntu-22.04-arm
  RN_U24_ARM: ubuntu-24.04-arm
  RN_MAC14: macos-14
  RN_MAC14_XL: macos-14-xlarge
  RN_MAC15: macos-15
  RN_MAC15_INTEL: macos-15-intel
  RN_MAC15_LG: macos-15-large
  RN_MAC15_XL: macos-15-xlarge
  RN_WIN22: windows-2022
  RN_WIN25: windows-2025
  RN_QVAC_U22: qvac-ubuntu2204-x64
  RN_QVAC_U22_GPU: qvac-ubuntu2204-x64-gpu
  RN_QVAC_U24: qvac-ubuntu2404-x64
  RN_QVAC_U24_GPU: qvac-ubuntu2404-x64-gpu
  RN_QVAC_WIN25: qvac-win25-x64
  RN_QVAC_WIN25_GPU: qvac-win25-x64-gpu
  RN_AI_LINUX: ai-run-linux
  RN_AI_LINUX_GPU: ai-run-linux-gpu
  RN_AI_U22: ai-run-ubuntu-22.04
  RN_AI_WIN11_GPU: ai-run-windows11-gpu
  RN_GEN_WIN11: generator-windows11
  RN_MINI_M4: mac-mini-m4
  RN_MINI_M4_GPU: mac-mini-m4-gpu
  RN_LBL_U22_X64: ubuntu-22.04-x64
  RN_LBL_U22_X64_GPU: ubuntu-22.04-x64-gpu
  RN_LBL_U24_X64: ubuntu-24.04-x64
  RN_LBL_U24_X64_GPU: ubuntu-24.04-x64-gpu
  RN_LBL_U24_ARM64: ubuntu-24.04-arm64
  RN_LBL_WIN22_X64: windows-2022-x64
  RN_LBL_WIN25_X64: windows-2025-x64
  RN_LBL_WIN25_X64_GPU: windows-2025-x64-gpu

run-name: Delete NPM Versions (llm-llamacpp) ${{ inputs.version }} ${{ inputs.pr-number }} ${{ inputs.dry-run }}

permissions:
  contents: read

jobs:
  label-gate:
    name: Authorise (label-gate)
    runs-on: ${{ env.RN_ORCH }}
    permissions:
      contents: read
      pull-requests: write
    outputs:
      authorised: ${{ steps.gate.outputs.authorised }}
    steps:
      - name: Checkout (label-gate action only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/label-gate
          sparse-checkout-cone-mode: false
      - name: Run label-gate
        id: gate
        uses: ./.github/actions/label-gate
        with:
          github-token: ${{ secrets.PAT_TOKEN }}

  print-context-trigger:
    runs-on: ${{ env.RN_ORCH }}
    continue-on-error: true
    steps:
      - run: |
          echo "Inputs Context: $INPUTS_CONTEXT"
        env:
          INPUTS_CONTEXT: ${{ toJSON(inputs) }}
      - run: |
          echo "GitHub Context: $GITHUB_CONTEXT"
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}

  delete-npm-versions-trigger:
    permissions:
      packages: write
    uses: ./.github/workflows/public-delete-npm-versions.yml
    with:
      version: ${{ inputs.version }}
      pr-number: ${{ inputs.pr-number }}
      pattern: ${{ inputs.pattern }}
      packages: ${{ inputs.packages }}
      dry-run: ${{ inputs.dry-run || true }}
    needs:
      - label-gate
    if: needs.label-gate.outputs.authorised == 'true'
