name: TMP nx-project-matrix e2e (QVAC-25682)

# THROWAWAY. Deleted before merge.
#
# Runs the REAL .github/actions/nx-project-matrix from this branch, not nx on its
# own, across every case the lockfile rule can meet, on both lanes:
#
#   stdin  - what on-pr-nx does on pull_request_target: the changed paths are
#            written to $RUNNER_TEMP/nx-changed-files.txt and nx reads --stdin.
#   range  - what on-pr-ts-nx does on pull_request: nx diffs --base/--head.
#
# on-pr-nx itself cannot exercise this before merge: its matrix job checks out
# the default branch and runs main's copy of the action.
#
# Every case asserts it produced the file shape it claims before measuring, so a
# broken setup fails loudly instead of reporting a number.

on:
  push:
    branches:
      - infra/QVAC-25682-nx-lockfile-affected

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.case }} / ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        case: [addon-bump, addon-source, shared-bump, drift, nonworkspace-manifest, plugin-bump, root-bump, workflow-only]
        lane: [stdin, range]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the case
        id: build
        shell: bash
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          git config user.email probe@local
          git config user.name probe
          BASE=$(git rev-parse HEAD)

          # A real transitive override: changes the lockfile, touches no package.json.
          drift() {
            node -e "
              const fs=require('fs'); let s=fs.readFileSync('pnpm-workspace.yaml','utf8');
              s=s.replace(/^overrides:\n/m, 'overrides:\n  bare-path: \"3.0.0\"\n');
              fs.writeFileSync('pnpm-workspace.yaml', s);"
            pnpm install --lockfile-only --ignore-scripts >/dev/null
            pnpm install --ignore-scripts >/dev/null
            echo "// probe" >> packages/ocr-ggml/index.js
          }

          case "$CASE" in
            addon-bump)   pnpm add -D --filter @qvac/ocr-ggml tiny-invariant@1.3.3 --ignore-scripts >/dev/null ;;
            addon-source) echo "// probe" >> packages/ocr-ggml/index.js ;;
            shared-bump)  pnpm add -D --filter @qvac/fabric tiny-invariant@1.3.3 --ignore-scripts >/dev/null ;;
            drift)        drift ;;
            nonworkspace-manifest)
              drift
              node -e "
                const fs=require('fs'); const p='docs/website/package.json';
                const j=JSON.parse(fs.readFileSync(p,'utf8')); j.description=(j.description||'')+' ';
                fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');" ;;
            plugin-bump)  pnpm add -D --filter @qvac/opencode-plugin tiny-invariant@1.3.3 --ignore-scripts >/dev/null ;;
            root-bump)    pnpm add -D -w tiny-invariant@1.3.3 --ignore-scripts >/dev/null ;;
            workflow-only) echo "# probe" >> .github/workflows/on-pr-nx.yml ;;
          esac

          git add -A && git commit -q -m "probe: $CASE"
          HEAD_SHA=$(git rev-parse HEAD)
          CHANGED=$(git diff --name-only "$BASE" "$HEAD_SHA")
          echo "CHANGED FILES for $CASE:"; echo "$CHANGED" | sed 's/^/  /'

          has()  { grep -qxE "$1" <<<"$CHANGED"; }
          fail() { echo "::error::setup for $CASE is wrong: $1"; exit 1; }
          WS='^(package\.json|packages/[^/]+/package\.json|packages/registry-server/(client|shared)/package\.json|plugins/[^/]+/package\.json)$'
          case "$CASE" in
            addon-bump)   has 'pnpm-lock.yaml' && has 'packages/ocr-ggml/package.json' || fail "want lockfile + ocr manifest" ;;
            addon-source) has 'packages/ocr-ggml/index.js' && ! has 'pnpm-lock.yaml' || fail "want source only" ;;
            shared-bump)  has 'pnpm-lock.yaml' && has 'packages/fabric/package.json' || fail "want lockfile + fabric manifest" ;;
            drift|nonworkspace-manifest)
              has 'pnpm-lock.yaml' || fail "the override did not change the lockfile"
              ! grep -qE "$WS" <<<"$CHANGED" || fail "a workspace manifest changed" ;;
            plugin-bump)  has 'pnpm-lock.yaml' && has 'plugins/opencode/package.json' || fail "want lockfile + plugin manifest" ;;
            root-bump)    has 'pnpm-lock.yaml' && has 'package.json' || fail "want lockfile + root manifest" ;;
            workflow-only) ! grep -qE '^packages/|pnpm-lock' <<<"$CHANGED" || fail "want no package paths" ;;
          esac
          [ "$CASE" != nonworkspace-manifest ] || has 'docs/website/package.json' || fail "docs manifest not changed"

          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Feed the stdin lane its path list
        if: matrix.lane == 'stdin'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ steps.build.outputs.base }}" "${{ steps.build.outputs.head }}" > "$RUNNER_TEMP/nx-changed-files.txt"
          echo "stdin list:"; sed 's/^/  /' "$RUNNER_TEMP/nx-changed-files.txt"

      - id: matrix
        uses: ./.github/actions/nx-project-matrix
        with:
          target: on-pr
          base-ref: ${{ steps.build.outputs.base }}
          head-ref: ${{ steps.build.outputs.head }}
          config-ref: ${{ steps.build.outputs.base }}

      - name: Report and assert
        shell: bash
        env:
          CASE: ${{ matrix.case }}
          LANE: ${{ matrix.lane }}
          ANY: ${{ steps.matrix.outputs.any }}
          ALLROWS: ${{ steps.matrix.outputs.allrows }}
        run: |
          set -euo pipefail
          ROWS="${ALLROWS:-[]}"
          PKGS=$(echo "$ROWS" | jq -c '[.[].package] | unique')
          N=$(echo "$PKGS" | jq 'length')
          SETTING=$(jq -c '.pluginsConfig["@nx/js"].projectsAffectedByDependencyUpdates' nx.json)
          echo "RESULT case=$CASE lane=$LANE setting=$SETTING any=$ANY packages=$N $PKGS"

          ALL=14
          FABRIC='["classification-ggml","embed-llamacpp","fabric","llm-llamacpp","model-fit","ocr-ggml","translation-nmtcpp","vla-ggml"]'
          ok() { echo "VERDICT $CASE/$LANE: PASS ($1)"; }
          bad() { echo "::error::VERDICT $CASE/$LANE: FAIL - $1"; exit 1; }
          case "$CASE" in
            addon-bump|addon-source)
              [ "$PKGS" = '["ocr-ggml"]' ] && ok "ocr-ggml only" || bad "want [ocr-ggml], got $PKGS" ;;
            shared-bump)
              MISSING=$(jq -nc --argjson want "$FABRIC" --argjson got "$PKGS" '$want - $got')
              [ "$MISSING" = "[]" ] && ok "fabric + all consumers" || bad "consumers missing: $MISSING" ;;
            drift|nonworkspace-manifest|root-bump)
              [ "$SETTING" = '"all"' ] && [ "$N" = "$ALL" ] && ok "fallback, all $ALL" || bad "want fallback to all $ALL, got setting=$SETTING n=$N" ;;
            plugin-bump)
              [ "$SETTING" = '[]' ] && [ "$N" = "0" ] && ok "narrow, no addon rows" || bad "want narrow with no addon rows, got setting=$SETTING $PKGS" ;;
            workflow-only)
              [ "$N" = "0" ] && ok "nothing selected" || bad "want nothing, got $PKGS" ;;
          esac
