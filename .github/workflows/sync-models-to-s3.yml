name: Sync Models to S3 (mobile)

# Mirror model objects into the Device-Farm-local US bucket so mobile e2e tests
# stage models from the same region as the devices (us-west-2) instead of the
# cross-region EU bucket or HuggingFace.
#
# This is the S3 twin of the desktop cache warmer (.github/actions/cache-models/
# warm-models.mjs): a run only copies what's missing, so it is a cheap no-op once
# the bucket is populated. Objects are copied server-side (bucket-to-bucket), so
# the payload never travels through the runner.
#
# Scope (today): the qvac_models_compiled/ prefix, which is where every S3-native
# mobile addon (tts-ggml, ocr-ggml, asr-ggml, vla-ggml, translation-nmtcpp)
# resolves its GGUFs. HuggingFace-only addons (llm-llamacpp, embed-llamacpp,
# diffusion-cpp) are mirrored in a later, manifest-driven step.

on:
  workflow_dispatch:
    inputs:
      source_bucket:
        description: "Source S3 bucket (existing, EU)"
        type: string
        required: false
        default: "tether-ai-dev"
      dest_bucket:
        description: "Destination S3 bucket (Device-Farm-local, US)"
        type: string
        required: false
        default: "tether-ai-dev-us"
      prefix:
        description: "Key prefix to mirror"
        type: string
        required: false
        default: "qvac_models_compiled/"
      dryrun:
        description: "Preview only: list what would copy, copy nothing"
        type: boolean
        required: false
        default: true
  schedule:
    # Weekly top-up so newly published compiled models land in the US bucket
    # without a manual trigger. Sunday 02:00 UTC.
    - cron: "0 2 * * 0"

concurrency:
  group: sync-models-to-s3
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror models EU -> US
    # Self-hosted Linux runner: the first full seed of an empty destination
    # bucket can copy tens of GB cross-region and would risk the 6h cap on a
    # GitHub-hosted runner. Self-hosted has no such job cap, so we can give the
    # bulk copy plenty of headroom. This job only shells out to the AWS CLI
    # (no checkout / build / GPU), so a plain CPU runner is enough.
    runs-on: qvac-ubuntu2204-x64
    environment: release
    # Generous ceiling for the initial bulk mirror; steady-state runs finish in
    # seconds because --size-only makes an already-populated bucket a no-op.
    timeout-minutes: 360
    permissions:
      id-token: write
      contents: read
    env:
      SOURCE_BUCKET: ${{ github.event.inputs.source_bucket || 'tether-ai-dev' }}
      DEST_BUCKET: ${{ github.event.inputs.dest_bucket || 'tether-ai-dev-us' }}
      PREFIX: ${{ github.event.inputs.prefix || 'qvac_models_compiled/' }}
      # Scheduled runs always perform the copy; manual runs honor the input and
      # default to a dry run for safety. Explicit string comparison (rather than
      # `|| 'true'`) so that an explicit dryrun=false on manual dispatch is
      # respected as a live sync instead of falling back to dry run.
      DRYRUN: ${{ github.event_name != 'schedule' && github.event.inputs.dryrun != 'false' }}
      SOURCE_REGION: eu-central-1
      DEST_REGION: us-west-2
    steps:
      - name: Validate bucket and prefix inputs
        shell: bash
        run: |
          set -uo pipefail
          # Defense-in-depth: constrain the free-form dispatch inputs before any
          # AWS call. Buckets are allowlisted to the intended EU source / US
          # destination, and the prefix is restricted to a safe character set
          # (no quotes, whitespace, $, backticks, or `..` traversal). This keeps
          # a privileged dispatcher from pointing the mirror at an unintended
          # bucket or widening its scope, even though inputs already flow via
          # env: and are used only inside quoted arguments.
          ALLOWED_BUCKETS="tether-ai-dev tether-ai-dev-us"

          for name in SOURCE_BUCKET DEST_BUCKET; do
            value="${!name}"
            ok=false
            for allowed in ${ALLOWED_BUCKETS}; do
              if [ "${value}" = "${allowed}" ]; then
                ok=true
                break
              fi
            done
            if [ "${ok}" != "true" ]; then
              echo "::error::${name}='${value}' is not in the allowlist (${ALLOWED_BUCKETS})."
              exit 1
            fi
          done

          if ! [[ "${PREFIX}" =~ ^[A-Za-z0-9/._-]+$ ]]; then
            echo "::error::PREFIX='${PREFIX}' contains disallowed characters (allowed: A-Z a-z 0-9 / . _ -)."
            exit 1
          fi
          if [[ "${PREFIX}" == *".."* ]]; then
            echo "::error::PREFIX='${PREFIX}' must not contain '..'."
            exit 1
          fi

          echo "Inputs validated: ${SOURCE_BUCKET} -> ${DEST_BUCKET}, prefix '${PREFIX}'."

      - name: Mirror prefix (server-side, missing-only, auto-refreshing creds)
        shell: bash
        env:
          OIDC_ROLE_ARN: ${{ secrets.AWS_OIDC_ROLE_ARN }}
        run: |
          set -uo pipefail
          echo "Source:      s3://${SOURCE_BUCKET}/${PREFIX} (${SOURCE_REGION})"
          echo "Destination: s3://${DEST_BUCKET}/${PREFIX} (${DEST_REGION})"
          echo "Dry run:     ${DRYRUN}"

          # --- Auto-refreshing AWS credentials --------------------------------
          # Company policy caps a single STS session at MaxSessionDuration (2h),
          # so a multi-hour first seed would die mid-copy when a static token
          # expires. Instead of a static token we hand the AWS CLI a
          # `credential_process` helper: botocore invokes it on demand and
          # re-invokes it automatically as the temporary credentials near expiry,
          # transparently rolling a single long `aws s3 sync` onto a fresh 2h STS
          # session for as long as the job runs -- no MaxSessionDuration change.
          # The helper mints a fresh GitHub OIDC JWT (the request token is valid
          # for the whole job) and exchanges it via assume-role-with-web-identity,
          # which itself needs no pre-existing AWS credentials.
          CRED_HELPER="${RUNNER_TEMP}/oidc-cred-process.sh"
          cat > "${CRED_HELPER}" <<'HELPER'
          #!/usr/bin/env bash
          set -euo pipefail
          JWT=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          # Isolate this bootstrap call from the credential_process profile itself
          # so the CLI does not recurse back into this helper. AWS_PROFILE must be
          # UNSET (not blanked): an empty value is read as a profile literally
          # named "" and the CLI errors with "config profile () could not be found".
          unset AWS_PROFILE AWS_DEFAULT_PROFILE
          export AWS_CONFIG_FILE=/dev/null
          export AWS_SHARED_CREDENTIALS_FILE=/dev/null
          CREDS=$(aws sts assume-role-with-web-identity \
            --role-arn "${OIDC_ROLE_ARN}" \
            --role-session-name sync-models-to-s3 \
            --web-identity-token "${JWT}" \
            --duration-seconds 7200 \
            --region "${STS_REGION}" \
            --output json)
          echo "${CREDS}" | jq '{Version:1, AccessKeyId:.Credentials.AccessKeyId, SecretAccessKey:.Credentials.SecretAccessKey, SessionToken:.Credentials.SessionToken, Expiration:.Credentials.Expiration}'
          HELPER
          chmod +x "${CRED_HELPER}"

          # Exported so botocore's credential_process subprocess inherits them.
          export OIDC_ROLE_ARN
          export STS_REGION="${DEST_REGION}"

          export AWS_CONFIG_FILE="${RUNNER_TEMP}/aws-config"
          cat > "${AWS_CONFIG_FILE}" <<CONFIG
          [profile sync]
          credential_process = ${CRED_HELPER}
          CONFIG
          export AWS_PROFILE=sync
          # Ensure no stale static creds shadow the auto-refreshing profile.
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          # --------------------------------------------------------------------

          # --size-only: model objects are content-addressed by dated key, so a
          # matching size means identical bytes; this avoids re-copying on clock
          # skew and makes an already-populated bucket a fast no-op.
          #
          # --copy-props metadata-directive: by default `aws s3 sync` also copies
          # each object's tag set, which needs s3:GetObjectTagging on the source
          # (and s3:PutObjectTagging on the dest). The OIDC role is not granted
          # those, so the default sync fails every copy with AccessDenied on
          # GetObjectTagging. We only need the bytes + system metadata here, so
          # skip tag propagation entirely.
          run_sync() {
            aws s3 sync \
              "s3://${SOURCE_BUCKET}/${PREFIX}" \
              "s3://${DEST_BUCKET}/${PREFIX}" \
              --source-region "${SOURCE_REGION}" \
              --region "${DEST_REGION}" \
              --copy-props metadata-directive \
              --size-only \
              --no-progress \
              "$@"
          }

          if [ "${DRYRUN}" = "true" ]; then
            if run_sync --dryrun; then
              echo "Done. (dry run: true)"
              exit 0
            fi
            echo "Dry run failed (permission, missing bucket, or network error)."
            exit 1
          fi

          # With auto-refreshing credentials a single pass should copy the whole
          # seed however long it takes. `aws s3 sync` exits 0 only after every
          # missing object is copied, so one successful pass means the mirror is
          # complete. The bounded retry is now only a safety net for transient
          # S3/network errors; each pass is missing-only, so retries are cheap.
          MAX_ATTEMPTS=8
          completed=false
          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            echo "=== sync attempt ${attempt}/${MAX_ATTEMPTS} ==="

            if run_sync; then
              echo "Sync completed successfully; mirror is up to date."
              completed=true
              break
            fi

            echo "Attempt ${attempt} failed (transient error); backing off before retry."
            sleep 30
          done

          if [ "${completed}" != "true" ]; then
            echo "Mirror did not complete after ${MAX_ATTEMPTS} attempts."
            echo "Re-dispatch to resume (missing-only)."
            exit 1
          fi

          echo "Done. (dry run: false)"
