# Self-test for the prebuild symbol gate
# (.github/actions/verify-prebuild-symbols/verify-prebuild-symbols.mjs).
#
# Proves -- straight off the published artifacts, no device or rebuild -- that
# the gate CATCHES the @qvac/tts-ggml@0.2.1 Android dlopen regression (the build
# #2502 reverted: UND ggml_backend_is_cpu / ggml_get_type_traits_cpu) and PASSES
# the good 0.2.0. Guards the gate itself from silently rotting. Uses public npm
# only, so it runs on fork PRs without secrets.
name: Gate self-test (prebuild symbols)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/actions/verify-prebuild-symbols/verify-prebuild-symbols.mjs"
      - ".github/actions/verify-prebuild-symbols/action.yml"
      - ".github/workflows/gate-selftest.yml"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Gate MUST hard-fail on the broken 0.2.1 (the build #2502 reverted)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bad && mkdir -p /tmp/bad
          npm pack @qvac/tts-ggml@0.2.1 --pack-destination /tmp/bad
          tar -xf /tmp/bad/*.tgz -C /tmp/bad package/prebuilds/android-arm64
          if node .github/actions/verify-prebuild-symbols/verify-prebuild-symbols.mjs --dir /tmp/bad/package/prebuilds/android-arm64 --platform android; then
            echo "::error::Gate PASSED on the known-broken 0.2.1 prebuild -- the gate would NOT catch the regression."
            exit 1
          fi
          echo "OK: gate correctly hard-failed on 0.2.1 (expected: ggml_backend_is_cpu / ggml_get_type_traits_cpu)."

      - name: Gate MUST pass on the good 0.2.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/good && mkdir -p /tmp/good
          npm pack @qvac/tts-ggml@0.2.0 --pack-destination /tmp/good
          tar -xf /tmp/good/*.tgz -C /tmp/good package/prebuilds/android-arm64
          node .github/actions/verify-prebuild-symbols/verify-prebuild-symbols.mjs --dir /tmp/good/package/prebuilds/android-arm64 --platform android
          echo "OK: gate correctly passed on 0.2.0."

      - name: Gate MUST resolve engine symbols against an external --provider-dir
        shell: bash
        run: |
          set -euo pipefail
          # Reproduce the shared-runtime (@qvac/fabric) case: an addon .bare with an
          # UND ggml_* symbol + DT_NEEDED on qvac__fabric@0.bare, whose provider lives
          # OUTSIDE the scanned prebuilds/ tree (it ships in node_modules and is
          # pre-loaded at runtime, not co-located beside the addon). Critically, the
          # provider FILE on disk is the unversioned `qvac__fabric.bare` while the
          # addon's DT_NEEDED is the ABI-versioned SONAME `qvac__fabric@0.bare` -- the
          # real fabric layout. The gate must index the provider by its DT_SONAME (not
          # its basename) to match the DT_NEEDED across this divergence.
          rm -rf /tmp/prov
          mkdir -p /tmp/prov/prebuilds/linux-x64 /tmp/prov/providers/linux-x64
          printf 'int ggml_test_symbol(void){return 42;}\n' > /tmp/prov/provider.c
          printf 'extern int ggml_test_symbol(void);\nint addon_entry(void){return ggml_test_symbol();}\n' > /tmp/prov/addon.c
          cc -shared -fPIC -Wl,-soname,qvac__fabric@0.bare -o /tmp/prov/providers/linux-x64/qvac__fabric.bare /tmp/prov/provider.c
          cc -shared -fPIC -o /tmp/prov/prebuilds/linux-x64/qvac__addon.bare /tmp/prov/addon.c -L/tmp/prov/providers/linux-x64 -l:qvac__fabric.bare -Wl,--no-as-needed
          # Without the provider dir the engine symbol is unresolved -> MUST hard-fail
          # (proves --provider-dir did not neuter the real UND check).
          if node .github/actions/verify-prebuild-symbols/verify-prebuild-symbols.mjs --dir /tmp/prov/prebuilds --platform linux; then
            echo "::error::Gate PASSED with the shared-runtime provider absent -- it would miss a genuinely-unresolved engine symbol."
            exit 1
          fi
          echo "OK: gate hard-failed when the shared-runtime provider was not indexed."
          # With --provider-dir the fabric exports resolve the UND import -> MUST pass.
          node .github/actions/verify-prebuild-symbols/verify-prebuild-symbols.mjs --dir /tmp/prov/prebuilds --provider-dir /tmp/prov/providers --platform linux
          echo "OK: gate passed once the shared-runtime provider was indexed via --provider-dir."

      - name: Gate MUST NOT mask UND symbols when --provider-dir is present but the addon does not DT_NEEDED it
        shell: bash
        run: |
          set -euo pipefail
          # An addon with a genuine UND ggml_* and NO DT_NEEDED on the provider soname
          # must still hard-fail even when a --provider-dir is indexed (e.g. @qvac/fabric
          # happens to be in node_modules but this binary does not dynamically link it).
          # Proves resolution is keyed on each binary's own DT_NEEDED, not a global pool.
          rm -rf /tmp/mask
          mkdir -p /tmp/mask/prebuilds/linux-x64 /tmp/mask/providers/linux-x64
          printf 'int ggml_test_symbol(void){return 42;}\n' > /tmp/mask/provider.c
          printf 'extern int ggml_test_symbol(void);\nint addon_entry(void){return ggml_test_symbol();}\n' > /tmp/mask/addon.c
          cc -shared -fPIC -Wl,-soname,qvac__fabric@0.bare -o /tmp/mask/providers/linux-x64/qvac__fabric.bare /tmp/mask/provider.c
          cc -shared -fPIC -o /tmp/mask/prebuilds/linux-x64/qvac__static.bare /tmp/mask/addon.c
          if node .github/actions/verify-prebuild-symbols/verify-prebuild-symbols.mjs --dir /tmp/mask/prebuilds --provider-dir /tmp/mask/providers --platform linux; then
            echo "::error::Gate PASSED on an addon without a matching DT_NEEDED -- the provider index would mask a genuine dlopen-crash UND."
            exit 1
          fi
          echo "OK: gate hard-failed when the provider was indexed but the addon did not DT_NEEDED its soname."

  fleet-dryrun:
    # De-risks the fleet-wide activation flagged in review: the gate runs inside
    # reusable-prebuilds.yml, which all 14 prebuild-*.yml callers reference by
    # LOCAL PATH (uses: ./.github/workflows/reusable-prebuilds.yml) -- resolved
    # at the caller's ref, no pinned SHA. So the UND hard-fail goes live for
    # every ggml/onnx addon on its next publish the moment this merges (not
    # gradually). This job dry-runs the gate over EVERY currently-published
    # addon's android-arm64 prebuild (the platform the UND check bites hardest)
    # and reports each one's result as merge evidence. Informational only -- the
    # enforcing gate is per-addon in reusable-prebuilds.yml; a hard-fail here is a
    # real Android dlopen regression in THAT addon (the gate would correctly
    # block its next publish until fixed), with the other addons unaffected.
    # Public npm only -> no secrets, runs on fork PRs too. Packs `latest`, so it
    # also keeps tracking the live fleet on every gate-touching PR.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Dry-run the UND gate over every published addon (android-arm64)
        shell: bash
        run: |
          set -uo pipefail
          addons="tts-ggml transcription-parakeet transcription-whispercpp bci-whispercpp llm-llamacpp embed-llamacpp classification-ggml vla-ggml ocr-ggml translation-nmtcpp diffusion-cpp"
          checked=0
          failed=0
          skipped=0
          echo "| addon | version | android-arm64 UND gate |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for a in $addons; do
            d="/tmp/fleet/$a"
            rm -rf "$d"
            mkdir -p "$d"
            if ! npm pack "@qvac/$a" --pack-destination "$d"; then
              echo "::warning::npm pack @qvac/$a failed (not on public npm?) -- skipping"
              echo "| \`@qvac/$a\` | - | skipped (pack failed) |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi
            tar -xf "$d"/*.tgz -C "$d"
            ver=$(node -p "require('$d/package/package.json').version")
            if [ ! -d "$d/package/prebuilds/android-arm64" ]; then
              echo "-- @qvac/$a@$ver: no android-arm64 prebuild in tarball -- skipping"
              echo "| \`@qvac/$a\` | $ver | skipped (no android prebuild) |" >> "$GITHUB_STEP_SUMMARY"
              skipped=$((skipped + 1))
              continue
            fi
            echo "== @qvac/$a@$ver =="
            checked=$((checked + 1))
            if node .github/actions/verify-prebuild-symbols/verify-prebuild-symbols.mjs --dir "$d/package/prebuilds/android-arm64" --platform android; then
              echo "OK: @qvac/$a@$ver passes the UND gate on android-arm64"
              echo "| \`@qvac/$a\` | $ver | PASS |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::@qvac/$a@$ver HARD-FAILS the UND gate on android-arm64 -- a real fleet regression to fix in that addon, NOT a defect in this gate PR"
              echo "| \`@qvac/$a\` | $ver | **HARD-FAIL** |" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
            fi
          done
          echo "=== $checked addon(s) checked on android-arm64, $failed hard-fail(s), $skipped skipped ==="
          {
            echo ""
            echo "**$checked checked, $failed hard-fail(s), $skipped skipped.** Informational only: the enforcing gate runs per-addon in reusable-prebuilds.yml. A hard-fail here is a genuine Android dlopen regression in that *addon* (the gate would correctly block its next publish until fixed), not a problem with this PR -- and the other addons are unaffected (per-addon prebuild workflows)."
          } >> "$GITHUB_STEP_SUMMARY"
