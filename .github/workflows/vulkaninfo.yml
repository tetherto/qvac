on:
  workflow_dispatch:

permissions: {}

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  run-vulkaninfo:
    needs: runner_names
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            runner: ${{ needs.runner_names.outputs.linux_ubuntu2204_x64_gpu }}
          - os: ubuntu-24.04
            runner: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64_gpu }}
    steps:
      - name: Read CPU memory and GPU diagnostics
        shell: bash
        run: |
          python3 -c '
          import os, pathlib, shutil, subprocess
          print("Logical CPUs:", os.cpu_count(), flush=True)
          for filename in ["/proc/meminfo", "/proc/swaps", "/proc/pressure/memory",
                           "/sys/fs/cgroup/memory.max", "/sys/fs/cgroup/memory.current",
                           "/sys/fs/cgroup/cpu.max"]:
              source = pathlib.Path(filename)
              print("RESOURCE", filename, flush=True)
              print(source.read_text() if source.exists() else "unavailable", flush=True)
          for key in ["GGML_VK_PREFER_HOST_MEMORY", "GGML_VK_DISABLE_ASYNC",
                      "GGML_VK_SUBALLOCATION_BLOCK_SIZE", "GGML_VK_FORCE_MAX_BUFFER_SIZE",
                      "GGML_VK_FORCE_MAX_ALLOCATION_SIZE", "OMP_NUM_THREADS"]:
              print("SETTING", key, repr(os.environ.get(key)), flush=True)
          for command in [["lscpu"], ["nvidia-smi"], ["nvidia-smi", "-q"], ["vulkaninfo"]]:
              print("DIAGNOSTIC", command, flush=True)
              if shutil.which(command[0]):
                  result = subprocess.run(command, timeout=90, check=False)
                  print("EXIT", result.returncode, flush=True)
              else:
                  print("unavailable", flush=True)
          '

      - name: Checkout transfer probe only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: .github/scripts/streaming-transfer-probe.py
          sparse-checkout-cone-mode: false
          path: qvac25129-probe
          persist-credentials: false

      - name: Download validated Linux prebuild
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: prebuild-diffusion-cpp-linux-x64
          run-id: 35019957779
          repository: tetherto/qvac
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/qvac25129-transfer-${{ github.run_id }}

      - name: Measure synthetic parameter transfers
        shell: bash
        env:
          PROBE_PREBUILD: ${{ runner.temp }}/qvac25129-transfer-${{ github.run_id }}
        run: timeout 180s python3 qvac25129-probe/.github/scripts/streaming-transfer-probe.py "$PROBE_PREBUILD"
