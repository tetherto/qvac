on:
  workflow_dispatch:





permissions: {}

jobs:
  runner_names:
    uses: ./.github/workflows/reusable-runner-names.yml

  run-vulkaninfo:
    needs: runner_names
    runs-on: ${{ needs.runner_names.outputs.ai_win11_gpu }}
    steps:
      - name: GPU detection via nvidia-smi and vulkaninfo
        continue-on-error: true
        shell: powershell
        run: |
          Write-Host "=== GPU Device List ==="
          nvidia-smi -L
          Write-Host ""
          Write-Host "=== Running nvidia-smi ==="
          nvidia-smi
          Write-Host ""
          Write-Host "=== Running Vulkaninfo ==="
          vulkaninfo.exe --summary
