name: QVAC Snap Consumer Tests
# Reusable workflow for the strict-confinement Snap consumer. Snap builds two
# revisions through LXD, installs one system-wide with snapd, and keeps its
# models inside the snap's own data directory, so none of that belongs in the
# job desktop, electron and python share (test-node-sdk.yml). The steps every
# runner-hosted family shares come from the same sdk-e2e-node-* actions, and
# the job names and artifacts keep the `snap` family contract the report and
# rerun machinery reads.

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Working directory for tests (consumer/test runner)"
        required: false
        type: string
        default: "."
      project-directory:
        description: "Root project directory (where package.json lives)"
        required: true
        type: string
      platforms:
        description: 'JSON array of Linux runner labels with snapd and LXD (e.g., ["qvac-ubuntu2204-x64-gpu"])'
        required: true
        type: string
      consumer-timeout:
        description: "Timeout in seconds for consumer connection"
        required: false
        type: number
        default: 30
      filter:
        description: 'Filter tests by category or testId prefix (comma-separated, e.g., "model,completion")'
        required: false
        type: string
      suite:
        description: "Suite filter (e.g. 'smoke'). Empty = all tests."
        required: false
        type: string
      exclude-suite:
        description: "Exclude suites (comma-separated)"
        required: false
        type: string
      rerun-plan:
        description: >-
          JSON {family: {platform: [testId]}} of previously failed tests. When set,
          each matrix leg replaces `filter` with the list recorded under `snap`
          for its own platform. Empty = normal run.
        required: false
        type: string
        default: ""
      include:
        description: "Exact testIds to run on top of the suite/filter selection (comma-separated)"
        required: false
        type: string
        default: ""
      test-version:
        description: "Git ref to checkout (branch, tag, or SHA). Defaults to trigger ref."
        required: false
        type: string
      inference-source:
        description: "Resolved inference source"
        required: false
        type: string
        default: manifest
      inference-dependency-spec:
        description: "Resolved inference package spec for npm"
        required: false
        type: string
        default: ""
      inference-artifact-name:
        description: "Branch inference tarball artifact"
        required: false
        type: string
        default: ""
      inference-provenance:
        description: "Immutable inference source identity"
        required: false
        type: string
        default: ""
      test-suite-source:
        description: "Resolved test-suite source"
        required: false
        type: string
        default: manifest
      test-suite-dependency-spec:
        description: "Resolved test-suite package spec for npm"
        required: false
        type: string
        default: ""
      test-suite-artifact-name:
        description: "Branch test-suite tarball artifact"
        required: false
        type: string
        default: ""
      test-suite-provenance:
        description: "Immutable test-suite source identity"
        required: false
        type: string
        default: ""
      cache-models:
        description: "Cache downloaded models between runs"
        required: false
        type: boolean
        default: true
    secrets:
      # MQTT_* secrets are typically provided via the release environment
      # (see the `environment: release` job). They are declared required: false
      # here so `secrets: inherit` from a caller with no repo-level values
      # does not fail at the workflow_call boundary; the jobs that consume
      # them have environment access.
      MQTT_HOST:
        required: false
      MQTT_USERNAME:
        required: false
      MQTT_PASSWORD:
        required: false
      MQTT_CA_CERT:
        required: false
      MQTT_CLIENT_CERT:
        required: false
      MQTT_CLIENT_KEY:
        required: false

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  report-start:
    name: "[snap] report-start"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      comment-ids: ${{ steps.report.outputs.comment-ids }}
      platform-keys: ${{ steps.keys.outputs.platforms }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: .github/actions/sdk-e2e-report-start
          sparse-checkout-cone-mode: false

      # Snap is Linux-only. A runner label that maps anywhere else is a
      # misconfigured override, not a platform to report on.
      - name: Derive Snap platform keys
        id: keys
        shell: node {0}
        env:
          PLATFORMS_IN: ${{ inputs.platforms }}
        run: |
          const fs = require('fs');
          const runners = JSON.parse(process.env.PLATFORMS_IN || '[]');
          const keys = runners.map((r) => {
            const s = String(r).toLowerCase();
            if (s.includes('win')) return 'windows';
            if (s.includes('mac') || s.includes('darwin')) return 'macos';
            return 'linux';
          });
          const unique = [...new Set(keys)];
          const foreign = unique.filter((key) => key !== 'linux');
          if (foreign.length > 0) {
            console.log(`::error::Snap runs on Linux only; got runners for ${foreign.join(', ')}.`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `platforms=${JSON.stringify(unique)}\n`);
          console.log(`Derived platform keys: ${JSON.stringify(unique)}`);

      - name: Post running comments
        id: report
        uses: ./.github/actions/sdk-e2e-report-start
        with:
          family: snap
          platforms: ${{ steps.keys.outputs.platforms }}
          suite: ${{ inputs.suite }}
          filter: ${{ inputs.rerun-plan != '' && 'rerun of previously failed tests' || inputs.filter }}
          exclude-suite: ${{ inputs.exclude-suite }}
          inference-provenance: ${{ inputs.inference-provenance }}
          test-suite-provenance: ${{ inputs.test-suite-provenance }}

  test-snap:
    name: "[snap] test (${{ matrix.os }})"
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    environment: release
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Not secrets: GitHub masks a short secret such as a port inside other
      # values and drops any job output that contains it.
      MQTT_PROTOCOL: ${{ vars.MQTT_PROTOCOL }}
      MQTT_PORT: ${{ vars.MQTT_PORT }}
      MQTT_HOST: ${{ secrets.MQTT_HOST }}
      MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
      MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
      # GitHub-hosted runners have no LXD, so snapcraft builds on the host there.
      QVAC_TEST_SNAP_BUILD_MODE: ${{ startsWith(matrix.os, 'ubuntu-') && 'destructive' || 'lxd' }}
    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ inputs.test-version || github.event.pull_request.head.sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            ${{ inputs.project-directory }}
            ${{ inputs.working-directory }}
            packages/inference
            .github/actions/sdk-e2e-fail-on-failures
            .github/actions/sdk-e2e-model-cache/src
            .github/actions/sdk-e2e-prepare-inference
            .github/actions/sdk-e2e-prepare-test-suite

      # The shared steps come from the commit this workflow was loaded from, not
      # from the code under test: a PR that predates them, or a dispatch with an
      # older test-version, still has to run the workflow it was given. Actions
      # they call by ./.github/actions/... still resolve in the checkout above.
      - name: Check out the shared e2e actions
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.workflow_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
          path: .sdk-e2e-workflow
          sparse-checkout: |
            .github/actions/sdk-e2e-model-cache
            .github/actions/sdk-e2e-node-leg
            .github/actions/sdk-e2e-node-prepare
            .github/actions/sdk-e2e-node-results
            .github/actions/sdk-e2e-node-run

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 22

      - name: Resolve leg
        id: leg
        uses: ./.sdk-e2e-workflow/.github/actions/sdk-e2e-node-leg
        with:
          family: snap
          runner-label: ${{ matrix.os }}
          filter: ${{ inputs.filter }}
          rerun-plan: ${{ inputs.rerun-plan }}
          allowed-platforms: linux

      - name: Install and build
        uses: ./.sdk-e2e-workflow/.github/actions/sdk-e2e-node-prepare
        with:
          project-directory: ${{ inputs.project-directory }}
          working-directory: ${{ inputs.working-directory }}
          inference-source: ${{ inputs.inference-source }}
          inference-dependency-spec: ${{ inputs.inference-dependency-spec }}
          inference-artifact-name: ${{ inputs.inference-artifact-name }}
          inference-provenance: ${{ inputs.inference-provenance }}
          test-suite-source: ${{ inputs.test-suite-source }}
          test-suite-dependency-spec: ${{ inputs.test-suite-dependency-spec }}
          test-suite-artifact-name: ${{ inputs.test-suite-artifact-name }}
          test-suite-provenance: ${{ inputs.test-suite-provenance }}
          mqtt-ca-cert: ${{ secrets.MQTT_CA_CERT }}
          mqtt-client-cert: ${{ secrets.MQTT_CLIENT_CERT }}
          mqtt-client-key: ${{ secrets.MQTT_CLIENT_KEY }}

      # The snap packages the consumer directory; registry tokens must not
      # ride along into the artifact.
      - name: Remove consumer package credentials
        working-directory: ${{ inputs.working-directory }}
        shell: node {0}
        run: |
          const fs = require('fs');
          fs.rmSync('.npmrc', { force: true });

      - name: Verify Snap tooling
        run: |
          if ! command -v snapcraft; then
            sudo snap install snapcraft --classic
          fi
          if [ "$QVAC_TEST_SNAP_BUILD_MODE" = "lxd" ]; then
            if ! command -v lxc; then
              echo "::error::LXD is required for non-destructive Snap builds on this runner"
              exit 1
            fi
            lxc info
          fi
          snap version
          snapcraft --version

      # Preflight: snapcraft's gpu-2404/graphics-core22 part clones github.com
      # (IPv4-only) from inside the LXD build instance. If the runner drops IPv4
      # forwarding off the lxdbr0 bridge (Docker's `iptables -P FORWARD DROP` with
      # no ACCEPT for lxdbr0), that clone hangs ~2 min and dies with exit 128 — and
      # IPv6-capable mirrors (snap store, archive) keep working, hiding the cause.
      # Reproduce the exact path cheaply and fail in ~15s with an actionable message.
      # LXD-only (self-hosted); the github-hosted `destructive` build has no LXD.
      - name: Preflight — LXD instance IPv4 egress to GitHub
        if: env.QVAC_TEST_SNAP_BUILD_MODE == 'lxd'
        shell: bash
        run: |
          set -euo pipefail
          probe="qvac-egress-preflight-$$"
          cleanup() { lxc delete -f "$probe" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          # Don't swallow launch output: under `set -e` a failed launch would exit
          # with an empty log and never reach the actionable `::error::` below.
          lxc launch ubuntu:22.04 "$probe"
          for _ in $(seq 1 20); do
            if lxc exec "$probe" -- getent hosts github.com >/dev/null 2>&1; then break; fi
            sleep 2
          done
          if lxc exec "$probe" -- curl -4 -fsS --max-time 15 -o /dev/null https://github.com; then
            echo "IPv4 egress from an LXD instance to github.com is OK."
          else
            echo "::error::LXD build instances cannot reach github.com over IPv4, so snapcraft's gpu-2404/graphics-core22 part will hang cloning it. This is almost always Docker's 'iptables -P FORWARD DROP' with no ACCEPT for the lxdbr0 bridge. Fix on the runner: ensure lxd-docker-forward.service is enabled (qvac-devops ansible: --tags snap-fw) so DOCKER-USER accepts lxdbr0 in+out."
            exit 1
          fi

      - name: Build first Snap revision
        id: snap-build-first
        working-directory: ${{ inputs.working-directory }}
        env:
          QVAC_TEST_SNAP_BUILD_ID: first
          TMPDIR: ${{ runner.temp }}
        run: npx qvac-test build:consumer:snap --config=. --skip-install

      - name: Preserve first Snap revision
        working-directory: ${{ inputs.working-directory }}
        shell: node {0}
        run: |
          const fs = require('fs');
          fs.copyFileSync('snap/dist/qvac-sdk-e2e.snap', 'snap/dist/qvac-sdk-e2e-first.snap');

      - name: Build second Snap revision
        working-directory: ${{ inputs.working-directory }}
        env:
          QVAC_TEST_SNAP_BUILD_ID: second
          TMPDIR: ${{ runner.temp }}
        run: npx qvac-test build:consumer:snap --config=. --skip-install

      # The LXD build instance is named after the snap directory's inode, which
      # the workspace wipe changes every run, so it is never reused and stays on
      # disk unless removed here.
      - name: Remove Snap build instance
        if: always() && env.QVAC_TEST_SNAP_BUILD_MODE == 'lxd' && steps.snap-build-first.outcome != 'skipped'
        continue-on-error: true
        working-directory: ${{ inputs.working-directory }}/snap
        run: snapcraft clean --use-lxd

      - name: Verify Snap refresh persistence
        working-directory: ${{ inputs.working-directory }}
        run: >-
          npm run test:snap:refresh --
          --first snap/dist/qvac-sdk-e2e-first.snap
          --second snap/dist/qvac-sdk-e2e.snap

      - name: Show Snap confinement denials
        if: failure()
        continue-on-error: true
        run: >-
          sudo journalctl --dmesg --no-pager
          --since "10 minutes ago"
          --grep 'apparmor="DENIED"|audit'

      - name: Install Snap revision for e2e
        working-directory: ${{ inputs.working-directory }}
        run: sudo snap install --dangerous snap/dist/qvac-sdk-e2e.snap

      - name: Connect Snap GPU interfaces
        run: |
          sudo snap connect qvac-sdk-e2e:opengl
          sudo snap connect qvac-sdk-e2e:hardware-observe
          sudo snap connect qvac-sdk-e2e:graphics-core22 mesa-core22:graphics-core22
          snap list mesa-core22
          snap connections qvac-sdk-e2e

      # Same per-model cache as test-node-sdk.yml. The Snap reads its own models directory, so
      # restored files are hard-linked into it. A selection with no models skips the bootstrap.
      - name: Plan models cache
        id: models-plan
        continue-on-error: true
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_FILTER: ${{ steps.leg.outputs.filter }}
          SUITE: ${{ inputs.suite }}
          EXCLUDE_SUITE: ${{ inputs.exclude-suite }}
          INCLUDE_TESTS: ${{ inputs.include }}
          CACHE_ROOT: ${{ inputs.working-directory }}/.qvac-cache
        run: |
          if [ ! -f scripts/model-cache-plan.mjs ]; then
            echo "::warning::This checkout predates the per-model cache, so every model is downloaded uncached. Rebase onto main."
            exit 0
          fi
          node scripts/model-cache-plan.mjs \
            --family=snap \
            --os=linux \
            "--suite=$SUITE" \
            "--exclude-suite=$EXCLUDE_SUITE" \
            "--filter=$TEST_FILTER" \
            "--include=$INCLUDE_TESTS" \
            "--cache-root=$CACHE_ROOT" \
            "--out=$RUNNER_TEMP/sdk-e2e-model-cache-plan.json"

      - name: Restore models cache
        id: models-cache
        if: inputs.cache-models != false && steps.models-plan.outputs.plan != ''
        continue-on-error: true
        uses: ./.sdk-e2e-workflow/.github/actions/sdk-e2e-model-cache
        with:
          mode: restore
          plan: ${{ steps.models-plan.outputs.plan }}

      - name: Stage models into the Snap
        if: steps.models-cache.outputs.hits != '' && steps.models-cache.outputs.hits != '0'
        shell: bash
        env:
          WORKSPACE_MODELS: ${{ inputs.working-directory }}/.qvac-cache
        run: |
          set -euo pipefail
          SNAP_MODELS="$HOME/snap/qvac-sdk-e2e/common/.qvac/models"
          mkdir -p "$SNAP_MODELS"
          cp -a -l --remove-destination "$WORKSPACE_MODELS/." "$SNAP_MODELS/" 2>/dev/null \
            || cp -a --remove-destination "$WORKSPACE_MODELS/." "$SNAP_MODELS/"
          du -sh "$SNAP_MODELS"

      - name: Bootstrap models inside Snap
        if: >-
          steps.models-cache.outputs.complete != 'true' &&
          steps.models-plan.outputs.deps != '[]'
        working-directory: ${{ inputs.working-directory }}
        env:
          QVAC_E2E_BOOTSTRAP_DEPS: ${{ steps.models-plan.outputs.deps }}
          QVAC_E2E_BOOTSTRAP_MODELS: ${{ steps.models-cache.outputs.missing-models }}
        run: >-
          npx qvac-test run:bootstrap:snap
          --config=.
          --skip-build
          --skip-snap-install

      # Trusted events testing their own commit only.
      # Not `cp -n`: it exits 1 on existing files in coreutils 9.2-9.4.
      - name: Collect Snap downloads for the cache
        id: snap-collect
        if: >-
          !cancelled() &&
          steps.models-cache.outputs.complete == 'false' &&
          contains(fromJSON('["push","schedule","workflow_dispatch","merge_group"]'), github.event_name) &&
          (inputs.test-version == '' || inputs.test-version == github.sha)
        continue-on-error: true
        shell: bash
        env:
          WORKSPACE_MODELS: ${{ inputs.working-directory }}/.qvac-cache
        run: |
          set -euo pipefail
          SNAP_MODELS="$HOME/snap/qvac-sdk-e2e/common/.qvac/models"
          mkdir -p "$WORKSPACE_MODELS"
          cp -a -l --remove-destination "$SNAP_MODELS/." "$WORKSPACE_MODELS/" 2>/dev/null \
            || cp -a --remove-destination "$SNAP_MODELS/." "$WORKSPACE_MODELS/"

      - name: Save models cache
        if: ${{ !cancelled() && steps.snap-collect.outcome == 'success' }}
        continue-on-error: true
        uses: ./.sdk-e2e-workflow/.github/actions/sdk-e2e-model-cache
        with:
          mode: save
          plan: ${{ steps.models-plan.outputs.plan }}

      - name: Run tests
        timeout-minutes: 60
        uses: ./.sdk-e2e-workflow/.github/actions/sdk-e2e-node-run
        with:
          family: snap
          runner-label: ${{ matrix.os }}
          platform: ${{ steps.leg.outputs.platform }}
          working-directory: ${{ inputs.working-directory }}
          consumer-command: run:consumer:snap
          consumer-args: --skip-build --skip-snap-install
          consumer-timeout: ${{ inputs.consumer-timeout }}
          filter: ${{ steps.leg.outputs.filter }}
          suite: ${{ inputs.suite }}
          exclude-suite: ${{ inputs.exclude-suite }}
          include: ${{ inputs.include }}

      # Snap is Linux-only, so the artifact name does not wait on the leg.
      - name: Upload Snap artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: snap-artifacts-linux
          path: ${{ inputs.working-directory }}/snap/dist/*.snap
          retention-days: 7

      # Removing the snap stops any app still running inside it, so the run's
      # confined processes are gone before its results are collected.
      - name: Remove Snap consumer
        if: always()
        continue-on-error: true
        run: sudo snap remove --purge qvac-sdk-e2e

      - name: Collect results
        if: always() && steps.leg.outputs.platform != ''
        uses: ./.sdk-e2e-workflow/.github/actions/sdk-e2e-node-results
        with:
          family: snap
          platform: ${{ steps.leg.outputs.platform }}
          working-directory: ${{ inputs.working-directory }}

      - name: Fail on e2e result failures
        if: success() || failure()
        uses: ./.github/actions/sdk-e2e-fail-on-failures
        with:
          report-dir: ${{ inputs.working-directory }}/reports

      - name: Show consumer log on failure
        if: failure()
        shell: node {0}
        working-directory: ${{ inputs.working-directory }}
        run: |
          const fs = require('fs');
          if (fs.existsSync('consumer.log')) {
            console.log(fs.readFileSync('consumer.log', 'utf8'));
          }

  report-finalize:
    name: "[snap] report-finalize"
    needs: [report-start, test-snap]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: .github/actions/sdk-e2e-report-finalize
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/sdk-e2e-report-finalize
        with:
          family: snap
          platforms: ${{ needs.report-start.outputs.platform-keys }}
          comment-ids: ${{ needs.report-start.outputs.comment-ids }}
          suite: ${{ inputs.suite }}
          filter: ${{ inputs.rerun-plan != '' && 'rerun of previously failed tests' || inputs.filter }}
          exclude-suite: ${{ inputs.exclude-suite }}
          inference-provenance: ${{ inputs.inference-provenance }}
          test-suite-provenance: ${{ inputs.test-suite-provenance }}
