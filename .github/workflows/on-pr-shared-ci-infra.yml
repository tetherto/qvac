name: On PR Trigger (Shared CI Infra)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, release-*, feature-*, tmp-*]
    paths:
      - ".agents/skills/**"
      - "scripts/agent-setup.sh"
      - ".claude/skills/setup/**"
      - ".github/workflows/on-pr-shared-ci-infra.yml"
      - ".github/actions/cache-models/**"
      - ".github/actions/run-mobile-integration-tests/seed-and-presign-models/**"
      - ".github/actions/run-mobile-integration-tests/setup/**"
      - ".github/actions/run-mobile-integration-tests/build-mobile-app/**"
      - ".github/workflows/integration-mobile-test-*.yml"
      - ".github/actions/run-mobile-integration-tests/collect-and-upload-logs/**"
      - ".github/actions/run-mobile-integration-tests/extract-addon-perf/**"
      - ".github/actions/run-mobile-integration-tests/test/**"
      - ".github/actions/select-prebuild-symbols-verifier/**"
      - ".github/scripts/devicefarm-pool-run.mjs"
      - ".github/scripts/test/devicefarm-slot-wait.test.mjs"
      - "scripts/perf-report/**"
      - "scripts/ci/**"
      - "packages/ocr-ggml/.agent/setup.sh"
      - "packages/ocr-ggml/.agent/skills/**"
      - "vcpkg-overlays/triplets/**"
      - "vcpkg-overlays/toolchains/**"
      - ".github/scripts/test/fabric-cmake-layout.sh"
      - "cmake/qvac-addon/qvac-addon.cmake"
      - "packages/fabric/cmake/qvac-fabric-hosts.cmake"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  action-unit-tests:
    name: cache-models action unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - name: Run cache-models action unit tests
        run: node --test .github/actions/cache-models/test/*.test.mjs
      - name: Run seed-and-presign action unit tests
        run: node --test .github/actions/run-mobile-integration-tests/seed-and-presign-models/test/*.test.mjs
      # The prebuild_run_id resolver decides which native binary reaches a
      # device. Nothing else runs it pre-merge: the mobile workflows are
      # dispatch-only, so a broken resolver would first surface as a failed
      # manual run, or worse as a run that installed the wrong build.
      - name: Run mobile setup prebuild-run resolver unit tests
        run: node --test .github/actions/run-mobile-integration-tests/setup/test/*.test.mjs
      # The installer copies the slicer's index source, name mangling, and
      # cross-built hosts. scripts/ci/** is already a path above, so a slicer
      # change runs this parity check too.
      - name: Run mobile platform-package installer unit tests
        run: node --test .github/actions/run-mobile-integration-tests/build-mobile-app/*.test.mjs
      - name: Run mobile log collection tests
        run: node --test .github/actions/run-mobile-integration-tests/test/*.test.mjs
      # The selector decides which pinned symbol verifier a prebuild runs, and
      # prebuilds only exercise it for the addons and versions they happen to
      # build, so a wrong cutoff would first show up as a failed backport.
      - name: Run prebuild symbols verifier selector unit tests
        run: node --test .github/actions/select-prebuild-symbols-verifier/test/*.test.mjs
      # sdk-e2e, the script's only caller, runs only on label or dispatch.
      - name: Run Device Farm slot wait unit tests
        run: node --test .github/scripts/test/devicefarm-slot-wait.test.mjs

  # The per-addon benchmark aggregators are plain Node scripts that benchmarks.yml
  # runs only on dispatch and in its weekly perf report, so without this job a
  # broken normalizer would not surface until someone triggered a sweep.
  perf-report-unit-tests:
    name: perf-report aggregator unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - name: Run perf-report unit tests
        run: node --test scripts/perf-report/__tests__/*.test.js

  # The upstream-compat smoke verifiers are plain Node modules driven by the
  # *-upstream-compat.yml workflows, which run on a schedule — so without this
  # job a broken verifier would not surface until the next nightly tick, and
  # the smoke it guards would go green or red for the wrong reason.
  ci-script-unit-tests:
    name: CI script unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - name: Run CI script unit tests
        run: node --test scripts/ci/__tests__/*.test.cjs
      - name: Validate shared agent configuration
        run: node scripts/ci/validate-agent-config.mjs
      - name: Test agent setup migration safety
        run: bash scripts/ci/test-agent-setup.sh

  model-availability:
    name: Model availability (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [diffusion-cpp, llm-llamacpp, embed-llamacpp]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - name: Verify pinned models are reachable and unchanged
        run: |
          node .github/actions/cache-models/check-manifest-availability.mjs \
            --package ${{ matrix.package }} \
            --root "$GITHUB_WORKSPACE"

  fabric-lockstep:
    name: qvac-fabric version lockstep
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - name: Verify qvac-fabric versions are lockstep
        uses: ./.github/actions/verify-qvac-fabric-lockstep

  # Which @qvac/fabric runtime qvac_addon_fabric_layout() links, across every install layout; nothing else
  # configures a consumer against each layout before an addon build hits the wrong one.
  fabric-cmake-layout:
    name: Fabric CMake runtime layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      # cmake-bare and cmake-npm come from fabric's own devDependencies.
      - name: Install fabric's CMake modules
        working-directory: packages/fabric
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Resolve the runtime across install layouts
        run: .github/scripts/test/fabric-cmake-layout.sh packages/fabric/node_modules
