name: On PR Trigger (Shared CI Infra)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
    branches: [main, release-*, feature-*, tmp-*]
    paths:
      - ".github/workflows/*shared-ci-infra*.yml"
      - ".github/actions/cache-models/**"
      - "vcpkg-overlays/triplets/**"
      - "vcpkg-overlays/toolchains/**"
      - "vcpkg-overlays/ports/qvac-fabric/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/SHA) to validate. Defaults to the current ref."
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  label-gate:
    name: Authorise (label-gate)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      authorised: ${{ steps.gate.outputs.authorised }}
    steps:
      - name: Checkout (label-gate action only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/label-gate
          sparse-checkout-cone-mode: false
      - name: Run label-gate
        id: gate
        uses: ./.github/actions/label-gate
        with:
          github-token: ${{ secrets.PAT_TOKEN }}

  authorize:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - name: Authorize
        id: auth
        uses: ./.github/actions/authorize-pr
        with:
          github-token: ${{ github.token }}

  checks:
    name: Shared CI infra checks
    needs: [authorize, label-gate]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      (needs.label-gate.outputs.authorised == 'true' && needs.authorize.outputs.allowed == 'true'))
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-shared-ci-infra-checks.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.ref }}
