name: On PR Trigger (Shared CI Infra)

# Validates changes to CI infrastructure that is SHARED across many addons —
# the cache-models composite action, the vcpkg triplet/toolchain overlays, and
# the qvac-fabric vcpkg port (consumed by llm/embed/nmtcpp/etc). The port's
# owning package (packages/fabric) still validates it via on-pr-fabric.yml; the
# fan-out to every *consumer* is what this workflow replaces.
#
# History: these paths used to be listed in every addon's on-pr-*.yml trigger
# filter, so editing one of them fanned out a full prebuild+integration run to
# 11-15 addons at once (see the "why did parakeet run on a diffusion PR" thread
# / QVAC shared-infra ticket). That fan-out is removed; this single workflow is
# the replacement safety net.
#
# SECURITY MODEL — this is a privileged pull_request_target entrypoint, so it
# does exactly two trusted things and NOTHING else:
#   1. Gate: run label-gate + authorize-pr (checked out from the DEFAULT branch,
#      never PR-head). These bind trust to the approved head SHA.
#   2. Delegate: hand the approved SHA to the reusable
#      reusable-shared-ci-infra-checks.yml, which is where every PR-head
#      checkout + code execution happens. Keeping untrusted checkout out of the
#      pull_request_target job is what clears CodeQL's untrusted-checkout /
#      cache-poisoning alerts (the same split the addon pipelines use).
#
# The delegated checks are cheap and read-only: no model cache is written and no
# prebuild is published. A full integration canary and a vcpkg build canary are
# deliberately out of scope (they would reintroduce the fan-out cost); gate them
# behind an explicit label if the team decides they are worth it.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
    branches: [main, release-*, feature-*, tmp-*]
    paths:
      - ".github/workflows/*shared-ci-infra*.yml"
      - ".github/actions/cache-models/**"
      - "vcpkg-overlays/triplets/**"
      - "vcpkg-overlays/toolchains/**"
      - "vcpkg-overlays/ports/qvac-fabric/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/SHA) to validate. Defaults to the current ref."
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Gating composites are checked out from the DEFAULT branch (never PR-head),
  # so an untrusted fork PR cannot alter the authorisation logic. Skipped on
  # workflow_dispatch so the workflow can be exercised on a feature branch
  # before it is merged (pull_request_target always runs the base-branch copy).
  label-gate:
    name: Authorise (label-gate)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      authorised: ${{ steps.gate.outputs.authorised }}
    steps:
      - name: Checkout (label-gate action only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/label-gate
          sparse-checkout-cone-mode: false
      - name: Run label-gate
        id: gate
        uses: ./.github/actions/label-gate
        with:
          github-token: ${{ secrets.PAT_TOKEN }}

  authorize:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - name: Authorize
        id: auth
        uses: ./.github/actions/authorize-pr
        with:
          github-token: ${{ github.token }}

  # All PR-head checkout + execution happens inside the reusable workflow, never
  # in this privileged entrypoint. The approved, immutable head SHA is handed
  # down explicitly (label-gate/authorize-pr bind trust to that exact commit).
  checks:
    name: Shared CI infra checks
    needs: [authorize, label-gate]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
      (needs.label-gate.outputs.authorised == 'true' && needs.authorize.outputs.allowed == 'true'))
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-shared-ci-infra-checks.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.ref }}
