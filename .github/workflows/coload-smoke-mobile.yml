# Reusable multi-addon co-load smoke on Android (AWS Device Farm).
#
# The @qvac/tts-ggml@0.2.1 dlopen crash only reproduced once MANY ggml addons
# were co-loaded into one process on a real Android device -- exactly what the
# SDK consumer does at bootstrap. This reuses the SDK mobile bundle machinery
# (test-android-sdk.yml) to build a consumer bundling the full plugin set and
# runs it on Device Farm. THIS PR's freshly-built android-arm64 prebuild for
# `addon` is overlaid onto the bundle (overlay-prebuild-addon), so the on-device
# co-load exercises the PR's diff, not the published npm baseline.
#
# Called by on-pr-<addon>.yml and gated (ci-router) by run-coload-tests AND
# run-mobile-addon-tests -- Device Farm is expensive, so the on-device co-load
# is opt-in per PR (new model / new GPU work) rather than automatic. We run only
# the full bundle ("all"), the exact all-addon Android bootstrap that crashed in
# 0.2.1, to keep the signal clean and the device count to one.

name: Co-load smoke (ggml, mobile)

on:
  workflow_call:
    inputs:
      addon:
        description: "Addon short name whose PR prebuild to overlay (e.g. tts-ggml); must expose an SDK plugin (addons.js)."
        required: true
        type: string
      repository:
        description: "Repository to checkout (defaults to this repo)."
        required: false
        type: string
      ref:
        description: "Git ref to checkout (defaults to the triggering ref)."
        required: false
        type: string

permissions:
  actions: read
  id-token: write
  contents: read
  pull-requests: write
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      combos: ${{ steps.gen.outputs.combos }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Compute mobile co-load combination (full bundle)
        id: gen
        working-directory: packages/ggml-coload-smoke
        shell: bash
        run: node scripts/coload-combinations.mjs --mobile --only all

  mobile-coload:
    needs: prepare
    if: ${{ needs.prepare.outputs.combos != '' && needs.prepare.outputs.combos != '[]' }}
    permissions:
      actions: read
      id-token: write
      contents: read
      pull-requests: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        combo: ${{ fromJSON(needs.prepare.outputs.combos) }}
    name: coload-${{ matrix.combo.name }}
    uses: ./.github/workflows/test-android-sdk.yml
    with:
      project-directory: "packages/sdk"
      working-directory: "packages/sdk/e2e"
      plugins: ${{ matrix.combo.plugins }}
      overlay-prebuild-addon: ${{ inputs.addon }}
      test-version: ${{ inputs.ref }}
      suite: smoke
      consumer-timeout: 1200
      device-farm-timeout: 90
      device-farm-project-arn: ${{ vars.SDK_DEVICE_FARM_PROJECT_ARN }}
      device-pools: ${{ vars.SDK_ANDROID_DEVICE_FARM_POOLS }}
    # AWS_OIDC_ROLE_ARN is a repository secret, not a `release` environment
    # secret, so the called workflow's `environment: release` jobs cannot
    # resolve it on their own. Omitting it here leaves `role-to-assume` empty
    # and every Device Farm job fails to authenticate.
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      MQTT_PROTOCOL: ${{ secrets.MQTT_PROTOCOL }}
      MQTT_HOST: ${{ secrets.MQTT_HOST }}
      MQTT_PORT: ${{ secrets.MQTT_PORT }}
      MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
      MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
      MQTT_CA_CERT: ${{ secrets.MQTT_CA_CERT }}
      AWS_OIDC_ROLE_ARN: ${{ secrets.AWS_OIDC_ROLE_ARN }}
