# Reusable multi-addon co-load smoke on Android (AWS Device Farm).
#
# The @qvac/tts-ggml@0.2.1 dlopen crash only reproduced once MANY ggml addons
# were co-loaded into one process on a real Android device -- exactly what the
# SDK consumer does at bootstrap. This reuses the SDK mobile bundle machinery
# (test-android-sdk.yml) to build a consumer bundling the full plugin set and
# runs it on Device Farm. THIS PR's freshly-built android-arm64 prebuild for
# `addon` is overlaid onto the bundle (overlay-prebuild-addon), so the on-device
# co-load exercises the PR's diff, not the published npm baseline.
#
# Called by on-pr-<addon>.yml and gated (ci-router) by run-coload-tests AND
# run-mobile-addon-tests -- Device Farm is expensive, so the on-device co-load
# is opt-in per PR (new model / new GPU work) rather than automatic. We run only
# the full bundle ("all"), the exact all-addon Android bootstrap that crashed in
# 0.2.1, to keep the signal clean and the device count to one.
#
# The consumer build compiles packages/sdk from THIS checkout, so
# @qvac/inference must come from the same tree: the SDK on main can depend on
# surface exports the published npm package does not have yet. prepare-inference
# packs the branch's packages/inference and hands it to test-android-sdk.yml,
# the same branch-mode resolution the SDK e2e uses (test-sdk.yml).

name: Co-load smoke (ggml, mobile)

on:
  workflow_call:
    inputs:
      addon:
        description: "Addon short name whose PR prebuild to overlay (e.g. tts-ggml); must expose an SDK plugin (addons.js)."
        required: true
        type: string
      repository:
        description: "Repository to checkout (defaults to this repo)."
        required: false
        type: string
      ref:
        description: "Git ref to checkout (defaults to the triggering ref)."
        required: false
        type: string

permissions:
  actions: read
  id-token: write
  contents: read
  pull-requests: write
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      combos: ${{ steps.gen.outputs.combos }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Compute mobile co-load combination (full bundle)
        id: gen
        working-directory: packages/ggml-coload-smoke
        shell: bash
        run: node scripts/coload-combinations.mjs --mobile --only all

  prepare-inference:
    name: Resolve inference source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      packages: read
    outputs:
      source: ${{ steps.inference.outputs.source }}
      dependency-spec: ${{ steps.inference.outputs.dependency-spec }}
      provenance: ${{ steps.inference.outputs.provenance }}
      artifact-name: ${{ steps.artifact.outputs.name }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc
    steps:
      - id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          sparse-checkout: |
            packages/sdk/package.json
            packages/inference
            .github/actions/sdk-e2e-prepare-inference
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # 2.2.0
        with:
          bun-version: latest

      - name: Configure package registries
        shell: node {0}
        run: |
          const fs = require('fs');
          const lines = [
            'registry=https://registry.npmjs.org/',
            '@qvac:registry=https://registry.npmjs.org/',
            '@tetherto:registry=https://npm.pkg.github.com/',
          ];
          if (process.env.NPM_TOKEN) {
            lines.push(`//registry.npmjs.org/:_authToken=${process.env.NPM_TOKEN}`);
          }
          if (process.env.PAT_TOKEN) {
            lines.push(`//npm.pkg.github.com/:_authToken=${process.env.PAT_TOKEN}`);
          }
          fs.writeFileSync(process.env.NPM_CONFIG_USERCONFIG, `${lines.join('\n')}\n`);

      - name: Resolve and prepare inference
        id: inference
        shell: bash
        env:
          INFERENCE_SOURCE: branch
          PROJECT_DIRECTORY: packages/sdk
          INFERENCE_DIRECTORY: packages/inference
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/coload-mobile-inference-package
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        run: node .github/actions/sdk-e2e-prepare-inference/prepare.mjs resolve

      - name: Derive branch artifact name
        id: artifact
        shell: node {0}
        run: |
          const fs = require('fs');
          const name = `coload-mobile-inference-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${name}\n`);

      - name: Upload branch inference package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.inference.outputs.artifact-path }}
          if-no-files-found: error
          retention-days: 7

  mobile-coload:
    needs: [prepare, prepare-inference]
    if: ${{ needs.prepare.outputs.combos != '' && needs.prepare.outputs.combos != '[]' }}
    permissions:
      actions: read
      id-token: write
      contents: read
      pull-requests: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        combo: ${{ fromJSON(needs.prepare.outputs.combos) }}
    name: coload-${{ matrix.combo.name }}
    uses: ./.github/workflows/test-android-sdk.yml
    with:
      project-directory: "packages/sdk"
      working-directory: "packages/sdk/e2e"
      plugins: ${{ matrix.combo.plugins }}
      overlay-prebuild-addon: ${{ inputs.addon }}
      test-version: ${{ inputs.ref }}
      repository: ${{ inputs.repository }}
      inference-source: ${{ needs.prepare-inference.outputs.source }}
      inference-dependency-spec: ${{ needs.prepare-inference.outputs.dependency-spec }}
      inference-artifact-name: ${{ needs.prepare-inference.outputs.artifact-name }}
      inference-provenance: ${{ needs.prepare-inference.outputs.provenance }}
      suite: smoke
      consumer-timeout: 1200
      device-farm-timeout: 90
      device-farm-project-arn: ${{ vars.SDK_DEVICE_FARM_PROJECT_ARN }}
      device-pools: ${{ vars.SDK_ANDROID_DEVICE_FARM_POOLS }}
    # AWS_OIDC_ROLE_ARN is a repository secret, not a `release` environment
    # secret, so the called workflow's `environment: release` jobs cannot
    # resolve it on their own. Omitting it here leaves `role-to-assume` empty
    # and every Device Farm job fails to authenticate.
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      MQTT_PROTOCOL: ${{ secrets.MQTT_PROTOCOL }}
      MQTT_HOST: ${{ secrets.MQTT_HOST }}
      MQTT_PORT: ${{ secrets.MQTT_PORT }}
      MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
      MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
      MQTT_CA_CERT: ${{ secrets.MQTT_CA_CERT }}
      AWS_OIDC_ROLE_ARN: ${{ secrets.AWS_OIDC_ROLE_ARN }}
