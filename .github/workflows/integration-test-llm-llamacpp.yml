name: Integration Tests (LLM)

on:
  workflow_call:
    inputs:
      prebuild_package:
        description: "NPM package containing prebuilds (e.g. @qvac/llm-llamacpp@1.0.0)"
        type: string
        required: false
      ref:
        description: "ref"
        type: string
      repository:
        type: string
      model:
        type: string
      qvac_perf_runs:
        description: "Override QVAC_PERF_RUNS (number of counted iterations per perf test). Empty = test default."
        type: string
        required: false
        default: ""
      qvac_perf_warmup_runs:
        description: "Override QVAC_PERF_WARMUP_RUNS (number of warmup iterations per perf test). Empty = test default."
        type: string
        required: false
        default: ""
      qvac_perf_only:
        description: "If true, run only the perf-emitting tests (image-*, bitnet, tool-calling, gemma4-image-*-perf, qwen3-5-image-*-perf)."
        type: boolean
        required: false
        default: false

  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to test"
        type: string
        required: false
        default: main
      prebuild_package:
        description: "NPM package containing prebuilds (e.g. @qvac/llm-llamacpp@1.0.0)"
        type: string
        required: true
      qvac_perf_runs:
        description: "Override QVAC_PERF_RUNS (number of counted iterations per perf test). Empty = test default."
        type: string
        required: false
        default: ""
      qvac_perf_warmup_runs:
        description: "Override QVAC_PERF_WARMUP_RUNS (number of warmup iterations per perf test). Empty = test default."
        type: string
        required: false
        default: ""
      qvac_perf_only:
        description: "If true, run only the perf-emitting tests."
        type: boolean
        required: false
        default: false

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  run-integration-tests:
    needs: runner_names
    # smoke_timeout_minutes applies only in default mode; qvac_perf_only runs
    # the full perf list and keeps the leg's normal timeout_minutes.
    timeout-minutes: ${{ (!inputs.qvac_perf_only && matrix.smoke_timeout_minutes) || matrix.timeout_minutes || 360 }}
    continue-on-error: true
    runs-on: ${{ matrix.runner }}
    environment: release
    name: test-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.force_vulkan == 'true' && '-vulkan' || '' }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WORKDIR: packages/llm-llamacpp
      NO_GPU: ${{ matrix.no_gpu || 'false' }}
      # QVAC-23763: marks a leg as the Vulkan half of an NVIDIA runner. Not set
      # as CUDA_VISIBLE_DEVICES directly, because an unset matrix field is the
      # empty string and an empty CUDA_VISIBLE_DEVICES hides every CUDA device
      # just like -1. The test step exports the real variable when this is
      # 'true'.
      FORCE_VULKAN: ${{ matrix.force_vulkan || 'false' }}
    permissions:
      contents: read
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # QVAC-17830: `label` disambiguates matrix entries that share
        # the same `<platform>-<arch>` tuple so every entry produces a
        # uniquely-named perf-report artifact. Without this, the two
        # `linux-x64` entries (ubuntu 22 vs 24 GPU runners) and the two
        # `linux-arm64` entries (ubuntu 22 vs 24) collided on upload
        # and `actions/download-artifact` silently dropped one of each,
        # hiding GPU data in the combined report.
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            runner: ${{ needs.runner_names.outputs.linux_ubuntu2204_x64_gpu }}
            label: linux-x64-u22-gpu
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            runner: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64_gpu }}
            timeout_minutes: 480
            label: linux-x64-u24-gpu
          # QVAC-23763: the qvac-ubuntu*-x64-gpu runners are NVIDIA, so the same
          # box covers both GPU backends. This entry is the Vulkan half; the one
          # above runs CUDA, now the default.
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            runner: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64_gpu }}
            timeout_minutes: 480
            force_vulkan: 'true'
            label: linux-x64-u24-gpu-vulkan
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            runner: ${{ needs.runner_names.outputs.ubuntu_2404_arm }}
            no_gpu: 'true'
            label: linux-arm64-u24
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            runner: ${{ needs.runner_names.outputs.ubuntu_2204_arm }}
            no_gpu: 'true'
            label: linux-arm64-u22
          - os: macos-15-xlarge
            platform: darwin
            arch: arm64
            runner: ${{ needs.runner_names.outputs.macos_arm64_gpu }}
            label: darwin-arm64
          # Smoke check for the x64 prebuild; darwin-arm64 runs the full suite.
          - os: macos-15-large
            platform: darwin
            arch: x64
            runner: ${{ needs.runner_names.outputs.macos_15_large }}
            smoke_timeout_minutes: 45
            label: darwin-x64
            single_test: test/integration/api-behavior.test.js
          - os: windows-2025
            platform: win32
            arch: x64
            runner: ${{ needs.runner_names.outputs.win_2025_x64_gpu }}
            label: win32-x64

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Windows - configure git
        if: ${{ matrix.platform == 'win32' }}
        run: |
          # git config --system core.longpaths true
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}:@github.com/".insteadOf "https://github.com/"
          git config --global url."https://${{ secrets.GITHUB_TOKEN }}:@github.com/".insteadOf "git@github.com:"
        shell: powershell
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache integration test models
        id: model-cache
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/cache-models
        with:
          package: llm-llamacpp

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # 6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Install NPM dependencies
        working-directory: ${{ env.WORKDIR }}
        run: |
          npm install

      - name: Install bare tooling
        run: npm install -g --force bare bare-make bare-runtime bare-https brittle

      - name: Download prebuilds (from artifacts)
        if: ${{ !inputs.prebuild_package }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          path: ${{ runner.temp }}/prebuilds-staging
          merge-multiple: true

      - name: Move prebuilds from staging to workspace (Unix)
        if: ${{ !inputs.prebuild_package && matrix.platform != 'win32' }}
        shell: bash
        run: |
          mkdir -p ${{ env.WORKDIR }}/prebuilds
          cp -r ${{ runner.temp }}/prebuilds-staging/* ${{ env.WORKDIR }}/prebuilds/
          echo "Prebuilds moved from staging area"
          ls -la ${{ env.WORKDIR }}/prebuilds/

      # Windows path: bash cp -r mangles `${{ runner.temp }}` (= "C:\a\_temp")
      # because Git Bash interprets `\a`/`\_` as escape sequences, so the
      # source path becomes invalid and the copy silently no-ops. Use
      # PowerShell Copy-Item with native Windows paths.
      - name: Move prebuilds from staging to workspace (Windows)
        if: ${{ !inputs.prebuild_package && matrix.platform == 'win32' }}
        shell: powershell
        run: |
          $dst = "${{ env.WORKDIR }}/prebuilds"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item -Recurse -Force "${{ runner.temp }}\prebuilds-staging\*" $dst
          Write-Host "Prebuilds moved from staging area"
          Get-ChildItem -Recurse $dst | Select-Object FullName | Format-Table -AutoSize

      - name: Download prebuilds from package (Linux/macOS)
        if: ${{ inputs.prebuild_package && matrix.platform != 'win32' }}
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          PACKAGE="${{ inputs.prebuild_package }}"
          echo "Downloading $PACKAGE from npm..."

          if ! npm pack $PACKAGE; then
            echo "ERROR: Failed to download $PACKAGE from npm"
            echo "Please check that the package exists"
            exit 1
          fi

          tar -xzf *.tgz

          if [ ! -d "package/prebuilds" ]; then
            echo "ERROR: No prebuilds directory found in package"
            echo "The downloaded package may not contain prebuilt binaries"
            exit 1
          fi

          mv package/prebuilds ./prebuilds
          rm -rf package *.tgz

          echo "Prebuilds downloaded from npm successfully"
          ls -la prebuilds/

      - name: Download prebuilds from package (Windows)
        if: ${{ inputs.prebuild_package && matrix.platform == 'win32' }}
        working-directory: ${{ env.WORKDIR }}
        shell: powershell
        run: |
          $PACKAGE = "${{ inputs.prebuild_package }}"

          echo "Downloading $PACKAGE from npm..."

          npm pack $PACKAGE
          if ($LASTEXITCODE -ne 0) {
            echo "ERROR: Failed to download $PACKAGE from npm"
            echo "Please check that the package exists"
            exit 1
          }

          $TARBALL = Get-ChildItem -Filter "*.tgz" | Select-Object -First 1 -ExpandProperty Name
          if (-not $TARBALL) {
            echo "ERROR: Could not find downloaded tarball"
            exit 1
          }

          echo "Extracting $TARBALL..."
          tar -xzf $TARBALL

          if (-not (Test-Path "package/prebuilds")) {
            echo "ERROR: No prebuilds directory found in package"
            echo "The downloaded package may not contain prebuilt binaries"
            exit 1
          }

          Move-Item package/prebuilds ./prebuilds

          Remove-Item -Recurse -Force package
          Remove-Item $TARBALL

          echo "Prebuilds downloaded from npm successfully"
          Get-ChildItem prebuilds/

      - name: Linux - install dependencies
        if: matrix.os == 'ubuntu-22.04-arm' || matrix.os == 'ubuntu-24.04-arm'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - name: Run integration test (Linux/macOS)
        if: ${{ matrix.platform != 'win32' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          # QVAC-23763: export CUDA_VISIBLE_DEVICES only for the Vulkan leg.
          # Exporting it unconditionally would set it to the empty string
          # elsewhere, which hides every CUDA device just as -1 does.
          if [ "${FORCE_VULKAN}" = "true" ]; then
            echo "FORCE_VULKAN=true: hiding CUDA devices so the addon selects Vulkan"
            export CUDA_VISIBLE_DEVICES=-1
          fi
          if [ "${{ inputs.qvac_perf_only }}" = "true" ]; then
            echo "qvac_perf_only=true: regenerating test/integration/all.js with perf-emitting tests only"
            npx brittle -r test/integration/all.js \
              test/integration/bitnet.test.js \
              test/integration/tool-calling.test.js \
              test/integration/image-elephant.test.js \
              test/integration/image-fruit-plate.test.js \
              test/integration/image-high-res-aurora.test.js \
              test/integration/gemma4-image-elephant-perf.test.js \
              test/integration/gemma4-image-fruit-plate-perf.test.js \
              test/integration/gemma4-image-high-res-aurora-perf.test.js \
              test/integration/qwen3-5-image-elephant-perf.test.js \
              test/integration/qwen3-5-image-fruit-plate-perf.test.js \
              test/integration/qwen3-5-image-high-res-aurora-perf.test.js
            bare test/integration/all.js --exit 2>&1 | tee test-output.log
            exit ${PIPESTATUS[0]}
          fi
          if [ -n "${{ matrix.single_test }}" ]; then
            echo "single_test set: running only ${{ matrix.single_test }} on ${{ matrix.label }}"
            npm run build:ts
            npx brittle -r test/integration/all.js "${{ matrix.single_test }}"
            bare test/integration/all.js --exit 2>&1 | tee test-output.log
            exit "${PIPESTATUS[0]}"
          fi
          npm run test:integration 2>&1 | tee test-output.log
          exit ${PIPESTATUS[0]}
        shell: bash
        env:
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
          QVAC_PERF_RUNS: ${{ inputs.qvac_perf_runs }}
          QVAC_PERF_WARMUP_RUNS: ${{ inputs.qvac_perf_warmup_runs }}

      - name: Run integration test (Windows)
        if: ${{ matrix.platform == 'win32' }}
        working-directory: ${{ env.WORKDIR }}
        run: |
          if ("${{ inputs.qvac_perf_only }}" -eq "true") {
            Write-Host "qvac_perf_only=true: regenerating test/integration/all.js with perf-emitting tests only"
            npx brittle -r test/integration/all.js `
              test/integration/bitnet.test.js `
              test/integration/tool-calling.test.js `
              test/integration/image-elephant.test.js `
              test/integration/image-fruit-plate.test.js `
              test/integration/image-high-res-aurora.test.js `
              test/integration/gemma4-image-elephant-perf.test.js `
              test/integration/gemma4-image-fruit-plate-perf.test.js `
              test/integration/gemma4-image-high-res-aurora-perf.test.js `
              test/integration/qwen3-5-image-elephant-perf.test.js `
              test/integration/qwen3-5-image-fruit-plate-perf.test.js `
              test/integration/qwen3-5-image-high-res-aurora-perf.test.js
          } elseif ("${{ matrix.single_test }}" -ne "") {
            Write-Host "single_test set: running only ${{ matrix.single_test }} on ${{ matrix.label }}"
            npm run build:ts
            npx brittle -r test/integration/all.js "${{ matrix.single_test }}"
          } else {
            npm run test:integration:generate
          }
          bare test/integration/all.js --exit | Tee-Object test-output.log
        shell: powershell
        env:
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
          QVAC_PERF_RUNS: ${{ inputs.qvac_perf_runs }}
          QVAC_PERF_WARMUP_RUNS: ${{ inputs.qvac_perf_warmup_runs }}

      - name: Generate HTML performance report
        if: ${{ always() && !cancelled() }}
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          if [ -f test/results/performance-report.json ]; then
            echo "Found performance-report.json, generating HTML/MD/summary..."
            node ../../scripts/perf-report/aggregate.js \
              --dir test/results \
              --output-html test/results/performance-report.html \
              --output-json test/results/performance-summary.json \
              --output test/results/performance-report.md
          else
            echo "performance-report.json not found - skipping HTML generation"
          fi

      - name: Upload performance report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: perf-report-llamacpp-llm-${{ matrix.label }}-${{ github.run_number }}
          path: |
            ${{ env.WORKDIR }}/test/results/performance-report.json
            ${{ env.WORKDIR }}/test/results/performance-report.html
            ${{ env.WORKDIR }}/test/results/performance-summary.json
            ${{ env.WORKDIR }}/test/results/performance-report.md
          retention-days: 90
          if-no-files-found: ignore

