name: Benchmark on Publish (NMTCPP)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Addon version to benchmark (leave empty to use package.json version)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Addon version to benchmark'
        required: false
        type: string


# Canonical runner labels — .github/actions/runner-names/runners.yaml
env:
  RN_ORCH: ubuntu-latest
  RN_U22: ubuntu-22.04
  RN_U24: ubuntu-24.04
  RN_U22_ARM: ubuntu-22.04-arm
  RN_U24_ARM: ubuntu-24.04-arm
  RN_MAC14: macos-14
  RN_MAC14_XL: macos-14-xlarge
  RN_MAC15: macos-15
  RN_MAC15_INTEL: macos-15-intel
  RN_MAC15_LG: macos-15-large
  RN_MAC15_XL: macos-15-xlarge
  RN_WIN22: windows-2022
  RN_WIN25: windows-2025
  RN_QVAC_U22: qvac-ubuntu2204-x64
  RN_QVAC_U22_GPU: qvac-ubuntu2204-x64-gpu
  RN_QVAC_U24: qvac-ubuntu2404-x64
  RN_QVAC_U24_GPU: qvac-ubuntu2404-x64-gpu
  RN_QVAC_WIN25: qvac-win25-x64
  RN_QVAC_WIN25_GPU: qvac-win25-x64-gpu
  RN_AI_LINUX: ai-run-linux
  RN_AI_LINUX_GPU: ai-run-linux-gpu
  RN_AI_U22: ai-run-ubuntu-22.04
  RN_AI_WIN11_GPU: ai-run-windows11-gpu
  RN_GEN_WIN11: generator-windows11
  RN_MINI_M4: mac-mini-m4
  RN_MINI_M4_GPU: mac-mini-m4-gpu
  RN_LBL_U22_X64: ubuntu-22.04-x64
  RN_LBL_U22_X64_GPU: ubuntu-22.04-x64-gpu
  RN_LBL_U24_X64: ubuntu-24.04-x64
  RN_LBL_U24_X64_GPU: ubuntu-24.04-x64-gpu
  RN_LBL_U24_ARM64: ubuntu-24.04-arm64
  RN_LBL_WIN22_X64: windows-2022-x64
  RN_LBL_WIN25_X64: windows-2025-x64
  RN_LBL_WIN25_X64_GPU: windows-2025-x64-gpu
  PKG_DIR: packages/translation-nmtcpp

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  label-gate:
    name: Authorise (label-gate)
    runs-on: ${{ env.RN_ORCH }}
    permissions:
      contents: read
      pull-requests: write
    outputs:
      authorised: ${{ steps.gate.outputs.authorised }}
    steps:
      - name: Checkout (label-gate action only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/label-gate
          sparse-checkout-cone-mode: false
      - name: Run label-gate
        id: gate
        uses: ./.github/actions/label-gate
        with:
          github-token: ${{ secrets.PAT_TOKEN }}
  prepare:
    runs-on: ${{ env.RN_ORCH }}
    environment: release
    outputs:
      bergamot_pairs: ${{ steps.read-bergamot.outputs.pairs }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Get addon version
        id: get-version
        working-directory: ${{ env.PKG_DIR }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version=$(node -p "require('./package.json').version")
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "📦 Benchmarking addon version: $version"

      - name: Read released Bergamot models
        id: read-bergamot
        working-directory: ${{ env.PKG_DIR }}
        run: |
          pairs=$(grep -v '^#' .github/released-models-bergamot.txt | grep -v '^[[:space:]]*$' | tr -d '\r' | tr '\n' ',' | sed 's/,$//')
          echo "pairs=$pairs" >> $GITHUB_OUTPUT
          echo "🎯 Released Bergamot model pairs: $pairs"

    needs:
      - label-gate
    if: needs.label-gate.outputs.authorised == 'true'
  benchmark-bergamot:
    permissions:
      contents: read
      packages: read
      id-token: write
    needs:
      - prepare
      - label-gate
    uses: ./.github/workflows/benchmark-translation-nmtcpp.yml
    secrets: inherit
    with:
      pairs: ${{ needs.prepare.outputs.bergamot_pairs }}
      translators: 'qvac_bergamot'
      dataset_flores_devtest: true
      dataset_conversational_phrases: true
      metric_chrfpp: true
      metric_comet: true
      use_pivot: false
      is_quantized_model: false
      use_batch: false
      hyperparams: 'fast'

    if: needs.label-gate.outputs.authorised == 'true'
  summary:
    needs: [prepare, benchmark-bergamot]
    runs-on: ${{ env.RN_ORCH }}
    if: always()
    steps:
      - name: Display benchmark summary
        run: |
          echo "✅ Automated benchmark completed for all supported models"
          echo ""
          echo "📦 Addon Version: ${{ needs.prepare.outputs.version }}"
          echo "📊 Datasets: flores-devtest, conversational-phrases"
          echo "📈 Metrics: chrF++, COMET"
          echo ""
          echo "### 🔧 Bergamot Models (qvac_bergamot)"
          echo "🎯 Pairs: ${{ needs.prepare.outputs.bergamot_pairs }}"
          echo ""
          echo "📍 Model Source: Firefox Remote Settings CDN"
          echo "   URL: https://firefox.settings.services.mozilla.com/v1/buckets/main/collections/translations-models/records"
          IFS=',' read -ra PAIRS <<< "${{ needs.prepare.outputs.bergamot_pairs }}"
          for pair in "${PAIRS[@]}"; do
            pair=$(echo "$pair" | xargs)
            src_lang="${pair%-*}"
            trg_lang="${pair#*-}"
            echo "- **$pair**: Firefox CDN (fromLang=${src_lang}, toLang=${trg_lang})"
          done
          echo ""
          echo "🔗 View results in the benchmark workflow artifacts"
