name: On Merge to Main

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  prebuild:
    uses: ./.github/workflows/prebuilds.yaml
    secrets: inherit
    with:
      publish_target: 'npm'

  run-integration-tests:
    needs: prebuild
    uses: ./.github/workflows/integration-test.yaml
    secrets: inherit
