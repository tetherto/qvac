name: RTF Benchmark (Parakeet)

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Repo to build (owner/name). Defaults to this repo."
        required: false
        type: string
      ref:
        description: "Git ref (branch/tag/SHA). Defaults to current ref."
        required: false
        type: string
      workdir:
        description: "Package working directory in monorepo."
        required: false
        type: string
        default: "packages/qvac-lib-infer-parakeet"
  workflow_call:
    inputs:
      ref:
        description: "ref"
        type: string
      repository:
        type: string
      workdir:
        description: "Relative path to package directory in monorepo"
        required: false
        default: "packages/qvac-lib-infer-parakeet"
        type: string

jobs:
  rtf-benchmark:
    timeout-minutes: 60
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    name: rtf-${{ matrix.os }}-${{ matrix.platform }}-${{ matrix.arch }}
    env:
      GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ai-run-ubuntu-22.04
            platform: linux
            arch: x64
          - os: ai-run-linux-gpu
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm64-private
            platform: linux
            arch: arm64
          - os: macos-14-xlarge
            platform: darwin
            arch: arm64
          - os: macos-15-large
            platform: darwin
            arch: x64
          - os: windows-2022
            platform: win32
            arch: x64

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Windows - enable git long paths
        if: ${{ matrix.platform == 'win32' }}
        shell: bash
        run: git config --system core.longpaths true

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure scoped registry for @tetherto and @qvac packages
        env:
          GPR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -eu
          cd ${{ inputs.workdir || 'packages/qvac-lib-infer-parakeet' }}
          cat > .npmrc <<NPMRC
          always-auth=true
          registry=https://registry.npmjs.org/
          @qvac:registry=https://registry.npmjs.org/
          @tetherto:registry=https://npm.pkg.github.com/
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          //npm.pkg.github.com/:_authToken=${GPR_TOKEN}
          NPMRC

          if [ -n "${{ secrets.PAT_TOKEN }}" ]; then
            git config --global url."https://${{ secrets.PAT_TOKEN }}:@github.com/".insteadOf "https://github.com/"
            git config --global url."https://${{ secrets.PAT_TOKEN }}:@github.com/".insteadOf "git@github.com:"
          else
            git config --global url."https://${{ github.token }}:@github.com/".insteadOf "https://github.com/"
            git config --global url."https://${{ github.token }}:@github.com/".insteadOf "git@github.com:"
          fi

      - name: Install NPM dependencies
        working-directory: ${{ inputs.workdir || 'packages/qvac-lib-infer-parakeet' }}
        run: |
          npm install
          npm install -g bare bare-make

      - name: Download prebuilds from artifact
        uses: actions/download-artifact@v7
        with:
          path: ${{ inputs.workdir || 'packages/qvac-lib-infer-parakeet' }}/prebuilds
          merge-multiple: true

      - name: Linux - install dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Run RTF benchmark
        shell: bash
        working-directory: ${{ inputs.workdir || 'packages/qvac-lib-infer-parakeet' }}
        run: npm run test:benchmark:rtf
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/${{ inputs.workdir || 'packages/qvac-lib-infer-parakeet' }}/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/${{ inputs.workdir || 'packages/qvac-lib-infer-parakeet' }}/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}

      - name: Upload RTF results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtf-results-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ inputs.workdir || 'packages/qvac-lib-infer-parakeet' }}/benchmarks/results/rtf-benchmark-*.json
          retention-days: 90

      - name: Add RTF results to job summary
        if: always()
        shell: bash
        working-directory: ${{ inputs.workdir || 'packages/qvac-lib-infer-parakeet' }}
        run: |
          RESULT_FILE="benchmarks/results/rtf-benchmark-${{ matrix.platform }}-${{ matrix.arch }}.json"

          echo "### RTF Benchmark — ${{ matrix.platform }}-${{ matrix.arch }} (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "$RESULT_FILE" ]; then
            # Extract values with Node.js (available on all runners)
            node -e "
              const r = JSON.parse(require('fs').readFileSync('${RESULT_FILE}', 'utf8'));
              const s = r.summary;
              const lines = [
                '| Metric | Mean | Min | Max | P50 | P95 | Stddev |',
                '|--------|------|-----|-----|-----|-----|--------|',
                '| RTF | ' + s.rtf.mean.toFixed(4) + ' | ' + s.rtf.min.toFixed(4) + ' | ' + s.rtf.max.toFixed(4) + ' | ' + s.rtf.p50.toFixed(4) + ' | ' + s.rtf.p95.toFixed(4) + ' | ' + s.rtf.stddev.toFixed(4) + ' |',
                '| Wall (ms) | ' + s.wallMs.mean.toFixed(0) + ' | ' + s.wallMs.min.toFixed(0) + ' | ' + s.wallMs.max.toFixed(0) + ' | ' + s.wallMs.p50.toFixed(0) + ' | ' + s.wallMs.p95.toFixed(0) + ' | ' + s.wallMs.stddev.toFixed(0) + ' |',
                '| Tokens/s | ' + s.tokensPerSecond.mean.toFixed(1) + ' | ' + s.tokensPerSecond.min.toFixed(1) + ' | ' + s.tokensPerSecond.max.toFixed(1) + ' | ' + s.tokensPerSecond.p50.toFixed(1) + ' | ' + s.tokensPerSecond.p95.toFixed(1) + ' | ' + s.tokensPerSecond.stddev.toFixed(1) + ' |',
                '| Encoder (ms) | ' + s.encoderMs.mean.toFixed(0) + ' | ' + s.encoderMs.min.toFixed(0) + ' | ' + s.encoderMs.max.toFixed(0) + ' | ' + s.encoderMs.p50.toFixed(0) + ' | ' + s.encoderMs.p95.toFixed(0) + ' | ' + s.encoderMs.stddev.toFixed(0) + ' |',
                '| Decoder (ms) | ' + s.decoderMs.mean.toFixed(0) + ' | ' + s.decoderMs.min.toFixed(0) + ' | ' + s.decoderMs.max.toFixed(0) + ' | ' + s.decoderMs.p50.toFixed(0) + ' | ' + s.decoderMs.p95.toFixed(0) + ' | ' + s.decoderMs.stddev.toFixed(0) + ' |',
                '',
                '> Audio: ' + r.audio.durationSec.toFixed(2) + 's | Runs: ' + s.rtf.count + ' | GPU: ' + r.config.useGPU + ' | Threads: ' + r.config.maxThreads,
              ];
              console.log(lines.join('\n'));
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "Results file not found: \`${RESULT_FILE}\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

  summary:
    needs: rtf-benchmark
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all RTF results
        uses: actions/download-artifact@v7
        with:
          pattern: rtf-results-*
          merge-multiple: true
          path: results

      - name: Generate cross-device comparison
        shell: bash
        run: |
          echo "## RTF Benchmark — Cross-Device Comparison" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Mean RTF | P50 RTF | P95 RTF | Mean Wall (ms) | Tokens/s |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|---------|---------|----------------|----------|" >> $GITHUB_STEP_SUMMARY

          for f in results/rtf-benchmark-*.json; do
            [ -f "$f" ] || continue
            node -e "
              const r = JSON.parse(require('fs').readFileSync('${f}', 'utf8'));
              const s = r.summary;
              console.log('| ' + r.platform + ' | ' + s.rtf.mean.toFixed(4) + ' | ' + s.rtf.p50.toFixed(4) + ' | ' + s.rtf.p95.toFixed(4) + ' | ' + s.wallMs.mean.toFixed(0) + ' | ' + s.tokensPerSecond.mean.toFixed(1) + ' |');
            " >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
