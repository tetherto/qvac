name: On Merge Model Cache (Diffusion)

# Seeds the three `models-diffusion-cpp-v2-{base,ideogram,ltx}-*` entries that
# integration-test-diffusion-cpp.yml restores. That workflow is only reachable
# from a pull_request_target caller, where cache-models takes its restore-only
# branch, so nothing writes them.
#
# One job per group rather than one job with three steps: the groups are
# independent cache entries of very different sizes (base ~46 GB, ltx ~21 GB,
# ideogram ~16 GB), so serialising them would put a ~40h ceiling on a single
# leg and let one failure strand the other two.

on:
  push:
    branches:
      - main
    paths:
      - "packages/diffusion-cpp/test/integration/models.manifest.json"
      # cache-models resolves the cached path list through warm-models.mjs, and
      # that list is folded into the cache version -- an edit there can make the
      # entry unrestorable without the manifest changing at all. A run that
      # finds nothing moved costs seconds: the probe answers from a lookup.
      - ".github/actions/cache-models/**"
      # And this file. A commit that fixes the seed itself -- a corrected
      # cache-key-suffix, say -- would otherwise sit dormant until the cron.
      - ".github/workflows/on-merge-model-cache-diffusion.yml"
  # Every two days. The cache server prunes at CACHE_CLEANUP_OLDER_THAN_DAYS=5,
  # and Mon/Thu left a 4-day gap -- inside the window, but with no slack: ONE
  # failed run stretched it to 7 days and the entry was gone. `*/2` caps the gap
  # at 2 days, and at 4 after a missed run, so a single failure is survivable.
  # The hour is offset per addon so the seeds do not contend for a runner.
  schedule:
    - cron: "17 8 */2 * *"
  # No workflow_call. Nothing calls this, and a `pull_request` caller would put
  # the job on cache-models' trusted-save branch, letting PR-head code write an
  # entry every addon lane afterwards restores. Dispatch covers on-demand runs.
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Restore the archive even on a hit, exactly as the cron does. That download is what resets the cache server's prune clock; the probe alone does not."
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  seed:
    needs: runner_names
    runs-on: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64 }}
    # base is ~46 GB and these runners have been seen pulling at low single-digit
    # MB/s. Deliberately generous; a warm run exits in minutes.
    timeout-minutes: 480
    name: seed-model-cache-${{ matrix.group }}
    strategy:
      # Independent cache entries -- one group failing must not skip the others.
      fail-fast: false
      matrix:
        group: [base, ideogram, ltx]

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      # Must match integration-test-diffusion-cpp.yml's three "Cache ... integration
      # test models" steps exactly. Named, not line-numbered: line numbers rot. All three
      # call sites there pass cache-key-suffix equal to the group name and
      # cache-version v2, so one matrix entry covers each.
      - name: Seed integration test models (${{ matrix.group }})
        uses: ./.github/actions/cache-models
        with:
          package: diffusion-cpp
          group: ${{ matrix.group }}
          cache-key-suffix: ${{ matrix.group }}
          cache-version: v2
          seed-probe: 'true'
          force-refresh: ${{ inputs.force_refresh || false }}

  # actions/cache only WARNS when the cache server rejects a reservation, so the
  # seed job above reports success whether or not an entry was written. This
  # turns that into a red run. It has to be a separate job: the save runs in the
  # seed job's post-steps, after every step there has finished.
  verify:
    needs: [runner_names, seed]
    # Not the default `success()`. The seed matrices are fail-fast: false, so one
    # leg failing for an unrelated reason would skip this job outright -- and the
    # silent write failure it exists to catch would go unreported on every other
    # leg. Each leg asserts its own entry, so a genuinely failed seed leg just
    # fails here too. runner_names is still required: without its outputs there
    # is no runs-on.
    if: ${{ !cancelled() && needs.runner_names.result == 'success' }}
    # No id-token: nothing here talks to AWS; the lookup needs the
    # repository and nothing else.
    permissions:
      contents: read
    runs-on: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64 }}
    timeout-minutes: 15
    name: verify-model-cache-${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [base, ideogram, ltx]

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      # Inputs must stay identical to the seed step's: `path` feeds the cache
      # version, so a different one silently probes a different entry.
      - name: Assert the seeded entry exists
        uses: ./.github/actions/cache-models
        with:
          package: diffusion-cpp
          group: ${{ matrix.group }}
          cache-key-suffix: ${{ matrix.group }}
          cache-version: v2
          assert-exists: 'true'
