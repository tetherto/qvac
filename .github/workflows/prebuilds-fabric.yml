# Build-only workflow. Publishing is handled by on-merge-nx.yml.
name: "Prebuilds (Fabric)"

on:
  workflow_dispatch:
    inputs:
      workdir:
        description: "Working directory (optional)"
        required: false
        type: string
        default: "packages/fabric"
      cuda-platforms-only:
        description: >-
          Build only the platforms that compile a CUDA backend (linux-x64,
          linux-arm64 including the Jetson module, and win32-x64).
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      ref:
        description: "ref"
        type: string
        required: false
      repository:
        type: string
        required: false
        # monorepo default
        default: "tetherto/qvac"
      workdir:
        description: "Working directory (optional)"
        required: false
        type: string
        default: "packages/fabric"
      cuda-platforms-only:
        description: >-
          Build only the platforms that compile a CUDA backend (linux-x64,
          linux-arm64 including the Jetson module, and win32-x64).
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  prebuild:
    permissions:
      contents: write
      packages: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/reusable-prebuilds.yml
    with:
      workdir: ${{ inputs.workdir }}
      ref: ${{ inputs.ref }}
      repository: ${{ inputs.repository }}
      include-vulkan-sdk: true
      linux-extra-packages: libibverbs-dev
      # Land ROCm on the base-branch workflow before a follow-up PR requests
      # qvac-fabric[hip-backend]. pull_request_target loads this YAML from
      # main, so linux-x64 would otherwise hard-fail the hip port. setup-rocm
      # prefers /opt/rocm when the host stamp matches; otherwise downloads.
      include-rocm: true
      # QVAC-23763: build CUDA beside Vulkan and HIP. The arm64 job first builds
      # the CUDA 13 server module, then adds the CUDA 12 Jetson module.
      include-cuda: true
      include-cuda-win32: true
      include-cuda-arm64: true
      include-cuda-arm64-jetson: true
      verify-linux-x64-cuda-module: true
      matrix-include: ${{ inputs.cuda-platforms-only == true && '[{"os":"ubuntu-22.04","runner_key":"linux_ubuntu2204_x64","platform":"linux","arch":"x64"},{"os":"ubuntu-22.04-arm","runner_key":"ubuntu_2204_arm","platform":"linux","arch":"arm64"},{"os":"windows-2025","runner_key":"win_2025_x64","platform":"win32","arch":"x64"}]' || 'default' }}
    secrets: inherit
