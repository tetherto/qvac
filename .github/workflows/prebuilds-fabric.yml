# Build-only workflow. Publishing is handled by on-merge-fabric.yml
name: "Prebuilds (Fabric)"

on:
  workflow_dispatch:
    inputs:
      workdir:
        description: "Working directory (optional)"
        required: false
        type: string
        default: "packages/fabric"

  workflow_call:
    inputs:
      ref:
        description: "ref"
        type: string
        required: false
      repository:
        type: string
        required: false
        # monorepo default
        default: "tetherto/qvac"
      workdir:
        description: "Working directory (optional)"
        required: false
        type: string
        default: "packages/fabric"

permissions:
  contents: read

jobs:
  prebuild:
    permissions:
      contents: write
      packages: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/reusable-prebuilds.yml
    with:
      workdir: ${{ inputs.workdir }}
      ref: ${{ inputs.ref }}
      repository: ${{ inputs.repository }}
      artifact-name-prefix: fabric-
      include-vulkan-sdk: true
      # Land ROCm on the base-branch workflow before a follow-up PR requests
      # qvac-fabric[hip-backend]. pull_request_target loads this YAML from
      # main, so linux-x64 would otherwise hard-fail the hip port. setup-rocm
      # prefers /opt/rocm when the host stamp matches; otherwise downloads.
      include-rocm: true
    secrets: inherit
