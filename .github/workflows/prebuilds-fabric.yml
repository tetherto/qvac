# Build-only workflow. Publishing is handled by on-merge-fabric.yml
name: "Prebuilds (Fabric)"

on:
  workflow_dispatch:
    inputs:
      workdir:
        description: "Working directory (optional)"
        required: false
        type: string
        default: "packages/fabric"

  workflow_call:
    inputs:
      ref:
        description: "ref"
        type: string
        required: false
      repository:
        type: string
        required: false
        # monorepo default
        default: "tetherto/qvac"
      workdir:
        description: "Working directory (optional)"
        required: false
        type: string
        default: "packages/fabric"

permissions:
  contents: read

jobs:
  prebuild:
    permissions:
      contents: write
      packages: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/reusable-prebuilds.yml
    with:
      workdir: ${{ inputs.workdir }}
      ref: ${{ inputs.ref }}
      repository: ${{ inputs.repository }}
      artifact-name-prefix: fabric-
      include-vulkan-sdk: true
      # Cross-compile the ROCm/HIP backend (gfx1151) into the linux-x64 prebuild
      # so every @qvac/fabric consumer gets libqvac-ggml-hip.so from the shared
      # runtime. No AMD GPU needed on the runner; fail-safe if the ROCm install
      # or the port feature is absent.
      include-rocm: true
    secrets: inherit
