name: On Merge vcpkg Cache (LLM)

# cpp-tests-llm.yml only writes its vcpkg cache on a trusted event, and its
# only other caller is pull_request_target -- so without this, nothing populates
# the cache but a manual dispatch. Paths mirror the cache key's inputs; the
# cron recovers from eviction.

on:
  push:
    branches:
      - main
    paths:
      - "packages/llm-llamacpp/vcpkg.json"
      - "packages/llm-llamacpp/vcpkg-configuration.json"
      - "vcpkg-overlays/triplets/**"
      - "vcpkg-overlays/toolchains/**"
      # This job also writes the unit-test model cache, whose key hashes this
      # script. Without it that entry never refreshes when the model set changes.
      - "packages/llm-llamacpp/scripts/download-unit-test-models.js"
  # Twice weekly, not weekly. The cache server prunes entries older than
  # CACHE_CLEANUP_OLDER_THAN_DAYS=5, so a 7-day refresh leaves the entry evicted
  # for two days before every run. Keep the longest gap here under 5 days.
  schedule:
    - cron: "17 2 * * 1,4"
  workflow_dispatch:

# Never cancel: a cancelled job cannot save the build it did not finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    uses: ./.github/workflows/cpp-tests-llm.yml
    secrets: inherit
    with:
      workdir: packages/llm-llamacpp
      # Pinned: the callee defaults to github.ref, which floats to main's tip.
      ref: ${{ github.sha }}
