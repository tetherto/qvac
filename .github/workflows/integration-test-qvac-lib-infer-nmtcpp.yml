name: Integration Tests (NMTCPP)

on:
  workflow_dispatch:
    inputs:
      prebuild_package:
        description: "NPM package containing prebuilds (e.g. @qvac/translation-nmtcpp@1.0.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: "ref"
        type: string
        required: false
      repository:
        type: string
        required: false
        default: "tetherto/qvac"
      workdir:
        description: "Working directory inside the repo (monorepo package path)"
        type: string
        required: false
        default: "packages/qvac-lib-infer-nmtcpp"

env:
  PKG_DIR: packages/qvac-lib-infer-nmtcpp

jobs:
  run-integration-tests:
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}-${{ matrix.arch }}-integration-tests
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Run Linux x64 tests on both Ubuntu 22.04 and 24.04 to ensure compatibility
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: windows-2022
            platform: win32
            arch: x64

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Windows - enable git long paths
        if: ${{ matrix.platform == 'win32' }}
        shell: bash
        run: git config --system core.longpaths true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          repository: ${{ inputs.repository || github.repository }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure scoped registry for @tetherto and @qvac packages
        working-directory: ${{ inputs.workdir || env.PKG_DIR }}
        env:
          GPR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_PAT: ${{ secrets.PAT_TOKEN }}
        shell: bash
        run: |
          echo "Configuring scoped registry for @tetherto and @qvac packages..."
          set -eu
          echo "Writing .npmrc for dual registry install…"
          cat > .npmrc <<NPMRC
          registry=https://registry.npmjs.org/
          @qvac:registry=https://registry.npmjs.org/
          @tetherto:registry=https://npm.pkg.github.com/
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          //npm.pkg.github.com/:_authToken=${GPR_TOKEN}
          NPMRC

          # Optional: make private git deps work without prompting
          if [ -n "${GIT_PAT:-}" ]; then
            git config --global url."https://${GIT_PAT}:@github.com/".insteadOf "https://github.com/"
            git config --global url."https://${GIT_PAT}:@github.com/".insteadOf "git@github.com:"
          else
            # Using the workflow's GITHUB_TOKEN for git clones when possible
            git config --global url."https://${{ github.token }}:@github.com/".insteadOf "https://github.com/"
            git config --global url."https://${{ github.token }}:@github.com/".insteadOf "git@github.com:"
            git config --global url."https://${{ github.token }}:@github.com/".insteadOf "ssh://git@github.com/"
          fi

      - name: Install NPM dependencies
        working-directory: ${{ inputs.workdir || env.PKG_DIR }}
        run: |
          npm install
          npm install -g bare bare-make

      - name: Download prebuilds from artifact
        if: ${{ !inputs.prebuild_package }}
        uses: actions/download-artifact@v4
        with:
          path: ${{ inputs.workdir || env.PKG_DIR }}/prebuilds
          merge-multiple: true

      - name: Download prebuilds from package
        if: ${{ inputs.prebuild_package }}
        working-directory: ${{ inputs.workdir || env.PKG_DIR }}
        shell: bash
        run: |
          mkdir -p prebuilds
          npm pack ${{ inputs.prebuild_package }} --pack-destination /tmp
          tar -xzf /tmp/*.tgz -C /tmp
          cp -r /tmp/package/prebuilds/* prebuilds/

      - name: Print run state
        working-directory: ${{ inputs.workdir || env.PKG_DIR }}
        shell: bash
        run: |
          echo "node version: $(node -v)"
          echo "npm version: $(npm -v)"
          echo "bare version: $(bare -v)"
          echo "bare-make version: $(bare-make --version)"
          npm list
          npm config list
        continue-on-error: true

      - name: Print run state (model and prebuilds)
        working-directory: ${{ inputs.workdir || env.PKG_DIR }}
        shell: bash
        run: |
          echo "node version: $(node -v)"
          echo "npm version: $(npm -v)"
          echo "bare version: $(bare -v)"
          echo "bare-make version: $(bare-make --version)"
          ls -la model/marian/vulkan/en-it/ || true
          tree model/marian/vulkan/en-it/ || true
          ls -la prebuilds || true
          tree prebuilds || true
        continue-on-error: true

      - name: Linux - install dependencies
        if: matrix.platform == 'linux' || matrix.platform == 'android'
        shell: bash
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers gcc-13 g++-13 libstdc++-13-dev

      - name: Install git-lfs (needed for Firefox model fallback)
        shell: bash
        run: |
          if command -v apt-get &>/dev/null; then
            sudo apt-get install -y git-lfs 2>/dev/null || true
          fi
          git lfs install 2>/dev/null || true

      - name: Download models via Hyperdrive
        working-directory: ${{ inputs.workdir || env.PKG_DIR }}
        shell: bash
        run: |
          echo "Downloading integration test models via Hyperdrive..."
          if timeout 300 bare scripts/download-models-hyperdrive.js --target integration 2>&1; then
            echo "✅ Models downloaded via Hyperdrive"
          else
            echo "⚠️  Hyperdrive download failed (exit $?), trying Bergamot via Firefox GitHub..."

            # Shell-level Firefox fallback for Bergamot en-it
            OUTPUT_DIR="model/bergamot/enit"
            mkdir -p "$OUTPUT_DIR"
            TMP_DIR="/tmp/firefox-translations-enit-$$"
            rm -rf "$TMP_DIR"

            git clone --depth 1 --filter=blob:none --sparse \
              https://github.com/mozilla/firefox-translations-models.git "$TMP_DIR"
            git -C "$TMP_DIR" sparse-checkout set "models/base-memory/enit"
            git -C "$TMP_DIR" lfs pull --include="models/base-memory/enit/*"

            for gz_file in "$TMP_DIR"/models/base-memory/enit/*.gz; do
              [ -f "$gz_file" ] || continue
              base_name=$(basename "$gz_file" .gz)
              gunzip -c "$gz_file" > "$OUTPUT_DIR/$base_name"
              echo "   ✅ $base_name"
            done
            rm -rf "$TMP_DIR"

            echo "⚠️  IndicTrans model may be missing (Hyperdrive was required)"
          fi

          echo "Bergamot model files:"
          ls -la model/bergamot/enit/ 2>/dev/null || echo "   (missing)"
          echo "IndicTrans model files:"
          ls -la model/indictrans/ 2>/dev/null || echo "   (missing)"

      - name: Run integration test
        working-directory: ${{ inputs.workdir || env.PKG_DIR }}
        run: npm run test:integration ${{ matrix.platform }}-${{ matrix.arch }}
        env:
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}

      - name: Run quickstart example with deps installed
        working-directory: ${{ inputs.workdir || env.PKG_DIR }}
        shell: bash
        run: |
          npm install "@qvac/translation-nmtcpp"
          npx bare examples/quickstart.js
        continue-on-error: true # unreliable to block the PR, we want to see how it performs
