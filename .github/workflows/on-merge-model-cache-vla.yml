name: On Merge Model Cache (VLA)

# Seeds both vla-ggml entries: the integration set restored by
# integration-test-vla.yml, and the `cpp-groot` parity set restored by
# cpp-tests-vla.yml. Both workflows are only reachable from a
# pull_request_target caller, where cache-models takes its restore-only branch,
# so nothing writes them.
#
# Neither lane runs on darwin/x64 -- the macOS Intel runners cannot host these
# models -- so the seed does not cover that platform either.

on:
  push:
    branches:
      - main
    # What the two entries' cache keys hash: project.json for the integration
    # set, the composite for the GR00T parity set.
    paths:
      - "packages/vla-ggml/project.json"
      # And the code that lays the models out. project.json says WHAT to fetch;
      # these decide where it lands. A fix to the destdir handling that is not
      # in any key and not in any filter would never re-seed: the old layout
      # keeps being restored, and every nmtcpp entry is skipOnCacheHit so the
      # lane downloads nothing and stays green on it.
      - ".github/actions/stage-integration-models/**"
      - ".github/actions/project-model-s3/**"
      - ".github/actions/download-vla-groot-parity/action.yml"
      # `paths` is pinned at the call site, but cache-models still builds the key
      # string and resolves the hash glob, so an edit there can still move this
      # entry. A run that finds nothing moved costs seconds: the probe answers
      # from a lookup.
      - ".github/actions/cache-models/**"
      # And this file. A commit that fixes the seed itself -- a corrected
      # cache-key-suffix, say -- would otherwise sit dormant until the cron.
      - ".github/workflows/on-merge-model-cache-vla.yml"
  # Every two days. The cache server prunes at CACHE_CLEANUP_OLDER_THAN_DAYS=5,
  # and Mon/Thu left a 4-day gap -- inside the window, but with no slack: ONE
  # failed run stretched it to 7 days and the entry was gone. `*/2` caps the gap
  # at 2 days, and at 4 after a missed run, so a single failure is survivable.
  # The hour is offset per addon so the seeds do not contend for a runner.
  schedule:
    - cron: "17 18 */2 * *"
  # No workflow_call. This job assumes the AWS OIDC role and runs repo-local
  # composites from `github.sha`, which under a `pull_request` caller resolves
  # to the merge commit -- PR-head code next to live credentials. Dispatch
  # already covers on-demand runs.
  workflow_dispatch:
    inputs:
      force_refresh:
        description: "Restore the archive even on a hit, exactly as the cron does. That download is what resets the cache server's prune clock; the probe alone does not."
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  seed-integration:
    needs: runner_names
    runs-on: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64 }}
    # AWS_OIDC_ROLE_ARN's trust policy is scoped to this environment.
    environment: release
    timeout-minutes: 180
    name: seed-model-cache-integration
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}

      # cache-models shells out to `node` in its path-resolution step even when
      # there is no manifest to warm.
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # 6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-1

      # Must match integration-test-vla.yml's call.
      - name: Cache VLA models
        id: model-cache
        uses: ./.github/actions/cache-models
        with:
          package: vla-ggml
          paths: packages/vla-ggml/model/vla
          hash-files-glob: packages/vla-ggml/project.json
          seed-probe: 'true'
          force-refresh: ${{ inputs.force_refresh || false }}

      # Gated as a whole, unlike the integration lane. There the pi05 and GR00T
      # pulls run unconditionally because the tests also need the oracle dirs
      # under test/, which the cache does not cover. Here those dirs are thrown
      # away at job end and actions/cache skips the save on an exact hit, so an
      # ungated pull would drag ~8 GB from S3 for nothing on every warm cron.
      - name: Resolve the S3 model set
        id: model-s3
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/project-model-s3
        with:
          package: vla-ggml

      # Whole step still gated, not just smolvla: on a hit the oracle dirs this
      # would also pull are thrown away at job end, so an ungated run would drag
      # ~8 GB from S3 for nothing on every warm cron. cache-hit is left empty so
      # that on a miss every entry downloads, skipOnCacheHit or not.
      - name: Download VLA models from S3
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/stage-integration-models
        with:
          workdir: packages/vla-ggml
          s3-manifest: ${{ steps.model-s3.outputs.manifest }}
          aws-role: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          bucket: ${{ secrets.MODEL_S3_BUCKET }}

  seed-cpp-groot:
    needs: runner_names
    runs-on: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64 }}
    environment: release
    timeout-minutes: 180
    name: seed-model-cache-cpp-groot
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}

      # cache-models shells out to `node` in its path-resolution step even when
      # there is no manifest to warm.
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # 6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-1

      # Must match cpp-tests-vla.yml's call.
      - name: Cache GR00T parity artefacts
        id: groot-cache
        uses: ./.github/actions/cache-models
        with:
          package: vla-ggml
          cache-key-suffix: cpp-groot
          paths: |
            packages/vla-ggml/model/vla/groot
            packages/vla-ggml/test/groot-oracle
          hash-files-glob: .github/actions/download-vla-groot-parity/action.yml
          seed-probe: 'true'
          force-refresh: ${{ inputs.force_refresh || false }}

      - name: Download GR00T parity artefacts from S3
        if: steps.groot-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/download-vla-groot-parity
        with:
          model-s3-bucket: ${{ secrets.MODEL_S3_BUCKET }}
          workdir: packages/vla-ggml

  # actions/cache only WARNS when the cache server rejects a reservation, so the
  # seed job above reports success whether or not an entry was written. This
  # turns that into a red run. It has to be a separate job: the save runs in the
  # seed job's post-steps, after every step there has finished.
  verify-integration:
    needs: [runner_names, seed-integration]
    # Not the default `success()`. The seed matrices are fail-fast: false, so one
    # leg failing for an unrelated reason would skip this job outright -- and the
    # silent write failure it exists to catch would go unreported on every other
    # leg. Each leg asserts its own entry, so a genuinely failed seed leg just
    # fails here too. runner_names is still required: without its outputs there
    # is no runs-on.
    if: ${{ !cancelled() && needs.runner_names.result == 'success' }}
    # No id-token: nothing here talks to AWS; the lookup needs the
    # repository and nothing else.
    permissions:
      contents: read
    runs-on: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64 }}
    timeout-minutes: 15
    name: verify-model-cache-integration

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      # Inputs must stay identical to the seed step's: `path` feeds the cache
      # version, so a different one silently probes a different entry.
      - name: Assert the seeded entry exists
        uses: ./.github/actions/cache-models
        with:
          package: vla-ggml
          paths: packages/vla-ggml/model/vla
          hash-files-glob: packages/vla-ggml/project.json
          assert-exists: 'true'

  # actions/cache only WARNS when the cache server rejects a reservation, so the
  # seed job above reports success whether or not an entry was written. This
  # turns that into a red run. It has to be a separate job: the save runs in the
  # seed job's post-steps, after every step there has finished.
  verify-cpp-groot:
    needs: [runner_names, seed-cpp-groot]
    # Not the default `success()`. The seed matrices are fail-fast: false, so one
    # leg failing for an unrelated reason would skip this job outright -- and the
    # silent write failure it exists to catch would go unreported on every other
    # leg. Each leg asserts its own entry, so a genuinely failed seed leg just
    # fails here too. runner_names is still required: without its outputs there
    # is no runs-on.
    if: ${{ !cancelled() && needs.runner_names.result == 'success' }}
    # No id-token: nothing here talks to AWS; the lookup needs the
    # repository and nothing else.
    permissions:
      contents: read
    runs-on: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64 }}
    timeout-minutes: 15
    name: verify-model-cache-cpp-groot

    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      # Inputs must stay identical to the seed step's: `path` feeds the cache
      # version, so a different one silently probes a different entry.
      - name: Assert the seeded entry exists
        uses: ./.github/actions/cache-models
        with:
          package: vla-ggml
          cache-key-suffix: cpp-groot
          paths: |
            packages/vla-ggml/model/vla/groot
            packages/vla-ggml/test/groot-oracle
          hash-files-glob: .github/actions/download-vla-groot-parity/action.yml
          assert-exists: 'true'
