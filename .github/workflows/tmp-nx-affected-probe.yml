name: TMP nx affected probe (QVAC-25682)

# THROWAWAY. Deleted before this PR is ready for review.
#
# v6b proved the empty-list form delivers the ask on one addon's dependency bump:
# default 39, auto 19, empty list 1 (@qvac/ocr-ggml only).
#
# v7 proves it breaks nothing. Two ways narrowing could hide a real change:
#
#   SHARED   a dependency change on a package others link to must still reach
#            every dependent. @qvac/fabric is linked by seven addons.
#   LOCKONLY a change to pnpm-lock.yaml alone, with no package.json edited, has
#            no owning project, so the empty list marks nothing. Measure it on a
#            real lockfile-only commit from main so the gap is sized, not guessed.

# push-scoped to this branch: a brand-new workflow file cannot be dispatched,
# since workflow_dispatch resolves against the default branch.
on:
  push:
    branches:
      - infra/QVAC-25682-nx-lockfile-affected

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configs
        shell: bash
        run: |
          set -euo pipefail
          git config user.email probe@local
          git config user.name probe
          jq 'del(.pluginsConfig)' nx.json > /tmp/nx.default.json
          jq '.pluginsConfig["@nx/js"].projectsAffectedByDependencyUpdates = []' nx.json > /tmp/nx.none.json
          echo "ORIG=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: SHARED - a dependency added to @qvac/fabric
        shell: bash
        run: |
          set -uo pipefail
          json_line() { grep -E '^\[' | tail -n1; }
          affected() {
            cp "$1" nx.json; rm -rf .nx
            o=$(pnpm exec nx show projects --affected --base="$2" --head="$3" --json 2>/dev/null | json_line)
            [ -n "$o" ] && echo "$o" || echo "[]"
          }
          B=$(git rev-parse HEAD)
          pnpm add -D --filter @qvac/fabric tiny-invariant@1.3.3 --ignore-scripts >/dev/null
          git add -A && git commit -q -m "probe: dep on fabric"
          H=$(git rev-parse HEAD)

          D=$(affected /tmp/nx.default.json "$B" "$H")
          N=$(affected /tmp/nx.none.json "$B" "$H")
          echo "SHARED default    : $(echo "$D" | jq 'length')"
          echo "SHARED empty list : $(echo "$N" | jq 'length')"
          echo "$N" | jq -r '.[]' | sed 's/^/  SHARED-KEEP /'

          MISSING=""
          for p in classification-ggml embed-llamacpp llm-llamacpp model-fit ocr-ggml translation-nmtcpp vla-ggml; do
            echo "$N" | jq -e --arg p "@qvac/$p" 'index($p)' >/dev/null || MISSING="$MISSING $p"
          done
          if [ -z "$MISSING" ]; then
            echo "SHARED VERDICT: all seven fabric dependents still marked. Nothing hidden."
          else
            echo "SHARED VERDICT: MISSING dependents:$MISSING"
          fi
          git reset -q --hard "$ORIG"


  # Separate job, fresh install. The SHARED step's pnpm add mutates node_modules,
  # and git reset does not restore node_modules, which blanked both numbers here
  # when they shared a job.
  lockonly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: LOCKONLY - a real lockfile-only commit from main
        shell: bash
        run: |
          set -uo pipefail
          jq 'del(.pluginsConfig)' nx.json > /tmp/nx.default.json
          jq '.pluginsConfig["@nx/js"].projectsAffectedByDependencyUpdates = []' nx.json > /tmp/nx.none.json
          C=d2e24d152
          P=$(git rev-parse "$C^")
          echo "LOCKONLY files in $C: $(git show --name-only --format= $C | tr '\n' ' ')"
          for v in default none; do
            cp "/tmp/nx.$v.json" nx.json; rm -rf .nx
            pnpm exec nx show projects --affected --base="$P" --head="$C" --json \
              > "/tmp/out.$v" 2> "/tmp/err.$v" || true
            L=$(grep -E '^\[' "/tmp/out.$v" | tail -n1)
            n=$(echo "${L:-[]}" | jq 'length' 2>/dev/null || echo "unparsed")
            echo "LOCKONLY $v : $n"
            echo "  LOCKONLY-RAW $v stdout: $(tr '\n' ' ' < /tmp/out.$v | cut -c1-160)"
            echo "  LOCKONLY-RAW $v stderr: $(tr '\n' ' ' < /tmp/err.$v | cut -c1-160)"
          done
