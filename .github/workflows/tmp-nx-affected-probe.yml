name: TMP nx affected probe (QVAC-25682)

# THROWAWAY. Deleted before this PR is ready for review.
#
# v4 established that auto IS read (39 -> 19 on a one-package delta) but that
# the 19 still contains every addon, including ones with no dependency on the
# package that changed. So auto is attributing the lockfile change to them and
# the question is what it is reacting to.
#
# v5 answers that. It makes the smallest realistic change a developer makes —
# widen one range in one addon's package.json and refresh the lockfile — then
# attributes every changed hunk of pnpm-lock.yaml to the importer block it sits
# in, before running the A/B. If one importer changed but every addon is still
# marked, auto cannot deliver what was asked for and the fix has to be elsewhere.

# push-scoped to this branch: a brand-new workflow file cannot be dispatched,
# since workflow_dispatch resolves against the default branch.
on:
  push:
    branches:
      - infra/QVAC-25682-nx-lockfile-affected

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Smallest realistic change - widen one range in one addon
        shell: bash
        run: |
          set -euo pipefail
          git config user.email probe@local
          git config user.name probe
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          node -e "
            const fs=require('fs'); const p='packages/ocr-ggml/package.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            j.dependencies['bare-path']='^3.1.0';
            fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
          "
          pnpm install --lockfile-only --ignore-scripts
          # --lockfile-only leaves node_modules on the old graph, and nx then
          # prints an out-of-date warning as its last line. Re-sync to match.
          pnpm install --ignore-scripts

      - name: Which importers did the lockfile change touch?
        shell: bash
        run: |
          set -euo pipefail
          git diff --stat -- pnpm-lock.yaml
          python3 - <<'PY'
          import re, subprocess
          new = subprocess.run(['git','show',':pnpm-lock.yaml'],capture_output=True,text=True).stdout
          if not new:
              new = open('pnpm-lock.yaml').read()
          lines = new.split('\n')
          # importer blocks are two-space keys under `importers:`
          starts = [(i, l.rstrip(':').strip()) for i, l in enumerate(lines)
                    if re.match(r'^  \S.*:$', l)]
          diff = subprocess.run(['git','diff','-U0','--','pnpm-lock.yaml'],
                                capture_output=True,text=True).stdout
          touched = set()
          for h in re.finditer(r'^@@ -\d+(?:,\d+)? \+(\d+)', diff, re.M):
              ln = int(h.group(1)) - 1
              owner = None
              for i, name in starts:
                  if i <= ln: owner = name
                  else: break
              if owner: touched.add(owner)
          print(f"importer blocks touched: {len(touched)}")
          for t in sorted(touched): print("  ", t)
          PY
          git add -A
          git commit -q -m "probe: widen one range in one addon"
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: A/B across three configs
        shell: bash
        run: |
          set -uo pipefail
          jq 'del(.pluginsConfig)' nx.json > /tmp/nx.default.json
          cp nx.json /tmp/nx.auto.json
          jq '.pluginsConfig["@nx/js"].projectsAffectedByDependencyUpdates = []' nx.json > /tmp/nx.none.json

          # nx can print warnings after its JSON; take the array line itself.
          json_line() { grep -E '^\[' | tail -n1; }

          run_affected() {
            cp "$1" nx.json; rm -rf .nx
            out=$(pnpm exec nx show projects --affected \
              --base="$BASE_SHA" --head="$HEAD_SHA" --json 2>"/tmp/err.$2" | json_line)
            [ -n "$out" ] && echo "$out" || echo "[]"
          }

          cp /tmp/nx.auto.json nx.json
          TOTAL=$(pnpm exec nx show projects --json 2>/dev/null | json_line | jq 'length')
          D=$(run_affected /tmp/nx.default.json default)
          A=$(run_affected /tmp/nx.auto.json auto)
          N=$(run_affected /tmp/nx.none.json none)
          cp /tmp/nx.auto.json nx.json

          echo "RESULT total                 : $TOTAL"
          echo "RESULT default (all)         : $(echo "$D" | jq 'length')"
          echo "RESULT auto                  : $(echo "$A" | jq 'length')"
          echo "RESULT empty list            : $(echo "$N" | jq 'length')"
          echo "RESULT projects under empty list:"
          echo "$N" | jq -r '.[]' | sed 's/^/  KEEP /'
          echo "--- nx stderr for the empty-list run (does it accept []?):"
          sed 's/^/  STDERR /' /tmp/err.none | head -10
