name: TMP nx affected probe (QVAC-25682)

# THROWAWAY. Deleted before this PR is ready for review.
#
# Does pluginsConfig["@nx/js"].projectsAffectedByDependencyUpdates narrow the
# affected set here? @nx/js is not a dependency of this workspace, so the key
# may be read by nx core or ignored, and nx.json cannot tell you which.
#
# v1 fed pnpm-lock.yaml through --stdin on a branch whose lockfile matched base,
# so there was no delta to analyse. Proved nothing.
# v2/v3 used a real lockfile commit (d2e24d152) but that commit deletes 865
# resolved entries, so "everything is affected" may be the CORRECT answer there
# and the test could not separate that from the config being inert.
# v4 builds the delta on purpose: add one dependency to ONE package, so exactly
# one project's resolved dependencies change. If auto is live, the affected set
# must be small. If it returns all 39, the config is doing nothing.

# push-scoped to this branch: a brand-new workflow file cannot be dispatched,
# since workflow_dispatch resolves against the default branch.
on:
  push:
    branches:
      - infra/QVAC-25682-nx-lockfile-affected

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build a one-package lockfile delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.email probe@local
          git config user.name probe
          BASE=$(git rev-parse HEAD)
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"

          pnpm add -D --filter @qvac/ocr-ggml tiny-invariant@1.3.3 --ignore-scripts

          echo "--- files changed:"
          git status --porcelain
          echo "--- lockfile importer sections touched:"
          git diff -- pnpm-lock.yaml | grep -oE "^[-+] *packages/[a-z0-9-]+" | sort -u || true

          git add -A
          git commit -q -m "probe: one dependency on one package"
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: A/B the affected set
        shell: bash
        run: |
          set -uo pipefail
          git show "$BASE_SHA:nx.json" > /tmp/nx.base.json
          cp nx.json /tmp/nx.with.json
          jq 'del(.pluginsConfig)' nx.json > /tmp/nx.without.json

          run_affected() {
            cp "$1" nx.json
            rm -rf .nx
            pnpm exec nx show projects --affected \
              --base="$BASE_SHA" --head="$HEAD_SHA" --json 2>/dev/null | tail -n1
          }

          TOTAL=$(pnpm exec nx show projects --json | tail -n1 | jq 'length')
          W=$(run_affected /tmp/nx.with.json)
          O=$(run_affected /tmp/nx.without.json)
          cp /tmp/nx.with.json nx.json

          WC=$(echo "$W" | jq 'length'); OC=$(echo "$O" | jq 'length')
          echo "total projects        : $TOTAL"
          echo "affected WITH auto    : $WC"
          echo "affected WITHOUT      : $OC"
          echo "--- WITH auto, the projects:"
          echo "$W" | jq -r '.[]' | head -40

          if [ "$WC" -lt "$OC" ]; then
            echo "::notice::auto narrows a single-package change: $OC -> $WC"
          else
            echo "::warning::auto did not narrow a single-package change ($WC of $TOTAL). The config is inert here."
          fi
