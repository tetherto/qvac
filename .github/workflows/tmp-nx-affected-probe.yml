name: TMP nx affected probe (QVAC-25682)

# THROWAWAY. Deleted before this PR is ready for review.
#
# End-to-end check of the shipped fix, not of nx in isolation: each case runs the
# real .github/actions/nx-project-matrix/lockfile-mode.sh and applies the same jq
# override the action does, then asks nx what is affected. One clean job per case,
# because pnpm add mutates node_modules and git reset does not undo that.

# push-scoped to this branch: a brand-new workflow file cannot be dispatched,
# since workflow_dispatch resolves against the default branch.
on:
  push:
    branches:
      - infra/QVAC-25682-nx-lockfile-affected

permissions:
  contents: read

jobs:
  case:
    strategy:
      fail-fast: false
      matrix:
        case: [addon, shared, lockonly]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the case
        shell: bash
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          git config user.email probe@local
          git config user.name probe
          case "$CASE" in
            addon)
              B=$(git rev-parse HEAD)
              pnpm add -D --filter @qvac/ocr-ggml tiny-invariant@1.3.3 --ignore-scripts >/dev/null
              git add -A && git commit -q -m "probe: dep on ocr-ggml"
              H=$(git rev-parse HEAD) ;;
            shared)
              B=$(git rev-parse HEAD)
              pnpm add -D --filter @qvac/fabric tiny-invariant@1.3.3 --ignore-scripts >/dev/null
              git add -A && git commit -q -m "probe: dep on fabric"
              H=$(git rev-parse HEAD) ;;
            lockonly)
              H=d2e24d152
              B=$(git rev-parse "$H^") ;;
          esac
          echo "B=$B" >> "$GITHUB_ENV"; echo "H=$H" >> "$GITHUB_ENV"
          echo "changed: $(git diff --name-only "$B" "$H" | tr '\n' ' ' | cut -c1-200)"

      - name: Apply the shipped decision, then ask nx
        shell: bash
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -uo pipefail
          rm -rf .nx
          PATHS=$(git diff --name-only "$B...$H")
          MODE=$(printf '%s\n' "$PATHS" | .github/actions/nx-project-matrix/lockfile-mode.sh)
          if [ "$MODE" = "auto" ]; then
            jq '.pluginsConfig["@nx/js"].projectsAffectedByDependencyUpdates = "auto"' nx.json > /tmp/nx.json
            cp /tmp/nx.json nx.json
          fi
          echo "E2E $CASE lockfile-mode: ${MODE:-(none, empty list stands)}"
          echo "E2E $CASE nx.json setting: $(jq -c '.pluginsConfig["@nx/js"].projectsAffectedByDependencyUpdates' nx.json)"
          OUT=$(pnpm exec nx show projects --affected --base="$B" --head="$H" --json 2>/dev/null | grep -E '^\[' | tail -n1)
          echo "E2E $CASE affected: $(echo "${OUT:-[]}" | jq 'length')"
          echo "${OUT:-[]}" | jq -r '.[]' | sed "s/^/  E2E-$CASE /"
