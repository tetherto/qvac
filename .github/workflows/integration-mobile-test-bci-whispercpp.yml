name: Mobile Integration Tests (BCI WhisperCPP)

# Migrated to .github/actions/run-mobile-integration-tests in
# QVAC-18168 follow-up: rollout to remaining 9 mobile addons.
#
# BCI shares the WhisperCPP Device Farm project + iOS pool.

on:
  workflow_call:
    inputs:
      prebuild_package:
        description: "Full NPM package spec (name@version) whose prebuilds to pin instead of the freshly-built artifact (e.g. @qvac/bci-whispercpp@1.0.0). Empty = artifact-first (unchanged)."
        type: string
        required: false
        default: ""
      ref:
        description: "Git ref to checkout"
        type: string
        required: false
      repository:
        description: "Repository to checkout"
        type: string
        required: false
      workdir:
        description: "Relative path to package directory in monorepo"
        type: string
        required: false
        default: "packages/bci-whispercpp"
  # Manual on-demand path. A dispatched run targets ONE platform and the
  # device(s) chosen below — it never runs the full default pool. The
  # workflow_call path (benchmarks / weekend / on-merge) is unchanged.
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to run on (a manual run targets one platform)."
        type: choice
        required: true
        options: [Android, iOS]
        default: Android
      device:
        description: "Device from the common pool. Pick '(custom)' to type your own in 'devices_custom'."
        type: choice
        required: false
        options:
          - "(custom)"
          - "Samsung S25 Ultra"
          - "Pixel 9"
          - "Pixel 8"
          - "iPhone 17"
          - "iPhone 16 Pro"
          - "iPhone 15"
        default: "(custom)"
      devices_custom:
        description: "Comma-separated device model(s), e.g. 'Pixel 9, Pixel 8'. Overrides the dropdown; use for new/uncommon devices or several at once."
        type: string
        required: false
        default: ""
      device_model_operator:
        description: "Model match: CONTAINS (any model containing the value) or EQUALS (exact model only)."
        type: choice
        required: false
        options: [CONTAINS, EQUALS]
        default: CONTAINS
      tests:
        description: "Optional: run only tests whose NAME matches this regex (matched against mobile test runner names, e.g. 'runAddonTest'; combine several with '|'). Empty = full mobile suite."
        type: string
        required: false
        default: ""
      ref:
        description: "Git ref (branch/tag/SHA) to test"
        type: string
        required: false
        default: main
      package:
        description: "Full NPM package spec to test"
        type: string
        required: true
        default: '@qvac/bci-whispercpp@latest'
      workdir:
        description: "Relative path to package directory in monorepo"
        type: string
        required: false
        default: "packages/bci-whispercpp"

jobs:
  # Manual (workflow_dispatch) runs must name a device that exists on Device
  # Farm. This gate fails fast BEFORE any build or Device Farm run, so a typo
  # or an empty selection costs nothing. Skipped for workflow_call.
  validate-devices:
    name: Validate device selection
    if: inputs.platform != ''
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false
      - name: Validate requested devices
        uses: ./.github/actions/run-mobile-integration-tests/validate-devices
        with:
          platform: ${{ inputs.platform }}
          devices: ${{ inputs.devices_custom != '' && inputs.devices_custom || (inputs.device != '(custom)' && inputs.device || '') }}
          device-model-operator: ${{ inputs.device_model_operator }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

  build-and-test:
    name: Build ${{ matrix.platform }} and Run E2E Tests
    # workflow_call: validate-devices is skipped; the `skipped` branch of the
    # condition keeps this job running exactly as before.
    # workflow_dispatch: a bad/empty device selection blocks this job.
    needs: [validate-devices]
    if: ${{ !cancelled() && (needs.validate-devices.result == 'success' || needs.validate-devices.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 120
    continue-on-error: true
    permissions:
      contents: read
      packages: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      # On workflow_dispatch, run only the chosen platform (devices come from
      # the manual inputs). workflow_call runs both platforms as before.
      matrix: ${{ fromJSON(inputs.platform != '' && (inputs.platform == 'iOS' && '{"include":[{"platform":"iOS","os":"macos-14","runner":"macos-14"}]}' || '{"include":[{"platform":"Android","os":"ubuntu-22.04","runner":"qvac-ubuntu2404-x64"}]}') || '{"include":[{"platform":"Android","os":"ubuntu-22.04","runner":"qvac-ubuntu2404-x64"},{"platform":"iOS","os":"macos-14","runner":"macos-14"}]}') }}

    steps:
      - name: Validate Dispatch Inputs
        if: inputs.platform != '' && github.event.inputs.package
        run: |
          if [[ ! "${{ github.event.inputs.package }}" =~ ^@qvac/ ]]; then
            echo "::error::Invalid package scope. Only @qvac/* is allowed."
            exit 1
          fi

      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false

      - name: Checkout addon repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: addon
          fetch-depth: 0

      - name: Validate mobile tests are up-to-date
        working-directory: addon/${{ inputs.workdir || 'packages/bci-whispercpp' }}
        run: npm run test:mobile:validate || true

      - name: Setup mobile test environment
        uses: ./.github/actions/run-mobile-integration-tests/setup
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: ${{ inputs.workdir || 'packages/bci-whispercpp' }}
          addon-npm-name: '@qvac/bci-whispercpp'
          prebuild-artifact-prefix: 'bci-whispercpp-'
          pat-token: ${{ secrets.GITHUB_TOKEN }}
          package-version: ${{ inputs.prebuild_package }}
          force-npm-prebuild: ${{ inputs.prebuild_package != '' && 'true' || 'false' }}

      # `npm run test:mobile:generate` downloads models + fixtures
      # (BCI signal traces, whisper weights) into test/mobile/testAssets/
      # so the test framework can bundle them into the test app.
      - name: Generate mobile test assets
        working-directory: addon/${{ inputs.workdir || 'packages/bci-whispercpp' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run test:mobile:generate
          echo "Generated mobile testAssets:"
          ls -lah test/mobile/testAssets/

      - name: Build mobile app
        id: build
        uses: ./.github/actions/run-mobile-integration-tests/build-mobile-app
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: ${{ inputs.workdir || 'packages/bci-whispercpp' }}
          addon-npm-name: '@qvac/bci-whispercpp'
          ios-build-cert-base64: ${{ secrets.TEST_APP_APPLE_DISTRIBUTION_CERTIFICATE }}
          ios-build-cert-password: ${{ secrets.APPLE_P12_PASSWORD }}
          ios-keychain-password: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          ios-provisioning-profile-base64: ${{ secrets.TEST_APP_APPLE_PROVISIONING_PROFILE }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

      # On a manual run with a test filter, override to a single grepped spec
      # so only those tests run. Empty filter / workflow_call is unchanged.
      - name: Resolve manual test filter
        id: manual_tests
        if: inputs.platform != '' && inputs.tests != ''
        shell: bash
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          MANUAL_GROUPS=$(jq -nc --arg g "$TESTS" '[{name:"manual", grep:$g}]')
          echo "groups=$MANUAL_GROUPS" >> "$GITHUB_OUTPUT"

      - name: Upload to Device Farm
        id: upload
        uses: ./.github/actions/run-mobile-integration-tests/upload-to-devicefarm
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: ${{ inputs.workdir || 'packages/bci-whispercpp' }}
          app-path: ${{ steps.build.outputs.app-path }}
          app-type: ${{ steps.build.outputs.app-type }}
          app-name: ${{ steps.build.outputs.app-name }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          device-farm-project-arn: ${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN_WHISPERCPP }}
          test-groups: ${{ steps.manual_tests.outputs.groups }}
          enables-perf: 'true'
          mocha-timeout-ms: '2700000'
          wdio-waitfor-timeout-ms: '600000'

      - name: Schedule Device Farm test runs
        id: schedule
        uses: ./.github/actions/run-mobile-integration-tests/schedule-test-run
        with:
          platform: ${{ matrix.platform }}
          device-farm-project-arn: ${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN_WHISPERCPP }}
          ios-device-pool-arn: ${{ secrets.IOS_DEVICE_POOL_ARN_WHISPERCPP }}
          app-upload-arn: ${{ steps.upload.outputs.app-upload-arn }}
          test-package-upload-arn: ${{ steps.upload.outputs.test-package-upload-arn }}
          test-specs: ${{ steps.upload.outputs.test-specs }}
          # workflow_dispatch: fan out across the chosen device(s).
          # workflow_call: unchanged default (dual-flagship) behaviour.
          scheduling-mode: ${{ inputs.platform != '' && 'manual-devices' || 'dual-flagship' }}
          device-models: ${{ inputs.platform != '' && (inputs.devices_custom != '' && inputs.devices_custom || (inputs.device != '(custom)' && inputs.device || '')) || '' }}
          device-model-operator: ${{ inputs.platform != '' && inputs.device_model_operator || '' }}

      - name: Monitor Device Farm test runs
        id: monitor
        uses: ./.github/actions/run-mobile-integration-tests/monitor-test-run
        with:
          run-arns: ${{ steps.schedule.outputs.run-arns }}
          run-count: ${{ steps.schedule.outputs.run-count }}
          test-specs: ${{ steps.upload.outputs.test-specs }}

      - name: Cancel Device Farm runs on workflow cancellation
        if: cancelled() && steps.schedule.outputs.run-arns != '' && steps.schedule.outputs.run-arns != '[]'
        uses: ./.github/actions/run-mobile-integration-tests/cancel-device-farm-runs
        with:
          run-arns: ${{ steps.schedule.outputs.run-arns }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

      - name: Collect and upload Device Farm logs
        if: always() && !cancelled()
        uses: ./.github/actions/run-mobile-integration-tests/collect-and-upload-logs
        with:
          platform: ${{ matrix.platform }}
          addon-npm-name: '@qvac/bci-whispercpp'
          enables-perf: 'true'
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          run-arns: ${{ steps.schedule.outputs.run-arns }}

      - name: Extract and report BCI performance
        if: always() && steps.schedule.outputs.run-arns != '[]' && steps.schedule.outputs.run-arns != ''
        uses: ./.github/actions/run-mobile-integration-tests/extract-addon-perf
        with:
          platform: ${{ matrix.platform }}
          step-summary-title: 'Mobile Performance: bci (${{ matrix.platform }})'
          artifact-name: perf-report-bci-whispercpp-${{ matrix.platform }}-${{ github.run_number }}
          # iOS (and multi-device Android pools) write the PERF_REPORT markers
          # into bare_console.log inside Customer_Artifacts.zip; unzip them so
          # extract-from-log.js can find the per-device performance reports.
          # Without this iOS produces no benchmark rows. Mirrors parakeet.
          unzip-customer-artifacts: 'true'

      - name: Comment results on PR
        if: always() && !cancelled()
        uses: ./.github/actions/run-mobile-integration-tests/comment-on-pr
        with:
          addon-npm-name: '@qvac/bci-whispercpp'
          platform: ${{ matrix.platform }}
          test-result: ${{ steps.monitor.outputs.test-result }}
          test-total: ${{ steps.monitor.outputs.test-total }}
          test-passed: ${{ steps.monitor.outputs.test-passed }}
          test-failed: ${{ steps.monitor.outputs.test-failed }}
          test-skipped: ${{ steps.monitor.outputs.test-skipped }}
          user-test-passed: ${{ steps.monitor.outputs.user-test-passed }}
          user-test-failed: ${{ steps.monitor.outputs.user-test-failed }}
