name: On PR Trigger (SDK Fabric Agreement)

# Fails if the published addons @qvac/sdk selects resolve @qvac/fabric to more
# than one version. test-sdk.yml runs the same check before mobile device
# tests, and publish-sdk.yml before npm publish.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, release-*, feature-*, tmp-*]
    paths:
      - "packages/sdk/package.json"
      - ".github/workflows/on-pr-sdk-fabric-agreement.yml"
      - ".github/scripts/check-sdk-fabric-agreement.mjs"
      - ".github/scripts/lib/consumer-lockfile.mjs"
      - ".github/scripts/lib/sdk-fabric-agreement.mjs"
      - ".github/scripts/test/sdk-fabric-agreement.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sdk-fabric-agreement:
    name: SDK addons agree on @qvac/fabric
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Run unit tests
        run: node --test .github/scripts/test/sdk-fabric-agreement.test.mjs

      - name: Check @qvac/sdk
        run: node .github/scripts/check-sdk-fabric-agreement.mjs packages/sdk
