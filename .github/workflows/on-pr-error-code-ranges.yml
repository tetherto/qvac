name: Error code reservations

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Main PRs run this through Merge Guard's workflow_call.
    branches: [release-*, feature-*, tmp-*]
    paths:
      - "packages/**"
      - "plugins/**"
      - "scripts/error-codes/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/on-pr-error-code-ranges.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: error-code-ranges-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  error-code-ranges:
    name: Validate error code reservations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: "24.14.1"
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # 4.1.0
      - name: Install checker dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter . --filter @qvac/error
      - name: Validate allocations and actual code maps
        run: npm run errors:check
      - name: Test source checker
        run: npm run errors:test
      - name: Type-check source checker
        run: npm run errors:typecheck
      - name: Check error package
        working-directory: packages/error
        run: |
          npm run format
          npm run lint
          npm run typecheck
          npm run build:test
          ./node_modules/.bin/brittle-node 'test/dist/test/unit/*.test.js'
