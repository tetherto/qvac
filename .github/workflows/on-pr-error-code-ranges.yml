name: Error code reservations

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Main PRs run this through Merge Guard's workflow_call.
    branches: [release-*, feature-*, tmp-*]
    paths:
      - "packages/**"
      - "plugins/**"
      - "scripts/error-codes/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/on-pr-error-code-ranges.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: error-code-ranges-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  error-code-ranges:
    name: Validate error code reservations
    runs-on: ubuntu-latest
    cache-mode: none
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 7.1.0
        with:
          node-version: "24.14.1"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # 6.1.0
      - name: Install checker dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter .
      - name: Validate allocations and actual code maps
        run: npm run errors:check
      - name: Test source checker
        run: npm run errors:test
      - name: Type-check source checker
        run: npm run errors:typecheck
