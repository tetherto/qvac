name: OCR TypeScript Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/ocr-ggml/**"
      - ".github/workflows/*ocr-ggml*.yml"
      - "packages/fabric/vcpkg.json"
      - "packages/fabric/vcpkg-configuration.json"
      - ".github/workflows/reusable-ts-checks.yml"
      # nx marks every project affected when these change, so on-pr-nx
      # awaits this package's ts-check. nx.json and the root package.json
      # fan out via hard-coded locators in nx, not via namedInputs.
      - "pnpm-lock.yaml"
      - "package.json"
      - "nx.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ocr-ggml-pr-head-ts-checks:
    uses: ./.github/workflows/reusable-ts-checks.yml
    with:
      workdir: packages/ocr-ggml
