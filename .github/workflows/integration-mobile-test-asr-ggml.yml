name: Mobile Integration Tests (ASR GGML)

# Unified whisper + parakeet mobile lane for @qvac/asr-ggml.
#
# Functional runs (default matrix) build one app per platform, then split every
# runner in test/mobile/integration.auto.cjs into independent Whisper and
# Parakeet specs. Each spec runs on both flagship targets, so an early engine
# failure cannot mask the other engine. Perf collection remains unconditional,
# and Android pre-staging selects only the models required by the current spec.
#
# Benchmark runs (run_rtf_benchmarks=true) narrow each matrix row to the single
# mobile-perf runner registered in test/mobile/perf-tests.json that matches the
# row's engine + model/model_type + use_gpu: whisper tiny CPU/GPU, parakeet
# ctc/tdt CPU+GPU and eou/sortformer CPU, per platform.
#
# Mobile pre-stages models on the Device Farm host (presigned URLs + platform
# push) before device tests.

on:
  workflow_call:
    inputs:
      prebuild_package:
        description: "Full NPM package spec (name@version) whose prebuilds to pin instead of the freshly-built artifact (e.g. @qvac/asr-ggml@1.0.0). Empty = artifact-first (unchanged)."
        type: string
        required: false
        default: ""
      ref:
        description: "Git ref to checkout"
        type: string
        required: false
      repository:
        description: "Repository to checkout"
        type: string
        required: false
      workdir:
        description: "Relative path to package directory in monorepo"
        type: string
        required: false
        default: "packages/asr-ggml"
      run_rtf_benchmarks:
        description: "Run on-device RTF benchmarks (extracts metrics from Device Farm logs post-run)"
        type: boolean
        required: false
        default: false
  # Manual on-demand path. A dispatched run targets ONE platform and the
  # device(s) chosen below — it never runs the full default pool. The
  # workflow_call path (benchmarks / weekend / on-merge) is unchanged.
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to run on (a manual run targets one platform)."
        type: choice
        required: true
        options: [Android, iOS]
        default: Android
      device:
        description: "Device from the common pool. Pick '(custom)' to type your own in 'devices_custom'. Valid names + how to find them: docs/ci/MOBILE-ON-DEMAND.md."
        type: choice
        required: false
        options:
          - "(custom)"
          - "Google Pixel 9"
          - "Google Pixel 8"
          - "Samsung Galaxy S25 Ultra"
          - "Apple iPhone 17"
          - "Apple iPhone 16 Pro"
          - "Apple iPhone 15"
        default: "(custom)"
      devices_custom:
        description: "Comma-separated device model(s), e.g. 'Pixel 9, Pixel 8'. Overrides the dropdown; use for new/uncommon devices or several at once. Must match a Device Farm model (list + how to check: docs/ci/MOBILE-ON-DEMAND.md)."
        type: string
        required: false
        default: ""
      device_model_operator:
        description: "Model match: EQUALS (exact fleet model only — default; dropdown values are exact fleet names) or CONTAINS (any model containing the value; use for shorthand like 'Pixel 9'). EQUALS avoids billing a different/slower variant."
        type: choice
        required: false
        options: [EQUALS, CONTAINS]
        default: EQUALS
      tests:
        description: "Optional test filter: a mocha --grep regex matched by test NAME, not file name (e.g. 'runAddonTest'; combine several with '|'). Empty = full mobile suite. Where to find valid names: docs/ci/MOBILE-ON-DEMAND.md."
        type: string
        required: false
        default: ""
      ref:
        description: "Git ref (branch/tag/SHA) to test. Leave blank to use the branch you dispatch from."
        type: string
        required: false
        default: ""
      package_spec:
        description: "Package to test (name@version). Leave EMPTY (default) to test this branch's native prebuild artifact; use @qvac/asr-ggml@... for npm or @tetherto/asr-ggml@... for GPR to force-install a specific build."
        type: string
        required: false
        default: ""
      workdir:
        description: "Relative path to package directory in monorepo"
        type: string
        required: false
        default: "packages/asr-ggml"
      # NOTE: RTF benchmarks are intentionally NOT a manual-dispatch input. A
      # manual run always sets `platform`, which takes precedence in the build
      # matrix, so a dispatched run_rtf_benchmarks would be silently ignored.
      # Benchmarks run via workflow_call (benchmark-performance-asr-ggml).

permissions:
  contents: read

concurrency:
  # workflow_dispatch: at most one manual mobile run per (workflow, branch) at a
  # time — a fresh dispatch cancels the in-flight one so a re-run never stacks a
  # second Device Farm run. Different branches map to different groups, so the
  # same addon can still be tested on 2-3 branches in parallel. workflow_call
  # (benchmarks / weekend / on-merge) is keyed per run and never cancels —
  # inputs.platform is only ever set on a manual dispatch, and under workflow_call
  # github.* resolves to the CALLER, so run_id keeps each call self-contained.
  group: ${{ inputs.platform != '' && format('mobile-dispatch-{0}-{1}', github.workflow, github.ref) || format('mobile-call-{0}', github.run_id) }}
  cancel-in-progress: ${{ inputs.platform != '' }}

jobs:
  # Manual (workflow_dispatch) runs must name a device that exists on Device
  # Farm. This gate fails fast BEFORE any build or Device Farm run, so a typo
  # or an empty selection costs nothing. Skipped for workflow_call.
  validate-devices:
    name: Validate device selection
    if: inputs.platform != ''
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false
      # Validate the tests filter + shard fan-out against test-groups.json from
      # the SAME ref the build executes (inputs.ref || github.sha), not the
      # workflow ref, so a branch that renames/adds runners or shards can't pass
      # stale validation. Data only — nothing here is executed; the composite
      # action stays on the trusted workflow ref checked out above.
      - name: Checkout validation data (matches the built ref)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            packages/asr-ggml/test/mobile/test-groups.json
          sparse-checkout-cone-mode: false
          path: validation-data
          persist-credentials: false
      - name: Validate requested devices
        uses: ./.github/actions/run-mobile-integration-tests/validate-devices
        with:
          platform: ${{ inputs.platform }}
          devices: ${{ inputs.devices_custom != '' && inputs.devices_custom || (inputs.device != '(custom)' && inputs.device || '') }}
          device-model-operator: ${{ inputs.device_model_operator }}
          tests: ${{ inputs.tests }}
          test-groups-path: validation-data/packages/asr-ggml/test/mobile/test-groups.json
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

  # A Device Farm test failure fails this run on every trigger (no
  # continue-on-error). Mobile is on-demand for this addon (not part of
  # on-pr-asr-ggml.yml's PR lane), so this does not gate PR merges — it makes
  # manual/scheduled runs trustworthy instead of silently green.
  build-and-test:
    name: Build ${{ matrix.platform }} (${{ matrix.engine && format('{0} {1} {2}', matrix.engine, matrix.model || matrix.model_type, matrix.use_gpu && 'gpu' || 'cpu') || 'functional' }}) and Run E2E Tests
    # workflow_call: validate-devices is skipped; the `skipped` branch of the
    # condition keeps this job running exactly as before.
    # workflow_dispatch: a bad/empty device selection blocks this job.
    needs: [validate-devices]
    if: ${{ !cancelled() && (needs.validate-devices.result == 'success' || needs.validate-devices.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    environment: release
    # Device Farm monitoring can consume 150 minutes for functional runs and
    # 120 for benchmarks. Reserve another hour for checkout, dependency setup,
    # app build, upload, scheduling, log collection, and cancellation cleanup.
    timeout-minutes: ${{ !inputs.run_rtf_benchmarks && 210 || 180 }}
    permissions:
      contents: read
      packages: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      # Benchmark matrix (run_rtf_benchmarks=true) sweeps engine x model x
      # backend on Android + iOS: whisper ggml-tiny CPU/GPU (the old whisper
      # mobile perf lanes), parakeet ctc/tdt CPU+GPU and eou/sortformer CPU.
      # `use_gpu:true` selects Vulkan on Android / Metal on iOS. Parakeet GPU
      # eou/sortformer lanes are omitted to bound the Device Farm run count
      # (16 total). The default (non-benchmark) matrix runs both engines'
      # suites in one app per platform.
      #
      # There is deliberately no `vad` axis either: the whisper perf runner
      # (test/integration/mobile-perf-runner.js) does not configure VAD at all,
      # so a `vad` matrix key would only mislabel the artifact.
      #
      # There is deliberately NO `quant` axis: each parakeet perf runner sweeps
      # q4_0/q8_0/f16 itself on device (test/integration/parakeet-mobile-perf-runner.js
      # recurses over `quants` when no explicit quant is passed) and emits one
      # perf record per quant, so a workflow-level quant key would only
      # mislabel an artifact that already contains all three.
      #
      # engine/model/use_gpu DO reach the device: the "Resolve benchmark
      # test-groups" step below maps each row to the single runner function in
      # test/mobile/perf-tests.json that is hard-parameterised for exactly that
      # combination, and passes it as the Mocha grep.
      matrix: ${{ fromJSON(inputs.platform != '' && (inputs.platform == 'iOS' && '{"include":[{"platform":"iOS","os":"macos-14","runner":"macos-14"}]}' || '{"include":[{"platform":"Android","os":"ubuntu-22.04","runner":"qvac-ubuntu2404-x64"}]}') || inputs.run_rtf_benchmarks && '{"include":[{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","engine":"whisper","model":"ggml-tiny","use_gpu":false},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","engine":"whisper","model":"ggml-tiny","use_gpu":true},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","engine":"parakeet","model_type":"ctc","use_gpu":false},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","engine":"parakeet","model_type":"ctc","use_gpu":true},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","engine":"parakeet","model_type":"tdt","use_gpu":false},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","engine":"parakeet","model_type":"tdt","use_gpu":true},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","engine":"parakeet","model_type":"eou","use_gpu":false},{"platform":"Android","os":"ubuntu-24.04","runner":"qvac-ubuntu2404-x64","engine":"parakeet","model_type":"sortformer","use_gpu":false},{"platform":"iOS","os":"macos-14","runner":"macos-14","engine":"whisper","model":"ggml-tiny","use_gpu":false},{"platform":"iOS","os":"macos-14","runner":"macos-14","engine":"whisper","model":"ggml-tiny","use_gpu":true},{"platform":"iOS","os":"macos-14","runner":"macos-14","engine":"parakeet","model_type":"ctc","use_gpu":false},{"platform":"iOS","os":"macos-14","runner":"macos-14","engine":"parakeet","model_type":"ctc","use_gpu":true},{"platform":"iOS","os":"macos-14","runner":"macos-14","engine":"parakeet","model_type":"tdt","use_gpu":false},{"platform":"iOS","os":"macos-14","runner":"macos-14","engine":"parakeet","model_type":"tdt","use_gpu":true},{"platform":"iOS","os":"macos-14","runner":"macos-14","engine":"parakeet","model_type":"eou","use_gpu":false},{"platform":"iOS","os":"macos-14","runner":"macos-14","engine":"parakeet","model_type":"sortformer","use_gpu":false}]}' || '{"include":[{"platform":"Android","os":"ubuntu-22.04","runner":"qvac-ubuntu2404-x64"},{"platform":"iOS","os":"macos-14","runner":"macos-14"}]}') }}

    steps:
      - name: Manual Workspace Cleanup
        if: runner.environment != 'github-hosted'
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE"

      - name: Validate Dispatch Inputs
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.package_spec
        env:
          PACKAGE_SPEC: ${{ github.event.inputs.package_spec }}
        run: |
          set -euo pipefail
          if [[ ! "$PACKAGE_SPEC" =~ ^@qvac/|^@tetherto/ ]]; then
            echo "::error::Invalid package scope. Only @qvac/* or @tetherto/* is allowed."
            exit 1
          fi

      # Fail fast on the unified family's Device Farm secrets instead of dying
      # deep inside `aws devicefarm create-upload --project-arn ""` after a full
      # 30+ minute app build. These two secrets are NEW for @qvac/asr-ggml (the
      # parents used the _WHISPERCPP / _PARAKEET pairs, which are deliberately
      # NOT reused here: repointing another family's project would silently
      # change its device coverage) and are an out-of-repo infra prerequisite —
      # see docs/QIP-asr-ggml.md.
      #
      # Device Farm identity: this lane resolves the ASR_GGML secret names when
      # they exist and otherwise falls back to the retiring
      # transcription-parakeet project + iOS device pool. Secrets are not scoped
      # to a package, so reusing parakeet's costs nothing and needs no new
      # provisioning; the `||` keeps that a migration rather than a permanent
      # coupling -- add AWS_DEVICE_FARM_PROJECT_ARN_ASR_GGML /
      # IOS_DEVICE_POOL_ARN_ASR_GGML later and they win automatically, with no
      # workflow change.
      #
      # Consequence to respect when retiring parakeet: DO NOT delete
      # AWS_DEVICE_FARM_PROJECT_ARN_PARAKEET / IOS_DEVICE_POOL_ARN_PARAKEET until
      # the ASR_GGML pair exists, or this lane loses its Device Farm identity.
      #
      # The whispercpp pair is deliberately not the fallback: bci-whispercpp still
      # runs against that project, so we would be sharing its concurrency.
      #
      # Scope of the pool swap, precisely: this lane explicitly uses
      # dual-flagship scheduling. Functional runs create two specs and opt into
      # multi-spec dual-flagship, producing one independent run per
      # engine/device combination. Android targets Samsung + Pixel filters; iOS
      # targets the configured pool + iPhone 17. Filters are project-independent,
      # so only the first iOS run is affected by borrowing parakeet's project.
      # No Android pool secret is needed for this scheduling mode.
      - name: Verify Device Farm secrets are provisioned
        shell: bash
        env:
          DEVICE_FARM_PROJECT_ARN: ${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN_ASR_GGML || secrets.AWS_DEVICE_FARM_PROJECT_ARN_PARAKEET }}
          IOS_DEVICE_POOL_ARN: ${{ secrets.IOS_DEVICE_POOL_ARN_ASR_GGML || secrets.IOS_DEVICE_POOL_ARN_PARAKEET }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          missing=""
          if [ -z "$DEVICE_FARM_PROJECT_ARN" ]; then
            missing="$missing AWS_DEVICE_FARM_PROJECT_ARN_ASR_GGML (or _PARAKEET)"
          fi
          if [ "$PLATFORM" = "iOS" ]; then
            if [ -z "$IOS_DEVICE_POOL_ARN" ]; then
              missing="$missing IOS_DEVICE_POOL_ARN_ASR_GGML (or _PARAKEET)"
            fi
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing Device Farm secret(s):$missing. This lane reads the ASR_GGML names if present and otherwise falls back to the retiring transcription-parakeet pair, so it needs no new secrets while those still exist. If both are gone, add the ASR_GGML pair to the 'release' environment with the parakeet project + iOS pool ARNs."
            exit 1
          fi
          echo "Device Farm secrets present."

      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false

      - name: Checkout addon repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: addon
          fetch-depth: 0

      - name: Validate mobile tests are up-to-date
        working-directory: addon/${{ inputs.workdir || 'packages/asr-ggml' }}
        run: npm run test:mobile:validate || true

      - name: Setup mobile test environment
        uses: ./.github/actions/run-mobile-integration-tests/setup
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: ${{ inputs.workdir || 'packages/asr-ggml' }}
          addon-npm-name: '@qvac/asr-ggml'
          prebuild-artifact-prefix: 'asr-ggml-'
          pat-token: ${{ secrets.GITHUB_TOKEN }}
          # workflow_call uses prebuild_package; workflow_dispatch exposes the
          # equivalent package_spec input. Pin either path explicitly.
          package-version: ${{ inputs.prebuild_package || inputs.package_spec }}
          force-npm-prebuild: ${{ (inputs.prebuild_package != '' || inputs.package_spec != '') && 'true' || 'false' }}

      # The release environment authorizes GitHub OIDC to assume the scoped AWS
      # role (no long-lived keys); us-west-2 so the presigned parakeet URLs
      # target the Device-Farm-local US bucket.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # 6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-west-2
          role-duration-seconds: 7200

      # Presigns the PARAKEET GGUF URLs and stores a local manifest consumed by
      # generate-prestage-block.js below. Whisper models are NOT in the manifest
      # (they are public HuggingFace downloads, not presigned registry GGUFs):
      # generate-prestage-block.js maps the current shard grep to only the
      # required public Whisper models, and helpers.copyPrestagedModel() picks
      # them up on-device (falling back to helpers.ensureWhisperModel() if a
      # host-side stage was skipped). Runs on every mobile run.
      - name: Generate ASR GGML mobile model manifest
        working-directory: addon/${{ inputs.workdir || 'packages/asr-ggml' }}
        shell: bash
        env:
          # US mirror bucket + region (parakeet/indic GGUFs are mirrored under
          # qvac_models_compiled/ggml/ by the EU->US sync job).
          MODEL_S3_BUCKET: tether-ai-dev-us
          AWS_REGION: us-west-2
        run: |
          set -euo pipefail
          node scripts/generate-mobile-model-manifest.js
          ls -lh test/mobile/testAssets/

      # Android mirrors the LLM mobile pattern: Device Farm's host downloads
      # the models from presigned URLs and adb-pushes them to /data/local/tmp,
      # so the phone does not rely on flaky large downloads and Metro never
      # bundles the models into the app. iOS uses the same generator pattern
      # with pymobiledevice3 apps push into the app's Documents directory.
      #
      # UNCONDITIONAL for Android, matching the parakeet parent. Functional runs
      # resolve test/mobile/test-groups.json into one Whisper and one Parakeet
      # spec; benchmark rows resolve one explicit runner below.
      #
      # The shared upload action passes each spec's grep through
      # /tmp/qvacShardGrep.txt. The prestage block looks up those runner names in
      # the model manifests, so
      # scripts/generate-mobile-model-manifest.js must key TEST_MODELS with the
      # names exported by test/mobile/integration.auto.cjs.
      - name: Generate model pre-stage commands (Android)
        id: prestage
        if: ${{ matrix.platform == 'Android' }}
        working-directory: addon/${{ inputs.workdir || 'packages/asr-ggml' }}
        run: |
          set -euo pipefail
          node scripts/generate-prestage-block.js android > "$RUNNER_TEMP/prestage-block.txt"
          {
            echo "block<<PRESTAGE_EOF"
            cat "$RUNNER_TEMP/prestage-block.txt"
            echo "PRESTAGE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate model pre-stage commands (iOS)
        id: ios_prestage
        if: ${{ matrix.platform == 'iOS' }}
        working-directory: addon/${{ inputs.workdir || 'packages/asr-ggml' }}
        run: |
          set -euo pipefail
          node scripts/generate-prestage-block.js ios > "$RUNNER_TEMP/prestage-block.txt"
          {
            echo "block<<PRESTAGE_EOF"
            cat "$RUNNER_TEMP/prestage-block.txt"
            echo "PRESTAGE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build mobile app
        id: build
        uses: ./.github/actions/run-mobile-integration-tests/build-mobile-app
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: ${{ inputs.workdir || 'packages/asr-ggml' }}
          addon-npm-name: '@qvac/asr-ggml'
          ios-build-cert-base64: ${{ secrets.TEST_APP_APPLE_DISTRIBUTION_CERTIFICATE }}
          ios-build-cert-password: ${{ secrets.APPLE_P12_PASSWORD }}
          ios-keychain-password: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          ios-provisioning-profile-base64: ${{ secrets.TEST_APP_APPLE_PROVISIONING_PROFILE }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}
          # Parakeet performance runners sweep multiple quantizations in one
          # test. Keep the generated harness above its 20-minute default on both
          # platforms, with a separate Mocha ceiling below.
          per-test-timeout-minutes: '45'

      # Benchmark runs (run_rtf_benchmarks=true): run ONLY the one on-device
      # benchmark runner that matches this matrix row, instead of the whole
      # suite. The row's engine + model/model_type + use_gpu map deterministically
      # onto a single runner exported by test/mobile/integration.auto.cjs (the
      # runners are hard-parameterised per file — there is no env-var axis), and
      # that name must be registered in test/mobile/perf-tests.json, which
      # scripts/validate-mobile-tests.js keeps in sync with the mobile-perf test
      # files. An unmapped or unregistered row fails here with a named error
      # rather than silently benchmarking the wrong thing.
      #
      # On a normal (non-benchmark) run this step is skipped and the upload
      # action auto-detects test/mobile/test-groups.json.
      - name: Resolve benchmark test-groups from perf-tests.json
        id: perf_groups
        if: ${{ inputs.run_rtf_benchmarks }}
        working-directory: addon/${{ inputs.workdir || 'packages/asr-ggml' }}
        env:
          ENGINE: ${{ matrix.engine }}
          MODEL: ${{ matrix.model || '' }}
          MODEL_TYPE: ${{ matrix.model_type || '' }}
          BACKEND_TAG: ${{ matrix.use_gpu && 'Gpu' || 'Cpu' }}
        run: |
          set -euo pipefail
          PERF_FILE=test/mobile/perf-tests.json
          if [ ! -f "$PERF_FILE" ]; then
            echo "::error::$PERF_FILE is missing — the mobile benchmark lane resolves its Mocha grep from it. Run 'npm run test:mobile:validate' locally."
            exit 1
          fi

          RUNNER=""
          case "$ENGINE" in
            whisper)
              case "$MODEL" in
                ggml-tiny) RUNNER="runMobilePerfTiny${BACKEND_TAG}Test" ;;
                sweep) RUNNER="runMobilePerfSweep${BACKEND_TAG}Test" ;;
              esac
              ;;
            parakeet)
              case "$MODEL_TYPE" in
                ctc) RUNNER="runParakeetMobilePerfCtc${BACKEND_TAG}Test" ;;
                tdt) RUNNER="runParakeetMobilePerfTdt${BACKEND_TAG}Test" ;;
                eou) RUNNER="runParakeetMobilePerfEou${BACKEND_TAG}Test" ;;
                sortformer) RUNNER="runParakeetMobilePerfSortformer${BACKEND_TAG}Test" ;;
                sortformer-streaming) RUNNER="runParakeetMobilePerfSortformerStreaming${BACKEND_TAG}Test" ;;
              esac
              ;;
          esac

          if [ -z "$RUNNER" ]; then
            echo "::error::No on-device benchmark runner maps to engine='$ENGINE' model='$MODEL' model_type='$MODEL_TYPE'. Add the mapping here and the runner to $PERF_FILE."
            exit 1
          fi

          if ! jq -e --arg runner "$RUNNER" 'index($runner) != null' "$PERF_FILE" > /dev/null; then
            echo "::error::$RUNNER is not registered in $PERF_FILE (engine='$ENGINE' model='$MODEL' model_type='$MODEL_TYPE')."
            exit 1
          fi

          echo "Benchmark grep: $RUNNER"
          printf 'groups=[{"name":"perf","grep":"%s"}]\n' "$RUNNER" >> "$GITHUB_OUTPUT"

      # On a manual run with a test filter, override to a single grepped spec
      # so only those tests run. Empty filter / workflow_call is unchanged.
      - name: Resolve manual test filter
        id: manual_tests
        if: inputs.platform != '' && inputs.tests != ''
        shell: bash
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          # Reject anything but mocha-safe grep characters so a manual `tests`
          # value cannot break out of the generated WDIO config on the Device
          # Farm host (defense-in-depth; the sink is also JSON-encoded).
          if ! printf '%s' "$TESTS" | grep -Eq '^[A-Za-z0-9_ |().*+-]+$'; then
            echo "::error::Invalid 'tests' filter '$TESTS'. Allowed: letters, digits, and _ space | ( ) . * + - (a mocha --grep on test NAMES, e.g. 'runAddonTest' or 'runFoo|runBar')."
            exit 1
          fi
          MANUAL_GROUPS=$(jq -nc --arg g "$TESTS" '[{name:"manual", grep:$g}]')
          echo "groups=$MANUAL_GROUPS" >> "$GITHUB_OUTPUT"

      - name: Upload to Device Farm
        id: upload
        uses: ./.github/actions/run-mobile-integration-tests/upload-to-devicefarm
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: ${{ inputs.workdir || 'packages/asr-ggml' }}
          app-path: ${{ steps.build.outputs.app-path }}
          app-type: ${{ steps.build.outputs.app-type }}
          app-name: ${{ steps.build.outputs.app-name }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          # Resolves the ASR_GGML project secret when it exists, else the
          # retiring transcription-parakeet one -- see the note on the secret
          # verification step above. Not the whisper/BCI-shared project: that one
          # still has a live tenant.
          device-farm-project-arn: ${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN_ASR_GGML || secrets.AWS_DEVICE_FARM_PROJECT_ARN_PARAKEET }}
          # Empty on normal runs => action auto-detects test-groups.json.
          # Set on benchmark runs => only the selected benchmark runner.
          # A manual test filter (workflow_dispatch) takes precedence over both.
          test-groups: ${{ steps.manual_tests.outputs.groups != '' && steps.manual_tests.outputs.groups || steps.perf_groups.outputs.groups }}
          # Both functional shards include performance runners; their names end
          # in "-perf" so the shared action enables performance bridging.
          enables-perf: 'true'
          # Mocha wraps the generated 45-minute per-test wait, so it needs its
          # own headroom rather than expiring at the same boundary.
          mocha-timeout-ms: '3300000'
          wdio-waitfor-timeout-ms: '600000'
          extra-pre-test-commands: ${{ matrix.platform == 'iOS' && steps.ios_prestage.outputs.block || steps.prestage.outputs.block }}

      - name: Schedule Device Farm test runs
        id: schedule
        uses: ./.github/actions/run-mobile-integration-tests/schedule-test-run
        with:
          platform: ${{ matrix.platform }}
          device-farm-project-arn: ${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN_ASR_GGML || secrets.AWS_DEVICE_FARM_PROJECT_ARN_PARAKEET }}
          ios-device-pool-arn: ${{ secrets.IOS_DEVICE_POOL_ARN_ASR_GGML || secrets.IOS_DEVICE_POOL_ARN_PARAKEET }}
          app-upload-arn: ${{ steps.upload.outputs.app-upload-arn }}
          test-package-upload-arn: ${{ steps.upload.outputs.test-package-upload-arn }}
          test-specs: ${{ steps.upload.outputs.test-specs }}
          # workflow_dispatch: fan out across the chosen device(s).
          # workflow_call: unchanged dual-flagship behaviour.
          scheduling-mode: ${{ inputs.platform != '' && 'manual-devices' || 'dual-flagship' }}
          multi-spec-dual-flagship: ${{ !inputs.run_rtf_benchmarks && 'true' || 'false' }}
          device-models: ${{ inputs.platform != '' && (inputs.devices_custom != '' && inputs.devices_custom || (inputs.device != '(custom)' && inputs.device || '')) || '' }}
          device-model-operator: ${{ inputs.platform != '' && inputs.device_model_operator || '' }}

      - name: Monitor Device Farm test runs
        id: monitor
        uses: ./.github/actions/run-mobile-integration-tests/monitor-test-run
        with:
          run-arns: ${{ steps.schedule.outputs.run-arns }}
          run-count: ${{ steps.schedule.outputs.run-count }}
          test-specs: ${{ steps.upload.outputs.test-specs }}
          # Functional multi-spec runs need headroom beyond Device Farm's
          # 120-minute execution ceiling for normal queue variance.
          max-wait-time-seconds: ${{ !inputs.run_rtf_benchmarks && '9000' || '7200' }}

      - name: Cancel Device Farm runs on workflow cancellation
        if: cancelled() && steps.schedule.outputs.run-arns != '' && steps.schedule.outputs.run-arns != '[]'
        uses: ./.github/actions/run-mobile-integration-tests/cancel-device-farm-runs
        with:
          run-arns: ${{ steps.schedule.outputs.run-arns }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

      - name: Collect and upload Device Farm logs
        if: always() && !cancelled()
        uses: ./.github/actions/run-mobile-integration-tests/collect-and-upload-logs
        with:
          platform: ${{ matrix.platform }}
          addon-npm-name: '@qvac/asr-ggml'
          # Unconditional, for the same reason as the upload step above.
          enables-perf: 'true'
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          run-arns: ${{ steps.schedule.outputs.run-arns }}

      # merge=true unions per-device performance-report.json payloads (Android
      # pools can run more than one device). unzip-customer-artifacts=true is
      # required for iOS: its [PERF_REPORT_START] markers print to
      # bare_console.log, which on iOS Device Farm is wrapped inside
      # Customer_Artifacts.zip; without unzipping, extract-from-log.js never
      # scans it and the iOS perf report comes back empty. Both parent ASR
      # families needed this. The artifact name is what
      # benchmark-performance-asr-ggml.yml's summarize job downloads
      # (pattern perf-report-asr-ggml-*).
      # Runs on EVERY mobile run, matching both parent lanes — the mobile-perf
      # runners execute on normal PRs too (see the enables-perf note above), so
      # gating this on run_rtf_benchmarks would discard the only mobile rows
      # on-pr-asr-ggml.yml's unified performance report ever gets. The engine /
      # model / backend suffix is present only on benchmark rows, where the
      # matrix defines those keys; functional rows fall back to the parents'
      # perf-report-asr-ggml-<platform>-<run_number> shape.
      - name: Extract and report ASR GGML performance
        if: always() && !cancelled() && steps.schedule.outputs.run-arns != '[]' && steps.schedule.outputs.run-arns != ''
        uses: ./.github/actions/run-mobile-integration-tests/extract-addon-perf
        with:
          platform: ${{ matrix.platform }}
          filter: ''
          merge: 'true'
          unzip-customer-artifacts: 'true'
          step-summary-title: "Mobile Performance: asr-ggml (${{ matrix.platform }}${{ matrix.engine && format(', {0} {1} {2}', matrix.engine, matrix.model || matrix.model_type, matrix.use_gpu && 'gpu' || 'cpu') || '' }})"
          artifact-name: perf-report-asr-ggml-${{ matrix.platform }}${{ matrix.engine && format('-{0}-{1}-{2}', matrix.engine, matrix.model || matrix.model_type, matrix.use_gpu && 'gpu' || 'cpu') || '' }}-${{ github.run_number }}

      - name: Comment results on PR
        if: always() && !cancelled()
        uses: ./.github/actions/run-mobile-integration-tests/comment-on-pr
        with:
          addon-npm-name: '@qvac/asr-ggml'
          platform: ${{ matrix.platform }}
          test-result: ${{ steps.monitor.outputs.test-result }}
          test-total: ${{ steps.monitor.outputs.test-total }}
          test-passed: ${{ steps.monitor.outputs.test-passed }}
          test-failed: ${{ steps.monitor.outputs.test-failed }}
          test-skipped: ${{ steps.monitor.outputs.test-skipped }}
          user-test-passed: ${{ steps.monitor.outputs.user-test-passed }}
          user-test-failed: ${{ steps.monitor.outputs.user-test-failed }}
