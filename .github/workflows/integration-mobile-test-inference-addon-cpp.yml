name: Mobile Integration Tests (inference-addon-cpp)

# Runs the inference-addon-cpp integration suite on real iOS + Android devices
# (AWS Device Farm), mirroring integration-mobile-test-embed-llamacpp.yml.
#
# inference-addon-cpp is a header-only library with no published npm package and
# no prebuild pipeline, so — unlike the llamacpp addons — this workflow BUILDS
# the mobile test addon's `.bare` prebuilds itself in the prebuild-android /
# prebuild-ios jobs and hands them to the shared
# run-mobile-integration-tests/setup action via per-matrix artifacts
# (`infer-cpp-<platform>-arm64`). Everything downstream (app build, Device Farm
# upload/schedule/monitor) is the shared composite action, unchanged — but the
# build and Device-Farm phases run in SEPARATE jobs so no fork code executes in a
# job that holds AWS/OIDC access (see the build/device-farm split below).
#
# Test scope (phase 1): the js-create-double marshalling test only. Advisory
# (continue-on-error) until on-device flake is characterised. See
# packages/inference-addon-cpp/mobile/.

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to checkout"
        type: string
        required: false
      repository:
        description: "Repository to checkout"
        type: string
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to test. Leave blank to use the branch you dispatch from."
        type: string
        required: false
        default: ""

# Guards the workflow_dispatch path so two manual dispatches don't run — and bill
# — concurrent Device Farm runs. The workflow_call path is additionally covered by
# the caller's own concurrency. NOTE: the group key is a literal, NOT
# `github.workflow` — under workflow_call that resolves to the CALLER's name and
# would collide with on-pr-inference-addon-cpp.yml's concurrency group.
concurrency:
  group: mobile-df-inference-addon-cpp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ADDON_WORKDIR: packages/inference-addon-cpp/mobile
  PREBUILD_PREFIX: infer-cpp-

jobs:
  # Fast, deterministic drift check: fails if the committed
  # test/mobile/integration.auto.cjs is out of sync with test/integration/.
  # Kept as its OWN job (not a step in build) and NOT continue-on-error, so drift
  # shows as a clear red job rather than a silent green no-op. It gates the
  # prebuild/build/device-farm chain, so drift stops the run early — before any
  # macOS or Device Farm minutes are spent. Runs untrusted fork code but holds NO
  # secrets, so that's safe.
  validate-mobile:
    name: Validate mobile tests in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout addon repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 22
      - name: Validate mobile tests are up-to-date
        working-directory: ${{ env.ADDON_WORKDIR }}
        run: npm run test:mobile:validate

  # ---------------------------------------------------------------------------
  # Build the mobile test addon's native prebuilds. The header-only library +
  # cmake-bare build has no vcpkg / private-registry dependency, so this is a
  # plain cross-compile. Android needs `-D ANDROID_STL=c++_shared` for libc++
  # (same flag the C++ unit-test workflow uses); iOS builds for device (arm64),
  # and setup/ derives the simulator variant.
  #
  # cost: inference-addon-cpp has no prebuild pipeline, so prebuild-ios runs on
  # macos-14 ON TOP OF the macos-14 `build` job below — two GitHub-hosted macOS
  # jobs per run (vs one in the llamacpp mobile workflows), and there is NO reuse
  # gate yet, so every `synchronize` rebuilds both prebuilds from scratch. This
  # is acceptable at label-gated phase-1 frequency. FOLLOW-UP (phase-2
  # prerequisite, before any higher-frequency trigger): add a native-hash reuse
  # gate mirroring .github/actions/prebuild-artifact-reuse + detect-native-changes
  # so unchanged native code skips the macOS rebuild. (The prebuild jobs are kept
  # separate from `build` on purpose — they hold no secrets — so folding them in
  # to save a runner is not an option.)
  # ---------------------------------------------------------------------------
  prebuild-android:
    name: Prebuild (Android arm64)
    needs: validate-mobile
    runs-on: qvac-ubuntu2204-x64
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 22

      - name: Install Bare tooling
        run: npm install -g --force bare bare-make

      - name: Configure Android cross-compilation
        run: |
          echo "ANDROID_TOOLCHAIN_ROOT=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"
          echo "ANDROID_NATIVE_API_LEVEL=34" >> "$GITHUB_ENV"

      - name: Build Android prebuild
        working-directory: ${{ env.ADDON_WORKDIR }}
        run: |
          npm install --ignore-scripts
          bare-make generate --platform android --arch arm64 -D ANDROID_STL=c++_shared
          bare-make build
          bare-make install
          test -f prebuilds/android-arm64/inference-addon-cpp-mobile-tests.bare

      - name: Upload Android prebuild artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: ${{ env.PREBUILD_PREFIX }}android-arm64
          path: ${{ env.ADDON_WORKDIR }}/prebuilds
          if-no-files-found: error
          retention-days: 1

  prebuild-ios:
    name: Prebuild (iOS arm64)
    needs: validate-mobile
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 22

      - name: Install Bare tooling
        run: npm install -g --force bare bare-make

      - name: Setup CMake on macOS
        run: |
          cd ..
          curl -L https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz -o cmake-3.31.6-macos-universal.tar.gz
          tar -xzf cmake-3.31.6-macos-universal.tar.gz
          echo "$PWD/cmake-3.31.6-macos-universal/CMake.app/Contents/bin" >> "$GITHUB_PATH"

      - name: Build iOS prebuild
        working-directory: ${{ env.ADDON_WORKDIR }}
        run: |
          npm install --ignore-scripts
          bare-make generate --platform ios --arch arm64
          bare-make build
          bare-make install
          test -f prebuilds/ios-arm64/inference-addon-cpp-mobile-tests.bare

      - name: Upload iOS prebuild artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: ${{ env.PREBUILD_PREFIX }}ios-arm64
          path: ${{ env.ADDON_WORKDIR }}/prebuilds
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # SECURITY SPLIT (QVAC review): the build and the Device-Farm phases run in
  # SEPARATE jobs so that no fork-controlled code ever executes in a job that
  # holds AWS/OIDC access.
  #
  #   build       — runs untrusted PR code (npm run validate, npm install of the
  #                 fork, expo/gradle/xcode). Has the Apple signing secrets and
  #                 PAT, but NO `id-token: write` and NO AWS. Produces the app +
  #                 the trusted test-framework e2e bundle as an artifact.
  #   device-farm — has `id-token: write` + AWS, runs ONLY trusted code
  #                 (test-framework e2e packaging + AWS API calls). Never checks
  #                 out or executes fork code; it only consumes the artifact.
  #
  # This removes the job-wide OIDC/AWS-role-assumption capability from the
  # fork-code job. The Apple cert necessarily stays in `build` because iOS
  # signing needs the built (fork) code and the cert together.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.platform }} app
    needs:
      - prebuild-android
      - prebuild-ios
    runs-on: ${{ matrix.runner }}
    environment: release
    # Exceeds the 30m default: builds the mobile app (npm install + expo prebuild
    # + Gradle/xcodebuild). No device execution here — that's the device-farm job.
    timeout-minutes: 90
    continue-on-error: true # advisory until on-device flake is characterised
    # No id-token / AWS here: this job runs untrusted fork code and must not be
    # able to mint an OIDC token or assume the AWS role.
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            os: ubuntu-22.04
            runner: qvac-ubuntu2204-x64
          - platform: iOS
            os: macos-14
            runner: macos-14

    steps:
      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false

      # No token: fetch the (untrusted) PR ref with the default GITHUB_TOKEN and
      # persist-credentials:false so no credential is written into
      # addon/.git/config, which the fork-controlled steps below could read.
      # Matches the prebuild-android/ios checkouts. If a private fork ever 404s
      # here, re-add token to ALL checkouts WITH persist-credentials:false.
      - name: Checkout addon repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          path: addon
          fetch-depth: 0

      - name: Setup mobile test environment
        uses: ./.github/actions/run-mobile-integration-tests/setup
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: ${{ env.ADDON_WORKDIR }}
          addon-npm-name: 'inference-addon-cpp-mobile-tests'
          prebuild-artifact-prefix: ${{ env.PREBUILD_PREFIX }}
          pat-token: ${{ secrets.PAT_TOKEN }}

      - name: Build mobile app
        id: build
        uses: ./.github/actions/run-mobile-integration-tests/build-mobile-app
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: ${{ env.ADDON_WORKDIR }}
          addon-npm-name: 'inference-addon-cpp-mobile-tests'
          ios-build-cert-base64: ${{ secrets.TEST_APP_APPLE_DISTRIBUTION_CERTIFICATE }}
          ios-build-cert-password: ${{ secrets.APPLE_P12_PASSWORD }}
          ios-keychain-password: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          ios-provisioning-profile-base64: ${{ secrets.TEST_APP_APPLE_PROVISIONING_PROFILE }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

      # Stage ONLY non-executable DATA for the device-farm job — never the
      # ./test-framework workspace itself. This build job runs fork code, so
      # anything it leaves in ./test-framework (e.g. e2e/package.json) could be
      # tampered; the device-farm job therefore re-fetches a CLEAN framework and
      # overlays only these artifacts, none of which it executes:
      #   - app binary        → uploaded to Device Farm, runs on-device only
      #   - e2e/app.test.js    → the generated WDIO driver; packed and run on the
      #                          Device Farm host, never in the device-farm job
      #   - addon test/mobile  → read-only, for the monitor legend
      - name: Stage Device Farm handoff data
        shell: bash
        env:
          APP_PATH: ${{ steps.build.outputs.app-path }}
          APP_NAME: ${{ steps.build.outputs.app-name }}
        run: |
          mkdir -p df-handoff/app df-handoff/e2e-tests df-handoff/addon-test-mobile
          cp "$APP_PATH" "df-handoff/app/$APP_NAME"
          cp test-framework/e2e/tests/app.test.js df-handoff/e2e-tests/app.test.js
          cp -R "addon/${ADDON_WORKDIR}/test/mobile/." df-handoff/addon-test-mobile/
          ls -R df-handoff

      - name: Upload Device Farm handoff data
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: mobile-bundle-${{ matrix.platform }}
          path: df-handoff
          if-no-files-found: error
          retention-days: 1

  device-farm:
    name: Device Farm ${{ matrix.platform }}
    needs: build
    runs-on: ubuntu-latest
    environment: release
    # Exceeds the 30m default: waits on the AWS Device Farm run (queue + device
    # provisioning + on-device execution), which routinely takes >30m.
    timeout-minutes: 120
    continue-on-error: true # advisory until on-device flake is characterised
    permissions:
      contents: read
      packages: read
      pull-requests: write # comment results on the PR
      id-token: write # AWS OIDC — this job runs NO fork code
    strategy:
      fail-fast: false
      matrix:
        include:
          # app_name/app_type are deterministic from platform (set by
          # build-mobile-app's resolve_app), so we hardcode them here instead of
          # threading matrix-job outputs (which don't survive a matrix fan-out).
          - platform: Android
            app_type: ANDROID_APP
            app_name: test-app-Android.apk
          - platform: iOS
            app_type: IOS_APP
            app_name: test-app-iOS.ipa

    steps:
      - name: Checkout composite action source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
          sparse-checkout-cone-mode: false

      # Fetch a CLEAN copy of the trusted test framework directly from its repo —
      # NOT from the build artifact. The build job ran fork code and could have
      # tampered with the framework's e2e/package.json; installing that here
      # (where AWS creds are configured) would let an injected script run against
      # the assumed role. This job runs ONLY this trusted code, so having the PAT
      # here is safe; persist-credentials:false keeps it off disk regardless.
      # NOTE: `ref: main` matches the setup composite's default in the build job;
      # ideally both are pinned to the same SHA so the generated app.test.js
      # can't mismatch the framework version.
      - name: Checkout trusted mobile test framework
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: tetherto/qvac-test-addon-mobile
          ref: main
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false
          path: test-framework

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 22

      # Data-only handoff from the (fork-code) build job. NONE of it is executed
      # here: the app binary is uploaded to Device Farm, app.test.js is packed +
      # run on the Device Farm host, and addon test/mobile is read-only.
      - name: Download Device Farm handoff data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: mobile-bundle-${{ matrix.platform }}
          path: df-handoff

      # Overlay the data onto the CLEAN framework. upload-to-devicefarm then runs
      # `npm install` against the trusted e2e/package.json — an injected script in
      # a fork-tampered package.json can no longer reach the AWS creds.
      - name: Assemble Device Farm inputs
        shell: bash
        run: |
          cp df-handoff/e2e-tests/app.test.js test-framework/e2e/tests/app.test.js
          mkdir -p "addon/${ADDON_WORKDIR}/test/mobile"
          cp -R df-handoff/addon-test-mobile/. "addon/${ADDON_WORKDIR}/test/mobile/"
          mkdir -p df-app
          cp "df-handoff/app/${{ matrix.app_name }}" "df-app/${{ matrix.app_name }}"
          ls -la test-framework/e2e/tests df-app "addon/${ADDON_WORKDIR}/test/mobile"

      - name: Upload to Device Farm
        id: upload
        uses: ./.github/actions/run-mobile-integration-tests/upload-to-devicefarm
        with:
          platform: ${{ matrix.platform }}
          addon-workdir: ${{ env.ADDON_WORKDIR }}
          app-path: ${{ github.workspace }}/df-app/${{ matrix.app_name }}
          app-type: ${{ matrix.app_type }}
          app-name: ${{ matrix.app_name }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          device-farm-project-arn: ${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN_LLAMACPP_EMBED }}
          enables-perf: 'false'

      - name: Schedule Device Farm test run
        id: schedule
        uses: ./.github/actions/run-mobile-integration-tests/schedule-test-run
        with:
          platform: ${{ matrix.platform }}
          device-farm-project-arn: ${{ secrets.AWS_DEVICE_FARM_PROJECT_ARN_LLAMACPP_EMBED }}
          android-device-pool-arn: ${{ secrets.ANDROID_DEVICE_POOL_ARN_LLAMACPP_EMBED }}
          ios-device-pool-arn: ${{ secrets.IOS_DEVICE_POOL_ARN_LLAMACPP_EMBED }}
          app-upload-arn: ${{ steps.upload.outputs.app-upload-arn }}
          test-package-upload-arn: ${{ steps.upload.outputs.test-package-upload-arn }}
          test-specs: ${{ steps.upload.outputs.test-specs }}
          scheduling-mode: 'single-pool'
          # Phase-1 cost cap (default is 120 device-min): js-create-double is
          # sub-second on device, and a launch-hang that never throws would NOT
          # trip integration-runtime.cjs's crash-to-failure handlers. Raise this
          # deliberately when the logger suite lands in phase 2.
          job-timeout-minutes: '15'

      - name: Monitor Device Farm test run
        id: monitor
        uses: ./.github/actions/run-mobile-integration-tests/monitor-test-run
        with:
          run-arns: ${{ steps.schedule.outputs.run-arns }}
          run-count: ${{ steps.schedule.outputs.run-count }}
          test-specs: ${{ steps.upload.outputs.test-specs }}

      - name: Cancel Device Farm runs on workflow cancellation
        if: cancelled() && steps.schedule.outputs.run-arns != '' && steps.schedule.outputs.run-arns != '[]'
        uses: ./.github/actions/run-mobile-integration-tests/cancel-device-farm-runs
        with:
          run-arns: ${{ steps.schedule.outputs.run-arns }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

      - name: Collect and upload Device Farm logs
        if: always() && !cancelled()
        uses: ./.github/actions/run-mobile-integration-tests/collect-and-upload-logs
        with:
          platform: ${{ matrix.platform }}
          addon-npm-name: 'inference-addon-cpp-mobile-tests'
          enables-perf: 'false'
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          run-arns: ${{ steps.schedule.outputs.run-arns }}

      - name: Comment results on PR
        if: always() && !cancelled()
        uses: ./.github/actions/run-mobile-integration-tests/comment-on-pr
        with:
          addon-npm-name: 'inference-addon-cpp-mobile-tests'
          platform: ${{ matrix.platform }}
          test-result: ${{ steps.monitor.outputs.test-result }}
          test-total: ${{ steps.monitor.outputs.test-total }}
          test-passed: ${{ steps.monitor.outputs.test-passed }}
          test-failed: ${{ steps.monitor.outputs.test-failed }}
          test-skipped: ${{ steps.monitor.outputs.test-skipped }}
          user-test-passed: ${{ steps.monitor.outputs.user-test-passed }}
          user-test-failed: ${{ steps.monitor.outputs.user-test-failed }}
