name: On Merge Trigger (Fabric)

on:
  push:
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/fabric/**"
      - ".github/workflows/*fabric*.yml"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish with"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - dev
          - feature
          - temp
          - latest
      npm_tag:
        description: "NPM dist-tag (default: latest). e.g. release-1.x"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: read
  packages: read
  id-token: write

jobs:
  publish-logic:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      publish_main: ${{ steps.logic.outputs.publish_main }}
      publish_release: ${{ steps.logic.outputs.publish_release }}
      publish_feature: ${{ steps.logic.outputs.publish_feature }}
      publish_tmp: ${{ steps.logic.outputs.publish_tmp }}
      gpr_tag: ${{ steps.logic.outputs.gpr_tag }}
    steps:
      - id: logic
        shell: bash
        run: |
          set -euo pipefail
          ref_name="${GITHUB_REF_NAME}"
          event_name="${GITHUB_EVENT_NAME}"

          publish_main="false"
          publish_release="false"
          publish_feature="false"
          publish_tmp="false"

          if [ "$event_name" = "push" ] || [ "$event_name" = "workflow_dispatch" ]; then
            if [ "$ref_name" = "main" ]; then
              publish_main="true"
            elif [[ "$ref_name" == release-* ]]; then
              publish_release="true"
            elif [[ "$ref_name" == feature-* ]]; then
              publish_feature="true"
            elif [[ "$ref_name" == tmp-* ]]; then
              publish_tmp="true"
            fi
          fi

          gpr_tag="dev"
          if [ "$ref_name" = "main" ]; then
            gpr_tag="dev"
          elif [[ "$ref_name" == feature-* ]]; then
            gpr_tag="feature"
          elif [[ "$ref_name" == tmp-* ]]; then
            gpr_tag="temp"
          fi

          echo "publish_main=$publish_main" >> "$GITHUB_OUTPUT"
          echo "publish_release=$publish_release" >> "$GITHUB_OUTPUT"
          echo "publish_feature=$publish_feature" >> "$GITHUB_OUTPUT"
          echo "publish_tmp=$publish_tmp" >> "$GITHUB_OUTPUT"
          echo "gpr_tag=$gpr_tag" >> "$GITHUB_OUTPUT"

  release-merge-guard:
    name: Release Merge Guard
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref_name, 'release-'))
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-merge-guard
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: ${{ github.ref_name }}
          base-sha: ${{ github.event.before }}
          head-sha: ${{ github.sha }}
          package-slug: fabric
          package-json-path: packages/fabric/package.json
          changelog-path: packages/fabric/CHANGELOG.md

  build:
    needs:
      - publish-logic
    if: >-
      (needs.publish-logic.outputs.publish_main == 'true' || needs.publish-logic.outputs.publish_release == 'true' || needs.publish-logic.outputs.publish_feature == 'true' || needs.publish-logic.outputs.publish_tmp == 'true')
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/prebuilds-fabric.yml
    secrets: inherit

  publish-gpr:
    needs: [build, publish-logic]
    if: >-
      needs.publish-logic.outputs.publish_main == 'true' || needs.publish-logic.outputs.publish_feature == 'true' || needs.publish-logic.outputs.publish_tmp == 'true'
    outputs:
      published_version: ${{ steps.publish.outputs.gpr_published_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PKG_DIR: packages/fabric
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download prebuild artifacts into package dir
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: prebuilds
          path: packages/fabric/prebuilds

      - name: Prepare platform packages
        shell: bash
        run: node packages/fabric/scripts/prepare-platform-packages.js packages/fabric/prebuilds packages/fabric/dist/platforms

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
          registry-url: https://npm.pkg.github.com/
          scope: "@tetherto"

      - name: Publish platform slices to GitHub Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPR_TAG: ${{ inputs.tag || needs.publish-logic.outputs.gpr_tag }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./packages/fabric/package.json').version")
          VERSION="${PACKAGE_VERSION}-tmp.runid-${GITHUB_RUN_ID}"
          echo "gpr_slice_version=$VERSION" >> "$GITHUB_ENV"
          for package in packages/fabric/dist/platforms/*; do
            node packages/fabric/scripts/rewrite-gpr-names.js --slice "$package" "$VERSION"
            NAME=$(node -e "console.log(require('./' + process.argv[1] + '/package.json').name)" "$package")
            if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "Skipping ${NAME}@${VERSION} (already published)"
              continue
            fi
            npm --prefix "$package" publish --tag "$GPR_TAG"
          done

      - name: Rewrite meta package optionalDependencies for GPR
        shell: bash
        run: node packages/fabric/scripts/rewrite-gpr-names.js --meta packages/fabric "$gpr_slice_version"

      - name: Publish to GitHub Package Registry
        id: publish
        uses: ./.github/actions/publish-library-to-gpr
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag || needs.publish-logic.outputs.gpr_tag }}
          workdir: packages/fabric
          name-suffix: "-mono"

  publish-npm:
    needs:
      - build
      - publish-logic
      - release-merge-guard
    if: >-
      (!cancelled() && needs.build.result == 'success' && needs.publish-logic.outputs.publish_release == 'true' && (needs.release-merge-guard.result == 'success' || needs.release-merge-guard.result == 'skipped'))
    outputs:
      published_version: ${{ steps.publish.outputs.npm_published_version }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      PKG_DIR: packages/fabric
    steps:
      - name: Validate npm_tag input
        if: inputs.npm_tag != ''
        shell: bash
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          if ! printf '%s' "$NPM_TAG" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'; then
            echo "::error::Invalid npm dist-tag '$NPM_TAG'. Must match ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ (e.g. release-1.x)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download prebuild artifacts into package dir
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: prebuilds
          path: packages/fabric/prebuilds

      - name: Prepare platform packages
        shell: bash
        run: node packages/fabric/scripts/prepare-platform-packages.js packages/fabric/prebuilds packages/fabric/dist/platforms

      - name: Publish platform packages before meta package
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: "24.14.1"
          registry-url: https://registry.npmjs.org/
          scope: "@qvac"

      - name: Publish platform slices
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/fabric/package.json').version")
          for package in packages/fabric/dist/platforms/*; do
            NAME=$(node -e "console.log(require('./' + process.argv[1] + '/package.json').name)" "$package")
            if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "Skipping ${NAME}@${VERSION} (already published)"
              continue
            fi
            args=(publish --provenance --access public)
            if [ -n "$NPM_TAG" ]; then args+=(--tag "$NPM_TAG"); fi
            npm --prefix "$package" "${args[@]}"
          done

      - name: Publish to NPM Package Registry
        id: publish
        uses: ./.github/actions/publish-library-to-npm
        with:
          tag: ${{ inputs.npm_tag }}
          workdir: packages/fabric

  publish-release:
    needs: [publish-npm]
    if: >-
      !cancelled() && needs.publish-npm.result == 'success' && needs.publish-npm.outputs.published_version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/create-release-tag.yml
    with:
      repo_name: "fabric"
      published_version: ${{ needs.publish-npm.outputs.published_version }}

  post-build-gate:
    name: Post-Build Gate
    runs-on: ubuntu-latest
    needs: [publish-gpr, publish-npm]
    if: "!cancelled()"
    outputs:
      should_run_tests: ${{ steps.gate.outputs.should_run_tests }}
    steps:
      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          should="false"

          if [ "${{ needs.publish-gpr.result }}" = "success" ] || \
             [ "${{ needs.publish-npm.result }}" = "success" ]; then
            should="true"
          fi

          echo "should_run_tests=$should" >> "$GITHUB_OUTPUT"
