name: QVAC-23195 S25 Candidate Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prebuild:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/prebuilds-llm-llamacpp.yml
    secrets: inherit
    with:
      repository: tetherto/qvac
      ref: ${{ github.sha }}

  s25-ocr:
    needs: prebuild
    permissions:
      contents: read
      packages: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/integration-mobile-test-llm-llamacpp.yml
    secrets: inherit
    with:
      repository: tetherto/qvac
      ref: ${{ github.sha }}
      platforms: Android
      test_groups: '[{"name":"ocrUnlimited","grep":"runOcrUnlimitedTest"}]'
      device_model: S25 Ultra
      device_manufacturer: Samsung
      device_model_operator: EQUALS
      job_timeout_minutes: 180
      per_test_timeout_minutes: "45"
