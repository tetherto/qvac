name: On PR Trigger (TTS)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    branches: [main, release-*, feature-*, tmp-*]
    paths:
      - "packages/qvac-lib-infer-onnx-tts/**"
      - ".github/workflows/*onnx-tts*.yml"

  workflow_dispatch:
    inputs:
      repository:
        description: "Repo to build (owner/name). Defaults to this repo."
        required: false
        type: string
      ref:
        description: "Git ref (branch/tag/SHA). Defaults to current ref."
        required: false
        type: string
      run_verify:
        description: "Treat this run like a 'verify' run (prebuild + integration)."
        required: false
        type: boolean
        default: true
      workdir:
        description: "Package working directory in monorepo."
        required: false
        type: string
        default: "packages/qvac-lib-infer-onnx-tts"

  workflow_call:
    inputs:
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      run_verify:
        required: false
        type: boolean
        default: true
      workdir:
        required: false
        type: string
        default: "packages/qvac-lib-infer-onnx-tts"

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      has_write: ${{ steps.perm.outputs.has-permission }}
    steps:
      - name: Check actor write permission
        id: perm
        uses: scherermichael-oss/action-has-permission@17f29510f1bf987b916c8cbb451566a56eed23f1
        with:
          required-permission: write
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check authorization
        id: check
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'safe-to-test') }}
          HAS_WRITE: ${{ steps.perm.outputs.has-permission }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "workflow_call" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$HAS_WRITE" = "1" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ "$AUTHOR_ASSOC" =~ ^(MEMBER|OWNER|COLLABORATOR)$ ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$HAS_LABEL" = "true" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::External fork PR without safe-to-test label — skipping"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  strip-label:
    needs: authorize
    if: |
      needs.authorize.outputs.has_write != '1' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Remove safe-to-test label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api -X DELETE "repos/${REPO}/issues/${PR_NUMBER}/labels/safe-to-test" 2>/dev/null || true
          echo "::warning::Removed safe-to-test label — new commits pushed. Re-review required."

  context:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    name: Resolve Context
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.ctx.outputs.repository }}
      ref: ${{ steps.ctx.outputs.ref }}
      base_sha: ${{ steps.ctx.outputs.base_sha }}
      head_sha: ${{ steps.ctx.outputs.head_sha }}
      run_verify: ${{ steps.ctx.outputs.run_verify }}
      workdir: ${{ steps.ctx.outputs.workdir }}
    steps:
      - id: ctx
        shell: bash
        run: |
          set -euo pipefail

          # Resolve workdir from inputs when available; otherwise default package path.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "workflow_call" ]]; then
            workdir="${{ inputs.workdir || 'packages/qvac-lib-infer-onnx-tts' }}"
            repo="${{ inputs.repository || github.repository }}"
            ref="${{ inputs.ref || github.ref_name }}"
            run_verify="${{ inputs.run_verify }}"
            base_sha="${{ github.sha }}"
            head_sha="${{ github.sha }}"
          else
            # pull_request_target
            workdir="packages/qvac-lib-infer-onnx-tts"
            repo="${{ github.repository }}"
            ref="${{ github.event.pull_request.head.sha }}"
            run_verify="${{ contains(github.event.pull_request.labels.*.name, 'verify') }}"
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          fi

          echo "repository=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "run_verify=$run_verify" >> "$GITHUB_OUTPUT"
          echo "workdir=$workdir" >> "$GITHUB_OUTPUT"

          echo "Resolved:"
          echo "  repo=$repo"
          echo "  ref=$ref"
          echo "  base_sha=$base_sha"
          echo "  head_sha=$head_sha"
          echo "  run_verify=$run_verify"
          echo "  workdir=$workdir"

  release-notes-check:
    needs: [authorize, context]
    if: needs.authorize.outputs.allowed == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-notes-check-qvac-lib-infer-onnx-tts.yml
    secrets: inherit
    with:
      repository: ${{ needs.context.outputs.repository }}
      ref: ${{ needs.context.outputs.ref }}
      workdir: ${{ needs.context.outputs.workdir }}

  sanity-checks:
    needs: [authorize, context]
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Run Sanity checks
        uses: tetherto/qvac-devops/.github/actions/sanity-checks@08479e5599445272d410398ff94f8e44991ddcb5  # monorepo_update
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          pat-token: ${{ secrets.PAT_TOKEN }}
          run-integration: ${{ needs.context.outputs.run_verify == 'true' }}
          workdir: ${{ needs.context.outputs.workdir }}

  cpp-lint:
    needs: [authorize, context]
    if: needs.authorize.outputs.allowed == 'true' && (needs.context.outputs.run_verify == 'true' || github.event_name == 'workflow_dispatch')
    uses: tetherto/qvac-devops/.github/workflows/cpp-lint.yaml@monorepo_update
    secrets: inherit
    with:
      sha: ${{ needs.context.outputs.base_sha }}
      pr_head_sha: ${{ needs.context.outputs.head_sha }}
      workdir: ${{ needs.context.outputs.workdir }}

  cpp-tests-coverage:
    needs: [authorize, context]
    if: needs.authorize.outputs.allowed == 'true' && (needs.context.outputs.run_verify == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/cpp-test-coverage-qvac-lib-infer-onnx-tts.yml
    secrets: inherit
    with:
      repository: ${{ needs.context.outputs.repository }}
      ref: ${{ needs.context.outputs.ref }}
      workdir: ${{ needs.context.outputs.workdir }}

  prebuild:
    needs: [authorize, context]
    if: needs.authorize.outputs.allowed == 'true' && (needs.context.outputs.run_verify == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/prebuilds-qvac-lib-infer-onnx-tts.yml
    secrets: inherit
    with:
      repository: ${{ needs.context.outputs.repository }}
      ref: ${{ needs.context.outputs.ref }}
      publish_target: "gpr"
      workdir: ${{ needs.context.outputs.workdir }}

  run-integration-tests:
    needs: [authorize, context, prebuild]
    if: needs.authorize.outputs.allowed == 'true' && (needs.context.outputs.run_verify == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/integration-test-qvac-lib-infer-onnx-tts.yml
    secrets: inherit
    with:
      repository: ${{ needs.context.outputs.repository }}
      ref: ${{ needs.context.outputs.ref }}
      workdir: ${{ needs.context.outputs.workdir }}

  run-mobile-integration-tests:
    needs: [authorize, context, prebuild]
    if: needs.authorize.outputs.allowed == 'true' && (needs.context.outputs.run_verify == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/integration-mobile-test-qvac-lib-infer-onnx-tts.yml
    secrets: inherit
    with:
      repository: ${{ needs.context.outputs.repository }}
      ref: ${{ needs.context.outputs.ref }}
      workdir: ${{ needs.context.outputs.workdir }}

  merge-guard:
    needs:
      [
        authorize,
        release-notes-check,
        sanity-checks,
        cpp-lint,
        cpp-tests-coverage,
        prebuild,
        run-integration-tests,
        run-mobile-integration-tests,
      ]
    if: always() && needs.authorize.outputs.allowed == 'true'
    uses: tetherto/qvac-devops/.github/workflows/public-pr.yml@monorepo_update
    with:
      sanity-checks-status: ${{ needs.sanity-checks.result == 'success' && needs.release-notes-check.result == 'success' && (needs.cpp-lint.result == 'success' || needs.cpp-lint.result == 'skipped') && (needs.cpp-tests-coverage.result == 'success' || needs.cpp-tests-coverage.result == 'skipped') }}
      build-status: ${{ needs.prebuild.result == 'success' || needs.prebuild.result == 'skipped' }}
      integration-tests-status: ${{ (needs.run-integration-tests.result == 'success' || needs.run-integration-tests.result == 'skipped') && (needs.run-mobile-integration-tests.result == 'success' || needs.run-mobile-integration-tests.result == 'skipped') }}
    secrets: inherit
