# Build-only workflow. Publishing is handled by on-merge-asr-ggml.yml
name: "Prebuilds (ASR GGML)"

on:
  workflow_dispatch:
    inputs:
      workdir:
        description: "Working directory for the package"
        type: string
        required: false
        default: "packages/asr-ggml"
  workflow_call:
    inputs:
      ref:
        description: "ref"
        type: string
      repository:
        type: string
        required: false
        default: "tetherto/qvac"
      workdir:
        description: "Working directory for the package"
        type: string
        required: false
        default: "packages/asr-ggml"

permissions:
  contents: read

jobs:
  prebuild:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/reusable-prebuilds.yml
    with:
      workdir: ${{ inputs.workdir }}
      ref: ${{ inputs.ref }}
      repository: ${{ inputs.repository }}
      artifact-name-prefix: asr-ggml-
      # Union of whisper's BLAS/FFTW set and parakeet/tts's x11/pkg-config set:
      # the merged addon links both engine libraries.
      linux-extra-packages: pkg-config libx11-dev libxcb1-dev libxkbcommon-dev libopenblas-dev liblapack-dev libfftw3-dev
      setup-python-on-windows: true
      include-vulkan-sdk: true
    secrets: inherit
