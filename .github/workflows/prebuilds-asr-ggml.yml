# Build-only workflow. Publishing is handled by on-merge-nx.yml.
name: "Prebuilds (ASR GGML)"

on:
  workflow_dispatch:
    inputs:
      sidecar-cuda-smoke:
        description: "Build Linux x64 only and verify CUDA inference under bare-sidecar on a GPU runner"
        type: boolean
        default: false
      workdir:
        description: "Working directory for the package"
        type: string
        required: false
        default: "packages/asr-ggml"
  workflow_call:
    inputs:
      ref:
        description: "ref"
        type: string
      repository:
        type: string
        required: false
        default: "tetherto/qvac"
      workdir:
        description: "Working directory for the package"
        type: string
        required: false
        default: "packages/asr-ggml"

permissions:
  contents: read

jobs:
  prebuild:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/reusable-prebuilds.yml
    with:
      workdir: ${{ inputs.workdir }}
      ref: ${{ inputs.ref }}
      repository: ${{ inputs.repository }}
      # Union of whisper's BLAS/FFTW set and parakeet/tts's x11/pkg-config set:
      # the merged addon links both engine libraries.
      linux-extra-packages: pkg-config libx11-dev libxcb1-dev libxkbcommon-dev libopenblas-dev liblapack-dev libfftw3-dev
      setup-python-on-windows: true
      verify-linux-module-cxx-runtime: true
      matrix-include: ${{ inputs.sidecar-cuda-smoke == true && '[{"os":"ubuntu-22.04","runner_key":"linux_ubuntu2204_x64","platform":"linux","arch":"x64"}]' || 'default' }}
    secrets: inherit

  smoke-runner:
    if: inputs.sidecar-cuda-smoke == true
    uses: ./.github/workflows/reusable-runner-names.yml
    secrets: inherit

  sidecar-cuda-smoke:
    if: inputs.sidecar-cuda-smoke == true
    needs: [prebuild, smoke-runner]
    runs-on: ${{ needs.smoke-runner.outputs.linux_ubuntu2404_x64_gpu }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 24
      # Use CUDA 13.0's runtime. CUDA 13.4's libcudart itself loads libstdc++,
      # which would hide the broken speech module's undefined runtime symbols.
      - uses: ./.github/actions/setup-cuda
      - name: Install addon dependencies and build JavaScript
        working-directory: packages/asr-ggml
        run: npm install --ignore-scripts && npm run build:ts
      - uses: ./.github/actions/prebuild-artifact-materialize
        with:
          workdir: packages/asr-ggml
          platform: linux
          arch: x64
      - name: Link the built platform package
        working-directory: packages/asr-ggml
        run: npm run link:platform
      - name: Stage Whisper tiny and bare-sidecar
        working-directory: packages/asr-ggml
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test/model "$RUNNER_TEMP/speech-sidecar"
          url=$(node -p 'require("./test/integration/whisper-models.manifest.json").models["ggml-tiny.bin"].urls[0]')
          sha=$(node -p 'require("./test/integration/whisper-models.manifest.json").models["ggml-tiny.bin"].sha256')
          curl --fail --location --retry 3 "$url" -o test/model/ggml-tiny.bin
          echo "$sha  test/model/ggml-tiny.bin" | sha256sum --check
          npm pack bare-sidecar@0.5.13 --pack-destination "$RUNNER_TEMP/speech-sidecar" --silent
          tar -xzf "$RUNNER_TEMP/speech-sidecar/bare-sidecar-0.5.13.tgz" -C "$RUNNER_TEMP/speech-sidecar"
      - name: Verify CUDA inference without a shared C++ runtime
        working-directory: packages/asr-ggml
        shell: bash
        env:
          # GGML probes Vulkan before CUDA. Mesa's ICDs would map libstdc++.
          VK_DRIVER_FILES: /nonexistent.json
          VK_ICD_FILENAMES: /nonexistent.json
        run: |
          set -euo pipefail
          node ../../.github/scripts/check-linux-module-cxx-runtime.mjs prebuilds/linux-x64
          "$RUNNER_TEMP/speech-sidecar/package/prebuilds/linux-x64/bare" \
            test/integration/sidecar-cuda-smoke.js test/model/ggml-tiny.bin test/mobile/testAssets/sample.raw
