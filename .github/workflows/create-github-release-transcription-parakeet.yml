name: Create GitHub Release (Parakeet)

on:
  workflow_call:
    inputs:
      published_version:
        description: "Version published in prebuild workflow"
        required: false
        type: string
      prev_sha:
        description: "Previous commit SHA for version comparison"
        required: false
        type: string
      workdir:
        description: "Working directory (optional)"
        required: false
        type: string
        default: "packages/transcription-parakeet"




# Canonical runner labels — .github/actions/runner-names/runners.yaml
env:
  RN_ORCH: ubuntu-latest
  RN_U22: ubuntu-22.04
  RN_U24: ubuntu-24.04
  RN_U22_ARM: ubuntu-22.04-arm
  RN_U24_ARM: ubuntu-24.04-arm
  RN_MAC14: macos-14
  RN_MAC14_XL: macos-14-xlarge
  RN_MAC15: macos-15
  RN_MAC15_INTEL: macos-15-intel
  RN_MAC15_LG: macos-15-large
  RN_MAC15_XL: macos-15-xlarge
  RN_WIN22: windows-2022
  RN_WIN25: windows-2025
  RN_QVAC_U22: qvac-ubuntu2204-x64
  RN_QVAC_U22_GPU: qvac-ubuntu2204-x64-gpu
  RN_QVAC_U24: qvac-ubuntu2404-x64
  RN_QVAC_U24_GPU: qvac-ubuntu2404-x64-gpu
  RN_QVAC_WIN25: qvac-win25-x64
  RN_QVAC_WIN25_GPU: qvac-win25-x64-gpu
  RN_AI_LINUX: ai-run-linux
  RN_AI_LINUX_GPU: ai-run-linux-gpu
  RN_AI_U22: ai-run-ubuntu-22.04
  RN_AI_WIN11_GPU: ai-run-windows11-gpu
  RN_GEN_WIN11: generator-windows11
  RN_MINI_M4: mac-mini-m4
  RN_MINI_M4_GPU: mac-mini-m4-gpu
  RN_LBL_U22_X64: ubuntu-22.04-x64
  RN_LBL_U22_X64_GPU: ubuntu-22.04-x64-gpu
  RN_LBL_U24_X64: ubuntu-24.04-x64
  RN_LBL_U24_X64_GPU: ubuntu-24.04-x64-gpu
  RN_LBL_U24_ARM64: ubuntu-24.04-arm64
  RN_LBL_WIN22_X64: windows-2022-x64
  RN_LBL_WIN25_X64: windows-2025-x64
  RN_LBL_WIN25_X64_GPU: windows-2025-x64-gpu

permissions:
  contents: write

jobs:
  publish-release:
    if: inputs.published_version != ''
    runs-on: ${{ env.RN_ORCH }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: version
        uses: ./.github/actions/detect-version-bump
        with:
          current_version: ${{ inputs.published_version }}
          prev_sha: ${{ inputs.prev_sha }}
          workdir: ${{ inputs.workdir }}

      - name: Verify Release Notes
        if: steps.version.outputs.bumped == 'true'
        working-directory: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          notes_path="release-notes/v${{ steps.version.outputs.current }}.md"
          if [ ! -s "${notes_path}" ]; then
            echo "Missing or empty release notes: ${notes_path}"
            exit 1
          fi

      - name: Create GitHub Release
        if: steps.version.outputs.bumped == 'true'
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # 2.6.1
        with:
          tag_name: v${{ steps.version.outputs.current }}
          name: QVAC Transcription Parakeet Addon v${{ steps.version.outputs.current }}
          body_path: ${{ inputs.workdir }}/release-notes/v${{ steps.version.outputs.current }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
