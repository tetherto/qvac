# Post-merge: regenerate docs on main when SDK changes, commit back to main.
# Keeps monorepo main in sync with generated docs. Triggered only on SDK changes.
name: Docs Post-Merge Sync

on:
  push:
    branches:
      - main
    paths:
      # Only run when SDK or docs source/generator change (other libs not automated yet)
      - 'packages/qvac-sdk/**'
      - 'docs/scripts/**'
      - 'docs/package.json'
      - 'docs/website/**'

# Prevent infinite loop: do not run when the push was from this workflow's bot commit.
# Bot commits use "[skip ci]" so GitHub won't trigger; this is a safety net.
concurrency:
  group: docs-post-merge-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Safeguard: skip if the push was from the docs bot (optional: set DOCS_SYNC_BOT_USER to bot username)
    if: ${{ !vars.DOCS_SYNC_BOT_USER || github.event.head_commit.author.username != vars.DOCS_SYNC_BOT_USER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (root)
        run: bun install --frozen-lockfile

      - name: Install dependencies (SDK)
        run: cd packages/qvac-sdk && bun install --frozen-lockfile

      - name: Install dependencies (docs)
        run: cd docs && bun install --frozen-lockfile

      - name: Generate docs
        run: npm run docs:generate

      - name: Check for doc changes (only doc output paths)
        id: changes
        run: |
          # Only stage and commit generated doc paths; never commit other files
          git add docs/website/content/docs/sdk/api/ docs/website/src/lib/versions.ts 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "has_doc_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_doc_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push generated docs
        if: steps.changes.outputs.has_doc_changes == 'true'
        env:
          BOT_NAME: ${{ vars.DOCS_SYNC_BOT_NAME || 'docs-sync-bot' }}
          BOT_EMAIL: ${{ vars.DOCS_SYNC_BOT_EMAIL || 'docs-sync-bot@users.noreply.github.com' }}
          # Use DOCS_SYNC_PAT if GITHUB_TOKEN cannot push (e.g. branch protection)
          TOKEN: ${{ secrets.DOCS_SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git commit -m "chore(docs): regenerate SDK API docs [skip ci]"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          git push origin main
