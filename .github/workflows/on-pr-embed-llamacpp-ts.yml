name: Embed TypeScript Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/embed-llamacpp/**"
      - ".github/workflows/*embed-llamacpp*.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  embed-pr-head-ts-checks:
    uses: ./.github/workflows/reusable-ts-checks.yml
    with:
      workdir: packages/embed-llamacpp
