name: General CI/CD
# This workflow is used to call the reusable workflows in the qvac-devops repository
# https://github.com/tetherto/qvac-devops/blob/production-workflows-tag/.github/workflows/public-reusable.yml
permissions:
  contents: write
  packages: write

name: General CI/CD (monorepo)

on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "packages/**"
  #     - ".github/trigger-reusable-lib.yml"

  # pull_request_target:
  #   types: [opened, reopened, synchronize, labeled]
  #   paths:
  #     - "packages/**"
  #     - ".github/**"

  workflow_dispatch:
    inputs:
      workdir:
        description: "Optional: force a single package workdir"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read  

jobs:
  detect:
    name: Detect changed packages
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # If manually dispatched with a workdir, skip detection and run only that package.
      - name: Manual override
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.workdir != '' }}
        shell: bash
        run: |
          set -euo pipefail
          wd="${{ inputs.workdir }}"
          wd="${wd%/}"

          # Safety rails: must be packages/<name>
          if [[ "$wd" != packages/* || "$wd" == *".."* || "$wd" == /* ]]; then
            echo "ERROR: invalid workdir: $wd" >&2
            exit 1
          fi
          if [[ ! -d "$wd" ]]; then
            echo "ERROR: directory does not exist: $wd" >&2
            exit 1
          fi

          echo 'matrix={"include":[{"workdir":"'"$wd"'"}]}' >> "$GITHUB_OUTPUT"

      - name: Detect changed files under packages/
        id: filter
        if: ${{ steps.manual.outputs.matrix == '' }}
        uses: dorny/paths-filter@v3
        with:
          filters: |
            packages:
              - 'packages/**'
          list-files: json  

      - name: Build matrix from changed files
        id: mk
        if: ${{ steps.manual.outputs.matrix == '' }}
        shell: bash
        run: |
          set -euo pipefail

          files='${{ steps.filter.outputs.packages_files }}'
          if [[ -z "$files" || "$files" == "[]" ]]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Turn changed files into unique "packages/<pkg>" dirs
          workdirs=$(
            echo "$files" \
              | jq -r '.[]' \
              | awk -F/ 'NF>=2 {print $1"/"$2}' \
              | sort -u \
              | jq -R -s -c 'split("\n")[:-1] | map({workdir: .})'
          )

          echo "Resolved workdirs: $workdirs"
          echo "matrix={\"include\":$workdirs}" >> "$GITHUB_OUTPUT"

  run:
    name: Run reusable workflow per package
    needs: detect
    if: ${{ fromJSON(needs.detect.outputs.matrix).include[0] != null }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}

    uses: ./.github/workflows/reusable-public-reusable.yml
    secrets: inherit
    with:
      workdir: ${{ matrix.workdir }}
