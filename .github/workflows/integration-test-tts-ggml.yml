name: Run Integration Tests (TTS GGML)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to test"
        type: string
        required: false
        default: main
      prebuild_package:
        description: "NPM package containing prebuilds (e.g. @qvac/tts-ggml@1.0.0)"
        required: false
        type: string
      run_integration_tests:
        description: "Run the regular integration suite"
        required: false
        type: boolean
        default: true
      run_rtf_benchmarks:
        description: "Run the RTF benchmark matrix (writes rtf-results-* artifacts)"
        required: false
        type: boolean
        default: false
      benchmark_matrix_json:
        description: "Optional JSON array overriding the desktop benchmark matrix"
        required: false
        type: string

  workflow_call:
    inputs:
      prebuild_package:
        description: "NPM package containing prebuilds (e.g. @qvac/tts-ggml@1.0.0)"
        type: string
        required: false
      ref:
        description: 'ref'
        type: string
      repository:
        type: string
      run_integration_tests:
        description: "Run the regular integration suite"
        type: boolean
        required: false
        default: true
      run_rtf_benchmarks:
        description: "Run the RTF benchmark matrix (writes rtf-results-* artifacts)"
        type: boolean
        required: false
        default: false
      benchmark_matrix_json:
        description: "Optional JSON array overriding the desktop benchmark matrix"
        type: string
        required: false
        default: ""
    outputs:
      # One entry per run-integration-tests matrix row, resolved through the
      # same runner_names outputs the matrix rows use (matrix.runner ||
      # matrix.os), so a runner-label rename cannot desynchronize the two.
      # benchmark-performance-tts-ggml.yml feeds this to the aggregator's
      # --expect-devices gate so a lane that loses its rtf-results artifact
      # fails the summarize job instead of silently shrinking the report.
      # Keep in step with the matrix `include` list below — the arity is
      # asserted by scripts/perf-report/__tests__/rtf-expected-devices-guard.test.js.
      rtf_expected_devices:
        description: "Comma-separated device labels every RTF benchmark matrix row reports as"
        value: ${{ format('{0},{1},{2},{3},{4},{5},{6}', jobs.runner_names.outputs.linux_ubuntu2204_x64_gpu, jobs.runner_names.outputs.linux_ubuntu2404_x64_gpu, jobs.runner_names.outputs.ubuntu_2604, jobs.runner_names.outputs.ubuntu_2404_arm, jobs.runner_names.outputs.macos_arm64_gpu, jobs.runner_names.outputs.macos_15_large, jobs.runner_names.outputs.win_2025_x64_gpu) }}

# Least-privilege default scoped to the whole file (CodeQL
# actions/missing-workflow-permissions).  Individual jobs widen this as
# needed; today the only job (run-integration-tests) explicitly requests
# contents:read + packages:read, both already covered here.
permissions:
  contents: read
  packages: read

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  # NOTE: continue-on-error: true mirrors the early-days landing posture
  # we use for parakeet's matching workflow.  The on-pr-tts-ggml.yml
  # merge-guard treats this job's `success || skipped` as a pass, so a
  # hard failure inside the integration suite does NOT block a merge —
  # only sanity-checks + cpp-lint + cpp-tests-coverage + prebuild really
  # gate today.  Tighten this gate (drop `continue-on-error` and/or
  # change merge-guard to require `success`) once the addon's flake
  # surface is small enough to make a hard gate cheap.
  run-integration-tests:
    needs: runner_names
    timeout-minutes: 120
    continue-on-error: false
    runs-on: ${{ matrix.runner || matrix.os }}
    environment: release
    name: ${{ matrix.os }}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.no_gpu != 'true' && '-gpu' || '' }}-integration-tests
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NO_GPU: ${{ matrix.no_gpu || 'false' }}
      # Pins the engine's GPU backend cascade on rows that name one; the
      # engine and the tests both treat empty as unset (default cascade).
      TTS_CPP_GPU_BACKEND: ${{ matrix.gpu_backend }}
    permissions:
      contents: read
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win32
            arch: x64
            runner: ${{ needs.runner_names.outputs.win_2025_x64 }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install NPM dependencies
        working-directory: ${{ github.workspace }}/packages/tts-ggml
        shell: pwsh
        run: |
          Get-Command node,npm,npm.cmd | Select-Object Name,Source,CommandType
          node --version
          npm.cmd --version
          npm.cmd config get loglevel
          npm.cmd install --loglevel=verbose --foreground-scripts --timing
          exit $LASTEXITCODE

      - name: Check original PowerShell npm invocation from a clean install
        working-directory: ${{ github.workspace }}/packages/tts-ggml
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force node_modules
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue
          npm install
          exit $LASTEXITCODE
