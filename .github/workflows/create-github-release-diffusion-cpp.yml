name: Create GitHub Release (Stable Diffusion)

on:
  workflow_call:
    inputs:
      published_version:
        description: "Version published in prebuild workflow"
        required: false
        type: string
      prev_sha:
        description: "Previous commit SHA for version comparison"
        required: false
        type: string
      release_name:
        description: "Human-readable release name"
        required: false
        type: string
        default: "QVAC Stable Diffusion Addon"
      workdir:
        description: "Working directory (optional)"
        required: false
        type: string
        default: "packages/diffusion-cpp"




# Canonical runner labels — .github/actions/runner-names/runners.yaml
env:
  RN_ORCH: ubuntu-latest
  RN_U22: ubuntu-22.04
  RN_U24: ubuntu-24.04
  RN_U22_ARM: ubuntu-22.04-arm
  RN_U24_ARM: ubuntu-24.04-arm
  RN_MAC14: macos-14
  RN_MAC14_XL: macos-14-xlarge
  RN_MAC15: macos-15
  RN_MAC15_INTEL: macos-15-intel
  RN_MAC15_LG: macos-15-large
  RN_MAC15_XL: macos-15-xlarge
  RN_WIN22: windows-2022
  RN_WIN25: windows-2025
  RN_QVAC_U22: qvac-ubuntu2204-x64
  RN_QVAC_U22_GPU: qvac-ubuntu2204-x64-gpu
  RN_QVAC_U24: qvac-ubuntu2404-x64
  RN_QVAC_U24_GPU: qvac-ubuntu2404-x64-gpu
  RN_QVAC_WIN25: qvac-win25-x64
  RN_QVAC_WIN25_GPU: qvac-win25-x64-gpu
  RN_AI_LINUX: ai-run-linux
  RN_AI_LINUX_GPU: ai-run-linux-gpu
  RN_AI_U22: ai-run-ubuntu-22.04
  RN_AI_WIN11_GPU: ai-run-windows11-gpu
  RN_GEN_WIN11: generator-windows11
  RN_MINI_M4: mac-mini-m4
  RN_MINI_M4_GPU: mac-mini-m4-gpu
  RN_LBL_U22_X64: ubuntu-22.04-x64
  RN_LBL_U22_X64_GPU: ubuntu-22.04-x64-gpu
  RN_LBL_U24_X64: ubuntu-24.04-x64
  RN_LBL_U24_X64_GPU: ubuntu-24.04-x64-gpu
  RN_LBL_U24_ARM64: ubuntu-24.04-arm64
  RN_LBL_WIN22_X64: windows-2022-x64
  RN_LBL_WIN25_X64: windows-2025-x64
  RN_LBL_WIN25_X64_GPU: windows-2025-x64-gpu

permissions:
  contents: write

jobs:
  publish-release:
    if: inputs.published_version != ''
    runs-on: ${{ env.RN_ORCH }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: version
        uses: ./.github/actions/detect-version-bump
        with:
          current_version: ${{ inputs.published_version }}
          prev_sha: ${{ inputs.prev_sha }}
          workdir: ${{ inputs.workdir }}

      - name: Verify release notes exist in CHANGELOG
        if: steps.version.outputs.bumped == 'true'
        id: changelog
        working-directory: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.current }}"
          changelog_path="CHANGELOG.md"
          release_notes_path="${RUNNER_TEMP}/release-notes-v${version}.md"

          if [ ! -s "${changelog_path}" ]; then
            echo "Missing or empty changelog: ${changelog_path}"
            exit 1
          fi

          start_line=$(awk -v version="${version}" '$0 ~ "^## \\[" version "\\]" { print NR; exit }' "${changelog_path}")
          if [ -z "${start_line}" ]; then
            echo "Could not find changelog heading for version ${version} in ${changelog_path}"
            exit 1
          fi

          end_line=$(awk -v start="${start_line}" 'NR > start && /^## \[/ { print NR - 1; found=1; exit } END { if (!found) print NR }' "${changelog_path}")
          if [ -z "${end_line}" ] || [ "${end_line}" -lt "${start_line}" ]; then
            echo "Invalid changelog section bounds for version ${version}"
            exit 1
          fi

          sed -n "$((start_line + 1)),$((end_line))p" "${changelog_path}" > "${release_notes_path}"

          if ! awk 'BEGIN { has_content=0 } /[^[:space:]]/ { has_content=1 } END { exit has_content ? 0 : 1 }' "${release_notes_path}"; then
            echo "Changelog section for version ${version} is empty"
            exit 1
          fi

          echo "release_notes_path=${release_notes_path}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        if: steps.version.outputs.bumped == 'true'
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # 2.6.1
        with:
          tag_name: diffusion-cpp-v${{ steps.version.outputs.current }}
          name: ${{ inputs.release_name }} v${{ steps.version.outputs.current }}
          body_path: ${{ steps.changelog.outputs.release_notes_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
