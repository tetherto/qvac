name: Reusable TypeScript Checks

on:
  workflow_call:
    inputs:
      workdir:
        description: Package directory to run the PR-head TypeScript checks in
        required: true
        type: string

permissions:
  contents: read

jobs:
  ts-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ inputs.workdir }}
        run: npm install --ignore-scripts --package-lock=false --registry=https://registry.npmjs.org/

      - name: Type declaration check
        working-directory: ${{ inputs.workdir }}
        run: npm run test:dts

      - name: Run lint
        working-directory: ${{ inputs.workdir }}
        run: npm run lint

      - name: Install Bare
        run: npm install --global --force bare --registry=https://registry.npmjs.org/

      - name: Run unit tests
        working-directory: ${{ inputs.workdir }}
        run: npm run test:unit --if-present
