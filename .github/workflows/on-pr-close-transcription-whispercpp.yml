# RETIRED FAMILY — dispatch-only cleanup stub.
#
# packages/transcription-whispercpp and the rest of its workflow family were
# retired when the addon was merged into packages/asr-ggml (@qvac/asr-ggml).
# This file survives on purpose: ephemeral `@tetherto/transcription-whispercpp-mono`
# PR versions published by the retired on-merge/prebuild lanes are still in GPR
# and must stay deletable from main during the cleanup window (QIP PR-2 note).
#
# The `pull_request` trigger is gone — nothing publishes those versions any more,
# and its `.github/workflows/*whispercpp*.yml` path glob also matched the live
# bci-whispercpp family. Delete this file in the post-release cleanup once the
# leaked -mono versions are purged.
name: On PR Close (Whispercpp) [retired — dispatch-only cleanup]

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Specific version to target for deletion"
        required: false
        type: string
      pr-number:
        description: "PR number to target for deletion"
        required: false
        type: string
      pattern:
        description: "Pattern to target for deletion"
        required: false
        type: string
      packages:
        description: "Packages to target for deletion, space separated"
        required: false
        type: string
        default: "transcription-whispercpp"
      dry-run:
        description: "Is dry run? If true, lists versions without deleting."
        type: boolean
        default: true

run-name: >-
  Delete NPM Versions (whispercpp, retired) v=${{ inputs.version }} pr=${{ inputs.pr-number }} dry=${{ inputs.dry-run }}

permissions:
  contents: read

jobs:
  print-context:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: |
          echo "Inputs Context: $INPUTS_CONTEXT"
        env:
          INPUTS_CONTEXT: ${{ toJSON(inputs) }}
      - run: |
          echo "GitHub Context: $GITHUB_CONTEXT"
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}

  delete-npm-versions-trigger:
    permissions:
      packages: write
    uses: ./.github/workflows/public-delete-npm-versions.yml
    with:
      version: ${{ inputs.version }}
      pr-number: ${{ inputs.pr-number }}
      pattern: ${{ inputs.pattern }}
      packages: ${{ inputs.packages || 'transcription-whispercpp' }}
      dry-run: ${{ inputs.dry-run }}
