# Deploy docs to staging on push to main when docs/website/** changes.
# main = staging environment. See docs/DOCS-DEPLOY-FLOW.md for the full strategy.
name: Docs Deploy Staging

on:
  push:
    branches:
      - main
    paths:
      - 'docs/website/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy-staging
  cancel-in-progress: true

defaults:
  run:
    working-directory: docs/website

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ !vars.DOCS_SYNC_BOT_USER || github.actor != vars.DOCS_SYNC_BOT_USER }}

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Create placeholder for generated API docs
        run: |
          mkdir -p content/docs/sdk/api/latest
          printf '%s\n' '---' 'title: API Reference' 'description: API Reference for the latest version of the QVAC SDK.' '---' > content/docs/sdk/api/latest/index.mdx

      - name: Build static site
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-staging-${{ github.sha }}
          path: docs/website/dist
          retention-days: 14

      # TODO: Replace with platform-specific deploy step once hosting is configured.
