name: Integration Tests (EMBED)

on:
  workflow_call:
    inputs:
      ref:
        description: "ref"
        type: string
      repository:
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to test"
        type: string
        required: false
        default: main
      prebuild_package:
        description: "NPM package containing prebuilds (e.g. @qvac/embed-llamacpp@1.0.0)"
        type: string
        required: true

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  run-integration-tests:
    needs: runner_names
    runs-on: ${{ matrix.runner || matrix.os }}
    environment: release
    # QVAC-23763: the -vulkan suffix only appears on the new Vulkan leg, so
    # every existing job keeps the exact name any required check refers to.
    name: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.force_vulkan == 'true' && '-vulkan' || '' }}-integration-tests
    permissions:
      contents: read
      packages: read

    env:
      WORKDIR: packages/embed-llamacpp

    strategy:
      fail-fast: false
      matrix:
        include:
          # Run Linux x64 tests on both Ubuntu 22.04 and 24.04 to ensure compatibility
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            runner: ${{ needs.runner_names.outputs.linux_ubuntu2204_x64_gpu }}
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            runner: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64_gpu }}
          # QVAC-23763: the qvac-ubuntu*-x64-gpu runners are NVIDIA, so the same
          # box covers both GPU backends. This entry is the Vulkan half; the one
          # above runs CUDA, now the default.
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            runner: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64_gpu }}
            force_vulkan: 'true'
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            runner: ${{ needs.runner_names.outputs.ubuntu_2204_arm }}
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            runner: ${{ needs.runner_names.outputs.ubuntu_2404_arm }}
          - os: macos-15-xlarge
            platform: darwin
            arch: arm64
            runner: ${{ needs.runner_names.outputs.macos_arm64_gpu }}
          - os: macos-15-large
            runner: ${{ needs.runner_names.outputs.macos_15_large }}
            platform: darwin
            arch: x64
          - os: windows-2025
            platform: win32
            arch: x64
            runner: ${{ needs.runner_names.outputs.win_2025_x64_gpu }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache integration test models
        id: model-cache
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/cache-models
        with:
          package: embed-llamacpp

      - name: Install NPM dependencies
        working-directory: ${{ env.WORKDIR }}
        run: |
          npm install
  
      - name: Install bare tooling
        run: npm install -g --force bare bare-make

      - name: Download prebuilds (from artifacts)
        if: ${{ !inputs.prebuild_package }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          path: ${{ env.WORKDIR }}/prebuilds
          merge-multiple: true

      - name: Download prebuilds from package (Linux/macOS)
        if: ${{ inputs.prebuild_package && matrix.platform != 'win32' }}
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          PACKAGE="${{ inputs.prebuild_package }}"
          echo "Downloading $PACKAGE from npm..."

          # Download package from npm with error handling
          if ! npm pack $PACKAGE; then
            echo "ERROR: Failed to download $PACKAGE from npm"
            echo "Please check that the package exists"
            exit 1
          fi

          # Extract the tarball
          tar -xzf *.tgz

          # Validate prebuilds directory exists
          if [ ! -d "package/prebuilds" ]; then
            echo "ERROR: No prebuilds directory found in package"
            echo "The downloaded package may not contain prebuilt binaries"
            exit 1
          fi

          # Move prebuilds to expected location
          mv package/prebuilds ./prebuilds

          # Cleanup
          rm -rf package *.tgz

          echo "Prebuilds downloaded from npm successfully"
          ls -la prebuilds/

      - name: Download prebuilds from package (Windows)
        if: ${{ inputs.prebuild_package && matrix.platform == 'win32' }}
        working-directory: ${{ env.WORKDIR }}
        shell: powershell
        run: |
          $PACKAGE = "${{ inputs.prebuild_package }}"

          echo "Downloading $PACKAGE from npm..."

          # Download package from npm with error handling
          npm pack $PACKAGE
          if ($LASTEXITCODE -ne 0) {
            echo "ERROR: Failed to download $PACKAGE from npm"
            echo "Please check that the package exists"
            exit 1
          }

          # Find the downloaded tarball
          $TARBALL = Get-ChildItem -Filter "*.tgz" | Select-Object -First 1 -ExpandProperty Name
          if (-not $TARBALL) {
            echo "ERROR: Could not find downloaded tarball"
            exit 1
          }

          echo "Extracting $TARBALL..."
          tar -xzf $TARBALL

          # Validate prebuilds directory exists
          if (-not (Test-Path "package/prebuilds")) {
            echo "ERROR: No prebuilds directory found in package"
            echo "The downloaded package may not contain prebuilt binaries"
            exit 1
          }

          # Move prebuilds to expected location
          Move-Item package/prebuilds ./prebuilds

          # Cleanup
          Remove-Item -Recurse -Force package
          Remove-Item $TARBALL

          echo "Prebuilds downloaded from npm successfully"
          Get-ChildItem prebuilds/

      - name: Print run state
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: |
          echo "node version: $(node -v)"
          echo "npm version: $(npm -v)"
          echo "bare version: $(bare -v)"
          echo "bare-make version: $(bare-make --version)"
          npm list
          npm config list
        continue-on-error: true

      - name: Print run state
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: |
          echo "node version: $(node -v)"
          echo "npm version: $(npm -v)"
          echo "bare version: $(bare -v)"
          echo "bare-make version: $(bare-make --version)"
          ls -la prebuilds || true
          tree prebuilds || true
        continue-on-error: true

      - name: Linux - install dependencies
        if: matrix.os == 'ubuntu-22.04-arm' || matrix.os == 'ubuntu-24.04-arm'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      # QVAC-23763: hide the CUDA devices for the Vulkan half of the NVIDIA
      # runner. This is a separate step because "Run integration test" below
      # declares no shell, so on win32 it runs under PowerShell where a bash
      # `if` is a parse error. llm and vla can guard inline because they already
      # split that step per platform; embed has one cross-platform step.
      # Skipping the step rather than writing an empty value matters: an EMPTY
      # CUDA_VISIBLE_DEVICES hides every CUDA device just as -1 does.
      - name: Force Vulkan on the NVIDIA runner
        if: ${{ matrix.force_vulkan == 'true' }}
        shell: bash
        run: |
          echo "hiding CUDA devices so the addon selects Vulkan"
          echo "CUDA_VISIBLE_DEVICES=-1" >> "$GITHUB_ENV"

      - name: Run integration test
        working-directory: ${{ env.WORKDIR }}
        run: |
          npm run test:integration ${{ matrix.platform }}-${{ matrix.arch }}

