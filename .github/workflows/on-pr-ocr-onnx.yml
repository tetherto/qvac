name: On PR Trigger (OCR)

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/ocr-onnx/**"
      - ".github/workflows/*ocr*.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Security Gate
  # ---------------------------------------------------------------------------
  authorize:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      has_write: ${{ steps.perm.outputs.has-permission }}
    steps:
      - name: Check actor write permission
        id: perm
        uses: scherermichael-oss/action-has-permission@136e061bfe093832d87f090dd768e14e27a740d3 # 1.0.6
        with:
          required-permission: write
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check authorization
        id: check
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'verify') }}
          HAS_WRITE: ${{ steps.perm.outputs.has-permission }}
        run: |
          # Allow manual dispatches and calls
          if [[ "$EVENT" == "workflow_dispatch" || "$EVENT" == "workflow_call" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Same-repo PRs are always trusted
          if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            echo "::notice::Same-repo PR — authorized"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::Actor '$GITHUB_ACTOR' has write-or-higher permission: $HAS_WRITE"

          # Actor with write (or higher) is trusted even when author_association is not MEMBER/COLLABORATOR.
          if [ "$HAS_WRITE" = "1" ]; then
            echo "::notice::Actor has write-or-higher permission — authorized"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Org members / collaborators (by author_association) are trusted even from forks
          if [[ "$AUTHOR_ASSOC" =~ ^(MEMBER|OWNER|COLLABORATOR)$ ]]; then
            echo "::notice::Trusted author ($AUTHOR_ASSOC) — authorized"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # External fork PRs require the verify label
          if [ "$HAS_LABEL" = "true" ]; then
            echo "::notice::Fork PR with verify label — authorized"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::External fork PR without verify label — skipping checks"
            echo "::warning::A team member must review the code and apply the 'verify' label"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Strip verify label on new pushes from external contributors.
  # Forces re-review before CI runs on updated code.
  # Event actors with repo write permission are not stripped (from authorize output).
  # ---------------------------------------------------------------------------
  strip-label:
    needs: authorize
    if: |
      needs.authorize.outputs.has_write != '1' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Log actor write permission check
        shell: bash
        run: |
          echo "::notice::Actor '${{ github.actor }}' has write-or-higher permission: ${{ needs.authorize.outputs.has_write }}"
      - name: Remove verify label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api -X DELETE \
            "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels/verify" \
            2>/dev/null || true
          echo "::warning::Removed verify label — new commits pushed. Re-review required."

  # ---------------------------------------------------------------------------
  # 3. Path Filter
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      pkg: ${{ steps.filter.outputs.pkg }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # 4.0.1
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            pkg:
              - "packages/ocr-onnx/**"
              - ".github/workflows/*ocr*.yml"

  # ---------------------------------------------------------------------------
  # 4. Execution Jobs (Gated by authorization AND path changes)
  # ---------------------------------------------------------------------------
  sanity-checks:
    needs: [authorize, changes]
    if: |
      needs.authorize.outputs.allowed == 'true' &&
      (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/packages/ocr-onnx/vcpkg/cache,readwrite"
      PKG_DIR: packages/ocr-onnx
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.PAT_TOKEN }}
          sparse-checkout: |
            packages/ocr-onnx
          fetch-depth: 0

      - name: Fetch PR head and target branch
        id: fetch_pr
        if: github.event_name == 'pull_request_target' || github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}
          git fetch origin ${{ github.event.pull_request.head.sha }}:refs/pr/head

      - name: Check PR Status with Target Branch
        continue-on-error: true
        id: target_branch_checks
        if: github.event_name == 'pull_request_target' || github.event_name == 'pull_request'
        run: |
          TARGET_SHA=${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}
          if ! git merge-base --is-ancestor "$TARGET_SHA" "$PR_HEAD_SHA"; then
            echo "::error title=PR is not up to date::This PR is not up to date with target branch"
          fi

      - name: Verify that yaml files are formatted
        id: yamlfmt
        uses: tetherto/qvac-devops/.github/actions/yamlfmt@monorepo_update
        continue-on-error: true

      - name: Check for disallowed dependencies
        id: check_dependencies
        continue-on-error: true
        working-directory: ${{ env.PKG_DIR }}
        run: |
          deps=$(jq -r '.dependencies, .devDependencies // {} | to_entries[] | .value' package.json)
          if echo "$deps" | grep -Eq '^(git\+https:\/\/github.com|[0-9]+\.[0-9]+\.[0-9]+-(dev|tmp)[^"]*)$'; then
            echo "::error title=Disallowed dependency detected::Do not use git URLs or dev/tmp versions in dependencies"
          fi

      - name: Run JavaScript tests
        id: run_js_tests
        continue-on-error: true
        uses: tetherto/qvac-devops/.github/actions/run-lint-and-unit-tests@monorepo_update
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
          gpr-token: ${{ secrets.GITHUB_TOKEN }}
          pat-token: ${{ secrets.GITHUB_TOKEN }}
          registry-type: gpr
          workdir: ${{ env.PKG_DIR }}

      - name: Check for errors
        run: |
          count=0
          if [ "${{ steps.run_js_tests.outcome }}" = "failure" ]; then
            echo "::error::Step - Lint or unit tests failed"
            count=$((count + 1))
          fi
          if [ "${{ steps.yamlfmt.outcome }}" = "failure" ]; then
            echo "::error::Step - Verify that yaml files are formatted failed"
            count=$((count + 1))
          fi
          if [ "${{ steps.check_dependencies.outcome }}" = "failure" ]; then
            echo "::error::Step - Check for disallowed dependencies failed"
            count=$((count + 1))
          fi
          if [ "${{ steps.target_branch_checks.outcome }}" = "failure" ]; then
            echo "::error::Step - Check PR Status with Target Branch failed"
            count=$((count + 1))
          fi
          if [ "${{ steps.fetch_pr.outcome }}" = "failure" ]; then
            echo "::error::Step - Fetch PR head and target branch failed"
            count=$((count + 1))
          fi
          if [ $count -gt 0 ]; then
            echo "::error::There were $count failed checks"
            exit 1
          fi

  cpp-lint:
    needs: [authorize, changes]
    if: |
      needs.authorize.outputs.allowed == 'true' &&
      (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')
    uses: tetherto/qvac-devops/.github/workflows/cpp-lint.yaml@monorepo_update
    secrets: inherit
    with:
      sha: ${{ github.event.pull_request.base.sha || github.sha }}
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      workdir: packages/ocr-onnx

  prebuild:
    needs: [authorize, changes]
    if: |
      needs.authorize.outputs.allowed == 'true' &&
      (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')
    uses: ./.github/workflows/prebuilds-ocr-onnx.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      ref: ${{ github.event.pull_request.head.ref || github.ref }}
      publish_target: "gpr"

  run-integration-tests:
    needs: [authorize, changes, prebuild]
    if: |
      needs.authorize.outputs.allowed == 'true' &&
      (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')
    uses: ./.github/workflows/integration-test-ocr-onnx.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      ref: ${{ github.event.pull_request.head.ref || github.ref }}

  run-mobile-integration-tests:
    needs: [authorize, changes, prebuild]
    if: |
      needs.authorize.outputs.allowed == 'true' &&
      (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')
    uses: ./.github/workflows/integration-mobile-test-ocr-onnx.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      ref: ${{ github.event.pull_request.head.ref || github.ref }}

  merge-guard:
    needs: [authorize, changes, sanity-checks, prebuild, run-integration-tests, run-mobile-integration-tests]
    if: always() && (needs.changes.outputs.pkg == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')
    uses: tetherto/qvac-devops/.github/workflows/public-pr.yml@monorepo_update
    with:
      sanity-checks-status: ${{ needs.sanity-checks.result == 'success' || needs.sanity-checks.result == 'skipped' }}
      build-status: ${{ needs.prebuild.result == 'success' || needs.prebuild.result == 'skipped' }}
      integration-tests-status: ${{ needs.run-integration-tests.result == 'success' || needs.run-integration-tests.result == 'skipped' }}
    secrets: inherit