# TEMPORARY (tmp-vla): thin dispatcher that delegates to on-pr-vla.yml so we
# can launch CI from this branch via `gh workflow run on-pr-ocr-onnx.yml`.
# Needed because on-pr-vla.yml is not yet registered on `main`, and GitHub's
# workflow_dispatch API requires the workflow file to exist on the default
# branch. The body below MUST be reverted to the real OCR pipeline (see the
# version on `main`) before merging tmp-vla into main.
name: On PR Trigger (OCR)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: read
  packages: read
  id-token: write

jobs:
  call-vla:
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/on-pr-vla.yml
    secrets: inherit
