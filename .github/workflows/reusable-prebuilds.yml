# Reusable prebuild workflow.
#
# Encapsulates the canonical prebuild matrix and step sequence shared by most
# qvac native packages. Callers wire it via `uses:` at the job level and
# pass `secrets: inherit` so the reusable can read PAT_TOKEN, AWS_OIDC_ROLE_ARN
# and MODEL_S3_BUCKET.
#
# Coverage today: bci-whispercpp, diffusion-cpp, embed-llamacpp,
# llm-llamacpp, nmtcpp, onnx, parakeet, tts-ggml,
# whispercpp. All prebuild workflows in the monorepo
# now route through this reusable.
name: "Prebuilds (reusable)"

on:
  workflow_call:
    inputs:
      workdir:
        description: "Package working directory under the monorepo"
        type: string
        required: true
      ref:
        description: "Git ref to checkout"
        type: string
        required: false
      repository:
        description: "Repository to checkout"
        type: string
        required: false
        default: "tetherto/qvac"
      # Artifact identity is DERIVED from the package (basename of `workdir`),
      # never passed in: per-leg artifacts are
      # `prebuild-<package>-<platform>-<arch><tags>` and the merged bundle is
      # `prebuilds-<package>`. The old hand-maintained `artifact-name-prefix`
      # table was not collision-free (embed-llamacpp and llm-llamacpp both
      # declared `llama-cpp-`; translation-nmtcpp declared nothing), and the
      # artifact service ACCEPTS duplicate names, so a shared name silently
      # produced two same-named artifacts and an ambiguous download.
      linux-extra-packages:
        description: "Extra apt packages to install on linux runners"
        type: string
        required: false
        default: ""
      mac-brew-packages:
        description: "Extra brew packages to install on macos runners"
        type: string
        required: false
        default: ""
      include-vulkan-sdk:
        description: "Run the setup-vulkan-sdk action before building"
        type: boolean
        required: false
        default: false
      include-rocm:
        description: >-
          Install the ROCm/HIP SDK (TheRock dist, gfx1151) on the linux-x64
          build so a consumer's qvac-fabric hip-backend feature cross-compiles
          libqvac-ggml-hip.so. No AMD GPU is needed on the runner (compile-only,
          like CUDA). Only affects the linux-x64 job; everything else is
          unchanged.
        type: boolean
        required: false
        default: false
      rocm-version:
        description: "TheRock ROCm dist tarball version used when include-rocm is set"
        type: string
        required: false
        default: "7.13.0"
      extra-cmake-defines:
        description: >-
          Additional cmake defines appended verbatim to `bare-make generate` on every matrix entry. Space-separated. Example: "-D VK_PROFILING=ON" to enable Vulkan profiling on the llamacpp packages.
        type: string
        required: false
        default: ""
      platform-cmake-defines:
        description: >-
          Platform-conditional cmake defines, one entry per line in `<platform>: <defines>` form. The matched platform's defines are appended after `extra-cmake-defines`, so they can override common defines if needed. Platforms without an entry contribute nothing. Example: #magic___^_^___line
            platform-cmake-defines: |
              darwin: -D WHISPER_USE_METAL=ON
              ios: -D WHISPER_USE_METAL=ON
              linux: -D WHISPER_USE_METAL=OFF
              android: -D WHISPER_USE_METAL=OFF
              win32: -D WHISPER_USE_METAL=OFF
        type: string
        required: false
        default: ""
      setup-python-on-windows:
        description: "Install Python 3.12 on Windows runners (some vcpkg ports need it)"
        type: boolean
        required: false
        default: false
      setup-rust-toolchain:
        description: >-
          Ensure a stable Rust toolchain plus the per-platform stdlib targets required by native crates that ship Rust code (iOS / Android via `rustup target add ...`). On Windows the action will bootstrap rustup itself if it isn't already on PATH.
        type: boolean
        required: false
        default: false
      reuse-workflow-file:
        description: >-
          When set (e.g. on-pr-nx.yml), enables cross-run prebuild reuse: on a
          PR push that did NOT touch this package's native files, a prior run's
          `prebuilds-<pkg>` artifact is downloaded and re-published instead of
          rebuilding. Empty disables reuse (dispatch / benchmark / on-merge
          always build fresh). Matches the legacy per-package on-pr behaviour.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Cross-run reuse gate (options: reuse-workflow-file). Per package: detect
  # whether this PR push touched the package's native tree; if not, find and
  # re-publish this PR's prior `prebuilds-<pkg>` artifact so the platform build
  # matrix below can be skipped entirely. No-op (reuse_hit stays empty) for
  # dispatch/push/benchmark/on-merge or when native files changed.
  detect-reuse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      reuse_hit: ${{ steps.reuse.outputs.reuse_hit }}
      native_hash: ${{ steps.detect.outputs.native_hash }}
    steps:
      - name: Resolve package name from workdir
        id: pkg
        shell: bash
        env:
          WORKDIR: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          name="$(basename "$WORKDIR")"
          if [ -z "$name" ] || [ "$name" = "." ] || [ "$name" = "/" ]; then
            echo "::error::Cannot derive a package name from workdir '$WORKDIR'."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Checkout (base) for reuse actions
        if: inputs.reuse-workflow-file != '' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - name: Detect native changes
        id: detect
        if: inputs.reuse-workflow-file != '' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
        uses: ./.github/actions/detect-native-changes
        with:
          workdir: ${{ inputs.workdir }}
      - name: Reuse prior prebuilds (no native change)
        id: reuse
        if: inputs.reuse-workflow-file != '' && steps.detect.outputs.native_changed == 'false'
        uses: ./.github/actions/prebuild-artifact-reuse
        with:
          github-token: ${{ github.token }}
          workflow-file: ${{ inputs.reuse-workflow-file }}
          native-hash: ${{ steps.detect.outputs.native_hash }}
          pr-number: ${{ github.event.pull_request.number }}
          artifact-name: prebuilds-${{ steps.pkg.outputs.name }}

  prebuild:
    needs: detect-reuse
    if: needs.detect-reuse.outputs.reuse_hit != 'true'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            runner: qvac-ubuntu2204-x64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - os: ubuntu-24.04
            platform: android
            arch: arm64
          - os: macos-15
            platform: ios
            arch: arm64
          - os: macos-15
            platform: ios
            arch: arm64
            tags: -simulator
            flags: --simulator
          - os: macos-15
            platform: ios
            arch: x64
            tags: -simulator
            flags: --simulator
          - os: macos-15
            platform: darwin
            arch: arm64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: windows-2025
            platform: win32
            arch: x64
            runner: qvac-win25-x64
    runs-on: ${{ matrix.runner || matrix.os }}
    environment: release
    name: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}

    env:
      WORKDIR: ${{ inputs.workdir }}

    steps:
      - name: Echo workflow inputs
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref || github.ref }}
          INPUT_REPO: ${{ inputs.repository || github.repository }}
          INPUT_WORKDIR: ${{ inputs.workdir }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_TAGS: ${{ matrix.tags }}
        run: |
          echo "Workflow inputs:"
          echo "Ref: $INPUT_REF"
          echo "Repository: $INPUT_REPO"
          echo "Workdir: $INPUT_WORKDIR"
          echo "Matrix platform: $MATRIX_PLATFORM"
          echo "Matrix arch: $MATRIX_ARCH"
          echo "Matrix tags: $MATRIX_TAGS"

      # Single source of truth for artifact identity: the per-leg name and the
      # merged bundle name both derive from this one value, so no caller
      # maintains a prefix and the two can never disagree.
      - name: Resolve package name from workdir
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          name="$(basename "$WORKDIR")"
          if [ -z "$name" ] || [ "$name" = "." ] || [ "$name" = "/" ]; then
            echo "::error::Cannot derive a package name from workdir '$WORKDIR'."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "package=$name"

      - name: Setup build host (Linux arm and macOS)
        if: runner.environment == 'github-hosted'
        uses: tetherto/qvac/.github/actions/setup-build-host@7671af404baf8de85fa61cf3e1908da1f0a8fcaf
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          linux-extra-packages: ${{ inputs.linux-extra-packages }}

      - name: Setup LLVM (Linux arm and macOS)
        if: runner.environment == 'github-hosted'
        uses: tetherto/qvac/.github/actions/setup-llvm@98a6a6b6e8f3866dfdd75052a4071269ce85dc41

      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup AWS + Windows CLI
        uses: tetherto/qvac/.github/actions/setup-aws-prebuild@2e2c94d66a50c8b8851824314e343ede5297eb1f
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}

      - name: Setup vcpkg
        uses: tetherto/qvac/.github/actions/setup-vcpkg@98990f3d11736a1ae88feddc514d14d78d7abdc7
        env:
          MODEL_S3_BUCKET: ${{ secrets.MODEL_S3_BUCKET }}
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}

      - name: Cleanup vcpkg
        shell: bash
        run: |
          rm -rf $VCPKG_ROOT/buildtrees/*
          rm -rf $VCPKG_ROOT/packages/*

      - if: ${{ matrix.os == 'windows-2025' }}
        name: Configure CMake generator on Windows
        shell: powershell
        env:
          INPUT_ARCH: ${{ matrix.arch }}
        run: |
          echo "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV
          switch ($env:INPUT_ARCH) {
            'x64'   { echo "CMAKE_GENERATOR_PLATFORM=x64"   >> $env:GITHUB_ENV }
            'arm64' { echo "CMAKE_GENERATOR_PLATFORM=ARM64" >> $env:GITHUB_ENV }
            'x86'   { echo "CMAKE_GENERATOR_PLATFORM=Win32" >> $env:GITHUB_ENV }
            default { Write-Host "Unknown arch '$env:INPUT_ARCH'; CMAKE_GENERATOR_PLATFORM left unset" }
          }

      - name: Setup Bare tooling
        uses: tetherto/qvac/.github/actions/setup-bare-tooling@8668ac46334eb595aa095c94b53322c557b1bc39
        with:
          shell_type: ${{ matrix.platform == 'win32' && 'powershell' || 'bash' }}

      - name: Setup Apple Clang
        uses: tetherto/qvac/.github/actions/setup-apple-clang@6e8d3c306a462a58589396cda428d65e015f0d8b

      - if: ${{ inputs.include-vulkan-sdk && (matrix.arch == 'arm64' || matrix.os == 'macos-15' || matrix.os == 'macos-15-intel') }}
        name: Setup Vulkan SDK (Linux ARM and MacOS)
        uses: tetherto/qvac/.github/actions/setup-vulkan-sdk@2e2c94d66a50c8b8851824314e343ede5297eb1f
        env:
          MODEL_S3_BUCKET: ${{ secrets.MODEL_S3_BUCKET }}
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          aws-role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-central-1

      - if: ${{ matrix.platform == 'linux' && matrix.arch == 'x64' }}
        name: Set Vulkan SDK path in Linux x64
        shell: bash
        run: |
          echo "VULKAN_SDK=/opt/vulkansdk/x86_64" >> "$GITHUB_ENV"

      - if: ${{ inputs.include-rocm && matrix.platform == 'linux' && matrix.arch == 'x64' }}
        name: Setup ROCm SDK for HIP cross-compile
        uses: ./.github/actions/setup-rocm
        with:
          rocm-version: ${{ inputs.rocm-version }}

      - if: ${{ inputs.include-vulkan-sdk && matrix.os == 'windows-2025' }}
        name: Set Vulkan SDK Path (Windows)
        run: |
          "VULKAN_SDK=C:\VulkanSDK" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=C:\VulkanSDK\Bin;$Env:PATH" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - if: ${{ inputs.mac-brew-packages != '' && startsWith(matrix.os, 'macos') }}
        name: Install extra brew packages on macOS
        shell: bash
        env:
          BREW_PACKAGES: ${{ inputs.mac-brew-packages }}
        run: |
          brew install --quiet $BREW_PACKAGES

      - name: Install npm dependencies
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: npm install

      - if: ${{ inputs.setup-rust-toolchain }}
        name: Setup Rust toolchain
        uses: tetherto/qvac/.github/actions/setup-rust-prebuild@1225268a5953ea733a30dad7d3d9581073fb03da
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}

      - name: Compute cmake defines
        shell: bash
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
          EXTRA_DEFINES: ${{ inputs.extra-cmake-defines }}
          PLATFORM_DEFINES_MAP: ${{ inputs.platform-cmake-defines }}
        run: |
          DEFINES="-D BUILD_TESTING=OFF"
          if [ "$MATRIX_PLATFORM" = "android" ]; then
            DEFINES="$DEFINES -D ANDROID_STL=c++_shared"
          fi
          if [ -n "$EXTRA_DEFINES" ]; then
            DEFINES="$DEFINES $EXTRA_DEFINES"
          fi
          if [ -n "$PLATFORM_DEFINES_MAP" ]; then
            LINE=$(echo "$PLATFORM_DEFINES_MAP" | grep -E "^[[:space:]]*${MATRIX_PLATFORM}[[:space:]]*:" || true)
            if [ -n "$LINE" ]; then
              VALUE="${LINE#*:}"
              VALUE="${VALUE#"${VALUE%%[![:space:]]*}"}"
              VALUE="${VALUE%"${VALUE##*[![:space:]]}"}"
              if [ -n "$VALUE" ]; then
                DEFINES="$DEFINES $VALUE"
              fi
            fi
          fi
          echo "DEFINES=$DEFINES" >> "$GITHUB_ENV"

      - name: Run bare-make generate
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: bare-make generate --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} ${{ matrix.flags }} $DEFINES

      - name: Dump vcpkg build logs on failure
        if: failure()
        shell: bash
        run: |
          LOG_DIR="${VCPKG_ROOT}/buildtrees"
          if [ -d "$LOG_DIR" ]; then
            for f in "$LOG_DIR"/*/{config,install,build}-*.log; do
              [ -f "$f" ] || continue
              echo "===== $f ====="
              tail -200 "$f"
              echo ""
            done
          else
            echo "vcpkg buildtrees not found at $LOG_DIR"
          fi

      - name: Run bare-make build
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: bare-make build

      - name: Run bare-make install
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: bare-make install

      - name: Strip static libraries (.a) from prebuilds (Linux / MacOS)
        if: matrix.os != 'windows-2025'
        working-directory: ${{ env.WORKDIR }}
        shell: bash
        run: |
          if [ ! -d prebuilds ]; then
            echo "prebuilds/ does not exist; skipping"
            exit 0
          fi
          MATCHES=$(find prebuilds -type f -name '*.a')
          if [ -z "$MATCHES" ]; then
            echo "No .a files found under prebuilds/"
            exit 0
          fi
          echo "Removing the following .a files:"
          echo "$MATCHES"
          find prebuilds -type f -name '*.a' -delete

      - name: Strip static libraries (.a) from prebuilds (Windows)
        if: matrix.os == 'windows-2025'
        working-directory: ${{ env.WORKDIR }}
        shell: powershell
        run: |
          # Check that prebuilds/ exists
          if (-not (Test-Path -Path "prebuilds" -PathType Container)) {
              Write-Output "prebuilds/ does not exist; skipping"
              exit 0
          }
          # Find all .a files under prebuilds/
          $matches = Get-ChildItem -Path "prebuilds" -Recurse -File -Filter "*.a"
          if (-not $matches) {
              Write-Output "No .a files found under prebuilds/"
              exit 0
          }
          Write-Output "Removing the following .a files:"
          $matches | ForEach-Object { Write-Output $_.FullName }
          # Delete them
          $matches | Remove-Item -Force

      - name: Smoke check (tmp-*) package name & prebuilds listing
        if: ${{ startsWith(github.ref, 'refs/heads/tmp-') || startsWith(github.ref_name, 'tmp-') || (inputs.ref != '' && (startsWith(inputs.ref, 'refs/heads/tmp-') || startsWith(inputs.ref, 'tmp-'))) }}
        shell: bash
        working-directory: ${{ env.WORKDIR }}
        run: |
          echo "package.json name (post-build): $(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).name)")"
          echo "prebuilds directory:"
          ls -la prebuilds || true
          find prebuilds -maxdepth 1 -type d -print || true

      - name: Strip debug symbols
        uses: tetherto/qvac/.github/actions/strip-prebuilds@6e8d3c306a462a58589396cda428d65e015f0d8b
        with:
          platform: ${{ matrix.platform }}
          workdir: ${{ env.WORKDIR }}

      # Static guard: fail the prebuild if the addon module is left with
      # unresolvable engine symbols (the @qvac/tts-ggml@0.2.1 ggml_backend_is_cpu
      # dlopen crash) -- caught here, off the artifact, before any device run.
      # Export-leak findings stay warnings during rollout (enforce-exports
      # defaults to false) until every ggml addon ships a symbols.map.
      - name: Verify prebuild symbols
        uses: tetherto/qvac/.github/actions/verify-prebuild-symbols@980912224ed17173caead9904e4fd02c939727a9
        with:
          platform: ${{ matrix.platform }}
          workdir: ${{ env.WORKDIR }}

      # Guards against regressing the static-runtime build: addons must link the
      # static MSVC runtime, so the shipped .bare/.dll must not import the dynamic
      # Visual C++ runtime (vcruntime140.dll / msvcp140.dll / ucrtbase.dll / the
      # api-ms-win-crt-* UCRT forwarders). Re-introducing msvcrt.lib or a
      # dynamic-CRT vcpkg triplet would make these appear and fail the build.
      - name: Verify no dynamic C/C++ runtime dependency (Windows)
        if: matrix.platform == 'win32'
        working-directory: ${{ env.WORKDIR }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path -Path "prebuilds" -PathType Container)) {
            Write-Error "prebuilds/ does not exist; nothing to verify"
            exit 1
          }

          # Prefer dumpbin on PATH; otherwise locate it via vswhere (installed
          # alongside the MSVC build tools that the vcpkg build already requires).
          # -prerelease covers VS preview installs, and the filesystem fallback
          # covers Build Tools instances the VS installer never registered
          # (both seen on the self-hosted qvac-win25-x64 fleet after the VS
          # 2026 rollout, where vswhere returns nothing yet the build works).
          $dumpbin = (Get-Command dumpbin -ErrorAction SilentlyContinue).Source
          if (-not $dumpbin) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $dumpbin = & $vswhere -latest -prerelease -products * -find "**\dumpbin.exe" | Select-Object -First 1
            }
          }
          if (-not $dumpbin) {
            $roots = @("${env:ProgramFiles(x86)}\Microsoft Visual Studio", "${env:ProgramFiles}\Microsoft Visual Studio")
            foreach ($root in $roots) {
              if (Test-Path $root) {
                $found = Get-ChildItem -Path $root -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match 'Hostx64\\x64' } |
                  Sort-Object FullName -Descending | Select-Object -First 1
                if ($found) { $dumpbin = $found.FullName; break }
              }
            }
          }
          if (-not $dumpbin) {
            Write-Error "dumpbin.exe not found (checked PATH, vswhere, and Visual Studio install roots)"
            exit 1
          }
          Write-Output "Using dumpbin: $dumpbin"

          # Dynamic C/C++ runtime import names that must never appear.
          $forbidden = 'vcruntime\d', 'msvcp\d', 'msvcr\d', 'msvcrt\.dll', 'ucrtbase', 'api-ms-win-crt', 'concrt\d'

          $binaries = Get-ChildItem -Path "prebuilds" -Recurse -File -Include *.bare, *.dll
          if (-not $binaries) {
            Write-Error "No .bare/.dll binaries found under prebuilds/"
            exit 1
          }

          $violations = @()
          foreach ($bin in $binaries) {
            $deps = & $dumpbin /nologo /dependents $bin.FullName
            foreach ($pattern in $forbidden) {
              foreach ($hit in ($deps | Select-String -Pattern $pattern)) {
                $violations += "{0} -> {1}" -f $bin.FullName, $hit.Line.Trim()
              }
            }
            Write-Output ("checked: {0}" -f $bin.FullName)
          }

          if ($violations.Count -gt 0) {
            Write-Output "::error::Dynamic C/C++ runtime dependency detected in Windows prebuilds:"
            $violations | ForEach-Object { Write-Output $_ }
            exit 1
          }

          Write-Output "OK: no dynamic C/C++ runtime dependency in Windows prebuilds"

      # Name carries the package, so two packages building in the same run can
      # never land on the same artifact name. Content stays FLAT
      # (<platform>-<arch>/), which is what the runtime resolves and what the
      # published tarball must contain, so no consumer has anything to strip.
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: prebuild-${{ steps.pkg.outputs.name }}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
          path: ${{ env.WORKDIR }}/prebuilds

  merge:
    runs-on: ubuntu-latest
    needs: [prebuild, detect-reuse]
    # Skipped on a reuse hit (the reuse action already re-published
    # prebuilds-<pkg>); otherwise runs once the platform builds succeed.
    if: always() && needs.detect-reuse.outputs.reuse_hit != 'true' && needs.prebuild.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout reuse action (for marker save)
        if: inputs.reuse-workflow-file != '' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: .github/actions/prebuild-artifact-save
          sparse-checkout-cone-mode: false

      # Same derivation as the build job — the package is the single source of
      # truth for artifact identity on both sides.
      - name: Resolve package name from workdir
        id: pkg
        shell: bash
        env:
          WORKDIR: ${{ inputs.workdir }}
        run: |
          set -euo pipefail
          name="$(basename "$WORKDIR")"
          if [ -z "$name" ] || [ "$name" = "." ] || [ "$name" = "/" ]; then
            echo "::error::Cannot derive a package name from workdir '$WORKDIR'."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Pattern-scoped to THIS package's legs. Downloading everything (the old
      # behaviour) folded in unrelated artifacts, and in a multi-package run it
      # raced: each package's merge picked up whatever existed at that moment,
      # including the other package's merged bundle.
      - name: Download this package's build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: prebuild-${{ steps.pkg.outputs.name }}-*
          path: prebuilds
          merge-multiple: true

      - name: Upload merged artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: prebuilds-${{ steps.pkg.outputs.name }}
          path: prebuilds

      # Tag this run so a later no-native-change push of the same PR can reuse
      # the prebuilds-<pkg> just uploaded. native_hash is per-package, so the
      # marker name is unique per package within the run.
      - name: Save prebuild reuse marker
        if: inputs.reuse-workflow-file != '' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && needs.detect-reuse.outputs.native_hash != ''
        uses: ./.github/actions/prebuild-artifact-save
        with:
          native-hash: ${{ needs.detect-reuse.outputs.native_hash }}
          pr-number: ${{ github.event.pull_request.number }}
