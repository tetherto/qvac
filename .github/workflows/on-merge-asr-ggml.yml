name: On Merge Trigger (ASR GGML)

on:
  push:
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/asr-ggml/**"
      - ".github/workflows/*asr-ggml*.yml"

  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish with"
        required: false
        default: "dev"
        type: choice
        options:
          - latest
          - dev
      npm_tag:
        description: "NPM dist-tag (default: latest). e.g. release-1.x"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: read
  packages: read
  id-token: write

jobs:
  publish-logic:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      publish_main: ${{ steps.logic.outputs.publish_main }}
      publish_release: ${{ steps.logic.outputs.publish_release }}
      publish_feature: ${{ steps.logic.outputs.publish_feature }}
      publish_tmp: ${{ steps.logic.outputs.publish_tmp }}
      gpr_tag: ${{ steps.logic.outputs.gpr_tag }}
    steps:
      - id: logic
        uses: tetherto/qvac-actions/npm-publish-logic@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0

  release-merge-guard:
    name: Release Merge Guard
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref_name, 'release-'))
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-merge-guard
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          base-ref: ${{ github.ref_name }}
          base-sha: ${{ github.event.before }}
          head-sha: ${{ github.sha }}
          package-slug: asr-ggml
          package-json-path: packages/asr-ggml/package.json
          changelog-path: packages/asr-ggml/CHANGELOG.md

    # Build prebuilds (build + merge only, no publishing)
  build:
    needs:
      - publish-logic
    if: >-
      (needs.publish-logic.outputs.publish_main == 'true' || needs.publish-logic.outputs.publish_release == 'true' || needs.publish-logic.outputs.publish_feature == 'true' || needs.publish-logic.outputs.publish_tmp == 'true')
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/prebuilds-asr-ggml.yml
    secrets: inherit
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.ref }}
      workdir: "packages/asr-ggml"

  verify-generated:
    permissions:
      contents: read
    uses: ./.github/workflows/verify-generated-wrappers.yml
    with:
      workdir: packages/asr-ggml

  # continue-on-error stays true (matches the tts-ggml template), but the
  # FIRST-ever publish of @tetherto/asr-ggml-mono must be manually verified —
  # a silent GPR failure on a brand-new package name would otherwise go
  # unnoticed (QIP PR-1 note).
  publish-gpr:
    needs: [build, publish-logic, verify-generated]
    if: >-
      needs.verify-generated.result == 'success' &&
      (needs.publish-logic.outputs.publish_main == 'true' || needs.publish-logic.outputs.publish_feature == 'true' || needs.publish-logic.outputs.publish_tmp == 'true')
    continue-on-error: true
    runs-on: ubuntu-latest
    outputs:
      published_version: ${{ steps.capture_version.outputs.published_version }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Download prebuild artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: prebuilds
          path: packages/asr-ggml/prebuilds

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 20

      - name: Rename prebuild files from qvac_ to tetherto_ prefix
        working-directory: packages/asr-ggml
        run: |
          find prebuilds -depth -name 'qvac_*' | while read -r file; do
            dir=$(dirname "$file")
            base=$(basename "$file")
            newbase=$(echo "$base" | sed 's/^qvac_/tetherto_/')
            mv "$file" "$dir/$newbase"
          done

          if [ -f binding.js ]; then
            sed -i 's/qvac_/tetherto_/g' binding.js
          fi

      - name: Publish to GitHub Package Registry
        id: publish
        uses: ./.github/actions/publish-library-to-gpr
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag || needs.publish-logic.outputs.gpr_tag }}
          workdir: packages/asr-ggml
          name-suffix: "-mono"

      - name: Capture published version
        id: capture_version
        if: success()
        working-directory: packages/asr-ggml
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_NAME_GPR=$(echo "$PACKAGE_NAME" | sed 's/@qvac/@tetherto/')
          if npm view "${PACKAGE_NAME_GPR}@${VERSION}" version --registry=https://npm.pkg.github.com/ >/dev/null 2>&1; then
            echo "published_version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

  publish-npm:
    needs:
      - build
      - publish-logic
      - release-merge-guard
      - verify-generated
    if: >-
      needs.verify-generated.result == 'success' &&
      ((!cancelled() && needs.build.result == 'success' && needs.publish-logic.outputs.publish_release == 'true' && (needs.release-merge-guard.result == 'success' || needs.release-merge-guard.result == 'skipped')))
    runs-on: ubuntu-latest
    environment: npm
    outputs:
      published_version: ${{ steps.capture_version.outputs.published_version }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Validate npm_tag input
        if: inputs.npm_tag != ''
        shell: bash
        run: |
          tag="${{ inputs.npm_tag }}"
          if ! echo "$tag" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'; then
            echo "::error::Invalid npm dist-tag '$tag'. Must match ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ (e.g. release-1.x)"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Download prebuild artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: prebuilds
          path: packages/asr-ggml/prebuilds

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 20

      - name: Determine dist-tag
        id: dist-tag
        uses: tetherto/qvac-actions/npm-dist-tag-determination@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
        with:
          workdir: packages/asr-ggml
          tag: ${{ inputs.npm_tag || 'latest' }}

      # Move each prebuilds/<host> dir into a per-platform package and inject
      # the version-locked optionalDependencies into the meta package.json, so
      # the meta tarball published below ships JS only.
      - name: Slice platform packages
        run: node scripts/ci/slice-platform-packages.mjs --workdir packages/asr-ggml --out-dir "${{ runner.temp }}/platform-packages"

      - name: Set up Node.js for platform package publish
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: "24.14.1"
          registry-url: https://registry.npmjs.org/
          scope: "@qvac"

      # Platform packages publish first and the meta last: no npm transaction
      # exists, so meta-last guarantees the name consumers depend on never
      # appears without its binaries.
      - name: Publish platform packages to NPM Package Registry
        shell: bash
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: |
          set -euo pipefail
          for dir in "${{ runner.temp }}/platform-packages"/*/; do
            NAME=$(node -p "require('${dir}package.json').name")
            VERSION=$(node -p "require('${dir}package.json').version")
            # Idempotency guard: skip only on a confirmed hit, publish only on a
            # confirmed miss (E404 or the empty-output form npm uses for a
            # missing version). Any other npm view failure is a registry or
            # network error; publishing blind would 403 on an immutable version
            # and abort the release before the meta ships.
            set +e
            VIEW_OUT=$(npm view "${NAME}@${VERSION}" version 2>&1)
            VIEW_RC=$?
            set -e
            VIEW_TRIMMED=$(printf '%s' "$VIEW_OUT" | tr -d '[:space:]')
            if [ "$VIEW_RC" -eq 0 ] && [ -n "$VIEW_TRIMMED" ]; then
              echo "${NAME}@${VERSION} already on npm, skipping"
              continue
            fi
            if [ "$VIEW_RC" -ne 0 ] && ! printf '%s' "$VIEW_OUT" | grep -q 'E404'; then
              echo "::error title=npm view failed::Could not query ${NAME}@${VERSION} (exit ${VIEW_RC}); refusing to publish blind. Re-run after the registry recovers." >&2
              printf '%s\n' "$VIEW_OUT" >&2
              exit 1
            fi
            echo "Publishing ${NAME}@${VERSION} with tag ${DIST_TAG}"
            (cd "$dir" && npm publish --tag "$DIST_TAG" --access public --provenance)
          done

      - name: Publish to NPM Package Registry
        id: publish
        uses: tetherto/qvac-actions/publish-library-to-npm@096b1cfbd1d95399ae64d37f55cc16fd7a43314e # 0.4.0
        with:
          tag: ${{ steps.dist-tag.outputs.tag }}
          workdir: packages/asr-ggml

      - name: Capture published version
        id: capture_version
        if: success()
        working-directory: packages/asr-ggml
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "published_version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

  # Tag the published version (no GitHub Release; SDK-only releases policy)
  create-tag:
    needs: [publish-npm]
    if: >-
      !cancelled() && needs.publish-npm.result == 'success' && needs.publish-npm.outputs.published_version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/create-release-tag.yml
    with:
      repo_name: "asr-ggml"
      published_version: ${{ needs.publish-npm.outputs.published_version }}

  post-build-gate:
    name: Post-Build Gate
    runs-on: ubuntu-latest
    needs: [publish-gpr, publish-npm]
    if: "!cancelled()"
    outputs:
      should_run_tests: ${{ steps.gate.outputs.should_run_tests }}
    steps:
      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          should="false"

          if [ "${{ needs.publish-npm.result }}" = "success" ] || \
             [ "${{ needs.publish-gpr.result }}" = "success" ]; then
            should="true"
          fi

          echo "should_run_tests=$should" >> "$GITHUB_OUTPUT"

  integration-tests:
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/integration-test-asr-ggml.yml
    needs:
      - post-build-gate
    if: (needs.post-build-gate.outputs.should_run_tests == 'true')
    secrets: inherit
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.sha }}

  mobile-integration-tests:
    uses: ./.github/workflows/integration-mobile-test-asr-ggml.yml
    needs:
      - post-build-gate
    if: (needs.post-build-gate.outputs.should_run_tests == 'true')
    permissions:
      contents: read
      packages: read
      pull-requests: write
      id-token: write
    secrets: inherit
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.sha }}
