name: "prebuilds (Qvac-lib-infer-whispercpp)"

on:
  push:
    branches: [main]
    paths:
      - "packages/qvac-lib-infer-whispercpp/**"

  workflow_dispatch:
    inputs:
      repository:
        description: "Repo to build (owner/name). Defaults to this repo."
        required: false
        type: string
      ref:
        description: "Git ref (branch/tag/SHA). Defaults to current ref."
        required: false
        type: string
      workdir:
        description: "Monorepo package dir"
        required: false
        type: string
        default: "packages/qvac-lib-infer-whispercpp"
      tag:
        description: "Tag to publish with ('latest' by default)"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - dev
      publish_target:
        description: "Where to publish (npm or gpr)"
        type: string
        required: false
        default: ""
      tar-run-id:
        description: "Optional tar run id (kept for compatibility)"
        type: string
        required: false
        default: "on-mlc-whisper"

  workflow_call:
    inputs:
      ref:
        description: "ref"
        type: string
        required: false
      repository:
        type: string
        required: false
        # monorepo default
        default: "tetherto/qvac"
      workdir:
        description: "Monorepo package dir"
        type: string
        required: false
        default: "packages/qvac-lib-infer-whispercpp"
      tar-run-id:
        type: string
        required: false
        default: "on-mlc-whisper"
      tag:
        description: "Tag to publish"
        type: string
        required: false
        default: "dev"
      publish_target:
        description: "Where to publish (npm or gpr)"
        type: string
        required: false
        default: ""
    outputs:
      published_version:
        description: "The version that was published"
        value: ${{ jobs.publish-gpr.outputs.published_version || jobs.publish-npm.outputs.published_version }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  prebuild:
    permissions:
      contents: write
      pull-requests: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ai-run-linux-gpu
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: ubuntu-24.04
            platform: android
            arch: arm64
            flags: -D ANDROID_STL=c++_shared
          - os: macos-14
            platform: ios
            arch: arm64
          - os: macos-14
            platform: ios
            arch: arm64
            tags: -simulator
            flags: --simulator
          - os: macos-14
            platform: ios
            arch: x64
            tags: -simulator
            flags: --simulator
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: macos-15
            platform: darwin
            arch: x64
          - os: windows-2022
            platform: win32
            arch: x64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}

    env:
      # monorepo: keep cache under package dir to avoid cross-package collisions
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/${{ inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp' }}/vcpkg/cache,readwrite"
      VCPKG_BUILD_TYPE: release

    steps:
      - if: ${{ matrix.platform == 'android' }}
        name: Select NDK
        run: |
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - if: ${{ startsWith(matrix.os, 'ubuntu') || matrix.os == 'ai-run-linux-gpu' }}
        name: Maximize build space
        run: |
          sudo docker image prune --all --force
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/dotnet

      - name: Echo workflow inputs
        shell: bash
        run: |
          echo "Workflow inputs:"
          echo "Tag: ${{ inputs.tag || github.event.inputs.tag }}"
          echo "Ref: ${{ inputs.ref || github.event.inputs.ref || github.ref }}"
          echo "Repository: ${{ inputs.repository || github.event.inputs.repository || github.repository }}"
          echo "Workdir: ${{ inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp' }}"
          echo "Matrix platform: ${{ matrix.platform }}"
          echo "Matrix arch: ${{ matrix.arch }}"
          echo "Matrix tags: ${{ matrix.tags }}"

      - if: ${{ matrix.os == 'windows-2022' }}
        name: Configure windows runner
        run: |
          git config --system core.longpaths true
          choco upgrade llvm
          choco install ccache -y

      - if: ${{ matrix.os == 'windows-2022' }}
        name: Configure ccache on Windows
        shell: bash
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache -z
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV

      - if: ${{ matrix.os == 'windows-2022' }}
        name: Get ccache cache (Windows)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ccache
          key: ccache-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles(format('{0}/vcpkg.json', inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp')) }}
          restore-keys: |
            ccache-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.ref || github.event.inputs.ref || github.ref }}
          repository: ${{ inputs.repository || github.event.inputs.repository || github.repository }}

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Configure scoped registry for @tetherto and @qvac packages
        env:
          GPR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_PAT: ${{ secrets.PAT_TOKEN }}
        shell: bash
        run: |
          echo "Configuring scoped registry for @tetherto and @qvac packages..."
          set -eu
          cd "${{ inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp' }}"
          echo "Writing .npmrc for dual registry install…"
          cat > .npmrc <<NPMRC
          always-auth=true
          registry=https://registry.npmjs.org/
          @qvac:registry=https://registry.npmjs.org/
          @tetherto:registry=https://npm.pkg.github.com/
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          //npm.pkg.github.com/:_authToken=${GIT_PAT}
          NPMRC

          # Optional: make private git deps work without prompting
          if [ -n "${GIT_PAT:-}" ]; then
            git config --global url."https://${GIT_PAT}:@github.com/".insteadOf "https://github.com/"
            git config --global url."https://${GIT_PAT}:@github.com/".insteadOf "ssh://git@github.com/"
            git config --global url."https://${GIT_PAT}:@github.com/".insteadOf "git@github.com:"
          else
            git config --global url."https://${{ github.token }}:@github.com/".insteadOf "https://github.com/"
            git config --global url."https://${{ github.token }}:@github.com/".insteadOf "ssh://git@github.com/"
            git config --global url."https://${{ github.token }}:@github.com/".insteadOf "git@github.com:"
          fi

      - name: Install global dependencies
        run: |
          npm install -g bare bare-make

      - if: ${{ matrix.os == 'windows-2022' && matrix.arch == 'arm64' }}
        name: Rename win sdk folder to disable it
        run: |
          Rename-Item -Path "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0" -NewName "C:\Program Files (x86)\Windows Kits\10\Include\old-10.0.26100.0"
          Rename-Item -Path "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0" -NewName "C:\Program Files (x86)\Windows Kits\10\bin\old-10.0.26100.0"
          Rename-Item -Path "C:\Program Files (x86)\Windows Kits\10\Lib\10.0.26100.0" -NewName "C:\Program Files (x86)\Windows Kits\10\Lib\old-10.0.26100.0"

      - if: ${{ startsWith(matrix.os, 'macos') }}
        name: Install vcpkg in macos
        run: |
          cd ..
          git clone --branch 2025.12.12 --single-branch https://github.com/microsoft/vcpkg.git
          cd vcpkg && ./bootstrap-vcpkg.sh -disableMetrics
          VCPKG_ROOT=$(pwd)
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV
          echo "$VCPKG_ROOT" >> $GITHUB_PATH

      - if: ${{ startsWith(matrix.os, 'ubuntu') }}
        name: Configure vcpkg in linux (standard runner)
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

      - if: ${{ matrix.os == 'ai-run-linux-gpu' }}
        name: Install vcpkg on GPU runner
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip unzip tar
          cd ..
          git clone --branch 2025.12.12 --single-branch https://github.com/microsoft/vcpkg.git
          cd vcpkg && ./bootstrap-vcpkg.sh -disableMetrics
          VCPKG_ROOT=$(pwd)
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV
          echo "$VCPKG_ROOT" >> $GITHUB_PATH

      - if: ${{ matrix.os == 'windows-2022' }}
        name: Configure vcpkg in windows
        run: echo ("VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" -replace '\\', '/') >> $env:GITHUB_ENV

      - if: ${{ matrix.os == 'windows-2022' }}
        name: Configure cmake generator in windows
        run: echo "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV

      - if: ${{ matrix.os == 'windows-2022' && matrix.arch == 'x64' }}
        run: echo "CMAKE_GENERATOR_PLATFORM=x64" >> $env:GITHUB_ENV

      - if: ${{ matrix.os == 'windows-2022' && matrix.arch == 'x86' }}
        run: echo "CMAKE_GENERATOR_PLATFORM=Win32" >> $env:GITHUB_ENV

      - if: ${{ matrix.os == 'windows-2022' && matrix.arch == 'arm64' }}
        run: echo "CMAKE_GENERATOR_PLATFORM=ARM64" >> $env:GITHUB_ENV

      - if: ${{ matrix.os == 'windows-2022' }}
        name: Disable parallel configuration for Visual Studio generator
        run: echo "VCPKG_CMAKE_CONFIGURE_OPTIONS=--no-parallel-configure" >> $env:GITHUB_ENV

      - if: ${{ startsWith(matrix.os, 'macos') }}
        name: Disable parallel configuration for Apple toolchains
        run: echo "VCPKG_CMAKE_CONFIGURE_OPTIONS=--no-parallel-configure" >> $GITHUB_ENV

      - if: ${{ startsWith(matrix.os, 'ubuntu') || matrix.os == 'ai-run-linux-gpu' }}
        name: Update c++ tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          sudo chmod 644 /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19 all

      - if: ${{ startsWith(matrix.os, 'ubuntu') || matrix.os == 'ai-run-linux-gpu' }}
        name: Install ccache on Linux
        run: sudo apt-get install -y ccache

      - if: ${{ startsWith(matrix.os, 'macos') }}
        name: Install ccache on macOS
        run: brew install ccache

      - if: ${{ matrix.os != 'windows-2022' }}
        name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache -z
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV

      - if: ${{ matrix.os != 'windows-2022' }}
        name: Get ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}-${{ hashFiles(format('{0}/vcpkg.json', inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp')) }}
          restore-keys: |
            ccache-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}-
            ccache-${{ matrix.platform }}-${{ matrix.arch }}-

      - if: ${{ matrix.platform == 'linux' }}
        name: Install required packages linux
        run: |
          sudo apt-get install -y libxi-dev libxtst-dev libxrandr-dev
          sudo apt-get install -y libopenblas-dev liblapack-dev libfftw3-dev
          sudo apt-get install -y vulkan-tools libvulkan-dev vulkan-utility-libraries-dev spirv-tools

      - if: ${{ matrix.platform == 'linux' }}
        name: Install system dependencies for Vulkan
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxrandr-dev libxcb1-dev libxkbcommon-dev

      - if: ${{ startsWith(matrix.os, 'macos') }}
        name: Install whisper dependencies for macOS
        run: |
          brew install --quiet openblas lapack fftw

      - if: ${{ matrix.os == 'ubuntu-24.04' && matrix.arch == 'arm64' }}
        name: Install tooling for cross compilation - ubuntu arm64
        run: sudo apt-get install gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross lld

      - if: ${{ matrix.platform == 'android' }}
        name: Configure runner for cross compilation - android
        run: |
          echo "ANDROID_TOOLCHAIN_ROOT=$(echo $ANDROID_NDK_HOME)/toolchains/llvm/prebuilt/linux-x86_64" >> $GITHUB_ENV
          echo "ANDROID_NATIVE_API_LEVEL=34" >> $GITHUB_ENV

      - name: Install npm dependencies
        working-directory: ${{ inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp' }}
        run: npm install

      - name: Create vcpkg cache location
        working-directory: ${{ inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp' }}
        run: mkdir -p vcpkg/cache

      - name: Get vcpkg cache
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ (inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp') }}/vcpkg/cache
          key: vcpkg-v2-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}-${{ hashFiles(format('{0}/vcpkg.json', inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp'), format('{0}/vcpkg-configuration.json', inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp'), format('{0}/vcpkg/ports/**', inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp')) }}
          restore-keys: |
            vcpkg-v2-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}-
            vcpkg-v2-${{ matrix.platform }}-${{ matrix.arch }}-

      - name: Run bare-make generate
        shell: bash
        working-directory: ${{ inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp' }}
        run: |
          # Configure whisper.cpp specific flags
          WHISPER_USE_METAL="${{ (matrix.platform == 'darwin' || matrix.platform == 'ios') && 'ON' || 'OFF' }}"
          WHISPER_FLAGS="-D WHISPER_USE_METAL=${WHISPER_USE_METAL} -D WHISPER_USE_CUDA=OFF -D WHISPER_USE_OPENVINO=OFF"
          bare-make generate --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} ${{ matrix.flags }} $WHISPER_FLAGS

      - name: Run bare-make build
        shell: bash
        working-directory: ${{ inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp' }}
        run: |
          bare-make build

      - name: Run bare-make install
        shell: bash
        working-directory: ${{ inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp' }}
        run: |
          bare-make install

      - name: Show ccache stats
        run: ccache -s

      - uses: actions/upload-artifact@v4
        with:
          name: whisper-cpp-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
          path: ${{ inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp' }}/prebuilds

  merge:
    runs-on: ubuntu-latest
    needs: prebuild
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: prebuilds
          merge-multiple: true

      - name: Replicate android artifacts
        shell: bash
        run: |
          tree prebuilds/android-* || true
          mkdir -p prebuilds/android-arm prebuilds/android-ia32 prebuilds/android-x64
          cp -rv prebuilds/android-arm64/* prebuilds/android-arm/ || true
          cp -rv prebuilds/android-arm64/* prebuilds/android-x64/ || true
          cp -rv prebuilds/android-arm64/* prebuilds/android-ia32/ || true

      - name: Upload merged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilds
          path: prebuilds

  publish-gpr:
    needs: [prebuild, merge]
    if: ${{ inputs.publish_target == 'gpr' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.publish_target == '') }}
    continue-on-error: true
    outputs:
      published_version: ${{ steps.publish.outputs.npm_published_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.ref || github.event.inputs.ref || github.ref }}
          repository: ${{ inputs.repository || github.event.inputs.repository || github.repository }}

      - name: Download prebuild artifacts into package dir
        uses: actions/download-artifact@v4
        with:
          name: prebuilds
          path: ${{ inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp' }}/prebuilds

      - name: Rename prebuild files from qvac_ to tetherto_ prefix
        shell: bash
        working-directory: ${{ inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp' }}
        run: |
          set -euo pipefail

          # Rename prebuild files and directories from qvac_ prefix to tetherto_
          find prebuilds -depth -name 'qvac_*' | while read -r file; do
            dir=$(dirname "$file")
            base=$(basename "$file")
            newbase=$(echo "$base" | sed 's/^qvac_/tetherto_/')
            mv "$file" "$dir/$newbase"
          done

          # Update module name in binding.js to match renamed prebuilds
          if [ -f binding.js ]; then
            sed -i.bak 's/qvac_/tetherto_/g' binding.js || true
            rm -f binding.js.bak || true
          fi

      - name: Publish to GitHub Package Registry
        id: publish
        uses: tetherto/qvac-devops/.github/actions/publish-library-to-gpr@monorepo_update
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag || github.event.inputs.tag || 'dev' }}
          workdir: ${{ inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp' }}

  publish-npm:
    needs: [prebuild, merge]
    if: ${{ inputs.publish_target == 'npm' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_target == '') }}
    continue-on-error: true
    outputs:
      published_version: ${{ steps.publish.outputs.npm_published_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.ref || github.event.inputs.ref || github.ref }}
          repository: ${{ inputs.repository || github.event.inputs.repository || github.repository }}

      - name: Download prebuild artifacts into package dir
        uses: actions/download-artifact@v4
        with:
          name: prebuilds
          path: ${{ inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp' }}/prebuilds

      - name: Publish to NPM Package Registry
        id: publish
        uses: tetherto/qvac-devops/.github/actions/publish-library-to-npm@monorepo_update
        with:
          secret-token: ${{ secrets.NPM_TOKEN }}
          tag: 'latest'
          workdir: ${{ inputs.workdir || github.event.inputs.workdir || 'packages/qvac-lib-infer-whispercpp' }}
