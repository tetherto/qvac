name: Create GitHub Release

on:
  workflow_call:
    inputs:
      repo_name:
        description: "Short repository name for tag prefix (e.g., 'llamacpp-llm', 'tts-ggml')"
        required: true
        type: string
      release_name:
        description: "Display name for the release (e.g., 'QVAC LLM Addon')"
        required: true
        type: string
      published_version:
        description: "Version published in prebuild workflow"
        required: false
        type: string
      prev_sha:
        description: "Previous commit SHA for version comparison"
        required: false
        type: string
      workdir:
        description: "Working directory (package path in monorepo)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-release:
    if: inputs.published_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          fetch-depth: 0

      - name: Verify release notes exist in CHANGELOG
        id: changelog
        uses: ./.github/actions/verify-changelog-notes
        with:
          changelog-path: ${{ inputs.workdir }}/CHANGELOG.md
          version: ${{ inputs.published_version }}

      - name: Prepend Table of Contents to release notes
        run: node .github/scripts/prepend-release-toc.mjs "${{ steps.changelog.outputs.release-notes-path }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # 3.0.2
        with:
          tag_name: ${{ inputs.repo_name }}-v${{ inputs.published_version }}
          name: ${{ inputs.release_name }} v${{ inputs.published_version }}
          body_path: ${{ steps.changelog.outputs.release-notes-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
