name: On PR Trigger (nx)

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Historical ABot-World job to replay
        type: choice
        required: true
        options: [parity, incident]

permissions:
  contents: read
  actions: read

concurrency:
  group: qvac-28085-abot-replay-${{ inputs.scenario }}
  cancel-in-progress: false

jobs:
  replay-abot:
    if: github.repository == 'tetherto/qvac' && github.ref == 'refs/heads/codex/qvac-28085-gpu-replay'
    name: ABot-World replay (${{ inputs.scenario }})
    runs-on: ${{ inputs.scenario == 'parity' && 'qvac-ubuntu2204-x64-gpu' || 'qvac-ubuntu2404-x64-gpu' }}
    timeout-minutes: 100
    env:
      SCENARIO: ${{ inputs.scenario }}
      SOURCE_SHA: ${{ inputs.scenario == 'parity' && '79b92451443daaa27f1ba29e3b3d7caec56ccf08' || 'd348b80271676e323501a196ab0f00ac8a674dc0' }}
      RESULTS_DIR: q28085-results-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout replay instrumentation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: q28085-tools
          sparse-checkout: .github/scripts/qvac-28085
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout historical source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: q28085-source
          sparse-checkout: |
            packages/diffusion-cpp
            scripts/ci
          persist-credentials: false

      - name: Download the original run prebuild
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.scenario == 'parity' && 'prebuilds-diffusion-cpp' || 'prebuild-diffusion-cpp-linux-x64' }}
          run-id: ${{ inputs.scenario == 'parity' && '42182330190' || '42193566046' }}
          github-token: ${{ github.token }}
          path: q28085-source/packages/diffusion-cpp/prebuilds

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'

      - name: Install isolated replay dependencies and link the prebuild
        shell: bash
        run: |
          npm install --prefix "$GITHUB_WORKSPACE/q28085-runtime" --no-audit --no-fund bare-runtime-linux-x64@1.38.0 @qvac/infer-base@0.8.0 @qvac/logging@0.1.0 @qvac/registry-client@0.6.1 bare-path@3 bare-fs@4 bare-crypto@1 bare-zlib@1 bare-process@4 bare-subprocess@6 bare-os@3 bare-url@2 bare-https@3 brittle@3.19.1 b4a@1.6.7
          python3 q28085-tools/.github/scripts/qvac-28085/link.py
          node q28085-source/scripts/ci/slice-platform-packages.mjs --link-local --workdir "$GITHUB_WORKSPACE/q28085-source/packages/diffusion-cpp"

      - name: Run historical assertions and instrumented replay
        shell: bash
        run: |
          python3 -m unittest discover -s q28085-tools/.github/scripts/qvac-28085 -p 'test_*.py'
          python3 q28085-tools/.github/scripts/qvac-28085/replay.py "$SCENARIO" q28085-source/packages/diffusion-cpp q28085-runtime/node_modules/bare-runtime-linux-x64/bin/bare "$RESULTS_DIR"

      - name: Retain the diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qvac-28085-abot-${{ inputs.scenario }}-${{ github.run_id }}
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: warn
          retention-days: 14
