name: Run Integration Tests (AudioGen GGML)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to test"
        type: string
        required: false
        default: main
      prebuild_package:
        description: "NPM package containing prebuilds (e.g. @qvac/audiogen-ggml@0.1.0)"
        required: false
        type: string
      run_integration_tests:
        description: "Run the integration suite"
        required: false
        type: boolean
        default: true
      run_rtf_benchmarks:
        description: "Run the RTF benchmark matrix (writes rtf-results-* artifacts)"
        required: false
        type: boolean
        default: false
      benchmark_matrix_json:
        description: "Optional JSON array overriding the desktop benchmark matrix"
        required: false
        type: string

  workflow_call:
    inputs:
      prebuild_package:
        description: "NPM package containing prebuilds (e.g. @qvac/audiogen-ggml@0.1.0)"
        type: string
        required: false
      ref:
        description: "ref"
        type: string
        required: false
      repository:
        type: string
        required: false
      run_integration_tests:
        description: "Run the integration suite"
        type: boolean
        required: false
        default: true
      run_rtf_benchmarks:
        description: "Run the RTF benchmark matrix (writes rtf-results-* artifacts)"
        type: boolean
        required: false
        default: false
      benchmark_matrix_json:
        description: "Optional JSON array overriding the desktop benchmark matrix"
        type: string
        required: false
        default: ""

# Least-privilege default scoped to the whole file (CodeQL
# actions/missing-workflow-permissions). The single job below only reads the
# repo and packages.
permissions:
  contents: read
  packages: read

jobs:
  runner_names:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-runner-names.yml

  # NOTE: continue-on-error: true mirrors the early-days landing posture the
  # sibling addons use (tts-ggml / parakeet). The on-pr-audiogen-ggml.yml
  # merge-guard treats this job's `success || skipped` as a pass, so a flake in
  # the generation suite does NOT block a merge yet. Tighten this gate (drop
  # `continue-on-error`) once the addon's flake surface is small enough.
  run-integration-tests:
    needs: runner_names
    # The benchmark leg sweeps three DiT variants (and doubles that on a GPU
    # runner) with multi-minute renders each, so it needs far more headroom than
    # the functional suite.
    timeout-minutes: ${{ inputs.run_rtf_benchmarks && 360 || 120 }}
    continue-on-error: true
    runs-on: ${{ matrix.runner || matrix.os }}
    environment: release
    name: ${{ matrix.os }}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.no_gpu != 'true' && '-gpu' || '' }}-integration-tests
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NO_GPU: ${{ matrix.no_gpu || 'false' }}
      # The linux GPU self-hosted runners' shared npm cache holds root-owned
      # files, so every npm invocation dies with EACCES before tests start.
      # A per-job cache sidesteps the poisoned directory until the runner is
      # repaired (sudo chown -R on /opt/shared-cache/npm).
      npm_config_cache: ${{ runner.temp }}/npm-cache
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux GPU runners exercise the published Vulkan desktop backend.
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            runner: ${{ needs.runner_names.outputs.linux_ubuntu2204_x64_gpu }}
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            runner: ${{ needs.runner_names.outputs.linux_ubuntu2404_x64_gpu }}
          - os: ubuntu-26.04
            runner: ${{ needs.runner_names.outputs.ubuntu_2604 }}
            platform: linux
            arch: x64
            no_gpu: 'true'
          - os: ubuntu-24.04-arm
            runner: ${{ needs.runner_names.outputs.ubuntu_2404_arm }}
            platform: linux
            arch: arm64
            no_gpu: 'true'
          - os: macos-26
            runner: ${{ needs.runner_names.outputs.macos_arm64_gpu }}
            platform: darwin
            arch: arm64
          - os: macos-15-large
            runner: ${{ needs.runner_names.outputs.macos_15_large }}
            platform: darwin
            arch: x64
            no_gpu: 'true'
          - os: windows-2025
            platform: win32
            arch: x64
            runner: ${{ needs.runner_names.outputs.win_2025_x64_gpu }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install NPM dependencies
        working-directory: ${{ github.workspace }}/packages/audiogen-ggml
        run: npm install

      - name: Install bare tooling
        run: npm install -g --force bare bare-make

      - run: mkdir -p "${{ runner.temp }}/audiogen-ggml"
        shell: bash
      - run: mkdir -p "${{ github.workspace }}/packages/audiogen-ggml/prebuilds"
        shell: bash

      - name: Download prebuilds from artifact
        if: ${{ !inputs.prebuild_package }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          path: ${{ runner.temp }}/audiogen-ggml
          merge-multiple: true

      - if: ${{ !inputs.prebuild_package }}
        shell: bash
        run: cp -r "${{ runner.temp }}/audiogen-ggml"/* "${{ github.workspace }}/packages/audiogen-ggml/prebuilds"

      - name: Download prebuilds from package
        if: ${{ inputs.prebuild_package }}
        working-directory: ${{ runner.temp }}/audiogen-ggml
        shell: bash
        run: |
          npm pack ${{ inputs.prebuild_package }}
          tar -xzf *.tgz
          cp -r ./package/prebuilds/* "${{ github.workspace }}/packages/audiogen-ggml/prebuilds"

      - name: Rename prebuilds from tetherto_ to qvac_ prefix
        if: ${{ inputs.prebuild_package }}
        working-directory: ${{ github.workspace }}/packages/audiogen-ggml
        shell: bash
        run: |
          find prebuilds -depth -name 'tetherto_*' | while read -r file; do
            dir=$(dirname "$file")
            base=$(basename "$file")
            newbase=$(echo "$base" | sed 's/^tetherto_/qvac_/')
            mv "$file" "$dir/$newbase"
          done

      - name: Linux - install dependencies
        if: matrix.arch == 'arm64' && (matrix.platform == 'linux' || matrix.platform == 'android')
        shell: bash
        run: |
          sudo apt-get update
          # libgomp1 / libomp5 - GNU + LLVM OpenMP runtimes the ggml-speech CPU
          #   backend links against (clang -fopenmp under our linux-clang
          #   toolchain); the arm64 CPU backend ships as per-microarch MODULE .so
          #   files and fails to load without them.
          # libblas3 - runtime BLAS soname required by the Linux prebuilds.
          # mesa-vulkan-drivers - a software Vulkan ICD so the Vulkan-enabled
          #   prebuild's backend probe has a device to enumerate (the no_gpu
          #   entries force useGPU=false regardless).
          sudo apt-get install -y libgomp1 libomp5 libblas3 mesa-vulkan-drivers

      - if: ${{ matrix.os == 'windows-2025' }}
        name: Set Vulkan SDK Path on Windows Server 2025
        run: echo "VULKAN_SDK=C:\VulkanSDK" >> $Env:GITHUB_ENV

      # Runner enumerates the Intel iGPU at index 0 and the NVIDIA card at
      # index 1; pin ggml to the NVIDIA device (re-check if the image changes).
      - if: ${{ matrix.os == 'windows-2025' }}
        name: Pin ggml Vulkan to the NVIDIA GPU on Windows
        run: echo "GGML_VK_VISIBLE_DEVICES=1" >> $Env:GITHUB_ENV

      # A benchmark run needs every DiT variant, the functional suite only
      # turbo-q4. They get separate cache entries so the bigger set neither
      # displaces the smaller one nor gets mistaken for it on a key hit.
      - name: Cache AudioGen GGML GGUF models
        id: model-cache
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/cache-models
        with:
          package: audiogen-ggml
          paths: packages/audiogen-ggml/models
          hash-files-glob: packages/audiogen-ggml/scripts/download-audiogen-ggml-models.js
          cache-key-suffix: ${{ inputs.run_rtf_benchmarks && 'all-dit-variants' || '' }}
          enable-cross-os: 'true'

      - name: Download GGUF models from registry
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ${{ github.workspace }}/packages/audiogen-ggml
        env:
          DOWNLOAD_SCRIPT: ${{ inputs.run_rtf_benchmarks && 'download-models:registry:all' || 'download-models:registry' }}
        run: npm run "$DOWNLOAD_SCRIPT"

      - name: Run integration test
        if: ${{ inputs.run_integration_tests != false }}
        shell: bash
        working-directory: ${{ github.workspace }}/packages/audiogen-ggml
        run: npm run test:integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INTEGRATION_TEST_TIMEOUT: ${{ matrix.platform == 'win32' && '3600' || '1800' }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/packages/audiogen-ggml/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/packages/audiogen-ggml/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}

      # Benchmark leg (run_rtf_benchmarks=true, set by
      # benchmark-performance-audiogen-ggml.yml). Every runner sweeps the three
      # DiT variants on CPU; a GPU runner sweeps them again on the platform's
      # ggml backend (Vulkan on linux/win32, Metal on darwin). turbo-q4 and
      # turbo-q8 share the ~8-step turbo schedule; sft runs the ~50-step one, so
      # it gets fewer iterations to keep the leg inside the job timeout. The
      # matrix runner's per-entry watchdog isolates an entry that still overruns.
      - name: Run RTF benchmark matrix
        if: ${{ inputs.run_rtf_benchmarks }}
        shell: bash
        working-directory: ${{ github.workspace }}/packages/audiogen-ggml
        run: |
          set -euo pipefail
          if [ -n "$MATRIX_OVERRIDE" ]; then
            MATRIX="$MATRIX_OVERRIDE"
          elif [ "$NO_GPU_ROW" = "true" ]; then
            MATRIX="$CPU_MATRIX"
          elif [ "$ROW_PLATFORM" = "darwin" ]; then
            MATRIX="$METAL_MATRIX"
          else
            MATRIX="$VULKAN_MATRIX"
          fi
          export QVAC_AUDIOGEN_GGML_BENCHMARK_MATRIX_JSON="$MATRIX"
          node scripts/run-rtf-benchmark-matrix.js
        env:
          MATRIX_OVERRIDE: ${{ inputs.benchmark_matrix_json }}
          NO_GPU_ROW: ${{ matrix.no_gpu || 'false' }}
          ROW_PLATFORM: ${{ matrix.platform }}
          CPU_MATRIX: >-
            [{"ditVariant":"turbo-q4","useGPU":false,"backendHint":"cpu"},
            {"ditVariant":"turbo-q8","useGPU":false,"backendHint":"cpu"},
            {"ditVariant":"sft","useGPU":false,"backendHint":"cpu","numWarmup":0,"numRuns":1}]
          VULKAN_MATRIX: >-
            [{"ditVariant":"turbo-q4","useGPU":false,"backendHint":"cpu"},
            {"ditVariant":"turbo-q8","useGPU":false,"backendHint":"cpu"},
            {"ditVariant":"sft","useGPU":false,"backendHint":"cpu","numWarmup":0,"numRuns":1},
            {"ditVariant":"turbo-q4","useGPU":true,"backendHint":"vulkan"},
            {"ditVariant":"turbo-q8","useGPU":true,"backendHint":"vulkan"},
            {"ditVariant":"sft","useGPU":true,"backendHint":"vulkan","numRuns":2}]
          METAL_MATRIX: >-
            [{"ditVariant":"turbo-q4","useGPU":false,"backendHint":"cpu"},
            {"ditVariant":"turbo-q8","useGPU":false,"backendHint":"cpu"},
            {"ditVariant":"sft","useGPU":false,"backendHint":"cpu","numWarmup":0,"numRuns":1},
            {"ditVariant":"turbo-q4","useGPU":true,"backendHint":"metal"},
            {"ditVariant":"turbo-q8","useGPU":true,"backendHint":"metal"},
            {"ditVariant":"sft","useGPU":true,"backendHint":"metal","numRuns":2}]
          # Matrix-wide defaults; a per-entry numWarmup/numRuns above wins.
          QVAC_AUDIOGEN_GGML_BENCHMARK_WARMUP_RUNS: '1'
          QVAC_AUDIOGEN_GGML_BENCHMARK_RUNS: '3'
          QVAC_AUDIOGEN_GGML_BENCHMARK_DURATION_S: '15'
          QVAC_AUDIOGEN_GGML_BENCHMARK_DEVICE: ${{ matrix.runner || matrix.os }}
          QVAC_AUDIOGEN_GGML_BENCHMARK_RUNNER: ${{ matrix.runner || matrix.os }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/packages/audiogen-ggml/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/packages/audiogen-ggml/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: ${{ github.job }}

      # The matrix runner deliberately exits 0 on partial failure so one variant
      # or backend does not sink the whole leg. A run with zero artifacts means
      # every entry failed and should still fail loudly.
      - name: Verify RTF benchmark output exists
        if: ${{ always() && !cancelled() && inputs.run_rtf_benchmarks }}
        shell: bash
        working-directory: ${{ github.workspace }}/packages/audiogen-ggml
        env:
          ROW_LABEL: ${{ matrix.runner || matrix.os }} (${{ matrix.platform }}-${{ matrix.arch }})
        run: |
          set -euo pipefail
          results_dir="benchmarks/results"
          mkdir -p "$results_dir"
          shopt -s nullglob
          rtf_files=("$results_dir"/rtf-benchmark-*.json)
          rtf_count=${#rtf_files[@]}
          echo "Benchmark output in $results_dir:"
          ls -la "$results_dir" || true
          echo
          echo "rtf-benchmark-*.json: $rtf_count"
          {
            echo "### Benchmark output — $ROW_LABEL"
            echo "- rtf-benchmark JSON files: \`$rtf_count\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rtf_count" -eq 0 ]; then
            echo "::error title=No RTF benchmark output::scripts/run-rtf-benchmark-matrix.js produced zero rtf-benchmark-*.json files on $ROW_LABEL. Every benchmark entry failed — check the matrix runner log above for model-fetch failures, prebuild path issues, or per-entry crashes."
            exit 1
          fi

      - name: Upload RTF benchmark results
        if: ${{ always() && !cancelled() && inputs.run_rtf_benchmarks }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: rtf-results-audiogen-ggml-${{ matrix.runner || matrix.os }}-${{ matrix.arch }}${{ matrix.no_gpu == 'true' && '-cpu' || '-gpu' }}
          path: packages/audiogen-ggml/benchmarks/results/rtf-benchmark-*.json
          if-no-files-found: warn
          retention-days: 30

