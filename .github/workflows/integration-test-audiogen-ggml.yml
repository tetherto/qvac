name: Run Integration Tests (AudioGen GGML)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to test"
        type: string
        required: false
        default: main
  workflow_call:
    inputs:
      ref:
        description: "ref"
        type: string
        required: false
      repository:
        type: string
        required: false

# Least-privilege default scoped to the whole file (CodeQL
# actions/missing-workflow-permissions). The single job below only reads the
# repo and packages.
permissions:
  contents: read
  packages: read

jobs:
  # NOTE: continue-on-error: true mirrors the early-days landing posture the
  # sibling addons use (tts-ggml / parakeet). The on-pr-audiogen-ggml.yml
  # merge-guard treats this job's `success || skipped` as a pass, so a flake
  # here does NOT block a merge.
  #
  # The suite is existence-only today: it queries the QVAC model registry over
  # hyperdrive (same client the SDK uses) to assert the four ACE-Step GGUFs are
  # published, WITHOUT downloading the multi-GB blobs or running the native
  # engine. Hence no prebuilds / model-download / GPU matrix are needed. Tighten
  # this gate (drop `continue-on-error`) once a full on-device generation
  # integration test lands.
  run-integration-tests:
    timeout-minutes: 30
    continue-on-error: true
    runs-on: ubuntu-latest
    environment: release
    name: registry-existence-integration-tests
    env:
      GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install NPM dependencies
        working-directory: ${{ github.workspace }}/packages/audiogen-ggml
        run: npm install

      - name: Install bare tooling
        run: npm install -g --force bare bare-make

      - name: Run integration test (registry existence only)
        shell: bash
        working-directory: ${{ github.workspace }}/packages/audiogen-ggml
        run: npm run test:integration
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          INTEGRATION_TEST_TIMEOUT: "600"
