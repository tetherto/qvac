name: Run Integration Tests (AudioGen GGML)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to test"
        type: string
        required: false
        default: main
      prebuild_package:
        description: "NPM package containing prebuilds (e.g. @qvac/audiogen-ggml@0.1.0)"
        required: false
        type: string
      run_integration_tests:
        description: "Run the integration suite"
        required: false
        type: boolean
        default: true

  workflow_call:
    inputs:
      prebuild_package:
        description: "NPM package containing prebuilds (e.g. @qvac/audiogen-ggml@0.1.0)"
        type: string
        required: false
      ref:
        description: "ref"
        type: string
        required: false
      repository:
        type: string
        required: false
      run_integration_tests:
        description: "Run the integration suite"
        type: boolean
        required: false
        default: true

# Least-privilege default scoped to the whole file (CodeQL
# actions/missing-workflow-permissions). The single job below only reads the
# repo and packages.
permissions:
  contents: read
  packages: read

jobs:
  # NOTE: continue-on-error: true mirrors the early-days landing posture the
  # sibling addons use (tts-ggml / parakeet). The on-pr-audiogen-ggml.yml
  # merge-guard treats this job's `success || skipped` as a pass, so a flake in
  # the generation suite does NOT block a merge yet. Tighten this gate (drop
  # `continue-on-error`) once the addon's flake surface is small enough.
  run-integration-tests:
    timeout-minutes: 120
    continue-on-error: true
    runs-on: ${{ matrix.runner || matrix.os }}
    environment: release
    name: ${{ matrix.os }}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.no_gpu != 'true' && '-gpu' || '' }}-integration-tests
    env:
      GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
      NO_GPU: ${{ matrix.no_gpu || 'false' }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            runner: qvac-ubuntu2204-x64-gpu
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            runner: qvac-ubuntu2404-x64-gpu
          - os: ubuntu-26.04
            platform: linux
            arch: x64
            no_gpu: 'true'
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            no_gpu: 'true'
          - os: macos-26
            runner: qvac-macos26-arm64-gpu
            platform: darwin
            arch: arm64
          - os: macos-15-large
            platform: darwin
            arch: x64
            no_gpu: 'true'
          - os: windows-2025
            platform: win32
            arch: x64
            runner: qvac-win25-x64-gpu

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - name: Manual Workspace Cleanup
        run: rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"
        shell: bash
        working-directory: .
        if: runner.environment != 'github-hosted'

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install NPM dependencies
        working-directory: ${{ github.workspace }}/packages/audiogen-ggml
        run: npm install

      - name: Install bare tooling
        run: npm install -g --force bare bare-make

      - run: mkdir -p "${{ runner.temp }}/audiogen-ggml"
        shell: bash
      - run: mkdir -p "${{ github.workspace }}/packages/audiogen-ggml/prebuilds"
        shell: bash

      - name: Download prebuilds from artifact
        if: ${{ !inputs.prebuild_package }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          path: ${{ runner.temp }}/audiogen-ggml
          merge-multiple: true

      - if: ${{ !inputs.prebuild_package }}
        shell: bash
        run: cp -r "${{ runner.temp }}/audiogen-ggml"/* "${{ github.workspace }}/packages/audiogen-ggml/prebuilds"

      - name: Download prebuilds from package
        if: ${{ inputs.prebuild_package }}
        working-directory: ${{ runner.temp }}/audiogen-ggml
        shell: bash
        run: |
          npm pack ${{ inputs.prebuild_package }}
          tar -xzf *.tgz
          cp -r ./package/prebuilds/* "${{ github.workspace }}/packages/audiogen-ggml/prebuilds"

      - name: Rename prebuilds from tetherto_ to qvac_ prefix
        if: ${{ inputs.prebuild_package }}
        working-directory: ${{ github.workspace }}/packages/audiogen-ggml
        shell: bash
        run: |
          find prebuilds -depth -name 'tetherto_*' | while read -r file; do
            dir=$(dirname "$file")
            base=$(basename "$file")
            newbase=$(echo "$base" | sed 's/^tetherto_/qvac_/')
            mv "$file" "$dir/$newbase"
          done

      - name: Linux - install dependencies
        if: matrix.arch == 'arm64' && (matrix.platform == 'linux' || matrix.platform == 'android')
        shell: bash
        run: |
          sudo apt-get update
          # libgomp1 / libomp5 - GNU + LLVM OpenMP runtimes the ggml-speech CPU
          #   backend links against (clang -fopenmp under our linux-clang
          #   toolchain); the arm64 CPU backend ships as per-microarch MODULE .so
          #   files and fails to load without them.
          # libblas3 - runtime BLAS soname required by the Linux prebuilds.
          # mesa-vulkan-drivers - a software Vulkan ICD so the Vulkan-enabled
          #   prebuild's backend probe has a device to enumerate (the no_gpu
          #   entries force useGPU=false regardless).
          sudo apt-get install -y libgomp1 libomp5 libblas3 mesa-vulkan-drivers

      - if: ${{ matrix.os == 'windows-2025' }}
        name: Set Vulkan SDK Path on Windows Server 2025
        run: echo "VULKAN_SDK=C:\VulkanSDK" >> $Env:GITHUB_ENV

      # Runner enumerates the Intel iGPU at index 0 and the NVIDIA card at
      # index 1; pin ggml to the NVIDIA device (re-check if the image changes).
      - if: ${{ matrix.os == 'windows-2025' }}
        name: Pin ggml Vulkan to the NVIDIA GPU on Windows
        run: echo "GGML_VK_VISIBLE_DEVICES=1" >> $Env:GITHUB_ENV

      - name: Cache AudioGen GGML GGUF models
        id: model-cache
        if: runner.environment != 'github-hosted'
        uses: ./.github/actions/cache-models
        with:
          package: audiogen-ggml
          paths: packages/audiogen-ggml/models
          hash-files-glob: packages/audiogen-ggml/scripts/download-audiogen-ggml-models.js
          enable-cross-os: 'true'

      - name: Download GGUF models from registry
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: ${{ github.workspace }}/packages/audiogen-ggml
        run: npm run download-models:registry

      - name: Run integration test
        if: ${{ inputs.run_integration_tests != false }}
        shell: bash
        working-directory: ${{ github.workspace }}/packages/audiogen-ggml
        run: npm run test:integration
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          INTEGRATION_TEST_TIMEOUT: ${{ matrix.platform == 'win32' && '3600' || '1800' }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/packages/audiogen-ggml/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/packages/audiogen-ggml/prebuilds/${{ matrix.platform }}-${{ matrix.arch }}
