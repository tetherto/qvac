name: On PR Trigger (OCR-GGML)

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/ocr-ggml/**"
      - ".github/workflows/*ocr-ggml*.yml"
      - "packages/fabric/vcpkg.json"
      - "packages/fabric/vcpkg-configuration.json"
  workflow_dispatch:
    inputs:
      base_sha:
        description: >-
          Optional base SHA for cpp-lint (clang-format + clang-tidy) to diff
          against. When empty, the reusable cpp-lint workflow falls back to
          HEAD~1, so only files touched by the current commit get linted.
          Set this to a commit further back (e.g. 14e7c83e, the last commit
          before the clang-tidy buckets) to re-lint every C++ file we have
          touched since.
        type: string
        required: false
        default: ""
  workflow_call:

permissions:
  contents: read
  pull-requests: read
  packages: read
  id-token: write

env:
  PKG_DIR: packages/ocr-ggml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fork-approval:
    permissions:
      statuses: write
    uses: ./.github/workflows/reusable-fork-approval.yml
  ci-router:
    name: CI Router (label detection)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_verified_checks: ${{ steps.route.outputs.run_verified_checks }}
      run_prebuilds: ${{ steps.route.outputs.run_prebuilds }}
      run_cpp_tests: ${{ steps.route.outputs.run_cpp_tests }}
      run_desktop: ${{ steps.route.outputs.run_desktop }}
      run_mobile: ${{ steps.route.outputs.run_mobile }}
    steps:
      - name: Checkout ci-router composite (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/ci-router
          sparse-checkout-cone-mode: false
      - name: Route CI stages
        id: route
        uses: ./.github/actions/ci-router

  authorize:
    needs: [fork-approval]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: read
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      - name: Checkout authorize-pr (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/authorize-pr
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Authorize
        id: auth
        uses: ./.github/actions/authorize-pr
        with:
          github-token: ${{ github.token }}

  detect-fabric-stack:
    if: needs.authorize.outputs.allowed == 'true'
    needs:
      - fork-approval
      - authorize
      - ci-router
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      fabric_stack: ${{ steps.detect.outputs.fabric_stack }}
      # A stack PR only produces an artifact to wait for when on-pr-fabric will
      # actually publish one. That producer needs the prebuilds label (or a
      # label implying it) and, because wait-and-download only trusts a
      # pull_request_target producer, a pull_request_target event. Every
      # downstream fabric clause reads this rather than fabric_stack so the two
      # sides cannot drift into a 120-minute poll for an artifact nobody builds.
      needs_fabric_artifact: ${{ steps.detect.outputs.fabric_stack == 'true' && needs.ci-router.outputs.run_prebuilds == 'true' && github.event_name == 'pull_request_target' }}
    steps:
      - name: Checkout repository (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Detect fabric-stack PR
        id: detect
        uses: tetherto/qvac/.github/actions/detect-fabric-stack@6620d695d3a07cafe3931182e7844dde376a23f8
      - name: Warn when a stack PR builds against released fabric
        if: steps.detect.outputs.fabric_stack == 'true' && needs.ci-router.outputs.run_prebuilds != 'true'
        shell: bash
        run: |
          echo "::warning::This PR changes packages/fabric, but no prebuilds label is set, so on-pr-fabric publishes nothing. Native jobs here build against the released @qvac/fabric, not this PR's. Add the 'prebuilds' label to exercise the stack."

  resolve-fabric-prebuilds:
    if: needs.detect-fabric-stack.outputs.needs_fabric_artifact == 'true' && needs.authorize.outputs.allowed == 'true'
    needs:
      - fork-approval
      - authorize
      - detect-fabric-stack
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for fabric-prebuilds from on-pr-fabric
        uses: tetherto/qvac/.github/actions/wait-and-download-fabric-prebuilds@6620d695d3a07cafe3931182e7844dde376a23f8
        with:
          github-token: ${{ github.token }}
          # needs_fabric_artifact pins this job to pull_request_target, where the
          # PR payload always carries a head SHA. The fallback stays because the
          # action rejects an empty SHA outright, and every other head-SHA
          # consumer in this workflow reads it the same way.
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Re-publish fabric-prebuilds for downstream jobs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: fabric-prebuilds
          path: fabric-prebuilds-staging

  verify-fabric-lockstep:
    if: needs.authorize.outputs.allowed == 'true'
    needs: [fork-approval, authorize]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Verify qvac-fabric versions are lockstep
        id: lockstep
        uses: ./.github/actions/verify-qvac-fabric-lockstep

      - name: Report verified version
        run: 'echo "Verified qvac-fabric version: ${{ steps.lockstep.outputs.version }}"'

  sanity-checks:
    if: needs.ci-router.outputs.run_verified_checks == 'true' && (needs.authorize.outputs.allowed == 'true' || github.event_name == 'workflow_dispatch')
    needs:
      - fork-approval
      - authorize
      - ci-router
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PKG_DIR: packages/ocr-ggml
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0

      - name: Run Sanity checks
        uses: ./.github/actions/sanity-checks
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          pat-token: ${{ secrets.GITHUB_TOKEN }}
          run-integration: ${{ needs.authorize.outputs.allowed == 'true' }}
          workdir: packages/ocr-ggml

      - name: Verify that yaml files are formatted
        id: yamlfmt
        uses: ./.github/actions/yamlfmt
        with:
          workdir: ${{ env.PKG_DIR }}
        continue-on-error: true

  cpp-lint:
    needs: [authorize, ci-router, fork-approval]
    if: needs.ci-router.outputs.run_verified_checks == 'true' && (needs.authorize.outputs.allowed == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/cpp-lint.yaml
    secrets: inherit
    with:
      sha: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      workdir: packages/ocr-ggml

  ts-checks:
    needs: [fork-approval, authorize]
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: packages/ocr-ggml
        run: npm install

      - name: Type declaration check
        working-directory: packages/ocr-ggml
        run: npm run test:dts

  detect-native-changes:
    if: needs.ci-router.outputs.run_prebuilds == 'true' && (needs.authorize.outputs.allowed == 'true' || github.event_name == 'workflow_dispatch')
    needs:
      - fork-approval
      - authorize
      - ci-router
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native_changed: ${{ steps.detect.outputs.native_changed }}
      native_hash: ${{ steps.detect.outputs.native_hash }}
    steps:
      - name: Checkout composite source (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Detect native file changes
        id: detect
        uses: ./.github/actions/detect-native-changes
        with:
          workdir: packages/ocr-ggml

  prebuild-artifact-reuse:
    # Deliberately the broad fabric_stack signal, not needs_fabric_artifact: a
    # prebuild cached before the fabric change is stale for any stack PR,
    # whether or not this run is the one that overlays the PR's fabric.
    if: |
      needs.detect-native-changes.outputs.native_changed == 'false' &&
      needs.detect-fabric-stack.outputs.fabric_stack != 'true'
    needs:
      - fork-approval
      - detect-native-changes
      - detect-fabric-stack
      - sanity-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      reuse_hit: ${{ steps.reuse.outputs.reuse_hit }}
    steps:
      - name: Checkout prebuild-artifact-reuse composite (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/prebuild-artifact-reuse
          sparse-checkout-cone-mode: false
      - name: Reuse prebuilds from a prior run
        id: reuse
        uses: ./.github/actions/prebuild-artifact-reuse
        with:
          github-token: ${{ github.token }}
          workflow-file: on-pr-ocr-ggml.yml
          native-hash: ${{ needs.detect-native-changes.outputs.native_hash }}
          pr-number: ${{ github.event.pull_request.number }}

  prebuild:
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
    needs:
      - fork-approval
      - authorize
      - ci-router
      - sanity-checks
      - detect-native-changes
      - detect-fabric-stack
      - resolve-fabric-prebuilds
      - prebuild-artifact-reuse
    # A failed detection leaves needs_fabric_artifact empty, which satisfies
    # needs_fabric_artifact != 'true' — without the result guard a stack PR would
    # build against the released @qvac/fabric and prebuild-artifact-save would
    # then publish that bundle as reusable.
    if: |
      always() &&
      !cancelled() &&
      needs.sanity-checks.result == 'success' &&
      needs.detect-fabric-stack.result == 'success' &&
      needs.ci-router.outputs.run_prebuilds == 'true' &&
      (needs.authorize.outputs.allowed == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.detect-fabric-stack.outputs.needs_fabric_artifact != 'true' || needs.resolve-fabric-prebuilds.result == 'success') &&
      (needs.detect-native-changes.outputs.native_changed == 'true' || needs.prebuild-artifact-reuse.outputs.reuse_hit != 'true')
    uses: ./.github/workflows/prebuilds-ocr-ggml.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      fabric-overlay-artifact: ${{ needs.detect-fabric-stack.outputs.needs_fabric_artifact == 'true' && 'fabric-prebuilds' || '' }}

  prebuild-artifact-save:
    if: always() && !cancelled() && needs.prebuild.result == 'success'
    needs:
      - fork-approval
      - prebuild
      - detect-native-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout prebuild-artifact-save composite (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/prebuild-artifact-save
          sparse-checkout-cone-mode: false
      - name: Save reuse marker
        uses: ./.github/actions/prebuild-artifact-save
        with:
          native-hash: ${{ needs.detect-native-changes.outputs.native_hash }}
          pr-number: ${{ github.event.pull_request.number }}

  run-integration-tests:
    permissions:
      contents: read
      packages: read
      id-token: write
    needs:
      - authorize
      - prebuild
      - prebuild-artifact-reuse
      - ci-router
      - fork-approval
      - detect-fabric-stack
      - resolve-fabric-prebuilds
    if: |
      always() &&
      !cancelled() &&
      needs.detect-fabric-stack.result == 'success' &&
      needs.ci-router.outputs.run_desktop == 'true' &&
      (needs.authorize.outputs.allowed == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.detect-fabric-stack.outputs.needs_fabric_artifact != 'true' || needs.resolve-fabric-prebuilds.result == 'success') &&
      (needs.prebuild.result == 'success' || needs.prebuild-artifact-reuse.outputs.reuse_hit == 'true')
    uses: ./.github/workflows/integration-test-ocr-ggml.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      ref: ${{ github.event.pull_request.head.sha || github.ref }}
      fabric-overlay-artifact: ${{ needs.detect-fabric-stack.outputs.needs_fabric_artifact == 'true' && 'fabric-prebuilds' || '' }}

  # Mobile integration tests are no longer run on PRs. They run on demand via
  # `integration-mobile-test-ocr-ggml.yml` (workflow_dispatch), where the
  # dispatcher must pick a specific device. The `run-mobile-addon-tests` label /
  # ci-router `run_mobile` output are kept for a possible future revival but no
  # longer trigger anything here. (Benchmark / weekend / on-merge mobile runs
  # are unaffected — they call the mobile workflow directly.)

  combine-perf-reports:
    name: Combined Performance Report
    # run-mobile-integration-tests removed — only desktop perf is combined on PRs now.
    needs: [fork-approval, authorize, run-integration-tests]
    if: always() && !cancelled() && needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repo (composites + perf scripts)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          sparse-checkout: |
            .github/actions/run-mobile-integration-tests
            scripts/perf-report
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Combine performance reports
        uses: ./.github/actions/run-mobile-integration-tests/combine-perf-reports
        with:
          artifact-pattern: perf-report-ocr-*-${{ github.run_number }}
          report-title: 'OCR-GGML Performance Report (All Platforms)'
          # Drop desktop-only EasyOCR rows from the cross-platform table: the
          # full-suite and canvasSize tests are `skip: isMobile`, so their rows
          # can never have mobile data and only add empty columns here. They
          # still run on desktop and remain in the per-device desktop reports.
          exclude: 'full-suite|canvasSize lab_results'

  publish-prebuild-status:
    # Posts qvac/prebuild-ocr-ggml for Merge Guard's verify-prebuilds; mirrors this flow's build-status.
    needs: [prebuild, prebuild-artifact-reuse, ci-router]
    if: always() && !cancelled() && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      # Trusted base-branch checkout of only the prebuild-status scripts (never
      # PR head code), so publish logic is a single, unit-tested source.
      - name: Checkout prebuild-status scripts (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts/prebuild-status
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Publish prebuild status for Merge Guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREBUILD_RESULT: ${{ needs.prebuild.result }}
          REUSE_HIT: ${{ needs.prebuild-artifact-reuse.outputs.reuse_hit }}
          # A skipped prebuild is only a pass when ci-router succeeded and chose
          # not to build (no label); a skip from an upstream failure fails closed.
          CI_ROUTER_RESULT: ${{ needs.ci-router.result }}
          RUN_PREBUILDS: ${{ needs.ci-router.outputs.run_prebuilds }}
          # Stamps this on-pr run's URL into target_url so Merge Guard can reject a
          # status from a superseded (e.g. pre-label) run whose timestamp looks fresh.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTEXT: qvac/prebuild-ocr-ggml
        run: node .github/scripts/prebuild-status/publish.mjs

  merge-guard:
    # run-mobile-integration-tests removed — mobile is on-demand only now.
    needs: [authorize, ci-router, sanity-checks, prebuild, prebuild-artifact-reuse, prebuild-artifact-save, detect-native-changes, detect-fabric-stack, resolve-fabric-prebuilds, run-integration-tests]
    # Always run so the PR still gets a status check even if fork-approval is
    # skipped or fails; matches on-pr-tts-ggml.yml's pattern. !cancelled()
    # ensures this doesn't hold the concurrency group open after a
    # superseding push cancels the run.
    if: always() && !cancelled()
    uses: ./.github/workflows/public-pr.yml
    with:
      # Every status below opens with the same fabric-stack guard: a skipped
      # downstream job is only a deliberate no-op when the decision that skipped
      # it is trustworthy. If detection failed, or the prebuild hand-off failed
      # on a stack PR, the skips are consequences of that failure and must not
      # read as passes.
      sanity-checks-status: ${{ needs.detect-fabric-stack.result != 'failure' && (needs.detect-fabric-stack.outputs.needs_fabric_artifact != 'true' || needs.resolve-fabric-prebuilds.result == 'success') && needs.sanity-checks.result == 'success' }}
      build-status: ${{ needs.detect-fabric-stack.result != 'failure' && (needs.detect-fabric-stack.outputs.needs_fabric_artifact != 'true' || needs.resolve-fabric-prebuilds.result == 'success') && (needs.prebuild.result == 'success' || needs.prebuild.result == 'skipped' || needs.prebuild-artifact-reuse.outputs.reuse_hit == 'true') }}
      # run-mobile-integration-tests removed — mobile is on-demand only now.
      integration-tests-status: ${{ needs.detect-fabric-stack.result != 'failure' && (needs.detect-fabric-stack.outputs.needs_fabric_artifact != 'true' || needs.resolve-fabric-prebuilds.result == 'success') && (needs.run-integration-tests.result == 'success' || needs.run-integration-tests.result == 'skipped') }}
