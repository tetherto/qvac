name: CI trust policy tests
on:
  pull_request:
    paths:
      - ".github/actions/authorize-pr/**"
      - ".github/actions/ci-router/**"
      - ".github/actions/label-gate/**"
      - ".github/actions/sanity-checks/**"
      - ".github/scripts/test/ci-trust-policy.test.mjs"
      - ".github/workflows/check-approvals.yml"
      - ".github/workflows/coload-smoke-mobile-ggml.yml"
      - ".github/workflows/on-pr-*.yml"
      - ".github/workflows/pr-gate-merge.yml"
      - ".github/workflows/pr-test-ci-trust-policy.yml"
      - ".github/workflows/pr-test-inference-addon-cpp.yml"
      - ".github/workflows/pr-test-inference-addon-cpp-js.yml"
      - ".github/workflows/public-pr.yml"
      - ".github/workflows/public-reusable-npm.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  policy-tests:
    name: policy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 20
      - name: Run trust-policy tests
        run: >-
          node --test .github/actions/label-gate/test/gate.test.mjs .github/actions/label-gate/test/github-client.test.mjs .github/actions/label-gate/test/index.test.mjs .github/scripts/test/ci-trust-policy.test.mjs
