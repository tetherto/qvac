name: OpenClaw Upstream Compatibility

# Scheduled tripwire for the published OpenClaw integration. This installs the
# latest public OpenClaw and QVAC plugin packages in a fresh project so upstream
# localService, config, model-catalog, and agent-run drift is caught early.

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/openclaw-upstream-compat.yml"
      - "scripts/ci/openclaw-upstream-compat-smoke.sh"
      # The verifiers decide the verdict, so a change to one changes this
      # workflow's behaviour.
      - "scripts/ci/verify-openclaw-agent-output.cjs"
      - "scripts/ci/verify-openclaw-prompt-surface.cjs"
  schedule:
    - cron: "30 7 * * *" # daily 07:30 UTC, after the OpenCode compatibility smoke
  workflow_dispatch:
    inputs:
      attempts:
        description: "Agent attempts before failing. Raise only to investigate; a green that needed a retry is hiding something."
        required: false
        default: "1"
      tool_profile:
        description: "OpenClaw tools.profile for the run (minimal | coding | messaging | full). Has no effect unless tool_deny is widened too."
        required: false
        default: "minimal"
      tool_deny:
        description: "OpenClaw tools.deny, as JSON. Denies everything by default and wins over tool_profile; set to [] to restore the profile's tools."
        required: false
        default: '["*"]'
      agent_prompt:
        description: "Override the agent prompt. For calibrating compliance without a code change; blank uses the default."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: openclaw-upstream-compat
  cancel-in-progress: false

env:
  QVAC_SMOKE_MODEL: qwen3.5-0.8b
  # Must stay under OPENCLAW_AGENT_TIMEOUT_SECONDS: readiness is awaited inside
  # the agent run, so a longer value is unreachable and the agent timeout fires
  # first, reporting an opaque kill instead of "service never became healthy".
  QVAC_READY_TIMEOUT_MS: "180000"
  # Passed to `openclaw agent --timeout` so a deadline arrives as a readable
  # envelope rather than a signal. A healthy attempt is ~80s wall.
  OPENCLAW_AGENT_TIMEOUT_SECONDS: "240"

jobs:
  smoke:
    name: openclaw@latest + @qvac/openclaw-plugin@latest
    runs-on: ubuntu-latest
    # PR runs skip the agent turn, so 15m covers install and setup. Otherwise
    # it is ~6m of setup plus the attempt budget: one attempt at the 300s
    # backstop is 5m. The headroom is for dispatches that raise `attempts` --
    # past about eight, raise this too or the job is killed before the artifact
    # upload.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 45 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*

      - name: Run OpenClaw through QVAC plugin
        env:
          SMOKE_DIR: ${{ runner.temp }}/openclaw-compat-smoke
          ARTIFACT_DIR: ${{ runner.temp }}/openclaw-compat-artifacts
          QVAC_MODEL: ${{ env.QVAC_SMOKE_MODEL }}
          QVAC_READY_TIMEOUT_MS: ${{ env.QVAC_READY_TIMEOUT_MS }}
          OPENCLAW_AGENT_TIMEOUT_SECONDS: ${{ env.OPENCLAW_AGENT_TIMEOUT_SECONDS }}
          OPENCLAW_AGENT_MAX_ATTEMPTS: ${{ inputs.attempts || '1' }}
          OPENCLAW_TOOL_PROFILE: ${{ inputs.tool_profile || 'minimal' }}
          OPENCLAW_TOOL_DENY: ${{ inputs.tool_deny || '["*"]' }}
          # Blank falls through to the script's default, so scheduled runs are
          # unaffected. The script must therefore treat empty as unset.
          AGENT_PROMPT: ${{ inputs.agent_prompt }}
          SKIP_OPENCLAW_AGENT: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: bash scripts/ci/openclaw-upstream-compat-smoke.sh

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
        with:
          name: openclaw-upstream-compat
          path: ${{ runner.temp }}/openclaw-compat-artifacts
          if-no-files-found: error

  notify-on-failure:
    name: Open or update tracking issue
    needs: smoke
    # Manual runs are for debugging this workflow. Scheduled failures are the
    # unattended signal that should create team-visible follow-up.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Open or update tracking issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # 8.0.0
        with:
          script: |
            const title = 'OpenClaw upstream compatibility smoke failing';
            const label = 'github_actions';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Scheduled OpenClaw upstream compatibility smoke failed.`,
              ``,
              `- Run: ${runUrl}`,
              `- Artifact: \`openclaw-upstream-compat\``,
              `- Triage: read \`prompt-surface.md\` **first** — it reports the advertised tool count and prompt size. The smoke denies every tool, so any count at all means the deny stopped applying; the ceiling is what turns that into a red run.`,
              `- Then diff \`versions.md\` against the last passing run's artifact. If no package version moved, this is not upstream drift — look at \`openclaw-agent.stderr\` (turn count, \`failover decision\` lines), \`sessions/\`, and \`qvac-serve.stdout\`/\`qvac-serve.stderr\`.`,
              `- Possible causes, in the order worth checking: the deny no longer applying (see above, and check \`openclaw-config.json\` for what landed); a version bump visible in \`versions.md\`; a wedged \`qvac serve\` that stops answering mid-run; or the agent turn itself — read \`openclaw-agent.attempt-1.stdout\`, \`toolSummary\` in particular.`,
              `- To reproduce, dispatch this workflow; \`agent_prompt\`, \`tool_profile\` and \`tool_deny\` vary the turn without a code change. \`tool_deny: []\` with \`tool_profile: coding\` restores the pre-#4112 tool surface — deny wins, so both are needed.`,
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.pull_request === undefined && issue.title === title);

            if (existing !== undefined) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Appended comment to existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              core.info(`Opened new issue #${created.data.number}`);
            }
