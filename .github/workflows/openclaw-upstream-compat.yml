name: OpenClaw Upstream Compatibility

# Scheduled tripwire for the published OpenClaw integration. This installs the
# latest public OpenClaw and QVAC plugin packages in a fresh project so upstream
# localService, config, model-catalog, and agent-run drift is caught early.

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/openclaw-upstream-compat.yml"
      - "scripts/ci/openclaw-upstream-compat-smoke.sh"
  schedule:
    - cron: "30 7 * * *" # daily 07:30 UTC, after the OpenCode compatibility smoke
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-upstream-compat
  cancel-in-progress: false

env:
  QVAC_SMOKE_MODEL: qwen3.5-0.8b
  # Must stay under OPENCLAW_AGENT_TIMEOUT: the readiness wait happens inside
  # the agent run, so a readyTimeoutMs longer than the agent timeout can never
  # be reached -- the agent timeout fires first and reports an opaque kill
  # instead of the plugin's "service never became healthy" error. Observed
  # readiness is well under a minute, so 8m is generous.
  QVAC_READY_TIMEOUT_MS: "480000"
  OPENCLAW_AGENT_TIMEOUT: 10m

jobs:
  smoke:
    name: openclaw@latest + @qvac/openclaw-plugin@latest
    runs-on: ubuntu-latest
    # PR runs skip the agent turn (SKIP_OPENCLAW_AGENT below) so 15m covers
    # install + plugin setup; scheduled/dispatch runs exercise the full agent
    # turn and need headroom for install plus up to three 10m agent attempts.
    # A healthy end-to-end run takes ~6m and a healthy agent turn ~3.4m, so 45m
    # covers the worst case without letting a wedged server burn a full hour.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 45 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: lts/*

      - name: Run OpenClaw through QVAC plugin
        env:
          SMOKE_DIR: ${{ runner.temp }}/openclaw-compat-smoke
          ARTIFACT_DIR: ${{ runner.temp }}/openclaw-compat-artifacts
          QVAC_MODEL: ${{ env.QVAC_SMOKE_MODEL }}
          QVAC_READY_TIMEOUT_MS: ${{ env.QVAC_READY_TIMEOUT_MS }}
          OPENCLAW_AGENT_TIMEOUT: ${{ env.OPENCLAW_AGENT_TIMEOUT }}
          SKIP_OPENCLAW_AGENT: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: bash scripts/ci/openclaw-upstream-compat-smoke.sh

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: openclaw-upstream-compat
          path: ${{ runner.temp }}/openclaw-compat-artifacts
          if-no-files-found: error

  notify-on-failure:
    name: Open or update tracking issue
    needs: smoke
    # Manual runs are for debugging this workflow. Scheduled failures are the
    # unattended signal that should create team-visible follow-up.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Open or update tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # 9.0.0
        with:
          script: |
            const title = 'OpenClaw upstream compatibility smoke failing';
            const label = 'github_actions';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Scheduled OpenClaw upstream compatibility smoke failed.`,
              ``,
              `- Run: ${runUrl}`,
              `- Artifact: \`openclaw-upstream-compat\``,
              `- Triage: diff \`versions.md\` against the last passing run's artifact **first**. If no package version moved, this is not upstream drift — look at \`openclaw-agent.stderr\` (turn count, \`failover decision\` lines), \`sessions/\`, and \`qvac-serve.stdout\`/\`qvac-serve.stderr\` for a loop or a wedged server.`,
              `- Possible causes, in the order worth checking: a version bump visible in \`versions.md\` (upstream \`openclaw\`, or QVAC's own \`@qvac/openclaw-plugin\` / \`@qvac/cli\` / \`@qvac/sdk\`); a wedged \`qvac serve\` that stops answering mid-run; or model nondeterminism — the smoke drives a 0.8b model and retries up to three times before failing.`,
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.pull_request === undefined && issue.title === title);

            if (existing !== undefined) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Appended comment to existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
              core.info(`Opened new issue #${created.data.number}`);
            }
