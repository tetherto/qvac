name: On PR Trigger (Embed)

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    branches:
      - main
      - release-*
      - feature-*
      - tmp-*
    paths:
      - "packages/qvac-lib-infer-llamacpp-embed/**"
      - ".github/workflows/*embed*.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Security Gate (Powered by the new Reusable Action)
  # ---------------------------------------------------------------------------
  authorize:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - name: PR Security Gate
        id: gate
        # I used @monorepo_update to match the branch of your other qvac-devops actions. 
        # Update this to @main or whichever branch you merged the action into!
        uses: tetherto/qvac-devops/.github/actions/auth-gate@monorepo_update
        with:
          required-label: 'verify'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 2. Execution Jobs (Gated by authorization)
  # ---------------------------------------------------------------------------
  sanity-checks:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Run Sanity checks
        uses: tetherto/qvac-devops/.github/actions/sanity-checks@monorepo_update
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          npm-token: ${{ secrets.NPM_TOKEN }}
          pat-token: ${{ secrets.PAT_TOKEN }}
          run-integration: true
          workdir: packages/qvac-lib-infer-llamacpp-embed

  cpp-lint:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    uses: tetherto/qvac-devops/.github/workflows/cpp-lint.yaml@monorepo_update
    secrets: inherit
    with:
      sha: ${{ github.event.pull_request.base.sha }}
      pr_head_sha: ${{ github.event.pull_request.head.sha }}
      workdir: packages/qvac-lib-infer-llamacpp-embed

  cpp-tests:
    needs: [authorize, sanity-checks]
    if: needs.authorize.outputs.allowed == 'true'
    uses: ./.github/workflows/cpp-tests-embed.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}

  ts-checks:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 20

      - name: Configure npm auth
        working-directory: packages/qvac-lib-infer-llamacpp-embed
        run: |
          cat > .npmrc <<NPMRC
          registry=https://registry.npmjs.org/
          @qvac:registry=https://registry.npmjs.org/
          //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}
          NPMRC

      - name: Install dependencies
        working-directory: packages/qvac-lib-infer-llamacpp-embed
        run: npm install

      - name: Type declaration check
        working-directory: packages/qvac-lib-infer-llamacpp-embed
        run: npm run test:dts

  prebuild:
    needs: [authorize, sanity-checks]
    if: needs.authorize.outputs.allowed == 'true'
    uses: ./.github/workflows/prebuilds-qvac-lib-infer-llamacpp-embed.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}
      tag: "dev"
      publish_target: 'gpr'

  integration-tests:
    needs: [authorize, prebuild]
    if: needs.authorize.outputs.allowed == 'true'
    uses: ./.github/workflows/integration-test-qvac-lib-infer-llamacpp-embed.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}

  run-mobile-integration-tests:
    needs: [authorize, prebuild]
    if: needs.authorize.outputs.allowed == 'true'
    uses: ./.github/workflows/integration-mobile-test-qvac-lib-infer-llamacpp-embed.yml
    secrets: inherit
    with:
      repository: ${{ github.event.pull_request.head.repo.full_name }}
      ref: ${{ github.event.pull_request.head.ref }}

  merge-guard:
    needs:
      - authorize
      - sanity-checks
      - cpp-lint
      - cpp-tests
      - prebuild
      - integration-tests
      - run-mobile-integration-tests
      - ts-checks
    if: always()
    uses: tetherto/qvac-devops/.github/workflows/public-pr.yml@monorepo_update
    with:
      sanity-checks-status: ${{ needs.sanity-checks.result == 'success' || needs.sanity-checks.result == 'skipped' }}
      build-status: ${{ needs.prebuild.result == 'success' || needs.prebuild.result == 'skipped' }}
    secrets: inherit