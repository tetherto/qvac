name: TMP nx final e2e (QVAC-25682)

# THROWAWAY. Deleted before merge. Every job asserts its own expected result.
#
#   cases    constructed changes through the real nx-project-matrix, both lanes
#   realprs  real PRs: today measured directly with nx under main's nx.json,
#            this PR through the real action, both lanes
#   apipath  the pull_request_target branch (merge base + lockfiles via the API),
#            which a push event cannot reach, checked against the git path

on:
  push:
    branches:
      - infra/QVAC-25682-nx-lockfile-affected

permissions:
  contents: read

jobs:
  cases:
    name: case ${{ matrix.case }} / ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        case: [addon-bump, addon-source, shared-bump, workspace-override, nonworkspace-manifest, plugin-bump, root-bump, workflow-only]
        lane: [stdin, range]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the case
        id: build
        shell: bash
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          git config user.email probe@local; git config user.name probe
          BASE=$(git rev-parse HEAD)
          override() {
            node -e "const fs=require('fs');let s=fs.readFileSync('pnpm-workspace.yaml','utf8');s=s.replace(/^overrides:\n/m,'overrides:\n  bare-path: \"3.0.0\"\n');fs.writeFileSync('pnpm-workspace.yaml',s)"
            pnpm install --lockfile-only --ignore-scripts >/dev/null; pnpm install --ignore-scripts >/dev/null
            echo "// probe" >> packages/ocr-ggml/index.js; }
          case "$CASE" in
            addon-bump)   pnpm add -D --filter @qvac/ocr-ggml tiny-invariant@1.3.3 --ignore-scripts >/dev/null ;;
            addon-source) echo "// probe" >> packages/ocr-ggml/index.js ;;
            shared-bump)  pnpm add -D --filter @qvac/fabric tiny-invariant@1.3.3 --ignore-scripts >/dev/null ;;
            workspace-override) override ;;
            nonworkspace-manifest) override
              node -e "const fs=require('fs'),p='docs/website/package.json',j=JSON.parse(fs.readFileSync(p,'utf8'));j.description=(j.description||'')+' ';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')" ;;
            plugin-bump)  pnpm add -D --filter @qvac/opencode-plugin tiny-invariant@1.3.3 --ignore-scripts >/dev/null ;;
            root-bump)    pnpm add -D -w tiny-invariant@1.3.3 --ignore-scripts >/dev/null ;;
            workflow-only) echo "# probe" >> .github/workflows/on-pr-nx.yml ;;
          esac
          git add -A && git commit -q -m "probe: $CASE"
          H=$(git rev-parse HEAD); C=$(git diff --name-only "$BASE" "$H")
          echo "CHANGED $CASE: $(tr '\n' ' ' <<<"$C")"
          has() { grep -qxE "$1" <<<"$C"; }; fail() { echo "::error::setup for $CASE is wrong: $1"; exit 1; }
          case "$CASE" in
            addon-bump)   has pnpm-lock.yaml && has packages/ocr-ggml/package.json || fail "lockfile + ocr manifest" ;;
            addon-source) has packages/ocr-ggml/index.js && ! has pnpm-lock.yaml || fail "source only" ;;
            shared-bump)  has pnpm-lock.yaml && has packages/fabric/package.json || fail "lockfile + fabric manifest" ;;
            workspace-override|nonworkspace-manifest) has pnpm-lock.yaml && has pnpm-workspace.yaml || fail "override changed the lockfile" ;;
            plugin-bump)  has pnpm-lock.yaml && has plugins/opencode/package.json || fail "lockfile + plugin manifest" ;;
            root-bump)    has pnpm-lock.yaml && has package.json || fail "lockfile + root manifest" ;;
            workflow-only) ! grep -qE '^packages/|pnpm-lock' <<<"$C" || fail "no package paths" ;;
          esac
          echo "base=$BASE" >> "$GITHUB_OUTPUT"; echo "head=$H" >> "$GITHUB_OUTPUT"
      - if: matrix.lane == 'stdin'
        shell: bash
        run: git diff --name-only "${{ steps.build.outputs.base }}" "${{ steps.build.outputs.head }}" > "$RUNNER_TEMP/nx-changed-files.txt"
      - id: m
        uses: ./.github/actions/nx-project-matrix
        with:
          target: on-pr
          base-ref: ${{ steps.build.outputs.base }}
          head-ref: ${{ steps.build.outputs.head }}
          config-ref: ${{ steps.build.outputs.base }}
      - name: Assert
        shell: bash
        env:
          CASE: ${{ matrix.case }}
          LANE: ${{ matrix.lane }}
          ALLROWS: ${{ steps.m.outputs.allrows }}
        run: |
          set -euo pipefail
          P=$(echo "${ALLROWS:-[]}" | jq -c '[.[].package]|unique'); N=$(echo "$P" | jq length)
          echo "RESULT $CASE/$LANE: $N $P"
          FABRIC='["classification-ggml","embed-llamacpp","fabric","llm-llamacpp","model-fit","ocr-ggml","translation-nmtcpp","vla-ggml"]'
          ok() { echo "VERDICT $CASE/$LANE: PASS ($1)"; }; bad() { echo "::error::VERDICT $CASE/$LANE: FAIL - $1"; exit 1; }
          case "$CASE" in
            addon-bump|addon-source) [ "$P" = '["ocr-ggml"]' ] && ok "ocr only" || bad "want [ocr-ggml] got $P" ;;
            shared-bump) m=$(jq -nc --argjson w "$FABRIC" --argjson g "$P" '$w-$g'); [ "$m" = "[]" ] && ok "fabric + consumers" || bad "missing $m" ;;
            workspace-override|nonworkspace-manifest|root-bump) [ "$N" = 14 ] && ok "all 14, as today" || bad "want all 14 got $N" ;;
            plugin-bump|workflow-only) [ "$N" = 0 ] && ok "no addon rows" || bad "want 0 got $P" ;;
          esac

  realprs:
    name: real ${{ matrix.target }} / ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        target: [f1c4648b0, 9d0914037, d2e24d152, 168c6fd22, pr4733, pr4570]
        lane: [stdin, range]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Resolve the real diff and measure today
        id: d
        shell: bash
        env:
          T: ${{ matrix.target }}
          LANE: ${{ matrix.lane }}
        run: |
          set -uo pipefail
          git fetch -q origin main
          case "$T" in
            pr*) git fetch -q origin "pull/${T#pr}/head:refs/remotes/pr/${T#pr}"
                 H=$(git rev-parse "refs/remotes/pr/${T#pr}"); B=$(git merge-base origin/main "$H") ;;
            *)   H=$(git rev-parse "$T"); B=$(git rev-parse "$T^") ;;
          esac
          git diff --name-only "$B" "$H" > /tmp/changed.txt
          cp nx.json /tmp/nx.branch.json; git show origin/main:nx.json > nx.json; rm -rf .nx
          if [ "$LANE" = range ]; then
            o=$(pnpm exec nx show projects --affected -t on-pr --base="$B" --head="$H" --json 2>/dev/null | grep -E '^\[' | tail -n1)
          else
            o=$(pnpm exec nx show projects --affected -t on-pr --stdin --json < /tmp/changed.txt 2>/dev/null | grep -E '^\[' | tail -n1)
          fi
          cp /tmp/nx.branch.json nx.json; rm -rf .nx
          TODAY=$(echo "${o:-[]}" | jq -c 'map(sub("^@qvac/";""))|sort')
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "lock=$(grep -cx pnpm-lock.yaml /tmp/changed.txt || true)" >> "$GITHUB_OUTPUT"
          if [ "$LANE" = stdin ]; then cp /tmp/changed.txt "$RUNNER_TEMP/nx-changed-files.txt"; fi
          echo "base=$B" >> "$GITHUB_OUTPUT"; echo "head=$H" >> "$GITHUB_OUTPUT"
      - id: m
        uses: ./.github/actions/nx-project-matrix
        with:
          target: on-pr
          base-ref: ${{ steps.d.outputs.base }}
          head-ref: ${{ steps.d.outputs.head }}
          config-ref: ${{ steps.d.outputs.base }}
      - name: Assert
        shell: bash
        env:
          T: ${{ matrix.target }}
          LANE: ${{ matrix.lane }}
          TODAY: ${{ steps.d.outputs.today }}
          LOCK: ${{ steps.d.outputs.lock }}
          ALLROWS: ${{ steps.m.outputs.allrows }}
        run: |
          set -euo pipefail
          NEW=$(echo "${ALLROWS:-[]}" | jq -c '[.[].package]|unique')
          echo "REAL $T/$LANE lockfile=$LOCK today=$(echo "$TODAY"|jq length) new=$(echo "$NEW"|jq length) $NEW"
          echo "  dropped vs today: $(jq -nc --argjson t "$TODAY" --argjson n "$NEW" '$t-$n')"
          echo "  added vs today:   $(jq -nc --argjson t "$TODAY" --argjson n "$NEW" '$n-$t')"
          SEVEN='["classification-ggml","embed-llamacpp","llm-llamacpp","model-fit","ocr-ggml","translation-nmtcpp","vla-ggml"]'
          ok() { echo "VERDICT $T/$LANE: PASS ($1)"; }; bad() { echo "::error::VERDICT $T/$LANE: FAIL - $1"; exit 1; }
          MORE=$(jq -nc --argjson t "$TODAY" --argjson n "$NEW" '$n-$t')
          [ "$MORE" = "[]" ] || bad "selected more than today: $MORE"
          case "$T" in
            f1c4648b0) [ "$NEW" = '["llm-llamacpp"]' ] && ok "llm alone, today $(echo "$TODAY"|jq length)" || bad "want [llm-llamacpp] got $NEW" ;;
            9d0914037|pr4733) [ "$NEW" = "$SEVEN" ] && ok "the 7 it touched, today $(echo "$TODAY"|jq length)" || bad "want the 7 got $NEW" ;;
            pr4570) [ "$NEW" = "$TODAY" ] && ok "unchanged, no lockfile" || bad "control moved: $TODAY -> $NEW" ;;
            *) [ "$(echo "$NEW"|jq length)" -ge 1 ] && ok "narrowed to what re-resolved, today $(echo "$TODAY"|jq length)" || bad "selected nothing for a real lockfile change" ;;
          esac

  apipath:
    name: api path pr${{ matrix.pr }}
    strategy:
      fail-fast: false
      matrix:
        pr: [4733, 4570]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: lts/*
      - name: API revisions vs git revisions give the same answer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          S=.github/actions/nx-project-matrix/lockfile-selection.mjs
          PRJ=$(gh api "repos/$REPO/pulls/$PR"); BASE_SHA=$(jq -r .base.sha <<<"$PRJ"); HEAD_SHA=$(jq -r .head.sha <<<"$PRJ")
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > /tmp/paths.txt
          raw() { gh api "repos/$REPO/contents/pnpm-lock.yaml?ref=$1" -H 'Accept: application/vnd.github.raw'; }
          MB=$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq '.merge_base_commit.sha')
          raw "$MB" > /tmp/api.base; raw "$HEAD_SHA" > /tmp/api.head
          API=$(node "$S" . /tmp/api.base /tmp/api.head < /tmp/paths.txt)
          git fetch -q origin "pull/$PR/head:refs/remotes/pr/$PR"
          echo "merge base: api=$MB git=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || git merge-base origin/main "$HEAD_SHA")"
          git show "$MB:pnpm-lock.yaml" > /tmp/git.base; git show "$HEAD_SHA:pnpm-lock.yaml" > /tmp/git.head
          GIT=$(node "$S" . /tmp/git.base /tmp/git.head < /tmp/paths.txt)
          echo "API $PR: $API"; echo "GIT $PR: $GIT"
          cmp -s /tmp/api.base /tmp/git.base && cmp -s /tmp/api.head /tmp/git.head && echo "lockfile bytes identical" || { echo "::error::API lockfile bytes differ from git"; exit 1; }
          [ "$API" = "$GIT" ] && echo "VERDICT api/$PR: PASS" || { echo "::error::VERDICT api/$PR: FAIL"; exit 1; }
