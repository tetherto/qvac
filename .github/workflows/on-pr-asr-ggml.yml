name: On PR Trigger (ASR GGML)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
    branches: [main, release-*, feature-*, tmp-*]
    paths:
      - "packages/asr-ggml/**"
      - ".github/workflows/*asr-ggml*.yml"

  workflow_dispatch:
    inputs:
      repository:
        description: "Repo to build (owner/name). Defaults to this repo."
        required: false
        type: string
      ref:
        description: "Git ref (branch/tag/SHA). Defaults to current ref."
        required: false
        type: string
      run_verify:
        description: "Run all CI stages (prebuild + integration)."
        required: false
        type: boolean
        default: true
      workdir:
        description: "Package working directory in monorepo."
        required: false
        type: string
        default: "packages/asr-ggml"

  workflow_call:
    inputs:
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      run_verify:
        required: false
        type: boolean
        default: true
      workdir:
        required: false
        type: string
        default: "packages/asr-ggml"

permissions:
  contents: read
  pull-requests: read
  packages: read
  checks: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fork-approval:
    permissions:
      statuses: write
    uses: ./.github/workflows/reusable-fork-approval.yml
  ci-router:
    name: CI Router (label detection)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_verified_checks: ${{ steps.route.outputs.run_verified_checks }}
      run_prebuilds: ${{ steps.route.outputs.run_prebuilds }}
      run_cpp_tests: ${{ steps.route.outputs.run_cpp_tests }}
      run_desktop: ${{ steps.route.outputs.run_desktop }}
      run_mobile: ${{ steps.route.outputs.run_mobile }}
      run_coload: ${{ steps.route.outputs.run_coload }}
    steps:
      - name: Checkout ci-router composite (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/ci-router
          sparse-checkout-cone-mode: false
      - name: Route CI stages
        id: route
        uses: ./.github/actions/ci-router

  authorize:
    needs: [fork-approval]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: read
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      - name: Checkout authorize-pr (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/authorize-pr
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Authorize
        id: auth
        uses: ./.github/actions/authorize-pr
        with:
          github-token: ${{ github.token }}

  context:
    needs: [authorize, fork-approval]
    if: needs.authorize.outputs.allowed == 'true'
    name: Resolve Context
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.ctx.outputs.repository }}
      ref: ${{ steps.ctx.outputs.ref }}
      base_sha: ${{ steps.ctx.outputs.base_sha }}
      head_sha: ${{ steps.ctx.outputs.head_sha }}
      run_verify: ${{ steps.ctx.outputs.run_verify }}
      workdir: ${{ steps.ctx.outputs.workdir }}
    steps:
      - id: ctx
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_WORKDIR: ${{ inputs.workdir }}
          INPUT_REPO: ${{ inputs.repository }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERIFY: ${{ inputs.run_verify }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "workflow_call" ]]; then
            workdir="${INPUT_WORKDIR:-packages/asr-ggml}"
            repo="${INPUT_REPO:-$REPO}"
            ref="${INPUT_REF:-$REF_NAME}"
            run_verify="$INPUT_VERIFY"
            base_sha="$SHA"
            head_sha="$SHA"
          else
            workdir="packages/asr-ggml"
            repo="$HEAD_REPO"
            ref="$HEAD_SHA"
            run_verify="true"
            base_sha="$BASE_SHA"
            head_sha="$HEAD_SHA"
          fi

          echo "repository=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "run_verify=$run_verify" >> "$GITHUB_OUTPUT"
          echo "workdir=$workdir" >> "$GITHUB_OUTPUT"

          echo "Resolved:"
          echo "  repo=$repo"
          echo "  ref=$ref"
          echo "  base_sha=$base_sha"
          echo "  head_sha=$head_sha"
          echo "  run_verify=$run_verify"
          echo "  workdir=$workdir"

  sanity-checks:
    if: needs.ci-router.outputs.run_verified_checks == 'true' && needs.authorize.outputs.allowed == 'true'
    needs:
      - fork-approval
      - authorize
      - context
      - ci-router
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          fetch-depth: 0

      - name: Run Sanity checks
        uses: ./.github/actions/sanity-checks
        with:
          secret-token: ${{ secrets.GITHUB_TOKEN }}
          pat-token: ${{ secrets.GITHUB_TOKEN }}
          run-integration: ${{ needs.authorize.outputs.allowed == 'true' }}
          workdir: ${{ needs.context.outputs.workdir }}

  cpp-lint:
    needs:
      - fork-approval
      - authorize
      - context
      - ci-router
    if: needs.ci-router.outputs.run_verified_checks == 'true' && needs.authorize.outputs.allowed == 'true'
    uses: ./.github/workflows/cpp-lint.yaml
    secrets: inherit
    with:
      sha: ${{ needs.context.outputs.base_sha }}
      pr_head_sha: ${{ needs.context.outputs.head_sha }}
      workdir: ${{ needs.context.outputs.workdir }}

  cpp-tests-coverage:
    permissions:
      contents: read
      packages: read
      checks: write
      pull-requests: write
      actions: read
      id-token: write
    needs:
      - fork-approval
      - authorize
      - context
      - ci-router
    if: needs.ci-router.outputs.run_cpp_tests == 'true' && needs.authorize.outputs.allowed == 'true'
    uses: ./.github/workflows/cpp-test-coverage-asr-ggml.yml
    secrets: inherit
    with:
      repository: ${{ needs.context.outputs.repository }}
      ref: ${{ needs.context.outputs.ref }}
      workdir: ${{ needs.context.outputs.workdir }}

  detect-native-changes:
    if: needs.ci-router.outputs.run_prebuilds == 'true' && (needs.authorize.outputs.allowed == 'true' || github.event_name == 'workflow_dispatch')
    needs:
      - fork-approval
      - authorize
      - ci-router
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      native_changed: ${{ steps.detect.outputs.native_changed }}
      native_hash: ${{ steps.detect.outputs.native_hash }}
    steps:
      - name: Checkout composite source (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Detect native file changes
        id: detect
        uses: ./.github/actions/detect-native-changes
        with:
          workdir: packages/asr-ggml

  prebuild-artifact-reuse:
    if: needs.detect-native-changes.outputs.native_changed == 'false'
    needs:
      - fork-approval
      - detect-native-changes
      - context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      reuse_hit: ${{ steps.reuse.outputs.reuse_hit }}
    steps:
      - name: Checkout prebuild-artifact-reuse composite (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/prebuild-artifact-reuse
          sparse-checkout-cone-mode: false
      - name: Reuse prebuilds from a prior run
        id: reuse
        uses: ./.github/actions/prebuild-artifact-reuse
        with:
          github-token: ${{ github.token }}
          workflow-file: on-pr-asr-ggml.yml
          native-hash: ${{ needs.detect-native-changes.outputs.native_hash }}
          pr-number: ${{ github.event.pull_request.number }}

  prebuild:
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    needs:
      - fork-approval
      - authorize
      - context
      - ci-router
      - detect-native-changes
      - prebuild-artifact-reuse
    if: |
      always() &&
      !cancelled() &&
      needs.ci-router.outputs.run_prebuilds == 'true' &&
      needs.authorize.outputs.allowed == 'true' &&
      (needs.detect-native-changes.outputs.native_changed == 'true' || needs.prebuild-artifact-reuse.outputs.reuse_hit != 'true')
    uses: ./.github/workflows/prebuilds-asr-ggml.yml
    secrets: inherit
    with:
      repository: ${{ needs.context.outputs.repository }}
      ref: ${{ needs.context.outputs.ref }}

  prebuild-artifact-save:
    if: always() && !cancelled() && needs.prebuild.result == 'success'
    needs:
      - fork-approval
      - prebuild
      - detect-native-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout prebuild-artifact-save composite (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/prebuild-artifact-save
          sparse-checkout-cone-mode: false
      - name: Save reuse marker
        uses: ./.github/actions/prebuild-artifact-save
        with:
          native-hash: ${{ needs.detect-native-changes.outputs.native_hash }}
          pr-number: ${{ github.event.pull_request.number }}

  run-integration-tests:
    permissions:
      contents: read
      packages: read
      id-token: write
    needs:
      - fork-approval
      - authorize
      - context
      - prebuild
      - prebuild-artifact-reuse
      - ci-router
    if: always() && !cancelled() && needs.ci-router.outputs.run_desktop == 'true' && needs.authorize.outputs.allowed == 'true' && (needs.prebuild.result == 'success' || needs.prebuild-artifact-reuse.outputs.reuse_hit == 'true')
    uses: ./.github/workflows/integration-test-asr-ggml.yml
    secrets: inherit
    with:
      repository: ${{ needs.context.outputs.repository }}
      ref: ${{ needs.context.outputs.ref }}
      workdir: ${{ needs.context.outputs.workdir }}

  # Mobile integration tests are no longer run on PRs. They run on demand via
  # `integration-mobile-test-asr-ggml.yml` (workflow_dispatch), where the
  # dispatcher must pick a specific device. The `run-mobile-addon-tests` label /
  # ci-router `run_mobile` output are kept for a possible future revival but no
  # longer trigger anything here. (Benchmark / weekend / on-merge mobile runs
  # are unaffected — they call the mobile workflow directly.)

  # ---------------------------------------------------------------------------
  # Co-load smoke: both legs resolve their co-resident addon set from
  # packages/ggml-coload-smoke/addons.js, which is keyed to PUBLISHED npm
  # packages. @qvac/asr-ggml is now released, so it carries the `asr-ggml` entry
  # and these jobs run for real; they stay gated by run-coload (and run_mobile)
  # like every other addon family.
  # ---------------------------------------------------------------------------
  coload-smoke:
    permissions:
      contents: read
      packages: read
      actions: read
    needs:
      - fork-approval
      - authorize
      - context
      - prebuild
      - prebuild-artifact-reuse
      - ci-router
    if: always() && !cancelled() && needs.ci-router.outputs.run_coload == 'true' && needs.authorize.outputs.allowed == 'true' && (needs.prebuild.result == 'success' || needs.prebuild-artifact-reuse.outputs.reuse_hit == 'true')
    uses: ./.github/workflows/coload-smoke.yml
    secrets: inherit
    with:
      addon: asr-ggml
      repository: ${{ needs.context.outputs.repository }}
      ref: ${{ needs.context.outputs.ref }}

  coload-smoke-mobile:
    permissions:
      actions: read
      id-token: write
      contents: read
      pull-requests: write
      packages: read
    needs:
      - fork-approval
      - authorize
      - context
      - prebuild
      - prebuild-artifact-reuse
      - ci-router
    if: always() && !cancelled() && needs.ci-router.outputs.run_coload == 'true' && needs.ci-router.outputs.run_mobile == 'true' && needs.authorize.outputs.allowed == 'true' && (needs.prebuild.result == 'success' || needs.prebuild-artifact-reuse.outputs.reuse_hit == 'true')
    uses: ./.github/workflows/coload-smoke-mobile.yml
    secrets: inherit
    with:
      addon: asr-ggml
      repository: ${{ needs.context.outputs.repository }}
      ref: ${{ needs.context.outputs.ref }}

  combine-unified-performance-report:
    # run-mobile-integration-tests removed — only desktop perf is combined on PRs now.
    needs:
      - fork-approval
      - context
      - run-integration-tests
      - ci-router
    if: always() && !cancelled() && (needs.ci-router.outputs.run_desktop == 'true' || needs.ci-router.outputs.run_mobile == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && needs.context.outputs.base_sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download desktop RTF artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: rtf-results-asr-ggml-*
          path: benchmark-artifacts/desktop
          merge-multiple: false

      - name: Download mobile performance artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: perf-report-asr-ggml-*
          path: benchmark-artifacts/mobile
          merge-multiple: false

      - name: Generate unified ASR GGML performance report
        run: |
          node scripts/perf-report/aggregate-asr-ggml-rtf.js \
            --dir benchmark-artifacts \
            --manual-dir packages/asr-ggml/benchmarks/manual-results \
            --output benchmark-artifacts/asr-ggml-unified-performance-report.md \
            --output-json benchmark-artifacts/asr-ggml-unified-performance-report.json \
            --output-html benchmark-artifacts/asr-ggml-unified-performance-report.html

      - name: Add unified performance summary
        run: |
          node -e "process.stdout.write(require('fs').readFileSync('benchmark-artifacts/asr-ggml-unified-performance-report.md', 'utf8'))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unified ASR GGML performance report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: asr-ggml-unified-performance-report
          path: |
            benchmark-artifacts/asr-ggml-unified-performance-report.md
            benchmark-artifacts/asr-ggml-unified-performance-report.json
            benchmark-artifacts/asr-ggml-unified-performance-report.html
          retention-days: 30

  publish-prebuild-status:
    # Posts qvac/prebuild-asr-ggml for Merge Guard's verify-prebuilds; mirrors this flow's build-status.
    needs: [prebuild, prebuild-artifact-reuse, ci-router]
    if: always() && !cancelled() && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      # Trusted base-branch checkout of only the prebuild-status scripts (never
      # PR head code), so publish logic is a single, unit-tested source.
      - name: Checkout prebuild-status scripts (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts/prebuild-status
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Publish prebuild status for Merge Guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREBUILD_RESULT: ${{ needs.prebuild.result }}
          REUSE_HIT: ${{ needs.prebuild-artifact-reuse.outputs.reuse_hit }}
          # A skipped prebuild is only a pass when ci-router succeeded and chose
          # not to build (no label); a skip from an upstream failure fails closed.
          CI_ROUTER_RESULT: ${{ needs.ci-router.result }}
          RUN_PREBUILDS: ${{ needs.ci-router.outputs.run_prebuilds }}
          # Stamps this on-pr run's URL into target_url so Merge Guard can reject a
          # status from a superseded (e.g. pre-label) run whose timestamp looks fresh.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONTEXT: qvac/prebuild-asr-ggml
        run: node .github/scripts/prebuild-status/publish.mjs

  merge-guard:
    # run-mobile-integration-tests removed — mobile is on-demand only now.
    needs: [authorize, ci-router, sanity-checks, cpp-lint, cpp-tests-coverage, prebuild, prebuild-artifact-reuse, prebuild-artifact-save, detect-native-changes, run-integration-tests, coload-smoke, coload-smoke-mobile, combine-unified-performance-report]
    if: always() && !cancelled()
    uses: ./.github/workflows/public-pr.yml
    with:
      sanity-checks-status: ${{ needs.sanity-checks.result == 'success' && (needs.cpp-lint.result == 'success' || needs.cpp-lint.result == 'skipped') && (needs.cpp-tests-coverage.result == 'success' || needs.cpp-tests-coverage.result == 'skipped') }}
      build-status: ${{ needs.prebuild.result == 'success' || needs.prebuild.result == 'skipped' || needs.prebuild-artifact-reuse.outputs.reuse_hit == 'true' }}
      # run-mobile-integration-tests removed — mobile is on-demand only now.
      integration-tests-status: ${{ (needs.run-integration-tests.result == 'success' || needs.run-integration-tests.result == 'skipped') && (needs.coload-smoke.result == 'success' || needs.coload-smoke.result == 'skipped') && (needs.coload-smoke-mobile.result == 'success' || needs.coload-smoke-mobile.result == 'skipped') && (needs.combine-unified-performance-report.result == 'success' || needs.combine-unified-performance-report.result == 'skipped') }}
