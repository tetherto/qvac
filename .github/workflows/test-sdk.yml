# QVAC SDK Tests
# Runs desktop, Electron, Snap, and/or mobile e2e tests for the SDK package
#
# Triggered via:
#   - workflow_dispatch: manual runs with full customizability
#   - workflow_call: called by on-pr-test-sdk.yml for label/release-branch triggers

name: QVAC Tests (sdk)

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Which platforms to test"
        type: choice
        options:
          - all
          - desktop
          - electron
          - snap
          - mobile
          - electron + desktop
          - desktop + mobile
          - electron + mobile
          - android
          - ios
        default: all
      suite:
        description: "Suite selection (full = all tests, smoke = smoke suite, custom = use suite-custom value)"
        type: choice
        options:
          - full
          - smoke
          - custom
        default: full
      suite-custom:
        description: "Custom suite value (only used when suite=custom). Comma-separated suite names."
        type: string
      exclude-suite:
        description: "Exclude suites (comma-separated, e.g. 'slow,flaky'). Tests tagged with these suites are skipped."
        type: string
      filter:
        description: "Test filter (comma-separated categories/prefixes, empty = all tests)"
        type: string
      desktop-consumer-timeout:
        description: "Desktop/Electron consumer timeout (seconds)"
        type: number
        default: 60
      mobile-consumer-timeout:
        description: "Mobile consumer timeout (seconds)"
        type: number
        default: 1200
      device-farm-timeout:
        description: "Device Farm session timeout (minutes)"
        type: number
        default: 90
      device-farm-start-timeout:
        description: "Minutes to wait for a device before failing. Kept short so a busy Device Farm fails fast instead of burning CI minutes."
        type: number
        default: 15
      android-device-pool:
        description: "Android device pool name to run on (empty = random AWS-available pool from SDK_ANDROID_DEVICE_FARM_POOLS)."
        type: string
        default: ""
      ios-device-pool:
        description: "iOS device pool name to run on (empty = random AWS-available pool from SDK_IOS_DEVICE_FARM_POOLS)."
        type: string
        default: ""
      desktop-platforms:
        description: "JSON array of runner labels for desktop tests"
        type: string
        default: '["qvac-win25-x64-gpu", "qvac-ubuntu2204-x64-gpu", "qvac-macos26-arm64-gpu"]'
      electron-platforms:
        description: "JSON array of runner labels for electron tests"
        type: string
        default: '["qvac-win25-x64-gpu", "qvac-ubuntu2204-x64-gpu", "qvac-macos26-arm64-gpu-gui"]'
      snap-platforms:
        description: "JSON array of Linux runner labels for strict Snap tests"
        type: string
        default: '["ubuntu-22.04"]'
      test-version:
        description: "Git ref to checkout for the tested project (branch, tag, or SHA). Defaults to current branch HEAD."
        type: string
      cache-models:
        description: "Cache downloaded models between runs"
        type: boolean
        default: true

  workflow_call:
    inputs:
      targets:
        description: "Which platforms to test"
        type: string
        default: "all"
      suite:
        description: "Resolved suite value: empty string = full, 'smoke', or custom comma-separated"
        type: string
      exclude-suite:
        description: "Exclude suites (comma-separated)"
        type: string
      filter:
        description: "Test filter (comma-separated categories/prefixes)"
        type: string
      desktop-consumer-timeout:
        type: number
        default: 60
      mobile-consumer-timeout:
        type: number
        default: 1200
      device-farm-timeout:
        type: number
        default: 90
      device-farm-start-timeout:
        type: number
        default: 15
      android-device-pool:
        type: string
        default: ""
      ios-device-pool:
        type: string
        default: ""
      desktop-platforms:
        type: string
        default: '["qvac-win25-x64-gpu", "qvac-ubuntu2204-x64-gpu", "qvac-macos26-arm64-gpu"]'
      electron-platforms:
        type: string
        default: '["qvac-win25-x64-gpu", "qvac-ubuntu2204-x64-gpu", "qvac-macos26-arm64-gpu-gui"]'
      test-version:
        type: string
      cache-models:
        type: boolean
        default: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  packages: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.resolve.outputs.suite }}
    steps:
      - name: Resolve suite
        id: resolve
        shell: bash
        run: |
          SUITE="${{ inputs.suite }}"
          if [ "$SUITE" = "full" ] || [ -z "$SUITE" ]; then
            echo "suite=" >> "$GITHUB_OUTPUT"
          elif [ "$SUITE" = "custom" ]; then
            echo "suite=${{ inputs.suite-custom }}" >> "$GITHUB_OUTPUT"
          else
            echo "suite=$SUITE" >> "$GITHUB_OUTPUT"
          fi

  desktop-tests:
    needs: resolve
    if: inputs.targets == 'all' || inputs.targets == 'desktop' || inputs.targets == 'electron + desktop' || inputs.targets == 'desktop + mobile'
    uses: ./.github/workflows/test-node-sdk.yml
    with:
      consumer: desktop
      project-directory: "packages/sdk"
      working-directory: "packages/sdk/e2e"
      platforms: ${{ inputs.desktop-platforms || '["qvac-win25-x64-gpu", "qvac-ubuntu2204-x64-gpu", "qvac-macos26-arm64-gpu"]' }}
      consumer-timeout: ${{ fromJSON(inputs.desktop-consumer-timeout || '60') }}
      filter: ${{ inputs.filter }}
      suite: ${{ needs.resolve.outputs.suite }}
      exclude-suite: ${{ inputs.exclude-suite }}
      test-version: ${{ inputs.test-version || '' }}
      cache-models: ${{ inputs.cache-models }}
    secrets: inherit

  electron-tests:
    needs: resolve
    # Electron CI is manual-only for now. `workflow_call` callers such as
    # on-pr-test-sdk.yml keep their existing desktop + mobile behavior.
    if: github.event_name == 'workflow_dispatch' && (inputs.targets == 'all' || inputs.targets == 'electron' || inputs.targets == 'electron + desktop' || inputs.targets == 'electron + mobile')
    uses: ./.github/workflows/test-node-sdk.yml
    with:
      consumer: electron
      project-directory: "packages/sdk"
      working-directory: "packages/sdk/e2e"
      platforms: ${{ inputs.electron-platforms || '["qvac-win25-x64-gpu", "qvac-ubuntu2204-x64-gpu", "qvac-macos26-arm64-gpu-gui"]' }}
      consumer-timeout: ${{ fromJSON(inputs.desktop-consumer-timeout || '60') }}
      filter: ${{ inputs.filter }}
      suite: ${{ needs.resolve.outputs.suite }}
      exclude-suite: ${{ inputs.exclude-suite }}
      test-version: ${{ inputs.test-version || '' }}
      cache-models: ${{ inputs.cache-models }}
    secrets: inherit

  snap-tests:
    needs: resolve
    # Snap CI is manual-only. It is intentionally excluded from workflow_call
    # consumers such as on-pr-test-sdk.yml.
    if: github.event_name == 'workflow_dispatch' && (inputs.targets == 'all' || inputs.targets == 'snap')
    uses: ./.github/workflows/test-node-sdk.yml
    with:
      consumer: snap
      project-directory: "packages/sdk"
      working-directory: "packages/sdk/e2e"
      platforms: ${{ inputs.snap-platforms || '["ubuntu-22.04"]' }}
      consumer-timeout: ${{ fromJSON(inputs.desktop-consumer-timeout || '60') }}
      filter: ${{ inputs.filter }}
      suite: ${{ needs.resolve.outputs.suite }}
      exclude-suite: ${{ inputs.exclude-suite }}
      test-version: ${{ inputs.test-version || '' }}
      cache-models: ${{ inputs.cache-models }}
    secrets: inherit

  android-tests:
    needs: resolve
    permissions:
      actions: read
      id-token: write
      contents: read
      pull-requests: write
      packages: read
    if: inputs.targets == 'all' || inputs.targets == 'mobile' || inputs.targets == 'android' || inputs.targets == 'desktop + mobile' || inputs.targets == 'electron + mobile'
    uses: ./.github/workflows/test-android-sdk.yml
    with:
      project-directory: "packages/sdk"
      working-directory: "packages/sdk/e2e"
      consumer-timeout: ${{ fromJSON(inputs.mobile-consumer-timeout || '1200') }}
      filter: ${{ inputs.filter }}
      suite: ${{ needs.resolve.outputs.suite }}
      exclude-suite: ${{ inputs.exclude-suite }}
      device-farm-timeout: ${{ fromJSON(inputs.device-farm-timeout || '90') }}
      device-farm-start-timeout: ${{ fromJSON(inputs.device-farm-start-timeout || '15') }}
      device-farm-project-arn: ${{ vars.SDK_DEVICE_FARM_PROJECT_ARN }}
      device-pools: ${{ vars.SDK_ANDROID_DEVICE_FARM_POOLS }}
      device-pool-name: ${{ inputs.android-device-pool }}
      test-version: ${{ inputs.test-version || '' }}
    secrets: inherit

  ios-tests:
    needs: resolve
    permissions:
      actions: read
      id-token: write
      contents: read
      pull-requests: write
      packages: read
    if: inputs.targets == 'all' || inputs.targets == 'mobile' || inputs.targets == 'ios' || inputs.targets == 'desktop + mobile' || inputs.targets == 'electron + mobile'
    uses: ./.github/workflows/test-ios-sdk.yml
    with:
      project-directory: "packages/sdk"
      working-directory: "packages/sdk/e2e"
      consumer-timeout: ${{ fromJSON(inputs.mobile-consumer-timeout || '1200') }}
      filter: ${{ inputs.filter }}
      suite: ${{ needs.resolve.outputs.suite }}
      exclude-suite: ${{ inputs.exclude-suite }}
      device-farm-timeout: ${{ fromJSON(inputs.device-farm-timeout || '90') }}
      device-farm-start-timeout: ${{ fromJSON(inputs.device-farm-start-timeout || '15') }}
      device-farm-project-arn: ${{ vars.SDK_DEVICE_FARM_PROJECT_ARN }}
      ios-device-pools: ${{ vars.SDK_IOS_DEVICE_FARM_POOLS }}
      device-pool-name: ${{ inputs.ios-device-pool }}
      test-version: ${{ inputs.test-version || '' }}
    secrets: inherit
