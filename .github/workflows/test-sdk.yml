# QVAC SDK Tests
# Runs desktop and/or mobile (Android/iOS) e2e tests for the SDK package
#
# Triggered via:
#   - workflow_dispatch: manual runs with full customizability
#   - workflow_call: called by on-pr-test-sdk.yml for label/release-branch triggers

name: QVAC Tests (sdk)

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Which platforms to test"
        type: choice
        options:
          - all
          - desktop
          - mobile
          - android
          - ios
        default: all
      suite:
        description: "Suite selection (full = all tests, smoke = smoke suite, custom = use suite-custom value)"
        type: choice
        options:
          - full
          - smoke
          - custom
        default: full
      suite-custom:
        description: "Custom suite value (only used when suite=custom). Comma-separated suite names."
        type: string
      exclude-suite:
        description: "Exclude suites (comma-separated, e.g. 'slow,flaky'). Tests tagged with these suites are skipped."
        type: string
      filter:
        description: "Test filter (comma-separated categories/prefixes, empty = all tests)"
        type: string
      desktop-consumer-timeout:
        description: "Desktop consumer timeout (seconds)"
        type: number
        default: 60
      mobile-consumer-timeout:
        description: "Mobile consumer timeout (seconds)"
        type: number
        default: 1200
      device-farm-timeout:
        description: "Device Farm session timeout (minutes)"
        type: number
        default: 90
      desktop-platforms:
        description: "JSON array of runner labels for desktop tests (empty = default GPU desktop matrix)"
        type: string
        default: ""
      test-version:
        description: "Git ref to checkout for the tested project (branch, tag, or SHA). Defaults to current branch HEAD."
        type: string
      cache-models:
        description: "Cache downloaded models between runs"
        type: boolean
        default: true

  workflow_call:
    inputs:
      targets:
        description: "Which platforms to test"
        type: string
        default: "all"
      suite:
        description: "Resolved suite value: empty string = full, 'smoke', or custom comma-separated"
        type: string
      exclude-suite:
        description: "Exclude suites (comma-separated)"
        type: string
      filter:
        description: "Test filter (comma-separated categories/prefixes)"
        type: string
      desktop-consumer-timeout:
        type: number
        default: 60
      mobile-consumer-timeout:
        type: number
        default: 1200
      device-farm-timeout:
        type: number
        default: 90
      desktop-platforms:
        type: string
        default: ""
      test-version:
        type: string
      cache-models:
        type: boolean
        default: true




# Canonical runner labels — .github/actions/runner-names/runners.yaml
env:
  RN_ORCH: ubuntu-latest
  RN_U22: ubuntu-22.04
  RN_U24: ubuntu-24.04
  RN_U22_ARM: ubuntu-22.04-arm
  RN_U24_ARM: ubuntu-24.04-arm
  RN_MAC14: macos-14
  RN_MAC14_XL: macos-14-xlarge
  RN_MAC15: macos-15
  RN_MAC15_INTEL: macos-15-intel
  RN_MAC15_LG: macos-15-large
  RN_MAC15_XL: macos-15-xlarge
  RN_WIN22: windows-2022
  RN_WIN25: windows-2025
  RN_QVAC_U22: qvac-ubuntu2204-x64
  RN_QVAC_U22_GPU: qvac-ubuntu2204-x64-gpu
  RN_QVAC_U24: qvac-ubuntu2404-x64
  RN_QVAC_U24_GPU: qvac-ubuntu2404-x64-gpu
  RN_QVAC_WIN25: qvac-win25-x64
  RN_QVAC_WIN25_GPU: qvac-win25-x64-gpu
  RN_AI_LINUX: ai-run-linux
  RN_AI_LINUX_GPU: ai-run-linux-gpu
  RN_AI_U22: ai-run-ubuntu-22.04
  RN_AI_WIN11_GPU: ai-run-windows11-gpu
  RN_GEN_WIN11: generator-windows11
  RN_MINI_M4: mac-mini-m4
  RN_MINI_M4_GPU: mac-mini-m4-gpu
  RN_LBL_U22_X64: ubuntu-22.04-x64
  RN_LBL_U22_X64_GPU: ubuntu-22.04-x64-gpu
  RN_LBL_U24_X64: ubuntu-24.04-x64
  RN_LBL_U24_X64_GPU: ubuntu-24.04-x64-gpu
  RN_LBL_U24_ARM64: ubuntu-24.04-arm64
  RN_LBL_WIN22_X64: windows-2022-x64
  RN_LBL_WIN25_X64: windows-2025-x64
  RN_LBL_WIN25_X64_GPU: windows-2025-x64-gpu

permissions:
  actions: read
  contents: read
  pull-requests: write
  packages: read

jobs:
  resolve:
    runs-on: ${{ env.RN_ORCH }}
    outputs:
      suite: ${{ steps.resolve.outputs.suite }}
    steps:
      - name: Resolve suite
        id: resolve
        shell: bash
        run: |
          SUITE="${{ inputs.suite }}"
          if [ "$SUITE" = "full" ] || [ -z "$SUITE" ]; then
            echo "suite=" >> "$GITHUB_OUTPUT"
          elif [ "$SUITE" = "custom" ]; then
            echo "suite=${{ inputs.suite-custom }}" >> "$GITHUB_OUTPUT"
          else
            echo "suite=$SUITE" >> "$GITHUB_OUTPUT"
          fi

  desktop-tests:
    needs: resolve
    if: inputs.targets != 'mobile' && inputs.targets != 'android' && inputs.targets != 'ios'
    uses: ./.github/workflows/test-desktop-sdk.yml
    with:
      project-directory: "packages/sdk"
      working-directory: "packages/sdk/e2e"
      platforms: ${{ inputs.desktop-platforms != '' && inputs.desktop-platforms || format('["{0}","{1}","{2}"]', env.RN_QVAC_WIN25_GPU, env.RN_QVAC_U22_GPU, env.RN_MINI_M4_GPU) }}
      consumer-timeout: ${{ fromJSON(inputs.desktop-consumer-timeout || '60') }}
      filter: ${{ inputs.filter }}
      suite: ${{ needs.resolve.outputs.suite }}
      exclude-suite: ${{ inputs.exclude-suite }}
      test-version: ${{ inputs.test-version || '' }}
      cache-models: ${{ inputs.cache-models }}
    secrets: inherit

  android-tests:
    needs: resolve
    permissions:
      actions: read
      id-token: write
      contents: read
      pull-requests: write
      packages: read
    if: inputs.targets != 'desktop' && inputs.targets != 'ios'
    uses: ./.github/workflows/test-android-sdk.yml
    with:
      project-directory: "packages/sdk"
      working-directory: "packages/sdk/e2e"
      consumer-timeout: ${{ fromJSON(inputs.mobile-consumer-timeout || '1200') }}
      filter: ${{ inputs.filter }}
      suite: ${{ needs.resolve.outputs.suite }}
      exclude-suite: ${{ inputs.exclude-suite }}
      device-farm-timeout: ${{ fromJSON(inputs.device-farm-timeout || '90') }}
      device-farm-project-arn: ${{ vars.SDK_DEVICE_FARM_PROJECT_ARN }}
      device-pools: ${{ vars.SDK_DEVICE_FARM_POOLS }}
      test-version: ${{ inputs.test-version || '' }}
    secrets: inherit

  ios-tests:
    needs: resolve
    permissions:
      actions: read
      id-token: write
      contents: read
      pull-requests: write
      packages: read
    if: inputs.targets != 'desktop' && inputs.targets != 'android'
    uses: ./.github/workflows/test-ios-sdk.yml
    with:
      project-directory: "packages/sdk"
      working-directory: "packages/sdk/e2e"
      consumer-timeout: ${{ fromJSON(inputs.mobile-consumer-timeout || '1200') }}
      filter: ${{ inputs.filter }}
      suite: ${{ needs.resolve.outputs.suite }}
      exclude-suite: ${{ inputs.exclude-suite }}
      device-farm-timeout: ${{ fromJSON(inputs.device-farm-timeout || '90') }}
      device-farm-project-arn: ${{ vars.SDK_DEVICE_FARM_PROJECT_ARN }}
      ios-device-pools: ${{ vars.SDK_IOS_DEVICE_FARM_POOLS }}
      test-version: ${{ inputs.test-version || '' }}
    secrets: inherit
