name: QVAC Inference Pear e2e

# Runs @qvac/inference in a Pear app's in-process Bare thread on the latest
# pear-runtime and Bare. Gates publish-inference.yml.

on:
  workflow_call:
    inputs:
      dist-artifact:
        description: "Name of an artifact from this run that holds packages/inference/dist. Empty builds dist from source."
        required: false
        type: string
        default: ""
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/inference/e2e/pear/**"
      - ".github/workflows/test-inference-pear-e2e.yml"

env:
  WORKDIR: packages/inference

permissions:
  contents: read

jobs:
  pear-e2e:
    name: Pear e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
        with:
          node-version: 22

      # Software Vulkan driver for the llama.cpp addon on a GPU-less runner.
      - name: Linux - install Vulkan drivers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - name: Download inference dist artifact
        if: inputs.dist-artifact != ''
        uses: ./.github/actions/download-release-artifact
        with:
          name: ${{ inputs.dist-artifact }}
          path: ${{ env.WORKDIR }}/dist/

      - name: Build inference
        if: inputs.dist-artifact == ''
        working-directory: ${{ env.WORKDIR }}
        run: npm install --ignore-scripts && npm run build

      - name: Run Pear e2e against the latest pear-runtime and Bare
        working-directory: ${{ env.WORKDIR }}
        run: node e2e/pear/run.mjs
