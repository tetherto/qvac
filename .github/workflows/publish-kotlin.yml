name: Publish SDK Kotlin

# The Kotlin SDK's Maven repository at @qvac/sdk's version, after the release gates and the standalone Maven consumers:
# release-assets attaches one zip per Android runtime profile, plus the JVM client, to the sdk-v<version> release that
# publish-npm.yml creates; central stages on Maven Central (publishes with release_central).
on:
  push:
    tags:
      - 'sdk-kotlin-v*'
  workflow_dispatch:
    inputs:
      destination:
        description: Where to publish (Central stages for review by default)
        type: choice
        options: [release-assets, central]
        default: release-assets
      tag:
        description: "release-assets only: existing release tag to attach to (default sdk-v<version in packages/sdk/package.json>). The checked-out revision must carry that version."
        required: false
        type: string
      release_central:
        description: Publish Central deployment publicly and wait for PUBLISHED
        type: boolean
        default: false
  workflow_call:
    inputs:
      destination:
        description: release-assets or central
        required: false
        default: release-assets
        type: string
      version:
        description: "Published SDK version; the release tag is sdk-v<version>"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-kotlin-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: packages/sdk-kotlin

jobs:
  publish:
    name: Verify and publish Maven artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    steps:
      - name: Checkout source
        uses: tetherto/qvac-actions/checkout@f8e0afb2e5c51b94abdef6bea77caa4a9fb3adaf # 0.6.0
        with:
          persist-credentials: false
      - name: Resolve destination, version and tag
        id: target
        shell: bash
        env:
          IN_DESTINATION: ${{ inputs.destination }}
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          destination="${IN_DESTINATION:-release-assets}"
          version="${IN_VERSION:-}"
          if [ -z "$version" ]; then
            version="$(python3 -c 'import json; print(json.load(open("../sdk/package.json"))["version"])')"
          fi
          tag="${IN_TAG:-sdk-v${version}}"
          {
            echo "destination=${destination}"
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"
          echo "destination=${destination} version=${version} tag=${tag}"
      - name: Verify release tag version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: test "$GITHUB_REF_NAME" = "sdk-kotlin-v$VERSION"
      # The assets are built from this revision, so its version must be the one the tag names, and the release must exist.
      - name: Verify the release the assets attach to
        if: steps.target.outputs.destination == 'release-assets'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.target.outputs.version }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          kotlin_version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [ "$kotlin_version" != "$VERSION" ] || [ "$TAG" != "sdk-v$VERSION" ]; then
            echo "::error::sdk-kotlin ${kotlin_version} at ${GITHUB_SHA} does not match release tag ${TAG}"
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName
      - uses: tetherto/qvac-actions/setup-python@f8e0afb2e5c51b94abdef6bea77caa4a9fb3adaf # 0.6.0
        with:
          python-version: '3.10'
      - uses: tetherto/qvac-actions/setup-node@f8e0afb2e5c51b94abdef6bea77caa4a9fb3adaf # 0.6.0
        with:
          node-version: "22"
      - uses: tetherto/qvac-actions/setup-java@f8e0afb2e5c51b94abdef6bea77caa4a9fb3adaf # 0.6.0
        with:
          java-version: "17"
      - uses: tetherto/qvac-actions/setup-android@f8e0afb2e5c51b94abdef6bea77caa4a9fb3adaf # 0.6.0
      - name: Install Android NDK
        run: sdkmanager 'ndk;29.0.14206865'

      - name: Verify release gates
        run: >-
          ./gradlew --no-daemon
          checkVersionAlignment
          checkContract
          verifyPublishedWorker
          jvmTest
          :android-example:testDebugUnitTest
          :android-example:checkDebugBuild
          :android-example:compileDebugAndroidTestKotlin

      - name: Verify all artifacts through standalone Maven consumers
        run: |
          ./gradlew --no-daemon verifyMavenPublications
          ./scripts/verify-maven-consumers.sh

      # A zip records no commit and a rebuild is not byte-identical, so a re-run replaces the assets.
      - name: Attach Maven zips to the GitHub release
        if: steps.target.outputs.destination == 'release-assets'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.target.outputs.version }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          ./scripts/package-release-assets.sh "$VERSION"
          gh release upload "$TAG" build/release-assets/*-maven.zip "build/release-assets/qvac-sdk-kotlin-$VERSION-SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Stage or publish to Maven Central
        if: steps.target.outputs.destination == 'central'
        shell: bash
        run: |
          if [[ "$RELEASE_CENTRAL" == true ]]; then
            ./gradlew --no-daemon publishAndReleaseToMavenCentral
          else
            ./gradlew --no-daemon publishToMavenCentral
          fi
        env:
          # Manual dispatch stages unless explicitly authorized to release.
          RELEASE_CENTRAL: ${{ inputs.release_central || github.event_name != 'workflow_dispatch' }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.KOTLIN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.KOTLIN_CENTRAL_PASSWORD }}
          MAVEN_SIGNING_KEY: ${{ secrets.KOTLIN_MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.KOTLIN_MAVEN_SIGNING_PASSWORD }}
