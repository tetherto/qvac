name: Select projects

# The only place that reads packages' CI settings, always from the trusted ref.
on:
  workflow_call:
    inputs:
      targets:
        description: Comma-separated targets to return a matrix for
        type: string
        required: true
      packages:
        description: Comma-separated package names or directories; empty selects by change
        type: string
        default: ""
      combine:
        description: Extra matrices for targets sharing a job, e.g. desktop=test:integration+test:backend
        type: string
        default: ""
      configs:
        description: Comma-separated configurations to keep, e.g. ios-arm64; empty keeps every configuration
        type: string
        default: ""
      labels:
        description: Comma-separated labels that route test:integration configurations outside a pull request
        type: string
        default: ""
      tags:
        description: Comma-separated Nx tags of the package groups to select
        type: string
        default: ci:addons
      released-providers:
        description: Build consumers against their providers' released npm packages, not the providers' source
        type: boolean
        default: false
      all-on:
        description: Comma-separated path globs whose change selects every tagged package, e.g. shared CI files
        type: string
        default: ""
      event:
        description: A pull_request event payload rebuilt from the API, for a workflow_run build; empty reads the run's own
        type: string
        default: ""
    outputs:
      matrices:
        description: JSON object of target to matrix rows
        value: ${{ jobs.select.outputs.matrices }}
      projects:
        description: JSON array of selected packages with their status key
        value: ${{ jobs.select.outputs.projects }}
      runners:
        description: JSON map of reusable-runner-names.yml runner key to label
        value: ${{ jobs.select.outputs.runners }}
      any:
        description: true when any package was selected
        value: ${{ jobs.select.outputs.any }}
      base:
        description: The commit the selection compared from, a merge base for a PR; empty when nothing was compared
        value: ${{ jobs.select.outputs.base }}
      head:
        description: The commit the selection compared to; empty when nothing was compared
        value: ${{ jobs.select.outputs.head }}

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrices: ${{ steps.select.outputs.matrices }}
      projects: ${{ steps.select.outputs.projects }}
      runners: ${{ steps.select.outputs.runners }}
      any: ${{ steps.select.outputs.any }}
      base: ${{ steps.select.outputs.base }}
      head: ${{ steps.select.outputs.head }}
    steps:
      # Actions and settings both come from here, so this is a full checkout of the trusted ref. On a PR event or a
      # workflow_run that is the default branch, so a PR's own project.json can never change which of its checks run.
      - name: Checkout actions and settings
        uses: tetherto/qvac-actions/checkout@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          ref: ${{ startsWith(github.event_name, 'pull_request') && github.event.repository.default_branch || '' }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: tetherto/qvac-actions/setup-node@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
        with:
          node-version: lts/*
      - uses: tetherto/qvac-actions/setup-pnpm@342190a4e25a97f70169424e81ab149fd447aace # 0.7.0
      - shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts --filter .
      - id: select
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
          PACKAGES: ${{ inputs.packages }}
          COMBINE: ${{ inputs.combine }}
          CONFIGS: ${{ inputs.configs }}
          LABELS: ${{ inputs.labels }}
          TAGS: ${{ inputs.tags }}
          RELEASED_PROVIDERS: ${{ inputs.released-providers }}
          ALL_ON: ${{ inputs.all-on }}
          PR_EVENT: ${{ inputs.event }}
          NX_DAEMON: "false"
          NX_NO_CLOUD: "true"
        run: node .github/scripts/select-projects.mjs
