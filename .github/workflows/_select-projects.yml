name: Select projects

# The only place that reads packages' CI settings, always from the trusted ref.
on:
  workflow_call:
    inputs:
      targets:
        description: Comma-separated targets to return a matrix for
        type: string
        required: true
      packages:
        description: Comma-separated package names or directories; empty selects by change
        type: string
        default: ""
      combine:
        description: Extra matrices for targets sharing a job, e.g. desktop=test:integration+test:backend
        type: string
        default: ""
      configs:
        description: Comma-separated configurations to keep, e.g. ios-arm64; empty keeps every configuration
        type: string
        default: ""
      labels:
        description: Comma-separated labels that route test:integration configurations outside a pull request
        type: string
        default: ""
      tags:
        description: Comma-separated Nx tags of the package groups to select
        type: string
        default: ci:addons
    outputs:
      matrices:
        description: JSON object of target to matrix rows
        value: ${{ jobs.select.outputs.matrices }}
      projects:
        description: JSON array of selected packages with their gate key
        value: ${{ jobs.select.outputs.projects }}
      runners:
        description: JSON map of reusable-runner-names.yml runner key to label
        value: ${{ jobs.select.outputs.runners }}
      any:
        description: true when any package was selected
        value: ${{ jobs.select.outputs.any }}
      base:
        description: The commit the selection compared from, a merge base for a PR; empty when nothing was compared
        value: ${{ jobs.select.outputs.base }}
      head:
        description: The commit the selection compared to; empty when nothing was compared
        value: ${{ jobs.select.outputs.head }}

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrices: ${{ steps.select.outputs.matrices }}
      projects: ${{ steps.select.outputs.projects }}
      runners: ${{ steps.select.outputs.runners }}
      any: ${{ steps.select.outputs.any }}
      base: ${{ steps.select.outputs.base }}
      head: ${{ steps.select.outputs.head }}
    steps:
      # Actions and settings both come from here, so this is a full checkout of the trusted ref. On any PR event that is
      # the default branch, so a PR's own project.json can never change which of its checks run.
      - name: Checkout actions and settings
        uses: tetherto/qvac-actions/checkout@f8e0afb2e5c51b94abdef6bea77caa4a9fb3adaf # 0.6.0
        with:
          ref: ${{ github.event.pull_request && github.event.repository.default_branch || '' }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: tetherto/qvac-actions/setup-node@f8e0afb2e5c51b94abdef6bea77caa4a9fb3adaf # 0.6.0
        with:
          node-version: lts/*
      - uses: tetherto/qvac-actions/setup-pnpm@f8e0afb2e5c51b94abdef6bea77caa4a9fb3adaf # 0.6.0
      - shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts --filter .
      - id: select
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
          PACKAGES: ${{ inputs.packages }}
          COMBINE: ${{ inputs.combine }}
          CONFIGS: ${{ inputs.configs }}
          LABELS: ${{ inputs.labels }}
          TAGS: ${{ inputs.tags }}
          NX_DAEMON: "false"
          NX_NO_CLOUD: "true"
        run: node .github/scripts/select-projects.mjs
