name: SDK e2e model cache
description: |
  Caches SDK e2e models one actions/cache entry per model, from a plan written by
  packages/sdk-e2e/scripts/model-cache-plan.mjs. Keys are `<key-prefix>-<contentId>`, a digest of
  the registry sha256 of the model's files, recomputed here from the plan.

  `restore` writes `<plan>.restore.json` for a later `save` in the same job. `save` runs only on
  push, schedule, workflow_dispatch and merge_group, and only uploads files whose sha256 matches
  the registry.

  The runner executes dist/. After editing src/, run `npm ci && npm run build` and commit dist/.

inputs:
  mode:
    description: "`restore` or `save`."
    required: true
  plan:
    description: Path to the model-cache plan JSON.
    required: true
  key-prefix:
    description: Bump the version suffix to invalidate every entry.
    required: false
    default: sdk-e2e-model-v1
  lookup-only:
    description: "`restore` only: check which entries exist without downloading them."
    required: false
    default: "false"
  fail-on-save-error:
    description: "`save` only: fail when a planned entry could not be saved (the seed sets it)."
    required: false
    default: "false"
  concurrency:
    description: Entries transferred at once.
    required: false
    default: "4"

outputs:
  hits:
    description: Entries restored (or present, with lookup-only).
  misses:
    description: Entries the cache did not have.
  complete:
    description: "'true' when nothing is left to download."
  missing-models:
    description: JSON array of model constants left to download, for QVAC_E2E_BOOTSTRAP_MODELS.
  saved:
    description: Entries a save uploaded.

runs:
  using: node24
  main: dist/index.mjs
