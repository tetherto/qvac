name: "Setup CUDA toolkit for nvcc compile"
description: >-
  Assembles a pinned CUDA toolkit from NVIDIA's redistributable component
  archives on a linux runner, x64 or arm64, and exports
  CUDA_PATH/CUDACXX/PATH(bin)/VCPKG_KEEP_ENV_VARS/LD_LIBRARY_PATH so a
  consumer's speech-cpp cuda feature can compile the ggml CUDA backend.
  Component tarballs are used instead of the runfile installer because the
  installer hardcodes /tmp/cuda-installer.log and segfaults for every runner
  user on a shared host after the first user's install ("Log file not open.").
  No NVIDIA GPU is required on the runner (compile-only). The CUDA backend
  ships as a runtime-loaded module: the prebuild loads on any host, and CUDA
  engages only where the NVIDIA driver and CUDA runtime libraries are present.

inputs:
  cuda-version:
    description: >-
      CUDA release the pinned component list below belongs to. Informational
      and part of the cache key; changing the components means updating the
      COMPONENTS list in this action, from
      https://developer.download.nvidia.com/compute/cuda/redist/redistrib_<version>.json.

      QVAC-24470: this is deliberately NOT the newest release. Read the PTX note
      on the COMPONENTS block before bumping it.
    required: false
    default: "13.0.3"

runs:
  using: composite
  steps:
    # The key does NOT track COMPONENTS, so bump the suffix by hand when that
    # list changes or a stale toolkit is restored and the sha256-verified
    # assemble below is skipped.
    #
    # QVAC-24442: runner.arch is part of the key. GitHub scopes a cache by repo
    # and ref, not by architecture, so without it an arm64 job would restore the
    # x86_64 toolkit and fail with an exec format error deep in the build.
    #
    # Restore and save are split so only trusted events write.
    # `pull_request_target` runs with GITHUB_REF on the base branch, so a
    # combined `actions/cache` let any authorized PR populate the entry that
    # main's privileged runs then restore, and cpp-lint reaches here with no
    # label at all. r1 -> r2 because splitting only stops new writes; rotating
    # makes whatever the old lane already wrote unreachable.
    - name: Restore CUDA toolkit
      id: cache-cuda
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ runner.temp }}/cuda
        key: cuda-redist-${{ inputs.cuda-version }}-${{ runner.arch }}-r3

    - name: Download + verify + assemble CUDA toolkit
      if: steps.cache-cuda.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # Pinned against redistrib_13.0.3.json (supply-chain pin: a silent
        # re-upload fails the sha256 check). nvcc + libnvvm (cicc lives
        # there in the 13.x split) + crt + cudart + cccl + culibos + cublas
        # is the minimal set that compiles and links the ggml CUDA backend;
        # the runtime-loaded module resolves cudart and cuBLAS from the
        # host at run time.
        #
        # QVAC-24442: NVIDIA calls the arm64 build "sbsa". It is a native
        # toolkit, not a cross-compiler, so it only runs on an arm64 runner.
        # THROWAWAY BRANCH, QVAC-24470 Jetson probe. arm64 is switched to the
        # linux-aarch64 CUDA 12.6.3 toolkit instead of linux-sbsa CUDA 13.
        #
        # linux-aarch64 is NVIDIA's Jetson/L4T distribution and linux-sbsa is the
        # server ARM one. They are different products, not two names for arm64.
        # CUDA 13.0.3 publishes NO linux-aarch64 at all, only sbsa and x86_64,
        # which is the upstream half of why an Orin cannot run our shipped module:
        # it caps at CUDA 12.6 and we build against 13.
        #
        # This branch exists to answer one question before any of the two-module
        # CI machinery gets built: does a CUDA 12 aarch64 build actually load and
        # run on the Orin? Everything about that is inference so far.
        case "$(uname -m)" in
          x86_64)  REDIST_ARCH=linux-x86_64 ;;
          aarch64) REDIST_ARCH=linux-aarch64 ;;
          *) echo "::error::setup-cuda: no CUDA redist for $(uname -m)"; exit 1 ;;
        esac
        echo "Assembling the $REDIST_ARCH toolkit"

        # QVAC-24470: PINNED TO 13.0.3 ON PURPOSE. DO NOT BUMP TO THE NEWEST.
        #
        # A card with no -real entry in CMAKE_CUDA_ARCHITECTURES runs from the
        # -virtual PTX, and the DRIVER, not the runtime, JITs that PTX. A driver
        # only accepts PTX from its own release or older, so the nvcc used here
        # sets the minimum driver version every such card needs.
        #
        # Measured 2026-09-03 on both DGX Spark boxes, GB10 sm_121, driver
        # 580.173.02, with a 13.2.51 build:
        #
        #   CUDA error: the provided PTX was compiled with an unsupported toolchain
        #     in ggml_cuda_kernel_can_use_pdl, cudaFuncGetAttributes
        #   [exit 134]
        #
        # sm_121 is above every entry in the arm64 tier, so it had to JIT, and
        # the driver refused PTX newer than itself. That box has CUDA 13.3
        # installed and it made no difference: a runtime library and the driver's
        # PTX JIT are separate things.
        #
        # 13.0.3 ships cuda_cudart 13.0.96, which is exactly what those boxes
        # carry, so its PTX is what their driver was built to take. Going older
        # is not free either: sm_120a needs CUDA 13, so 12.x would drop the 5090.
        #
        # Bumping this is a COMPATIBILITY decision, not a chore. It raises the
        # minimum driver for every JIT-served card, and nothing in CI catches it
        # because the runners' drivers are new. Re-run the arch sweep on the
        # Spark boxes before changing it.
        COMPONENTS_linux_x86_64="\
        cuda_nvcc/linux-x86_64/cuda_nvcc-linux-x86_64-13.0.88-archive.tar.xz 48e35be3cfbf4b4fbc16828eaec8a7048ee789403049dc409f7b643d6259cf7a
        libnvvm/linux-x86_64/libnvvm-linux-x86_64-13.0.88-archive.tar.xz 17ef1665b63670887eeba7d908da5669fa8c66bb73b5b4c1367f49929c086353
        cuda_crt/linux-x86_64/cuda_crt-linux-x86_64-13.0.88-archive.tar.xz 5a3279a049ffc1cdb951c44cb95206acfdde9e9ae5e87825fc18d7e4a6878bb0
        cuda_cudart/linux-x86_64/cuda_cudart-linux-x86_64-13.0.96-archive.tar.xz 25b8071951baba827be1580b841d363464f6ee6c39f48d33a81646f90cc95ed1
        cuda_cccl/linux-x86_64/cuda_cccl-linux-x86_64-13.0.85-archive.tar.xz ed845eae8c1767706b6ee91e40c608a03f6f633551a849b63f7346d32d73ee60
        cuda_culibos/linux-x86_64/cuda_culibos-linux-x86_64-13.0.85-archive.tar.xz 98fca11f9ab89be61385a67eee686c1ebf76fad9c7269d0cf9090edfcdb8a8ac
        libcublas/linux-x86_64/libcublas-linux-x86_64-13.1.1.3-archive.tar.xz 980cbd746a63566602d1699e2ade005c49408bd95618a57d0888f475e5c721a4"

        # CUDA 12.6.3, linux-aarch64. FOUR components, not seven: in the 12.x
        # split libnvvm, cuda_crt and cuda_culibos all live inside cuda_nvcc,
        # so asking for them separately fails with a 404. Verified against
        # redistrib_12.6.3.json, which lists 29 aarch64 components and none of
        # those three.
        #
        # ptxas 12.6.85 supports sm_87, which is what the Orin needs. It has no
        # sm_120 or sm_121, so this toolkit cannot serve Blackwell; that is the
        # other half of why one arm64 module cannot cover both Jetson and the
        # DGX Spark.
        COMPONENTS_linux_aarch64="\
        cuda_nvcc/linux-aarch64/cuda_nvcc-linux-aarch64-12.6.85-archive.tar.xz ef9dfb2c7327e196f8601ed216908de56911578f26e6ab9ac13c3e7dfff784f9
        cuda_cudart/linux-aarch64/cuda_cudart-linux-aarch64-12.6.77-archive.tar.xz d5b8f6f5a2ab34066c267daf5f73f25d2f24ea25d8fa3dce427c196ff07504e7
        cuda_cccl/linux-aarch64/cuda_cccl-linux-aarch64-12.6.77-archive.tar.xz ab8bd5c346ca69c96ac9afb9d317e8cbc0ec8fc32629ca17b38c14b3dede2fb7
        libcublas/linux-aarch64/libcublas-linux-aarch64-12.6.4.1-archive.tar.xz 3324e0a995794704874c71397964c4739667c279d3e3cb183e482476df9b57ed"

        # Same seven components and release either way, only the path and hash
        # differ. An explicit case rather than an indirect expansion: it fails
        # closed if a new arch is added above without a matching list here,
        # instead of silently expanding to an empty COMPONENTS and assembling
        # nothing.
        case "$REDIST_ARCH" in
          linux-x86_64)  COMPONENTS="$COMPONENTS_linux_x86_64" ;;
          linux-aarch64) COMPONENTS="$COMPONENTS_linux_aarch64" ;;
          *) echo "::error::setup-cuda: no COMPONENTS list for $REDIST_ARCH"; exit 1 ;;
        esac

        prefix="$RUNNER_TEMP/cuda/toolkit"
        mkdir -p "$prefix"
        echo "$COMPONENTS" | while read -r rel sha; do
          [ -z "$rel" ] && continue
          url="https://developer.download.nvidia.com/compute/cuda/redist/$rel"
          out="$RUNNER_TEMP/$(basename "$rel")"
          echo "Downloading $url"
          curl -fsSL --retry 3 "$url" -o "$out"
          echo "$sha  $out" | sha256sum -c -
          tar -xJf "$out" --strip-components=1 -C "$prefix"
          rm -f "$out"
        done
        # Redist archives ship lib/, not lib64/; some consumers look for
        # lib64, so provide it as an alias.
        if [ -d "$prefix/lib" ] && [ ! -e "$prefix/lib64" ]; then
          ln -s lib "$prefix/lib64"
        fi

    # Only trusted events populate the entry every other run restores.
    - name: Save CUDA toolkit
      if: >-
        steps.cache-cuda.outputs.cache-hit != 'true' &&
        (github.event_name == 'push' ||
         github.event_name == 'workflow_dispatch' ||
         github.event_name == 'merge_group')
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ runner.temp }}/cuda
        key: cuda-redist-${{ inputs.cuda-version }}-${{ runner.arch }}-r3

    - name: Export CUDA environment
      shell: bash
      run: |
        nvcc="$RUNNER_TEMP/cuda/toolkit/bin/nvcc"
        if [ ! -x "$nvcc" ]; then echo "::error::nvcc not found after assembly"; exit 1; fi
        cuda_prefix="$RUNNER_TEMP/cuda/toolkit"
        echo "CUDA prefix: $cuda_prefix"
        echo "CUDA_PATH=$cuda_prefix" >> "$GITHUB_ENV"
        echo "CUDACXX=$nvcc" >> "$GITHUB_ENV"
        echo "$cuda_prefix/bin" >> "$GITHUB_PATH"
        # vcpkg scrubs the environment, so the port's enable_language(CUDA)
        # only sees the toolkit through an explicit keep-list. Append rather
        # than assign so a sibling setup action's keep-list survives.
        echo "VCPKG_KEEP_ENV_VARS=${VCPKG_KEEP_ENV_VARS:+$VCPKG_KEEP_ENV_VARS;}CUDA_PATH;CUDACXX" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$cuda_prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
