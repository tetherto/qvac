name: "Setup CUDA toolkit for nvcc compile"
description: >-
  Assembles a pinned CUDA toolkit from NVIDIA's redistributable component
  archives on a linux-x64, linux-arm64 or windows-x64 runner and exports
  CUDA_PATH/CUDACXX/PATH(bin)/VCPKG_KEEP_ENV_VARS (plus LD_LIBRARY_PATH on
  Linux) so a consumer's speech-cpp cuda feature can compile the ggml CUDA
  backend. Component archives are used instead of the runfile installer
  because the installer hardcodes /tmp/cuda-installer.log and segfaults for
  every runner user on a shared host after the first user's install ("Log
  file not open."). No NVIDIA GPU is required on the runner (compile-only).
  The CUDA backend ships as a runtime-loaded module: the prebuild loads on
  any host, and CUDA engages only where the NVIDIA driver and CUDA runtime
  libraries are present.

inputs:
  cuda-version:
    description: >-
      CUDA release the pinned component lists below belong to. Informational
      and part of the cache key; changing the components means updating the
      per-platform COMPONENTS lists in this action, from
      https://developer.download.nvidia.com/compute/cuda/redist/redistrib_<version>.json.
    required: false
    default: "13.2.0"

runs:
  using: composite
  steps:
    # Cache the assembled toolkit so the component archives are fetched and
    # unpacked once per component-list revision and platform. Bump the -r
    # suffix when editing a COMPONENTS list.
    - name: Cache CUDA toolkit
      id: cache-cuda
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/cuda
        key: cuda-redist-${{ inputs.cuda-version }}-${{ runner.os }}-${{ runner.arch }}-r2

    - name: Download + verify + assemble CUDA toolkit
      if: steps.cache-cuda.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # Pinned against redistrib_13.2.0.json (supply-chain pin: a silent
        # re-upload fails the sha256 check). nvcc + libnvvm (cicc lives
        # there in the 13.x split) + crt + cudart + cccl + cublas (+ culibos
        # on Linux; it does not exist as a Windows component) is the minimal
        # set that compiles and links the ggml CUDA backend; the
        # runtime-loaded module resolves cudart and cuBLAS from the host at
        # run time.
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)
            COMPONENTS="\
        cuda_nvcc/linux-x86_64/cuda_nvcc-linux-x86_64-13.2.51-archive.tar.xz 706b996fefc59dc8d64d317fdf48d0aa84c4ae004eff43009dd918f40c5cc66a
        libnvvm/linux-x86_64/libnvvm-linux-x86_64-13.2.51-archive.tar.xz e013fce38130d2337ea695aadc5ddd5dcfb78f9107903d72492b9819539749bb
        cuda_crt/linux-x86_64/cuda_crt-linux-x86_64-13.2.51-archive.tar.xz fbc31fed55b7255591f3a19f575ca078827f5e6757d317d009f7ec1e69fcde4b
        cuda_cudart/linux-x86_64/cuda_cudart-linux-x86_64-13.2.51-archive.tar.xz 539edc1056e44d319f2112e9971c6415d78d4dde04b3f6ffbd20ec808e718526
        cuda_cccl/linux-x86_64/cuda_cccl-linux-x86_64-13.2.27-archive.tar.xz 56e1bafb29faa87375b0484814870046530b88c0a421909096892f027ec1927b
        cuda_culibos/linux-x86_64/cuda_culibos-linux-x86_64-13.2.51-archive.tar.xz dece3cdb7954d276e07eb23bee882a24627f431654cdeeef2bcee2d22669d93c
        libcublas/linux-x86_64/libcublas-linux-x86_64-13.3.0.5-archive.tar.xz 9f3c23d55b098d9159c435db59f228df79493152a778d4d367e7d60470d8c64b"
            ;;
          Linux-ARM64)
            COMPONENTS="\
        cuda_nvcc/linux-sbsa/cuda_nvcc-linux-sbsa-13.2.51-archive.tar.xz 28d201ffc46627abd919d623d85e721f33c92cf02749e023cd66d6fa0f1206a7
        libnvvm/linux-sbsa/libnvvm-linux-sbsa-13.2.51-archive.tar.xz 366da4383992b8d13df63ffecd3a8315815955f50da0c0288ca5123212f67e02
        cuda_crt/linux-sbsa/cuda_crt-linux-sbsa-13.2.51-archive.tar.xz 04f8fd03bc5a99507f5d531cc65452881c8949311bc5cc87bc1fe05a7607fd9e
        cuda_cudart/linux-sbsa/cuda_cudart-linux-sbsa-13.2.51-archive.tar.xz 379363621c59c8d6faeea2f7a527eae91fc7db8cb2121cb42fe7972a48462f67
        cuda_cccl/linux-sbsa/cuda_cccl-linux-sbsa-13.2.27-archive.tar.xz 1587f83b92aef54414cd118723ec1e4c118e14c70ac7779e13caa941f8030faf
        cuda_culibos/linux-sbsa/cuda_culibos-linux-sbsa-13.2.51-archive.tar.xz 35244c4d90e5b1aa48fb98d655f6dfa3f9e4f7d0ac220266ebf85c0928a7524b
        libcublas/linux-sbsa/libcublas-linux-sbsa-13.3.0.5-archive.tar.xz edadce2ec8d997ffb08f5a1c4ee6b1d14a2c883f2aa11e1d3208b4f077d9225f"
            ;;
          Windows-X64)
            COMPONENTS="\
        cuda_nvcc/windows-x86_64/cuda_nvcc-windows-x86_64-13.2.51-archive.zip a6bacac79adb923e310eb39f2b86d4d9e756c896d035dfead50c69403eca4661
        libnvvm/windows-x86_64/libnvvm-windows-x86_64-13.2.51-archive.zip ef2a24cf40f9394e2f13df5a8a7315c65325103006a53692cd12b8c48431e372
        cuda_crt/windows-x86_64/cuda_crt-windows-x86_64-13.2.51-archive.zip 02892bd6bc7ec832c5fc6fc794491803166ee8455bd87d52976c4b195b76c8e7
        cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-13.2.51-archive.zip 906b430b53e6396f7cbaa6874fbe7f9307a184e830b119a4ad3f58dc6e0165c6
        cuda_cccl/windows-x86_64/cuda_cccl-windows-x86_64-13.2.27-archive.zip fb61bbca384ea9e5722f3b77cfdd635c916f33593d187562510ce14831aa629a
        libcublas/windows-x86_64/libcublas-windows-x86_64-13.3.0.5-archive.zip 438a88f07af3721eda15ed1f4d2b957ea810e29061b2a6292837f35520dbd212"
            ;;
          *)
            echo "::error::setup-cuda: unsupported runner platform $RUNNER_OS-$RUNNER_ARCH"
            exit 1
            ;;
        esac

        prefix="$RUNNER_TEMP/cuda/toolkit"
        # git-bash tools want POSIX paths: GNU tar parses the drive colon in
        # C:\... as a remote-host spec ("Cannot connect to C"). The exported
        # CUDA_PATH/CUDACXX keep the Windows form CMake needs.
        if command -v cygpath >/dev/null 2>&1; then
          prefix="$(cygpath -u "$prefix")"
          dl_dir="$(cygpath -u "$RUNNER_TEMP")"
        else
          dl_dir="$RUNNER_TEMP"
        fi
        mkdir -p "$prefix"
        # The Windows components are .zip, which GNU tar cannot read, and
        # which of the two tars a runner's bash resolves varies by machine.
        # Use the system bsdtar explicitly on Windows (zip-capable, native
        # Windows paths); plain tar handles the Linux .tar.xz archives.
        extract_archive() {
          if [ "$RUNNER_OS" = "Windows" ]; then
            /c/Windows/System32/tar.exe -xf "$(cygpath -w "$1")" \
              --strip-components=1 -C "$(cygpath -w "$prefix")"
          else
            tar -xf "$1" --strip-components=1 -C "$prefix"
          fi
        }
        echo "$COMPONENTS" | while read -r rel sha; do
          [ -z "$rel" ] && continue
          url="https://developer.download.nvidia.com/compute/cuda/redist/$rel"
          out="$dl_dir/$(basename "$rel")"
          echo "Downloading $url"
          curl -fsSL --retry 3 "$url" -o "$out"
          echo "$sha  $out" | sha256sum -c -
          extract_archive "$out"
          rm -f "$out"
        done
        # Redist archives ship lib/, not lib64/; some Linux consumers look
        # for lib64, so provide it as an alias. Windows keeps NVIDIA's
        # lib/x64 import-library layout, which FindCUDAToolkit knows.
        if [ "$RUNNER_OS" != "Windows" ] && [ -d "$prefix/lib" ] && [ ! -e "$prefix/lib64" ]; then
          ln -s lib "$prefix/lib64"
        fi

    - name: Export CUDA environment
      shell: bash
      run: |
        cuda_prefix="$RUNNER_TEMP/cuda/toolkit"
        nvcc="$cuda_prefix/bin/nvcc"
        if [ "$RUNNER_OS" = "Windows" ]; then
          nvcc="$nvcc.exe"
        fi
        if [ ! -x "$nvcc" ]; then echo "::error::nvcc not found after assembly"; exit 1; fi
        echo "CUDA prefix: $cuda_prefix"
        echo "CUDA_PATH=$cuda_prefix" >> "$GITHUB_ENV"
        echo "CUDACXX=$nvcc" >> "$GITHUB_ENV"
        echo "$cuda_prefix/bin" >> "$GITHUB_PATH"
        # vcpkg scrubs the environment, so the port's enable_language(CUDA)
        # only sees the toolkit through an explicit keep-list. Append rather
        # than assign so a sibling setup action's keep-list survives.
        echo "VCPKG_KEEP_ENV_VARS=${VCPKG_KEEP_ENV_VARS:+$VCPKG_KEEP_ENV_VARS;}CUDA_PATH;CUDACXX" >> "$GITHUB_ENV"
        if [ "$RUNNER_OS" != "Windows" ]; then
          echo "LD_LIBRARY_PATH=$cuda_prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
        fi
