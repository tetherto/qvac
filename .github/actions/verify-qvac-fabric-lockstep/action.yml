name: Verify qvac-fabric lockstep
description: Ensures qvac-fabric dependency version is identical across all package vcpkg manifests that declare it, and that each of those packages records that version in package.json.

outputs:
  version:
    description: The shared qvac-fabric version when lockstep check passes.
    value: ${{ steps.verify.outputs.version }}

runs:
  using: composite
  steps:
    - id: verify
      shell: bash
      run: |
        set -euo pipefail

        mapfile -t mentions < <(
          for file in packages/*/vcpkg.json; do
            if jq -e '
              [.. | strings, (objects | .name?) | select(. == "qvac-fabric")]
              | length > 0
            ' "${file}" >/dev/null 2>&1; then
              echo "${file}"
            fi
          done | sort
        )

        mapfile -t files < <(
          for file in packages/*/vcpkg.json; do
            if jq -e '
              [
                .dependencies[]?
                | objects
                | select(.name == "qvac-fabric" and (.["version>="] != null))
              ] | length > 0
            ' "${file}" >/dev/null; then
              echo "${file}"
            fi
          done | sort
        )

        if [ "${#files[@]}" -eq 0 ]; then
          echo "No packages/*/vcpkg.json manifests declare qvac-fabric with version>="
          exit 1
        fi

        declare -A verified=()
        for file in "${files[@]}"; do
          verified["${file}"]=1
        done

        unverified=()
        for file in "${mentions[@]}"; do
          if [ -z "${verified[${file}]+x}" ]; then
            unverified+=("${file}")
          fi
        done

        if [ "${#unverified[@]}" -gt 0 ]; then
          echo "qvac-fabric is referenced but not lockstep-verified (missing top-level dependency with version>=):"
          printf '  %s\n' "${unverified[@]}"
          exit 1
        fi

        versions=()
        for file in "${files[@]}"; do
          version="$(jq -r '
            [
              .dependencies[]
              | objects
              | select(.name == "qvac-fabric")
              | .["version>="]
            ] | first // empty
          ' "${file}")"

          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "qvac-fabric dependency with version>= not found in ${file}"
            exit 1
          fi

          echo "${file}: qvac-fabric version>=${version}"
          versions+=("${version}")
        done

        baseline="${versions[0]}"
        for version in "${versions[@]}"; do
          if [ "${version}" != "${baseline}" ]; then
            echo "qvac-fabric versions are not in lockstep."
            echo "Expected all to match: ${baseline}"
            printf 'Observed versions: %s\n' "${versions[@]}"
            exit 1
          fi
        done

        # Each of these packages records the port version in package.json as
        # qvac["qvac-fabric"]. @qvac/fabric's record says which port its runtime
        # was built from; an addon that links code from the port itself
        # (@qvac/decision-ggml's server-context) is checked against that record
        # at configure time (qvac_addon_link_fabric_server_context), so the
        # records must match the pins.
        mismatched=()
        for file in "${files[@]}"; do
          manifest="$(dirname "${file}")/package.json"
          recorded=""
          if [ -f "${manifest}" ]; then
            recorded="$(jq -r '.qvac["qvac-fabric"] // empty' "${manifest}")"
          fi
          if [ "${recorded}" != "${baseline}" ]; then
            mismatched+=("${manifest}: qvac[\"qvac-fabric\"] is ${recorded:-missing}, ${file} pins ${baseline}")
          fi
        done
        if [ "${#mismatched[@]}" -gt 0 ]; then
          echo "qvac-fabric is not recorded in package.json as pinned in vcpkg.json:"
          printf '  %s\n' "${mismatched[@]}"
          exit 1
        fi

        echo "qvac-fabric lockstep verified across ${#files[@]} manifests and their package.json records: ${baseline}"
        echo "version=${baseline}" >> "${GITHUB_OUTPUT}"
