name: Verify qvac-fabric lockstep
description: Ensures qvac-fabric dependency version is identical across all package vcpkg manifests that declare it.

outputs:
  version:
    description: The shared qvac-fabric version when lockstep check passes.
    value: ${{ steps.verify.outputs.version }}

runs:
  using: composite
  steps:
    - id: verify
      shell: bash
      run: |
        set -euo pipefail

        mapfile -t mentions < <(
          for file in packages/*/vcpkg.json; do
            if jq -e '
              [.. | strings, (objects | .name?) | select(. == "qvac-fabric")]
              | length > 0
            ' "${file}" >/dev/null 2>&1; then
              echo "${file}"
            fi
          done | sort
        )

        mapfile -t files < <(
          for file in packages/*/vcpkg.json; do
            if jq -e '
              [
                .dependencies[]?
                | objects
                | select(.name == "qvac-fabric" and (.["version>="] != null))
              ] | length > 0
            ' "${file}" >/dev/null; then
              echo "${file}"
            fi
          done | sort
        )

        if [ "${#files[@]}" -eq 0 ]; then
          echo "No packages/*/vcpkg.json manifests declare qvac-fabric with version>="
          exit 1
        fi

        declare -A verified=()
        for file in "${files[@]}"; do
          verified["${file}"]=1
        done

        unverified=()
        for file in "${mentions[@]}"; do
          if [ -z "${verified[${file}]+x}" ]; then
            unverified+=("${file}")
          fi
        done

        if [ "${#unverified[@]}" -gt 0 ]; then
          echo "qvac-fabric is referenced but not lockstep-verified (missing top-level dependency with version>=):"
          printf '  %s\n' "${unverified[@]}"
          exit 1
        fi

        versions=()
        for file in "${files[@]}"; do
          version="$(jq -r '
            [
              .dependencies[]
              | objects
              | select(.name == "qvac-fabric")
              | .["version>="]
            ] | first // empty
          ' "${file}")"

          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "qvac-fabric dependency with version>= not found in ${file}"
            exit 1
          fi

          echo "${file}: qvac-fabric version>=${version}"
          versions+=("${version}")
        done

        baseline="${versions[0]}"
        for version in "${versions[@]}"; do
          if [ "${version}" != "${baseline}" ]; then
            echo "qvac-fabric versions are not in lockstep."
            echo "Expected all to match: ${baseline}"
            printf 'Observed versions: %s\n' "${versions[@]}"
            exit 1
          fi
        done

        echo "qvac-fabric lockstep verified across ${#files[@]} manifests: ${baseline}"
        echo "version=${baseline}" >> "${GITHUB_OUTPUT}"
