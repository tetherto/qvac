name: Setup build host
description: >-
  Install and configure the OS-level prerequisites needed by prebuild
  workflows. Runs a fixed set of steps per runner/platform/arch: on ubuntu
  we maximize disk space; on windows we enable long paths, configure the
  CMake generator, and (on arm64) rename the Windows 10 SDK; on linux we
  install the base X11 dev headers plus any caller-supplied extras; on
  android we export the NDK / toolchain env and install the ubuntu cross
  toolchain.

  LLVM/Clang installation has been split out into the dedicated
  `setup-llvm` composite action. Callers that need a versioned LLVM
  toolchain (every C++ workflow today) MUST invoke `setup-llvm` themselves
  on linux/windows runners; it is the single source of truth for the LLVM
  major used across the monorepo.

inputs:
  platform:
    description: Build platform (linux, android, darwin, ios, win32)
    required: true
  arch:
    description: Build architecture (x64, arm64)
    required: true
  linux-extra-packages:
    description: >-
      Additional apt packages to install on linux runners, on top of the
      always-installed base set (libxi-dev libxtst-dev libxrandr-dev).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - if: ${{ inputs.platform == 'android' }}
      name: Select Android NDK
      shell: bash
      env:
        # Pinned, not ANDROID_NDK_LATEST_HOME: runner images move "latest" mid-rollout.
        NDK_VERSION: 29.0.14206865
      run: |
        if [ -z "${ANDROID_HOME:-}" ]; then
          echo "::error::ANDROID_HOME is unset; cannot select NDK ${NDK_VERSION}"
          exit 1
        fi
        ndk="${ANDROID_HOME}/ndk/${NDK_VERSION}"
        if [ ! -d "$ndk" ]; then
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "::error::NDK ${NDK_VERSION} is not installed and $sdkmanager is missing"
            exit 1
          fi
          echo "NDK ${NDK_VERSION} not on this image; installing"
          "$sdkmanager" --install "ndk;${NDK_VERSION}"
        fi
        if [ ! -f "$ndk/source.properties" ]; then
          echo "::error::$ndk/source.properties is missing; the NDK install is incomplete"
          exit 1
        fi
        revision=$(sed -n 's/^Pkg\.Revision *= *//p' "$ndk/source.properties")
        if [ "$revision" != "$NDK_VERSION" ]; then
          echo "::error::expected NDK ${NDK_VERSION} at $ndk, found '${revision}'"
          exit 1
        fi
        echo "Using NDK ${revision} at $ndk"
        echo "ANDROID_NDK=$ndk" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

    - if: ${{ runner.os == 'Linux' }}
      name: Maximize build space
      shell: bash
      env:
        INPUT_PLATFORM: ${{ inputs.platform }}
      run: |
        echo "=== Disk space before cleanup ==="
        df -h /
        sudo docker image prune --all --force
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/share/swift
        sudo rm -rf /opt/hostedtoolcache/go
        if [ "$INPUT_PLATFORM" != "android" ]; then
          sudo rm -rf /usr/local/lib/android
        fi
        echo "=== Disk space after cleanup ==="
        df -h /

    - if: ${{ runner.os == 'Windows' }}
      name: Configure Windows long paths
      shell: powershell
      run: |
        git config --system core.longpaths true

    - if: ${{ runner.os == 'Windows' && inputs.arch == 'arm64' }}
      name: Rename Windows 10 SDK folders (arm64 only)
      shell: powershell
      run: |
        Rename-Item -Path "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0" -NewName "old-10.0.26100.0"
        Rename-Item -Path "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0" -NewName "old-10.0.26100.0"
        Rename-Item -Path "C:\Program Files (x86)\Windows Kits\10\Lib\10.0.26100.0" -NewName "old-10.0.26100.0"

    - if: ${{ runner.os == 'Windows' }}
      name: Configure CMake generator on Windows
      shell: powershell
      env:
        INPUT_ARCH: ${{ inputs.arch }}
      run: |
        echo "CMAKE_GENERATOR=Visual Studio 17 2022" >> $env:GITHUB_ENV
        switch ($env:INPUT_ARCH) {
          'x64'   { echo "CMAKE_GENERATOR_PLATFORM=x64"   >> $env:GITHUB_ENV }
          'arm64' { echo "CMAKE_GENERATOR_PLATFORM=ARM64" >> $env:GITHUB_ENV }
          'x86'   { echo "CMAKE_GENERATOR_PLATFORM=Win32" >> $env:GITHUB_ENV }
          default { Write-Host "Unknown arch '$env:INPUT_ARCH'; CMAKE_GENERATOR_PLATFORM left unset" }
        }

    - if: ${{ runner.os == 'Linux' }}
      name: Refresh apt sources
      shell: bash
      run: sudo apt-get update

    - if: ${{ inputs.platform == 'linux' }}
      name: Install linux base packages
      shell: bash
      run: |
        sudo apt-get install -y libxi-dev libxtst-dev libxrandr-dev

    - if: ${{ runner.os == 'Linux' && inputs.linux-extra-packages != '' }}
      name: Install linux extra packages
      shell: bash
      env:
        PKGS: ${{ inputs.linux-extra-packages }}
      run: |
        sudo apt-get install -y $PKGS

    - if: ${{ inputs.platform == 'android' && runner.os == 'Linux' }}
      name: Install ubuntu cross toolchain for android
      shell: bash
      run: |
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross lld

    - if: ${{ inputs.platform == 'android' }}
      name: Export Android toolchain env
      shell: bash
      run: |
        echo "ANDROID_TOOLCHAIN_ROOT=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"
        echo "ANDROID_NATIVE_API_LEVEL=34" >> "$GITHUB_ENV"
