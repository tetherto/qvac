name: Download models
description: Fetch the manifest's models a target needs that are not already present. The job holds the S3 credentials.

inputs:
  workdir:
    description: Package directory
    required: true
  bucket:
    description: S3 bucket holding the models
    required: true
  target:
    description: Only models whose targets include this one; empty means all
    default: ""
  manifest:
    description: Manifest path inside workdir
    default: test/integration/models.manifest.json
  exact-hit:
    description: The model cache's cache-hit output; without an exact hit, entries with no size or sha256 are fetched again
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        WORKDIR: ${{ inputs.workdir }}
        BUCKET: ${{ inputs.bucket }}
        TARGET: ${{ inputs.target }}
        MANIFEST: ${{ inputs.manifest }}
        EXACT_HIT: ${{ inputs.exact-hit }}
      run: node "$GITHUB_ACTION_PATH/models-download.mjs"
