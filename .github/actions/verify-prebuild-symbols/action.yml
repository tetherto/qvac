name: Verify prebuild symbols
description: >-
  Static guard that prebuilt addon modules contain no unresolvable engine
  symbols (ggml_/gguf_/llama_/whisper_/...) -- the @qvac/tts-ggml@0.2.1
  dlopen-on-device crash class -- and (optionally) do not leak engine symbols
  into their export table (cross-addon interposition risk). Runs the bundled
  verify-prebuild-symbols.mjs (resolved via $GITHUB_ACTION_PATH, so the action
  is self-contained and works regardless of the consumer branch's tree) against
  the workdir's prebuilds/ tree. No emulator or device required; runs straight
  off the build artifacts.

inputs:
  platform:
    description: Build platform (linux, android, darwin, ios, win32)
    required: true
  workdir:
    description: Directory containing the prebuilds/ folder
    required: true
  enforce-exports:
    description: >-
      Fail (instead of warn) when a module exports engine symbols at default
      visibility. Default false during rollout; flip to true per package once
      it ships a symbols.map / -Wl,--exclude-libs,ALL.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - if: ${{ inputs.platform == 'android' }}
      name: Verify symbols (Android)
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        ENFORCE_EXPORTS: ${{ inputs.enforce-exports }}
      run: |
        set -euo pipefail
        TOOLCHAIN="${ANDROID_TOOLCHAIN_ROOT:-${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64}"
        export READELF="${TOOLCHAIN}/bin/llvm-readelf"
        export NM="${TOOLCHAIN}/bin/llvm-nm"
        EXTRA=""
        if [ "$ENFORCE_EXPORTS" = "true" ]; then EXTRA="--enforce-exports"; fi
        # When @qvac/fabric is installed, index its prebuilds as an external provider.
        # The script matches provider exports to each binary's DT_NEEDED by soname, so
        # mere presence of the package in node_modules cannot mask a genuine UND.
        # Since 0.18 the runtime ships in @qvac/fabric-<host>/addon/prebuilds. Mirror
        # qvac_addon_fabric_layout: fabric's own prebuilds, its dependencies (a
        # sibling of its real path or nested under it), and a cross-built package
        # installed as this addon's direct dependency, which pnpm keeps out of
        # fabric's tree.
        FABRIC="node_modules/@qvac/fabric"
        if [ -d "$FABRIC" ]; then
          FABRIC_REAL="$(cd "$FABRIC" && pwd -P)"
          shopt -s nullglob
          declare -A SEEN=()
          for dir in "$FABRIC_REAL/prebuilds" "$(dirname "$FABRIC_REAL")"/fabric-*/addon/prebuilds \
            "$FABRIC_REAL"/node_modules/@qvac/fabric-*/addon/prebuilds node_modules/@qvac/fabric-*/addon/prebuilds; do
            [ -d "$dir" ] || continue
            real="$(cd "$dir" && pwd -P)"
            [ -z "${SEEN[$real]:-}" ] || continue
            SEEN[$real]=1
            EXTRA="$EXTRA --provider-dir $real"
          done
        fi
        node "$GITHUB_ACTION_PATH/verify-prebuild-symbols.mjs" --dir prebuilds --platform android $EXTRA

    - if: ${{ inputs.platform == 'linux' || inputs.platform == 'darwin' || inputs.platform == 'ios' }}
      name: Verify symbols (native)
      shell: bash
      working-directory: ${{ inputs.workdir }}
      env:
        ENFORCE_EXPORTS: ${{ inputs.enforce-exports }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        EXTRA=""
        if [ "$ENFORCE_EXPORTS" = "true" ]; then EXTRA="--enforce-exports"; fi
        # When @qvac/fabric is installed, index its prebuilds as an external provider.
        # The script matches provider exports to each binary's DT_NEEDED by soname, so
        # mere presence of the package in node_modules cannot mask a genuine UND.
        # Since 0.18 the runtime ships in @qvac/fabric-<host>/addon/prebuilds. Mirror
        # qvac_addon_fabric_layout: fabric's own prebuilds, its dependencies (a
        # sibling of its real path or nested under it), and a cross-built package
        # installed as this addon's direct dependency, which pnpm keeps out of
        # fabric's tree.
        FABRIC="node_modules/@qvac/fabric"
        if [ -d "$FABRIC" ]; then
          FABRIC_REAL="$(cd "$FABRIC" && pwd -P)"
          shopt -s nullglob
          declare -A SEEN=()
          for dir in "$FABRIC_REAL/prebuilds" "$(dirname "$FABRIC_REAL")"/fabric-*/addon/prebuilds \
            "$FABRIC_REAL"/node_modules/@qvac/fabric-*/addon/prebuilds node_modules/@qvac/fabric-*/addon/prebuilds; do
            [ -d "$dir" ] || continue
            real="$(cd "$dir" && pwd -P)"
            [ -z "${SEEN[$real]:-}" ] || continue
            SEEN[$real]=1
            EXTRA="$EXTRA --provider-dir $real"
          done
        fi
        node "$GITHUB_ACTION_PATH/verify-prebuild-symbols.mjs" --dir prebuilds --platform "$PLATFORM" $EXTRA

    - if: ${{ inputs.platform == 'win32' }}
      name: Verify symbols (skip on Windows)
      shell: bash
      run: |
        echo "verify-prebuild-symbols skipped on win32 (PE format is not analyzed by the ELF/Mach-O gate)."
