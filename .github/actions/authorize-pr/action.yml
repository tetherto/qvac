name: Authorize PR
description: >
  Security gate for pull_request_target workflows. Same-repo PRs and write-access actors are trusted on external forks. Optional label input gates external fork PRs when a pod-specific label is required (e.g. safe-to-test). Draft PRs are blocked. Privileged fork trust for secret-bearing jobs is enforced by the fork-ci environment gate (fork-approval job), not here.
inputs:
  label:
    description: "When set, external fork PRs must carry this label. Omit or leave empty to rely on fork-ci only."
    required: false
    default: ""
  github-token:
    description: "GitHub token for permission check and label API calls"
    required: true

outputs:
  allowed:
    description: "true when the workflow is authorized to proceed"
    value: ${{ steps.check.outputs.allowed }}
  has_write:
    description: "1 when the triggering actor has write-or-higher repo permission"
    value: ${{ steps.perm.outputs.has-permission }}

runs:
  using: composite
  steps:
    - name: Check actor write permission
      id: perm
      uses: scherermichael-oss/action-has-permission@136e061bfe093832d87f090dd768e14e27a740d3 # 1.0.6
      with:
        required-permission: write
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Check authorization
      id: check
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        ACTION: ${{ github.event.action }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        BASE_REPO: ${{ github.repository }}
        IS_DRAFT: ${{ github.event.pull_request.draft }}
        HAS_WRITE: ${{ steps.perm.outputs.has-permission }}
        LABEL_NAME: ${{ inputs.label }}
        LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: |
        if [ "$EVENT" != "pull_request_target" ] && [ "$EVENT" != "pull_request" ]; then
          echo "::notice::Non-PR event ($EVENT) — authorized"
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$IS_DRAFT" = "true" ]; then
          echo "::notice::Draft PR — blocked until ready-for-review"
          echo "allowed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        IS_SAME_REPO=false
        shopt -s nocasematch
        if [[ -n "$HEAD_REPO" && "$HEAD_REPO" == "$BASE_REPO" ]]; then
          IS_SAME_REPO=true
        fi
        shopt -u nocasematch
        if [ "$IS_SAME_REPO" = "true" ]; then
          echo "::notice::Same-repo PR — authorized"
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "::notice::Actor '$GITHUB_ACTOR' write-or-higher: $HAS_WRITE"
        if [ "$HAS_WRITE" = "1" ]; then
          echo "::notice::Actor has write-or-higher permission — authorized"
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -z "$LABEL_NAME" ]; then
          echo "::notice::External fork PR — authorized (fork-ci gates privileged jobs)"
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        HAS_LABEL=$(echo "$LABELS_JSON" | jq -r --arg l "$LABEL_NAME" \
          'if . == null then "false" elif any(. == $l) then "true" else "false" end')

        if [ "$ACTION" = "synchronize" ] && [ "$HAS_LABEL" != "true" ]; then
          echo "::warning::External fork synchronize without '$LABEL_NAME' — skipping"
          echo "allowed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ "$HAS_LABEL" = "true" ]; then
          echo "::notice::Fork PR with '$LABEL_NAME' label — authorized"
          echo "allowed=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::External fork PR without '$LABEL_NAME' label — skipping"
          echo "allowed=false" >> "$GITHUB_OUTPUT"
        fi
