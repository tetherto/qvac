name: Mobile Test — Monitor Device Farm Run
description: |
  Phase 5 of the mobile integration test pipeline.

  Polls the scheduled Device Farm runs every 30s (up to 2h), aggregates
  per-device pass/fail counters, prints AWS Device Farm console links for
  failed jobs, and fails the step if any user-test ran and failed.

  Accepts a JSON array of run ARNs (any length) so this works for default
  dual-flagship runs (2 ARNs), embed single-pool (1 ARN), and LLM/OCR
  sharded mode (2-10 ARNs).

  A run that Device Farm completes as ERRORED without executing a single test
  is an infrastructure failure, not a result, and is rescheduled once on the
  same device selection (see max-errored-retries). That needs the scheduling
  inputs below plus run-specs from schedule-test-run; without them the retry
  is skipped and monitoring behaves exactly as it did before.

inputs:
  run-arns:
    description: "JSON array of Device Farm run ARNs"
    required: true
  run-count:
    description: "Number of scheduled runs (echoed for logging only)"
    required: false
    default: ""
  max-wait-time-seconds:
    description: "Polling-loop hard ceiling. Default 7200 (2h). Addons whose Device Farm runs exceed 2h pass a larger value here."
    required: false
    default: "7200"
  test-specs:
    description: "JSON array from upload-to-devicefarm: [{name, grep, arn}]. Used to print a run-to-tests legend. Optional; omit for non-sharded runs."
    required: false
    default: "[]"
  run-specs:
    description: "run-specs from schedule-test-run: the per-slot respawn recipe. Required for the errored-run retry; default [] disables it."
    required: false
    default: "[]"
  test-package-upload-arn:
    description: |
      Device Farm upload ARN for the Appium test package, as passed to
      schedule-test-run. Required for the errored-run retry: it is the one
      scheduling parameter Device Farm does not report back on a run, so unlike
      the project / app / timeout below it cannot be derived here.
    required: false
    default: ""
  device-farm-project-arn:
    description: "Optional override. Empty (default) derives the project ARN from the run ARN being retried, so callers do not have to re-pass the secret the scheduler already used."
    required: false
    default: ""
  app-upload-arn:
    description: "Optional override. Empty (default) reads the app upload ARN back off the errored run, which is by definition the one it was scheduled with."
    required: false
    default: ""
  job-timeout-minutes:
    description: "Optional override for a rescheduled run's jobTimeoutMinutes. Empty (default) reuses the errored run's own value, so a retry inherits whatever ceiling the scheduler set."
    required: false
    default: ""
  max-errored-retries:
    description: "How many times one run slot may be rescheduled after Device Farm errors it without executing any test. Default 1 (retry once); 0 disables. Never applies to FAILED runs — those are real results."
    required: false
    default: "1"

outputs:
  test-result:
    description: "PASSED | FAILED"
    value: ${{ steps.monitor.outputs.test_result }}
  test-total:
    description: "Total test cases across all runs"
    value: ${{ steps.monitor.outputs.test_total }}
  test-passed:
    description: "Test cases passed"
    value: ${{ steps.monitor.outputs.test_passed }}
  test-failed:
    description: "Test cases failed"
    value: ${{ steps.monitor.outputs.test_failed }}
  test-skipped:
    description: "Test cases skipped"
    value: ${{ steps.monitor.outputs.test_skipped }}
  user-test-passed:
    description: "Devices passed (user-defined PASSED jobs)"
    value: ${{ steps.monitor.outputs.user_test_passed }}
  user-test-failed:
    description: "Devices failed (user-defined non-PASSED jobs)"
    value: ${{ steps.monitor.outputs.user_test_failed }}
  run-arns:
    description: |
      JSON array of the run ARNs actually monitored: index-aligned with the
      run-arns input, with any rescheduled slot replaced by its new ARN. Use it
      for log collection so a retried slot's artifacts come from the run that
      executed. Empty when monitoring never reached the end of the polling loop,
      so callers should fall back to the scheduler's run-arns.
    value: ${{ steps.monitor.outputs.effective_run_arns }}

runs:
  using: composite
  steps:
    - name: Monitor Test Run
      id: monitor
      shell: bash
      env:
        RUN_ARNS_JSON: ${{ inputs.run-arns }}
        MAX_WAIT_TIME_SECONDS: ${{ inputs.max-wait-time-seconds }}
        TEST_SPECS_JSON: ${{ inputs.test-specs }}
        RUN_SPECS_JSON: ${{ inputs.run-specs }}
        PROJECT_ARN: ${{ inputs.device-farm-project-arn }}
        APP_ARN: ${{ inputs.app-upload-arn }}
        TEST_PACKAGE_ARN: ${{ inputs.test-package-upload-arn }}
        JOB_TIMEOUT_MINUTES: ${{ inputs.job-timeout-minutes }}
        MAX_ERRORED_RETRIES: ${{ inputs.max-errored-retries }}
      run: |
        set -euo pipefail

        # ── helpers ──────────────────────────────────────────────────
        # Bash 3.2 compat: no mapfile, no declare -A.
        aws_retry() {
          local max_attempts=3 attempt=1 result=""
          while [ $attempt -le $max_attempts ]; do
            result=$("$@" 2>/dev/null) && { echo "$result"; return 0; }
            echo "  ⚠️  AWS API attempt $attempt/$max_attempts failed, retrying in 5s..." >&2
            sleep 5
            attempt=$((attempt + 1))
          done
          echo ""
          return 1
        }

        # ── parse ARNs ──────────────────────────────────────────────
        if [ -z "$RUN_ARNS_JSON" ] || [ "$RUN_ARNS_JSON" = "[]" ]; then
          echo "ERROR: run-arns is empty"
          exit 1
        fi
        RUN_ARNS=()
        while IFS= read -r _arn; do
          [ -n "$_arn" ] && RUN_ARNS+=("$_arn")
        done < <(echo "$RUN_ARNS_JSON" | jq -r '.[]')
        RUN_COUNT=${#RUN_ARNS[@]}

        echo "📊 Monitoring $RUN_COUNT Device Farm run(s)..."
        for ((i=0; i<RUN_COUNT; i++)); do
          echo "  Run $((i+1)): ${RUN_ARNS[$i]}"
        done
        echo ""

        # ── errored-run retry setup ─────────────────────────────────
        # Device Farm sometimes completes a run as ERRORED without executing a
        # single test: the slot sits in a pending state, then finishes with an
        # empty message and a zero test tally (TTS iOS run 33418309222 — the same
        # commit passed on a re-dispatch). That is an infrastructure failure, not
        # a result. A real test failure reports FAILED with executed tests, and
        # ERRORED with a non-zero tally means tests ran and blew up; neither is
        # ever retried here.
        #
        # Rescheduling needs everything schedule-run needs. The project ARN, app
        # upload and job timeout are read back off the errored run itself, so a
        # caller cannot pass a project or ceiling that disagrees with the run it
        # is retrying, and no secret has to be threaded through a second step.
        # The other two cannot be derived: Device Farm never reports the test
        # package ARN, and the device selection it reports back does not round
        # trip reliably enough to retry on the same hardware — so the caller
        # passes test-package-upload-arn and run-specs (the scheduler's own
        # per-slot pool / filter). Missing either disables the retry rather than
        # guessing, which keeps callers that pass neither on the old behaviour.
        case "${MAX_ERRORED_RETRIES:-1}" in
          ''|*[!0-9]*)
            echo "::warning::max-errored-retries='${MAX_ERRORED_RETRIES:-}' is not a non-negative integer — treating it as 0 (no retry)."
            MAX_ERRORED_RETRIES=0
            ;;
        esac
        RETRY_CREATED_ARNS=""
        SPEC_RECIPE_COUNT=0
        if [ -n "$RUN_SPECS_JSON" ] && [ "$RUN_SPECS_JSON" != "[]" ]; then
          SPEC_RECIPE_COUNT=$(echo "$RUN_SPECS_JSON" | jq 'length')
        fi
        RETRY_ENABLED=false
        if [ "$MAX_ERRORED_RETRIES" -eq 0 ]; then
          RETRY_REASON="max-errored-retries=0"
        elif [ "$SPEC_RECIPE_COUNT" -ne "$RUN_COUNT" ]; then
          RETRY_REASON="run-specs carries $SPEC_RECIPE_COUNT recipe(s) for $RUN_COUNT run(s)"
        elif [ -z "$TEST_PACKAGE_ARN" ]; then
          RETRY_REASON="test-package-upload-arn is not set"
        else
          RETRY_ENABLED=true
        fi
        if [ "$RETRY_ENABLED" = "true" ]; then
          echo "🔁 Errored-run retry: up to $MAX_ERRORED_RETRIES reschedule(s) per slot, only when Device Farm errors a run before any test executes"
        else
          echo "🔁 Errored-run retry: disabled ($RETRY_REASON)"
        fi
        echo ""

        # ERRORED with a zero test tally — the one shape we retry.
        errored_before_any_test() {
          local run_json="$1"
          [ -n "$run_json" ] || return 1
          local result total
          result=$(echo "$run_json" | jq -r '.run.result // ""')
          total=$(echo "$run_json" | jq -r '.run.counters.total // 0')
          [ "$result" = "ERRORED" ] && [ "$total" = "0" ]
        }

        # Replay slot $1's recipe as a fresh run, echoing the new ARN. Same pool
        # or device filter, same test spec, so the retry measures the same thing
        # the slot was scheduled to measure.
        reschedule_slot() {
          local slot="$1"
          local attempt="$2"
          local old_arn="$3"
          local run_json="$4"
          local name spec_arn pool_arn filter retry_name
          local project_arn app_arn timeout
          name=$(echo "$RUN_SPECS_JSON" | jq -r ".[$slot].name // \"\"")
          spec_arn=$(echo "$RUN_SPECS_JSON" | jq -r ".[$slot].specArn // \"\"")
          pool_arn=$(echo "$RUN_SPECS_JSON" | jq -r ".[$slot].poolArn // \"\"")
          filter=$(echo "$RUN_SPECS_JSON" | jq -r ".[$slot].filter // \"\"")
          if [ -z "$spec_arn" ]; then
            echo "  recipe for run $((slot+1)) has no test spec ARN" >&2
            return 1
          fi
          # A run ARN is <partition-and-account>:run:<projectId>/<runId>, and the
          # project ARN is the same prefix with :project:<projectId> — the same
          # decomposition the console links below already rely on.
          project_arn="$PROJECT_ARN"
          if [ -z "$project_arn" ]; then
            project_arn=$(echo "$old_arn" | sed -n 's|^\(arn:[^:]*:devicefarm:[^:]*:[^:]*\):run:\([^/]*\)/.*|\1:project:\2|p')
          fi
          app_arn="$APP_ARN"
          [ -n "$app_arn" ] || app_arn=$(echo "$run_json" | jq -r '.run.appUpload // ""')
          timeout="$JOB_TIMEOUT_MINUTES"
          [ -n "$timeout" ] || timeout=$(echo "$run_json" | jq -r '.run.jobTimeoutMinutes // 120')
          if [ -z "$project_arn" ] || [ -z "$app_arn" ]; then
            echo "  could not resolve project ARN / app upload for run $((slot+1))" >&2
            return 1
          fi
          retry_name="${name}-retry${attempt}"
          if [ -n "$pool_arn" ]; then
            aws devicefarm schedule-run \
              --project-arn "$project_arn" \
              --device-pool-arn "$pool_arn" \
              --app-arn "$app_arn" \
              --name "$retry_name" \
              --test "type=APPIUM_NODE,testPackageArn=$TEST_PACKAGE_ARN,testSpecArn=$spec_arn" \
              --execution-configuration jobTimeoutMinutes="$timeout" \
              --query 'run.arn' --output text
          elif [ -n "$filter" ]; then
            aws devicefarm schedule-run \
              --project-arn "$project_arn" \
              --device-selection-configuration "$filter" \
              --app-arn "$app_arn" \
              --name "$retry_name" \
              --test "type=APPIUM_NODE,testPackageArn=$TEST_PACKAGE_ARN,testSpecArn=$spec_arn" \
              --execution-configuration jobTimeoutMinutes="$timeout" \
              --query 'run.arn' --output text
          else
            echo "  recipe for run $((slot+1)) has neither a device pool nor a device filter" >&2
            return 1
          fi
        }

        # A run rescheduled here is invisible to the caller's cancel step, which
        # only knows the ARNs the scheduler returned, so it would keep billing
        # device minutes after a cancellation. Stop what this step created. Same
        # SIGKILL limitation the scheduler's rollback documents: a hard kill can
        # still orphan a run.
        stop_created_retry_runs() {
          [ -n "$RETRY_CREATED_ARNS" ] || return 0
          for arn in $RETRY_CREATED_ARNS; do
            if aws devicefarm stop-run --arn "$arn" >/dev/null 2>&1; then
              echo "  stopped $arn"
            else
              echo "  ::warning::could not stop $arn (it may have already finished)"
            fi
          done
        }

        stop_retry_runs_on_exit() {
          local status=$?
          trap - ERR INT TERM
          if [ -n "$RETRY_CREATED_ARNS" ]; then
            echo "::warning::Monitor interrupted (status $status) — stopping the run(s) it rescheduled."
            stop_created_retry_runs
          fi
          exit "$status"
        }
        trap stop_retry_runs_on_exit ERR INT TERM

        # Effective ARNs for the caller: the input list with every rescheduled
        # slot replaced, so log collection reads the run that actually executed.
        publish_effective_run_arns() {
          local json='[]' idx
          for ((idx=0; idx<RUN_COUNT; idx++)); do
            json=$(echo "$json" | jq -c --arg arn "${RUN_ARNS[$idx]}" '. + [$arn]')
          done
          echo "effective_run_arns=$json" >> "$GITHUB_OUTPUT"
        }

        # ── run-to-tests legend ────────────────────────────────────
        # When test-specs is provided (sharded mode), print a table so
        # anyone reading the log knows which tests are in each run.
        SPEC_COUNT=0
        if [ -n "$TEST_SPECS_JSON" ] && [ "$TEST_SPECS_JSON" != "[]" ]; then
          SPEC_COUNT=$(echo "$TEST_SPECS_JSON" | jq 'length')
        fi
        # Map a run slot back to its spec. The scheduler fans out spec-major with
        # a FIXED number of runs per spec: dual-flagship = 2 (Samsung + Pixel),
        # single-pool/sharded = 1, manual multi-device = the device count. So
        # runs_per_spec = RUN_COUNT / SPEC_COUNT whenever that divides evenly,
        # which covers all three (2, 1, and N>2 manual fan-outs). The old code
        # only special-cased the *2 dual-flagship shape and mislabelled manual
        # runs with >2 devices; this generalises it. Falls back to a 1:1 mapping
        # if the counts don't divide (defensive; shouldn't happen).
        spec_index_for_run() {
          local run_index="$1"
          if [ "$SPEC_COUNT" -gt 0 ] && [ $((RUN_COUNT % SPEC_COUNT)) -eq 0 ]; then
            local per_spec=$((RUN_COUNT / SPEC_COUNT))
            echo $((run_index / per_spec))
          else
            echo "$run_index"
          fi
        }
        if [ "$SPEC_COUNT" -gt 0 ]; then
          echo "::group::Run → tests mapping"
          for ((i=0; i<RUN_COUNT; i++)); do
            _spec_index=$(spec_index_for_run "$i")
            _name=$(echo "$TEST_SPECS_JSON" | jq -r ".[$_spec_index].name // \"?\"")
            # QVAC-19368: prefer the `tests` field (covers default single-spec
            # mode where grep is empty) and fall back to `grep` for older
            # callers that don't emit `tests`.
            _list=$(echo "$TEST_SPECS_JSON" | jq -r ".[$_spec_index].tests // .[$_spec_index].grep // \"\"")
            _tests=$(echo "$_list" | tr '|' ', ')
            echo "  Run $((i+1)): $_name → $_tests"
          done
          echo "::endgroup::"
          echo ""
        fi

        # ── legend (QVAC-18943, ported from PR #2072) ───────────────
        # Printed once so anyone reading the log can decode the per-poll
        # status line, the transition ::notice::s, and the periodic
        # per-job deep dive without cross-referencing AWS docs.
        echo "::group::Legend (Device Farm run-level + per-job fields)"
        echo "Run-level status (AWS Device Farm Run.status):"
        echo "  PENDING / PENDING_CONCURRENCY / PENDING_DEVICE  waiting in queue"
        echo "  SCHEDULING / PREPARING                          AWS reserving + warming the device"
        echo "  RUNNING                                         coarse 'work in progress' bucket"
        echo "  COMPLETED                                       run finished (see result)"
        echo "Run-level result (AWS Device Farm Run.result):"
        echo "  PENDING                                         still in progress (any non-terminal status)"
        echo "  PASSED / FAILED / ERRORED / WARNED / SKIPPED    terminal outcomes"
        echo "  STOPPED                                         cut short by stop-run / timeout"
        echo "Status line format:"
        echo "  ⏳ Run N: <status> (<result>) | ...             one segment per slot, refreshed every 30s"
        echo "Deep dive (per-Job fields from list-jobs, every 180s):"
        echo "  device=<phone name> os=<ver>                    actual hardware AWS picked from the pool"
        echo "  state=<Job.status>                              per-device state inside the run-level RUNNING bucket"
        echo "    PENDING_DEVICE  waiting on an actual phone        PROCESSING  installing IPA/APK"
        echo "    SCHEDULING / PREPARING  warming up                RUNNING     test code is executing"
        echo "  result=<Job.result>                             PENDING until job ends, then PASSED/FAILED/..."
        echo "  counters=<P>P/<F>F/<E>E/<S>S of <T>             test entity tally for this device"
        echo "    P passed   F failed   E errored   S skipped   T total tests in the slot"
        echo "  started=<timestamp>                             when this device started executing"
        echo "  msg=<short>                                     first ~120 chars of Device Farm's status message"
        echo "Transition notices (::notice::, shown at top of job UI):"
        echo "  '<state> -> RUNNING after <Q>s of queue time'   slot acquired a device"
        echo "  'queued <Q>s | executed <X>s | total <T>s'      slot finished; T == Q + X"
        echo "  'RESCHEDULED -> ...'                            slot was retried; its times restart here"
        echo "Rescheduling (::warning::):"
        echo "  'Run N rescheduled'                             Device Farm errored the run with 0 tests executed"
        echo "                                                  (infrastructure failure) and it was scheduled again"
        echo "::endgroup::"
        echo ""

        # ── polling loop ─────────────────────────────────────────────
        MAX_WAIT_TIME="${MAX_WAIT_TIME_SECONDS:-7200}"
        ELAPSED=0
        DONE_COUNT=0
        DONE=()
        CUR_STATUS=()
        CUR_RESULT=()
        # QVAC-18943 per-slot transition tracking. PREV_STATUS records
        # the last status we observed so we can detect state changes
        # (PENDING -> RUNNING, RUNNING -> COMPLETED, ...). RUNNING_AT
        # captures the ELAPSED at which a slot first entered RUNNING,
        # used to compute queued vs executed time on COMPLETED.
        PREV_STATUS=()
        RUNNING_AT=()
        # RETRIES_USED caps reschedules per slot. SLOT_EPOCH is the ELAPSED at
        # which the slot's current run started being monitored — 0 for the runs
        # the scheduler created, and the reschedule time for a retried slot, so
        # the queue / execution figures below stay relative to the run they
        # describe instead of counting the errored attempt's wait as queue time.
        RETRIES_USED=()
        SLOT_EPOCH=()
        for ((i=0; i<RUN_COUNT; i++)); do
          DONE[$i]="false"
          CUR_STATUS[$i]="PENDING"
          CUR_RESULT[$i]="PENDING"
          PREV_STATUS[$i]=""
          RUNNING_AT[$i]=""
          RETRIES_USED[$i]=0
          SLOT_EPOCH[$i]=0
        done

        # Run-level RUNNING is a coarse bucket. Every DEEP_DIVE_INTERVAL
        # seconds drill into list-jobs to see per-device state
        # (PENDING_DEVICE / PROCESSING / PREPARING / RUNNING / ...)
        # plus test counters. Schema: AWS Device Farm Job + Counters.
        DEEP_DIVE_INTERVAL=180
        LAST_DEEP_DIVE=-1

        while [ $DONE_COUNT -lt $RUN_COUNT ]; do
          STATUS_LINE=""
          for ((i=0; i<RUN_COUNT; i++)); do
            arn="${RUN_ARNS[$i]}"
            if [ "${DONE[$i]}" != "true" ]; then
              RUN_JSON=$(aws_retry aws devicefarm get-run --arn "$arn" --output json) || true
              CUR_STATUS[$i]=$(echo "$RUN_JSON" | jq -r '.run.status // "UNKNOWN"')
              CUR_RESULT[$i]=$(echo "$RUN_JSON" | jq -r '.run.result // "UNKNOWN"')
              if [ "${CUR_STATUS[$i]}" = "COMPLETED" ]; then
                if [ "$RETRY_ENABLED" = "true" ] \
                   && [ "${RETRIES_USED[$i]}" -lt "$MAX_ERRORED_RETRIES" ] \
                   && errored_before_any_test "$RUN_JSON"; then
                  _attempt=$(( ${RETRIES_USED[$i]} + 1 ))
                  _old_arn="${RUN_ARNS[$i]}"
                  _new_arn=$(reschedule_slot "$i" "$_attempt" "$_old_arn" "$RUN_JSON") || _new_arn=""
                  if [ -n "$_new_arn" ] && [ "$_new_arn" != "None" ]; then
                    RETRIES_USED[$i]=$_attempt
                    RETRY_CREATED_ARNS="$RETRY_CREATED_ARNS $_new_arn"
                    RUN_ARNS[$i]="$_new_arn"
                    CUR_STATUS[$i]="PENDING"
                    CUR_RESULT[$i]="PENDING"
                    PREV_STATUS[$i]="RESCHEDULED"
                    RUNNING_AT[$i]=""
                    SLOT_EPOCH[$i]=$ELAPSED
                    echo "::warning title=Device Farm Run $((i+1)) rescheduled::Device Farm errored this run before any test executed (attempt $_attempt of $MAX_ERRORED_RETRIES). Replaced $_old_arn with $_new_arn"
                  else
                    echo "::warning::Run $((i+1)) errored before any test executed and could not be rescheduled — keeping the ERRORED result."
                    DONE[$i]="true"
                    DONE_COUNT=$((DONE_COUNT + 1))
                  fi
                else
                  DONE[$i]="true"
                  DONE_COUNT=$((DONE_COUNT + 1))
                fi
              fi

              # Transition signals. RUNNING / COMPLETED get promoted
              # to ::notice:: so they surface at the top of the job
              # UI; everything else goes to a plain echo so the log
              # still tells the full story without notice spam.
              prev_status="${PREV_STATUS[$i]}"
              cur_status="${CUR_STATUS[$i]}"
              cur_result="${CUR_RESULT[$i]}"
              # 0 unless this slot was rescheduled, so the figures below describe
              # the run being reported rather than the whole monitoring window.
              slot_epoch="${SLOT_EPOCH[$i]}"
              if [ -n "$cur_status" ] && [ "$cur_status" != "$prev_status" ]; then
                TS=$(date -u +%H:%M:%S)
                if [ -z "$prev_status" ]; then
                  # First observation. We don't know the real
                  # transition time so just announce the attach.
                  echo "🔌 Monitor attached: Run $((i+1)) starting from state=$cur_status (t=${ELAPSED}s)"
                  if [ "$cur_status" = "RUNNING" ]; then
                    RUNNING_AT[$i]=$ELAPSED
                  fi
                elif [ "$cur_status" = "RUNNING" ]; then
                  if [ -z "${RUNNING_AT[$i]}" ]; then
                    RUNNING_AT[$i]=$ELAPSED
                    echo "::notice title=Device Farm Run $((i+1)) acquired device::[$TS] $prev_status -> RUNNING after $((ELAPSED - slot_epoch))s of queue time"
                  fi
                elif [ "$cur_status" = "COMPLETED" ]; then
                  running_at="${RUNNING_AT[$i]}"
                  if [ -n "$running_at" ]; then
                    exec_time=$((ELAPSED - running_at))
                    echo "::notice title=Device Farm Run $((i+1)) finished::[$TS] result=$cur_result | queued $((running_at - slot_epoch))s | executed ${exec_time}s | total $((ELAPSED - slot_epoch))s"
                  else
                    # Defensive: COMPLETED without ever observing
                    # RUNNING means we missed the RUNNING window between
                    # two 30s polls (rare, trivially short runs) or the
                    # run errored straight from a pending state.
                    echo "::notice title=Device Farm Run $((i+1)) finished::[$TS] result=$cur_result | total $((ELAPSED - slot_epoch))s (no RUNNING window observed)"
                  fi
                else
                  echo "🔄 Run $((i+1)): $prev_status -> $cur_status (elapsed ${ELAPSED}s)"
                fi
                PREV_STATUS[$i]="$cur_status"
              fi
            fi
            [ -n "$STATUS_LINE" ] && STATUS_LINE="${STATUS_LINE} | "
            STATUS_LINE="${STATUS_LINE}Run $((i+1)): ${CUR_STATUS[$i]} (${CUR_RESULT[$i]})"
          done
          echo "⏳ ${STATUS_LINE} | ${ELAPSED}s"

          # Periodic per-device drill-down. For every slot currently in
          # RUNNING, dump each child job's device + state + counters so
          # we can tell whether the slot is waiting on PENDING_DEVICE,
          # stuck in PROCESSING (app install), or genuinely executing.
          if [ $((ELAPSED - LAST_DEEP_DIVE)) -ge $DEEP_DIVE_INTERVAL ]; then
            LAST_DEEP_DIVE=$ELAPSED
            ANY_RUNNING=false
            for ((i=0; i<RUN_COUNT; i++)); do
              if [ "${CUR_STATUS[$i]}" = "RUNNING" ]; then ANY_RUNNING=true; fi
            done
            if [ "$ANY_RUNNING" = "true" ]; then
              echo "::group::Deep dive: per-job state inside RUNNING slots (t=${ELAPSED}s)"
              for ((i=0; i<RUN_COUNT; i++)); do
                if [ "${CUR_STATUS[$i]}" = "RUNNING" ]; then
                  arn="${RUN_ARNS[$i]}"
                  JOBS_JSON=$(aws_retry aws devicefarm list-jobs --arn "$arn" --output json) || true
                  if [ -n "$JOBS_JSON" ]; then
                    echo "Run $((i+1)):"
                    echo "$JOBS_JSON" | jq -r '.jobs[]? | "  device=\(.device.name // "?") os=\(.device.os // "?") | state=\(.status // "?") result=\(.result // "?") | counters=\((.counters // {}).passed // 0)P/\((.counters // {}).failed // 0)F/\((.counters // {}).errored // 0)E/\((.counters // {}).skipped // 0)S of \((.counters // {}).total // 0) | started=\(.started // "-") msg=\((.message // "") | gsub("\n"; " ") | .[0:120])"' || echo "  (jq parse failed)"
                  else
                    echo "Run $((i+1)): list-jobs returned empty / API error"
                  fi
                fi
              done
              echo "::endgroup::"
            fi
          fi

          if [ $DONE_COUNT -ge $RUN_COUNT ]; then
            echo ""
            echo "✅ All runs completed!"
            break
          fi
          if [ $ELAPSED -ge $MAX_WAIT_TIME ]; then
            echo ""
            echo "❌ Timeout: exceeded ${MAX_WAIT_TIME}s"
            if [ -n "$RETRY_CREATED_ARNS" ]; then
              echo "   A rescheduled run was still in flight. If that is routine here, raise max-wait-time-seconds: a retry restarts the slot's queue and execution inside this same budget."
              # Timing out abandons monitoring, and the caller's cancel step does
              # not know these ARNs, so stop them here rather than let them bill
              # on to their own jobTimeoutMinutes.
              stop_created_retry_runs
            fi
            publish_effective_run_arns
            exit 1
          fi
          sleep 30
          ELAPSED=$((ELAPSED + 30))
        done

        publish_effective_run_arns
        # Every slot is COMPLETED from here, so there is nothing left to stop and
        # the aggregation below must not be able to trip the rollback.
        trap - ERR INT TERM

        # ── aggregate results ────────────────────────────────────────
        DEVICE_COUNT=0
        USER_PASSED=0
        USER_FAILED=0
        FAILED_TEST_DETAILS=()
        ALL_RESULTS_PASSED=true
        TOTAL_TOTAL=0
        TOTAL_PASSED=0
        TOTAL_FAILED=0
        TOTAL_SKIPPED=0

        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📊 FINAL TEST RESULTS"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""

        RUN_INDEX=0
        for RUN_ARN in "${RUN_ARNS[@]}"; do
          RUN_INDEX=$((RUN_INDEX + 1))
          RUN_DETAILS=$(aws_retry aws devicefarm get-run --arn "$RUN_ARN" --output json) || true
          [ -z "$RUN_DETAILS" ] && RUN_DETAILS='{}'
          RESULT=$(echo "$RUN_DETAILS" | jq -r '.run.result // "UNKNOWN"')
          RUN_NAME_LABEL=$(echo "$RUN_DETAILS" | jq -r '.run.name // "unknown"')
          COUNTERS=$(echo "$RUN_DETAILS" | jq -r '.run.counters // {}')

          if [ "$RESULT" != "PASSED" ] && [ "$RESULT" != "SKIPPED" ]; then
            ALL_RESULTS_PASSED=false
          fi

          TOTAL_TOTAL=$((TOTAL_TOTAL + $(echo "$COUNTERS" | jq -r '.total // 0')))
          TOTAL_PASSED=$((TOTAL_PASSED + $(echo "$COUNTERS" | jq -r '.passed // 0')))
          TOTAL_FAILED=$((TOTAL_FAILED + $(echo "$COUNTERS" | jq -r '.failed // 0')))
          TOTAL_SKIPPED=$((TOTAL_SKIPPED + $(echo "$COUNTERS" | jq -r '.skipped // 0')))

          PROJECT_ID=$(echo "$RUN_ARN" | sed -n 's/.*:run:\([^/]*\)\/.*/\1/p')
          RUN_ID=$(echo "$RUN_ARN" | sed -n 's/.*:run:[^/]*\/\(.*\)/\1/p')

          if [ "$RUN_COUNT" -ge 2 ]; then
            _idx=$((RUN_INDEX - 1))
            _spec_tests=""
            _spec_index=$(spec_index_for_run "$_idx")
            if [ "$SPEC_COUNT" -gt 0 ] && [ "$_spec_index" -lt "$SPEC_COUNT" ]; then
              # QVAC-19368: prefer `tests` (default-mode list), fall back to grep.
              _spec_tests=$(echo "$TEST_SPECS_JSON" | jq -r ".[$_spec_index].tests // .[$_spec_index].grep // \"\"" | tr '|' ', ')
            fi
            if [ -n "$_spec_tests" ]; then
              echo "--- Run $RUN_INDEX: $RUN_NAME_LABEL (Result: $RESULT) [tests: $_spec_tests] ---"
            else
              echo "--- Run $RUN_INDEX: $RUN_NAME_LABEL (Result: $RESULT) ---"
            fi
          else
            echo "Result: $RESULT"
          fi

          JOBS=$(aws_retry aws devicefarm list-jobs --arn "$RUN_ARN" --output json) || true
          [ -z "$JOBS" ] && JOBS='{"jobs":[]}'
          for JOB_ARN in $(echo "$JOBS" | jq -r '.jobs[].arn'); do
            DEVICE_COUNT=$((DEVICE_COUNT + 1))
            JOB_DETAILS=$(aws_retry aws devicefarm get-job --arn "$JOB_ARN" --output json) || true
            [ -z "$JOB_DETAILS" ] && JOB_DETAILS='{}'
            DEVICE_NAME=$(echo "$JOB_DETAILS" | jq -r '.job.device.name // "Unknown Device"')
            JOB_RESULT=$(echo "$JOB_DETAILS" | jq -r '.job.result // "UNKNOWN"')
            JOB_ID=$(echo "$JOB_ARN" | sed -n 's/.*:job:[^/]*\/[^/]*\/\(.*\)/\1/p')
            CONSOLE_LINK="https://us-west-2.console.aws.amazon.com/devicefarm/home#/mobile/projects/${PROJECT_ID}/runs/${RUN_ID}/jobs/${JOB_ID}"

            JOB_COUNTERS=$(echo "$JOB_DETAILS" | jq -r '.job.counters // {}')
            JOB_FAILED_COUNT=$(echo "$JOB_COUNTERS" | jq -r '.failed // 0')
            JOB_ERRORED_COUNT=$(echo "$JOB_COUNTERS" | jq -r '.errored // 0')
            JOB_TOTAL_COUNT=$(echo "$JOB_COUNTERS" | jq -r '.total // 0')
            JOB_PASSED_COUNT=$(echo "$JOB_COUNTERS" | jq -r '.passed // 0')

            if [ "$JOB_RESULT" = "PASSED" ] || [ "$JOB_RESULT" = "WARNED" ]; then
              echo "   ✅ $DEVICE_NAME: $JOB_RESULT (${JOB_PASSED_COUNT}/${JOB_TOTAL_COUNT} passed)"
              USER_PASSED=$((USER_PASSED + 1))
            elif [ "$JOB_RESULT" = "STOPPED" ]; then
              if [ "$JOB_FAILED_COUNT" -eq 0 ] && [ "$JOB_ERRORED_COUNT" -eq 0 ] && [ "$JOB_PASSED_COUNT" -gt 0 ]; then
                echo "   ⚠️  $DEVICE_NAME: STOPPED (Device Farm timeout) but all ${JOB_PASSED_COUNT}/${JOB_TOTAL_COUNT} tests passed — treating as success"
                echo "   💡 Increase job-timeout-minutes if this recurs (device ran out of DF time during teardown, not during tests)"
                USER_PASSED=$((USER_PASSED + 1))
              else
                echo "   ❌ $DEVICE_NAME: STOPPED with failures (${JOB_FAILED_COUNT}F/${JOB_ERRORED_COUNT}E of ${JOB_TOTAL_COUNT})"
                USER_FAILED=$((USER_FAILED + 1))
                FAILED_TEST_DETAILS+=("❌ $DEVICE_NAME: STOPPED (${JOB_FAILED_COUNT} failed, ${JOB_ERRORED_COUNT} errored)")
                FAILED_TEST_DETAILS+=("   📎 View logs: $CONSOLE_LINK")
              fi
            else
              echo "   ❌ $DEVICE_NAME: $JOB_RESULT (${JOB_FAILED_COUNT}F/${JOB_ERRORED_COUNT}E of ${JOB_TOTAL_COUNT})"
              USER_FAILED=$((USER_FAILED + 1))
              FAILED_TEST_DETAILS+=("❌ $DEVICE_NAME: $JOB_RESULT")
              FAILED_TEST_DETAILS+=("   📎 View logs: $CONSOLE_LINK")
            fi
          done

          echo "   🔗 Run link: https://us-west-2.console.aws.amazon.com/devicefarm/home#/mobile/projects/${PROJECT_ID}/runs/${RUN_ID}"
          echo ""
        done

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📊 SUMMARY"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "Devices tested: $DEVICE_COUNT"
        echo "  ✅ Passed: $USER_PASSED"
        echo "  ❌ Failed: $USER_FAILED"
        echo ""

        if [ "$USER_FAILED" -gt 0 ]; then
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ FAILED TESTS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          for failed_info in "${FAILED_TEST_DETAILS[@]}"; do
            echo "$failed_info"
          done
          echo ""
        fi

        echo "Device Farm totals: $TOTAL_TOTAL | Passed: $TOTAL_PASSED | Failed: $TOTAL_FAILED | Skipped: $TOTAL_SKIPPED"
        echo ""

        # ── outputs ──────────────────────────────────────────────────
        if [ $USER_FAILED -gt 0 ]; then
          echo "test_result=FAILED" >> "$GITHUB_OUTPUT"
        elif [ $USER_PASSED -gt 0 ]; then
          echo "test_result=PASSED" >> "$GITHUB_OUTPUT"
        else
          echo "test_result=FAILED" >> "$GITHUB_OUTPUT"
        fi
        echo "test_total=$TOTAL_TOTAL" >> "$GITHUB_OUTPUT"
        echo "test_passed=$TOTAL_PASSED" >> "$GITHUB_OUTPUT"
        echo "test_failed=$TOTAL_FAILED" >> "$GITHUB_OUTPUT"
        echo "test_skipped=$TOTAL_SKIPPED" >> "$GITHUB_OUTPUT"
        echo "user_test_passed=$USER_PASSED" >> "$GITHUB_OUTPUT"
        echo "user_test_failed=$USER_FAILED" >> "$GITHUB_OUTPUT"

        # ── GitHub Step Summary ─────────────────────────────────────
        {
          if [ $USER_FAILED -gt 0 ]; then
            echo "### :x: Device Farm Test Results"
          elif [ $USER_PASSED -gt 0 ]; then
            echo "### :white_check_mark: Device Farm Test Results"
          else
            echo "### :warning: Device Farm Test Results"
          fi
          echo ""
          echo "| Metric | Count |"
          echo "| --- | --- |"
          echo "| Devices passed | $USER_PASSED |"
          echo "| Devices failed | $USER_FAILED |"
          echo "| Test cases total | $TOTAL_TOTAL |"
          echo "| Test cases passed | $TOTAL_PASSED |"
          echo "| Test cases failed | $TOTAL_FAILED |"
          echo "| Test cases skipped | $TOTAL_SKIPPED |"
          echo ""
          if [ "$USER_FAILED" -gt 0 ]; then
            echo "<details><summary>Failed devices</summary>"
            echo ""
            for failed_info in "${FAILED_TEST_DETAILS[@]}"; do
              echo "- \`${failed_info}\`"
            done
            echo ""
            echo "</details>"
            echo ""
          fi
          for ((i=0; i<RUN_COUNT; i++)); do
            arn="${RUN_ARNS[$i]}"
            _proj=$(echo "$arn" | sed -n 's/.*:run:\([^/]*\)\/.*/\1/p')
            _rid=$(echo "$arn" | sed -n 's/.*:run:[^/]*\/\(.*\)/\1/p')
            echo "- [Device Farm Run $((i+1))](https://us-west-2.console.aws.amazon.com/devicefarm/home#/mobile/projects/${_proj}/runs/${_rid})"
          done
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

        if [ $USER_FAILED -gt 0 ]; then
          echo ""
          echo "❌ Device Farm tests failed"
          echo "   Devices: $USER_PASSED passed, $USER_FAILED failed (out of $DEVICE_COUNT)"
          echo "   Totals: $TOTAL_TOTAL | Passed: $TOTAL_PASSED | Failed: $TOTAL_FAILED | Skipped: $TOTAL_SKIPPED"
          exit 1
        elif [ $USER_PASSED -eq 0 ] && [ "$ALL_RESULTS_PASSED" != "true" ]; then
          echo ""
          echo "❌ No devices ran tests (all runs skipped or errored)"
          exit 1
        fi

        echo ""
        echo "✅ Device Farm tests passed!"
        echo "   Devices: $USER_PASSED passed (out of $DEVICE_COUNT)"
        if [ "$TOTAL_SKIPPED" -gt 0 ]; then
          echo "   ⚠️  $TOTAL_SKIPPED test(s) skipped (device unavailable)"
        fi
        echo "   Totals: $TOTAL_TOTAL | Passed: $TOTAL_PASSED | Failed: $TOTAL_FAILED | Skipped: $TOTAL_SKIPPED"
