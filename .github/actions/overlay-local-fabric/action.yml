name: 'Overlay local @qvac/fabric'
description: >
  Copy PR-built fabric prebuilds into the installed @qvac/fabric meta package
  (headers + CMake) and the matching @qvac/fabric-<platform> runtime package
  under the consumer workdir. Must run after npm install and before bare-make
  generate so find_package(qvac-fabric) and include_bare_module resolve the
  overlaid tree.

inputs:
  workdir:
    description: 'Consumer package directory, e.g. packages/classification-ggml'
    required: true
  prebuilds-root:
    description: 'Path to the merged fabric prebuilds tree (include/, share/, <platform>-<arch>/)'
    required: true
  platform:
    description: 'When set with arch, overlay only this platform directory'
    required: false
    default: ''
  arch:
    description: 'Platform arch suffix (x64, arm64, ...) paired with platform'
    required: false
    default: ''
  tags:
    description: 'Optional platform suffix (e.g. -simulator for ios-*-simulator jobs)'
    required: false
    default: ''
  search-dirs:
    description: 'Extra directories to search for node_modules/@qvac/fabric (space-separated)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Overlay PR fabric prebuilds into @qvac/fabric
      shell: bash
      env:
        WORKDIR: ${{ inputs.workdir }}
        SRC: ${{ inputs.prebuilds-root }}
        PLATFORM: ${{ inputs.platform }}
        ARCH: ${{ inputs.arch }}
        TAGS: ${{ inputs.tags }}
        SEARCH_DIRS: ${{ inputs.search-dirs }}
      run: node "$GITHUB_ACTION_PATH/overlay.js"
