name: Setup Bare tooling
description: Setup Node, install the global Bare runtime, and put the locked bare-make toolchain from .github/bare-toolchain first on PATH.

inputs:
  shell_type:
    description: "bash | powershell"
    required: false
    default: bash
  node-version:
    description: Node version to install
    required: false
    default: lts/*
  extra-packages:
    description: Whitespace-separated list of additional global npm packages to install alongside bare-runtime
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup node
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # 6.3.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install global dependencies
      shell: ${{ inputs.shell_type }}
      run: npm install -g --force bare-runtime ${{ inputs.extra-packages }}

    # A remote reference downloads the whole repository at the pinned SHA, so
    # the lockfile two levels up is the one from that same commit.
    - name: Install the locked bare toolchain
      shell: ${{ inputs.shell_type }}
      run: node "${{ github.action_path }}/../../bare-toolchain/install.mjs"
