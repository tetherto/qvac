name: 'Detect fabric stack'
description: >
  Read-only detection for fabric-stack PRs. Sets fabric_stack=true when the
  event delta touches the qvac-fabric overlay port or packages/fabric vcpkg
  manifests. Used to disable stale prebuild reuse and to wire npm-runtime
  consumers to PR-built @qvac/fabric prebuilds.

outputs:
  fabric_stack:
    description: 'true when this PR is a fabric-stack change'
    value: ${{ steps.detect.outputs.fabric_stack }}

runs:
  using: composite
  steps:
    - name: Detect fabric-stack paths
      id: detect
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BEFORE_SHA: ${{ github.event.before }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
      run: |
        set -euo pipefail

        if [ "$EVENT_NAME" = "workflow_dispatch" ] || \
           [ "$EVENT_NAME" = "workflow_call" ] || \
           [ "$EVENT_NAME" = "push" ]; then
          echo "Trusted event ($EVENT_NAME) — treating as fabric-stack"
          echo "fabric_stack=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        FETCHED=false
        if [ -n "$HEAD_SHA" ]; then
          if git fetch origin "$HEAD_SHA" --depth=1 2>/dev/null; then
            FETCHED=true
          elif [ -n "$HEAD_REPO" ] && [ -n "$HEAD_REF" ]; then
            echo "SHA not fetchable from origin (likely fork PR) — trying $HEAD_REPO/$HEAD_REF"
            if git fetch "https://github.com/${HEAD_REPO}.git" "$HEAD_REF" --depth=1 2>/dev/null; then
              HEAD_SHA=$(git rev-parse FETCH_HEAD)
              FETCHED=true
            fi
          fi
        fi

        if [ "$FETCHED" != "true" ]; then
          echo "::warning::Could not fetch PR head — treating as fabric-stack (safe default)"
          echo "fabric_stack=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        DIFF_FROM="$HEAD_SHA"
        if [ "$EVENT_ACTION" = "opened" ]; then
          DIFF_FROM="$BASE_SHA"
        elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$HEAD_SHA" ]; then
          DIFF_FROM="$BEFORE_SHA"
          if ! git fetch origin "$BEFORE_SHA" --depth=1 2>/dev/null; then
            if [ -n "$HEAD_REPO" ] && [ -n "$HEAD_REF" ]; then
              git fetch "https://github.com/${HEAD_REPO}.git" "$HEAD_REF" --depth=50 2>/dev/null || true
            fi
            if ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
              echo "::warning::BEFORE_SHA ($BEFORE_SHA) unreachable — falling back to base..head diff"
              DIFF_FROM="$BASE_SHA"
            fi
          fi
        fi

        if [ -n "$DIFF_FROM" ] && ! git cat-file -e "$DIFF_FROM" 2>/dev/null; then
          git fetch origin "$DIFF_FROM" --depth=1 2>/dev/null || true
        fi

        STACK=false
        if [ -n "$DIFF_FROM" ] && [ -n "$HEAD_SHA" ]; then
          DIFF_FILES=$(git diff --name-only "$DIFF_FROM" "$HEAD_SHA" -- 2>&1) || {
            echo "::warning::git diff failed — treating as fabric-stack"
            echo "fabric_stack=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ -n "$DIFF_FILES" ]; then
            while IFS= read -r file; do
              case "$file" in
                vcpkg-overlays/ports/qvac-fabric/*) STACK=true; break ;;
                packages/fabric/vcpkg.json|packages/fabric/vcpkg-configuration.json) STACK=true; break ;;
              esac
            done <<< "$DIFF_FILES"
          fi
        else
          STACK=true
        fi

        echo "Fabric stack: $STACK"
        echo "fabric_stack=$STACK" >> "$GITHUB_OUTPUT"
