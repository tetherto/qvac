name: "Setup ROCm (TheRock) for HIP cross-compile"
description: >-
  Installs the TheRock ROCm dist (gfx target) on a linux-x64 runner and exports
  ROCM_PATH/HIP_PATH/PATH(bin)/VCPKG_KEEP_ENV_VARS/LD_LIBRARY_PATH so a consumer's
  qvac-fabric hip-backend feature can cross-compile libqvac-ggml-hip.so. No AMD
  GPU is required on the runner (compile-only, like nvcc for CUDA). Prefers a
  host-baked SDK at /opt/rocm when /opt/rocm/.qvac-rocm matches the requested
  pin (self-hosted qvac-* linux-x64 images); otherwise downloads + caches.

inputs:
  rocm-version:
    description: "TheRock ROCm dist tarball version"
    required: false
    default: "7.13.0"
  gfx:
    description: "AMD GPU arch target (TheRock dist family)"
    required: false
    default: "gfx1151"
  sha256:
    description: >-
      Expected SHA-256 of the TheRock dist tarball. Pins the toolchain against a
      silent re-upload of the same version (supply chain). MUST be updated when
      rocm-version/gfx change — a mismatch fails the build. The default matches
      the action's default rocm-version/gfx; leave empty only to deliberately
      skip verification.
    required: false
    default: "6550da740ac8565ec2f1dc886f6ec6425af1df79588d773594163b0778832560"

runs:
  using: composite
  steps:
    # Self-hosted qvac-* linux-x64 images bake TheRock at /opt/rocm (ansible
    # roles/rocm). Skip the multi-GB download when the stamp matches this pin.
    - name: Detect host-baked ROCm at /opt/rocm
      id: preinstalled
      shell: bash
      env:
        ROCM_VERSION: ${{ inputs.rocm-version }}
        ROCM_GFX: ${{ inputs.gfx }}
        ROCM_SHA256: ${{ inputs.sha256 }}
      run: |
        hipcfg="/opt/rocm/lib/cmake/hip/hip-config.cmake"
        marker="/opt/rocm/.qvac-rocm"
        if [ ! -f "$hipcfg" ]; then
          echo "No host-baked ROCm at /opt/rocm — will download/cache"
          echo "hit=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ ! -f "$marker" ]; then
          echo "Found $hipcfg but no $marker — ignoring unmarked /opt/rocm, will download/cache"
          echo "hit=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        stamp_gfx="$(sed -n 's/^gfx=//p' "$marker" | head -1 | tr -d '\r')"
        stamp_version="$(sed -n 's/^version=//p' "$marker" | head -1 | tr -d '\r')"
        stamp_sha="$(sed -n 's/^sha256=//p' "$marker" | head -1 | tr -d '\r')"
        if [ "$stamp_gfx" != "$ROCM_GFX" ] || [ "$stamp_version" != "$ROCM_VERSION" ]; then
          echo "Host-baked ROCm is ${stamp_gfx}/${stamp_version}, want ${ROCM_GFX}/${ROCM_VERSION} — will download/cache"
          echo "hit=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -n "$ROCM_SHA256" ] && [ "$stamp_sha" != "$ROCM_SHA256" ]; then
          echo "Host-baked ROCm sha256 ${stamp_sha} != ${ROCM_SHA256} — will download/cache"
          echo "hit=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "Using host-baked ROCm at /opt/rocm (${ROCM_GFX} ${ROCM_VERSION})"
        echo "hit=true" >> "$GITHUB_OUTPUT"
        echo "prefix=/opt/rocm" >> "$GITHUB_OUTPUT"

    # Restore on every trigger (including fork PRs). Cache writes from fork-PR
    # code are the poisoning risk .cursor/rules/devops/github-actions.mdc
    # § Caching guards against — save is a separate step below.
    - name: Restore ROCm SDK cache (TheRock dist)
      if: steps.preinstalled.outputs.hit != 'true'
      id: cache-rocm
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
      with:
        path: ${{ runner.temp }}/rocm
        key: rocm-therock-${{ inputs.gfx }}-${{ inputs.rocm-version }}-${{ inputs.sha256 }}

    - name: Download + verify + extract ROCm SDK (TheRock dist)
      if: steps.preinstalled.outputs.hit != 'true' && steps.cache-rocm.outputs.cache-hit != 'true'
      shell: bash
      env:
        ROCM_VERSION: ${{ inputs.rocm-version }}
        ROCM_GFX: ${{ inputs.gfx }}
        ROCM_SHA256: ${{ inputs.sha256 }}
      run: |
        url="https://repo.amd.com/rocm/tarball/therock-dist-linux-${ROCM_GFX}-${ROCM_VERSION}.tar.gz"
        echo "Downloading $url"
        curl -fsSL "$url" -o "$RUNNER_TEMP/rocm.tar.gz"
        if [ -n "$ROCM_SHA256" ]; then
          echo "Verifying SHA-256 ($ROCM_SHA256)"
          echo "$ROCM_SHA256  $RUNNER_TEMP/rocm.tar.gz" | sha256sum -c -
        else
          echo "::warning::No sha256 pin provided — skipping integrity verification of the ROCm tarball"
        fi
        mkdir -p "$RUNNER_TEMP/rocm"
        tar -xzf "$RUNNER_TEMP/rocm.tar.gz" -C "$RUNNER_TEMP/rocm"
        rm -f "$RUNNER_TEMP/rocm.tar.gz"

    # Save only from trusted contexts. Empty head.repo.full_name means this is
    # not a pull_request (push / workflow_dispatch / merge_group / workflow_call
    # without a PR payload). A set value must match this repo — fork PRs restore
    # only. Same shape as cache-models.
    - name: Save ROCm SDK cache (trusted contexts)
      if: >-
        steps.preinstalled.outputs.hit != 'true' &&
        steps.cache-rocm.outputs.cache-hit != 'true' &&
        (github.event.pull_request.head.repo.full_name == '' ||
         github.event.pull_request.head.repo.full_name == github.repository)
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # 5.0.4
      with:
        path: ${{ runner.temp }}/rocm
        key: rocm-therock-${{ inputs.gfx }}-${{ inputs.rocm-version }}-${{ inputs.sha256 }}

    - name: Export ROCm environment
      shell: bash
      env:
        ROCM_PREINSTALLED: ${{ steps.preinstalled.outputs.hit }}
        ROCM_PREINSTALLED_PREFIX: ${{ steps.preinstalled.outputs.prefix }}
      run: |
        if [ "$ROCM_PREINSTALLED" = "true" ]; then
          rocm_prefix="$ROCM_PREINSTALLED_PREFIX"
        else
          hipcfg="$(find "$RUNNER_TEMP/rocm" -path '*/lib/cmake/hip/hip-config.cmake' | head -1)"
          if [ -z "$hipcfg" ]; then echo "::error::ROCm hip-config.cmake not found after extract"; exit 1; fi
          rocm_prefix="$(cd "$(dirname "$hipcfg")/../../.." && pwd)"
        fi
        echo "ROCm prefix: $rocm_prefix"
        # Only $prefix/bin on PATH (hipcc) — NOT lib/llvm/bin, whose bundled
        # libc++ lacks __config_site and would hijack the system clang++ used for
        # the regular C++/llama sources.
        echo "ROCM_PATH=$rocm_prefix" >> "$GITHUB_ENV"
        echo "HIP_PATH=$rocm_prefix" >> "$GITHUB_ENV"
        echo "$rocm_prefix/bin" >> "$GITHUB_PATH"
        # Merge, not assign: setup-cuda sets the same var, last one would win.
        keep="ROCM_PATH;HIP_PATH"
        if [ -n "${VCPKG_KEEP_ENV_VARS:-}" ]; then
          # Strip a trailing ';', an empty keep-list entry is log noise.
          keep="${VCPKG_KEEP_ENV_VARS%;};${keep}"
        fi
        echo "VCPKG_KEEP_ENV_VARS=$keep" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$rocm_prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
