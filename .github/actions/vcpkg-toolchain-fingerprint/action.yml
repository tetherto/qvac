name: "vcpkg toolchain fingerprint"
description: >-
  Hash the toolchain that will build this job's vcpkg packages and export it as
  TOOLCHAIN_FINGERPRINT, for folding into the vcpkg binary cache key.

# vcpkg names every cached package by an ABI hash over the compiler, the triplet
# and the vcpkg tree. A cache key that does not move with those produces the
# worst available outcome: the entry restores, vcpkg reports "Restored 0
# package(s)" and rebuilds, and because actions/cache skips the save on an exact
# primary-key hit, the dead entry is never replaced until a human bumps the key.
#
# So the probe covers both halves that can drift under a job:
#   - the compiler (Apple clang + SDK on darwin, ${CC:-clang} elsewhere, the VS
#     toolset and Windows SDK on Windows)
#   - the vcpkg tree itself, which setup-vcpkg does not pin: it clones
#     microsoft/vcpkg at HEAD on macOS and takes the runner image's
#     VCPKG_INSTALLATION_ROOT on Linux/Windows
#
# Evidence for both halves is on the QVAC-24711 PR rather than here, so it stays
# linkable after log retention expires.

runs:
  using: composite
  steps:
    - if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail

        if [ "${RUNNER_OS}" = "macOS" ]; then
          # Ask xcrun for the Apple clang that will build, not whatever `clang`
          # resolves to now: the homebrew llvm on PATH here is moved aside later
          # in these jobs. The SDK build version moves whenever the SDK does.
          probe="$(xcrun clang --version)
        sdk=$(xcrun --show-sdk-build-version)"
        else
          probe="$("${CC:-clang}" --version)"
        fi

        # setup-vcpkg leaves VCPKG_ROOT pointing at a git checkout on every
        # platform, but tolerate a tree that is not one rather than failing the
        # whole C++ job over a cache key.
        vcpkg_rev="$(git -C "${VCPKG_ROOT:-}" rev-parse HEAD 2> /dev/null || echo "unknown")"
        probe="${probe}
        vcpkg=${vcpkg_rev}"

        echo "--- toolchain ---"
        echo "${probe}"

        if command -v sha256sum > /dev/null 2>&1; then
          digest="$(printf '%s' "${probe}" | sha256sum)"
        else
          digest="$(printf '%s' "${probe}" | shasum -a 256)"
        fi

        echo "TOOLCHAIN_FINGERPRINT=${digest:0:16}" >> "${GITHUB_ENV}"
        echo "toolchain fingerprint: ${digest:0:16}"

    - if: runner.os == 'Windows'
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'

        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        if (-not (Test-Path $vswhere)) {
          Write-Output "::error::vswhere not found at $vswhere"
          exit 1
        }

        $vsPath = & $vswhere -latest -products * -property installationPath
        $toolsFile = Join-Path $vsPath 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt'
        $toolsVersion = (Get-Content $toolsFile -Raw).Trim()

        # Version-aware, not lexicographic: 10.0.9.0 must not sort above
        # 10.0.26100.0 just because it is shorter.
        $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
        $sdkVersion = (Get-ChildItem $sdkRoot -Directory |
          Where-Object { $_.Name -as [version] } |
          Sort-Object { [version]$_.Name } |
          Select-Object -Last 1).Name

        if ([string]::IsNullOrWhiteSpace($toolsVersion) -or [string]::IsNullOrWhiteSpace($sdkVersion)) {
          Write-Output "::error::could not fingerprint the toolchain"
          exit 1
        }

        # Native stderr is a TERMINATING error under ErrorActionPreference=Stop,
        # so a $VCPKG_ROOT that is not a git checkout would fail the whole step
        # rather than fall back. Drop to Continue for the call and merge stderr
        # into the output stream so it arrives as records, not as an exception.
        $vcpkgRev = 'unknown'
        $prevEAP = $ErrorActionPreference
        $ErrorActionPreference = 'Continue'
        try {
          $revOut = (& git -C "$env:VCPKG_ROOT" rev-parse HEAD 2>&1)
          if ($LASTEXITCODE -eq 0 -and $revOut) {
            $candidate = ($revOut | Select-Object -First 1).ToString().Trim()
            if ($candidate -match '\A[0-9a-f]{40}\z') { $vcpkgRev = $candidate }
          }
        } catch {
          $vcpkgRev = 'unknown'
        } finally {
          $ErrorActionPreference = $prevEAP
        }

        $probe = "vctools=$toolsVersion sdk=$sdkVersion vcpkg=$vcpkgRev"
        Write-Output "--- toolchain ---"
        Write-Output $probe

        $sha = [System.Security.Cryptography.SHA256]::Create()
        $bytes = [System.Text.Encoding]::UTF8.GetBytes($probe)
        $digest = -join ($sha.ComputeHash($bytes) | ForEach-Object { $_.ToString('x2') })
        $fingerprint = $digest.Substring(0, 16)

        echo "TOOLCHAIN_FINGERPRINT=$fingerprint" >> $env:GITHUB_ENV
        Write-Output "toolchain fingerprint: $fingerprint"
