name: "vcpkg binary cache directory"
description: >-
  Point vcpkg at its binary cache and say whether that directory survives the
  job. Exports VCPKG_BINARY_SOURCES, VCPKG_CACHE_DIR and VCPKG_CACHE_PERSISTENT.

# Two shapes, picked by where the job is running.
#
# Self-hosted: a directory on the HOST, shared by every runner instance on that
# box and surviving the workspace wipe. There are several runners per host, so a
# workspace-relative path gave each its own copy -- saved on
# C:\actions-runner-2\...\vcpkg\cache, restored on C:\actions-runner-4\..., zero
# packages reused. Central by host is the fix.
#
# GitHub-hosted: no persistent disk, so the directory stays under the workspace
# and the caller's actions/cache steps carry it between runs. Those steps key
# off VCPKG_CACHE_PERSISTENT so they skip themselves on self-hosted legs.
#
# Must run AFTER setup-vcpkg, which writes VCPKG_BINARY_SOURCES to $GITHUB_ENV
# itself (setup-vcpkg/action.yml:94) and would otherwise win.
#
# Trust: on a shared persistent directory a fork PR's build output would be
# visible to every later job on the host, and vcpkg identifies archives by ABI
# hash alone -- no signature. So untrusted events get `read`, and only the
# trusted four get `readwrite`. Same rule the actions/cache split already
# applies; see .github/AGENTS.md.

inputs:
  workdir:
    description: "Package directory, e.g. packages/embed-llamacpp"
    required: true
  trusted:
    description: "'true' when the triggering event may write the shared cache"
    required: true

runs:
  using: composite
  steps:
    - if: runner.os != 'Windows'
      shell: bash
      env:
        INPUT_WORKDIR: ${{ inputs.workdir }}
        INPUT_TRUSTED: ${{ inputs.trusted }}
      run: |
        set -euo pipefail

        # $INPUT_WORKDIR reaches $GITHUB_ENV unescaped, so a newline in it would
        # inject further variables. setup-vcpkg guards its own inputs the same way.
        if [[ ! "${INPUT_WORKDIR}" =~ ^packages/[A-Za-z0-9._-]+$ ]]; then
          echo "::error::unexpected workdir: ${INPUT_WORKDIR}"
          exit 1
        fi

        mode="read"
        if [ "${INPUT_TRUSTED}" = "true" ]; then mode="readwrite"; fi

        persistent="false"
        cache_dir="${GITHUB_WORKSPACE}/${INPUT_WORKDIR}/vcpkg/cache"

        if [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
          # VCPKG_HOST_CACHE_DIR lets the host owner relocate this without a code
          # change; the defaults are writable by the runner user on our images.
          if [ -n "${VCPKG_HOST_CACHE_DIR:-}" ]; then
            host_dir="${VCPKG_HOST_CACHE_DIR}"
          elif [ "${RUNNER_OS}" = "macOS" ]; then
            host_dir="/Users/Shared/qvac/vcpkg-cache"
          else
            host_dir="/opt/qvac/vcpkg-cache"
          fi

          # Fall back to the workspace rather than failing the job: a host that
          # has not been provisioned yet still builds, just cold.
          if mkdir -p "${host_dir}" 2> /dev/null && [ -w "${host_dir}" ]; then
            cache_dir="${host_dir}"
            persistent="true"
          else
            echo "::warning::${host_dir} is not writable; falling back to the workspace cache"
          fi
        fi

        mkdir -p "${cache_dir}"

        echo "VCPKG_BINARY_SOURCES=clear;files,${cache_dir},${mode}" >> "${GITHUB_ENV}"
        echo "VCPKG_CACHE_DIR=${cache_dir}" >> "${GITHUB_ENV}"
        echo "VCPKG_CACHE_PERSISTENT=${persistent}" >> "${GITHUB_ENV}"
        echo "vcpkg binary cache: ${cache_dir} (${mode}, persistent=${persistent})"

    - if: runner.os == 'Windows'
      shell: powershell
      env:
        INPUT_WORKDIR: ${{ inputs.workdir }}
        INPUT_TRUSTED: ${{ inputs.trusted }}
      run: |
        $ErrorActionPreference = 'Stop'

        # \A..\z, not ^..$: .NET's $ also matches before a trailing newline.
        if ($env:INPUT_WORKDIR -notmatch '\Apackages/[A-Za-z0-9._-]+\z') {
          Write-Output "::error::unexpected workdir: $env:INPUT_WORKDIR"
          exit 1
        }

        $mode = if ($env:INPUT_TRUSTED -eq 'true') { 'readwrite' } else { 'read' }

        $persistent = 'false'
        # Native path required: a mixed-separator path resolves elsewhere and
        # vcpkg silently finds nothing.
        $cacheDir = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE (Join-Path $env:INPUT_WORKDIR 'vcpkg/cache')))

        if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
          $hostDir = if ($env:VCPKG_HOST_CACHE_DIR) { $env:VCPKG_HOST_CACHE_DIR } else { 'C:\qvac\vcpkg-cache' }
          try {
            New-Item -ItemType Directory -Force -Path $hostDir -ErrorAction Stop | Out-Null
            $probe = Join-Path $hostDir ".write-probe-$env:GITHUB_RUN_ID"
            Set-Content -Path $probe -Value 'ok' -ErrorAction Stop
            Remove-Item $probe -Force
            $cacheDir = [IO.Path]::GetFullPath($hostDir)
            $persistent = 'true'
          } catch {
            Write-Output "::warning::$hostDir is not writable; falling back to the workspace cache"
          }
        }

        New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null

        echo "VCPKG_BINARY_SOURCES=clear;files,$cacheDir,$mode" >> $env:GITHUB_ENV
        echo "VCPKG_CACHE_DIR=$cacheDir" >> $env:GITHUB_ENV
        echo "VCPKG_CACHE_PERSISTENT=$persistent" >> $env:GITHUB_ENV
        Write-Output "vcpkg binary cache: $cacheDir ($mode, persistent=$persistent)"
