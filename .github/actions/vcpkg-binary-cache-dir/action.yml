name: "vcpkg binary cache directory"
description: >-
  Point vcpkg at its binary cache and say whether that directory survives the
  job. Exports VCPKG_BINARY_SOURCES, VCPKG_CACHE_DIR and VCPKG_CACHE_PERSISTENT.

# Two shapes, picked by where the job is running.
#
# Self-hosted: a directory on the HOST, shared by every runner instance on that
# box and surviving the workspace wipe. There are several runners per host, so a
# workspace-relative path gave each its own copy -- saved on
# C:\actions-runner-2\...\vcpkg\cache, restored on C:\actions-runner-4\..., zero
# packages reused. Central by host is the fix.
#
# GitHub-hosted: no persistent disk, so the directory stays under the workspace
# and the caller's actions/cache steps carry it between runs. Those steps key
# off VCPKG_CACHE_PERSISTENT so they skip themselves on self-hosted legs.
#
# Must run AFTER setup-vcpkg, which writes VCPKG_BINARY_SOURCES to $GITHUB_ENV
# itself (setup-vcpkg/action.yml:94) and would otherwise win.
#
# Trust: on a shared persistent directory a fork PR's build output would be
# visible to every later job on the host, and vcpkg identifies archives by ABI
# hash alone -- no signature. So untrusted events get `read`, and only the
# trusted four get `readwrite`. Same rule the actions/cache split already
# applies; see .github/AGENTS.md.

inputs:
  workdir:
    description: "Package directory, e.g. packages/embed-llamacpp"
    required: true
  trusted:
    description: "'true' when the triggering event may write the shared cache"
    required: true

runs:
  using: composite
  steps:
    - if: runner.os != 'Windows'
      shell: bash
      env:
        INPUT_WORKDIR: ${{ inputs.workdir }}
        INPUT_TRUSTED: ${{ inputs.trusted }}
      run: |
        set -euo pipefail

        # $INPUT_WORKDIR reaches $GITHUB_ENV unescaped, so a newline in it would
        # inject further variables. setup-vcpkg guards its own inputs the same way.
        if [[ ! "${INPUT_WORKDIR}" =~ ^packages/[A-Za-z0-9._-]+$ ]]; then
          echo "::error::unexpected workdir: ${INPUT_WORKDIR}"
          exit 1
        fi

        # The host layer is shared with every later job on the box, so only
        # trusted events may write it. The workspace layer is job-local until
        # actions/cache saves it, and that save is gated by the caller.
        mode="read"
        if [ "${INPUT_TRUSTED}" = "true" ]; then mode="readwrite"; fi

        persistent="false"
        host_dir=""
        cache_dir="${GITHUB_WORKSPACE}/${INPUT_WORKDIR}/vcpkg/cache"

        if [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
          # First writable candidate wins. VCPKG_HOST_CACHE_DIR lets the host
          # owner override without a code change; /opt/qvac is the provisioned
          # location, preferred once DevOps creates it; the shared-tmp one needs
          # no provisioning; $HOME is the always-works backstop.
          #
          # Runner instances on one host do not all run as the same user, so a
          # shared directory created by one is not writable by the next unless it
          # is mode 1777 -- observed on both /var/tmp/qvac and /Users/Shared/qvac
          # in run 34952627622. We therefore create with 1777 (sticky, so nobody
          # can delete another user's archives) and move on if an existing
          # directory refuses us. $HOME always succeeds, and while it is per-user
          # rather than per-host it still survives the workspace wipe, so a leg
          # that lands there is warm on its next run instead of cold forever.
          candidates=""
          if [ -n "${VCPKG_HOST_CACHE_DIR:-}" ]; then
            candidates="${VCPKG_HOST_CACHE_DIR}"
          elif [ "${RUNNER_OS}" = "macOS" ]; then
            candidates="/opt/qvac/vcpkg-cache /Users/Shared/qvac/vcpkg-cache ${HOME}/.cache/qvac/vcpkg-cache"
          else
            candidates="/opt/qvac/vcpkg-cache /var/tmp/qvac/vcpkg-cache ${HOME}/.cache/qvac/vcpkg-cache"
          fi

          for candidate in ${candidates}; do
            if [ ! -d "${candidate}" ]; then
              mkdir -p "${candidate}" 2> /dev/null || continue
              # Only when we created it: make it usable by the other runner
              # users on this host. Failure is not fatal, it just means the next
              # user falls through to their own candidate.
              chmod 1777 "${candidate}" 2> /dev/null || true
            fi
            if [ -w "${candidate}" ]; then
              host_dir="${candidate}"
              persistent="true"
              break
            fi
          done

          # Not fatal: the workspace layer below still applies.
          if [ "${persistent}" != "true" ]; then
            echo "::warning::no writable host cache dir (${candidates}); workspace layer only"
          fi
        fi

        mkdir -p "${cache_dir}"

        # Two layers, host first. The host layer is free to read and warm
        # whenever a job lands on a box that built this package before. The
        # workspace layer is carried by the caller's actions/cache, which is
        # repo-global, so it covers every run that lands somewhere else --
        # including a different host or pool. vcpkg reads sources in order and
        # writes to each writable one, so a build populates both.
        sources="clear"
        if [ -n "${host_dir}" ]; then
          sources="${sources};files,${host_dir},${mode}"
        fi
        sources="${sources};files,${cache_dir},readwrite"

        echo "VCPKG_BINARY_SOURCES=${sources}" >> "${GITHUB_ENV}"
        echo "VCPKG_CACHE_DIR=${cache_dir}" >> "${GITHUB_ENV}"
        echo "VCPKG_CACHE_PERSISTENT=${persistent}" >> "${GITHUB_ENV}"
        echo "vcpkg binary sources: ${sources}"

    - if: runner.os == 'Windows'
      shell: powershell
      env:
        INPUT_WORKDIR: ${{ inputs.workdir }}
        INPUT_TRUSTED: ${{ inputs.trusted }}
      run: |
        $ErrorActionPreference = 'Stop'

        # \A..\z, not ^..$: .NET's $ also matches before a trailing newline.
        if ($env:INPUT_WORKDIR -notmatch '\Apackages/[A-Za-z0-9._-]+\z') {
          Write-Output "::error::unexpected workdir: $env:INPUT_WORKDIR"
          exit 1
        }

        $mode = if ($env:INPUT_TRUSTED -eq 'true') { 'readwrite' } else { 'read' }

        $persistent = 'false'
        $hostDir = ''
        # Native path required: a mixed-separator path resolves elsewhere and
        # vcpkg silently finds nothing.
        $cacheDir = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE (Join-Path $env:INPUT_WORKDIR 'vcpkg/cache')))

        if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
          # Same reasoning as the bash branch: runner instances on one host may
          # run as different users, so try the shared location first and fall
          # through to a per-user one rather than going cold. Writability is
          # probed by actually writing, since ACLs make Test-Path insufficient.
          $candidates = if ($env:VCPKG_HOST_CACHE_DIR) {
            @($env:VCPKG_HOST_CACHE_DIR)
          } else {
            @('C:\qvac\vcpkg-cache', (Join-Path $env:LOCALAPPDATA 'qvac\vcpkg-cache'))
          }

          foreach ($candidate in $candidates) {
            try {
              New-Item -ItemType Directory -Force -Path $candidate -ErrorAction Stop | Out-Null
              $probe = Join-Path $candidate ".write-probe-$env:GITHUB_RUN_ID"
              Set-Content -Path $probe -Value 'ok' -ErrorAction Stop
              Remove-Item $probe -Force
              $hostDir = [IO.Path]::GetFullPath($candidate)
              $persistent = 'true'
              break
            } catch {
              continue
            }
          }

          if ($persistent -ne 'true') {
            Write-Output "::warning::no writable host cache dir ($($candidates -join ', ')); workspace layer only"
          }
        }

        New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null

        # Two layers, host first -- see the bash branch for why.
        $sources = 'clear'
        if ($hostDir) { $sources = "$sources;files,$hostDir,$mode" }
        $sources = "$sources;files,$cacheDir,readwrite"

        echo "VCPKG_BINARY_SOURCES=$sources" >> $env:GITHUB_ENV
        echo "VCPKG_CACHE_DIR=$cacheDir" >> $env:GITHUB_ENV
        echo "VCPKG_CACHE_PERSISTENT=$persistent" >> $env:GITHUB_ENV
        Write-Output "vcpkg binary sources: $sources"
