name: Runner names
description: >-
  Canonical GitHub Actions runner labels for QVAC CI. Values are defined in
  runners.yaml. Workflow jobs use env.RN_* (generated by sync-runner-names.mjs);
  steps may reference outputs directly (steps.runner_names.outputs.<key>).

outputs:
  orch:
    description: "Default orchestration runner"
    value: ubuntu-latest
  u22:
    description: "GitHub-hosted Ubuntu 22.04"
    value: ubuntu-22.04
  u24:
    description: "GitHub-hosted Ubuntu 24.04"
    value: ubuntu-24.04
  u22_arm:
    description: "GitHub-hosted Ubuntu 22.04 ARM64"
    value: ubuntu-22.04-arm
  u24_arm:
    description: "GitHub-hosted Ubuntu 24.04 ARM64"
    value: ubuntu-24.04-arm
  mac14:
    description: "GitHub-hosted macOS 14"
    value: macos-14
  mac14_xl:
    description: "GitHub-hosted macOS 14 xlarge"
    value: macos-14-xlarge
  mac15:
    description: "GitHub-hosted macOS 15"
    value: macos-15
  mac15_intel:
    description: "GitHub-hosted macOS 15 Intel"
    value: macos-15-intel
  mac15_lg:
    description: "GitHub-hosted macOS 15 large"
    value: macos-15-large
  mac15_xl:
    description: "GitHub-hosted macOS 15 xlarge"
    value: macos-15-xlarge
  win22:
    description: "GitHub-hosted Windows Server 2022"
    value: windows-2022
  win25:
    description: "GitHub-hosted Windows Server 2025"
    value: windows-2025
  qvac_u22:
    description: "Self-hosted QVAC Ubuntu 22.04 x64"
    value: qvac-ubuntu2204-x64
  qvac_u22_gpu:
    description: "Self-hosted QVAC Ubuntu 22.04 x64 GPU"
    value: qvac-ubuntu2204-x64-gpu
  qvac_u24:
    description: "Self-hosted QVAC Ubuntu 24.04 x64"
    value: qvac-ubuntu2404-x64
  qvac_u24_gpu:
    description: "Self-hosted QVAC Ubuntu 24.04 x64 GPU"
    value: qvac-ubuntu2404-x64-gpu
  qvac_win25:
    description: "Self-hosted QVAC Windows 2025 x64"
    value: qvac-win25-x64
  qvac_win25_gpu:
    description: "Self-hosted QVAC Windows 2025 x64 GPU"
    value: qvac-win25-x64-gpu
  ai_linux:
    description: "Self-hosted AI run Linux"
    value: ai-run-linux
  ai_linux_gpu:
    description: "Self-hosted AI run Linux GPU"
    value: ai-run-linux-gpu
  ai_u22:
    description: "Self-hosted AI run Ubuntu 22.04"
    value: ai-run-ubuntu-22.04
  ai_win11_gpu:
    description: "Self-hosted AI run Windows 11 GPU"
    value: ai-run-windows11-gpu
  gen_win11:
    description: "Self-hosted Windows 11 image builder"
    value: generator-windows11
  mini_m4:
    description: "Self-hosted Mac mini M4"
    value: mac-mini-m4
  mini_m4_gpu:
    description: "Self-hosted Mac mini M4 GPU"
    value: mac-mini-m4-gpu
  lbl_u22_x64:
    description: "Benchmark device label (ubuntu-22.04-x64)"
    value: ubuntu-22.04-x64
  lbl_u22_x64_gpu:
    description: "Benchmark device label (ubuntu-22.04-x64-gpu)"
    value: ubuntu-22.04-x64-gpu
  lbl_u24_x64:
    description: "Benchmark device label (ubuntu-24.04-x64)"
    value: ubuntu-24.04-x64
  lbl_u24_x64_gpu:
    description: "Benchmark device label (ubuntu-24.04-x64-gpu)"
    value: ubuntu-24.04-x64-gpu
  lbl_u24_arm64:
    description: "Benchmark device label (ubuntu-24.04-arm64)"
    value: ubuntu-24.04-arm64
  lbl_win22_x64:
    description: "Benchmark device label (windows-2022-x64)"
    value: windows-2022-x64
  lbl_win25_x64:
    description: "Benchmark device label (windows-2025-x64)"
    value: windows-2025-x64
  lbl_win25_x64_gpu:
    description: "Benchmark device label (windows-2025-x64-gpu)"
    value: windows-2025-x64-gpu

runs:
  using: composite
  steps:
    - name: Export runner env
      shell: bash
      run: |
        set -euo pipefail
        echo "RN_ORCH=ubuntu-latest" >> "$GITHUB_ENV"
        echo "RN_U22=ubuntu-22.04" >> "$GITHUB_ENV"
        echo "RN_U24=ubuntu-24.04" >> "$GITHUB_ENV"
        echo "RN_U22_ARM=ubuntu-22.04-arm" >> "$GITHUB_ENV"
        echo "RN_U24_ARM=ubuntu-24.04-arm" >> "$GITHUB_ENV"
        echo "RN_MAC14=macos-14" >> "$GITHUB_ENV"
        echo "RN_MAC14_XL=macos-14-xlarge" >> "$GITHUB_ENV"
        echo "RN_MAC15=macos-15" >> "$GITHUB_ENV"
        echo "RN_MAC15_INTEL=macos-15-intel" >> "$GITHUB_ENV"
        echo "RN_MAC15_LG=macos-15-large" >> "$GITHUB_ENV"
        echo "RN_MAC15_XL=macos-15-xlarge" >> "$GITHUB_ENV"
        echo "RN_WIN22=windows-2022" >> "$GITHUB_ENV"
        echo "RN_WIN25=windows-2025" >> "$GITHUB_ENV"
        echo "RN_QVAC_U22=qvac-ubuntu2204-x64" >> "$GITHUB_ENV"
        echo "RN_QVAC_U22_GPU=qvac-ubuntu2204-x64-gpu" >> "$GITHUB_ENV"
        echo "RN_QVAC_U24=qvac-ubuntu2404-x64" >> "$GITHUB_ENV"
        echo "RN_QVAC_U24_GPU=qvac-ubuntu2404-x64-gpu" >> "$GITHUB_ENV"
        echo "RN_QVAC_WIN25=qvac-win25-x64" >> "$GITHUB_ENV"
        echo "RN_QVAC_WIN25_GPU=qvac-win25-x64-gpu" >> "$GITHUB_ENV"
        echo "RN_AI_LINUX=ai-run-linux" >> "$GITHUB_ENV"
        echo "RN_AI_LINUX_GPU=ai-run-linux-gpu" >> "$GITHUB_ENV"
        echo "RN_AI_U22=ai-run-ubuntu-22.04" >> "$GITHUB_ENV"
        echo "RN_AI_WIN11_GPU=ai-run-windows11-gpu" >> "$GITHUB_ENV"
        echo "RN_GEN_WIN11=generator-windows11" >> "$GITHUB_ENV"
        echo "RN_MINI_M4=mac-mini-m4" >> "$GITHUB_ENV"
        echo "RN_MINI_M4_GPU=mac-mini-m4-gpu" >> "$GITHUB_ENV"
        echo "RN_LBL_U22_X64=ubuntu-22.04-x64" >> "$GITHUB_ENV"
        echo "RN_LBL_U22_X64_GPU=ubuntu-22.04-x64-gpu" >> "$GITHUB_ENV"
        echo "RN_LBL_U24_X64=ubuntu-24.04-x64" >> "$GITHUB_ENV"
        echo "RN_LBL_U24_X64_GPU=ubuntu-24.04-x64-gpu" >> "$GITHUB_ENV"
        echo "RN_LBL_U24_ARM64=ubuntu-24.04-arm64" >> "$GITHUB_ENV"
        echo "RN_LBL_WIN22_X64=windows-2022-x64" >> "$GITHUB_ENV"
        echo "RN_LBL_WIN25_X64=windows-2025-x64" >> "$GITHUB_ENV"
        echo "RN_LBL_WIN25_X64_GPU=windows-2025-x64-gpu" >> "$GITHUB_ENV"

