name: 'Prebuild artifact materialize'
description: >
  Downloads a package's prebuild bundle and places it into that package's working
  directory in the ONLY layout the runtime and the published npm tarball accept,
  i.e. <workdir>/prebuilds/<platform>-<arch>/. Single source of truth for that
  placement — do NOT inline per workflow.

  Artifact identity is DERIVED from the package, never configured. The producer
  (reusable-prebuilds.yml) uploads per-leg artifacts as
  prebuild-<package>-<platform>-<arch> and the merged bundle as
  prebuilds-<package>; this action asks for prebuilds-<package>. That is what
  lets several packages build in one workflow run: artifacts are scoped to the
  RUN and a called reusable workflow shares its caller's run, and the artifact
  service ACCEPTS duplicate names rather than rejecting them, so a shared name
  silently yields two same-named artifacts and an ambiguous download.

  There is deliberately no fallback to the historical shared `prebuilds` name:
  the workflows that produced it are retired in this same change, and keeping a
  fallback would let a run silently consume another package's bundle.

inputs:
  workdir:
    description: 'Package working directory, e.g. packages/asr-ggml'
    required: true
  package:
    description: >
      Package short-name, i.e. the packages/<dir> name. Used to build the
      artifact name. Defaults to basename(workdir).
    required: false
    default: ''
  platform:
    description: 'Place only this platform (pair with arch). Empty places every platform.'
    required: false
    default: ''
  arch:
    description: 'Place only this arch (pair with platform).'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve package and artifact name
      id: id
      shell: bash
      env:
        WORKDIR: ${{ inputs.workdir }}
        PACKAGE: ${{ inputs.package }}
      run: |
        set -euo pipefail
        pkg="${PACKAGE:-$(basename "$WORKDIR")}"
        if [ -z "$pkg" ] || [ "$pkg" = "." ] || [ "$pkg" = "/" ]; then
          echo "::error::Cannot determine the package for workdir '$WORKDIR'."
          exit 1
        fi
        echo "package=$pkg" >> "$GITHUB_OUTPUT"
        echo "artifact=prebuilds-$pkg" >> "$GITHUB_OUTPUT"
        echo "package=$pkg artifact=prebuilds-$pkg"

    - name: Download prebuilds bundle
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
      with:
        name: ${{ steps.id.outputs.artifact }}
        path: ${{ runner.temp }}/prebuilds-staging

    # Two implementations on purpose. Git Bash mangles RUNNER_TEMP on Windows
    # ("C:\a\_temp" — \a and \_ read as escape sequences), which makes the source
    # path invalid and the copy silently no-op, so win32 goes through PowerShell
    # exactly as the integration-test-*.yml workflows already do.
    - name: Place prebuilds (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        WORKDIR: ${{ inputs.workdir }}
        PACKAGE: ${{ steps.id.outputs.package }}
        PLATFORM: ${{ inputs.platform }}
        ARCH: ${{ inputs.arch }}
      run: |
        set -euo pipefail
        STAGING="${RUNNER_TEMP}/prebuilds-staging"
        DEST="${WORKDIR}/prebuilds"
        mkdir -p "$DEST"

        if [ -n "$PLATFORM" ] && [ -n "$ARCH" ]; then
          SRC="${STAGING}/${PLATFORM}-${ARCH}"
          if [ ! -d "$SRC" ]; then
            echo "::error::No '${PLATFORM}-${ARCH}/' directory in the prebuilds bundle for '${PACKAGE}'. Its prebuild did not produce one."
            exit 1
          fi
          cp -r "$SRC" "${DEST}/"
        else
          if [ ! -d "$STAGING" ] || [ -z "$(ls -A "$STAGING")" ]; then
            echo "::error::Prebuilds bundle for '${PACKAGE}' is missing or empty."
            exit 1
          fi
          cp -r "${STAGING}/." "${DEST}/"
        fi

        # The published tarball ships `prebuilds` verbatim (package.json `files`)
        # and require.addon() resolves prebuilds/<platform>-<arch>/<name>.bare, so
        # any extra directory level here would publish fine and then break every
        # consumer at runtime. Fail instead of shipping it.
        for d in "$DEST"/*/; do
          base="$(basename "$d")"
          case "$base" in
            *-*) : ;;
            *) echo "::error::'${base}/' is not a <platform>-<arch> directory. prebuilds/ must contain platform directories only."; exit 1 ;;
          esac
        done
        ls -A "$DEST"

    - name: Place prebuilds (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      env:
        WORKDIR: ${{ inputs.workdir }}
        PACKAGE: ${{ steps.id.outputs.package }}
        PLATFORM: ${{ inputs.platform }}
        ARCH: ${{ inputs.arch }}
      run: |
        $ErrorActionPreference = "Stop"
        $staging = Join-Path $env:RUNNER_TEMP "prebuilds-staging"
        $dest = Join-Path $env:WORKDIR "prebuilds"
        New-Item -ItemType Directory -Force -Path $dest | Out-Null

        if ($env:PLATFORM -and $env:ARCH) {
          $src = Join-Path $staging "$($env:PLATFORM)-$($env:ARCH)"
          if (-not (Test-Path $src)) {
            Write-Output "::error::No '$($env:PLATFORM)-$($env:ARCH)/' directory in the prebuilds bundle for '$($env:PACKAGE)'."
            exit 1
          }
          Copy-Item -Recurse -Force $src $dest
        } else {
          if (-not (Test-Path $staging) -or -not (Get-ChildItem -Force $staging)) {
            Write-Output "::error::Prebuilds bundle for '$($env:PACKAGE)' is missing or empty."
            exit 1
          }
          Copy-Item -Recurse -Force (Join-Path $staging "*") $dest
        }

        foreach ($d in Get-ChildItem -Directory $dest) {
          if ($d.Name -notlike "*-*") {
            Write-Output "::error::'$($d.Name)/' is not a <platform>-<arch> directory. prebuilds/ must contain platform directories only."
            exit 1
          }
        }
        Get-ChildItem $dest
