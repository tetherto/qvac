name: Build Android app
description: Generate the Android project for a built mobile test app and assemble its release APK.

inputs:
  app-dir:
    description: Mobile test framework checkout, after mobile-build-test-app
    default: test-framework

outputs:
  app-path:
    description: Absolute path to the APK
    value: ${{ steps.build.outputs.app-path }}
  app-type:
    description: Device Farm app type
    value: ${{ steps.build.outputs.app-type }}
  app-name:
    description: File name to upload the APK under
    value: ${{ steps.build.outputs.app-name }}

runs:
  using: composite
  steps:
    - id: build
      shell: bash
      env:
        APP_DIR: ${{ inputs.app-dir }}
      run: node "$GITHUB_ACTION_PATH/android-build-app.mjs"
