name: "SDK Device Farm - Select Pool"
description: >-
  Selects a single AWS Device Farm device pool from a candidate list. When a
  pool name is given, that pool is used as-is; when no name is given, a random
  candidate is chosen. No Device Farm APIs are called: the OIDC role is not
  granted devicefarm:GetDevice/ListDevices, and public-device availability is
  only a likelihood anyway. Device Farm queues the run until a unit is free and
  the downstream "wait-device-farm-running" gate is the real readiness arbiter.
  Output is a single-element JSON array suitable for a matrix.

inputs:
  pools:
    description: 'JSON array of candidate device pools [{name, arn}].'
    required: true
  pool-name:
    description: >-
      Explicit pool name to select. When set, that pool is used as-is; when
      empty, a random candidate is chosen.
    required: false
    default: ""

outputs:
  pool:
    description: "Single-element JSON array with the selected pool: [{name, arn}]."
    value: ${{ steps.select.outputs.pool }}
  name:
    description: "Selected pool name."
    value: ${{ steps.select.outputs.name }}
  arn:
    description: "Selected pool ARN."
    value: ${{ steps.select.outputs.arn }}

runs:
  using: composite
  steps:
    - name: Select device pool
      id: select
      shell: bash
      env:
        POOLS: ${{ inputs.pools }}
        POOL_NAME: ${{ inputs.pool-name }}
      run: |
        set -euo pipefail

        # Validate the candidate list up front so a malformed variable fails
        # fast with a clear message instead of an obscure jq/matrix error.
        if ! echo "$POOLS" | jq -e 'type == "array" and length > 0' >/dev/null 2>&1; then
          echo "::error::device pools input is not a non-empty JSON array: $POOLS"
          exit 1
        fi

        emit_pool() {
          local name="$1" arn="$2" reason="$3"
          local json
          json=$(jq -cn --arg n "$name" --arg a "$arn" '[{name: $n, arn: $a}]')
          {
            echo "pool=$json"
            echo "name=$name"
            echo "arn=$arn"
          } >> "$GITHUB_OUTPUT"
          echo "Selected device pool: '$name' ($reason)"
          echo "  arn: $arn"
          {
            echo "### Selected device pool: \`$name\`"
            echo ""
            echo "- reason: $reason"
            echo "- arn: \`$arn\`"
          } >> "$GITHUB_STEP_SUMMARY"
        }

        # --- Named pool: no Device Farm calls, use the given pool as-is --------
        if [ -n "$POOL_NAME" ]; then
          MATCH=$(echo "$POOLS" | jq -c --arg n "$POOL_NAME" '[.[] | select(.name == $n)]')
          if [ "$(echo "$MATCH" | jq 'length')" -eq 0 ]; then
            echo "::error::device pool '$POOL_NAME' not found in candidate list"
            echo "Available pools:"
            echo "$POOLS" | jq -r '.[].name | "  - " + .'
            exit 1
          fi
          NAME=$(echo "$MATCH" | jq -r '.[0].name')
          ARN=$(echo "$MATCH" | jq -r '.[0].arn')
          emit_pool "$NAME" "$ARN" "named: selected by name"
          exit 0
        fi

        # --- No name given: pick a random candidate --------------------------
        # No Device Farm API is queried here. The OIDC role is scoped to
        # scheduling/reading runs and does not include devicefarm:GetDevice or
        # ListDevices, so a live availability check is not possible; and for
        # public devices availability is only a likelihood in any case. Device
        # Farm queues the scheduled run until a matching unit is free, and
        # "wait-device-farm-running" is the real readiness/timeout gate.
        COUNT=$(echo "$POOLS" | jq 'length')
        IDX=$(seq 0 $((COUNT - 1)) | shuf -n1)
        NAME=$(echo "$POOLS" | jq -r ".[$IDX].name")
        ARN=$(echo "$POOLS" | jq -r ".[$IDX].arn")
        emit_pool "$NAME" "$ARN" "random (1 of $COUNT candidate(s))"
