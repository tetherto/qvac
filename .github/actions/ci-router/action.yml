name: 'CI Router (label detection)'
description: >
  Shared label -> CI-stage routing for addon PR workflows. Internal same-repo
  PRs and ready external-fork PRs are authorised for baseline routing; secret-
  bearing fork jobs are gated by the fork-ci environment (fork-approval job).
  Granular labels select heavy stages once authorised. Trusted events (push /
  workflow_dispatch / workflow_call / schedule) enable every stage.

outputs:
  run_verified_checks:
    description: 'Baseline authorised checks (internal ready PR / ready fork / trusted event)'
    value: ${{ steps.route.outputs.run_verified_checks }}
  run_prebuilds:
    description: 'Build prebuilds (prebuilds/desktop/mobile label, or trusted event)'
    value: ${{ steps.route.outputs.run_prebuilds }}
  run_cpp_tests:
    description: 'Run C++ unit tests (run-cpp-addon-tests label)'
    value: ${{ steps.route.outputs.run_cpp_tests }}
  run_desktop:
    description: 'Run desktop integration tests (run-desktop-addon-tests label)'
    value: ${{ steps.route.outputs.run_desktop }}
  run_mobile:
    description: 'Run mobile integration tests (run-mobile-addon-tests label)'
    value: ${{ steps.route.outputs.run_mobile }}
  run_coload:
    description: 'Run the multi-addon co-load smoke (run-coload-tests label). Desktop co-load runs on this flag alone; the on-device (Device Farm) co-load additionally requires run_mobile.'
    value: ${{ steps.route.outputs.run_coload }}

runs:
  using: composite
  steps:
    - name: Route CI stages
      id: route
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        IS_DRAFT: ${{ github.event.pull_request.draft }}
      run: |
        if [ "$EVENT_NAME" = "workflow_dispatch" ] || \
           [ "$EVENT_NAME" = "workflow_call" ] || \
           [ "$EVENT_NAME" = "push" ] || \
           [ "$EVENT_NAME" = "schedule" ]; then
          echo "Trusted event ($EVENT_NAME) — enabling all CI stages"
          for out in run_verified_checks run_prebuilds run_cpp_tests run_desktop run_mobile run_coload; do
            echo "$out=true" >> "$GITHUB_OUTPUT"
          done
          exit 0
        fi
        HAS_PREBUILDS=false
        HAS_CPP=false
        HAS_DESKTOP=false
        HAS_MOBILE=false
        HAS_COLOAD=false
        if [ -n "$PR_LABELS_JSON" ] && [ "$PR_LABELS_JSON" != "null" ]; then
          for label in $(echo "$PR_LABELS_JSON" | jq -r '.[]' 2>/dev/null); do
            case "$label" in
              prebuilds)                HAS_PREBUILDS=true ;;
              run-cpp-addon-tests)      HAS_CPP=true ;;
              run-desktop-addon-tests)  HAS_DESKTOP=true ;;
              run-mobile-addon-tests)   HAS_MOBILE=true ;;
              run-coload-tests)         HAS_COLOAD=true ;;
            esac
          done
        fi

        VERIFIED=false
        PREBUILDS=false
        CPP_TESTS=false
        DESKTOP=false
        MOBILE=false
        COLOAD=false

        # Routing is deliberately NOT a trust decision — it only selects which
        # stages a PR is eligible for. Fork and same-repo PRs route identically
        # because every secret-bearing job additionally declares
        # `needs: fork-approval`, which gates external forks on the fork-ci
        # environment. A job gated on these outputs ALONE would be fail-open for
        # forks; ci-trust-policy.test.mjs enforces the fork-approval dependency.
        # An unset HEAD_REPO fails closed; drafts route nothing.
        IS_AUTHORIZED=false
        if [ -n "$HEAD_REPO" ] && [ "$IS_DRAFT" != "true" ]; then
          IS_AUTHORIZED=true
        fi

        if [ "$IS_AUTHORIZED" = "true" ]; then
          VERIFIED=true
          [ "$HAS_CPP" = "true" ]      && CPP_TESTS=true
          [ "$HAS_DESKTOP" = "true" ]  && { DESKTOP=true; PREBUILDS=true; }
          [ "$HAS_MOBILE" = "true" ]   && { MOBILE=true; PREBUILDS=true; }
          [ "$HAS_COLOAD" = "true" ]   && { COLOAD=true; PREBUILDS=true; }
          [ "$HAS_PREBUILDS" = "true" ] && PREBUILDS=true
        fi
        echo "CI Router: verified=$VERIFIED prebuilds=$PREBUILDS cpp=$CPP_TESTS desktop=$DESKTOP mobile=$MOBILE coload=$COLOAD"
        echo "run_verified_checks=$VERIFIED" >> "$GITHUB_OUTPUT"
        echo "run_prebuilds=$PREBUILDS" >> "$GITHUB_OUTPUT"
        echo "run_cpp_tests=$CPP_TESTS" >> "$GITHUB_OUTPUT"
        echo "run_desktop=$DESKTOP" >> "$GITHUB_OUTPUT"
        echo "run_mobile=$MOBILE" >> "$GITHUB_OUTPUT"
        echo "run_coload=$COLOAD" >> "$GITHUB_OUTPUT"
