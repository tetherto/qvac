name: 'Prebuild artifact reuse'
description: >
  Cross-run prebuild reuse: on a no-native-change push, finds this PR's prior run carrying a per-PR marker (prebuilds-cache-pr-<num>-<hash>) and re-publishes its prebuilds artifact. Marker is scoped by PR number, so a PR can only reuse its own prebuilds. Single source of truth — do NOT inline per workflow.

inputs:
  github-token:
    description: 'Token with actions:read to list/download prior-run artifacts'
    required: true
  workflow-file:
    description: 'Basename of the calling on-pr workflow, e.g. on-pr-llm-llamacpp.yml'
    required: true
  native-hash:
    description: 'native_hash output of detect-native-changes'
    required: true
  pr-number:
    description: 'github.event.pull_request.number'
    required: true
  artifact-name:
    description: 'Name of the prebuilds artifact to find/download/re-publish. Defaults to `prebuilds` (legacy per-package workflows); the nx path passes `prebuilds-<pkg>`.'
    required: false
    default: 'prebuilds'

outputs:
  reuse_hit:
    description: 'true if a matching prior prebuilds artifact was found and re-published'
    value: ${{ steps.reuse.outputs.hit }}

runs:
  using: composite
  steps:
    - name: Find + download a matching prebuilds artifact from a prior run
      id: reuse
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        NATIVE_HASH: ${{ inputs.native-hash }}
        PR_NUMBER: ${{ inputs.pr-number }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        RUN_ID: ${{ github.run_id }}
      run: |
        set -u
        # Marker is scoped by PR NUMBER so a PR can only reuse ITS OWN prebuilds —
        # a malicious PR's artifact can never be served to a victim PR.
        WANT="prebuilds-cache-pr-${PR_NUMBER}-${NATIVE_HASH}"
        echo "Looking for marker '$WANT' among prior runs of branch '$HEAD_REF'"
        RUNS=$(gh api "repos/$REPO/actions/workflows/${WORKFLOW_FILE}/runs?branch=${HEAD_REF}&per_page=40" \
                 --jq ".workflow_runs[] | select(.id != ${RUN_ID}) | .id")
        HIT=false
        for rid in $RUNS; do
          NAMES=$(gh api "repos/$REPO/actions/runs/$rid/artifacts" \
                    --jq '.artifacts[] | select(.expired==false) | .name' 2>/dev/null || true)
          if echo "$NAMES" | grep -qx "$WANT" && echo "$NAMES" | grep -qx "$ARTIFACT_NAME"; then
            echo "Match in run $rid — downloading its '$ARTIFACT_NAME' artifact"
            if gh run download "$rid" --repo "$REPO" --name "$ARTIFACT_NAME" --dir cached-prebuilds; then
              HIT=true
              echo "reused-run=$rid" >> "$GITHUB_OUTPUT"
              break
            fi
          fi
        done
        echo "hit=$HIT" >> "$GITHUB_OUTPUT"
        echo "Prebuild reuse hit: $HIT"
    - name: Re-publish reused prebuilds for downstream jobs
      if: steps.reuse.outputs.hit == 'true'
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
      with:
        name: ${{ inputs.artifact-name }}
        path: cached-prebuilds
