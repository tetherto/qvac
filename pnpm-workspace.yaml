packages:
  - "packages/*"
  # ASR consumers need the published native platform packages. Build the local
  # addon separately with its package-owned tooling instead of workspace linking.
  - "!packages/asr-ggml"
  # sdk-kotlin is a Gradle package; its package.json only declares the Android
  # BareKit npm deps, installed locally by Gradle. Keeping it out of the pnpm
  # workspace avoids an importer the root lockfile has no entry for, which would
  # fail every --frozen-lockfile install.
  - "!packages/sdk-kotlin"
  - "packages/registry-server/client"
  - "packages/registry-server/shared"
  - "plugins/*"

# Plain semver everywhere, no workspace:. Falls back to registry when local
# version doesn't satisfy the range.
linkWorkspacePackages: true

# Keep root-only repository tooling from supplying peers to product packages.
resolvePeersFromWorkspaceRoot: false

# Large binary tarballs (e.g. react-native-bare-kit) need more than pnpm's
# default 60s fetch timeout.
fetchTimeout: 300000
fetchRetries: 5
fetchRetryMaxtimeout: 120000

# hyper-instrument's own lockfile points bare-v8 at a local link: path that
# doesn't exist in this workspace; pin it to a real registry version instead.
overrides:
  hyper-instrument>bare-v8: "^1.0.1"
  # @electron/rebuild pins @electron/node-gyp to a git URL (exotic subdep);
  # pin it to the electron fork's published registry build so blockExoticSubdeps
  # stays on. Introduced when main's @electron-forge deps (sdk) merged in.
  "@electron/rebuild>@electron/node-gyp": "10.2.0-electron.2"
  # The speech addons declare their desktop platform packages so a standalone
  # npm install of one (its sanity job) can resolve "#host-addon". In the
  # workspace `npm run link:platform` stages the local build instead, which a
  # copy from npm would replace.
  "@qvac/asr-ggml-linux-x64": "-"
  "@qvac/asr-ggml-linux-arm64": "-"
  "@qvac/asr-ggml-darwin-arm64": "-"
  "@qvac/asr-ggml-darwin-x64": "-"
  "@qvac/asr-ggml-win32-x64": "-"
  "@qvac/tts-ggml-linux-x64": "-"
  "@qvac/tts-ggml-linux-arm64": "-"
  "@qvac/tts-ggml-darwin-arm64": "-"
  "@qvac/tts-ggml-darwin-x64": "-"
  "@qvac/tts-ggml-win32-x64": "-"
  "@qvac/audiogen-ggml-linux-x64": "-"
  "@qvac/audiogen-ggml-linux-arm64": "-"
  "@qvac/audiogen-ggml-darwin-arm64": "-"
  "@qvac/audiogen-ggml-darwin-x64": "-"
  "@qvac/audiogen-ggml-win32-x64": "-"

blockExoticSubdeps: true

allowBuilds:
  cld: true
  esbuild: true
  nx: true
  unrs-resolver: true
  # From plugins/openclaw's `openclaw` dev dependency. Unlisted, an install with
  # scripts fails with ERR_PNPM_IGNORED_BUILDS.
  "@google/genai": false
  koffi: false
  msgpackr-extract: false
  openclaw: false
  protobufjs: false
  tree-sitter-bash: false

minimumReleaseAgeExclude:
  - '@qvac/asr-ggml@0.8.1'
  - '@qvac/bci-whispercpp@0.11.2'
  - '@qvac/fabric-android-arm64@0.21.1 || 0.22.0'
  - '@qvac/fabric-ios@0.21.1 || 0.22.0'
  - '@qvac/fabric-darwin-arm64@0.21.1 || 0.22.0'
  - '@qvac/fabric-darwin-x64@0.21.1 || 0.22.0'
  - '@qvac/fabric-linux-arm64@0.21.1 || 0.22.0'
  - '@qvac/fabric-linux-x64@0.21.1 || 0.22.0'
  - '@qvac/fabric-win32-x64@0.21.1 || 0.22.0'
  - '@qvac/fabric@0.21.1'
